name: Temporary Staging2 repair verification

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'ops/verify-staging2-theme-repair' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Configure SiteGround SSH
        env:
          SSH_HOST: ${{ secrets.STAGING2_SSH_HOST }}
          SSH_PORT_SECRET: ${{ secrets.STAGING2_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING2_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing STAGING2_SSH_HOST}"
          : "${SSH_USER:?Missing STAGING2_SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Missing STAGING2_SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing STAGING2_SSH_KNOWN_HOSTS}"
          SSH_PORT="${SSH_PORT_SECRET:-18765}"
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/siteground_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/siteground_key" "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host siteground-staging
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/siteground_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 15
          EOF
          chmod 600 "$HOME/.ssh/config"
      - name: Verify full theme parity, CSS delivery and origin rendering
        run: |
          set -euo pipefail
          mkdir -p evidence/site-root
          ssh siteground-staging 'cd /home/customer/www/staging2.nuvanx.com/public_html && wp plugin activate sg-cachepress && wp cache flush && wp sg purge'
          (cd wp-content/themes/nuvanx-medical && find . -type f -print0 | sort -z | xargs -0 sha256sum) > evidence/master-theme.sha256
          ssh siteground-staging "cd /home/customer/www/staging2.nuvanx.com/public_html/wp-content/themes/nuvanx-medical && find . -type f -print0 | sort -z | xargs -0 sha256sum" > evidence/staging2-theme.sha256
          grep -v '  \.\/.nvx-deploy-sha$' evidence/staging2-theme.sha256 > evidence/staging2-theme-normalized.sha256
          diff -u evidence/master-theme.sha256 evidence/staging2-theme-normalized.sha256
          ssh siteground-staging 'cd /home/customer/www/staging2.nuvanx.com/public_html && printf "SITEURL=%s HOME=%s THEME=%s\n" "$(wp option get siteurl)" "$(wp option get home)" "$(wp theme list --status=active --field=name)" && test -f wp-content/themes/nuvanx-medical/inc/nvx-document-governance.php && grep -Fq "nvx_document_governance_start();" wp-content/themes/nuvanx-medical/header.php && wp db check --quiet && wp plugin is-active sg-cachepress'
          ssh siteground-staging 'curl -ksS --resolve staging2.nuvanx.com:443:127.0.0.1 https://staging2.nuvanx.com/ -o /tmp/nvx-verified-home.html && python3 - <<"PY"
          import re
          s=open("/tmp/nvx-verified-home.html",encoding="utf8",errors="replace").read()
          styles=[x for x in re.findall(r"<link\\b[^>]*>",s,re.I) if re.search(r"rel=[\"\\\'][^\"\\\']*stylesheet",x,re.I)]
          print("HTML_BYTES="+str(len(s)))
          print("STYLESHEET_TAGS="+str(len(styles)))
          print("NVX_BASE="+str("nvx-base.css" in s))
          for x in styles: print(x)
          if len(styles)<5 or "nvx-base.css" not in s: raise SystemExit("CSS delivery still broken")
          PY'
          ssh siteground-staging 'rm -rf /tmp/nvx-verified-site-root && mkdir -p /tmp/nvx-verified-site-root/wp-content/themes/nuvanx-medical/assets && cp /tmp/nvx-verified-home.html /tmp/nvx-verified-site-root/index.html && cp -a /home/customer/www/staging2.nuvanx.com/public_html/wp-content/themes/nuvanx-medical/assets/css /tmp/nvx-verified-site-root/wp-content/themes/nuvanx-medical/assets/ && tar -czf /tmp/nvx-verified-origin.tgz -C /tmp/nvx-verified-site-root .'
          scp siteground-staging:/tmp/nvx-verified-origin.tgz evidence/verified-origin.tgz
          tar -xzf evidence/verified-origin.tgz -C evidence/site-root
          printf '%s\n' 'THEME_PARITY_OK' 'CSS_DELIVERY_OK' > evidence/status.txt
      - name: Verify computed styles desktop and mobile
        run: |
          set -euo pipefail
          npm install --no-save playwright-core@1.55.0
          test -x /usr/bin/chromium
          python3 -m http.server 8765 --directory evidence/site-root >/tmp/nvx-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node <<'NODE'
          const { chromium } = require('playwright-core');
          (async()=>{
            const b=await chromium.launch({headless:true,executablePath:'/usr/bin/chromium',args:['--no-sandbox']});
            for(const [name,viewport] of [['desktop',{width:1440,height:1000}],['mobile',{width:390,height:844}]]){
              const p=await b.newPage({viewport});
              const r=await p.goto('http://127.0.0.1:8765/',{waitUntil:'networkidle',timeout:60000});
              const x=await p.evaluate(()=>{const s=getComputedStyle(document.body),h=document.querySelector('h1');return {margin:s.margin,font:s.fontFamily,display:s.display,h1Font:h?getComputedStyle(h).fontFamily:null,h1Size:h?getComputedStyle(h).fontSize:null,css:[...document.querySelectorAll('link[rel~="stylesheet"]')].map(l=>({href:l.href,sheet:!!l.sheet,rules:l.sheet?(()=>{try{return l.sheet.cssRules.length}catch(e){return -1}})():0}))}});
              console.log(name,JSON.stringify({http:r?.status(),computed:x},null,2));
              await p.screenshot({path:`evidence/verified-${name}.png`,fullPage:true});
              if(!r||r.status()!==200) throw new Error(name+' HTTP failure');
              if(x.margin==='8px') throw new Error(name+' default body margin');
              if(x.font==='Times New Roman'||x.font==='serif') throw new Error(name+' default font');
              if(x.css.some(c=>!c.sheet||c.rules===0)) throw new Error(name+' stylesheet not parsed');
            }
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging2-repair-verification-${{ github.run_id }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
