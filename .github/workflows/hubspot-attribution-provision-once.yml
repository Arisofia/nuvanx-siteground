name: HubSpot Attribution Provision Once
run-name: HubSpot live form inventory · ${{ github.event.pull_request.head.sha }}

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  inventory:
    if: ${{ github.head_ref == 'ops/apply-hubspot-attribution-contract-20260820' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
    steps:
      - name: Check out exact same-repo candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Inventory canonical HubSpot form schema read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${HUBSPOT_ACCESS_TOKEN:?Missing HUBSPOT_ACCESS_TOKEN}"
          form_id='5042522a-0bc5-4381-ac3e-5aee8649b69c'
          out="$RUNNER_TEMP/form.json"
          status="$(curl -sS --max-time 30 -o "$out" -w '%{http_code}' \
            -H "Authorization: Bearer $HUBSPOT_ACCESS_TOKEN" \
            -H 'Accept: application/json' \
            "https://api.hubapi.com/marketing/v3/forms/$form_id")"
          [[ "$status" == '200' ]] || { echo "HUBSPOT_FORM_INVENTORY=FAIL status=$status" >&2; exit 1; }
          jq -r '[.fieldGroups[]?.fields[]? | {name,fieldType,hidden:(.hidden // false),required:(.required // false)}] | unique_by(.name) | sort_by(.name)[] | "HUBSPOT_FORM_FIELD name=\(.name) type=\(.fieldType) hidden=\(.hidden) required=\(.required)"' "$out"
          count="$(jq '[.fieldGroups[]?.fields[]?] | length' "$out")"
          max_group="$(jq '[.fieldGroups[]? | ((.fields // []) | length)] | max // 0' "$out")"
          echo "HUBSPOT_FORM_INVENTORY=PASS fields=$count max_group=$max_group form_id=$form_id"
