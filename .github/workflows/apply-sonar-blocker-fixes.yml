name: Apply Sonar Blocker Fixes

on:
  push:
    branches:
      - audit/repo-clean-20260808-1840
    paths:
      - .github/workflows/apply-sonar-blocker-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: audit/repo-clean-20260808-1840
          fetch-depth: 0
          persist-credentials: true

      - name: Apply targeted fixes
        run: python3 tools/audit/apply-sonar-blocker-fixes.py

      - name: Validate changed sources
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/production/indexnow-submit-sitemap.sh
          bash -n scripts/production/seo-geo-origin-audit.sh
          bash -n tools/deploy/deploy-to-prod.sh
          node --check scripts/staging2/valoracion-placement.mjs
          node --check scripts/staging2/block-c-52x3.mjs
          node --check scripts/production/verify-production-boundary.mjs
          node --check scripts/validate-page-templates.mjs
          node --check wp-content/themes/nuvanx-medical/assets/js/nvx-runtime-governance.js
          node --check wp-content/themes/nuvanx-medical/assets/js/nvx-conversion-events.js
          node --check scripts/lint/file-scan-utils.mjs
          node --check scripts/lint/validate-routes-schema.mjs
          node scripts/lint/validate-routes-schema.mjs wp-content/themes/nuvanx-medical/inc/data/routes.schema.json wp-content/themes/nuvanx-medical/inc/data/routes.json
          find wp-content/themes/nuvanx-medical -path '*/vendor' -prune -o -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null

      - name: Commit remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Nuvanx Engineering'
          git config user.email 'admin@nuvanx.com'
          git add . ':!.github/workflows/apply-sonar-blocker-fixes.yml' ':!tools/audit/apply-sonar-blocker-fixes.py' ':!.github/workflows/audit-sonar-master.yml'
          git diff --cached --check
          git diff --cached --quiet && { echo 'No remediation changes produced'; exit 1; }
          git commit -m 'fix(quality): resolve Sonar security reliability and duplication blockers'
          git push origin HEAD:audit/repo-clean-20260808-1840
