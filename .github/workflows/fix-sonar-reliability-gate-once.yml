name: Fix Sonar reliability gate once

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/fix-sonar-reliability-gate-once.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'refactor/sonar-duplication-20260731'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/sonar-duplication-20260731
          fetch-depth: 0

      - name: Fix definition-list semantics and duplicate selector
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          template = Path('wp-content/themes/nuvanx-medical/template-parts/content/nvx-soluciones-medicas-github.php')
          source = template.read_text(encoding='utf-8')
          old = """\t\t\t\t<dl>
          \t\t\t\t\t<div><dt>Qué se valora</dt><dd><?php echo esc_html( $solution['question'] ); ?></dd></div>
          \t\t\t\t\t<div><dt>Límites</dt><dd><?php echo esc_html( $solution['limit'] ); ?></dd></div>
          \t\t\t\t</dl>
          """
          new = """\t\t\t\t<dl>
          \t\t\t\t\t<dt>Qué se valora</dt>
          \t\t\t\t\t<dd><?php echo esc_html( $solution['question'] ); ?></dd>
          \t\t\t\t\t<dt>Límites</dt>
          \t\t\t\t\t<dd><?php echo esc_html( $solution['limit'] ); ?></dd>
          \t\t\t\t</dl>
          """
          if source.count(old) != 1:
              raise SystemExit(f'expected one definition-list block, found {source.count(old)}')
          template.write_text(source.replace(old, new, 1), encoding='utf-8')

          stylesheet = Path('wp-content/themes/nuvanx-medical/assets/css/nvx-soluciones-medicas.css')
          css = stylesheet.read_text(encoding='utf-8')
          first = """.nvx-solutions-button {
            display: inline-flex;
            min-height: var(--nvx-touch-target-min);
            align-items: center;
            justify-content: center;
            font-size: var(--nvx-type-button);
            font-weight: var(--nvx-fw-bold);
            letter-spacing: var(--nvx-track-button);
            text-decoration: none;
            text-transform: uppercase;
          }

          .nvx-solutions-button {
            padding-inline: var(--nvx-space-4);
            border: var(--nvx-border-hairline) solid var(--nvx-ink);
            border-radius: var(--nvx-radius-button);
          }
          """
          merged = """.nvx-solutions-button {
            display: inline-flex;
            min-height: var(--nvx-touch-target-min);
            align-items: center;
            justify-content: center;
            padding-inline: var(--nvx-space-4);
            border: var(--nvx-border-hairline) solid var(--nvx-ink);
            border-radius: var(--nvx-radius-button);
            font-size: var(--nvx-type-button);
            font-weight: var(--nvx-fw-bold);
            letter-spacing: var(--nvx-track-button);
            text-decoration: none;
            text-transform: uppercase;
          }
          """
          if css.count(first) != 1:
              raise SystemExit(f'expected one duplicate button selector pair, found {css.count(first)}')
          css = css.replace(first, merged, 1)

          old_spacing = """.nvx-solutions-card dl > div + div {
            margin-top: var(--nvx-space-4);
            padding-top: var(--nvx-space-3);
            border-top: var(--nvx-border-hairline) solid var(--nvx-color-line);
          }

          .nvx-solutions-group--dark .nvx-solutions-card dl > div + div {
            border-top-color: var(--nvx-accent-line-dark);
          }
          """
          new_spacing = """.nvx-solutions-card dd + dt {
            margin-top: var(--nvx-space-4);
            padding-top: var(--nvx-space-3);
            border-top: var(--nvx-border-hairline) solid var(--nvx-color-line);
          }

          .nvx-solutions-group--dark .nvx-solutions-card dd + dt {
            border-top-color: var(--nvx-accent-line-dark);
          }
          """
          if css.count(old_spacing) != 1:
              raise SystemExit(f'expected one definition-list spacing block, found {css.count(old_spacing)}')
          stylesheet.write_text(css.replace(old_spacing, new_spacing, 1), encoding='utf-8')
          PY

      - name: Validate reliability fix
        shell: bash
        run: |
          set -euo pipefail
          php -l wp-content/themes/nuvanx-medical/template-parts/content/nvx-soluciones-medicas-github.php
          node scripts/theme-hygiene/test-theme-hygiene.mjs
          php scripts/theme-hygiene/test-nvx-callable-contract.php
          node scripts/staging2/test-deploy-workflow-contract.mjs
          grep -Fq '<dt>Qué se valora</dt>' wp-content/themes/nuvanx-medical/template-parts/content/nvx-soluciones-medicas-github.php
          grep -Fq '.nvx-solutions-card dd + dt' wp-content/themes/nuvanx-medical/assets/css/nvx-soluciones-medicas.css
          test "$(grep -Fc '.nvx-solutions-button {' wp-content/themes/nuvanx-medical/assets/css/nvx-soluciones-medicas.css)" -eq 1
          git diff --check

      - name: Commit and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-sonar-reliability-gate-once.yml
          rm -f .github/workflows/sonar-health-audit-once.yml
          git config user.name 'NUVANX Quality Bot'
          git config user.email 'quality@nuvanx.com'
          git add wp-content/themes/nuvanx-medical/template-parts/content/nvx-soluciones-medicas-github.php \
            wp-content/themes/nuvanx-medical/assets/css/nvx-soluciones-medicas.css \
            .github/workflows
          git diff --cached --check
          git commit -m 'fix(quality): restore Sonar reliability rating'
          git push origin HEAD:refactor/sonar-duplication-20260731
