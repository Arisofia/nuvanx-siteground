name: Repository Hygiene

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  hygiene:
    name: Prevent transient, generated and self-mutating repository state
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject transient one-shot files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t transient < <(git ls-files | grep -E '(-(once|temp)\.(yml|yaml|sh|mjs)$)|(^|/)(tmp|temp)[_-]' || true)
          if (( ${#transient[@]} > 0 && ${#transient[0]} > 0 )); then
            echo 'Transient one-shot files are not allowed on persistent branches:' >&2
            printf '  %s\n' "${transient[@]}" >&2
            exit 1
          fi
          echo 'REPOSITORY_TRANSIENT_GATE=PASS'

      - name: Reject workflow self-mutation
        shell: bash
        run: |
          set -euo pipefail
          offenders=()
          while IFS= read -r file; do
            if grep -Eq '(^|[[:space:]])git[[:space:]]+push([[:space:]]|$)' "$file"; then
              offenders+=("$file")
            fi
          done < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print | sort)
          if (( ${#offenders[@]} > 0 )); then
            echo 'GitHub Actions workflows must not push repository mutations themselves:' >&2
            printf '  %s\n' "${offenders[@]}" >&2
            exit 1
          fi
          echo 'WORKFLOW_SELF_MUTATION_GATE=PASS'

      - name: Reject tracked generated or local debris
        shell: bash
        run: |
          set -euo pipefail
          forbidden_exact=(
            'DEPLOY_TRIGGER.txt'
            'composer.phar'
            'wp-content/themes/nuvanx-medical/composer.phar'
          )
          forbidden_prefixes=(
            '.vscode/'
            'audit/'
            '.github/audit/'
            'wp-content/themes/nuvanx-medical/vendor/'
          )
          failures=()
          for file in "${forbidden_exact[@]}"; do
            git ls-files --error-unmatch "$file" >/dev/null 2>&1 && failures+=("$file") || true
          done
          tracked="$(git ls-files)"
          for prefix in "${forbidden_prefixes[@]}"; do
            if printf '%s\n' "$tracked" | grep -Fq "$prefix"; then failures+=("$prefix"); fi
          done
          if (( ${#failures[@]} > 0 )); then
            echo 'Generated/local debris is tracked:' >&2
            printf '  %s\n' "${failures[@]}" >&2
            exit 1
          fi
          echo 'REPOSITORY_DEBRIS_GATE=PASS'

      - name: Reject empty and editor residue files
        shell: bash
        run: |
          set -euo pipefail
          empty=()
          residue=()
          while IFS= read -r file; do
            [[ -f "$file" && ! -s "$file" ]] && empty+=("$file")
            case "$file" in
              *.orig|*.rej|*.bak|*.tmp|*.swp|*~|*/.DS_Store|.DS_Store) residue+=("$file") ;;
            esac
          done < <(git ls-files)
          if (( ${#empty[@]} > 0 )); then
            echo 'Empty tracked files are not allowed:' >&2
            printf '  %s\n' "${empty[@]}" >&2
            exit 1
          fi
          if (( ${#residue[@]} > 0 )); then
            echo 'Editor/patch residue is tracked:' >&2
            printf '  %s\n' "${residue[@]}" >&2
            exit 1
          fi
          echo 'REPOSITORY_EMPTY_RESIDUE_GATE=PASS'

  historical-secret-scan:
    name: Gitleaks full-history scan
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out full Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks v3 with canonical custom configuration
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .github/gitleaks-config.yml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - name: Enforce full-history scan with the installed Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          command -v gitleaks >/dev/null
          gitleaks detect \
            --config .github/gitleaks-config.yml \
            --redact \
            --verbose \
            --exit-code=2 \
            --report-format=json \
            --report-path=gitleaks-full-history.json
          echo 'GITLEAKS_FULL_HISTORY=PASS'
