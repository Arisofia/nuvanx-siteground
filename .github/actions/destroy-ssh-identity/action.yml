name: Destroy SSH identity
description: >-
  Securely shred the staging2 SSH private key, config and known_hosts written to
  the runner's ~/.ssh, falling back to rm -f when shred is unavailable.

runs:
  using: composite
  steps:
    - name: Securely destroy SSH identity
      shell: bash
      run: |
        shred -u "$HOME/.ssh/staging2_key" "$HOME/.ssh/config" "$HOME/.ssh/known_hosts" 2>/dev/null || rm -f "$HOME/.ssh/staging2_key" "$HOME/.ssh/config" "$HOME/.ssh/known_hosts"
