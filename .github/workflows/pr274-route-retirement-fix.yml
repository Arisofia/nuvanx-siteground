name: PR274 route retirement fix

on:
  push:
    branches:
      - fix/remove-redirect-exceptions-and-retire-legacy-routes

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out corrective branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/remove-redirect-exceptions-and-retire-legacy-routes
          fetch-depth: 0
          persist-credentials: false

      - name: Apply redirect-retirement corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, content):
              Path(path).write_text(content, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          # 1. Full-site audit: no redirect allowlist and exact pathname only.
          audit_path = 'scripts/staging2/audit-full-site-ui.mjs'
          audit = read(audit_path)
          audit, count = re.subn(
              r"\n/\*\*\n \* Explicit allowlist for intentional internal redirects only\.[\s\S]*?const authorizedRedirects = new Map\(\[[\s\S]*?\]\);\n",
              '\n',
              audit,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'audit allowlist removal: expected 1 match, found {count}')
          audit = replace_once(
              audit,
              "  const redirected = requested !== finalPath;\n  if (redirected) {\n    const allowedTarget = authorizedRedirects.get(requested);\n    if (allowedTarget !== finalPath) {\n      throw new Error(`Unexpected internal redirect ${requested} -> ${finalPath}`);\n    }\n  }\n",
              "  const redirected = requested !== finalPath;\n  if (redirected) {\n    throw new Error(`Unexpected internal redirect ${requested} -> ${finalPath}`);\n  }\n",
              'audit exact pathname assertion',
          )
          if 'authorizedRedirects' in audit:
              raise SystemExit('audit still contains authorizedRedirects')
          write(audit_path, audit)

          # 2. Remove cookie redirect callback from page hygiene.
          hygiene_path = 'wp-content/themes/nuvanx-medical/inc/nvx-page-hygiene.php'
          hygiene = read(hygiene_path)
          hygiene = hygiene.replace(
              ' * - Redirect superseded cookie documents to the Complianz EU statement.\n',
              ' * - Keep superseded legal documents out of public routing.\n',
              1,
          )
          hygiene, count = re.subn(
              r"\n/\*\*\n \* Redirect superseded cookie documents to the Complianz EU statement \(page 577\)\.\n \*/\nfunction nvx_redirect_superseded_legal_pages\(\) \{[\s\S]*?\n\}\nadd_action\( 'template_redirect', 'nvx_redirect_superseded_legal_pages', 1 \);\n",
              '\n',
              hygiene,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'cookie redirect removal: expected 1 match, found {count}')
          write(hygiene_path, hygiene)

          # 3. Remove privacy and governed route redirects from integrations.
          integrations_path = 'wp-content/themes/nuvanx-medical/inc/nvx-integrations.php'
          integrations = read(integrations_path)
          integrations = replace_once(
              integrations,
              " * Returns the governed retired/deferred-page contract shared by runtime\n * redirects and the production-readiness migration.\n",
              " * Returns the governed retired/deferred-page contract used by the\n * production-readiness migration and repository audits.\n",
              'governed contract comment',
          )
          privacy_block = """/** Canonical privacy route. */
          add_action(
              'template_redirect',
              function () {
                  if ( is_admin() ) {
                      return;
                  }
                  $path = isset( $_SERVER['REQUEST_URI'] ) ? strtok( (string) $_SERVER['REQUEST_URI'], '?' ) : '';
                  $norm = '/' . trim( $path, '/' ) . '/';
                  if ( '/politica-de-privacidad/' === $norm ) {
                      wp_safe_redirect( home_url( '/politica-privacidad/' ), 301 );
                      exit;
                  }
              },
              1
          );

          """
          integrations = replace_once(integrations, privacy_block, '', 'privacy redirect block')
          governed_block = """/** Redirects retired or deferred routes by request path. */
          function nvx_redirect_governed_routes(): void {
              if ( is_admin() ) {
                  return;
              }

              $request_path = isset( $_SERVER['REQUEST_URI'] )
                  ? (string) wp_parse_url( (string) $_SERVER['REQUEST_URI'], PHP_URL_PATH )
                  : '';
              $normalized = trim( $request_path, '/' );
              $redirects  = array(
                  'tratamiento-retirado' => '/tratamientos/',
              );

              foreach ( nvx_production_readiness_governed_pages() as $slug => $definition ) {
                  $redirects[ $slug ] = $definition['target'];
              }

              if ( isset( $redirects[ $normalized ] ) ) {
                  wp_safe_redirect( home_url( $redirects[ $normalized ] ), 301, 'NUVANX' );
                  exit;
              }
          }
          add_action( 'template_redirect', 'nvx_redirect_governed_routes', 1 );

          """
          integrations = replace_once(integrations, governed_block, '', 'governed redirect block')
          write(integrations_path, integrations)

          # 4. Smoke test: retired routes must return 404/410 without Location.
          smoke_path = 'scripts/staging2/smoke-verify-staging2.sh'
          smoke = read(smoke_path)
          smoke = smoke.replace(
              '# READ-ONLY: verify canonical NUVANX editorial routes and retired redirects.',
              '# READ-ONLY: verify canonical NUVANX editorial routes and retired legacy URLs.',
              1,
          )
          smoke, count = re.subn(
              r"# check_redirect verifies that a source path redirects directly to the expected target path with HTTP 301\.[\s\S]*?^}\n\n# Allow the edge cache",
              """# check_retired_route verifies that a legacy path is unavailable and emits no redirect.
          check_retired_route() {
            local source_path="$1"
            local safe_slug headers_file status location attempt
            safe_slug="$(echo "$source_path" | tr '/-' '__')"
            headers_file="$TMP_DIR/headers-${safe_slug}.txt"
            status='000'
            for attempt in 1 2 3 4; do
              : > "$headers_file"
              status="$(curl "${CURL_COMMON_ARGS[@]}" --max-redirs 0 --output /dev/null --dump-header "$headers_file" --write-out '%{http_code}' "$BASE_URL$source_path")"
              if [[ "$status" == '404' || "$status" == '410' ]]; then
                break
              fi
              if [[ "$status" != '202' && "$status" != '429' && ! "$status" =~ ^5[0-9][0-9]$ ]]; then
                break
              fi
              if [[ "$attempt" -lt 4 ]]; then sleep $(( attempt * 2 )); fi
            done
            [[ "$status" == '404' || "$status" == '410' ]] || fail "$source_path returned HTTP $status instead of 404/410 after $attempt attempt(s)"
            location="$(grep -i '^location:' "$headers_file" | tail -n 1 | cut -d: -f2- | tr -d '\r' | xargs || true)"
            [[ -z "$location" ]] || fail "$source_path emitted forbidden Location header: $location"
            echo "PASS retired $source_path status=$status attempts=$attempt"
          }

          # check_target_page verifies that a retained final target remains publicly available.
          check_target_page() {
            local target_path="$1"
            local status attempt
            status='000'
            for attempt in 1 2 3 4; do
              status="$(curl "${CURL_COMMON_ARGS[@]}" --output /dev/null --write-out '%{http_code}' "$BASE_URL$target_path")"
              if [[ "$status" == '200' ]]; then break; fi
              if [[ "$status" != '202' && "$status" != '429' && ! "$status" =~ ^5[0-9][0-9]$ ]]; then break; fi
              if [[ "$attempt" -lt 4 ]]; then sleep $(( attempt * 2 )); fi
            done
            [[ "$status" == '200' ]] || fail "$target_path returned HTTP $status instead of 200 after $attempt attempt(s)"
            echo "PASS retained target $target_path status=200 attempts=$attempt"
          }

          # Allow the edge cache""",
              smoke,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit(f'smoke redirect helper replacement: expected 1 match, found {count}')
          first_redirect = "check_redirect '/tratamientos/' '/soluciones-medicas/'\n"
          retirement_checks = """for legacy_path in \\
            '/mas-informacion-sobre-las-cookies/' \\
            '/politica-de-cookies/' \\
            '/politica-de-privacidad/' \\
            '/tratamiento-retirado/' \\
            '/tratamientos/' \\
            '/liposculpt-air/' \\
            '/v-lift-awake/' \\
            '/dr-javier-rivera-tejeda/' \\
            '/eye-frame-rejuvenecimiento-mirada-madrid/' \\
            '/eye-frame/'
          do
            check_retired_route "$legacy_path"
          done

          for target_path in \\
            '/politica-de-cookies-ue/' \\
            '/politica-privacidad/' \\
            '/soluciones-medicas/' \\
            '/remodelacion-corporal-laser-madrid/' \\
            '/protocolos-signature/' \\
            '/equipo-medico/' \\
            '/ojeras-surco-lagrimal-madrid/'
          do
            check_target_page "$target_path"
          done
          echo 'LEGACY_ROUTES_RETIRED_OK'
          """
          smoke = replace_once(smoke, first_redirect, retirement_checks, 'first redirect call')
          smoke = smoke.replace("check_redirect '/liposculpt-air/' '/remodelacion-corporal-laser-madrid/'\n", '', 1)
          smoke = smoke.replace("check_redirect '/v-lift-awake/' '/protocolos-signature/'\n", '', 1)
          if 'check_redirect' in smoke:
              raise SystemExit('smoke still contains check_redirect')
          write(smoke_path, smoke)

          # 5. Deploy script command and terminology.
          deploy_script_path = 'tools/deploy/deploy-to-staging2.sh'
          deploy_script = read(deploy_script_path)
          replacements = {
              'Audit canonical legacy routes before migration': 'Audit legacy route retirement before migration',
              'Apply canonical legacy route migration': 'Apply legacy route retirement',
              'Audit canonical legacy routes after migration': 'Audit legacy route retirement after migration',
              'nvx canonical-routes audit --allow-pending': 'nvx legacy-routes audit --allow-pending',
              'nvx canonical-routes apply --confirm=canonicalize-legacy-routes': 'nvx legacy-routes apply --confirm=retire-legacy-routes',
              'nvx canonical-routes audit': 'nvx legacy-routes audit',
          }
          for old, new in replacements.items():
              if old not in deploy_script:
                  raise SystemExit(f'deploy script missing expected marker: {old}')
              deploy_script = deploy_script.replace(old, new, 1)
          write(deploy_script_path, deploy_script)

          # 6. Deploy workflow messages.
          deploy_workflow_path = '.github/workflows/deploy-staging2.yml'
          deploy_workflow = read(deploy_workflow_path)
          deploy_workflow = replace_once(deploy_workflow, "grep -Fq 'Canonical route migration applied.'", "grep -Fq 'Legacy route retirement applied.'", 'workflow apply grep')
          deploy_workflow = replace_once(deploy_workflow, "grep -Fq 'Canonical route audit passed.'", "grep -Fq 'Legacy route retirement audit passed.'", 'workflow audit grep')
          deploy_workflow = deploy_workflow.replace('- Canonical migration:', '- Legacy route retirement:', 1)
          write(deploy_workflow_path, deploy_workflow)

          # 7. Align pull_request.paths exactly between deploy and audit workflows.
          audit_workflow_path = '.github/workflows/full-site-ui-audit.yml'
          audit_workflow = read(audit_workflow_path)
          path_pattern = re.compile(r'(?ms)^  pull_request:\n.*?^    paths:\n(?P<paths>(?:^      - .+\n)+)')
          deploy_match = path_pattern.search(deploy_workflow)
          audit_match = path_pattern.search(audit_workflow)
          if not deploy_match or not audit_match:
              raise SystemExit('unable to parse pull_request.paths from workflows')
          deploy_paths = deploy_match.group('paths')
          audit_workflow = audit_workflow[:audit_match.start('paths')] + deploy_paths + audit_workflow[audit_match.end('paths'):]
          write(audit_workflow_path, audit_workflow)

          # 8. Tighten deployment contract test.
          contract_path = 'scripts/staging2/test-deploy-workflow-contract.mjs'
          contract = read(contract_path)
          contract = replace_once(
              contract,
              "const migration = read('scripts/wp/nvx-production-readiness-command.php');\n",
              "const migration = read('scripts/wp/nvx-production-readiness-command.php');\nconst legacyMigration = read('scripts/wp/nvx-canonical-route-migration.php');\nconst auditWorkflow = read('.github/workflows/full-site-ui-audit.yml');\nconst fullSiteAudit = read('scripts/staging2/audit-full-site-ui.mjs');\nconst pageHygiene = read('wp-content/themes/nuvanx-medical/inc/nvx-page-hygiene.php');\n",
              'contract source reads',
          )
          contract = replace_once(
              contract,
              "  'scripts/staging2/visual-qa-common.mjs',\n",
              "  'scripts/staging2/visual-qa-common.mjs',\n  'scripts/wp/nvx-canonical-route-migration.php',\n  'Legacy route retirement applied.', 'Legacy route retirement audit passed.',\n",
              'workflow retirement markers',
          )
          contract = replace_once(
              contract,
              "  '--migration-script', '--smoke-script', 'wp db export', 'wp db import',\n",
              "  '--migration-script', '--canonical-migration-script', '--smoke-script', 'wp db export', 'wp db import',\n",
              'deploy arguments',
          )
          contract = replace_once(
              contract,
              "  'nvx production-readiness apply --confirm=retire-prototypes',\n",
              "  'nvx production-readiness apply --confirm=retire-prototypes',\n  'nvx legacy-routes audit --allow-pending',\n  'nvx legacy-routes apply --confirm=retire-legacy-routes',\n  'nvx legacy-routes audit',\n",
              'deploy legacy commands',
          )
          old_smoke_markers = """for (const marker of [
            "check_redirect '/tratamientos/' '/soluciones-medicas/'",
            "fetch_page '/soluciones-medicas/'", "fetch_page '/protocolos-signature/'",
            "fetch_page '/remodelacion-corporal-laser-madrid/'",
            "fetch_page '/tratamiento-postparto-abdomen-contorno-corporal-madrid/'",
            "check_redirect '/liposculpt-air/'", "check_redirect '/v-lift-awake/' '/protocolos-signature/'",
            'SMOKE_VERIFY_OK',
          ]) if (!smoke.includes(marker)) fail(`smoke script missing contract marker: ${marker}`);
          """
          new_smoke_markers = """for (const marker of [
            'check_retired_route', 'check_target_page', 'LEGACY_ROUTES_RETIRED_OK',
            '/mas-informacion-sobre-las-cookies/', '/politica-de-cookies/', '/politica-de-privacidad/',
            '/tratamiento-retirado/', '/tratamientos/', '/liposculpt-air/', '/v-lift-awake/',
            '/dr-javier-rivera-tejeda/', '/eye-frame-rejuvenecimiento-mirada-madrid/', '/eye-frame/',
            "fetch_page '/soluciones-medicas/'", "fetch_page '/protocolos-signature/'",
            "fetch_page '/remodelacion-corporal-laser-madrid/'",
            "fetch_page '/tratamiento-postparto-abdomen-contorno-corporal-madrid/'",
            'SMOKE_VERIFY_OK',
          ]) if (!smoke.includes(marker)) fail(`smoke script missing contract marker: ${marker}`);
          """
          contract = replace_once(contract, old_smoke_markers, new_smoke_markers, 'smoke contract markers')
          contract = contract.replace('governed redirects missing marker:', 'governed route contract missing marker:', 1)
          contract = replace_once(
              contract,
              "const bootstrapSources = `${functions}\\n${integrations}`;\n",
              """const extractPullRequestPaths = (yaml) => {
            const match = yaml.match(/(?:^|\\n)  pull_request:\\n[\\s\\S]*?\\n    paths:\\n((?:      - .+\\n)+)/);
            if (!match) return [];
            return match[1].trim().split('\\n').map((line) => line.replace(/^\\s*-\\s*/, ''));
          };
          const deployPaths = extractPullRequestPaths(workflow);
          const auditPaths = extractPullRequestPaths(auditWorkflow);
          if (JSON.stringify(deployPaths) !== JSON.stringify(auditPaths)) fail('deploy and audit pull_request.paths are not aligned');
          if (fullSiteAudit.includes('authorizedRedirects')) fail('full-site audit retains a redirect allowlist');
          for (const [name, source] of [['page hygiene', pageHygiene], ['integrations', integrations]]) {
            if (source.includes('wp_safe_redirect')) fail(`${name} retains a manual redirect`);
          }
          if (legacyMigration.includes('add_post_meta') && legacyMigration.includes('_wp_old_slug')) fail('legacy migration creates old-slug redirects');
          for (const marker of [
            "WP_CLI::add_command( 'nvx legacy-routes'", 'Legacy route retirement applied.',
            'Legacy route retirement audit passed.', "'_wp_old_slug'", 'wp_trash_post',
          ]) if (!legacyMigration.includes(marker)) fail(`legacy migration missing marker: ${marker}`);

          const bootstrapSources = `${functions}\\n${integrations}`;
          """,
              'contract policy assertions',
          )
          contract = replace_once(
              contract,
              "  'scripts/staging2/test-deploy-workflow-contract.mjs',\n",
              "  'scripts/staging2/test-deploy-workflow-contract.mjs',\n  'scripts/staging2/audit-full-site-ui.mjs',\n",
              'node syntax list',
          )
          contract = replace_once(
              contract,
              "  'scripts/wp/nvx-production-readiness-command.php',\n",
              "  'scripts/wp/nvx-production-readiness-command.php',\n  'scripts/wp/nvx-canonical-route-migration.php',\n",
              'php migration lint list',
          )
          contract = replace_once(
              contract,
              "  'wp-content/themes/nuvanx-medical/inc/nvx-integrations.php',\n",
              "  'wp-content/themes/nuvanx-medical/inc/nvx-integrations.php',\n  'wp-content/themes/nuvanx-medical/inc/nvx-page-hygiene.php',\n",
              'php hygiene lint list',
          )
          write(contract_path, contract)
          PY

      - name: Validate corrected tree
        run: |
          set -euo pipefail
          node --check scripts/staging2/audit-full-site-ui.mjs
          node --check scripts/staging2/test-deploy-workflow-contract.mjs
          php -l scripts/wp/nvx-canonical-route-migration.php
          php -l wp-content/themes/nuvanx-medical/inc/nvx-page-hygiene.php
          php -l wp-content/themes/nuvanx-medical/inc/nvx-integrations.php
          bash -n scripts/staging2/smoke-verify-staging2.sh
          bash -n tools/deploy/deploy-to-staging2.sh
          node scripts/staging2/test-deploy-workflow-contract.mjs
          node scripts/theme-hygiene/test-theme-hygiene.mjs

      - name: Commit validated corrections and remove temporary workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr274-route-retirement-fix.yml
          git add -A
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(routes): remove redirect exceptions and validate retirement'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:fix/remove-redirect-exceptions-and-retire-legacy-routes
