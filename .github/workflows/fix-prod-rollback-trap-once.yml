name: Fix Prod Rollback Trap Once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/fix-prod-rollback-trap-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
          fetch-depth: 0
      - name: Prevent inherited ERR trap from double rollback
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/deploy/deploy-to-prod.sh')
          s = p.read_text()
          replacements = {
              'echo "== Verify exact production release on disk =="\n(\n  cd "$PROD_ROOT"': 'echo "== Verify exact production release on disk =="\n(\n  trap - ERR\n  cd "$PROD_ROOT"',
              'echo "== Purge production caches =="\n(\n  cd "$PROD_ROOT"': 'echo "== Purge production caches =="\n(\n  trap - ERR\n  cd "$PROD_ROOT"',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected pattern: {old!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          bash -n tools/deploy/deploy-to-prod.sh
          grep -A4 -F '== Verify exact production release on disk ==' tools/deploy/deploy-to-prod.sh
          grep -A4 -F '== Purge production caches ==' tools/deploy/deploy-to-prod.sh
          git diff --check
          git add tools/deploy/deploy-to-prod.sh
          git config user.name 'NUVANX Ops'
          git config user.email 'ops@nuvanx.invalid'
          git commit -m 'fix(prod): prevent duplicate rollback trap execution'
          git push origin HEAD:master
