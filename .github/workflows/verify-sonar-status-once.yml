name: Verify Sonar status once

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/verify-sonar-status-once.yml'

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'refactor/sonar-duplication-20260731'
    runs-on: ubuntu-24.04
    steps:
      - name: Read public SonarQube Cloud status
        shell: bash
        run: |
          set -euo pipefail
          project='Arisofia_nuvanx-siteground'
          base='https://sonarcloud.io/api'
          curl --fail --silent --show-error --retry 4 --retry-all-errors \
            "$base/qualitygates/project_status?projectKey=$project" > gate.json
          curl --fail --silent --show-error --retry 4 --retry-all-errors \
            "$base/measures/component?component=$project&metricKeys=alert_status,bugs,code_smells,duplicated_lines_density,duplicated_lines,coverage,ncloc" > measures.json
          curl --fail --silent --show-error --retry 4 --retry-all-errors \
            "$base/issues/search?componentKeys=$project&resolved=false&ps=1&p=1" > issues.json
          python3 - <<'PY'
          import json

          gate = json.load(open('gate.json', encoding='utf-8'))['projectStatus']
          measures_payload = json.load(open('measures.json', encoding='utf-8'))['component']
          issues = json.load(open('issues.json', encoding='utf-8'))
          measures = {item['metric']: item.get('value') for item in measures_payload.get('measures', [])}
          print('SONAR_STATUS=' + gate.get('status', 'UNKNOWN'))
          print('SONAR_ANALYSIS_DATE=' + measures_payload.get('analysisDate', 'UNKNOWN'))
          print('SONAR_OPEN_ISSUES=' + str(issues.get('total', 'UNKNOWN')))
          for key in ('alert_status', 'bugs', 'code_smells', 'duplicated_lines_density', 'duplicated_lines', 'coverage', 'ncloc'):
              print(f'SONAR_{key.upper()}={measures.get(key, "NO_DATA")}')
          for condition in gate.get('conditions', []):
              print('SONAR_CONDITION=' + json.dumps(condition, ensure_ascii=False, sort_keys=True))
          PY
