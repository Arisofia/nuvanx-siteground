name: Staging2 Redirect Owner Diagnose

on:
  push:
    paths:
      - '.github/workflows/staging2-redirect-owner-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_ROOT: /home/customer/www/staging2.nuvanx.com/public_html
      PROD_ROOT: /home/customer/www/nuvanx.com/public_html
    steps:
      - name: Configure SSH
        shell: bash
        env:
          HOST: ${{ secrets.STAGING2_SSH_HOST }}
          PORT: ${{ secrets.STAGING2_SSH_PORT }}
          USER: ${{ secrets.STAGING2_SSH_USER }}
          KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${HOST:?}"; : "${USER:?}"; : "${KEY:?}"; : "${KH:?}"
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/k; chmod 600 ~/.ssh/k
          printf '%s\n' "$KH" > ~/.ssh/known_hosts; chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host nvx
            HostName $HOST
            User $USER
            Port ${PORT:-18765}
            IdentityFile ~/.ssh/k
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

      - name: Diagnose redirect source
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx "STAGING_ROOT='$STAGING_ROOT' PROD_ROOT='$PROD_ROOT' bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$STAGING_ROOT"
          echo '=== WordPress URL resolution ==='
          for c in WP_HOME WP_SITEURL RELOCATE DOMAIN_CURRENT_SITE; do
            v="$(wp config get "$c" 2>/dev/null || true)"
            echo "$c=${v:-UNSET}"
          done
          echo "db_home=$(wp db query \"SELECT option_value FROM $(wp db prefix)options WHERE option_name='home' LIMIT 1\" --skip-column-names)"
          echo "db_siteurl=$(wp db query \"SELECT option_value FROM $(wp db prefix)options WHERE option_name='siteurl' LIMIT 1\" --skip-column-names)"
          echo "get_option_home=$(wp eval 'echo get_option("home");')"
          echo "get_option_siteurl=$(wp eval 'echo get_option("siteurl");')"
          echo "home_url=$(wp eval 'echo home_url("/");')"
          echo "site_url=$(wp eval 'echo site_url("/");')"

          echo '=== drop-ins / MU plugins ==='
          wp plugin list --status=dropin --fields=name,status --format=csv 2>/dev/null || true
          wp plugin list --status=must-use --fields=name,status --format=csv 2>/dev/null || true

          echo '=== htaccess redirect/rewrite lines ==='
          grep -nEi 'redirect|rewrite(cond|rule)|nuvanx\.com|staging2' "$STAGING_ROOT/.htaccess" 2>/dev/null | head -n 120 || true

          echo '=== public vhost root identity probe ==='
          token="nvx-staging-root-$RANDOM-$RANDOM"
          probe="$STAGING_ROOT/.well-known-$token.txt"
          printf 'STAGING_ROOT_PROBE:%s\n' "$token" > "$probe"
          trap 'rm -f "$probe"' EXIT
          test ! -e "$PROD_ROOT/.well-known-$token.txt" || { echo 'FAIL token collision'; exit 1; }
          echo "probe_token=$token"
          echo 'staging-domain-probe:'
          curl -sS -D /tmp/h -o /tmp/b "https://staging2.nuvanx.com/.well-known-$token.txt" -w 'status=%{http_code} final=%{url_effective} size=%{size_download}\n' || true
          grep -Ei '^(HTTP/|location:|server:|sg-captcha:|x-redirect-by:|x-robots-tag:)' /tmp/h || true
          printf 'body='; cat /tmp/b 2>/dev/null | head -c 200; echo
          echo 'production-domain-same-probe:'
          curl -sS -D /tmp/h2 -o /tmp/b2 "https://nuvanx.com/.well-known-$token.txt" -w 'status=%{http_code} final=%{url_effective} size=%{size_download}\n' || true
          grep -Ei '^(HTTP/|location:|server:|sg-captcha:|x-redirect-by:|x-robots-tag:)' /tmp/h2 || true
          printf 'body='; cat /tmp/b2 2>/dev/null | head -c 200; echo
          rm -f /tmp/h /tmp/b /tmp/h2 /tmp/b2
          REMOTE

      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/k ~/.ssh/config ~/.ssh/known_hosts
