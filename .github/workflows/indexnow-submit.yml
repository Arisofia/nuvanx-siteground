name: IndexNow Submit Production Sitemap

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/indexnow-submit.yml'
      - 'scripts/production/indexnow-submit-sitemap.sh'
  workflow_run:
    workflows:
      - Production Release
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: indexnow-production-submit
  cancel-in-progress: false

jobs:
  submit:
    name: Submit production sitemap URLs to IndexNow
    if: ${{ github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'release/production') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROD_ROOT: /home/customer/www/nuvanx.com/public_html
      BASE_URL: https://nuvanx.com
      EXPECTED_HOST: nuvanx.com
      INDEXNOW_KEY: 53546cf8077aa596b76aac664739bbb4
    steps:
      - name: Check out canonical IndexNow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Validate submitter syntax
        shell: bash
        run: bash -n scripts/production/indexnow-submit-sitemap.sh

      - name: Configure strict production SSH authentication
        shell: bash
        env:
          HOST: ${{ secrets.PROD_SSH_HOST }}
          PORT: ${{ secrets.PROD_SSH_PORT }}
          USER: ${{ secrets.PROD_SSH_USER }}
          KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${HOST:?Missing PROD_SSH_HOST}"
          : "${USER:?Missing PROD_SSH_USER}"
          : "${KEY:?Missing PROD_SSH_PRIVATE_KEY}"
          : "${KH:?Missing PROD_SSH_KNOWN_HOSTS}"
          SSH_PORT="${PORT:-18765}"
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/prod_indexnow_key"; chmod 600 "$HOME/.ssh/prod_indexnow_key"
          printf '%s\n' "$KH" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx-prod-indexnow
            HostName $HOST
            User $USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/prod_indexnow_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 20
            ConnectionAttempts 5
            ServerAliveInterval 30
            ServerAliveCountMax 2
          EOF
          chmod 600 "$HOME/.ssh/config"
          ssh -n nvx-prod-indexnow "test -d '$PROD_ROOT' && test -f '$PROD_ROOT/wp-config.php' && command -v wp >/dev/null && command -v curl >/dev/null && command -v php >/dev/null"

      - name: Submit all production sitemap URLs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts/production/artifacts
          ssh nvx-prod-indexnow \
            "PROD_ROOT='$PROD_ROOT' BASE_URL='$BASE_URL' EXPECTED_HOST='$EXPECTED_HOST' INDEXNOW_KEY='$INDEXNOW_KEY' bash -s" \
            < scripts/production/indexnow-submit-sitemap.sh \
            | tee scripts/production/artifacts/indexnow-submit.log

      - name: Verify public IndexNow key file
        shell: bash
        run: |
          set -euo pipefail
          actual="$(curl -fsS --max-time 20 "$BASE_URL/$INDEXNOW_KEY.txt")"
          test "$actual" = "$INDEXNOW_KEY"
          echo "INDEXNOW_KEY_PUBLIC=PASS"

      - name: Upload IndexNow evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: indexnow-production-submit-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: scripts/production/artifacts/*.log
          retention-days: 30
          if-no-files-found: error
          compression-level: 6

      - name: Destroy production SSH identity
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/prod_indexnow_key" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"

      - name: Write IndexNow summary
        if: success()
        shell: bash
        run: |
          {
            echo '## IndexNow production submission PASS'
            echo
            grep -E '^(INDEXNOW_RELEASE_SHA|INDEXNOW_SITEMAP_CHILDREN|INDEXNOW_URLS|INDEXNOW_HTTP|INDEXNOW_SUBMIT)=' scripts/production/artifacts/indexnow-submit.log | sed 's/^/- `/' | sed 's/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
