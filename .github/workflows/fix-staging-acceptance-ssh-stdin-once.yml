name: Fix Staging Acceptance SSH Stdin Once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/fix-staging-acceptance-ssh-stdin-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out master
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true

      - name: Patch only the heredoc SSH invocation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/staging2-acceptance.yml')
          text=p.read_text(encoding='utf-8')
          old='          ssh -n nvx-staging-origin "STAGING_ROOT=\'$STAGING_ROOT\' BASE_URL=\'$BASE_URL\' EXPECTED_SHA=\'$EXPECTED_SHA\' bash -se" <<\'REMOTE\''
          new='          ssh nvx-staging-origin "STAGING_ROOT=\'$STAGING_ROOT\' BASE_URL=\'$BASE_URL\' EXPECTED_SHA=\'$EXPECTED_SHA\' bash -se" <<\'REMOTE\''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one heredoc invocation, found {text.count(old)}')
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          PY
          grep -Fq 'ssh nvx-staging-origin "STAGING_ROOT=' .github/workflows/staging2-acceptance.yml
          if grep -Fq 'ssh -n nvx-staging-origin "STAGING_ROOT=' .github/workflows/staging2-acceptance.yml; then
            echo 'Broken ssh -n heredoc invocation still present.' >&2
            exit 1
          fi
          git diff --check
          git diff -- .github/workflows/staging2-acceptance.yml

      - name: Commit permanent harness fix
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git status --porcelain -- .github/workflows/staging2-acceptance.yml)"
          git config user.name 'Jeninefer Deras'
          git config user.email 'jenineferderas@hotmail.com'
          git add .github/workflows/staging2-acceptance.yml
          git commit -m 'fix(ci): execute staging origin boundary over SSH stdin'
          git push origin HEAD:master
          echo "HARNESS_FIX_SHA=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
