name: Temporary Staging2 CSS A-B diagnostic

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Configure SiteGround SSH
        env:
          SSH_HOST: ${{ secrets.STAGING2_SSH_HOST }}
          SSH_PORT_SECRET: ${{ secrets.STAGING2_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING2_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing STAGING2_SSH_HOST}"
          : "${SSH_USER:?Missing STAGING2_SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Missing STAGING2_SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing STAGING2_SSH_KNOWN_HOSTS}"
          SSH_PORT="${SSH_PORT_SECRET:-18765}"
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/siteground_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/siteground_key" "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host siteground-staging
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/siteground_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 15
          EOF
          chmod 600 "$HOME/.ssh/config"
      - name: A-B test SiteGround Optimizer
        run: |
          set -euo pipefail
          ssh siteground-staging 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/home/customer/www/staging2.nuvanx.com/public_html
          cd "$ROOT"
          echo '--- BEFORE ---'
          wp plugin list --status=active --field=name | grep -E '^sg-cachepress$' || true
          wp sg optimize css status || true
          wp sg optimize combine-css status || true
          wp sg optimize combine-js status || true
          curl -ksS --resolve staging2.nuvanx.com:443:127.0.0.1 https://staging2.nuvanx.com/ -o /tmp/nvx-before.html
          python3 - <<'PY'
          import re
          s=open('/tmp/nvx-before.html',encoding='utf8',errors='replace').read()
          styles=[x for x in re.findall(r'<link\\b[^>]*>',s,re.I) if re.search(r'rel=["\\\'][^"\\\']*stylesheet',x,re.I)]
          print('BEFORE_HTML_BYTES='+str(len(s)))
          print('BEFORE_STYLESHEET_TAGS='+str(len(styles)))
          print('BEFORE_NVX_BASE='+str('nvx-base.css' in s))
          PY
          echo '--- DISABLE SG CACHEPRESS TEMPORARILY ---'
          wp plugin deactivate sg-cachepress || true
          wp cache flush || true
          rm -rf wp-content/cache/sgo-cache/*
          rm -rf wp-content/uploads/siteground-optimizer-assets/*
          echo '--- AFTER DEACTIVATION ---'
          curl -ksS --resolve staging2.nuvanx.com:443:127.0.0.1 https://staging2.nuvanx.com/ -o /tmp/nvx-after.html
          python3 - <<'PY'
          import re
          s=open('/tmp/nvx-after.html',encoding='utf8',errors='replace').read()
          styles=[x for x in re.findall(r'<link\\b[^>]*>',s,re.I) if re.search(r'rel=["\\\'][^"\\\']*stylesheet',x,re.I)]
          print('AFTER_HTML_BYTES='+str(len(s)))
          print('AFTER_STYLESHEET_TAGS='+str(len(styles)))
          print('AFTER_NVX_BASE='+str('nvx-base.css' in s))
          for x in styles: print(x[:500])
          if not styles or 'nvx-base.css' not in s: raise SystemExit('CSS did not return after SG Optimizer deactivation')
          PY
          REMOTE
      - name: Restore SiteGround Optimizer and purge staging2
        if: always()
        run: |
          set -euo pipefail
          ssh siteground-staging 'cd /home/customer/www/staging2.nuvanx.com/public_html && wp plugin activate sg-cachepress && wp cache flush && wp sg purge || true'
          echo 'RESTORED_SG_CACHEPRESS=1'
