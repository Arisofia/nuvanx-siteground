name: Block C Harness Hardening Once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/block-c-harness-hardening-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout master
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true

      - name: Harden Block C runtime diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/staging2/block-c-52x3.mjs')
          text = p.read_text()
          pairs = [
              (
                  "    const mainText = (main?.innerText || '').replace(/\\s+/g, ' ').trim();\n    const bodyStyle = getComputedStyle(document.body);\n\n    return {\n",
                  "    const mainText = (main?.innerText || '').replace(/\\s+/g, ' ').trim();\n    const bodyStyle = getComputedStyle(document.body);\n    const bodyText = document.body?.innerText || '';\n    const runtimeDiagnostics = Array.from(\n      new Set(bodyText.match(/(?:Warning|Deprecated|Fatal error|Notice):[^\\n]*/g) || [])\n    ).slice(0, 12);\n\n    return {\n",
              ),
              (
                  "      bodyFontSize: bodyStyle.fontSize || '',\n      visibleSectionCount: visibleSections.length,\n",
                  "      bodyFontSize: bodyStyle.fontSize || '',\n      runtimeDiagnostics,\n      visibleSectionCount: visibleSections.length,\n",
              ),
              (
                  "        if (geometry.h1Rect && (geometry.h1Rect.left < -2 || geometry.h1Rect.right > viewport.width + 2)) issues.push('H1 extends outside viewport');\n        if (geometry.horizontalOverflowPx > 2) issues.push(`Horizontal viewport overflow: ${geometry.horizontalOverflowPx}px`);\n",
                  "        if (geometry.h1Rect && (geometry.h1Rect.left < -2 || geometry.h1Rect.right > viewport.width + 2)) issues.push('H1 extends outside viewport');\n        if (geometry.h1Rect && geometry.h1Rect.top < -2) issues.push(`H1 starts above viewport (${geometry.h1Rect.top}px)`);\n        if (geometry.horizontalOverflowPx > 2) issues.push(`Horizontal viewport overflow: ${geometry.horizontalOverflowPx}px`);\n",
              ),
              (
                  "        if (!geometry.bodyFontFamily) issues.push('Body computed font-family is empty');\n        if (geometry.mainTextLength < 80 && !shortContentRoutes.has(route)) issues.push(`Main readable text unexpectedly short (${geometry.mainTextLength} chars)`);\n",
                  "        if (!geometry.bodyFontFamily) issues.push('Body computed font-family is empty');\n        if (geometry.runtimeDiagnostics?.length > 0) issues.push(`Visible PHP/runtime diagnostics: ${geometry.runtimeDiagnostics.join(' | ')}`);\n        if (geometry.mainTextLength < 80 && !shortContentRoutes.has(route)) issues.push(`Main readable text unexpectedly short (${geometry.mainTextLength} chars)`);\n",
              ),
          ]
          for old, new in pairs:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Block C hardening anchor expected once, found {count}: {old[:70]!r}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY
          node --check scripts/staging2/block-c-52x3.mjs
          git diff --check
          git diff --stat

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NUVANX Block C Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/staging2/block-c-52x3.mjs
          test -n "$(git diff --cached --name-only)"
          git commit -m 'test(block-c): detect visible runtime diagnostics'
          git push origin HEAD:master
