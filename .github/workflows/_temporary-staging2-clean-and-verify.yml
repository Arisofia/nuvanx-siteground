name: Temporary Staging2 clean and verify

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  clean-verify:
    if: github.head_ref == 'ops/clean-staging2-runtime' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Configure SiteGround SSH
        env:
          SSH_HOST: ${{ secrets.STAGING2_SSH_HOST }}
          SSH_PORT_SECRET: ${{ secrets.STAGING2_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING2_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing STAGING2_SSH_HOST}"
          : "${SSH_USER:?Missing STAGING2_SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Missing STAGING2_SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing STAGING2_SSH_KNOWN_HOSTS}"
          SSH_PORT="${SSH_PORT_SECRET:-18765}"
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/siteground_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/siteground_key" "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host siteground-staging
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/siteground_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 15
          EOF
          chmod 600 "$HOME/.ssh/config"
      - name: Clean temporary runtime artifacts and restore service state
        run: |
          set -euo pipefail
          ssh siteground-staging 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/home/customer/www/staging2.nuvanx.com/public_html
          cd "$ROOT"
          echo '--- TEMP MU PLUGINS BEFORE ---'
          find wp-content/mu-plugins -maxdepth 1 -type f \( -name 'nvx-buffer-ab-*.php' -o -name 'nvx-css-runtime-debug.php' -o -name 'nvx-wp-head-debug.php' -o -name 'nvx-style-filter-debug.php' \) -print || true
          rm -f wp-content/mu-plugins/nvx-css-runtime-debug.php wp-content/mu-plugins/nvx-wp-head-debug.php wp-content/mu-plugins/nvx-style-filter-debug.php
          find wp-content/mu-plugins -maxdepth 1 -type f -name 'nvx-buffer-ab-*.php' -delete
          wp plugin activate sg-cachepress
          wp plugin activate complianz-gdpr
          wp sg optimize html enable
          wp sg optimize css disable
          wp sg optimize combine-css disable
          wp sg optimize combine-js disable
          wp cache flush
          wp sg purge
          echo '--- TEMP MU PLUGINS AFTER ---'
          find wp-content/mu-plugins -maxdepth 1 -type f \( -name 'nvx-buffer-ab-*.php' -o -name 'nvx-css-runtime-debug.php' -o -name 'nvx-wp-head-debug.php' -o -name 'nvx-style-filter-debug.php' \) -print
          test -z "$(find wp-content/mu-plugins -maxdepth 1 -type f \( -name 'nvx-buffer-ab-*.php' -o -name 'nvx-css-runtime-debug.php' -o -name 'nvx-wp-head-debug.php' -o -name 'nvx-style-filter-debug.php' \) -print -quit)"
          wp plugin is-active sg-cachepress
          wp plugin is-active complianz-gdpr
          wp db check --quiet
          REMOTE
      - name: Verify canonical theme parity and clean origin CSS
        run: |
          set -euo pipefail
          mkdir -p evidence/site-root
          (cd wp-content/themes/nuvanx-medical && find . -type f -print0 | sort -z | xargs -0 sha256sum) > evidence/master-theme.sha256
          ssh siteground-staging "cd /home/customer/www/staging2.nuvanx.com/public_html/wp-content/themes/nuvanx-medical && find . -type f -print0 | sort -z | xargs -0 sha256sum" > evidence/staging2-theme.sha256
          grep -v '  \.\/.nvx-deploy-sha$' evidence/staging2-theme.sha256 > evidence/staging2-theme-normalized.sha256
          diff -u evidence/master-theme.sha256 evidence/staging2-theme-normalized.sha256
          ssh siteground-staging 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/home/customer/www/staging2.nuvanx.com/public_html
          curl -ksS --resolve staging2.nuvanx.com:443:127.0.0.1 https://staging2.nuvanx.com/?nvx_clean_verify=1 -o /tmp/nvx-clean-home.html
          python3 - <<'PY'
          import re
          s=open('/tmp/nvx-clean-home.html',encoding='utf8',errors='replace').read()
          styles=[x for x in re.findall(r'<link\\b[^>]*>',s,re.I) if re.search(r'rel=["\\\'][^"\\\']*stylesheet',x,re.I)]
          print('HTML_BYTES='+str(len(s)))
          print('STYLESHEET_TAGS='+str(len(styles)))
          print('NVX_BASE='+str('nvx-base.css' in s))
          for x in styles: print(x)
          if len(styles)<5 or 'nvx-base.css' not in s: raise SystemExit('CLEAN_ORIGIN_CSS_FAIL')
          rm -rf /tmp/nvx-clean-site-root
          mkdir -p /tmp/nvx-clean-site-root/wp-content/themes/nuvanx-medical/assets
          cp /tmp/nvx-clean-home.html /tmp/nvx-clean-site-root/index.html
          cp -a "$ROOT/wp-content/themes/nuvanx-medical/assets/css" /tmp/nvx-clean-site-root/wp-content/themes/nuvanx-medical/assets/
          tar -czf /tmp/nvx-clean-origin.tgz -C /tmp/nvx-clean-site-root .
          REMOTE
          scp siteground-staging:/tmp/nvx-clean-origin.tgz evidence/clean-origin.tgz
          tar -xzf evidence/clean-origin.tgz -C evidence/site-root
      - name: Verify computed styles desktop and mobile
        run: |
          set -euo pipefail
          npm install --no-save playwright-core@1.55.0
          test -x /usr/bin/chromium
          python3 -m http.server 8765 --directory evidence/site-root >/tmp/nvx-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node <<'NODE'
          const { chromium } = require('playwright-core');
          (async()=>{
            const b=await chromium.launch({headless:true,executablePath:'/usr/bin/chromium',args:['--no-sandbox']});
            for(const [name,viewport] of [['desktop',{width:1440,height:1000}],['mobile',{width:390,height:844}]]){
              const p=await b.newPage({viewport});
              const r=await p.goto('http://127.0.0.1:8765/',{waitUntil:'networkidle',timeout:60000});
              const x=await p.evaluate(()=>{const s=getComputedStyle(document.body),h=document.querySelector('h1');return {margin:s.margin,font:s.fontFamily,display:s.display,h1Font:h?getComputedStyle(h).fontFamily:null,h1Size:h?getComputedStyle(h).fontSize:null,css:[...document.querySelectorAll('link[rel~="stylesheet"]')].map(l=>({href:l.href,sheet:!!l.sheet,rules:l.sheet?(()=>{try{return l.sheet.cssRules.length}catch(e){return -1}})():0}))}});
              console.log(name,JSON.stringify({http:r?.status(),computed:x},null,2));
              await p.screenshot({path:`evidence/clean-${name}.png`,fullPage:true});
              if(!r||r.status()!==200) throw new Error(name+' HTTP failure');
              if(x.margin==='8px') throw new Error(name+' default body margin');
              if(x.font==='Times New Roman'||x.font==='serif') throw new Error(name+' default font');
              if(x.css.some(c=>!c.sheet||c.rules===0)) throw new Error(name+' stylesheet not parsed');
            }
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload clean verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging2-clean-verification-${{ github.run_id }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
