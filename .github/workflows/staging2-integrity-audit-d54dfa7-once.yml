name: Staging2 Integrity Audit d54dfa7 Once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/staging2-integrity-audit-d54dfa7-once.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WP_ROOT: /home/customer/www/staging2.nuvanx.com/public_html
      BASE_URL: https://staging2.nuvanx.com
      EXPECTED_SHA: d54dfa7df226dbd5b823fca1878ce8a60a3548cb
    steps:
      - name: Configure strict staging SSH
        shell: bash
        env:
          HOST: ${{ secrets.STAGING2_SSH_HOST }}
          PORT: ${{ secrets.STAGING2_SSH_PORT }}
          USER: ${{ secrets.STAGING2_SSH_USER }}
          KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${HOST:?Missing STAGING2_SSH_HOST}"
          : "${USER:?Missing STAGING2_SSH_USER}"
          : "${KEY:?Missing STAGING2_SSH_PRIVATE_KEY}"
          : "${KH:?Missing STAGING2_SSH_KNOWN_HOSTS}"
          SSH_PORT="${PORT:-18765}"
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KH" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx-staging
            HostName $HOST
            User $USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 20
            ServerAliveInterval 30
            ServerAliveCountMax 2
          EOF
          chmod 600 "$HOME/.ssh/config"
          ssh nvx-staging "test -d '$WP_ROOT' && command -v wp >/dev/null && command -v curl >/dev/null"

      - name: Verify corrected staging integrity from hosting network
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-staging "WP_ROOT='$WP_ROOT' BASE_URL='$BASE_URL' EXPECTED_SHA='$EXPECTED_SHA' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$WP_ROOT"

          test "$(tr -d '\r\n' < wp-content/themes/nuvanx-medical/.nvx-deploy-sha)" = "$EXPECTED_SHA"
          test "$(wp config get DB_NAME)" = 'dbshcocboodiwr'
          test "$(wp option get home)" = 'https://staging2.nuvanx.com'
          test "$(wp option get siteurl)" = 'https://staging2.nuvanx.com'
          test "$(wp option get blog_public)" = '0'
          echo 'STAGING_IDENTITY=PASS'

          ua='NUVANX-Staging-Origin-Integrity/1.0'

          # Legacy valuation alias must redirect to the one canonical valuation route.
          alias_headers="$(mktemp)"
          alias_body="$(mktemp)"
          alias_result="$(curl -sS --max-time 30 -A "$ua" -H 'Accept: text/html,application/xhtml+xml' -D "$alias_headers" -o "$alias_body" -w '%{http_code}|%{redirect_url}' "$BASE_URL/valoracion-medica/")"
          alias_code="${alias_result%%|*}"
          alias_target="${alias_result#*|}"
          test "$alias_code" = '301'
          test "$alias_target" = "$BASE_URL/madrid/valoracion/"
          ! grep -Fq '/.well-known/sgcaptcha/' "$alias_body"
          rm -f "$alias_headers" "$alias_body"
          echo 'VALORACION_LEGACY_ALIAS=PASS code=301 target=/madrid/valoracion/'

          # Canonical target must be healthy and expose the exact candidate SHA.
          target_body="$(mktemp)"
          target_code="$(curl -sS -L --max-redirs 3 --max-time 30 -A "$ua" -H 'Accept: text/html,application/xhtml+xml' -o "$target_body" -w '%{http_code}' "$BASE_URL/madrid/valoracion/")"
          test "$target_code" = '200'
          grep -Fq "$EXPECTED_SHA" "$target_body"
          ! grep -Fq '/.well-known/sgcaptcha/' "$target_body"
          rm -f "$target_body"
          echo 'VALORACION_CANONICAL=PASS'

          # No published content may continue linking to the obsolete valuation route.
          remaining="$(wp db query "SELECT COUNT(*) FROM $(wp db prefix)posts WHERE post_status='publish' AND post_content LIKE '%/valoracion-medica/%';" --skip-column-names)"
          test "$remaining" = '0'
          echo 'PUBLISHED_LEGACY_VALORACION_LINKS=0'

          # Cases stays intentionally unpublished/404, but must not be linked by menus while blocked.
          cases_body="$(mktemp)"
          cases_code="$(curl -sS --max-time 30 -A "$ua" -H 'Accept: text/html,application/xhtml+xml' -o "$cases_body" -w '%{http_code}' "$BASE_URL/casos-de-pacientes/")"
          test "$cases_code" = '404'
          rm -f "$cases_body"

          home_body="$(mktemp)"
          home_headers="$(mktemp)"
          home_code="$(curl -sS -L --max-redirs 3 --max-time 30 -A "$ua" -H 'Accept: text/html,application/xhtml+xml' -D "$home_headers" -o "$home_body" -w '%{http_code}' "$BASE_URL/")"
          test "$home_code" = '200'
          grep -Fq "$EXPECTED_SHA" "$home_body"
          ! grep -Fq 'href="https://staging2.nuvanx.com/casos-de-pacientes/' "$home_body"
          ! grep -Fq 'href="/casos-de-pacientes/' "$home_body"
          ! grep -Fq '/.well-known/sgcaptcha/' "$home_body"
          echo 'CASES_PUBLICATION_GATE=PASS status=404 menu_link=absent'

          # Exactly one title in HEAD; SVG <title> elements in BODY do not count.
          head_fragment="$(sed -n '1,/<\/head>/p' "$home_body")"
          head_title_count="$(printf '%s' "$head_fragment" | grep -Eio '<title\b[^>]*>[^<]*</title>' | wc -l | tr -d ' ')"
          test "$head_title_count" = '1'
          echo 'DOCUMENT_HEAD_TITLE_COUNT=1'
          rm -f "$home_body" "$home_headers"

          # Yoast sitemap must not publish noindex category/tag taxonomies.
          sm_index="$(mktemp)"
          sm_code="$(curl -sS -L --max-redirs 3 --max-time 30 -A "$ua" -H 'Accept: application/xml,text/xml,*/*' -o "$sm_index" -w '%{http_code}' "$BASE_URL/sitemap_index.xml")"
          test "$sm_code" = '200'
          ! grep -Fq '/.well-known/sgcaptcha/' "$sm_index"
          ! grep -Fq '/category-sitemap.xml' "$sm_index"
          ! grep -Fq '/post_tag-sitemap.xml' "$sm_index"
          ! grep -Fq '/tag-sitemap.xml' "$sm_index"

          page_sitemap_url="$(grep -oE '<loc>[^<]+' "$sm_index" | sed 's#<loc>##' | grep '/page-sitemap.xml' | head -n 1 || true)"
          test -n "$page_sitemap_url"
          page_sm="$(mktemp)"
          page_sm_code="$(curl -sS -L --max-redirs 3 --max-time 30 -A "$ua" -H 'Accept: application/xml,text/xml,*/*' -o "$page_sm" -w '%{http_code}' "$page_sitemap_url")"
          test "$page_sm_code" = '200'
          ! grep -Fq '/politica-de-cookies/' "$page_sm"
          ! grep -Fq '/mas-informacion-sobre-las-cookies/' "$page_sm"
          ! grep -Fq '/casos-de-pacientes/' "$page_sm"
          rm -f "$sm_index" "$page_sm"
          echo 'SITEMAP_NOINDEX_RECONCILIATION=PASS'

          echo "STAGING_D54_INTEGRITY=PASS sha=$EXPECTED_SHA"
          REMOTE

      - name: Destroy SSH identity
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/key" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"
