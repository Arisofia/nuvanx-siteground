name: Production Bootstrap Once
run-name: Production bootstrap once · ${{ github.sha }}

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/production-bootstrap-once.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: nuvanx-production-bootstrap-once
  cancel-in-progress: false

jobs:
  dispatch_after_cleanup_acceptance:
    name: Wait for canonical cleanup SHA and dispatch production once
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BASELINE_SHA: e89fd7360610e18abf5a4a197e4d52e44480802c
      BASELINE_TREE: 0a3493ccc4ff1c7660ca4ff5932bf9ae21df81eb
      BOOTSTRAP_PATH: .github/workflows/production-bootstrap-once.yml
    steps:
      - name: Verify bootstrap ancestry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          parent="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq '.parents[0].sha')"
          test "$parent" = "$BASELINE_SHA"
          echo "BOOTSTRAP_ANCESTRY=PASS parent=$parent"

      - name: Wait for exact-tree cleanup and immutable Staging acceptance
        id: accepted
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          accepted_sha=''
          accepted_run=''

          for attempt in $(seq 1 180); do
            head="$(gh api "/repos/${GITHUB_REPOSITORY}/branches/master" --jq '.commit.sha')"
            if [[ "$head" == "$GITHUB_SHA" ]]; then
              echo "BOOTSTRAP_WAIT cleanup_not_pushed attempt=$attempt"
              sleep 20
              continue
            fi

            commit_json="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${head}")"
            parent="$(jq -r '.parents[0].sha // empty' <<<"$commit_json")"
            tree="$(jq -r '.commit.tree.sha // empty' <<<"$commit_json")"
            message="$(jq -r '.commit.message // empty' <<<"$commit_json")"
            changed_count="$(jq -r '.files | length' <<<"$commit_json")"
            changed_path="$(jq -r '.files[0].filename // empty' <<<"$commit_json")"
            changed_status="$(jq -r '.files[0].status // empty' <<<"$commit_json")"

            if [[ "$parent" != "$GITHUB_SHA" || "$tree" != "$BASELINE_TREE" || "$changed_count" != '1' || "$changed_path" != "$BOOTSTRAP_PATH" || "$changed_status" != 'removed' ]]; then
              echo "BOOTSTRAP_GUARD=FAIL head=$head parent=$parent tree=$tree changed_count=$changed_count changed_path=$changed_path changed_status=$changed_status" >&2
              exit 1
            fi

            if [[ "$message" != 'ops(release): remove one-time production bootstrap' ]]; then
              echo "BOOTSTRAP_GUARD=FAIL unexpected_cleanup_message" >&2
              exit 1
            fi

            current_head="$(gh api "/repos/${GITHUB_REPOSITORY}/branches/master" --jq '.commit.sha')"
            test "$current_head" = "$head"

            runs="$(gh run list --workflow staging.yml --branch master --event push --limit 30 --json databaseId,headSha,status,conclusion)"
            accepted_run="$(jq -r --arg sha "$head" '[.[] | select(.headSha == $sha and .status == "completed" and .conclusion == "success")] | sort_by(.databaseId) | last | .databaseId // empty' <<<"$runs")"
            if [[ "$accepted_run" =~ ^[0-9]+$ ]]; then
              accepted_sha="$head"
              break
            fi

            failed_run="$(jq -r --arg sha "$head" '[.[] | select(.headSha == $sha and .status == "completed" and .conclusion != "success")] | sort_by(.databaseId) | last | .databaseId // empty' <<<"$runs")"
            if [[ "$failed_run" =~ ^[0-9]+$ ]]; then
              echo "BOOTSTRAP_STAGING=FAIL sha=$head run_id=$failed_run" >&2
              exit 1
            fi

            echo "BOOTSTRAP_WAIT staging_acceptance sha=$head attempt=$attempt"
            sleep 20
          done

          [[ "$accepted_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'BOOTSTRAP_STAGING=FAIL timeout' >&2; exit 1; }
          final_head="$(gh api "/repos/${GITHUB_REPOSITORY}/branches/master" --jq '.commit.sha')"
          test "$final_head" = "$accepted_sha"
          echo "sha=$accepted_sha" >> "$GITHUB_OUTPUT"
          echo "staging_run=$accepted_run" >> "$GITHUB_OUTPUT"
          echo "BOOTSTRAP_STAGING=PASS sha=$accepted_sha run_id=$accepted_run tree=$BASELINE_TREE"

      - name: Dispatch protected production workflow with all audits
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.accepted.outputs.sha }}
        run: |
          set -euo pipefail
          head="$(gh api "/repos/${GITHUB_REPOSITORY}/branches/master" --jq '.commit.sha')"
          test "$head" = "$CANDIDATE_SHA"

          before_id="$(gh run list --workflow production.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run production.yml \
            --ref master \
            -f deploy=true \
            -f candidate_sha="$CANDIDATE_SHA" \
            -f release_mode=release \
            -f run_post_audits=true \
            -f run_performance=true \
            -f run_hubspot_e2e=true \
            -f run_final_close_audit=true \
            -f run_mu_plugin_forensics=true

          child_id=''
          for attempt in $(seq 1 30); do
            runs="$(gh run list --workflow production.yml --branch master --event workflow_dispatch --limit 20 --json databaseId,headSha)"
            child_id="$(jq -r --argjson before "$before_id" --arg sha "$CANDIDATE_SHA" '[.[] | select(.databaseId > $before and .headSha == $sha)] | sort_by(.databaseId) | last | .databaseId // empty' <<<"$runs")"
            [[ "$child_id" =~ ^[0-9]+$ ]] && break
            sleep 2
          done
          [[ "$child_id" =~ ^[0-9]+$ ]] || { echo 'BOOTSTRAP_DISPATCH=FAIL child_not_found' >&2; exit 1; }
          echo "run_id=$child_id" >> "$GITHUB_OUTPUT"
          echo "BOOTSTRAP_DISPATCH=PASS sha=$CANDIDATE_SHA production_run_id=$child_id"

      - name: Wait for production completion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set -euo pipefail
          gh run watch "$PRODUCTION_RUN_ID" --exit-status
          echo "BOOTSTRAP_PRODUCTION=PASS run_id=$PRODUCTION_RUN_ID staging_run=${{ steps.accepted.outputs.staging_run }} sha=${{ steps.accepted.outputs.sha }}"
