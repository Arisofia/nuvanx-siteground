name: Production Edge Preflight Once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/production-edge-preflight-once.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://nuvanx.com
      EXPECTED_HOST: nuvanx.com
      EXPECTED_SHA: 3b99fb5787d3b6f189503e82e20bf6b9e65e6c7e
    steps:
      - name: Check out hardened verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: master
          fetch-depth: 1
          persist-credentials: false

      - name: Verify current production public boundary
        shell: bash
        run: |
          set -euo pipefail
          node scripts/production/verify-production-boundary.mjs

      - name: Probe challenge behavior without accepting it
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for ua in 'NUVANX-Production-Boundary/1.0' 'Mozilla/5.0 NUVANX-Prod-Browser-Probe'; do
            echo "===== UA: $ua ====="
            headers="$(mktemp)"; body="$(mktemp)"
            code="$(curl -sS --max-time 20 -A "$ua" -H 'Accept: text/html,application/xhtml+xml' -D "$headers" -o "$body" -w '%{http_code}' "$BASE_URL/" || true)"
            echo "HTTP_CODE=$code"
            grep -Ei '^(HTTP/|server:|date:|content-type:|location:|sg-captcha:|x-robots-tag:|x-proxy-cache:|x-proxy-cache-info:)' "$headers" || true
            if grep -Fq '/.well-known/sgcaptcha/' "$body"; then
              echo 'SITEGROUND_CAPTCHA=YES'
            else
              echo 'SITEGROUND_CAPTCHA=NO'
            fi
            rm -f "$headers" "$body"
          done
