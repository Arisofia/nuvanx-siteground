name: Temporary Sonar autofix

on:
  push:
    branches:
      - fix/schema-entity-graph-audit-20260728

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/schema-entity-graph-audit-20260728
          fetch-depth: 0

      - name: Apply minimal Sonar corrections
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding='utf-8')

          def replace_region(text: str, start: str, end: str, replacement: str) -> str:
              start_index = text.index(start)
              end_index = text.index(end, start_index)
              return text[:start_index] + replacement + text[end_index:]

          btl_path = 'wp-content/themes/nuvanx-medical/inc/nvx-btl-detail-pages.php'
          btl = read(btl_path)
          alias_start = '/**\n * Snake_case alias used by structured-data / SEO readiness schema builders.'
          alias_end = '/**\n * Check if the content contains standard H1 markers'
          btl = replace_region(btl, alias_start, alias_end, '')
          write(btl_path, btl)

          structured_path = 'wp-content/themes/nuvanx-medical/inc/nvx-structured-data.php'
          structured = read(structured_path).replace('nvx_btl_detail_registry', 'nvxBtlDetailRegistry')
          structured_start = '/**\n * Link WebPage.mainEntity to a treatment @id when the page URL matches.'
          structured_end = '/**\n * Attaches treatment and FAQ nodes to schema graph when applicable.'
          structured_helper = '''/**
           * Link WebPage.mainEntity to a treatment @id when the page URL matches.
           *
           * Shared by the structured-data and production-readiness graph passes so
           * URL matching and mainEntity assignment cannot diverge.
           *
           * @param array  $graph       Schema graph.
           * @param string $permalink   Treatment page permalink.
           * @param string $treatmentId Treatment node @id.
           * @return array Updated schema graph.
           */
          function nvxSchemaLinkWebpageMainEntity( array $graph, string $permalink, string $treatmentId ): array {
              if ( '' === $permalink || '' === $treatmentId ) {
                  return $graph;
              }

              $target = trailingslashit( $permalink );
              foreach ( $graph as $index => $piece ) {
                  $types = isset( $piece['@type'] ) ? (array) $piece['@type'] : array();
                  $url   = isset( $piece['url'] ) ? trailingslashit( (string) $piece['url'] ) : '';
                  if ( in_array( 'WebPage', $types, true ) && $url === $target ) {
                      $graph[ $index ]['mainEntity'] = array( '@id' => $treatmentId );
                      break;
                  }
              }

              return $graph;
          }

          '''
          structured = replace_region(structured, structured_start, structured_end, structured_helper)
          old_call = "            nvx_schema_link_webpage_main_entity( $graph, (string) $treatment['url'], (string) $treatment['@id'] );"
          new_call = "            $graph = nvxSchemaLinkWebpageMainEntity( $graph, (string) $treatment['url'], (string) $treatment['@id'] );"
          if old_call not in structured:
              raise RuntimeError('structured-data mainEntity call marker missing')
          structured = structured.replace(old_call, new_call, 1)
          write(structured_path, structured)

          seo_path = 'wp-content/themes/nuvanx-medical/inc/nvx-seo-production-readiness.php'
          seo = read(seo_path).replace('nvx_btl_detail_registry', 'nvxBtlDetailRegistry')
          duplicate_start = '/**\n * Links the matching WebPage node to the promoted main entity.'
          duplicate_end = '/**\n * Promote Organization.logo ImageObject to a top-level graph node.'
          seo = replace_region(seo, duplicate_start, duplicate_end, '')

          logo_start = '/**\n * Promote Organization.logo ImageObject to a top-level graph node.'
          ensure_start = '/**\n * Link WebPage.mainEntity to the first MedicalProcedure/Service for this URL.'
          logo_helpers = '''/**
           * Return a materializable Organization logo node, when present.
           *
           * @param array $piece Schema graph node.
           * @return array|null
           */
          function nvxSeoSchemaLogoNodeFromOrganization( array $piece ): ?array {
              $types = $piece['@type'] ?? array();
              if ( ! nvx_seo_schema_has_type( $types, 'Organization' ) || nvx_seo_schema_has_type( $types, 'WebSite' ) ) {
                  return null;
              }

              $logo = $piece['logo'] ?? null;
              if ( ! is_array( $logo ) ) {
                  return null;
              }

              $logoId  = isset( $logo['@id'] ) ? (string) $logo['@id'] : '';
              $hasBody = isset( $logo['url'] ) || isset( $logo['contentUrl'] ) || isset( $logo['width'] ) || isset( $logo['height'] );
              if ( '' === $logoId || ! $hasBody ) {
                  return null;
              }

              if ( empty( $logo['@type'] ) ) {
                  $logo['@type'] = 'ImageObject';
              }

              return $logo;
          }

          /**
           * Promote Organization.logo ImageObject to a top-level graph node.
           *
           * @param array $graph Schema graph.
           * @return array
           */
          function nvxSeoSchemaMaterializeLogoNode( array $graph ): array {
              foreach ( $graph as $index => $piece ) {
                  $logoNode = nvxSeoSchemaLogoNodeFromOrganization( $piece );
                  if ( null === $logoNode ) {
                      continue;
                  }

                  $logoId = (string) $logoNode['@id'];
                  $graph = nvx_seo_schema_upsert_node( $graph, $logoNode );
                  $graph[ $index ]['logo']  = array( '@id' => $logoId );
                  $graph[ $index ]['image'] = array( '@id' => $logoId );
              }

              return $graph;
          }

          '''
          seo = replace_region(seo, logo_start, ensure_start, logo_helpers)

          ensure_end = '/**\n * Ensures production readiness by consolidating MedicalOrganization, MedicalProcedure,'
          ensure_helper = '''/**
           * Link WebPage.mainEntity to the first MedicalProcedure/Service for this URL.
           *
           * @param array  $graph      Schema graph.
           * @param string $currentUrl Canonical page URL.
           * @return array
           */
          function nvxSeoSchemaEnsureWebpageMainEntity( array $graph, string $currentUrl ): array {
              foreach ( $graph as $piece ) {
                  $types     = $piece['@type'] ?? array();
                  $pieceUrl  = isset( $piece['url'] ) ? trailingslashit( (string) $piece['url'] ) : '';
                  $isEntity  = nvx_seo_schema_has_type( $types, 'MedicalProcedure' ) || nvx_seo_schema_has_type( $types, 'Service' );
                  $matchesUrl = '' !== $pieceUrl && $pieceUrl === trailingslashit( $currentUrl );
                  if ( $isEntity && $matchesUrl && ! empty( $piece['@id'] ) ) {
                      return function_exists( 'nvxSchemaLinkWebpageMainEntity' )
                          ? nvxSchemaLinkWebpageMainEntity( $graph, $currentUrl, (string) $piece['@id'] )
                          : $graph;
                  }
              }

              return $graph;
          }

          '''
          seo = replace_region(seo, ensure_start, ensure_end, ensure_helper)
          seo = seo.replace('nvx_seo_schema_materialize_logo_node( $graph )', 'nvxSeoSchemaMaterializeLogoNode( $graph )')
          seo = seo.replace('nvx_seo_schema_ensure_webpage_main_entity( $graph, $current_url )', 'nvxSeoSchemaEnsureWebpageMainEntity( $graph, $current_url )')
          old_link = "    $graph = _nvx_seo_schema_link_main_entity( $graph, $current_url, $main_entity_id );"
          new_link = "    if ( '' !== $main_entity_id && function_exists( 'nvxSchemaLinkWebpageMainEntity' ) ) {\n        $graph = nvxSchemaLinkWebpageMainEntity( $graph, $current_url, $main_entity_id );\n    }"
          if old_link not in seo:
              raise RuntimeError('SEO promoted mainEntity call marker missing')
          seo = seo.replace(old_link, new_link, 1)
          write(seo_path, seo)

          entity_contract_path = 'scripts/theme-hygiene/test-entity-graph-contract.mjs'
          contract = read(entity_contract_path)
          contract = contract.replace("  [btl, 'function nvx_btl_detail_registry(): array', 'BTL snake_case registry alias'],\n", '')
          contract = contract.replace("  [btl, 'return nvxBtlDetailRegistry();', 'BTL alias delegates to camelCase registry'],\n", '')
          contract = contract.replace("[structured, \"function_exists( 'nvx_btl_detail_registry' )\"", "[structured, \"function_exists( 'nvxBtlDetailRegistry' )\"")
          contract = contract.replace('function nvx_schema_link_webpage_main_entity(', 'function nvxSchemaLinkWebpageMainEntity(')
          contract = contract.replace('function nvx_seo_schema_materialize_logo_node(', 'function nvxSeoSchemaMaterializeLogoNode(')
          contract = contract.replace('function nvx_seo_schema_ensure_webpage_main_entity(', 'function nvxSeoSchemaEnsureWebpageMainEntity(')
          contract = contract.replace("const required = [\n", "const required = [\n  [btl, 'function nvxBtlDetailRegistry(): array', 'canonical BTL registry'],\n")
          guard_marker = "// Must not reintroduce a second top-level schema.org script printer in structured-data."
          guards = """if (btl.includes('function nvx_btl_detail_registry')) {
            failures.push('BTL registry must not retain the Sonar-incompatible snake_case alias');
          }
          if (seo.includes('_nvx_seo_schema_link_main_entity')) {
            failures.push('SEO readiness must use the shared mainEntity helper');
          }

          """
          contract = contract.replace(guard_marker, guards + guard_marker, 1)
          write(entity_contract_path, contract)

          runtime_contract_path = 'scripts/theme-hygiene/test-runtime-bootstrap-contract.mjs'
          runtime = read(runtime_contract_path)
          runtime = runtime.replace("  'function nvx_btl_detail_registry(): array',\n", '')
          runtime = runtime.replace("  'return nvxBtlDetailRegistry();',\n", '')
          runtime = runtime.replace('nvx_btl_detail_registry', 'nvxBtlDetailRegistry')
          runtime = runtime.replace('nvx_seo_schema_materialize_logo_node', 'nvxSeoSchemaMaterializeLogoNode')
          runtime = runtime.replace('nvx_seo_schema_ensure_webpage_main_entity', 'nvxSeoSchemaEnsureWebpageMainEntity')
          runtime = runtime.replace('nvx_schema_link_webpage_main_entity', 'nvxSchemaLinkWebpageMainEntity')
          write(runtime_contract_path, runtime)

          prohibited = (
              'nvx_btl_detail_registry',
              'nvx_schema_link_webpage_main_entity',
              'nvx_seo_schema_materialize_logo_node',
              'nvx_seo_schema_ensure_webpage_main_entity',
              '_nvx_seo_schema_link_main_entity',
          )
          checked_paths = [btl_path, structured_path, seo_path, entity_contract_path, runtime_contract_path]
          combined = '\n'.join(read(path) for path in checked_paths)
          leftovers = [name for name in prohibited if name in combined]
          if leftovers:
              raise RuntimeError(f'legacy Sonar markers remain: {leftovers}')
          PY

      - name: Validate corrections
        shell: bash
        run: |
          set -euo pipefail
          php -l wp-content/themes/nuvanx-medical/inc/nvx-btl-detail-pages.php
          php -l wp-content/themes/nuvanx-medical/inc/nvx-structured-data.php
          php -l wp-content/themes/nuvanx-medical/inc/nvx-seo-production-readiness.php
          node --check scripts/theme-hygiene/test-entity-graph-contract.mjs
          node --check scripts/theme-hygiene/test-runtime-bootstrap-contract.mjs
          node scripts/theme-hygiene/test-entity-graph-contract.mjs
          node scripts/theme-hygiene/test-runtime-bootstrap-contract.mjs
          git diff --check

      - name: Commit verified corrections
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temporary-sonar-autofix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wp-content/themes/nuvanx-medical/inc/nvx-btl-detail-pages.php \
                  wp-content/themes/nuvanx-medical/inc/nvx-structured-data.php \
                  wp-content/themes/nuvanx-medical/inc/nvx-seo-production-readiness.php \
                  scripts/theme-hygiene/test-entity-graph-contract.mjs \
                  scripts/theme-hygiene/test-runtime-bootstrap-contract.mjs \
                  .github/workflows/temporary-sonar-autofix.yml
          git commit -m "fix(sonar): clear entity graph quality gate"
          git push origin HEAD:fix/schema-entity-graph-audit-20260728
