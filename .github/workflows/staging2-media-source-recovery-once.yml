name: Staging2 Media Source Recovery Once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/staging2-media-source-recovery-once.yml

permissions:
  contents: read

concurrency:
  group: staging2-media-source-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING_ROOT: /home/customer/www/staging2.nuvanx.com/public_html
      PROD_ROOT: /home/customer/www/nuvanx.com/public_html
      STAGING_URL: https://staging2.nuvanx.com
      EXPECTED_STAGING_SHA: d54dfa7df226dbd5b823fca1878ce8a60a3548cb
      EXPECTED_PROD_SHA: 4775310be2b7dcdda18f8fd6de8e40041c2eb555

    steps:
      - name: Configure strict SiteGround SSH
        shell: bash
        env:
          HOST: ${{ secrets.STAGING2_SSH_HOST }}
          PORT: ${{ secrets.STAGING2_SSH_PORT }}
          USER: ${{ secrets.STAGING2_SSH_USER }}
          KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${HOST:?Missing STAGING2_SSH_HOST}"
          : "${USER:?Missing STAGING2_SSH_USER}"
          : "${KEY:?Missing STAGING2_SSH_PRIVATE_KEY}"
          : "${KH:?Missing STAGING2_SSH_KNOWN_HOSTS}"
          SSH_PORT="${PORT:-18765}"
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KH" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx-sg
            HostName $HOST
            User $USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 20
            ServerAliveInterval 30
            ServerAliveCountMax 2
          EOF
          chmod 600 "$HOME/.ssh/config"
          ssh nvx-sg "test -d '$STAGING_ROOT' && test -d '$PROD_ROOT' && command -v wp >/dev/null && command -v curl >/dev/null && command -v sha256sum >/dev/null"

      - name: Restore exact production binaries into staging with rollback
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_BACKUP="/tmp/nvx-media-source-recovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "REMOTE_BACKUP=$REMOTE_BACKUP" >> "$GITHUB_ENV"
          ssh nvx-sg "STAGING_ROOT='$STAGING_ROOT' PROD_ROOT='$PROD_ROOT' STAGING_SHA='$EXPECTED_STAGING_SHA' PROD_SHA='$EXPECTED_PROD_SHA' BACKUP='$REMOTE_BACKUP' bash -se" <<'REMOTE'
          set -Eeuo pipefail

          test "$(tr -d '\r\n' < "$STAGING_ROOT/wp-content/themes/nuvanx-medical/.nvx-deploy-sha)" = "$STAGING_SHA"
          test "$(tr -d '\r\n' < "$PROD_ROOT/wp-content/themes/nuvanx-medical/.nvx-deploy-sha)" = "$PROD_SHA"

          cd "$STAGING_ROOT"
          test "$(wp config get DB_NAME)" = 'dbshcocboodiwr'
          test "$(wp option get home)" = 'https://staging2.nuvanx.com'
          test "$(wp option get blog_public)" = '0'
          cd "$PROD_ROOT"
          test "$(wp config get DB_NAME)" = 'db0ecrycwv2tgb'
          test "$(wp option get home)" = 'https://nuvanx.com'
          test "$(wp option get blog_public)" = '1'

          rm -rf "$BACKUP"
          mkdir -p "$BACKUP/files"
          : > "$BACKUP/created.txt"
          : > "$BACKUP/preexisting.txt"

          rollback() {
            set +e
            if test -s "$BACKUP/created.txt"; then
              while IFS= read -r rel; do
                test -n "$rel" && rm -f "$STAGING_ROOT/wp-content/uploads/$rel"
              done < "$BACKUP/created.txt"
            fi
            if test -s "$BACKUP/preexisting.txt"; then
              while IFS= read -r rel; do
                test -n "$rel" || continue
                mkdir -p "$(dirname "$STAGING_ROOT/wp-content/uploads/$rel")"
                cp -p "$BACKUP/files/$rel" "$STAGING_ROOT/wp-content/uploads/$rel"
              done < "$BACKUP/preexisting.txt"
            fi
            echo 'STAGING_MEDIA_SOURCE_ROLLBACK=PASS'
          }
          trap rollback ERR

          manifest="$BACKUP/manifest.txt"
          cat > "$manifest" <<'EOF'
          2025/04/cropped-nuvanx-icono-sitio.webp
          2025/04/cropped-nuvanx-icono-sitio-300x300.webp
          2025/04/cropped-nuvanx-icono-sitio-150x150.webp
          2025/04/cropped-nuvanx-icono-sitio-400x250.webp
          2025/04/cropped-nuvanx-icono-sitio-400x284.webp
          2025/04/cropped-nuvanx-icono-sitio-510x382.webp
          2025/04/cropped-nuvanx-icono-sitio-400x512.webp
          2025/04/cropped-nuvanx-icono-sitio-480x480.webp
          2025/04/cropped-nuvanx-icono-sitio-270x270.webp
          2025/04/cropped-nuvanx-icono-sitio-192x192.webp
          2025/04/cropped-nuvanx-icono-sitio-180x180.webp
          2025/04/cropped-nuvanx-icono-sitio-32x32.webp
          2026/06/nvx-co2-evaluacion-620.webp
          2026/06/nvx-co2-evaluacion-620-300x201.webp
          2026/06/nvx-co2-evaluacion-620-150x150.webp
          EOF
          sed -i 's/^[[:space:]]*//' "$manifest"

          copied=0
          while IFS= read -r rel; do
            test -n "$rel" || continue
            src="$PROD_ROOT/wp-content/uploads/$rel"
            dst="$STAGING_ROOT/wp-content/uploads/$rel"
            test -s "$src" || { echo "PROD_SOURCE_MISSING=$rel" >&2; false; }
            mkdir -p "$(dirname "$dst")"
            if test -e "$dst"; then
              mkdir -p "$(dirname "$BACKUP/files/$rel")"
              cp -p "$dst" "$BACKUP/files/$rel"
              printf '%s\n' "$rel" >> "$BACKUP/preexisting.txt"
            else
              printf '%s\n' "$rel" >> "$BACKUP/created.txt"
            fi
            cp -p "$src" "$dst"
            test -s "$dst"
            src_sha="$(sha256sum "$src" | cut -d' ' -f1)"
            dst_sha="$(sha256sum "$dst" | cut -d' ' -f1)"
            test "$src_sha" = "$dst_sha"
            copied=$((copied + 1))
            echo "MEDIA_SOURCE_COPY_PASS rel=$rel sha256=$dst_sha"
          done < "$manifest"
          test "$copied" = '15'

          trap - ERR
          echo "STAGING_MEDIA_SOURCE_COPY=PASS files=$copied"
          REMOTE

      - name: Purge staging caches and verify recovered URLs
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-sg "STAGING_ROOT='$STAGING_ROOT' STAGING_URL='$STAGING_URL' STAGING_SHA='$EXPECTED_STAGING_SHA' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$STAGING_ROOT"
          test "$(tr -d '\r\n' < wp-content/themes/nuvanx-medical/.nvx-deploy-sha)" = "$STAGING_SHA"
          wp cache flush >/dev/null
          if wp help sg >/dev/null 2>&1; then wp sg purge >/dev/null 2>&1 || true; fi
          wp eval 'if (function_exists("opcache_reset")) { opcache_reset(); }' >/dev/null || true

          ua='NUVANX-Staging-Media-Recovery/1.0'
          for rel in \
            '2025/04/cropped-nuvanx-icono-sitio.webp' \
            '2025/04/cropped-nuvanx-icono-sitio-32x32.webp' \
            '2025/04/cropped-nuvanx-icono-sitio-180x180.webp' \
            '2025/04/cropped-nuvanx-icono-sitio-192x192.webp' \
            '2025/04/cropped-nuvanx-icono-sitio-270x270.webp' \
            '2026/06/nvx-co2-evaluacion-620.webp' \
            '2026/06/nvx-co2-evaluacion-620-300x201.webp' \
            '2026/06/nvx-co2-evaluacion-620-150x150.webp'; do
            code="$(curl -sS --max-time 20 -A "$ua" -o /dev/null -w '%{http_code}' "$STAGING_URL/wp-content/uploads/$rel")"
            test "$code" = '200' || { echo "RECOVERED_HTTP_FAIL rel=$rel code=$code" >&2; exit 1; }
            echo "RECOVERED_HTTP_PASS rel=$rel"
          done

          page="$(mktemp)"
          page_code="$(curl -sS -L --max-redirs 3 --max-time 30 -A "$ua" -H 'Accept: text/html,application/xhtml+xml' -o "$page" -w '%{http_code}' "$STAGING_URL/estetica-avanzada/")"
          test "$page_code" = '200'
          grep -Fq "$STAGING_SHA" "$page"
          ! grep -Fq '/.well-known/sgcaptcha/' "$page"

          refs="$(mktemp)"
          grep -Eo 'https://staging2\.nuvanx\.com/wp-content/uploads/[^"'"'"' <>]+\.(webp|jpe?g|png)' "$page" | sort -u > "$refs" || true
          test -s "$refs"
          failures=0
          total=0
          while IFS= read -r url; do
            test -n "$url" || continue
            total=$((total + 1))
            code="$(curl -sS --max-time 20 -A "$ua" -o /dev/null -w '%{http_code}' "$url" || true)"
            if test "$code" != '200'; then
              failures=$((failures + 1))
              echo "RUNTIME_IMAGE_FAIL code=$code url=$url"
            fi
          done < "$refs"
          echo "RUNTIME_IMAGE_TOTAL=$total"
          echo "RUNTIME_IMAGE_FAIL=$failures"
          test "$failures" = '0'
          rm -f "$page" "$refs"
          echo 'STAGING_MEDIA_RUNTIME=PASS'
          REMOTE

      - name: Remove recovery backup after successful verification
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-sg "case '$REMOTE_BACKUP' in /tmp/nvx-media-source-recovery-*) rm -rf '$REMOTE_BACKUP' ;; *) exit 1 ;; esac"

      - name: Destroy SSH identity
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/key" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"
