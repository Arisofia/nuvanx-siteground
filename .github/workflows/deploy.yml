name: Production Gate & Atomic Deploy to SiteGround

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deploy-${{ github.sha }}
  cancel-in-progress: true

jobs:
  deploy-siteground:
    name: 🚀 Atomic Deploy to SiteGround
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify staging2 acceptance passed for this SHA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Checking Deploy Staging2 runs for SHA ${{ github.event.workflow_run.head_sha }}..."
          OWNER_REPO="${{ github.repository }}"
          SHA="${{ github.event.workflow_run.head_sha }}"
          runs_json=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" "https://api.github.com/repos/${OWNER_REPO}/actions/runs?per_page=100")
          ok=$(echo "$runs_json" | jq -r --arg name "Deploy Staging2" --arg sha "$SHA" '.workflow_runs[] | select(.name==$name and .head_sha==$sha and .conclusion=="success") | .id' | head -n1)
          if [ -z "$ok" ]; then
            echo "Staging2 acceptance did not pass for SHA $SHA; aborting deploy"
            exit 1
          fi
          echo "Found successful Deploy Staging2 run id: $ok — proceeding with deploy"

      - name: Configurar Clave SSH para SiteGround
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      - name: Añadir Host de SiteGround a Known Hosts with StrictHostKeyChecking
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Try ssh-keyscan with timeout and error handling
          timeout 10 ssh-keyscan -p ${{ secrets.PROD_SSH_PORT || 18765 }} -H ${{ secrets.PROD_SSH_HOST }} >> ~/.ssh/known_hosts 2>&1 || {
            echo "Warning: ssh-keyscan failed, using StrictHostKeyChecking=no as fallback"
            echo "HostKeyChecking=no" > ~/.ssh/config
          }
          chmod 644 ~/.ssh/known_hosts

      - name: Upload theme to production server (temporary location)
        run: |
          ssh -p ${{ secrets.PROD_SSH_PORT || 18765 }} -o StrictHostKeyChecking=no \
            ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }} \
            "mkdir -p /tmp/nuvanx-medical-build"
          rsync -avz \
            -e "ssh -p ${{ secrets.PROD_SSH_PORT || 18765 }} -o StrictHostKeyChecking=no" \
            --exclude='.git*' \
            --exclude='.github*' \
            --exclude='node_modules*' \
            --exclude='tests*' \
            --exclude='playwright*' \
            --exclude='*.log' \
            ./wp-content/themes/nuvanx-medical/ \
            ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:/tmp/nuvanx-medical-build/

      - name: Upload deploy script to production server
        run: |
          scp -P ${{ secrets.PROD_SSH_PORT || 18765 }} -o StrictHostKeyChecking=no \
            tools/deploy/deploy-to-prod.sh \
            ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:/tmp/

      - name: Execute deployment using deploy-to-prod.sh script
        run: |
          ssh -p ${{ secrets.PROD_SSH_PORT || 18765 }} -o StrictHostKeyChecking=no \
            ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }} \
            "bash /tmp/deploy-to-prod.sh \
              --prod-root ${{ secrets.PROD_WP_PATH }} \
              --source-theme /tmp/nuvanx-medical-build \
              --sha ${{ github.event.workflow_run.head_sha }} \
              --confirm"

      - name: Cleanup temporary files
        run: |
          ssh -p ${{ secrets.PROD_SSH_PORT || 18765 }} -o StrictHostKeyChecking=no \
            ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }} \
            "rm -f /tmp/deploy-to-prod.sh && rm -rf /tmp/nuvanx-medical-build"
