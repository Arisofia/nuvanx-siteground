name: Temporary Composer Lock Refresh

on:
  push:
    branches:
      - cleanup/dependency-normalization-20260808

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Regenerate lock with minimal dependency changes
        working-directory: wp-content/themes/nuvanx-medical
        shell: bash
        run: |
          set -euo pipefail
          composer update --no-install --no-interaction --no-progress --minimal-changes --no-scripts
          composer validate --strict --no-check-publish
          echo '--- direct locked dependencies ---'
          composer show --locked --direct
          echo '--- lock diff ---'
          git diff -- composer.lock

      - name: Upload regenerated lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: normalized-composer-lock-${{ github.sha }}
          path: wp-content/themes/nuvanx-medical/composer.lock
          if-no-files-found: error
          retention-days: 1
