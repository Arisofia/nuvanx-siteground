name: Add Sonar CI coverage once

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/add-sonar-ci-coverage-once.yml'

permissions:
  contents: write

jobs:
  add-coverage:
    if: github.head_ref == 'refactor/sonar-duplication-20260731'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/sonar-duplication-20260731
          fetch-depth: 0

      - name: Add test, coverage and Sonar configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/js .github/workflows

          cat > tests/js/visual-qa-common.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';

          import {
            safeName,
            locateChrome,
            CDPSession,
            waitForChrome,
            createTarget,
            closeSession,
          } from '../../scripts/staging2/visual-qa-common.mjs';

          test('safeName normalizes root and route names', () => {
            assert.equal(safeName('/'), 'home');
            assert.equal(safeName('/equipo-medico/'), 'equipo-medico');
            assert.equal(safeName('/a/b/'), 'a__b');
            assert.equal(safeName(null), 'home');
          });

          test('locateChrome accepts an explicit existing executable path', () => {
            const directory = fs.mkdtempSync(path.join(os.tmpdir(), 'nvx-chrome-'));
            const executable = path.join(directory, 'chrome');
            fs.writeFileSync(executable, '#!/bin/sh\nexit 0\n');
            const previousBin = process.env.CHROME_BIN;
            const previousPath = process.env.PATH;
            try {
              process.env.CHROME_BIN = executable;
              process.env.PATH = '';
              assert.equal(locateChrome(), executable);
            } finally {
              if (previousBin === undefined) delete process.env.CHROME_BIN;
              else process.env.CHROME_BIN = previousBin;
              if (previousPath === undefined) delete process.env.PATH;
              else process.env.PATH = previousPath;
              fs.rmSync(directory, { recursive: true, force: true });
            }
          });

          test('CDPSession resolves successful command responses', async () => {
            const session = new CDPSession('ws://example.test');
            let outbound;
            session.webSocket = {
              readyState: 1,
              send(payload) { outbound = JSON.parse(payload); },
              close() {},
            };
            const pending = session.send('Runtime.enable', { enabled: true }, 1000);
            assert.equal(outbound.method, 'Runtime.enable');
            assert.deepEqual(outbound.params, { enabled: true });
            session.handleMessage({ data: JSON.stringify({ id: outbound.id, result: { accepted: true } }) });
            assert.deepEqual(await pending, { accepted: true });
          });

          test('CDPSession rejects protocol errors', async () => {
            const session = new CDPSession('ws://example.test');
            let outbound;
            session.webSocket = {
              readyState: 1,
              send(payload) { outbound = JSON.parse(payload); },
              close() {},
            };
            const pending = session.send('Page.fail', {}, 1000);
            session.handleMessage({ data: JSON.stringify({ id: outbound.id, error: { code: -1, message: 'Rejected' } }) });
            await assert.rejects(pending, /Rejected \(-1\)/);
          });

          test('CDPSession dispatches and unsubscribes one-shot waiters', async () => {
            const session = new CDPSession('ws://example.test');
            const pending = session.waitFor('Page.loadEventFired', 1000);
            session.dispatchEvent('Page.loadEventFired', { timestamp: 42 });
            assert.deepEqual(await pending, { timestamp: 42 });
            assert.equal(session.eventHandlers.get('Page.loadEventFired')?.size || 0, 0);
          });

          test('CDPSession.call serializes arguments into browser evaluation', async () => {
            const session = new CDPSession('ws://example.test');
            let expression = '';
            session.evaluate = async (value) => {
              expression = value;
              return 'ok';
            };
            const result = await session.call((first, second) => `${first}:${second}`, 'A', 2);
            assert.equal(result, 'ok');
            assert.match(expression, /\("A",2\)$/);
          });

          test('waitForChrome returns when the DevTools endpoint responds', async () => {
            const previousFetch = globalThis.fetch;
            let requested = '';
            try {
              globalThis.fetch = async (url) => {
                requested = String(url);
                return { ok: true };
              };
              await waitForChrome(9333);
              assert.equal(requested, 'http://127.0.0.1:9333/json/version');
            } finally {
              globalThis.fetch = previousFetch;
            }
          });

          test('createTarget sends PUT and returns target metadata', async () => {
            const previousFetch = globalThis.fetch;
            let invocation;
            try {
              globalThis.fetch = async (url, options) => {
                invocation = { url: String(url), options };
                return {
                  ok: true,
                  async json() { return { webSocketDebuggerUrl: 'ws://target' }; },
                };
              };
              assert.deepEqual(await createTarget(9444), { webSocketDebuggerUrl: 'ws://target' });
              assert.match(invocation.url, /^http:\/\/127\.0\.0\.1:9444\/json\/new\?/);
              assert.equal(invocation.options.method, 'PUT');
            } finally {
              globalThis.fetch = previousFetch;
            }
          });

          test('closeSession closes the page before the socket', async () => {
            const calls = [];
            await closeSession({
              async send(method, params, timeout) { calls.push(['send', method, params, timeout]); },
              closeSocket() { calls.push(['close']); },
            });
            assert.deepEqual(calls, [
              ['send', 'Page.close', {}, 3000],
              ['close'],
            ]);
            await closeSession(null);
          });
          EOF

          cat > sonar-project.properties <<'EOF'
          sonar.projectKey=Arisofia_nuvanx-siteground
          sonar.organization=arisofia
          sonar.projectName=NUVANX SiteGround
          sonar.sourceEncoding=UTF-8

          sonar.sources=wp-content,scripts
          sonar.tests=tests
          sonar.test.inclusions=tests/**
          sonar.javascript.lcov.reportPaths=coverage/js/lcov.info

          sonar.qualitygate.wait=true
          sonar.qualitygate.timeout=300

          # WordPress PHP uses snake_case function names and tabs by convention.
          # Keep all other PHP, JS, CSS and Web rules active.
          sonar.issue.ignore.multicriteria=wordpressFunctionNames,wordpressPhpTabs
          sonar.issue.ignore.multicriteria.wordpressFunctionNames.ruleKey=php:S100
          sonar.issue.ignore.multicriteria.wordpressFunctionNames.resourceKey=**/*.php
          sonar.issue.ignore.multicriteria.wordpressPhpTabs.ruleKey=php:S105
          sonar.issue.ignore.multicriteria.wordpressPhpTabs.resourceKey=**/*.php
          EOF

          cat > .github/workflows/sonar-ci.yml <<'EOF'
          name: SonarQube Cloud CI

          on:
            pull_request:
              branches:
                - master
            push:
              branches:
                - master
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: sonar-ci-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            coverage-and-analysis:
              runs-on: ubuntu-24.04
              env:
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                SONAR_CI_ENABLED: ${{ vars.SONAR_CI_ENABLED }}
              steps:
                - name: Checkout
                  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
                  with:
                    fetch-depth: 0
                    persist-credentials: false

                - name: Set up Node.js
                  uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
                  with:
                    node-version: 22

                - name: Run JavaScript tests with LCOV coverage
                  shell: bash
                  run: |
                    set -euo pipefail
                    mkdir -p coverage/js
                    node --test \
                      --experimental-test-coverage \
                      --test-coverage-include='scripts/staging2/visual-qa-common.mjs' \
                      --test-reporter=spec \
                      --test-reporter-destination=stdout \
                      --test-reporter=lcov \
                      --test-reporter-destination=coverage/js/lcov.info \
                      tests/js/visual-qa-common.test.mjs
                    test -s coverage/js/lcov.info
                    grep -Fq 'SF:' coverage/js/lcov.info
                    grep -Fq 'DA:' coverage/js/lcov.info

                - name: Upload coverage evidence
                  uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
                  with:
                    name: sonar-coverage-${{ github.run_id }}
                    path: coverage/js/lcov.info
                    retention-days: 14
                    if-no-files-found: error

                - name: Explain inactive Sonar CI scan
                  if: env.SONAR_TOKEN == '' || env.SONAR_CI_ENABLED != 'true'
                  shell: bash
                  run: |
                    echo 'LCOV coverage was generated successfully.'
                    echo 'Sonar scan is intentionally disabled until Automatic Analysis is disabled,'
                    echo 'SONAR_TOKEN is added, and repository variable SONAR_CI_ENABLED=true is set.'

                - name: SonarQube Cloud scan
                  if: env.SONAR_TOKEN != '' && env.SONAR_CI_ENABLED == 'true'
                  uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
                  env:
                    SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          EOF

      - name: Validate coverage and repository contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/js/visual-qa-common.test.mjs
          mkdir -p coverage/js
          node --test \
            --experimental-test-coverage \
            --test-coverage-include='scripts/staging2/visual-qa-common.mjs' \
            --test-reporter=spec \
            --test-reporter-destination=stdout \
            --test-reporter=lcov \
            --test-reporter-destination=coverage/js/lcov.info \
            tests/js/visual-qa-common.test.mjs
          test -s coverage/js/lcov.info
          grep -Fq 'SF:' coverage/js/lcov.info
          grep -Fq 'DA:' coverage/js/lcov.info
          node scripts/theme-hygiene/test-theme-hygiene.mjs
          node scripts/staging2/test-deploy-workflow-contract.mjs
          git diff --check

      - name: Commit permanent coverage pipeline
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/add-sonar-ci-coverage-once.yml
          rm -rf coverage
          git config user.name 'NUVANX Quality Automation'
          git config user.email 'admin@nuvanx.com'
          git add tests/js/visual-qa-common.test.mjs sonar-project.properties .github/workflows/sonar-ci.yml .github/workflows
          git diff --cached --check
          git commit -m 'test(quality): add Sonar CI coverage baseline'
          git push origin HEAD:refactor/sonar-duplication-20260731
