name: Temporary Staging2 style filter debug

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Configure SiteGround SSH
        env:
          SSH_HOST: ${{ secrets.STAGING2_SSH_HOST }}
          SSH_PORT_SECRET: ${{ secrets.STAGING2_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING2_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing STAGING2_SSH_HOST}"
          : "${SSH_USER:?Missing STAGING2_SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Missing STAGING2_SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing STAGING2_SSH_KNOWN_HOSTS}"
          SSH_PORT="${SSH_PORT_SECRET:-18765}"
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/siteground_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/siteground_key" "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host siteground-staging
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/siteground_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 15
          EOF
          chmod 600 "$HOME/.ssh/config"
      - name: Inspect final style_loader_tag output
        run: |
          set -euo pipefail
          ssh siteground-staging 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/home/customer/www/staging2.nuvanx.com/public_html
          DEBUG_PLUGIN="$ROOT/wp-content/mu-plugins/nvx-style-filter-debug.php"
          LOG=/tmp/nvx-style-filter-debug.log
          cat > "$DEBUG_PLUGIN" <<'PHP'
          <?php
          add_filter('style_loader_tag', static function ($html, $handle, $href, $media = ''): string {
              $line = 'STYLE_FILTER handle=' . $handle . ' href=' . $href . ' bytes=' . strlen((string) $html) . ' tag=' . str_replace(["\n","\r"], ' ', (string) $html);
              file_put_contents('/tmp/nvx-style-filter-debug.log', $line . "\n", FILE_APPEND);
              return (string) $html;
          }, PHP_INT_MAX, 4);
          add_action('wp_head', static function (): void {
              $s=wp_styles(); file_put_contents('/tmp/nvx-style-filter-debug.log', 'HEAD_LATE done=' . wp_json_encode($s->done) . "\n", FILE_APPEND);
          }, 99999);
          PHP
          rm -f "$LOG"
          cd "$ROOT"
          curl -ksS --resolve staging2.nuvanx.com:443:127.0.0.1 https://staging2.nuvanx.com/ -o /tmp/nvx-style-filter.html
          echo '--- STYLE FILTER LOG ---'
          cat "$LOG"
          echo '--- HTML CSS ---'
          python3 - <<'PY'
          import re
          s=open('/tmp/nvx-style-filter.html',encoding='utf8',errors='replace').read()
          styles=[x for x in re.findall(r'<link\\b[^>]*>',s,re.I) if re.search(r'rel=["\\\'][^"\\\']*stylesheet',x,re.I)]
          print('HTML_BYTES='+str(len(s)))
          print('STYLESHEET_TAGS='+str(len(styles)))
          print('NVX_BASE='+str('nvx-base.css' in s))
          PY
          rm -f "$DEBUG_PLUGIN" "$LOG"
          REMOTE
