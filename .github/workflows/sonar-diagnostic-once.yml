name: Sonar Diagnostics

on:
  push:
    branches: [fix/release-hardening-20260808]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to query'
        required: true
        default: 'master'
      project_key:
        description: 'Sonar project key'
        required: true
        default: 'Arisofia_nuvanx-siteground'

concurrency:
  group: sonar-diagnostic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Query quality gate status
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.branch || github.ref_name }}
          PROJECT_KEY: ${{ inputs.project_key || 'Arisofia_nuvanx-siteground' }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-all-errors --max-time 30 --retry-max-time 120 \
            -H "Authorization: Bearer ${SONAR_TOKEN}" \
            --get --data-urlencode "projectKey=${PROJECT_KEY}" \
            --data-urlencode "branch=${TARGET_BRANCH}" \
            "https://sonarcloud.io/api/qualitygates/project_status" \
            | python -m json.tool

      - name: Query duplication contributors
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.branch || github.ref_name }}
          PROJECT_KEY: ${{ inputs.project_key || 'Arisofia_nuvanx-siteground' }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          p=1
          while true; do
            curl -fsS --retry 3 --retry-all-errors --max-time 30 --retry-max-time 120 \
              -H "Authorization: Bearer ${SONAR_TOKEN}" \
              --get --data-urlencode "component=${PROJECT_KEY}" \
              --data-urlencode "branch=${TARGET_BRANCH}" \
              --data-urlencode "metricKeys=new_duplicated_lines_density,new_lines,new_duplicated_lines" \
              --data-urlencode "strategy=leaves" \
              --data-urlencode "ps=500" \
              --data-urlencode "p=$p" \
              "https://sonarcloud.io/api/measures/component_tree" -o "/tmp/tree_${p}.json"
            
            MORE=$(python -c "
import json
data=json.load(open('/tmp/tree_${p}.json',encoding='utf-8'))
print('1' if data.get('paging',{}).get('total',0) > int('${p}') * 500 else '0')
")
            if [ "$MORE" = "0" ]; then
              break
            fi
            p=$((p+1))
          done
          
          python - <<'PY'
          import json, sys
          import glob
          rows=[]
          for f in glob.glob('/tmp/tree_*.json'):
              data=json.load(open(f,encoding='utf-8'))
              for c in data.get('components', []):
                  vals={}
                  for measure in c.get('measures',[]):
                      periods=measure.get('periods') or []
                      vals[measure['metric']]=float(periods[0].get('value',0)) if periods else float(measure.get('value',0) or 0)
                  nl=vals.get('new_lines',0); nd=vals.get('new_duplicated_lines',0); dens=vals.get('new_duplicated_lines_density',0)
                  if nl or nd or dens:
                      rows.append((nd,dens,nl,c.get('path') or ''))
          print('DUPLICATION_CONTRIBUTORS')
          for nd,dens,nl,path in sorted(rows, reverse=True):
              print(json.dumps({'path':path,'new_lines':nl,'new_duplicated_lines':nd,'density':dens}, ensure_ascii=False))
          PY

      - name: Query security and reliability issues
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.branch || github.ref_name }}
          PROJECT_KEY: ${{ inputs.project_key || 'Arisofia_nuvanx-siteground' }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          for quality in SECURITY RELIABILITY; do
            p=1
            while true; do
              curl -fsS --retry 3 --retry-all-errors --max-time 30 --retry-max-time 120 \
                -H "Authorization: Bearer ${SONAR_TOKEN}" \
                --get --data-urlencode "componentKeys=${PROJECT_KEY}" \
                --data-urlencode "branch=${TARGET_BRANCH}" \
                --data-urlencode "resolved=false" \
                --data-urlencode "softwareQualities=${quality}" \
                --data-urlencode "ps=500" \
                --data-urlencode "p=$p" \
                "https://sonarcloud.io/api/issues/search" -o "/tmp/${quality}_${p}.json"
              
              MORE=$(python -c "
import json
data=json.load(open('/tmp/${quality}_${p}.json',encoding='utf-8'))
print('1' if data.get('total',0) > int('${p}') * 500 else '0')
")
              if [ "$MORE" = "0" ]; then
                break
              fi
              p=$((p+1))
            done
            
            QUALITY="$quality" python - <<'PY'
          import json, os, sys
          import glob
          quality=os.environ['QUALITY']
          total_issues = 0
          all_issues = []
          for f in glob.glob(f'/tmp/{quality}_*.json'):
              data=json.load(open(f,encoding='utf-8'))
              if total_issues == 0:
                  total_issues = data.get('total', 0)
              all_issues.extend(data.get('issues', []))
          print(quality, 'TOTAL', len(all_issues), '(Actual matches:', total_issues, ')')
          for issue in all_issues:
              impacts=issue.get('impacts') or []
              print(json.dumps({'rule':issue.get('rule'),'component':issue.get('component'),'line':issue.get('line'),'message':issue.get('message'),'impacts':impacts,'creationDate':issue.get('creationDate')},ensure_ascii=False))
          PY
          done

      - name: Query new-code quality metrics
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.branch || github.ref_name }}
          PROJECT_KEY: ${{ inputs.project_key || 'Arisofia_nuvanx-siteground' }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-all-errors --max-time 30 --retry-max-time 120 \
            -H "Authorization: Bearer ${SONAR_TOKEN}" \
            --get --data-urlencode "component=${PROJECT_KEY}" \
            --data-urlencode "branch=${TARGET_BRANCH}" \
            --data-urlencode "metricKeys=new_duplicated_lines_density,new_security_rating,new_reliability_rating,new_maintainability_rating,new_lines,new_duplicated_lines" \
            "https://sonarcloud.io/api/measures/component" \
            | python -m json.tool
