name: SEO Verification - Search Console & PageSpeed

on:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  group: seo-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pagespeed-mobile-audit:
    name: PageSpeed Mobile Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Audit Mobile PageSpeed & Core Web Vitals
        shell: bash
        env:
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY || secrets.GOOGLE_API_KEY }}
          BASE_URL: https://nuvanx.com
        run: |
          set -euo pipefail
          API_URL="https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=${BASE_URL}&strategy=mobile"
          if [[ -n "${PAGESPEED_API_KEY:-}" ]]; then
            API_URL="${API_URL}&key=${PAGESPEED_API_KEY}"
          else
            echo "::warning::No PageSpeed API key configured; using public endpoint."
          fi

          RESPONSE=$(curl -sSL --max-time 45 --retry 3 --retry-delay 2 "$API_URL" || true)
          if [[ -z "$RESPONSE" ]]; then
            echo "::warning::PageSpeed API returned no response. Detailed Lighthouse evidence is maintained separately."
            exit 0
          fi
          if echo "$RESPONSE" | jq -e '.error' >/dev/null 2>&1; then
            ERR_MSG=$(echo "$RESPONSE" | jq -r '.error.message // "API error"' 2>/dev/null || echo "API error")
            ERR_REASON=$(echo "$RESPONSE" | jq -r '.error.errors[0].reason // "unknown"' 2>/dev/null || echo "unknown")
            echo "::warning::PageSpeed API unavailable ($ERR_REASON): $ERR_MSG"
            exit 0
          fi

          SCORE=$(echo "$RESPONSE" | jq -r '.lighthouseResult.categories.performance.score // empty' 2>/dev/null || true)
          if [[ -n "$SCORE" ]]; then
            PCT=$(awk "BEGIN {print int($SCORE * 100)}")
            echo "PAGESPEED_MOBILE_PERFORMANCE_SCORE=$PCT"
            {
              echo '## PageSpeed Mobile Audit'
              echo "- Performance: ${PCT}/100"
              echo '- Laboratory signal only; use the reproducible Lighthouse matrix for optimization decisions.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::PageSpeed response contained no Lighthouse score."
          fi

  origin-seo-contract:
    name: Production SEO/GEO Origin Contract
    runs-on: ubuntu-latest
    needs: pagespeed-mobile-audit
    timeout-minutes: 30
    continue-on-error: true
    env:
      PROD_ROOT: /home/customer/www/nuvanx.com/public_html
      BASE_URL: https://nuvanx.com
      EXPECTED_HOST: nuvanx.com
    steps:
      - name: Checkout canonical audit tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validate audit script syntax
        run: bash -n scripts/production/seo-geo-origin-audit.sh

      - name: Configure strict production SSH authentication
        shell: bash
        env:
          HOST: ${{ secrets.PROD_SSH_HOST }}
          PORT: ${{ secrets.PROD_SSH_PORT }}
          USER: ${{ secrets.PROD_SSH_USER }}
          KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ -z "${HOST:-}" || -z "${USER:-}" || -z "${KEY:-}" || -z "${KH:-}" ]]; then
            echo "::warning::Production SSH secrets not configured; origin contract verification skipped."
            echo "ORIGIN_SEO_CONTRACT=SKIPPED_NO_SECRETS" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          SSH_PORT="${PORT:-18765}"
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/prod_seo_verification_key"; chmod 600 "$HOME/.ssh/prod_seo_verification_key"
          printf '%s\n' "$KH" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"

          cat > "$HOME/.ssh/config" <<EOF
          Host nvx-prod-seo-verification
            HostName $HOST
            User $USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/prod_seo_verification_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 20
            ConnectionAttempts 5
            ServerAliveInterval 30
            ServerAliveCountMax 2
          EOF
          chmod 600 "$HOME/.ssh/config"
          ssh -n nvx-prod-seo-verification "test -d '$PROD_ROOT' && test -f '$PROD_ROOT/wp-config.php' && command -v wp >/dev/null && command -v curl >/dev/null && command -v php >/dev/null"

      - name: Run blocking production SEO/GEO audit from origin network
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$HOME/.ssh/prod_seo_verification_key" ]]; then
            echo "::warning::SSH not configured; skipping origin audit execution."
            exit 0
          fi
          mkdir -p scripts/seo/artifacts
          ssh nvx-prod-seo-verification \
            "PROD_ROOT='$PROD_ROOT' BASE_URL='$BASE_URL' EXPECTED_HOST='$EXPECTED_HOST' bash -s" \
            < scripts/production/seo-geo-origin-audit.sh 2>&1 \
            | tee scripts/seo/artifacts/seo-geo-origin-audit.log

      - name: Export canonical sitemap URLs from origin network
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$HOME/.ssh/prod_seo_verification_key" ]]; then
            echo "::warning::SSH not configured; skipping origin sitemap export."
            exit 0
          fi
          mkdir -p scripts/seo/artifacts
          ssh nvx-prod-seo-verification "BASE_URL='$BASE_URL' bash -se" > scripts/seo/artifacts/sitemap-urls.txt <<'REMOTE'
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          ua='NUVANX-SEO-Verification-Origin/1.0'
          curl -fsSL --max-time 30 -A "$ua" "$BASE_URL/sitemap_index.xml" -o "$tmpdir/index.xml"
          grep -oE '<loc>[^<]+</loc>' "$tmpdir/index.xml" \
            | sed -E 's#</?loc>##g' \
            | sed 's/&lt;/</g; s/&gt;/>/g; s/&quot;/"/g; s/&#39;/'\''/g; s/&amp;/\&/g' \
            | grep -iE '\.xml(\.gz)?($|\?)' > "$tmpdir/children.txt" || true

          : > "$tmpdir/urls.txt"
          while IFS= read -r child; do
            [[ -n "$child" ]] || continue
            curl -fsSL --max-time 30 -A "$ua" "$child" 2>/dev/null \
              | grep -oE '<loc>[^<]+</loc>' \
              | sed -E 's#</?loc>##g' \
              | sed 's/&lt;/</g; s/&gt;/>/g; s/&quot;/"/g; s/&#39;/'\''/g; s/&amp;/\&/g' >> "$tmpdir/urls.txt" || true
          done < "$tmpdir/children.txt"

          escaped_base=$(printf '%s' "$BASE_URL" | sed 's/[.]/\\./g')
          sort -u "$tmpdir/urls.txt" | grep "^${escaped_base}/" || true
          REMOTE
          URL_COUNT=$(grep -c "^${BASE_URL}/" scripts/seo/artifacts/sitemap-urls.txt || true)
          if [[ "$URL_COUNT" -lt 1 ]]; then
            echo "::warning::Origin sitemap export returned zero URLs for base URL ${BASE_URL}"
          else
            echo "ORIGIN_SITEMAP_URLS=$URL_COUNT"
          fi

      - name: Upload origin SEO evidence
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: seo-origin-evidence-${{ github.run_id }}
          path: scripts/seo/artifacts/
          retention-days: 14
          if-no-files-found: warn

      - name: Destroy production SSH identity
        if: always()
        run: rm -f "$HOME/.ssh/prod_seo_verification_key" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"

  inspect-search-console-pages:
    name: Inspect Sitemap URLs via Search Console
    runs-on: ubuntu-latest
    needs: origin-seo-contract
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download origin URL evidence
        continue-on-error: true
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: seo-origin-evidence-${{ github.run_id }}
          path: scripts/seo/artifacts

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/seo/package-lock.json

      - name: Install SEO script dependencies
        run: npm ci --prefix scripts/seo

      - name: Inspect Search Console coverage
        shell: bash
        env:
          SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON: ${{ secrets.SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          SEARCH_CONSOLE_PROPERTY: ${{ secrets.SEARCH_CONSOLE_PROPERTY }}
          BASE_URL: https://nuvanx.com
        run: |
          set -euo pipefail
          CREDS="${SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON:-}"
          if [[ -z "$CREDS" || "$CREDS" == *"{{"* ]]; then
            echo "::warning::Search Console service-account JSON is not configured; URL Inspection skipped."
            echo "SEARCH_CONSOLE_INSPECTION=SKIPPED_NO_CREDENTIALS" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          SEARCH_PROP="${SEARCH_CONSOLE_PROPERTY:-https://nuvanx.com/}"
          printf '%s' "$CREDS" > scripts/seo/credentials.json
          trap 'rm -f scripts/seo/credentials.json' EXIT
          node scripts/seo/index-pages.js \
            --property "$SEARCH_PROP" \
            --url "$BASE_URL" \
            --urls-file scripts/seo/artifacts/sitemap-urls.txt \
            --max-urls 200 \
            | tee scripts/seo/artifacts/url-inspection.log

      - name: Upload Search Console inspection evidence
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: search-console-url-inspection-${{ github.run_id }}
          path: |
            scripts/seo/artifacts/indexing-results.json
            scripts/seo/artifacts/url-inspection.log
          if-no-files-found: warn
          retention-days: 14
