name: Sonar duplication audit once

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/sonar-duplication-audit-once.yml'
      - 'wp-content/themes/nuvanx-medical/inc/**'
      - 'scripts/staging2/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  duplicate-audit:
    if: github.head_ref == 'refactor/sonar-duplication-20260731' || github.ref_name == 'refactor/sonar-duplication-20260731'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Detect maximal structural duplicate blocks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee sonar-duplication-audit.txt
          from __future__ import annotations

          import hashlib
          import re
          from collections import defaultdict
          from pathlib import Path

          FILES = [
              'wp-content/themes/nuvanx-medical/inc/nvx-equipo-page.php',
              'wp-content/themes/nuvanx-medical/inc/nvx-navigation-filters.php',
              'wp-content/themes/nuvanx-medical/inc/nvx-structured-data.php',
              'wp-content/themes/nuvanx-medical/inc/nvx-endolaser-page.php',
              'wp-content/themes/nuvanx-medical/inc/nvx-btl-clinical-governance.php',
              'scripts/staging2/visual-qa-common.mjs',
              'wp-content/themes/nuvanx-medical/inc/nvx-aesthetic-medicine-page.php',
              'scripts/staging2/capture-visual-qa.mjs',
              'wp-content/themes/nuvanx-medical/inc/nvx-endolift-page.php',
              'wp-content/themes/nuvanx-medical/inc/nvx-content-presentation.php',
              'scripts/staging2/audit-full-site-ui.mjs',
          ]

          STRING_RE = re.compile(r'''(?:"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')''')
          NUMBER_RE = re.compile(r'(?<![A-Za-z_])\d+(?:\.\d+)?')
          VARIABLE_RE = re.compile(r'\$[A-Za-z_][A-Za-z0-9_]*')
          IDENTIFIER_RE = re.compile(r'\b[A-Za-z_][A-Za-z0-9_]*\b')
          WS_RE = re.compile(r'\s+')

          def normalize(line: str, mode: str) -> str:
              value = line.strip()
              if not value or value.startswith(('//', '#', '*', '/*', '*/')):
                  return ''
              value = STRING_RE.sub('STR', value)
              value = NUMBER_RE.sub('NUM', value)
              if mode in {'variables', 'shape'}:
                  value = VARIABLE_RE.sub('$VAR', value)
              if mode == 'shape':
                  protected = {
                      'array', 'function', 'return', 'if', 'else', 'elseif', 'foreach', 'for', 'while',
                      'true', 'false', 'null', 'new', 'static', 'const', 'class', 'extends', 'implements',
                      'async', 'await', 'const', 'let', 'var', 'throw', 'try', 'catch', 'finally', 'typeof',
                  }
                  value = IDENTIFIER_RE.sub(lambda match: match.group(0) if match.group(0) in protected else 'ID', value)
              return WS_RE.sub(' ', value)

          def logical_lines(path: Path, mode: str):
              rows = []
              for line_no, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  normalized = normalize(line, mode)
                  if normalized:
                      rows.append((line_no, normalized, line.strip()))
              return rows

          def maximal_blocks(mode: str, minimum: int = 8, maximum: int = 80):
              sequences = {
                  file_name: logical_lines(Path(file_name), mode)
                  for file_name in FILES
                  if Path(file_name).is_file()
              }
              first_line_index = defaultdict(list)
              for file_name, rows in sequences.items():
                  for index, row in enumerate(rows):
                      first_line_index[row[1]].append((file_name, index))

              grouped = defaultdict(set)
              for locations in first_line_index.values():
                  if len(locations) < 2:
                      continue
                  for left_pos in range(len(locations)):
                      left_file, left_index = locations[left_pos]
                      left_rows = sequences[left_file]
                      for right_pos in range(left_pos + 1, len(locations)):
                          right_file, right_index = locations[right_pos]
                          right_rows = sequences[right_file]
                          if left_file == right_file and abs(left_index - right_index) < minimum:
                              continue
                          if left_index > 0 and right_index > 0 and left_rows[left_index - 1][1] == right_rows[right_index - 1][1]:
                              continue
                          length = 0
                          while (
                              length < maximum
                              and left_index + length < len(left_rows)
                              and right_index + length < len(right_rows)
                              and left_rows[left_index + length][1] == right_rows[right_index + length][1]
                          ):
                              length += 1
                          if length < minimum:
                              continue
                          if left_file == right_file and left_index + length > right_index:
                              continue
                          signature = '\n'.join(row[1] for row in left_rows[left_index:left_index + length])
                          digest = hashlib.sha256(signature.encode()).hexdigest()
                          grouped[(length, digest)].update({(left_file, left_index), (right_file, right_index)})

              candidates = []
              for (length, _digest), locations in grouped.items():
                  if len(locations) < 2:
                      continue
                  candidates.append((length, sorted(locations)))
              candidates.sort(key=lambda item: (item[0], len(item[1])), reverse=True)

              accepted = []
              occupied = defaultdict(list)
              per_file_count = defaultdict(int)
              for length, locations in candidates:
                  useful = []
                  for file_name, start in locations:
                      end = start + length
                      if per_file_count[file_name] >= 8:
                          continue
                      if any(start >= old_start and end <= old_end for old_start, old_end in occupied[file_name]):
                          continue
                      useful.append((file_name, start))
                  if len(useful) < 2:
                      continue
                  accepted.append((length, useful))
                  for file_name, start in useful:
                      occupied[file_name].append((start, start + length))
                      per_file_count[file_name] += 1
                  if len(accepted) >= 50:
                      break

              print(f'=== {mode} maximal duplicate blocks ===')
              if not accepted:
                  print('No duplicate blocks found.')
                  return
              for cluster_no, (length, locations) in enumerate(accepted, 1):
                  print(f'\nCLUSTER {cluster_no}: logical_lines={length} occurrences={len(locations)}')
                  for file_name, start in locations:
                      rows = sequences[file_name]
                      print(f'- {file_name}:{rows[start][0]}-{rows[start + length - 1][0]}')
                  sample_file, sample_start = locations[0]
                  print('  sample:')
                  for row in sequences[sample_file][sample_start:sample_start + min(length, 14)]:
                      print(f'    {row[2]}')

          for mode in ('literal', 'variables', 'shape'):
              maximal_blocks(mode)
              print()
          PY

      - name: Upload duplicate report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sonar-duplication-audit
          path: sonar-duplication-audit.txt
          retention-days: 7
          if-no-files-found: error
