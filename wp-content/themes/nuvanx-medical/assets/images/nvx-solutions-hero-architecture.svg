<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Arquitectura de soluciones médicas NUVANX: diagnóstico individualizado, indicación proporcionada, seguimiento médico" focusable="false">
  <title>Arquitectura de soluciones médicas NUVANX</title>
  <desc>Diagrama que representa el proceso clínico de NUVANX: escucha, diagnóstico tisular, indicación y seguimiento, sin protocolos estandarizados ni catálogos de máquinas.</desc>

  <!-- Background -->
  <rect width="900" height="520" fill="#0a0f1a" rx="12"/>

  <!-- Subtle grid lines -->
  <g stroke="#1a2340" stroke-width="1" opacity="0.6">
    <line x1="0" y1="130" x2="900" y2="130"/>
    <line x1="0" y1="260" x2="900" y2="260"/>
    <line x1="0" y1="390" x2="900" y2="390"/>
    <line x1="225" y1="0" x2="225" y2="520"/>
    <line x1="450" y1="0" x2="450" y2="520"/>
    <line x1="675" y1="0" x2="675" y2="520"/>
  </g>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="900" height="3" fill="url(#accentGrad)" rx="1"/>

  <!-- Step connector line -->
  <line x1="112" y1="200" x2="788" y2="200" stroke="#1e3a5f" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- ── Step 01 ── -->
  <g>
    <!-- Node circle -->
    <circle cx="112" cy="200" r="36" fill="#0d1b2e" stroke="#1e4d8c" stroke-width="1.5"/>
    <circle cx="112" cy="200" r="28" fill="none" stroke="#2563eb" stroke-width="0.75" opacity="0.4"/>
    <!-- Index -->
    <text x="112" y="193" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#2563eb" letter-spacing="2" font-weight="600">01</text>
    <!-- Icon: ear/listen shape simplified -->
    <path d="M104 202 Q108 196 116 198 Q120 200 118 206 Q116 210 112 212 Q108 212 106 210" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Label -->
    <text x="112" y="254" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#93c5fd" letter-spacing="0.5" font-weight="600">ESCUCHAR</text>
    <text x="112" y="270" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#4b6a9b">EL MOTIVO</text>
  </g>

  <!-- ── Step 02 ── -->
  <g>
    <circle cx="337" cy="200" r="36" fill="#0d1b2e" stroke="#1e4d8c" stroke-width="1.5"/>
    <circle cx="337" cy="200" r="28" fill="none" stroke="#2563eb" stroke-width="0.75" opacity="0.4"/>
    <text x="337" y="193" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#2563eb" letter-spacing="2" font-weight="600">02</text>
    <!-- Icon: magnifier -->
    <circle cx="335" cy="203" r="6" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
    <line x1="339.5" y1="207.5" x2="343" y2="211" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
    <text x="337" y="254" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#93c5fd" letter-spacing="0.5" font-weight="600">EXPLORAR</text>
    <text x="337" y="270" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#4b6a9b">ANATOMÍA Y TEJIDO</text>
  </g>

  <!-- ── Step 03 ── -->
  <g>
    <circle cx="563" cy="200" r="36" fill="#0d1b2e" stroke="#1e4d8c" stroke-width="1.5"/>
    <circle cx="563" cy="200" r="28" fill="none" stroke="#2563eb" stroke-width="0.75" opacity="0.4"/>
    <text x="563" y="193" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#2563eb" letter-spacing="2" font-weight="600">03</text>
    <!-- Icon: split/fork -->
    <line x1="560" y1="199" x2="555" y2="205" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="560" y1="199" x2="555" y2="194" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="556" y1="199" x2="566" y2="199" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
    <text x="563" y="254" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#93c5fd" letter-spacing="0.5" font-weight="600">SEPARAR</text>
    <text x="563" y="270" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#4b6a9b">CAUSAS Y LÍMITES</text>
  </g>

  <!-- ── Step 04 ── -->
  <g>
    <circle cx="788" cy="200" r="36" fill="#0d1b2e" stroke="#1e4d8c" stroke-width="1.5"/>
    <circle cx="788" cy="200" r="28" fill="none" stroke="#2563eb" stroke-width="0.75" opacity="0.4"/>
    <text x="788" y="193" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#2563eb" letter-spacing="2" font-weight="600">04</text>
    <!-- Icon: document -->
    <rect x="781" y="196" width="12" height="14" rx="1.5" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
    <line x1="784" y1="201" x2="790" y2="201" stroke="#60a5fa" stroke-width="1" stroke-linecap="round"/>
    <line x1="784" y1="204" x2="790" y2="204" stroke="#60a5fa" stroke-width="1" stroke-linecap="round"/>
    <line x1="784" y1="207" x2="788" y2="207" stroke="#60a5fa" stroke-width="1" stroke-linecap="round"/>
    <text x="788" y="254" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#93c5fd" letter-spacing="0.5" font-weight="600">DOCUMENTAR</text>
    <text x="788" y="270" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#4b6a9b">EL PLAN CLÍNICO</text>
  </g>

  <!-- ── Principle cards (bottom) ── -->
  <!-- Card 1: Diagnóstico individual -->
  <g>
    <rect x="40" y="330" width="190" height="70" rx="8" fill="#0d1b2e" stroke="#1e3a5f" stroke-width="1"/>
    <rect x="40" y="330" width="190" height="2" rx="1" fill="#2563eb"/>
    <text x="135" y="356" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#93c5fd" font-weight="600">Diagnóstico individual</text>
    <text x="135" y="374" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#4b6a9b">Anatomía, tejido y antecedentes</text>
    <text x="135" y="389" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#4b6a9b">antes de cualquier indicación</text>
  </g>

  <!-- Card 2: Indicación proporcionada -->
  <g>
    <rect x="258" y="330" width="190" height="70" rx="8" fill="#0d1b2e" stroke="#1e3a5f" stroke-width="1"/>
    <rect x="258" y="330" width="190" height="2" rx="1" fill="#2563eb"/>
    <text x="353" y="356" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#93c5fd" font-weight="600">Indicación proporcionada</text>
    <text x="353" y="374" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#4b6a9b">Tecnología con evidencia CE</text>
    <text x="353" y="389" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#4b6a9b">nunca por tendencia</text>
  </g>

  <!-- Card 3: Seguimiento médico -->
  <g>
    <rect x="476" y="330" width="190" height="70" rx="8" fill="#0d1b2e" stroke="#1e3a5f" stroke-width="1"/>
    <rect x="476" y="330" width="190" height="2" rx="1" fill="#2563eb"/>
    <text x="571" y="356" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#93c5fd" font-weight="600">Seguimiento médico</text>
    <text x="571" y="374" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#4b6a9b">Monitorización celular</text>
    <text x="571" y="389" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#4b6a9b">a corto, medio y largo plazo</text>
  </g>

  <!-- Card 4: Transparencia -->
  <g>
    <rect x="694" y="330" width="176" height="70" rx="8" fill="#0d1b2e" stroke="#1e3a5f" stroke-width="1"/>
    <rect x="694" y="330" width="176" height="2" rx="1" fill="#2563eb"/>
    <text x="782" y="356" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#93c5fd" font-weight="600">Transparencia total</text>
    <text x="782" y="374" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#4b6a9b">Presupuesto cerrado y protocolo</text>
    <text x="782" y="389" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#4b6a9b">firmado antes del procedimiento</text>
  </g>

  <!-- ── Header text ── -->
  <text x="450" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#2563eb" letter-spacing="4" font-weight="600">NUVANX MEDICINA ESTÉTICA LÁSER · MADRID</text>
  <text x="450" y="95" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#e2e8f0" letter-spacing="-0.5" font-weight="300">Arquitectura clínica de soluciones médicas</text>
  <text x="450" y="118" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#4b6a9b">Diagnóstico individual · Indicación proporcionada · Seguimiento médico</text>

  <!-- ── Footer ── -->
  <text x="450" y="468" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#2a3a5c" letter-spacing="1">Chamberí CS20144 · Salamanca/Goya CS20073 · nuvanx.com</text>
  <line x1="100" y1="456" x2="800" y2="456" stroke="#1a2340" stroke-width="1"/>

  <!-- Gradient definition -->
  <defs>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>

  <!-- Connector arrows -->
  <g fill="#2563eb" opacity="0.7">
    <!-- Arrow 01→02 -->
    <polygon points="218,196 228,200 218,204"/>
    <!-- Arrow 02→03 -->
    <polygon points="443,196 453,200 443,204"/>
    <!-- Arrow 03→04 -->
    <polygon points="669,196 679,200 669,204"/>
  </g>

</svg>
