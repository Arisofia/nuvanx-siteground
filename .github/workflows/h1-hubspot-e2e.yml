name: H1 HubSpot Attribution E2E

on:
  push:
    branches:
      - audit/h1-hubspot-e2e-20260809-1510
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h1-hubspot-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  h1-e2e:
    name: H1 production HubSpot attribution E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c08020d05da54fe8137545ad # v4.1.0
        with:
          node-version: '22'

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp-h1
          cd tmp-h1
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund playwright@1.54.2
          npx --no-install playwright install --with-deps chromium

      - name: Run H1 E2E against production
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/h1-hubspot-e2e.mjs tmp-h1/e2e.mjs
          cd tmp-h1
          node e2e.mjs 2>&1 | tee h1-e2e.log

      - name: Upload H1 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: h1-hubspot-e2e-pr432
          path: tmp-h1/h1-e2e.log
          retention-days: 7
