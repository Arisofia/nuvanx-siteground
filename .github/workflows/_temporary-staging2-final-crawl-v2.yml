name: Temporary Staging2 final sitemap crawl v3

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  crawl:
    if: startsWith(github.head_ref, 'ops/staging2-sitemap-crawl-contract-v3') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Configure SiteGround SSH
        env:
          SSH_HOST: ${{ secrets.STAGING2_SSH_HOST }}
          SSH_PORT_SECRET: ${{ secrets.STAGING2_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING2_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing STAGING2_SSH_HOST}"
          : "${SSH_USER:?Missing STAGING2_SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Missing STAGING2_SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing STAGING2_SSH_KNOWN_HOSTS}"
          SSH_PORT="${SSH_PORT_SECRET:-18765}"
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/siteground_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/siteground_key" "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host siteground-staging
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/siteground_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 15
          EOF
          chmod 600 "$HOME/.ssh/config"
      - name: Verify deployed SHA before crawl
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid expected base SHA.' >&2; exit 1; }
          deployed_sha="$(ssh siteground-staging "tr -d '\\r\\n' < '/home/customer/www/staging2.nuvanx.com/public_html/wp-content/themes/nuvanx-medical/.nvx-deploy-sha'" 2>/dev/null || true)"
          if [[ "$deployed_sha" != "$EXPECTED_SHA" ]]; then
            echo "STAGING2_STALE: expected=$EXPECTED_SHA deployed=${deployed_sha:-<missing>}" >&2
            echo 'Deploy the current master SHA to staging2 before running the final route crawl.' >&2
            exit 3
          fi
          echo "STAGING2_DEPLOYED_SHA=$deployed_sha"
      - name: Crawl canonical sitemap routes at SiteGround origin
        run: |
          set -euo pipefail
          mkdir -p evidence
          ssh siteground-staging 'bash -se' > evidence/crawl.log 2>&1 <<'REMOTE'
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from html import unescape
          from html.parser import HTMLParser
          from urllib.parse import urljoin

          BASE = 'https://staging2.nuvanx.com/'
          RESOLVE = ['--resolve', 'staging2.nuvanx.com:443:127.0.0.1']
          HTTP_MARKER = '__NVX_HTTP_STATUS__'

          class HtmlContractParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.h1 = 0
                  self.main = 0
                  self.stylesheets = 0
                  self.nvx_base = 0

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  tag = tag.lower()
                  if tag == 'h1':
                      self.h1 += 1
                  elif tag == 'main':
                      self.main += 1
                  elif tag == 'link':
                      rel = {item.lower() for item in (attrs.get('rel') or '').split()}
                      href = attrs.get('href') or ''
                      if 'stylesheet' in rel:
                          self.stylesheets += 1
                          if 'nvx-base.css' in href:
                              self.nvx_base += 1

          def fetch(url):
              proc = subprocess.run(
                  ['curl', '-ksS', '-L', '--max-time', '25', *RESOLVE, '--write-out', HTTP_MARKER + '%{http_code}', url],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  check=False,
              )
              if HTTP_MARKER not in proc.stdout:
                  raise RuntimeError(f'No HTTP status returned for {url}: {proc.stderr.strip()}')
              body, status_text = proc.stdout.rsplit(HTTP_MARKER, 1)
              try:
                  status = int(status_text)
              except ValueError as exc:
                  raise RuntimeError(f'Invalid HTTP status for {url}: {status_text!r}') from exc
              if proc.returncode != 0:
                  raise RuntimeError(f'curl failed for {url}: exit={proc.returncode} status={status}')
              return status, body

          status, index = fetch(urljoin(BASE, 'wp-sitemap.xml'))
          if status != 200:
              raise SystemExit(f'wp-sitemap.xml returned HTTP {status}')

          sitemap_locs = []
          marker = '<loc>'
          lower_index = index.lower()
          start = 0
          while True:
              left = lower_index.find(marker, start)
              if left < 0:
                  break
              right = lower_index.find('</loc>', left)
              if right < 0:
                  break
              sitemap_locs.append(unescape(index[left + len(marker):right].strip()))
              start = right + 6

          urls = []
          for sitemap in sitemap_locs:
              status, body = fetch(sitemap)
              if status != 200:
                  raise SystemExit(f'{sitemap} returned HTTP {status}')
              lower_body = body.lower()
              start = 0
              while True:
                  left = lower_body.find(marker, start)
                  if left < 0:
                      break
                  right = lower_body.find('</loc>', left)
                  if right < 0:
                      break
                  urls.append(unescape(body[left + len(marker):right].strip()))
                  start = right + 6

          urls.append(BASE)
          urls = sorted(set(urls))
          results = []

          for url in urls:
              try:
                  status, body = fetch(url)
                  parser = HtmlContractParser()
                  parser.feed(body)
                  parser.close()
                  h1 = parser.h1 > 0
                  main = parser.main > 0
                  css = parser.stylesheets > 0
                  base = parser.nvx_base > 0
                  ok = status == 200 and h1 and main and css and base
              except Exception as exc:
                  status = 0
                  body = ''
                  h1 = main = css = base = False
                  ok = False
                  print(f'ERROR url={url} error={exc}')
              results.append({
                  'url': url,
                  'status': status,
                  'h1': h1,
                  'main': main,
                  'css': css,
                  'nvx_base': base,
                  'ok': ok,
                  'bytes': len(body),
              })

          print('SITEMAPS=' + str(len(sitemap_locs)))
          print('ROUTES=' + str(len(results)))
          print('PASS=' + str(sum(r['ok'] for r in results)))
          print('FAIL=' + str(sum(not r['ok'] for r in results)))
          for result in results:
              print(json.dumps(result, ensure_ascii=False))

          with open('/tmp/staging2-final-crawl.json', 'w', encoding='utf-8') as handle:
              json.dump(results, handle, ensure_ascii=False, indent=2)

          if not results or any(not r['ok'] for r in results):
              raise SystemExit(2)
          PY
          REMOTE
          scp siteground-staging:/tmp/staging2-final-crawl.json evidence/staging2-final-crawl.json
          printf '%s\n' 'FINAL_SITEMAP_CRAWL_OK' > evidence/status.txt
      - name: Upload final crawl evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging2-final-sitemap-crawl-${{ github.run_id }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error