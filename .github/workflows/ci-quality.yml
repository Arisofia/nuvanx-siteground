name: Code Quality (Lint)

permissions:
  contents: read

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ci-quality-${{ github.ref }}
  cancel-in-progress: true

# SonarCloud analysis runs via SonarCloud Automatic Analysis (the "SonarCloud Code
# Analysis" check), not a CI scanner job here: SonarCloud rejects CI-based analysis
# while Automatic Analysis is enabled ("Not authorized or project not found").
jobs:
  lint:
    name: PHP Syntax Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: parallel-lint
      - name: Run PHP Parallel Lint
        run: |
          parallel-lint --exclude vendor --exclude node_modules .

  phpcs:
    name: PHP_CodeSniffer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer, phpcs
      - name: Install dependencies
        run: |
          cd wp-content/themes/nuvanx-medical
          composer install --no-interaction
      - name: Run PHPCS
        run: |
          cd wp-content/themes/nuvanx-medical
          ./vendor/bin/phpcs --standard=phpcs.xml.dist --report=summary

  phpstan:
    name: PHPStan Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer, phpstan
      - name: Install dependencies
        run: |
          cd wp-content/themes/nuvanx-medical
          composer install --no-interaction
      - name: PHPStan info
        run: |
          cd wp-content/themes/nuvanx-medical
          ./vendor/bin/phpstan --version
          echo "Analyzing these files:"
          git ls-files wp-content/themes/nuvanx-medical | sed -n '1,200p'
      - name: Run PHPStan (produce report artifact)
        run: |
          cd wp-content/themes/nuvanx-medical
          # run with higher memory in case of memory issues and produce a text report
          ./vendor/bin/phpstan analyse --configuration=phpstan.neon --error-format=table --no-progress --memory-limit=2G | tee phpstan-report.txt
      - name: Upload PHPStan report
        uses: actions/upload-artifact@v4
        with:
          name: phpstan-report
          path: wp-content/themes/nuvanx-medical/phpstan-report.txt
