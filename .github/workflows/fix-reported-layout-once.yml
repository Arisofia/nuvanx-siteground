name: Fix Reported Layout Once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/fix-reported-layout-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true
      - name: Patch equipo staff layout and preserve valoracion-first invariant
        shell: bash
        run: |
          set -euo pipefail
          css='wp-content/themes/nuvanx-medical/assets/css/nvx-components.css'
          marker='NVX reported equipo staff grid fix 2026-08-08'
          if ! grep -Fq "$marker" "$css"; then
            printf '\n' >> "$css"
            printf '%s' '' | base64 -d >> "$css"
          fi
          grep -Fq '.nvx-equipo-staff-grid {' "$css"
          grep -Fq "add_filter( 'the_content', 'nvx_valoracion_form_first'" wp-content/themes/nuvanx-medical/inc/nvx-hero-and-forms.php
          git diff --check
          git add "$css"
          if git diff --cached --quiet; then
            echo 'No patch needed.'
            exit 0
          fi
          git config user.name 'NUVANX Ops'
          git config user.email 'ops@nuvanx.invalid'
          git commit -m 'fix(ui): restore equipo staff card grid'
          git push origin HEAD:master
