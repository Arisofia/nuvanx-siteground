name: Pre-Merge Protection

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment (merge or promotion)
        required: true
        default: merge
        type: choice
        options:
          - merge
          - promotion

jobs:
  pre-merge-protection:
    name: Pre-Merge Protection Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, json, dom

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm ci
          composer install --no-interaction

      - name: Run pre-merge protection
        env:
          ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'merge' }}
        run: bash scripts/ci/pre-merge-protection.sh "${ENVIRONMENT}"

      - name: Upload protection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-merge-protection-report
          path: |
            scripts/staging2/artifacts/*.json
            scripts/production/artifacts/*.json
          retention-days: 7