name: Run legacy catalog extractor once

on:
  pull_request:
    branches:
      - master
    paths:
      - scripts/theme-hygiene/externalize-legacy-catalogs-once.php
      - .github/workflows/tmp-run-legacy-catalog-extractor.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/sonar-legacy-duplication-phase2-20260731
          fetch-depth: 0
          persist-credentials: true

      - name: Extract catalog data
        run: php scripts/theme-hygiene/externalize-legacy-catalogs-once.php

      - name: Add persistent JSON contract
        shell: bash
        run: |
          cat > scripts/theme-hygiene/test-catalog-json-contract.php <<'PHP'
          <?php
          declare(strict_types=1);

          $dataDir = dirname(__DIR__, 2) . '/wp-content/themes/nuvanx-medical/inc/data';
          $expectations = array(
              'aesthetic-treatment-pages.json' => array('lips_ha', 'rhinomodeling_ha', 'tear_trough_ha'),
              'btl-detail-pages.json' => array('exion-face', 'exion-body', 'exion-fractional', 'emfusion'),
              'faq-catalog.json' => array(0),
              'treatments-catalog.json' => array(0),
          );

          foreach ($expectations as $filename => $requiredKeys) {
              $path = $dataDir . '/' . $filename;
              if (!is_readable($path)) {
                  fwrite(STDERR, "Missing catalog: {$filename}\n");
                  exit(1);
              }

              $decoded = json_decode((string) file_get_contents($path), true, 512, JSON_THROW_ON_ERROR);
              if (!is_array($decoded) || $decoded === array()) {
                  fwrite(STDERR, "Empty catalog: {$filename}\n");
                  exit(1);
              }

              foreach ($requiredKeys as $key) {
                  if (!array_key_exists($key, $decoded)) {
                      fwrite(STDERR, "Missing key {$key} in {$filename}\n");
                      exit(1);
                  }
              }
          }

          echo "Catalog JSON contract passed.\n";
          PHP

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          php -l wp-content/themes/nuvanx-medical/inc/nvx-catalog-json.php
          php -l wp-content/themes/nuvanx-medical/inc/nvx-aesthetic-treatment-pages.php
          php -l wp-content/themes/nuvanx-medical/inc/nvx-btl-detail-pages.php
          php -l wp-content/themes/nuvanx-medical/inc/nvx-faq-catalog.php
          php -l wp-content/themes/nuvanx-medical/inc/nvx-treatments-catalog.php
          php scripts/theme-hygiene/test-catalog-json-contract.php
          node scripts/theme-hygiene/audit-v3.mjs

      - name: Commit generated catalogs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-externalize-legacy-catalogs.yml
          git rm .github/workflows/tmp-run-legacy-catalog-extractor.yml
          git rm scripts/theme-hygiene/externalize-legacy-catalogs-once.php
          git add wp-content/themes/nuvanx-medical/inc/nvx-catalog-json.php \
                  wp-content/themes/nuvanx-medical/inc/data \
                  wp-content/themes/nuvanx-medical/inc/nvx-aesthetic-treatment-pages.php \
                  wp-content/themes/nuvanx-medical/inc/nvx-btl-detail-pages.php \
                  wp-content/themes/nuvanx-medical/inc/nvx-faq-catalog.php \
                  wp-content/themes/nuvanx-medical/inc/nvx-treatments-catalog.php \
                  scripts/theme-hygiene/test-catalog-json-contract.php
          git commit -m "refactor(quality): externalize duplicated catalog data"
          git push origin HEAD:refactor/sonar-legacy-duplication-phase2-20260731
