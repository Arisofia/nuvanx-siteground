name: Fix final Sonar PR issue v2 once

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/fix-final-sonar-pr-issue-v2-once.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'refactor/sonar-duplication-20260731'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/sonar-duplication-20260731
          fetch-depth: 0

      - name: Add explicit default treatment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          target = Path('wp-content/themes/nuvanx-medical/inc/nvx-clinics-hub.php')
          source = target.read_text(encoding='utf-8')
          pattern = re.compile(
              r"(?P<case_indent>^[ \t]*)case 'primary':\n"
              r"(?P=case_indent)    nvxClinicsSetBrandButton\( \$link, 'primary' \);\n"
              r"(?P=case_indent)    break;\n"
              r"(?P<switch_indent>^[ \t]*)\}",
              re.MULTILINE,
          )

          def replacement(match):
              case_indent = match.group('case_indent')
              switch_indent = match.group('switch_indent')
              return (
                  f"{case_indent}case 'primary':\n"
                  f"{case_indent}    nvxClinicsSetBrandButton( $link, 'primary' );\n"
                  f"{case_indent}    break;\n"
                  f"{case_indent}default:\n"
                  f"{case_indent}    // No treatment means the existing link presentation is already appropriate.\n"
                  f"{case_indent}    break;\n"
                  f"{switch_indent}}}"
              )

          source, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'CTA switch tails transformed={count}')
          target.write_text(source, encoding='utf-8')
          PY

      - name: Validate final Sonar fix
        shell: bash
        run: |
          set -euo pipefail
          php -l wp-content/themes/nuvanx-medical/inc/nvx-clinics-hub.php
          php scripts/theme-hygiene/test-nvx-callable-contract.php
          node scripts/theme-hygiene/test-theme-hygiene.mjs
          node scripts/theme-hygiene/test-canonical-route-contract.mjs
          node scripts/staging2/test-deploy-workflow-contract.mjs
          git diff --check

      - name: Commit validated change
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-final-sonar-pr-issue-once.yml
          rm -f .github/workflows/fix-final-sonar-pr-issue-v2-once.yml
          git config user.name 'NUVANX Quality Automation'
          git config user.email 'admin@nuvanx.com'
          git add wp-content/themes/nuvanx-medical/inc/nvx-clinics-hub.php .github/workflows
          git diff --cached --check
          git commit -m 'fix(quality): handle unclassified clinic CTA explicitly'
          git push origin HEAD:refactor/sonar-duplication-20260731
