name: Staging2 Candidate Once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/staging2-candidate-once.yml

permissions:
  contents: read

jobs:
  deploy_candidate:
    uses: ./.github/workflows/deploy-staging2.yml
    with:
      sha: 4775310be2b7dcdda18f8fd6de8e40041c2eb555
      run_block_c_acceptance: true
    secrets: inherit
