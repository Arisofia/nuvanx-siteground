name: TEMP Build Google Attribution Final V3

on:
  push:
    branches:
      - automation/build-google-attribution-final-v3-20260808

permissions:
  contents: read

concurrency:
  group: tmp-build-google-attribution-final-v3
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout base legacy patch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: automation/apply-legacy-attribution-20260808
          path: patch1
          persist-credentials: false
      - name: Checkout consent hardening patch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: automation/fix-legacy-attribution-review-20260808
          path: patch2
          persist-credentials: false
      - name: Checkout final field patch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: automation/build-google-attribution-final-v3-20260808
          path: patch3
          persist-credentials: false
      - name: Checkout clean target
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/google-attribution-final-v3-20260808
          path: target
          fetch-depth: 0
          persist-credentials: false
      - name: Build deterministic final candidate
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s/^legacy = r'''/legacy = '''/" patch1/scripts/tmp_apply_legacy_attribution.py
          python3 patch1/scripts/tmp_apply_legacy_attribution.py target
          python3 patch2/scripts/tmp_fix_legacy_attribution_review.py target
          python3 patch3/scripts/tmp_fix_prefixed_hubspot_fields.py target

          node --check target/wp-content/themes/nuvanx-medical/assets/js/nvx-conversion-events.js
          node --check target/wp-content/themes/nuvanx-medical/assets/js/nvx-runtime-governance.js
          grep -Fq 'NUVANXGoogleAttributionLegacy' target/wp-content/themes/nuvanx-medical/assets/js/nvx-conversion-events.js
          grep -Fq 'legacyFieldInput' target/wp-content/themes/nuvanx-medical/assets/js/nvx-conversion-events.js
          grep -Fq '0-1/' target/wp-content/themes/nuvanx-medical/assets/js/nvx-conversion-events.js
          grep -Fq 'concealLegacyTrackingField' target/wp-content/themes/nuvanx-medical/assets/js/nvx-conversion-events.js
          grep -Fq 'onBeforeFormSubmit' target/wp-content/themes/nuvanx-medical/assets/js/nvx-runtime-governance.js
          grep -Fq 'forms/v2.js' target/wp-content/themes/nuvanx-medical/assets/js/nvx-runtime-governance.js
          if grep -Fq 'forms/embed/' target/wp-content/themes/nuvanx-medical/assets/js/nvx-runtime-governance.js; then
            echo 'Unexpected modern embed URL.' >&2
            exit 1
          fi

          cd target
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            'wp-content/themes/nuvanx-medical/assets/js/nvx-conversion-events.js' \
            'wp-content/themes/nuvanx-medical/assets/js/nvx-runtime-governance.js' | sort)"
          test "$changed" = "$expected"
      - name: Upload deterministic final candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: google-attribution-final-v3
          path: |
            target/wp-content/themes/nuvanx-medical/assets/js/nvx-conversion-events.js
            target/wp-content/themes/nuvanx-medical/assets/js/nvx-runtime-governance.js
