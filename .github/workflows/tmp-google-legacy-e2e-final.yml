name: TEMP Google Legacy Attribution E2E Final

on:
  push:
    branches:
      - audit/google-legacy-e2e-final-20260808
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Optional deployed build SHA to assert against staging2 (leave empty to skip)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/staging2/package-lock.json
      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          cd scripts/staging2
          npm ci --ignore-scripts
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Execute real legacy HubSpot attribution E2E on Staging2
        shell: bash
        env:
          BASE_URL: https://staging2.nuvanx.com
          FORM_ID: 5042522a-0bc5-4381-ac3e-5aee8649b69c
          # Leave empty on push so a staging2 redeploy never freezes this check to one build.
          # Provide a full SHA via workflow_dispatch to assert against a specific deploy.
          EXPECTED_SHA: ${{ github.event.inputs.expected_sha }}
          QA_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cd scripts/staging2
          node google-legacy-attribution-e2e.mjs
