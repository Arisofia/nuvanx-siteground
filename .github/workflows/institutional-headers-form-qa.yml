name: Institutional Headers and Form QA

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - '.github/workflows/institutional-headers-form-qa.yml'
      - 'scripts/staging2/audit-institutional-headers-form-v3.mjs'
      - 'scripts/staging2/institutional-qa-external-assets-preload.mjs'
      - 'scripts/staging2/visual-qa-common.mjs'
      - 'scripts/staging2/visual-qa-edge-preload.mjs'
      - 'wp-content/mu-plugins/nuvanx-valoracion-native-hubspot-form.php'
      - 'wp-content/themes/nuvanx-medical/**'

concurrency:
  group: institutional-headers-form-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  institutional-qa:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      contains(github.event.pull_request.labels.*.name, 'deploy-staging2') &&
      (github.event.action != 'labeled' || github.event.label.name == 'deploy-staging2')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_URL: https://staging2.nuvanx.com
      EVIDENCE_DIR: institutional-headers-form-evidence
      WP_ROOT: /home/customer/www/staging2.nuvanx.com/public_html
    steps:
      - name: Check out immutable PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Validate QA and MU-plugin syntax
        run: |
          set -euo pipefail
          node --check scripts/staging2/audit-institutional-headers-form-v3.mjs
          node --check scripts/staging2/institutional-qa-external-assets-preload.mjs
          php -l wp-content/mu-plugins/nuvanx-valoracion-native-hubspot-form.php

      - name: Configure strict SiteGround SSH
        env:
          STAGING2_SSH_HOST: ${{ secrets.STAGING2_SSH_HOST }}
          STAGING2_SSH_PORT: ${{ secrets.STAGING2_SSH_PORT }}
          STAGING2_SSH_USER: ${{ secrets.STAGING2_SSH_USER }}
          STAGING2_SSH_PRIVATE_KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          STAGING2_SSH_KNOWN_HOSTS: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${STAGING2_SSH_HOST:?Missing STAGING2_SSH_HOST secret}"
          : "${STAGING2_SSH_USER:?Missing STAGING2_SSH_USER secret}"
          : "${STAGING2_SSH_PRIVATE_KEY:?Missing STAGING2_SSH_PRIVATE_KEY secret}"
          : "${STAGING2_SSH_KNOWN_HOSTS:?Missing STAGING2_SSH_KNOWN_HOSTS secret}"
          SSH_PORT="${STAGING2_SSH_PORT:-18765}"
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$STAGING2_SSH_PRIVATE_KEY" > "$HOME/.ssh/staging2_key"
          printf '%s\n' "$STAGING2_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/staging2_key" "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx-staging2
            HostName $STAGING2_SSH_HOST
            User $STAGING2_SSH_USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/staging2_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 2
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Wait for exact staging2 PR SHA
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if ! deployed="$(ssh nvx-staging2 "test -f '$WP_ROOT/wp-content/themes/nuvanx-medical/.nvx-deploy-sha' && tr -d '\\r\\n' < '$WP_ROOT/wp-content/themes/nuvanx-medical/.nvx-deploy-sha' || true")"; then
              echo "SSH transport unavailable while waiting for $EXPECTED_SHA; attempt=$attempt" >&2
              sleep 5
              continue
            fi
            if [[ "$deployed" == "$EXPECTED_SHA" ]]; then
              echo "Exact staging2 PR SHA ready: $deployed"
              exit 0
            fi
            echo "Waiting for $EXPECTED_SHA; current=${deployed:-absent}; attempt=$attempt"
            sleep 5
          done
          echo "Timed out waiting for exact staging2 PR SHA $EXPECTED_SHA" >&2
          exit 1

      - name: Install governed valoración MU plugin
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          remote_tmp="$WP_ROOT/wp-content/.nuvanx-valoracion-form-${GITHUB_RUN_ID}.php"
          live="$WP_ROOT/wp-content/mu-plugins/nuvanx-valoracion-native-hubspot-form.php"
          backup="/home/customer/backups-nuvanx/staging2/pre-valoracion-form-${GITHUB_RUN_ID}"
          rsync -az wp-content/mu-plugins/nuvanx-valoracion-native-hubspot-form.php "nvx-staging2:$remote_tmp"
          ssh nvx-staging2 "bash -s -- '$WP_ROOT' '$remote_tmp' '$live' '$backup'" <<'REMOTE' | tee "$EVIDENCE_DIR/mu-plugin-install.log"
          set -Eeuo pipefail
          wp_root="$1"
          source_file="$2"
          live_file="$3"
          backup_dir="$4"
          rollback_required=0
          rollback() {
            code=$?
            trap - ERR
            set +e
            if [[ "$rollback_required" -eq 1 ]]; then
              if [[ -f "$backup_dir/plugin.php" ]]; then
                install -m 0644 "$backup_dir/plugin.php" "$live_file"
              else
                rm -f "$live_file"
              fi
            fi
            rm -f "$source_file"
            exit "$code"
          }
          trap rollback ERR
          [[ "$wp_root" == '/home/customer/www/staging2.nuvanx.com/public_html' ]]
          php -l "$source_file"
          mkdir -p "$backup_dir"
          chmod 700 "$backup_dir"
          if [[ -f "$live_file" ]]; then
            cp -p "$live_file" "$backup_dir/plugin.php"
            chmod 600 "$backup_dir/plugin.php"
          fi
          rollback_required=1
          install -m 0644 "$source_file" "$live_file"
          php -l "$live_file"
          rm -f "$source_file"
          cd "$wp_root"
          wp cache flush || true
          wp sg purge || true
          echo "STAGING2_VALORACION_MU_PLUGIN_OK backup=$backup_dir"
          REMOTE
          grep -Fq 'STAGING2_VALORACION_MU_PLUGIN_OK' "$EVIDENCE_DIR/mu-plugin-install.log"

      - name: Audit institutional headers and HubSpot form
        env:
          NODE_OPTIONS: >-
            --import=${{ github.workspace }}/scripts/staging2/visual-qa-edge-preload.mjs
            --import=${{ github.workspace }}/scripts/staging2/institutional-qa-external-assets-preload.mjs
        run: |
          set -euo pipefail
          node scripts/staging2/audit-institutional-headers-form-v3.mjs \
            2>&1 | tee "$EVIDENCE_DIR/qa.log"
          grep -Fq 'INSTITUTIONAL_HEADERS_FORM_QA_V3_OK' "$EVIDENCE_DIR/qa.log"

      - name: Restore governed valoración MU plugin
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          cleanup_log="$EVIDENCE_DIR/mu-plugin-cleanup.log"
          live="$WP_ROOT/wp-content/mu-plugins/nuvanx-valoracion-native-hubspot-form.php"
          backup_root="/home/customer/backups-nuvanx/staging2"
          backup="$backup_root/pre-valoracion-form-${GITHUB_RUN_ID}"

          if [[ ! -f "$HOME/.ssh/config" ]]; then
            echo "STAGING2_VALORACION_MU_PLUGIN_CLEANUP_SKIPPED reason=ssh-not-configured" | tee "$cleanup_log"
            exit 0
          fi

          ssh nvx-staging2 "bash -s -- '$WP_ROOT' '$live' '$backup' '$backup_root'" <<'REMOTE' | tee "$cleanup_log"
          set -Eeuo pipefail
          wp_root="$1"
          live_file="$2"
          backup_dir="$3"
          backup_root="$4"
          restored=0

          [[ "$wp_root" == '/home/customer/www/staging2.nuvanx.com/public_html' ]]
          [[ "$backup_root" == '/home/customer/backups-nuvanx/staging2' ]]

          if [[ -d "$backup_dir" ]]; then
            if [[ -f "$backup_dir/plugin.php" ]]; then
              install -m 0644 "$backup_dir/plugin.php" "$live_file"
            else
              rm -f "$live_file"
            fi
            rm -rf -- "$backup_dir"
            restored=1
          fi

          if [[ -d "$backup_root" ]]; then
            find "$backup_root" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -name 'pre-valoracion-form-*' \
              -mtime +14 \
              -print \
              -exec rm -rf -- {} +
          fi

          if [[ "$restored" -eq 1 ]]; then
            cd "$wp_root"
            wp cache flush || true
            wp sg purge || true
          fi

          echo "STAGING2_VALORACION_MU_PLUGIN_CLEANUP_OK restored=$restored backup=$backup_dir"
          REMOTE
          grep -Fq 'STAGING2_VALORACION_MU_PLUGIN_CLEANUP_OK' "$cleanup_log"

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: institutional-headers-form-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: institutional-headers-form-evidence/
          retention-days: 30
          if-no-files-found: warn
