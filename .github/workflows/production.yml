name: Production
run-name: >-
  Production · ${{ github.event_name == 'workflow_dispatch' && (inputs.deploy && 'release' || 'verification') || github.sha }}

on:
  push:
    branches: [release/production]
    paths:
      - 'release/production-candidate.txt'
  workflow_dispatch:
    inputs:
      deploy:
        description: Promote the exact currently accepted Staging2 SHA to production.
        required: true
        default: true
        type: boolean
      candidate_sha:
        description: Exact SHA when supplied. Required for verification-only HubSpot E2E; for deploy it must equal the current Staging2 marker.
        required: false
        type: string
      run_post_audits:
        description: Run SEO/GEO, Search Console URL Inspection and IndexNow verification/submission.
        required: true
        default: true
        type: boolean
      run_performance:
        description: Run the Lighthouse production matrix.
        required: true
        default: false
        type: boolean
      run_hubspot_e2e:
        description: Run the live HubSpot E2E. This creates a real QA contact.
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: nuvanx-environment-mutation
  cancel-in-progress: false

env:
  STAGING_ROOT: /home/customer/www/staging2.nuvanx.com/public_html
  PROD_ROOT: /home/customer/www/nuvanx.com/public_html
  PROD_PARENT: /home/customer/www/nuvanx.com
  BASE_URL: https://nuvanx.com
  EXPECTED_HOST: nuvanx.com
  SEARCH_CONSOLE_PROPERTY: sc-domain:nuvanx.com
  INDEXNOW_KEY: 53546cf8077aa596b76aac664739bbb4
  STAGING_ACCEPTANCE_BRANCH: master
  STAGING_ACCEPTANCE_WORKFLOW_PATH: .github/workflows/staging.yml
  SSH_RETRY_ATTEMPTS: 5
  SSH_RETRY_BASE_DELAY_SECONDS: 15
  SSH_TRANSPORT_EXIT_CODE: 255

jobs:
  release:
    name: Promote exact accepted Staging2 SHA
    if: ${{ github.event_name == 'push' || inputs.deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - name: Check out hardened release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/production
          fetch-depth: 0
          persist-credentials: false

      - name: Validate production tooling and two-workflow invariant
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/deploy/deploy-to-prod.sh
          node --check scripts/production/verify-production-boundary.mjs
          node --check scripts/seo/index-pages.js
          bash -n scripts/production/seo-geo-origin-audit.sh
          bash -n scripts/production/document-head-title-audit.sh
          bash -n scripts/production/diagnose-title-emitters.sh
          bash -n scripts/production/indexnow-submit-sitemap.sh
          grep -Fq 'ROLLBACK_SNAPSHOT=PASS' tools/deploy/deploy-to-prod.sh
          grep -Fq 'ROLLBACK_PRODUCTION=PASS' tools/deploy/deploy-to-prod.sh
          grep -Fq '.nvx-deploy-sha' tools/deploy/deploy-to-prod.sh
          ! grep -Fq 'StrictHostKeyChecking=no' .github/workflows/production.yml
          mapfile -t workflows < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -printf '%f\n' | sort)
          [[ "${workflows[*]}" == 'production.yml staging.yml' ]] || { printf 'Expected exactly two canonical workflows; found: %s\n' "${workflows[*]}" >&2; exit 1; }
          echo 'PRODUCTION_TOOLING_STATIC=PASS workflows=2'

      - name: Configure strict Staging2 SSH and resolve live candidate
        id: candidate
        shell: bash
        env:
          HOST: ${{ secrets.STAGING2_SSH_HOST }}
          PORT: ${{ secrets.STAGING2_SSH_PORT }}
          USER: ${{ secrets.STAGING2_SSH_USER }}
          KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
          DISPATCH_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || '' }}
        run: |
          set -euo pipefail
          : "${HOST:?Missing STAGING2_SSH_HOST}"; : "${USER:?Missing STAGING2_SSH_USER}"; : "${KEY:?Missing STAGING2_SSH_PRIVATE_KEY}"; : "${KH:?Missing STAGING2_SSH_KNOWN_HOSTS}"
          SSH_PORT="${PORT:-18765}"; [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]

          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test -s release/production-candidate.txt || { echo 'release/production-candidate.txt must contain the authorized SHA.' >&2; exit 1; }
            REQUESTED_SHA="$(tr -d '[:space:]' < release/production-candidate.txt)"
          else
            REQUESTED_SHA="$(printf '%s' "$DISPATCH_SHA" | tr -d '[:space:]')"
          fi
          if [[ -n "$REQUESTED_SHA" ]]; then
            [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Authorized candidate SHA must be a full lowercase 40-character SHA.' >&2; exit 1; }
          fi

          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/staging_gate_key"; chmod 600 "$HOME/.ssh/staging_gate_key"
          printf '%s\n' "$KH" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts" || { echo 'STAGING_KNOWN_HOSTS=EMPTY' >&2; exit 1; }
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx-staging-gate
            HostName $HOST
            User $USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/staging_gate_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 15
            ConnectionAttempts 1
            ServerAliveInterval 15
            ServerAliveCountMax 2
          EOF
          chmod 600 "$HOME/.ssh/config"

          connected=0
          retry_delay="$SSH_RETRY_BASE_DELAY_SECONDS"
          for attempt in $(seq 1 "$SSH_RETRY_ATTEMPTS"); do
            if ssh -n nvx-staging-gate "test -d '$STAGING_ROOT' && test -d '$PROD_ROOT' && command -v wp >/dev/null"; then
              connected=1; break
            fi
            if [[ "$attempt" -ne "$SSH_RETRY_ATTEMPTS" ]]; then
              echo "Staging gate SSH attempt $attempt/$SSH_RETRY_ATTEMPTS failed; retrying in ${retry_delay}s..."
              sleep "$retry_delay"
              retry_delay=$((retry_delay + SSH_RETRY_BASE_DELAY_SECONDS))
            fi
          done
          [[ "$connected" = 1 ]] || { echo "STAGING_SSH=FAIL_TRANSPORT: could not reach SiteGround staging gate after $SSH_RETRY_ATTEMPTS attempts." >&2; exit "$SSH_TRANSPORT_EXIT_CODE"; }

          marker="$STAGING_ROOT/wp-content/themes/nuvanx-medical/.nvx-deploy-sha"
          ssh -n nvx-staging-gate "test -f '$marker'" || { echo "STAGING_MARKER=MISSING path=$marker" >&2; exit 1; }
          staging_sha=''
          retry_delay="$SSH_RETRY_BASE_DELAY_SECONDS"
          for attempt in $(seq 1 "$SSH_RETRY_ATTEMPTS"); do
            if candidate_value="$(ssh -n nvx-staging-gate "tr -d '\\r\\n' < '$marker'")" && [[ "$candidate_value" =~ ^[0-9a-f]{40}$ ]]; then
              staging_sha="$candidate_value"; break
            fi
            if [[ "$attempt" -ne "$SSH_RETRY_ATTEMPTS" ]]; then
              echo "Staging marker read $attempt/$SSH_RETRY_ATTEMPTS failed; retrying in ${retry_delay}s..."
              sleep "$retry_delay"
              retry_delay=$((retry_delay + SSH_RETRY_BASE_DELAY_SECONDS))
            fi
          done
          [[ "$staging_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'STAGING_MARKER=UNREADABLE after retries' >&2; exit 1; }
          if [[ -n "$REQUESTED_SHA" && "$REQUESTED_SHA" != "$staging_sha" ]]; then
            echo "Authorized SHA $REQUESTED_SHA is not the current Staging2 SHA $staging_sha" >&2
            exit 1
          fi

          git fetch --no-tags origin "$STAGING_ACCEPTANCE_BRANCH"
          git cat-file -e "${staging_sha}^{commit}"
          git merge-base --is-ancestor "$staging_sha" "origin/$STAGING_ACCEPTANCE_BRANCH" || { echo "Current Staging2 SHA is not contained in origin/$STAGING_ACCEPTANCE_BRANCH: $staging_sha" >&2; exit 1; }
          git cat-file -e "${staging_sha}:wp-content/themes/nuvanx-medical/functions.php"
          theme_tree="$(git rev-parse "${staging_sha}:wp-content/themes/nuvanx-medical")"

          ssh nvx-staging-gate "STAGING_ROOT='$STAGING_ROOT' PROD_ROOT='$PROD_ROOT' STAGING_SHA='$staging_sha' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          test "$STAGING_ROOT" != "$PROD_ROOT"
          cd "$STAGING_ROOT"
          test "$(tr -d '\r\n' < wp-content/themes/nuvanx-medical/.nvx-deploy-sha)" = "$STAGING_SHA"
          test "$(wp config get DB_NAME)" = 'dbshcocboodiwr'
          test "$(wp option get home)" = 'https://staging2.nuvanx.com'
          test "$(wp option get siteurl)" = 'https://staging2.nuvanx.com'
          test "$(wp option get blog_public)" = '0'
          test "$(wp config get NVX_ENV)" = 'staging'
          test "$(wp config get WP_ENVIRONMENT_TYPE)" = 'staging'
          wp eval 'exit((defined("WP_DEBUG_DISPLAY") && WP_DEBUG_DISPLAY === false) ? 0 : 1);'
          test "$(wp theme list --status=active --field=name)" = 'nuvanx-medical'
          cd "$PROD_ROOT"
          test "$(wp config get DB_NAME)" = 'db0ecrycwv2tgb'
          test "$(wp option get home)" = 'https://nuvanx.com'
          test "$(wp option get siteurl)" = 'https://nuvanx.com'
          test "$(wp option get blog_public)" = '1'
          test "$(wp theme list --status=active --field=name)" = 'nuvanx-medical'
          for legacy_mu in nuvanx-valoracion-native-hubspot-form.php nuvanx-contacto-hubspot-form.php nvx-disable-public-facebook-pixel.php nuvanx-google-attribution.php; do test ! -e "$PROD_ROOT/wp-content/mu-plugins/$legacy_mu"; done
          test ! -d "$PROD_ROOT/wp-content/mu-plugins/nuvanx-google-attribution"
          echo 'PRODUCTION_GATE_IDENTITIES=PASS'
          REMOTE

          echo "sha=$staging_sha" >> "$GITHUB_OUTPUT"
          echo "CANDIDATE_SHA=$staging_sha" >> "$GITHUB_ENV"
          echo "EXPECTED_SHA=$staging_sha" >> "$GITHUB_ENV"
          echo "CANDIDATE_THEME_TREE=$theme_tree" >> "$GITHUB_ENV"
          echo "PRODUCTION_CANDIDATE=$staging_sha"
          echo "PRODUCTION_CANDIDATE_THEME_TREE=$theme_tree"

      - name: Verify successful exact-SHA Staging acceptance evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          command -v unzip >/dev/null || { echo 'Required unzip command is unavailable on the runner.' >&2; exit 1; }
          artifact_name="staging2-block-c-${CANDIDATE_SHA}"
          api_headers=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')
          response="$(curl -fsSL --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 --proto '=https' --proto-redir '=https' "${api_headers[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100")"
          mapfile -t candidates < <(printf '%s' "$response" | jq -rc --arg name "$artifact_name" '[.artifacts[] | select(.name == $name and .expired == false)] | sort_by(.created_at) | reverse | .[] | [.id, .workflow_run.id, .created_at] | @tsv')
          (( ${#candidates[@]} > 0 )) || { echo "No non-expired Staging acceptance artifacts for $CANDIDATE_SHA. Rerun Staging with run_acceptance=true." >&2; exit 1; }

          accepted=0
          accepted_run_id=''
          accepted_attempt=''
          accepted_artifact_id=''
          accepted_event=''
          accepted_head_sha=''

          for candidate in "${candidates[@]}"; do
            IFS=$'\t' read -r artifact_id run_id created_at <<< "$candidate"
            if [[ ! "$artifact_id" =~ ^[0-9]{1,20}$ || ! "$run_id" =~ ^[0-9]{1,20}$ ]]; then
              echo "Skipping malformed artifact candidate: artifact_id=$artifact_id run_id=$run_id created_at=$created_at" >&2
              continue
            fi

            # Cheap source-run checks happen before downloading the potentially large ZIP.
            if ! run="$(curl -fsSL --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 --proto '=https' --proto-redir '=https' "${api_headers[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"; then
              echo "Skipping artifact $artifact_id: unable to fetch source run $run_id" >&2
              continue
            fi
            IFS=$'\t' read -r head_branch run_head_sha workflow_path run_event < <(printf '%s' "$run" | jq -r '[.head_branch // "",.head_sha // "",.path // "",.event // ""] | @tsv')
            if [[ "$head_branch" != "$STAGING_ACCEPTANCE_BRANCH" ]]; then echo "Skipping artifact $artifact_id run $run_id: head_branch=$head_branch expected=$STAGING_ACCEPTANCE_BRANCH" >&2; continue; fi
            workflow_prefix="${workflow_path:0:${#STAGING_ACCEPTANCE_WORKFLOW_PATH}}"
            workflow_suffix="${workflow_path:${#STAGING_ACCEPTANCE_WORKFLOW_PATH}}"
            if [[ "$workflow_prefix" != "$STAGING_ACCEPTANCE_WORKFLOW_PATH" || ( -n "$workflow_suffix" && "${workflow_suffix:0:1}" != '@' ) || "$workflow_suffix" == '@' ]]; then
              echo "Skipping artifact $artifact_id run $run_id: path=$workflow_path expected=$STAGING_ACCEPTANCE_WORKFLOW_PATH or $STAGING_ACCEPTANCE_WORKFLOW_PATH@<ref>" >&2
              continue
            fi
            [[ "$run_head_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Skipping artifact $artifact_id run $run_id: invalid head_sha=$run_head_sha" >&2; continue; }
            [[ "$run_event" == push || "$run_event" == workflow_dispatch ]] || { echo "Skipping artifact $artifact_id run $run_id: unsupported event=$run_event" >&2; continue; }
            if [[ "$run_event" == push && "$run_head_sha" != "$CANDIDATE_SHA" ]]; then
              echo "Skipping artifact $artifact_id run $run_id: push head_sha=$run_head_sha candidate=$CANDIDATE_SHA" >&2
              continue
            fi
            if [[ "$run_event" == workflow_dispatch ]]; then
              git cat-file -e "${run_head_sha}^{commit}" 2>/dev/null || { echo "Skipping artifact $artifact_id run $run_id: dispatch head unavailable: $run_head_sha" >&2; continue; }
              git merge-base --is-ancestor "$run_head_sha" "origin/$STAGING_ACCEPTANCE_BRANCH" || { echo "Skipping artifact $artifact_id run $run_id: dispatch head outside current $STAGING_ACCEPTANCE_BRANCH" >&2; continue; }
              git merge-base --is-ancestor "$CANDIDATE_SHA" "$run_head_sha" || { echo "Skipping artifact $artifact_id run $run_id: candidate not contained in dispatch head" >&2; continue; }
            fi

            artifact_zip="$RUNNER_TEMP/staging-acceptance-${artifact_id}.zip"
            rm -f "$artifact_zip"
            if ! curl -LfsS --retry 3 --retry-all-errors --connect-timeout 10 --max-time 180 --max-filesize 157286400 --proto '=https' --proto-redir '=https' "${api_headers[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" -o "$artifact_zip"; then
              echo "Skipping artifact $artifact_id run $run_id: download failed after retries" >&2
              rm -f "$artifact_zip"
              continue
            fi
            if ! unzip -tqq "$artifact_zip" >/dev/null 2>&1; then
              echo "Skipping artifact $artifact_id run $run_id: downloaded ZIP is corrupt or truncated" >&2
              rm -f "$artifact_zip"
              continue
            fi
            manifest_path="$(unzip -Z1 "$artifact_zip" | grep -E '(^|/)acceptance-manifest\.json$' | head -n1 || true)"
            if [[ -z "$manifest_path" ]]; then
              echo "Skipping artifact $artifact_id run $run_id: schema-v1 immutable acceptance manifest is missing; rerun Staging" >&2
              rm -f "$artifact_zip"
              continue
            fi
            manifest="$(unzip -p "$artifact_zip" "$manifest_path" 2>/dev/null || true)"
            rm -f "$artifact_zip"

            # Producer contract: staging.yml writes every field with jq --arg, so
            # run_id/run_attempt intentionally remain JSON strings in schema 1.
            if ! manifest_fields="$(printf '%s' "$manifest" | jq -er '
              select(type == "object" and .schema == 1) |
              [.candidate_sha,.run_id,.run_attempt,.event,.head_sha,.head_branch,.workflow_path] |
              select(all(.[]; type == "string" and length > 0)) |
              @tsv
            ')"; then
              echo "Skipping artifact $artifact_id run $run_id: invalid or unsupported acceptance manifest schema/fields" >&2
              continue
            fi
            IFS=$'\t' read -r manifest_candidate manifest_run_id manifest_run_attempt manifest_event manifest_head_sha manifest_head_branch manifest_workflow <<< "$manifest_fields"
            [[ "$manifest_candidate" == "$CANDIDATE_SHA" ]] || { echo "Skipping artifact $artifact_id run $run_id: manifest candidate=$manifest_candidate expected=$CANDIDATE_SHA" >&2; continue; }
            [[ "$manifest_run_id" == "$run_id" ]] || { echo "Skipping artifact $artifact_id run $run_id: manifest run_id=$manifest_run_id" >&2; continue; }
            [[ "$manifest_run_attempt" =~ ^[0-9]{1,6}$ ]] || { echo "Skipping artifact $artifact_id run $run_id: invalid manifest run_attempt=$manifest_run_attempt" >&2; continue; }
            manifest_run_attempt=$((10#$manifest_run_attempt))
            (( manifest_run_attempt >= 1 )) || { echo "Skipping artifact $artifact_id run $run_id: invalid manifest run_attempt=$manifest_run_attempt" >&2; continue; }
            [[ "$manifest_event" == push || "$manifest_event" == workflow_dispatch ]] || { echo "Skipping artifact $artifact_id run $run_id: unsupported manifest event=$manifest_event" >&2; continue; }
            [[ "$manifest_event" == "$run_event" ]] || { echo "Skipping artifact $artifact_id run $run_id: manifest event=$manifest_event source event=$run_event" >&2; continue; }
            [[ "$manifest_head_sha" == "$run_head_sha" ]] || { echo "Skipping artifact $artifact_id run $run_id: manifest head_sha=$manifest_head_sha source=$run_head_sha" >&2; continue; }
            [[ "$manifest_head_branch" == "$STAGING_ACCEPTANCE_BRANCH" ]] || { echo "Skipping artifact $artifact_id run $run_id: manifest head_branch=$manifest_head_branch" >&2; continue; }
            [[ "$manifest_workflow" == "$STAGING_ACCEPTANCE_WORKFLOW_PATH" ]] || { echo "Skipping artifact $artifact_id run $run_id: manifest workflow_path=$manifest_workflow" >&2; continue; }

            if ! exact_run="$(curl -fsSL --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 --proto '=https' --proto-redir '=https' "${api_headers[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/attempts/${manifest_run_attempt}")"; then
              echo "Skipping artifact $artifact_id run $run_id: unable to fetch exact attempt $manifest_run_attempt" >&2
              continue
            fi
            IFS=$'\t' read -r exact_status exact_conclusion exact_branch exact_head_sha exact_path exact_event exact_attempt < <(printf '%s' "$exact_run" | jq -r '[.status // "",.conclusion // "",.head_branch // "",.head_sha // "",.path // "",.event // "",(.run_attempt // "" | tostring)] | @tsv')
            [[ "$exact_status" == completed ]] || { echo "Skipping artifact $artifact_id run $run_id attempt $manifest_run_attempt: status=${exact_status:-null} expected=completed" >&2; continue; }
            [[ "$exact_conclusion" == success ]] || { echo "Skipping artifact $artifact_id run $run_id attempt $manifest_run_attempt: conclusion=${exact_conclusion:-null} expected=success" >&2; continue; }
            [[ "$exact_attempt" == "$manifest_run_attempt" ]] || { echo "Skipping artifact $artifact_id run $run_id: exact API attempt=$exact_attempt manifest=$manifest_run_attempt" >&2; continue; }
            [[ "$exact_branch" == "$manifest_head_branch" && "$exact_head_sha" == "$manifest_head_sha" && "$exact_event" == "$manifest_event" ]] || { echo "Skipping artifact $artifact_id run $run_id: exact-attempt identity differs from manifest" >&2; continue; }
            exact_prefix="${exact_path:0:${#STAGING_ACCEPTANCE_WORKFLOW_PATH}}"
            exact_suffix="${exact_path:${#STAGING_ACCEPTANCE_WORKFLOW_PATH}}"
            if [[ "$exact_prefix" != "$STAGING_ACCEPTANCE_WORKFLOW_PATH" || ( -n "$exact_suffix" && "${exact_suffix:0:1}" != '@' ) || "$exact_suffix" == '@' ]]; then
              echo "Skipping artifact $artifact_id run $run_id: exact-attempt workflow path=$exact_path" >&2
              continue
            fi

            # A later rerun does not invalidate immutable evidence from this exact
            # successful attempt. The release gate separately requires the live
            # Staging marker/environment to still equal CANDIDATE_SHA, so a later
            # mutation or rollback cannot be promoted from stale evidence.
            case "$manifest_event" in
              push)
                [[ "$manifest_head_sha" == "$CANDIDATE_SHA" ]] || { echo "Skipping artifact $artifact_id run $run_id: push manifest head is not candidate" >&2; continue; }
                ;;
              workflow_dispatch)
                git merge-base --is-ancestor "$CANDIDATE_SHA" "$manifest_head_sha" || { echo "Skipping artifact $artifact_id run $run_id: candidate absent from dispatch attempt head" >&2; continue; }
                ;;
              *)
                echo "Skipping artifact $artifact_id run $run_id: unsupported event=$manifest_event" >&2
                continue
                ;;
            esac

            accepted=1
            accepted_run_id="$run_id"
            accepted_attempt="$manifest_run_attempt"
            accepted_artifact_id="$artifact_id"
            accepted_event="$manifest_event"
            accepted_head_sha="$manifest_head_sha"
            break
          done

          [[ "$accepted" = 1 ]] || { echo "No completed successful canonical Staging attempt provides valid exact-candidate acceptance evidence for $CANDIDATE_SHA." >&2; exit 1; }
          echo "STAGING_ACCEPTANCE=PASS artifact=$artifact_name artifact_id=$accepted_artifact_id run_id=$accepted_run_id attempt=$accepted_attempt sha=$CANDIDATE_SHA event=$accepted_event run_head_sha=$accepted_head_sha conclusion=success"

      - name: Materialize exact candidate from master history
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_ROOT="$RUNNER_TEMP/production-candidate-$CANDIDATE_SHA"
          git worktree add --detach "$CANDIDATE_ROOT" "$CANDIDATE_SHA"
          test "$(git -C "$CANDIDATE_ROOT" rev-parse HEAD)" = "$CANDIDATE_SHA"
          find "$CANDIDATE_ROOT/wp-content/themes/nuvanx-medical" -path '*/vendor' -prune -o -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null
          echo "CANDIDATE_ROOT=$CANDIDATE_ROOT" >> "$GITHUB_ENV"

      - name: Destroy Staging gate SSH identity
        shell: bash
        run: rm -f "$HOME/.ssh/staging_gate_key" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"

      - name: Configure strict production SSH
        shell: bash
        env:
          HOST: ${{ secrets.PROD_SSH_HOST }}
          PORT: ${{ secrets.PROD_SSH_PORT }}
          USER: ${{ secrets.PROD_SSH_USER }}
          KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${HOST:?Missing PROD_SSH_HOST}"; : "${USER:?Missing PROD_SSH_USER}"; : "${KEY:?Missing PROD_SSH_PRIVATE_KEY}"; : "${KH:?Missing PROD_SSH_KNOWN_HOSTS}"
          SSH_PORT="${PORT:-18765}"; [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/prod_key"; chmod 600 "$HOME/.ssh/prod_key"
          printf '%s\n' "$KH" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts" || { echo 'PRODUCTION_KNOWN_HOSTS=EMPTY' >&2; exit 1; }
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx-prod
            HostName $HOST
            User $USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/prod_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 15
            ConnectionAttempts 1
            ServerAliveInterval 15
            ServerAliveCountMax 2
          EOF
          chmod 600 "$HOME/.ssh/config"
          prod_connected=0
          retry_delay="$SSH_RETRY_BASE_DELAY_SECONDS"
          for attempt in $(seq 1 "$SSH_RETRY_ATTEMPTS"); do
            if ssh -n nvx-prod "test -d '$PROD_ROOT' && test -f '$PROD_ROOT/wp-config.php' && command -v wp >/dev/null && command -v rsync >/dev/null && command -v php >/dev/null"; then
              prod_connected=1; break
            fi
            if [[ "$attempt" -ne "$SSH_RETRY_ATTEMPTS" ]]; then
              echo "Production SSH attempt $attempt/$SSH_RETRY_ATTEMPTS failed; retrying in ${retry_delay}s..."
              sleep "$retry_delay"
              retry_delay=$((retry_delay + SSH_RETRY_BASE_DELAY_SECONDS))
            fi
          done
          [[ "$prod_connected" = 1 ]] || { echo "PRODUCTION_SSH=FAIL_TRANSPORT: could not reach SiteGround production after $SSH_RETRY_ATTEMPTS attempts." >&2; exit "$SSH_TRANSPORT_EXIT_CODE"; }

      - name: Verify production preflight
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-prod "PROD_ROOT='$PROD_ROOT' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$PROD_ROOT"
          test "$(wp config get DB_NAME)" = 'db0ecrycwv2tgb'
          test "$(wp option get home)" = 'https://nuvanx.com'
          test "$(wp option get siteurl)" = 'https://nuvanx.com'
          test "$(wp option get blog_public)" = '1'
          test "$(wp theme list --status=active --field=name)" = 'nuvanx-medical'
          for legacy_mu in nuvanx-valoracion-native-hubspot-form.php nuvanx-contacto-hubspot-form.php nvx-disable-public-facebook-pixel.php nuvanx-google-attribution.php; do test ! -e "$PROD_ROOT/wp-content/mu-plugins/$legacy_mu"; done
          test ! -d "$PROD_ROOT/wp-content/mu-plugins/nuvanx-google-attribution"
          echo 'PRODUCTION_PREFLIGHT=PASS'
          REMOTE

      - name: Upload exact accepted payload
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_RELEASE="$PROD_PARENT/.nvx-releases/${CANDIDATE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "REMOTE_RELEASE=$REMOTE_RELEASE" >> "$GITHUB_ENV"
          ssh nvx-prod "mkdir -p '$REMOTE_RELEASE/theme'"
          rsync -az --delete --exclude='.git' --exclude='php_errorlog' --exclude='*.log' --exclude='_archive*' --exclude='_disabled*' --exclude='*.bak*' "$CANDIDATE_ROOT/wp-content/themes/nuvanx-medical/" "nvx-prod:$REMOTE_RELEASE/theme/"
          rsync -az tools/deploy/deploy-to-prod.sh "nvx-prod:$REMOTE_RELEASE/deploy-to-prod.sh"

      - name: Execute guarded atomic production cutover
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-prod "NVX_RUN_TOKEN='${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}' NUVANX_CONFIRM=yes bash '$REMOTE_RELEASE/deploy-to-prod.sh' --prod-root '$PROD_ROOT' --source-theme '$REMOTE_RELEASE/theme' --sha '$CANDIDATE_SHA' --confirm"

      - name: Verify production public boundary and exact disk SHA
        shell: bash
        run: |
          set -euo pipefail
          pass=0
          for attempt in {1..6}; do
            if BASE_URL="$BASE_URL" EXPECTED_HOST="$EXPECTED_HOST" EXPECTED_SHA="$CANDIDATE_SHA" node scripts/production/verify-production-boundary.mjs; then pass=1; break; fi
            sleep 10
          done
          test "$pass" = 1
          ssh nvx-prod "PROD_ROOT='$PROD_ROOT' CANDIDATE_SHA='$CANDIDATE_SHA' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$PROD_ROOT"
          test "$(tr -d '\r\n' < wp-content/themes/nuvanx-medical/.nvx-deploy-sha)" = "$CANDIDATE_SHA"
          test "$(wp config get DB_NAME)" = 'db0ecrycwv2tgb'
          test "$(wp option get home)" = 'https://nuvanx.com'
          test "$(wp option get siteurl)" = 'https://nuvanx.com'
          test "$(wp option get blog_public)" = '1'
          echo "PRODUCTION_DEPLOYED_SHA=$CANDIDATE_SHA"
          REMOTE

      - name: Upload production boundary evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-boundary-${{ env.CANDIDATE_SHA }}-attempt-${{ github.run_attempt }}
          path: scripts/production/artifacts/production-boundary.json
          retention-days: 14
          if-no-files-found: warn

      - name: Cleanup production release payload and identity
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${REMOTE_RELEASE:-}" && -f "$HOME/.ssh/config" ]]; then ssh nvx-prod "rm -rf '$REMOTE_RELEASE'" || true; fi
          rm -f "$HOME/.ssh/prod_key" "$HOME/.ssh/staging_gate_key" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"

      - name: Write release summary
        if: success()
        shell: bash
        run: |
          {
            echo '## Production release PASS'
            echo
            echo "- Candidate source: current locked Staging2 deploy marker"
            echo "- Exact SHA: \`$CANDIDATE_SHA\`"
            echo "- Theme tree: \`$CANDIDATE_THEME_TREE\`"
            echo '- Staging acceptance: exact-SHA successful-attempt artifact verified.'
            echo '- Cross-environment concurrency: serialized; Staging cannot advance during this release.'
            echo '- Atomic production cutover + rollback contract: PASS.'
          } >> "$GITHUB_STEP_SUMMARY"

  post_audits:
    name: Production SEO/GEO, GSC and IndexNow
    needs: release
    if: >-
      always() &&
      (github.event_name == 'push' || inputs.run_post_audits) &&
      (needs.release.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.deploy == false))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Search Console WIF exchanges GitHub's OIDC token for short-lived Google credentials.
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Check out canonical master audit tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js for Search Console audit
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install Search Console audit dependencies
        shell: bash
        run: npm ci --prefix scripts/seo --ignore-scripts

      - name: Configure strict production audit SSH
        shell: bash
        env:
          HOST: ${{ secrets.PROD_SSH_HOST }}
          PORT: ${{ secrets.PROD_SSH_PORT }}
          USER: ${{ secrets.PROD_SSH_USER }}
          KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${HOST:?}"; : "${USER:?}"; : "${KEY:?}"; : "${KH:?}"
          SSH_PORT="${PORT:-18765}"; [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          mkdir -p "$HOME/.ssh" scripts/production/artifacts scripts/seo/artifacts; chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/prod_audit_key"; chmod 600 "$HOME/.ssh/prod_audit_key"
          printf '%s\n' "$KH" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts" || { echo 'PRODUCTION_AUDIT_KNOWN_HOSTS=EMPTY' >&2; exit 1; }
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx-prod-audit
            HostName $HOST
            User $USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/prod_audit_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 15
            ConnectionAttempts 1
            ServerAliveInterval 15
            ServerAliveCountMax 2
          EOF
          chmod 600 "$HOME/.ssh/config"
          audit_connected=0
          retry_delay="$SSH_RETRY_BASE_DELAY_SECONDS"
          for attempt in $(seq 1 "$SSH_RETRY_ATTEMPTS"); do
            if ssh -n nvx-prod-audit "test -d '$PROD_ROOT' && command -v wp >/dev/null && command -v curl >/dev/null && command -v php >/dev/null"; then
              audit_connected=1; break
            fi
            if [[ "$attempt" -ne "$SSH_RETRY_ATTEMPTS" ]]; then
              echo "Production audit SSH attempt $attempt/$SSH_RETRY_ATTEMPTS failed; retrying in ${retry_delay}s..."
              sleep "$retry_delay"
              retry_delay=$((retry_delay + SSH_RETRY_BASE_DELAY_SECONDS))
            fi
          done
          [[ "$audit_connected" = 1 ]] || { echo 'PRODUCTION_AUDIT_SSH=FAIL_TRANSPORT' >&2; exit "$SSH_TRANSPORT_EXIT_CODE"; }

      - name: Verify one document title across production sitemap
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-prod-audit "BASE_URL='$BASE_URL' bash -s" < scripts/production/document-head-title-audit.sh | tee scripts/production/artifacts/document-head-title-audit.log

      - name: Run blocking SEO/GEO origin audit
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-prod-audit "PROD_ROOT='$PROD_ROOT' BASE_URL='$BASE_URL' EXPECTED_HOST='$EXPECTED_HOST' bash -s" < scripts/production/seo-geo-origin-audit.sh | tee scripts/production/artifacts/seo-geo-origin-audit.log

      - name: Materialize exact sitemap URL inventory from origin audit
        shell: bash
        run: |
          set -euo pipefail
          log='scripts/production/artifacts/seo-geo-origin-audit.log'
          out='scripts/seo/artifacts/sitemap-urls.txt'
          expected="$(sed -nE 's/^PASS SITEMAP_URL_COUNT count=([0-9]+)$/\1/p' "$log" | tail -n1)"
          grep '^PASS URL_SEO url=' "$log" | sed -E 's/^PASS URL_SEO url=([^ ]+) .*/\1/' > "$out" || true
          base_prefix="${BASE_URL%/}/"
          base_host="$(node -e 'process.stdout.write(new URL(process.argv[1]).host)' "$BASE_URL")"
          [[ -n "$base_prefix" && "$base_host" == "$EXPECTED_HOST" ]] || {
            echo "GSC_URL_INVENTORY=FAIL base_url=$BASE_URL base_host=${base_host:-missing} expected_host=$EXPECTED_HOST" >&2
            exit 1
          }
          actual="$(awk -v prefix="$base_prefix" 'index($0, prefix) == 1 { count++ } END { print count + 0 }' "$out")"
          [[ "$expected" =~ ^[0-9]+$ && "$actual" =~ ^[0-9]+$ && "$actual" -eq "$expected" && "$actual" -gt 0 ]] || {
            echo "GSC_URL_INVENTORY=FAIL expected=${expected:-missing} actual=$actual" >&2
            exit 1
          }
          [[ "$(sort -u "$out" | wc -l | tr -d ' ')" -eq "$actual" ]] || { echo 'GSC_URL_INVENTORY=FAIL duplicate_urls' >&2; exit 1; }
          echo "GSC_URL_INVENTORY=PASS urls=$actual source=origin-audit"

      - name: Authenticate to Google Cloud with Workload Identity Federation
        id: google_auth
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SEARCH_CONSOLE_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: nuvanx
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SEARCH_CONSOLE_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Resolve Search Console authentication
        id: gsc_auth
        shell: bash
        env:
          STATIC_SEARCH_CONSOLE_JSON: ${{ secrets.SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON }}
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.GCP_SEARCH_CONSOLE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          rm -f scripts/seo/credentials.json
          if [[ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" && -s "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]]; then
            echo 'SEARCH_CONSOLE_AUTH=WIF_ADC'
            echo 'enabled=true' >> $GITHUB_OUTPUT
          elif [[ -n "$STATIC_SEARCH_CONSOLE_JSON" ]]; then
            printf '%s' "$STATIC_SEARCH_CONSOLE_JSON" > scripts/seo/credentials.json
            chmod 600 scripts/seo/credentials.json
            jq -e '.type == "service_account" and (.client_email | type == "string" and length > 0) and (.private_key | type == "string" and length > 0)' scripts/seo/credentials.json >/dev/null
            echo 'SEARCH_CONSOLE_AUTH=SERVICE_ACCOUNT_JSON_FALLBACK'
            echo 'enabled=true' >> $GITHUB_OUTPUT
          else
            echo 'SEARCH_CONSOLE_AUTH=SKIPPED no_credentials_configured'
            echo 'enabled=false' >> $GITHUB_OUTPUT
          fi

      - name: Inspect exact production sitemap URLs in Google Search Console
        if: steps.gsc_auth.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/seo/index-pages.js \
            --property "$SEARCH_CONSOLE_PROPERTY" \
            --url "$BASE_URL" \
            --urls-file scripts/seo/artifacts/sitemap-urls.txt \
            2>&1 | tee scripts/seo/artifacts/url-inspection.log
          grep -Fq 'INSPECTION_COMPLETED=true' scripts/seo/artifacts/url-inspection.log
          total="$(sed -nE 's/^TOTAL_URLS=([0-9]+)$/\1/p' scripts/seo/artifacts/url-inspection.log | tail -n1)"
          api_errors="$(sed -nE 's/^API_ERRORS=([0-9]+)$/\1/p' scripts/seo/artifacts/url-inspection.log | tail -n1)"
          inventory="$(wc -l < scripts/seo/artifacts/sitemap-urls.txt | tr -d ' ')"
          [[ "$total" =~ ^[0-9]+$ && "$total" -eq "$inventory" ]] || { echo "GSC_INSPECTION=FAIL total=${total:-missing} inventory=$inventory" >&2; exit 1; }
          [[ "$api_errors" == '0' ]] || { echo "GSC_INSPECTION=FAIL api_errors=${api_errors:-missing}" >&2; exit 1; }
          echo "GSC_INSPECTION=PASS urls=$total api_errors=0"

      - name: Export Search Console URL-level CSV evidence
        if: always() && steps.gsc_auth.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          json='scripts/seo/artifacts/indexing-results.json'
          csv='scripts/seo/artifacts/indexing-results.csv'
          if [[ -s "$json" ]]; then
            jq -r '
              (["url","apiStatus","verdict","coverageState","indexingState","robotsTxtState","pageFetchState","lastCrawlTime","crawledAs","userCanonical","googleCanonical","blocked","canonicalMismatch","referringUrls","sitemap"] | @csv),
              (.results[] | [
                .url,
                .apiStatus,
                (.verdict // ""),
                (.coverageState // ""),
                (.indexingState // ""),
                (.robotsTxtState // ""),
                (.pageFetchState // ""),
                (.lastCrawlTime // ""),
                (.crawledAs // ""),
                (.userCanonical // ""),
                (.googleCanonical // ""),
                (.blocked // false),
                (.canonicalMismatch // false),
                ((.referringUrls // []) | join(" | ")),
                ((.sitemap // []) | join(" | "))
              ] | @csv)
            ' "$json" > "$csv"
            echo "GSC_CSV=PASS rows=$(($(wc -l < "$csv") - 1))"
          else
            echo 'GSC_CSV=SKIPPED no_indexing_results' >&2
          fi

      - name: Diagnose title emitters after audit failure
        if: failure()
        shell: bash
        run: |
          set +e
          ssh nvx-prod-audit "PROD_ROOT='$PROD_ROOT' BASE_URL='$BASE_URL' bash -s" < scripts/production/diagnose-title-emitters.sh | tee scripts/production/artifacts/title-emitter-diagnostic.log
          exit 0

      - name: Submit production sitemap to IndexNow and verify key
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-prod-audit "PROD_ROOT='$PROD_ROOT' BASE_URL='$BASE_URL' EXPECTED_HOST='$EXPECTED_HOST' INDEXNOW_KEY='$INDEXNOW_KEY' bash -s" < scripts/production/indexnow-submit-sitemap.sh | tee scripts/production/artifacts/indexnow-submit.log
          actual="$(curl -fsS --max-time 20 "$BASE_URL/$INDEXNOW_KEY.txt")"
          test "$actual" = "$INDEXNOW_KEY"
          echo 'INDEXNOW_KEY_PUBLIC=PASS'

      - name: Upload production audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-post-audits-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            scripts/production/artifacts/*.log
            scripts/seo/artifacts/sitemap-urls.txt
            scripts/seo/artifacts/url-inspection.log
            scripts/seo/artifacts/indexing-results.json
            scripts/seo/artifacts/indexing-results.csv
          retention-days: 30
          if-no-files-found: warn
          compression-level: 6

      - name: Destroy production audit identities and temporary credentials
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/prod_audit_key" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config" scripts/seo/credentials.json
          find . -maxdepth 2 -type f -name 'gha-creds-*.json' -delete 2>/dev/null || true

  performance:
    name: Lighthouse production matrix
    needs: release
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.run_performance &&
      (needs.release.result == 'success' || inputs.deploy == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false

      - name: Run Lighthouse production matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p perf-results
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts --no-audit --no-fund lighthouse@12.8.2 >/dev/null 2>&1
          LH='./node_modules/.bin/lighthouse'
          "$LH" --version | tee perf-results/lighthouse-version.txt
          declare -A URLS=(
            [home]='https://nuvanx.com/'
            [endolift]='https://nuvanx.com/endolift-facial-papada-mandibula/'
            [endolaser]='https://nuvanx.com/endolaser-corporal-grasa-localizada/'
            [faciales]='https://nuvanx.com/medicina-estetica/'
            [valoracion]='https://nuvanx.com/madrid/valoracion/'
          )
          printf 'page\tmode\tperformance\tfcp_ms\tlcp_ms\ttbt_ms\tcls\tspeed_index_ms\tttfb_ms\n' > perf-results/summary.tsv
          printf 'page\tmode\treason\n' > perf-results/failures.tsv
          matrix_failures=0
          for page in home endolift endolaser faciales valoracion; do
            for mode in mobile desktop; do
              out="perf-results/${page}-${mode}.json"; extra=(); [[ "$mode" != desktop ]] || extra+=(--preset=desktop)
              success=0
              for attempt in 1 2 3; do
                if "$LH" "${URLS[$page]}" --output=json --output-path="$out" --only-categories=performance --quiet --chrome-flags='--headless --disable-dev-shm-usage' "${extra[@]}"; then success=1; break; fi
                sleep $((attempt * 5))
              done
              if [[ "$success" != 1 ]]; then
                printf '%s\t%s\t%s\n' "$page" "$mode" 'lighthouse_execution_failed_after_3_attempts' >> perf-results/failures.tsv
                matrix_failures=$((matrix_failures + 1))
                continue
              fi
              if ! jq -e '
                (.categories.performance.score | type == "number") and
                (.audits["first-contentful-paint"].numericValue | type == "number") and
                (.audits["largest-contentful-paint"].numericValue | type == "number") and
                (.audits["total-blocking-time"].numericValue | type == "number") and
                (.audits["cumulative-layout-shift"].numericValue | type == "number") and
                (.audits["speed-index"].numericValue | type == "number") and
                (.audits["server-response-time"].numericValue | type == "number")
              ' "$out" >/dev/null; then
                printf '%s\t%s\t%s\n' "$page" "$mode" 'invalid_lighthouse_json' >> perf-results/failures.tsv
                matrix_failures=$((matrix_failures + 1))
                continue
              fi
              jq -r --arg p "$page" --arg m "$mode" '[$p,$m,((.categories.performance.score)*100|round),(.audits["first-contentful-paint"].numericValue|round),(.audits["largest-contentful-paint"].numericValue|round),(.audits["total-blocking-time"].numericValue|round),(.audits["cumulative-layout-shift"].numericValue),(.audits["speed-index"].numericValue|round),(.audits["server-response-time"].numericValue|round)]|@tsv' "$out" >> perf-results/summary.tsv
            done
          done
          cat perf-results/summary.tsv
          if (( matrix_failures > 0 )); then
            echo "LIGHTHOUSE_MATRIX=FAIL failures=$matrix_failures" >&2
            cat perf-results/failures.tsv >&2
            exit 1
          fi
          echo 'LIGHTHOUSE_MATRIX=PASS failures=0'

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-performance-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: perf-results/
          retention-days: 14

  hubspot_e2e:
    name: Live production HubSpot attribution E2E
    needs: release
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.run_hubspot_e2e &&
      (needs.release.result == 'success' || inputs.deploy == false)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/staging2/package-lock.json

      - name: Resolve independent expected production SHA
        id: expected_sha
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.release.outputs.candidate_sha }}
          REQUESTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          expected_sha="$(printf '%s' "$RELEASE_SHA" | tr -d '[:space:]')"
          if [[ -z "$expected_sha" ]]; then
            expected_sha="$(printf '%s' "$REQUESTED_SHA" | tr -d '[:space:]')"
            [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'Verification-only HubSpot E2E requires candidate_sha as an independent full lowercase 40-character SHA.' >&2; exit 1; }
          fi
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid authoritative production SHA: $expected_sha" >&2; exit 1; }
          echo "sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "H1_EXPECTED_SHA=$expected_sha"

      - name: Install Playwright and run live H1 E2E
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.expected_sha.outputs.sha }}
        run: |
          set -euo pipefail
          cd scripts/staging2
          npm ci --ignore-scripts
          ./node_modules/.bin/playwright install --with-deps chromium
          cd ../..
          mkdir -p scripts/staging2/h1-artifacts
          node scripts/staging2/h1-hubspot-e2e.mjs 2>&1 | tee scripts/staging2/h1-artifacts/h1-e2e.log

      - name: Upload H1 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: h1-hubspot-e2e-evidence-${{ github.run_id }}
          path: scripts/staging2/h1-artifacts/*.log
          if-no-files-found: warn
          retention-days: 7
