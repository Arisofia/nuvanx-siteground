name: Trusted Staging Acceptance Command

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  dispatch:
    name: Dispatch exact-master Staging acceptance
    if: >-
      github.repository == 'Arisofia/nuvanx-siteground' &&
      github.actor == 'Arisofia' &&
      github.event.issue.number == 637 &&
      github.event.comment.body == '/run-staging-acceptance-e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve immutable master SHA
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          sha="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/master" --jq '.sha')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Dispatch canonical Staging workflow
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MASTER_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -Eeuo pipefail
          triggered_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "triggered_at=$triggered_at" >> "$GITHUB_OUTPUT"
          gh workflow run staging.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref master \
            -f sha="$MASTER_SHA" \
            -f run_acceptance=true \
            -f deep_quality=false

      - name: Locate and watch dispatched run
        id: watch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MASTER_SHA: ${{ steps.resolve.outputs.sha }}
          TRIGGERED_AT: ${{ steps.dispatch.outputs.triggered_at }}
        run: |
          set -Eeuo pipefail
          run_id=''
          for attempt in $(seq 1 30); do
            runs="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow staging.yml \
              --event workflow_dispatch \
              --branch master \
              --limit 30 \
              --json databaseId,createdAt,headSha)"
            run_id="$(jq -r --arg sha "$MASTER_SHA" --arg since "$TRIGGERED_AT" '
              [.[] | select(.createdAt >= $since and .headSha == $sha)]
              | sort_by(.createdAt)
              | reverse
              | .[0].databaseId // empty
            ' <<<"$runs")"
            if [[ "$run_id" =~ ^[0-9]+$ ]]; then
              break
            fi
            sleep 2
          done
          [[ "$run_id" =~ ^[0-9]+$ ]] || {
            echo 'Could not resolve dispatched Staging run.' >&2
            exit 1
          }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

          set +e
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish bounded outcome
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MASTER_SHA: ${{ steps.resolve.outputs.sha }}
          RUN_ID: ${{ steps.watch.outputs.run_id }}
          RUN_RC: ${{ steps.watch.outputs.rc }}
        run: |
          set -Eeuo pipefail
          outcome='FAIL'
          if [[ "${RUN_RC:-1}" == '0' && "${RUN_ID:-}" =~ ^[0-9]+$ ]]; then
            outcome='PASS'
          fi
          body="STAGING_ACCEPTANCE_COMMAND=${outcome} master_sha=${MASTER_SHA:-unresolved} run_id=${RUN_ID:-unresolved} secrets_exposed=0"
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/issues/637/comments" -f body="$body"
          [[ "$outcome" == 'PASS' ]]
