name: Staging2 Media Responsive Generate Once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/staging2-media-responsive-generate-once.yml

permissions:
  contents: read

concurrency:
  group: staging2-media-responsive-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING_ROOT: /home/customer/www/staging2.nuvanx.com/public_html
      PROD_ROOT: /home/customer/www/nuvanx.com/public_html
      STAGING_URL: https://staging2.nuvanx.com
      EXPECTED_STAGING_SHA: d54dfa7df226dbd5b823fca1878ce8a60a3548cb
      EXPECTED_PROD_SHA: 4775310be2b7dcdda18f8fd6de8e40041c2eb555

    steps:
      - name: Configure strict production SSH channel and guard both environments
        shell: bash
        env:
          HOST: ${{ secrets.PROD_SSH_HOST }}
          PORT: ${{ secrets.PROD_SSH_PORT }}
          USER: ${{ secrets.PROD_SSH_USER }}
          KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${HOST:?Missing PROD_SSH_HOST}"
          : "${USER:?Missing PROD_SSH_USER}"
          : "${KEY:?Missing PROD_SSH_PRIVATE_KEY}"
          : "${KH:?Missing PROD_SSH_KNOWN_HOSTS}"
          SSH_PORT="${PORT:-18765}"
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KH" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx-prod-channel
            HostName $HOST
            User $USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 20
            ServerAliveInterval 30
            ServerAliveCountMax 2
          EOF
          chmod 600 "$HOME/.ssh/config"
          ssh -n nvx-prod-channel "test -d '$PROD_ROOT' && test -d '$STAGING_ROOT' && command -v wp >/dev/null && command -v php >/dev/null && command -v base64 >/dev/null"
          test "$(ssh -n nvx-prod-channel "tr -d '\\r\\n' < '$PROD_ROOT/wp-content/themes/nuvanx-medical/.nvx-deploy-sha'")" = "$EXPECTED_PROD_SHA"
          test "$(ssh -n nvx-prod-channel "tr -d '\\r\\n' < '$STAGING_ROOT/wp-content/themes/nuvanx-medical/.nvx-deploy-sha'")" = "$EXPECTED_STAGING_SHA"
          test "$(ssh -n nvx-prod-channel "cd '$PROD_ROOT' && wp config get DB_NAME")" = 'db0ecrycwv2tgb'
          test "$(ssh -n nvx-prod-channel "cd '$STAGING_ROOT' && wp config get DB_NAME")" = 'dbshcocboodiwr'
          test "$(ssh -n nvx-prod-channel "cd '$PROD_ROOT' && wp option get home")" = 'https://nuvanx.com'
          test "$(ssh -n nvx-prod-channel "cd '$STAGING_ROOT' && wp option get home")" = 'https://staging2.nuvanx.com'
          echo 'RESPONSIVE_GENERATE_ENVIRONMENT_GUARD=PASS'

      - name: Build deterministic WordPress image-generation script
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/nvx-generate-responsive.php" <<'PHP'
          <?php
          if ($argc < 2) {
              fwrite(STDERR, "Missing WordPress root\n");
              exit(2);
          }
          $root = rtrim($argv[1], '/');
          require $root . '/wp-load.php';

          $items = [
              ['2026/05/higiene-facial-con-microdermoabrasion.webp', '2026/05/higiene-facial-con-microdermoabrasion-480x320.webp', 480, 320],
              ['2026/05/diatermia-facial.webp', '2026/05/diatermia-facial-480x320.webp', 480, 320],
              ['2026/05/depilacion-laser.webp', '2026/05/depilacion-laser-480x320.webp', 480, 320],
              ['2026/05/hidrolipoclasia.webp', '2026/05/hidrolipoclasia-480x320.webp', 480, 320],
              ['2026/05/masajes-posoperatorios.webp', '2026/05/masajes-posoperatorios-480x320.webp', 480, 320],
              ['2026/05/radiofrecuencia-corporal.webp', '2026/05/radiofrecuencia-corporal-480x320.webp', 480, 320],
              ['2026/05/presoterapia.webp', '2026/05/presoterapia-480x320.webp', 480, 320],
              ['2026/05/tratamiento-anticelulitico.webp', '2026/05/tratamiento-anticelulitico-480x320.webp', 480, 320],
              ['2026/02/casmara.webp', '2026/02/casmara-480x194.webp', 480, 194],
          ];

          $upload = wp_get_upload_dir();
          if (!empty($upload['error'])) {
              fwrite(STDERR, "Upload directory error: {$upload['error']}\n");
              exit(3);
          }
          $basedir = rtrim($upload['basedir'], '/');
          $made = 0;

          foreach ($items as [$srcRel, $dstRel, $width, $height]) {
              $src = $basedir . '/' . $srcRel;
              $dst = $basedir . '/' . $dstRel;
              if (!is_file($src) || filesize($src) <= 0) {
                  fwrite(STDERR, "SOURCE_MISSING {$srcRel}\n");
                  exit(4);
              }

              if (is_file($dst) && filesize($dst) > 0) {
                  $info = @getimagesize($dst);
                  if (is_array($info) && (int)$info[0] === $width && (int)$info[1] === $height) {
                      echo "DERIVATIVE_ALREADY_VALID rel={$dstRel} {$width}x{$height}\n";
                      $made++;
                      continue;
                  }
                  fwrite(STDERR, "DERIVATIVE_CONFLICT {$dstRel}\n");
                  exit(5);
              }

              $editor = wp_get_image_editor($src);
              if (is_wp_error($editor)) {
                  fwrite(STDERR, "EDITOR_FAIL {$srcRel}: " . $editor->get_error_message() . "\n");
                  exit(6);
              }
              $resized = $editor->resize($width, $height, false);
              if (is_wp_error($resized)) {
                  fwrite(STDERR, "RESIZE_FAIL {$srcRel}: " . $resized->get_error_message() . "\n");
                  exit(7);
              }
              $saved = $editor->save($dst, 'image/webp');
              if (is_wp_error($saved)) {
                  fwrite(STDERR, "SAVE_FAIL {$dstRel}: " . $saved->get_error_message() . "\n");
                  exit(8);
              }
              if (!is_file($dst) || filesize($dst) <= 0) {
                  fwrite(STDERR, "SAVE_MISSING {$dstRel}\n");
                  exit(9);
              }
              $info = @getimagesize($dst);
              if (!is_array($info) || (int)$info[0] !== $width || (int)$info[1] !== $height) {
                  fwrite(STDERR, "DIMENSION_FAIL {$dstRel} got=" . (is_array($info) ? "{$info[0]}x{$info[1]}" : 'unknown') . " expected={$width}x{$height}\n");
                  exit(10);
              }
              echo "DERIVATIVE_GENERATED rel={$dstRel} {$width}x{$height} bytes=" . filesize($dst) . " sha256=" . hash_file('sha256', $dst) . "\n";
              $made++;
          }

          if ($made !== count($items)) {
              fwrite(STDERR, "COUNT_FAIL made={$made} expected=" . count($items) . "\n");
              exit(11);
          }
          echo "RESPONSIVE_DERIVATIVES_GENERATED=PASS files={$made}\n";
          PHP
          php -l "$RUNNER_TEMP/nvx-generate-responsive.php"
          base64 -w0 "$RUNNER_TEMP/nvx-generate-responsive.php" > "$RUNNER_TEMP/nvx-generate-responsive.b64"

      - name: Generate only missing derivatives in Staging2
        shell: bash
        run: |
          set -euo pipefail
          payload="$(cat "$RUNNER_TEMP/nvx-generate-responsive.b64")"
          remote_script="/tmp/nvx-generate-responsive-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.php"
          echo "REMOTE_SCRIPT=$remote_script" >> "$GITHUB_ENV"
          ssh -n nvx-prod-channel "printf '%s' '$payload' | base64 -d > '$remote_script' && chmod 600 '$remote_script' && php -l '$remote_script'"
          ssh -n nvx-prod-channel "php '$remote_script' '$STAGING_ROOT'"

      - name: Purge staging caches and verify all nine URLs
        shell: bash
        run: |
          set -euo pipefail
          ssh -n nvx-prod-channel "cd '$STAGING_ROOT' && wp cache flush >/dev/null"
          ssh -n nvx-prod-channel "cd '$STAGING_ROOT' && if wp help sg >/dev/null 2>&1; then wp sg purge >/dev/null 2>&1 || true; fi"
          ssh -n nvx-prod-channel "cd '$STAGING_ROOT' && wp eval 'if (function_exists(\"opcache_reset\")) { opcache_reset(); }' >/dev/null || true"

          manifest="$RUNNER_TEMP/nvx-responsive-http.txt"
          cat > "$manifest" <<'EOF'
          2026/05/higiene-facial-con-microdermoabrasion-480x320.webp
          2026/05/diatermia-facial-480x320.webp
          2026/05/depilacion-laser-480x320.webp
          2026/05/hidrolipoclasia-480x320.webp
          2026/05/masajes-posoperatorios-480x320.webp
          2026/05/radiofrecuencia-corporal-480x320.webp
          2026/05/presoterapia-480x320.webp
          2026/05/tratamiento-anticelulitico-480x320.webp
          2026/02/casmara-480x194.webp
          EOF
          sed -i 's/^[[:space:]]*//' "$manifest"
          ua='NUVANX-Staging-Responsive-Generate/1.0'
          count=0
          while IFS= read -r rel; do
            test -n "$rel" || continue
            code="$(ssh -n nvx-prod-channel "curl -sS --max-time 20 -A '$ua' -o /dev/null -w '%{http_code}' '$STAGING_URL/wp-content/uploads/$rel'")"
            test "$code" = '200'
            echo "RESPONSIVE_HTTP=PASS rel=$rel"
            count=$((count + 1))
          done < "$manifest"
          test "$count" = '9'
          echo 'STAGING_RESPONSIVE_GENERATE_HTTP=PASS files=9'

      - name: Remove temporary remote script
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${REMOTE_SCRIPT:-}" ]] && [[ -f "$HOME/.ssh/config" ]]; then
            ssh -n nvx-prod-channel "rm -f '$REMOTE_SCRIPT'" || true
          fi

      - name: Destroy SSH identity
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/key" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"
