name: Patch stale visual QA home H1 once

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/patch-visual-qa-home-h1.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/valoracion-cta-action-20260730'
    runs-on: ubuntu-latest
    steps:
      - name: Check out operational branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/valoracion-cta-action-20260730
          fetch-depth: 0
          persist-credentials: true

      - name: Align one stale visual expectation
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/staging2/capture-visual-qa.mjs')
          source = path.read_text(encoding='utf-8')
          old = "['/', 'Medicina estética con criterio médico y resultados naturales.']"
          new = "['/', 'Medicina estética con rigor clínico y resultados naturales.']"
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'Expected one stale home H1 marker, found {count}')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
          node --check scripts/staging2/capture-visual-qa.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/staging2/capture-visual-qa.mjs
          git commit -m 'test(staging2): align visual QA home H1'
          git push origin HEAD:fix/valoracion-cta-action-20260730
