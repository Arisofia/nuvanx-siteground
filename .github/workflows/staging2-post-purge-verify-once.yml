name: Staging2 Post Purge Verify Once

on:
  push:
    paths:
      - '.github/workflows/staging2-post-purge-verify-once.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WP_ROOT: /home/customer/www/staging2.nuvanx.com/public_html
      EXPECTED_SHA: 2c4b0e999686240cc2150e1eb76c9ca40c9e7f51
      OLD_SHA: 2e4c4deeda2cbb41bd7604e7e3c2b28a828a0374
    steps:
      - name: Runner public probe with challenge classification
        shell: bash
        run: |
          set -euo pipefail
          routes=(
            '/'
            '/soluciones-medicas/'
            '/equipo-medico/'
            '/blog/'
            '/endolift-primeras-72-horas-que-esperar/'
          )
          for route in "${routes[@]}"; do
            ok=0
            for attempt in 1 2 3; do
              curl -sS --max-time 20 -A 'NUVANX-Staging-Boundary/1.0' -D /tmp/h -o /tmp/b "https://staging2.nuvanx.com${route}" -w "route=$route attempt=$attempt status=%{http_code} final=%{url_effective}\n" || true
              status="$(awk 'toupper($1) ~ /^HTTP\// {s=$2} END {print s}' /tmp/h)"
              captcha="$(grep -i '^sg-captcha:' /tmp/h || true)"
              cache="$(grep -i '^x-proxy-cache:' /tmp/h || true)"
              echo "status=$status ${captcha:-sg-captcha=NONE} ${cache:-x-proxy-cache=NONE}"
              if grep -Fq "$EXPECTED_SHA" /tmp/b 2>/dev/null; then
                echo 'runner_html_sha=EXPECTED'
                test "$status" = '200'
                ok=1
                break
              elif grep -Fq "$OLD_SHA" /tmp/b 2>/dev/null; then
                echo 'runner_html_sha=OLD_STALE'
              else
                echo 'runner_html_sha=NONE_OR_CHALLENGE'
              fi
              sleep 4
            done
            echo "runner_route_ok=$ok"
          done

      - name: Configure strict SSH
        shell: bash
        env:
          HOST: ${{ secrets.STAGING2_SSH_HOST }}
          PORT: ${{ secrets.STAGING2_SSH_PORT }}
          USER: ${{ secrets.STAGING2_SSH_USER }}
          KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${HOST:?}"; : "${USER:?}"; : "${KEY:?}"; : "${KH:?}"
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/k"; chmod 600 "$HOME/.ssh/k"
          printf '%s\n' "$KH" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx
            HostName $HOST
            User $USER
            Port ${PORT:-18765}
            IdentityFile $HOME/.ssh/k
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 20
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Origin/server probe and plugin-state verification
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx "WP_ROOT='$WP_ROOT' EXPECTED_SHA='$EXPECTED_SHA' OLD_SHA='$OLD_SHA' bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$WP_ROOT"
          test "$(tr -d '\r\n' < wp-content/themes/nuvanx-medical/.nvx-deploy-sha)" = "$EXPECTED_SHA"
          if wp plugin is-active sg-cachepress; then echo 'staging_plugin_state=ACTIVE_ERROR'; exit 2; else echo 'staging_plugin_state=INACTIVE_PASS'; fi
          for route in / /soluciones-medicas/ /equipo-medico/ /blog/ /endolift-primeras-72-horas-que-esperar/; do
            curl -sS --max-time 20 -A 'NUVANX-Staging-Boundary/1.0' -D /tmp/h -o /tmp/b "https://staging2.nuvanx.com${route}" -w "route=$route status=%{http_code} final=%{url_effective}\n" || true
            grep -Ei '^(HTTP/|x-proxy-cache:|sg-captcha:|x-robots-tag:|location:)' /tmp/h || true
            if grep -Fq "$EXPECTED_SHA" /tmp/b; then
              echo 'server_html_sha=EXPECTED'
            elif grep -Fq "$OLD_SHA" /tmp/b; then
              echo 'server_html_sha=OLD_STALE'
            else
              echo 'server_html_sha=NONE_OR_CHALLENGE'
            fi
          done
          REMOTE

      - name: Cleanup SSH
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/k" "$HOME/.ssh/config" "$HOME/.ssh/known_hosts"
