name: PR274 compatibility correction

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.head_ref == 'fix/remove-redirect-exceptions-and-retire-legacy-routes' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out immutable PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Add workflow compatibility markers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          migration_path = Path('scripts/wp/nvx-canonical-route-migration.php')
          migration = migration_path.read_text(encoding='utf-8')
          audit_success = "            WP_CLI::success( 'Legacy route retirement audit passed.' );"
          apply_success = "        WP_CLI::success( 'Legacy route retirement applied.' );"
          if "WP_CLI::log( 'Canonical route audit passed.' );" not in migration:
              if migration.count(audit_success) != 1:
                  raise SystemExit('Expected one legacy audit success marker')
              migration = migration.replace(
                  audit_success,
                  "            WP_CLI::log( 'Canonical route audit passed.' );\n" + audit_success,
                  1,
              )
          if "WP_CLI::log( 'Canonical route migration applied.' );" not in migration:
              if migration.count(apply_success) != 1:
                  raise SystemExit('Expected one legacy apply success marker')
              migration = migration.replace(
                  apply_success,
                  "        WP_CLI::log( 'Canonical route migration applied.' );\n" + apply_success,
                  1,
              )
          migration_path.write_text(migration, encoding='utf-8')

          contract_path = Path('scripts/staging2/test-deploy-workflow-contract.mjs')
          contract = contract_path.read_text(encoding='utf-8')
          old = "  'Legacy route retirement applied.', 'Legacy route retirement audit passed.',\n"
          new = "  'Canonical route migration applied.', 'Canonical route audit passed.',\n"
          if old in contract:
              contract = contract.replace(old, new, 1)
          elif new not in contract:
              raise SystemExit('Workflow compatibility marker block not found')
          contract_path.write_text(contract, encoding='utf-8')
          PY

      - name: Validate and commit compatibility correction
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          php -l scripts/wp/nvx-canonical-route-migration.php
          node --check scripts/staging2/test-deploy-workflow-contract.mjs
          git add scripts/wp/nvx-canonical-route-migration.php scripts/staging2/test-deploy-workflow-contract.mjs
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ci): preserve deployment marker compatibility'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:fix/remove-redirect-exceptions-and-retire-legacy-routes
