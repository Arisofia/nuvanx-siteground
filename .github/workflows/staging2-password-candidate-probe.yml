name: Staging2 Password Candidate Probe

on:
  push:
    paths:
      - '.github/workflows/staging2-password-candidate-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment:
      name: staging2
    steps:
      - name: Check likely key names only
        shell: bash
        env:
          S1: ${{ secrets.STAGING2_DB_PASSWORD }}
          S2: ${{ secrets.STAGING_DB_PASSWORD }}
          S3: ${{ secrets.STAGING2_DB_PASS }}
          S4: ${{ secrets.STAGING_DB_PASS }}
          S5: ${{ secrets.STAGING2_MYSQL_PASSWORD }}
          S6: ${{ secrets.STAGING_MYSQL_PASSWORD }}
          S7: ${{ secrets.DB_PASSWORD }}
          S8: ${{ secrets.MYSQL_PASSWORD }}
          V1: ${{ vars.STAGING2_DB_PASSWORD }}
          V2: ${{ vars.STAGING_DB_PASSWORD }}
          V3: ${{ vars.STAGING2_DB_PASS }}
          V4: ${{ vars.STAGING_DB_PASS }}
          V5: ${{ vars.STAGING2_MYSQL_PASSWORD }}
          V6: ${{ vars.STAGING_MYSQL_PASSWORD }}
          V7: ${{ vars.DB_PASSWORD }}
          V8: ${{ vars.MYSQL_PASSWORD }}
        run: |
          set -euo pipefail
          names=(STAGING2_DB_PASSWORD STAGING_DB_PASSWORD STAGING2_DB_PASS STAGING_DB_PASS STAGING2_MYSQL_PASSWORD STAGING_MYSQL_PASSWORD DB_PASSWORD MYSQL_PASSWORD)
          for i in 1 2 3 4 5 6 7 8; do
            s="S$i"; v="V$i"; name="${names[$((i-1))]}"
            if test -n "${!s}"; then echo "candidate_secret_${name}=YES"; else echo "candidate_secret_${name}=NO"; fi
            if test -n "${!v}"; then echo "candidate_variable_${name}=YES"; else echo "candidate_variable_${name}=NO"; fi
          done
