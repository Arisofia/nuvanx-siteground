name: Gemini AI Code Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  gemini-code-review:
    name: Gemini Review
    # Run on PR open/sync, or when someone comments "/gemini-review" on a PR
    if: >
      github.event_name == 'pull_request' || 
      (github.event.issue.pull_request && contains(github.event.comment.body, '/gemini-review'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gemini AI Code Reviewer
        uses: truongnh1992/gemini-ai-code-reviewer@v9.2.1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Opcional: Modelos soportados (gemini-2.5-pro, gemini-2.5-flash, etc.)
          # GEMINI_MODEL: gemini-2.5-pro 
          EXCLUDE: "*.md,*.txt,package-lock.json,composer.lock,*.yml,*.yaml"
