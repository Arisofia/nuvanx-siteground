name: Staging2 Repair Pipeline Once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/staging2-repair-pipeline-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true

      - name: Refuse concurrent master movement
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote="$(git ls-remote origin refs/heads/master | cut -f1)"
          test "$remote" = "$GITHUB_SHA"
          test -f scripts/staging2/repair-pipeline-once.py

      - name: Generate and validate repaired state
        shell: bash
        run: |
          set -euo pipefail
          python scripts/staging2/repair-pipeline-once.py
          node --check scripts/staging2/block-c-52x3.mjs
          node --check scripts/staging2/verify-staging-boundary.mjs
          grep -q 'STAGING_RUNTIME_SAFETY=PASS' out/deploy-staging2.yml
          grep -q 'WP_DEBUG_DISPLAY false --raw' out/deploy-staging2.yml
          ! grep -q 'media-recovery' out/deploy-staging2.yml
          test ! -e scripts/staging2/media-recovery.php
          test ! -e scripts/staging2/repair-pipeline-once.py
          grep -q 'NUVANX-Staging-Boundary/1.0' scripts/staging2/verify-staging-boundary.mjs
          grep -q 'expectedClientMediaAbort' scripts/staging2/block-c-52x3.mjs
          grep -q 'Unable to reset page to scrollY=0' scripts/staging2/block-c-52x3.mjs
          git diff --check

      - name: Push non-workflow repairs
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/workflows/deploy-staging2.yml
          git config user.name 'NUVANX Staging QA'
          git config user.email 'admin@nuvanx.com'
          git add -A scripts/staging2
          git diff --cached --stat
          git diff --cached --quiet && { echo 'No non-workflow changes to commit' >&2; exit 1; }
          remote="$(git ls-remote origin refs/heads/master | cut -f1)"
          test "$remote" = "$GITHUB_SHA"
          git commit -m 'fix(qa): make Block C measurements deterministic'
          git push origin HEAD:master

      - name: Upload corrected deploy workflow
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        with:
          name: corrected-deploy-staging2-${{ github.run_id }}
          path: out/deploy-staging2.yml
          retention-days: 1
          if-no-files-found: error
