name: Sonar Diagnostics

on:
  push:
    branches: [fix/release-hardening-20260808]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to query'
        required: true
        default: 'master'
      project_key:
        description: 'Sonar project key'
        required: true
        default: 'Arisofia_nuvanx-siteground'

concurrency:
  group: sonar-diagnostic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Query quality gate status
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.branch || github.ref_name }}
          PROJECT_KEY: ${{ inputs.project_key || 'Arisofia_nuvanx-siteground' }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-all-errors --max-time 30 --retry-max-time 120 \
            -H "Authorization: Bearer ${SONAR_TOKEN}" \
            "https://sonarcloud.io/api/qualitygates/project_status?projectKey=${PROJECT_KEY}&branch=${TARGET_BRANCH}" \
            | python -m json.tool

      - name: Query duplication contributors
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.branch || github.ref_name }}
          PROJECT_KEY: ${{ inputs.project_key || 'Arisofia_nuvanx-siteground' }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-all-errors --max-time 30 --retry-max-time 120 \
            -H "Authorization: Bearer ${SONAR_TOKEN}" \
            "https://sonarcloud.io/api/measures/component_tree?component=${PROJECT_KEY}&branch=${TARGET_BRANCH}&metricKeys=new_duplicated_lines_density,new_lines,new_duplicated_lines&strategy=leaves&ps=500" \
            -o /tmp/tree.json
          python - <<'PY'
          import json, sys
          data=json.load(open('/tmp/tree.json',encoding='utf-8'))
          if data.get('paging', {}).get('total', 0) > 500:
              print('ERROR: Total components exceed 500. Pagination not implemented.', file=sys.stderr)
              sys.exit(1)
          rows=[]
          for c in data.get('components', []):
              vals={}
              for measure in c.get('measures',[]):
                  periods=measure.get('periods') or []
                  vals[measure['metric']]=float(periods[0].get('value',0)) if periods else float(measure.get('value',0) or 0)
              nl=vals.get('new_lines',0); nd=vals.get('new_duplicated_lines',0); dens=vals.get('new_duplicated_lines_density',0)
              if nl or nd or dens:
                  rows.append((nd,dens,nl,c.get('path') or ''))
          print('DUPLICATION_CONTRIBUTORS')
          for nd,dens,nl,path in sorted(rows, reverse=True):
              print(json.dumps({'path':path,'new_lines':nl,'new_duplicated_lines':nd,'density':dens}, ensure_ascii=False))
          PY

      - name: Query security and reliability issues
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.branch || github.ref_name }}
          PROJECT_KEY: ${{ inputs.project_key || 'Arisofia_nuvanx-siteground' }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          for quality in SECURITY RELIABILITY; do
            curl -fsS --retry 3 --retry-all-errors --max-time 30 --retry-max-time 120 \
              -H "Authorization: Bearer ${SONAR_TOKEN}" \
              "https://sonarcloud.io/api/issues/search?componentKeys=${PROJECT_KEY}&branch=${TARGET_BRANCH}&resolved=false&softwareQualities=${quality}&ps=500" \
              -o "/tmp/${quality}.json"
            QUALITY="$quality" python - <<'PY'
          import json, os, sys
          quality=os.environ['QUALITY']
          data=json.load(open(f'/tmp/{quality}.json',encoding='utf-8'))
          total = data.get('total', 0)
          print(quality, 'TOTAL', total)
          if total > 500:
              print(f'ERROR: Total {quality} issues exceed 500. Pagination not implemented.', file=sys.stderr)
              sys.exit(1)
          for issue in data.get('issues', []):
              impacts=issue.get('impacts') or []
              print(json.dumps({'rule':issue.get('rule'),'component':issue.get('component'),'line':issue.get('line'),'message':issue.get('message'),'impacts':impacts,'creationDate':issue.get('creationDate')},ensure_ascii=False))
          PY
          done

      - name: Query new-code quality metrics
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.branch || github.ref_name }}
          PROJECT_KEY: ${{ inputs.project_key || 'Arisofia_nuvanx-siteground' }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-all-errors --max-time 30 --retry-max-time 120 \
            -H "Authorization: Bearer ${SONAR_TOKEN}" \
            "https://sonarcloud.io/api/measures/component?component=${PROJECT_KEY}&branch=${TARGET_BRANCH}&metricKeys=new_duplicated_lines_density,new_security_rating,new_reliability_rating,new_maintainability_rating,new_lines,new_duplicated_lines" \
            | python -m json.tool
