name: Ops apply PR preview merge fix

on:
  push:
    branches:
      - ops/apply-pr-preview-merge-fix-20260817
    paths:
      - .github/workflows/ops-apply-pr-preview-merge-fix-20260817.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out operations helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ops/apply-pr-preview-merge-fix-20260817
          persist-credentials: false

      - name: Patch fix branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: fix/pr-preview-merge-tree-20260817
          TARGET_PATH: .github/workflows/staging.yml
        run: |
          set -euo pipefail
          response="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${TARGET_PATH}?ref=${TARGET_BRANCH}")"
          blob_sha="$(printf '%s' "$response" | jq -r '.sha')"
          printf '%s' "$response" | jq -r '.content' | tr -d '\n' | base64 -d > "$RUNNER_TEMP/staging.yml"
          python3 ops/apply-pr-preview-merge-fix.py "$RUNNER_TEMP/staging.yml"
          ! grep -Fq 'Rebase PR onto current master before preview.' "$RUNNER_TEMP/staging.yml"
          test "$(grep -Fc 'merge --no-commit --no-ff "$PR_SHA"' "$RUNNER_TEMP/staging.yml")" -eq 1
          test "$(grep -Fc 'export EXPECTED_SHA="$PR_PREVIEW_SHA"' "$RUNNER_TEMP/staging.yml")" -eq 1
          encoded="$(base64 -w0 "$RUNNER_TEMP/staging.yml")"
          gh api --method PUT "/repos/${GITHUB_REPOSITORY}/contents/${TARGET_PATH}" \
            -f message='fix(ci): preview merged PR tree on staging' \
            -f content="$encoded" \
            -f sha="$blob_sha" \
            -f branch="$TARGET_BRANCH" \
            --jq '.commit.sha'

      - name: Delete operations branch
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/heads/ops/apply-pr-preview-merge-fix-20260817" >/dev/null 2>&1
          exit 0
