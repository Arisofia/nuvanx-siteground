name: Staging2 Rendered Acceptance

on:
  workflow_run:
    workflows:
      - Deploy Staging2
    types:
      - completed
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: staging2-rendered-acceptance
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://staging2.nuvanx.com
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
      SSH_FETCH_HOST: nvx-staging2
    steps:
      - name: Checkout canonical acceptance contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'

      - name: Validate expected SHA input
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(printf '%s' "$EXPECTED_SHA" | tr -d '[:space:]')"
          echo "EXPECTED_SHA=$EXPECTED_SHA" >> "$GITHUB_ENV"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'expected_sha must be a full lowercase 40-character SHA.' >&2
            exit 1
          }

      - name: Configure strict SSH authentication
        shell: bash
        env:
          STAGING2_SSH_HOST: ${{ secrets.STAGING2_SSH_HOST }}
          STAGING2_SSH_PORT: ${{ secrets.STAGING2_SSH_PORT }}
          STAGING2_SSH_USER: ${{ secrets.STAGING2_SSH_USER }}
          STAGING2_SSH_PRIVATE_KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          STAGING2_SSH_KNOWN_HOSTS: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${STAGING2_SSH_HOST:?Missing STAGING2_SSH_HOST secret}"
          : "${STAGING2_SSH_USER:?Missing STAGING2_SSH_USER secret}"
          : "${STAGING2_SSH_PRIVATE_KEY:?Missing STAGING2_SSH_PRIVATE_KEY secret}"
          : "${STAGING2_SSH_KNOWN_HOSTS:?Missing STAGING2_SSH_KNOWN_HOSTS secret}"

          SSH_PORT="${STAGING2_SSH_PORT:-18765}"
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] || {
            echo 'STAGING2_SSH_PORT must be numeric.' >&2
            exit 1
          }
          [[ "$STAGING2_SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || {
            echo 'STAGING2_SSH_HOST contains unsupported characters.' >&2
            exit 1
          }
          [[ "$STAGING2_SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo 'STAGING2_SSH_USER contains unsupported characters.' >&2
            exit 1
          }

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$STAGING2_SSH_PRIVATE_KEY" > "$HOME/.ssh/staging2_key"
          printf '%s\n' "$STAGING2_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/staging2_key" "$HOME/.ssh/known_hosts"

          printf 'Host nvx-staging2\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile %s/.ssh/staging2_key\n  IdentitiesOnly yes\n  BatchMode yes\n  StrictHostKeyChecking yes\n  UserKnownHostsFile %s/.ssh/known_hosts\n  ConnectTimeout 15\n' \
            "$STAGING2_SSH_HOST" \
            "$STAGING2_SSH_USER" \
            "$SSH_PORT" \
            "$HOME" \
            "$HOME" > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"

      - name: Verify SSH reachability for rendered acceptance
        shell: bash
        run: |
          set -euo pipefail
          ssh -o ConnectTimeout=20 nvx-staging2 'command -v curl >/dev/null && command -v mktemp >/dev/null'

      - name: Verify rendered document, integrations and route consistency
        run: node scripts/staging2/verify-rendered-document.mjs
