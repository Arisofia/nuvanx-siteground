name: Staging2 Secret Scope Probe

on:
  push:
    paths:
      - '.github/workflows/staging2-secret-scope-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment:
      name: staging2
    env:
      SECRETS_JSON: ${{ toJSON(secrets) }}
      VARS_JSON: ${{ toJSON(vars) }}
    steps:
      - name: Report only matching credential key names
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          secrets = json.loads(os.environ.get('SECRETS_JSON') or '{}')
          variables = json.loads(os.environ.get('VARS_JSON') or '{}')
          pattern = re.compile(r'(STAGING.*(DB|MYSQL).*(PASS|PASSWORD))|((DB|MYSQL).*(PASS|PASSWORD).*STAGING)', re.I)
          secret_matches = sorted(k for k in secrets if pattern.search(k))
          variable_matches = sorted(k for k in variables if pattern.search(k))
          print('matching_action_secret_names=' + (','.join(secret_matches) if secret_matches else 'NONE'))
          print('matching_action_variable_names=' + (','.join(variable_matches) if variable_matches else 'NONE'))
          print('exact_STAGING2_DB_PASSWORD_secret=' + ('YES' if 'STAGING2_DB_PASSWORD' in secrets else 'NO'))
          print('exact_STAGING2_DB_PASSWORD_variable=' + ('YES' if 'STAGING2_DB_PASSWORD' in variables else 'NO'))
          PY
