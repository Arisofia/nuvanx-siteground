name: Sonar Diagnostics

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to query when pull_request is empty'
        required: true
        default: 'master'
      pull_request:
        description: 'Optional pull request number to query instead of branch'
        required: false
        default: ''
      project_key:
        description: 'Sonar project key'
        required: true
        default: 'Arisofia_nuvanx-siteground'

concurrency:
  group: sonar-diagnostic-${{ github.ref }}-${{ inputs.project_key }}-${{ inputs.branch }}-${{ inputs.pull_request }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: ${{ inputs.branch }}
      PULL_REQUEST: ${{ inputs.pull_request }}
      PROJECT_KEY: ${{ inputs.project_key }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Query SonarCloud quality gate and metrics
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SONAR_TOKEN:-}" ] || { echo 'SONAR_TOKEN missing'; exit 1; }
          base='https://sonarcloud.io/api'
          scope=()
          if [[ -n "$PULL_REQUEST" ]]; then
            [[ "$PULL_REQUEST" =~ ^[0-9]+$ ]]
            scope=(--data-urlencode "pullRequest=$PULL_REQUEST")
          else
            [[ -n "$TARGET_BRANCH" ]]
            scope=(--data-urlencode "branch=$TARGET_BRANCH")
          fi

          curl -fsS --retry 3 --max-time 30 --get \
            -H "Authorization: Bearer ${SONAR_TOKEN}" \
            --data-urlencode "projectKey=$PROJECT_KEY" \
            "${scope[@]}" \
            "$base/qualitygates/project_status" -o /tmp/gate.json
          echo '=== QUALITY GATE ==='
          python -m json.tool /tmp/gate.json

          curl -fsS --retry 3 --max-time 30 --get \
            -H "Authorization: Bearer ${SONAR_TOKEN}" \
            --data-urlencode "component=$PROJECT_KEY" \
            --data-urlencode 'metricKeys=new_duplicated_lines_density,new_duplicated_lines,new_lines,new_security_rating,new_reliability_rating,new_maintainability_rating' \
            "${scope[@]}" \
            "$base/measures/component" -o /tmp/measures.json
          echo '=== NEW CODE METRICS ==='
          python -m json.tool /tmp/measures.json

      - name: Query unresolved security and reliability issues
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SONAR_TOKEN:-}" ] || { echo 'SONAR_TOKEN missing'; exit 1; }
          base='https://sonarcloud.io/api'
          scope=()
          if [[ -n "$PULL_REQUEST" ]]; then
            scope=(--data-urlencode "pullRequest=$PULL_REQUEST")
          else
            scope=(--data-urlencode "branch=$TARGET_BRANCH")
          fi

          for quality in SECURITY RELIABILITY; do
            p=1
            while true; do
              curl -fsS --retry 3 --max-time 30 --retry-max-time 120 \
                -H "Authorization: Bearer ${SONAR_TOKEN}" \
                --get --data-urlencode "componentKeys=${PROJECT_KEY}" \
                --data-urlencode "resolved=false" \
                --data-urlencode "impactSoftwareQualities=${quality}" \
                --data-urlencode "ps=500" \
                --data-urlencode "p=$p" \
                "${scope[@]}" \
                "https://sonarcloud.io/api/issues/search" -o "/tmp/${quality}_${p}.json"
              MORE=$(FILE="/tmp/${quality}_${p}.json" PAGE="$p" python - <<'PY'
import json, os
data = json.load(open(os.environ['FILE'], encoding='utf-8'))
paging = data.get('paging', {})
t = data.get('total')
if t is None: t = paging.get('total', 0)
ps = data.get('ps')
if ps is None: ps = paging.get('pageSize', 500)
p = int(os.environ['PAGE'])
if p * int(ps) >= 10000 and int(t) > 10000: print('2')
elif int(t) > p * int(ps): print('1')
else: print('0')
PY
              )
              if [ "$MORE" = "0" ]; then
                break
              elif [ "$MORE" = "2" ]; then
                echo "WARNING: Reached 10,000 issues limit for ${quality}. Results truncated." >&2
                break
              fi
              p=$((p+1))
            done
            QUALITY="$quality" python - <<'PY'
import json, os, glob
quality = os.environ['QUALITY']
issues = []
for f in glob.glob(f'/tmp/{quality}_*.json'):
    data = json.load(open(f, encoding='utf-8'))
    issues.extend(data.get('issues', []))
print(f'=== {quality} ISSUES: {len(issues)} ===')
for issue in issues:
    print({
        'rule': issue.get('rule'),
        'component': issue.get('component'),
        'line': issue.get('line'),
        'message': issue.get('message'),
        'creationDate': issue.get('creationDate'),
    })
PY
          done

      - name: Query duplication contributors
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SONAR_TOKEN:-}" ] || { echo 'SONAR_TOKEN missing'; exit 1; }
          base='https://sonarcloud.io/api'
          scope=()
          if [[ -n "$PULL_REQUEST" ]]; then
            scope=(--data-urlencode "pullRequest=$PULL_REQUEST")
          else
            scope=(--data-urlencode "branch=$TARGET_BRANCH")
          fi
          
          p=1
          while true; do
            curl -fsS --retry 3 --max-time 30 --retry-max-time 120 \
              -H "Authorization: Bearer ${SONAR_TOKEN}" \
              --get --data-urlencode "component=${PROJECT_KEY}" \
              --data-urlencode "metricKeys=new_duplicated_lines_density,new_lines,new_duplicated_lines" \
              --data-urlencode "strategy=leaves" \
              --data-urlencode "ps=500" \
              --data-urlencode "p=$p" \
              "${scope[@]}" \
              "https://sonarcloud.io/api/measures/component_tree" -o "/tmp/tree_${p}.json"
            MORE=$(FILE="/tmp/tree_${p}.json" PAGE="$p" python - <<'PY'
import json, os
data = json.load(open(os.environ['FILE'], encoding='utf-8'))
paging = data.get('paging', {})
t = data.get('total')
if t is None: t = paging.get('total', 0)
ps = data.get('ps')
if ps is None: ps = paging.get('pageSize', 500)
p = int(os.environ['PAGE'])
if p * int(ps) >= 10000 and int(t) > 10000: print('2')
elif int(t) > p * int(ps): print('1')
else: print('0')
PY
            )
            if [ "$MORE" = "0" ]; then
              break
            elif [ "$MORE" = "2" ]; then
              echo "WARNING: Reached 10,000 components limit. Results truncated." >&2
              break
            fi
            p=$((p+1))
          done
          
          python - <<'PY'
import json, sys, glob
rows=[]
for f in glob.glob('/tmp/tree_*.json'):
    data=json.load(open(f,encoding='utf-8'))
    for c in data.get('components', []):
        vals={}
        for measure in c.get('measures',[]):
            periods=measure.get('periods') or []
            period=measure.get('period') or {}
            if periods:
                val = periods[0].get('value',0)
            elif period:
                val = period.get('value',0)
            else:
                val = measure.get('value',0)
            vals[measure['metric']]=float(val or 0)
        nl=vals.get('new_lines',0); nd=vals.get('new_duplicated_lines',0); dens=vals.get('new_duplicated_lines_density',0)
        if nl or nd or dens:
            rows.append((nd,dens,nl,c.get('path') or ''))
print('=== DUPLICATION CONTRIBUTORS ===')
for nd,dens,nl,path in sorted(rows, reverse=True):
    print(json.dumps({'path':path,'new_lines':nl,'new_duplicated_lines':nd,'density':dens}, ensure_ascii=False))
PY
