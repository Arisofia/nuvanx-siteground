name: Production d54 Authorized Promotion Once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/production-d54-authorized-promotion-once.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: production-d54-authorized-promotion
  cancel-in-progress: false

env:
  DEPLOY_SHA: d54dfa7df226dbd5b823fca1878ce8a60a3548cb
  PREVIOUS_PROD_SHA: 4775310be2b7dcdda18f8fd6de8e40041c2eb555
  ACCEPTANCE_RUN_ID: '31243994719'
  ACCEPTANCE_ARTIFACT_ID: '9017974491'
  PROD_ROOT: /home/customer/www/nuvanx.com/public_html
  STAGING_ROOT: /home/customer/www/staging2.nuvanx.com/public_html
  PROD_PARENT: /home/customer/www/nuvanx.com
  BASE_URL: https://nuvanx.com
  EXPECTED_HOST: nuvanx.com

jobs:
  promote:
    name: Exact d54 · guarded production promotion
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out hardened operational tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: master
          path: ops
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact accepted candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: d54dfa7df226dbd5b823fca1878ce8a60a3548cb
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact candidate and hardened deploy path
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$DEPLOY_SHA"
          git -C ops fetch --no-tags origin master
          git -C ops cat-file -e "${DEPLOY_SHA}^{commit}"
          git -C ops merge-base --is-ancestor "$DEPLOY_SHA" origin/master
          test -f candidate/wp-content/themes/nuvanx-medical/functions.php
          bash -n ops/tools/deploy/deploy-to-prod.sh
          grep -Fq 'ROLLBACK_SNAPSHOT=PASS' ops/tools/deploy/deploy-to-prod.sh
          grep -Fq 'ROLLBACK_PRODUCTION=PASS' ops/tools/deploy/deploy-to-prod.sh
          grep -Fq '.nvx-deploy-sha' ops/tools/deploy/deploy-to-prod.sh
          if grep -E -q -- '-o[[:space:]]+StrictHostKeyChecking=no|StrictHostKeyChecking[[:space:]]+no' ops/tools/deploy/deploy-to-prod.sh; then
            echo 'Unsafe SSH host-key bypass found in executable production deploy script.' >&2
            exit 1
          fi
          find candidate/wp-content/themes/nuvanx-medical -path '*/vendor' -prune -o -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null
          echo 'D54_IMMUTABLE_CANDIDATE=PASS'

      - name: Verify exact successful Block C evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ACCEPTANCE_ARTIFACT_ID}")"
          test "$(printf '%s' "$artifact" | jq -r '.id')" = "$ACCEPTANCE_ARTIFACT_ID"
          test "$(printf '%s' "$artifact" | jq -r '.name')" = "staging2-block-c-${DEPLOY_SHA}"
          test "$(printf '%s' "$artifact" | jq -r '.expired')" = 'false'
          test "$(printf '%s' "$artifact" | jq -r '.workflow_run.id')" = "$ACCEPTANCE_RUN_ID"
          run="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${ACCEPTANCE_RUN_ID}")"
          test "$(printf '%s' "$run" | jq -r '.conclusion')" = 'success'
          echo "D54_BLOCK_C_EVIDENCE=PASS artifact=$ACCEPTANCE_ARTIFACT_ID run=$ACCEPTANCE_RUN_ID"

      - name: Configure strict production SSH
        shell: bash
        env:
          HOST: ${{ secrets.PROD_SSH_HOST }}
          PORT: ${{ secrets.PROD_SSH_PORT }}
          USER: ${{ secrets.PROD_SSH_USER }}
          KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${HOST:?Missing PROD_SSH_HOST}"
          : "${USER:?Missing PROD_SSH_USER}"
          : "${KEY:?Missing PROD_SSH_PRIVATE_KEY}"
          : "${KH:?Missing PROD_SSH_KNOWN_HOSTS}"
          SSH_PORT="${PORT:-18765}"
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/prod_key"; chmod 600 "$HOME/.ssh/prod_key"
          printf '%s\n' "$KH" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx-prod
            HostName $HOST
            User $USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/prod_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 20
            ServerAliveInterval 30
            ServerAliveCountMax 2
          EOF
          chmod 600 "$HOME/.ssh/config"
          ssh -n nvx-prod "test -d '$PROD_ROOT' && test -d '$STAGING_ROOT' && command -v wp >/dev/null && command -v rsync >/dev/null && command -v php >/dev/null && command -v tar >/dev/null && command -v curl >/dev/null"
          echo 'PRODUCTION_D54_SSH_STRICT=PASS'

      - name: Guard exact production and staging identities
        shell: bash
        run: |
          set -euo pipefail
          prod_sha="$(ssh -n nvx-prod "tr -d '\\r\\n' < '$PROD_ROOT/wp-content/themes/nuvanx-medical/.nvx-deploy-sha'")"
          staging_sha="$(ssh -n nvx-prod "tr -d '\\r\\n' < '$STAGING_ROOT/wp-content/themes/nuvanx-medical/.nvx-deploy-sha'")"
          test "$prod_sha" = "$PREVIOUS_PROD_SHA"
          test "$staging_sha" = "$DEPLOY_SHA"
          test "$(ssh -n nvx-prod "cd '$PROD_ROOT' && wp config get DB_NAME")" = 'db0ecrycwv2tgb'
          test "$(ssh -n nvx-prod "cd '$PROD_ROOT' && wp option get home")" = 'https://nuvanx.com'
          test "$(ssh -n nvx-prod "cd '$PROD_ROOT' && wp option get siteurl")" = 'https://nuvanx.com'
          test "$(ssh -n nvx-prod "cd '$PROD_ROOT' && wp option get blog_public")" = '1'
          test "$(ssh -n nvx-prod "cd '$PROD_ROOT' && wp theme list --status=active --field=name")" = 'nuvanx-medical'
          test "$(ssh -n nvx-prod "cd '$STAGING_ROOT' && wp config get DB_NAME")" = 'dbshcocboodiwr'
          test "$(ssh -n nvx-prod "cd '$STAGING_ROOT' && wp option get home")" = 'https://staging2.nuvanx.com'
          test "$(ssh -n nvx-prod "cd '$STAGING_ROOT' && wp option get blog_public")" = '0'
          echo "PRODUCTION_GUARD=PASS current=$prod_sha staging=$staging_sha"

      - name: Verify production public boundary before mutation
        shell: bash
        run: |
          set -euo pipefail
          ssh -n nvx-prod "BASE_URL='$BASE_URL' EXPECTED_SHA='$PREVIOUS_PROD_SHA' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          ua='NUVANX-Production-Origin-Boundary/2.0'
          for route in '/' '/soluciones-medicas/' '/equipo-medico/' '/blog/' '/endolift-primeras-72-horas-que-esperar/' '/madrid/valoracion/' '/contacto/'; do
            headers="$(mktemp)"; body="$(mktemp)"
            result="$(curl -sS -L --max-redirs 5 --max-time 30 -A "$ua" -H 'Accept: text/html,application/xhtml+xml' -D "$headers" -o "$body" -w '%{http_code}|%{url_effective}' "${BASE_URL}${route}")"
            code="${result%%|*}"; effective="${result#*|}"
            test "$code" = '200'
            case "$effective" in https://nuvanx.com/*|https://nuvanx.com) ;; *) exit 1 ;; esac
            ! grep -Fq '/.well-known/sgcaptcha/' "$body"
            ! grep -Fq 'staging2.nuvanx.com' "$body"
            grep -Fq "$EXPECTED_SHA" "$body"
            ! grep -Eiq '^x-robots-tag:.*(noindex|nofollow)' "$headers"
            robots_meta="$(grep -Eio "<meta[^>]+name=['\"]robots['\"][^>]*>" "$body" | head -n 1 || true)"
            if [[ -n "$robots_meta" ]] && printf '%s' "$robots_meta" | grep -Eiq '(noindex|nofollow)'; then exit 1; fi
            rm -f "$headers" "$body"
          done
          echo "PRODUCTION_ORIGIN_PREFLIGHT=PASS sha=$EXPECTED_SHA"
          REMOTE

      - name: Upload exact d54 payload and deploy tooling to isolated release
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_RELEASE="$PROD_PARENT/.nvx-releases/${DEPLOY_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "REMOTE_RELEASE=$REMOTE_RELEASE" >> "$GITHUB_ENV"
          ssh -n nvx-prod "test ! -e '$REMOTE_RELEASE' && mkdir -p '$REMOTE_RELEASE/theme' '$REMOTE_RELEASE/media-staged'"
          rsync -az --delete --exclude='.git' --exclude='php_errorlog' --exclude='*.log' --exclude='_archive*' --exclude='_disabled*' --exclude='*.bak*' candidate/wp-content/themes/nuvanx-medical/ "nvx-prod:$REMOTE_RELEASE/theme/"
          rsync -az ops/tools/deploy/deploy-to-prod.sh "nvx-prod:$REMOTE_RELEASE/deploy-to-prod.sh"
          ssh -n nvx-prod "test -f '$REMOTE_RELEASE/theme/functions.php' && test -f '$REMOTE_RELEASE/deploy-to-prod.sh'"
          echo 'D54_ISOLATED_PAYLOAD=PASS'

      - name: Back up exact production contents that will be normalized
        shell: bash
        run: |
          set -euo pipefail
          ssh -n nvx-prod "PROD_ROOT='$PROD_ROOT' REMOTE_RELEASE='$REMOTE_RELEASE' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$PROD_ROOT"
          REMOTE_RELEASE="$REMOTE_RELEASE" wp eval '
          $slugs=["remodelacion-corporal-laser-madrid","tratamiento-postparto-abdomen-contorno-corporal-madrid"];
          $backup=[];$legacy=0;
          foreach($slugs as $slug){$p=get_page_by_path($slug,OBJECT,"page");if(!$p instanceof WP_Post){fwrite(STDERR,"CONTENT_BACKUP_MISSING slug={$slug}\n");exit(1);} $count=substr_count((string)$p->post_content,"/valoracion-medica/"); if($count<1){fwrite(STDERR,"CONTENT_BACKUP_LEGACY_MISSING slug={$slug}\n");exit(1);} $legacy+=$count;$backup[]=["ID"=>(int)$p->ID,"slug"=>$slug,"post_content"=>(string)$p->post_content,"sha256"=>hash("sha256",(string)$p->post_content)];}
          if(count($backup)!==2||$legacy!==2){fwrite(STDERR,"CONTENT_BACKUP_COUNT_FAIL pages=".count($backup)." legacy={$legacy}\n");exit(1);} file_put_contents(getenv("REMOTE_RELEASE")."/content-backup.json",wp_json_encode($backup,JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES)); echo "CONTENT_BACKUP=PASS pages=2 legacy=2\n";'
          test -s "$REMOTE_RELEASE/content-backup.json"
          chmod 600 "$REMOTE_RELEASE/content-backup.json"
          REMOTE

      - name: Stage nine responsive derivatives away from live uploads
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/nvx-stage-responsive.php" <<'PHP'
          <?php
          [$self,$root,$out]=array_pad($argv,3,null);
          if(!$root||!$out){fwrite(STDERR,"args\n");exit(2);} require rtrim($root,'/').'/wp-load.php';
          $items=[
            ['2026/05/higiene-facial-con-microdermoabrasion.webp','2026/05/higiene-facial-con-microdermoabrasion-480x320.webp',480,320],
            ['2026/05/diatermia-facial.webp','2026/05/diatermia-facial-480x320.webp',480,320],
            ['2026/05/depilacion-laser.webp','2026/05/depilacion-laser-480x320.webp',480,320],
            ['2026/05/hidrolipoclasia.webp','2026/05/hidrolipoclasia-480x320.webp',480,320],
            ['2026/05/masajes-posoperatorios.webp','2026/05/masajes-posoperatorios-480x320.webp',480,320],
            ['2026/05/radiofrecuencia-corporal.webp','2026/05/radiofrecuencia-corporal-480x320.webp',480,320],
            ['2026/05/presoterapia.webp','2026/05/presoterapia-480x320.webp',480,320],
            ['2026/05/tratamiento-anticelulitico.webp','2026/05/tratamiento-anticelulitico-480x320.webp',480,320],
            ['2026/02/casmara.webp','2026/02/casmara-480x194.webp',480,194],
          ];
          $u=wp_get_upload_dir();$base=rtrim($u['basedir'],'/');$made=0;
          foreach($items as [$srcRel,$dstRel,$w,$h]){$src="$base/$srcRel";$dst=rtrim($out,'/')."/$dstRel";if(!is_file($src)||filesize($src)<=0){fwrite(STDERR,"SOURCE_MISSING $srcRel\n");exit(3);} if(!is_dir(dirname($dst))&&!mkdir(dirname($dst),0755,true)){fwrite(STDERR,"MKDIR_FAIL $dstRel\n");exit(4);} $ed=wp_get_image_editor($src);if(is_wp_error($ed)){fwrite(STDERR,"EDITOR_FAIL $srcRel\n");exit(5);} $r=$ed->resize($w,$h,false);if(is_wp_error($r)){fwrite(STDERR,"RESIZE_FAIL $srcRel\n");exit(6);} $s=$ed->save($dst,'image/webp');if(is_wp_error($s)){fwrite(STDERR,"SAVE_FAIL $dstRel\n");exit(7);} $i=@getimagesize($dst);if(!is_array($i)||(int)$i[0]!==$w||(int)$i[1]!==$h){fwrite(STDERR,"DIM_FAIL $dstRel\n");exit(8);} echo "MEDIA_STAGE=PASS rel=$dstRel {$w}x{$h}\n";$made++;}
          if($made!==9){exit(9);} echo "MEDIA_STAGE_TOTAL=PASS files=9\n";
          PHP
          php -l "$RUNNER_TEMP/nvx-stage-responsive.php"
          scp "$RUNNER_TEMP/nvx-stage-responsive.php" "nvx-prod:$REMOTE_RELEASE/stage-responsive.php"
          ssh -n nvx-prod "php '$REMOTE_RELEASE/stage-responsive.php' '$PROD_ROOT' '$REMOTE_RELEASE/media-staged'"

      - name: Validate production DB template references against isolated d54
        shell: bash
        run: |
          set -euo pipefail
          ssh -n nvx-prod "PROD_ROOT='$PROD_ROOT' CANDIDATE_THEME='$REMOTE_RELEASE/theme' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$PROD_ROOT"; test -f "$CANDIDATE_THEME/functions.php"; checked=0
          page_ids="$(wp post list --post_type=page --post_status=publish --field=ID)"
          for page_id in $page_ids; do
            template="$(wp post meta get "$page_id" _wp_page_template 2>/dev/null || true)"; [[ -n "$template" ]] || template='default'; [[ "$template" == 'default' ]] && continue
            case "$template" in /*|*'..'*) exit 1 ;; esac
            test -f "$CANDIDATE_THEME/$template"; checked=$((checked+1))
          done
          echo "D54_CANDIDATE_TEMPLATE_REFERENCES=PASS custom_templates=$checked"
          REMOTE

      - name: Execute guarded production d54 cutover
        shell: bash
        run: |
          set -euo pipefail
          echo 'CUTOVER_ATTEMPTED=true' >> "$GITHUB_ENV"
          ssh -n nvx-prod "NVX_RUN_TOKEN='${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}' NUVANX_CONFIRM=yes bash '$REMOTE_RELEASE/deploy-to-prod.sh' --prod-root '$PROD_ROOT' --source-theme '$REMOTE_RELEASE/theme' --sha '$DEPLOY_SHA' --confirm"
          echo 'D54_THEME_CUTOVER=PASS'

      - name: Normalize two production contents and materialize responsive derivatives
        shell: bash
        run: |
          set -euo pipefail
          ssh -n nvx-prod "PROD_ROOT='$PROD_ROOT' REMOTE_RELEASE='$REMOTE_RELEASE' DEPLOY_SHA='$DEPLOY_SHA' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$PROD_ROOT"
          test "$(tr -d '\r\n' < wp-content/themes/nuvanx-medical/.nvx-deploy-sha)" = "$DEPLOY_SHA"
          REMOTE_RELEASE="$REMOTE_RELEASE" wp eval '
          $backup=json_decode(file_get_contents(getenv("REMOTE_RELEASE")."/content-backup.json"),true);if(!is_array($backup)||count($backup)!==2){exit(1);} $changed=0;
          foreach($backup as $row){$id=(int)$row["ID"];$p=get_post($id);if(!$p instanceof WP_Post){exit(1);} $updated=str_replace(["https://nuvanx.com/valoracion-medica/","/valoracion-medica/"],["https://nuvanx.com/madrid/valoracion/","/madrid/valoracion/"],(string)$p->post_content,$count);if($count<1){fwrite(STDERR,"CONTENT_NORMALIZE_NO_MATCH id={$id}\n");exit(1);} $r=wp_update_post(["ID"=>$id,"post_content"=>$updated],true);if(is_wp_error($r)){fwrite(STDERR,$r->get_error_message()."\n");exit(1);} $changed+=$count;}
          if($changed!==2){fwrite(STDERR,"CONTENT_NORMALIZE_COUNT={$changed}\n");exit(1);} echo "CONTENT_NORMALIZATION=PASS replacements={$changed}\n";'

          prefix="$(wp db prefix)"
          remaining="$(wp db query "SELECT COUNT(*) FROM ${prefix}posts WHERE post_status='publish' AND post_content LIKE '%/valoracion-medica/%';" --skip-column-names)"
          test "$remaining" = '0'
          echo 'LEGACY_VALORACION_CONTENT=0'

          : > "$REMOTE_RELEASE/media-created.txt"
          while IFS= read -r staged; do
            [[ -f "$staged" ]] || continue
            rel="${staged#${REMOTE_RELEASE}/media-staged/}"
            dst="$PROD_ROOT/wp-content/uploads/$rel"
            mkdir -p "$(dirname "$dst")"
            if [[ -e "$dst" ]]; then
              cmp -s "$staged" "$dst" || { echo "MEDIA_CONFLICT rel=$rel" >&2; exit 1; }
            else
              cp -p "$staged" "$dst"
              printf '%s\n' "$rel" >> "$REMOTE_RELEASE/media-created.txt"
            fi
            cmp -s "$staged" "$dst"
            echo "MEDIA_MATERIALIZE=PASS rel=$rel"
          done < <(find "$REMOTE_RELEASE/media-staged" -type f -name '*.webp' | sort)
          test "$(find "$REMOTE_RELEASE/media-staged" -type f -name '*.webp' | wc -l | tr -d ' ')" = '9'

          wp cache flush
          if wp help sg >/dev/null 2>&1; then wp sg purge || true; fi
          wp eval 'if(function_exists("opcache_reset")){opcache_reset();}' || true
          echo 'POST_CUTOVER_DATA_MEDIA=PASS'
          REMOTE

      - name: Verify d54 production boundary and corrected governance from origin
        shell: bash
        run: |
          set -euo pipefail
          ssh -n nvx-prod "PROD_ROOT='$PROD_ROOT' BASE_URL='$BASE_URL' DEPLOY_SHA='$DEPLOY_SHA' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$PROD_ROOT"
          ua='NUVANX-Production-Origin-D54/1.0'
          for route in '/' '/soluciones-medicas/' '/equipo-medico/' '/blog/' '/endolift-primeras-72-horas-que-esperar/' '/madrid/valoracion/' '/contacto/' '/estetica-avanzada/'; do
            headers="$(mktemp)"; body="$(mktemp)"
            result="$(curl -sS -L --max-redirs 5 --max-time 30 -A "$ua" -H 'Accept: text/html,application/xhtml+xml' -D "$headers" -o "$body" -w '%{http_code}|%{url_effective}' "${BASE_URL}${route}")"
            code="${result%%|*}"; effective="${result#*|}"
            test "$code" = '200'; case "$effective" in https://nuvanx.com/*|https://nuvanx.com) ;; *) exit 1 ;; esac
            ! grep -Fq '/.well-known/sgcaptcha/' "$body"; ! grep -Fq 'staging2.nuvanx.com' "$body"; grep -Fq "$DEPLOY_SHA" "$body"; ! grep -Eiq '^x-robots-tag:.*(noindex|nofollow)' "$headers"
            robots_meta="$(grep -Eio "<meta[^>]+name=['\"]robots['\"][^>]*>" "$body" | head -n 1 || true)"; if [[ -n "$robots_meta" ]] && printf '%s' "$robots_meta" | grep -Eiq '(noindex|nofollow)'; then exit 1; fi
            rm -f "$headers" "$body"
          done

          alias_headers="$(mktemp)"; alias_body="$(mktemp)"
          alias_result="$(curl -sS --max-time 30 -A "$ua" -D "$alias_headers" -o "$alias_body" -w '%{http_code}|%{redirect_url}' "$BASE_URL/valoracion-medica/")"
          test "${alias_result%%|*}" = '301'; test "${alias_result#*|}" = "$BASE_URL/madrid/valoracion/"; rm -f "$alias_headers" "$alias_body"

          prefix="$(wp db prefix)"; remaining="$(wp db query "SELECT COUNT(*) FROM ${prefix}posts WHERE post_status='publish' AND post_content LIKE '%/valoracion-medica/%';" --skip-column-names)"; test "$remaining" = '0'

          cases_code="$(curl -sS --max-time 30 -A "$ua" -o /tmp/nvx-cases.html -w '%{http_code}' "$BASE_URL/casos-de-pacientes/")"; test "$cases_code" = '404'; rm -f /tmp/nvx-cases.html
          curl -sS -L --max-redirs 3 --max-time 30 -A "$ua" "$BASE_URL/" > /tmp/nvx-home.html
          ! grep -Fq 'href="https://nuvanx.com/casos-de-pacientes/' /tmp/nvx-home.html; ! grep -Fq 'href="/casos-de-pacientes/' /tmp/nvx-home.html
          head_fragment="$(sed -n '1,/<\/head>/p' /tmp/nvx-home.html)"; test "$(printf '%s' "$head_fragment" | grep -Eio '<title\b[^>]*>[^<]*</title>' | wc -l | tr -d ' ')" = '1'; rm -f /tmp/nvx-home.html

          curl -sS -L --max-redirs 3 --max-time 30 -A "$ua" "$BASE_URL/sitemap_index.xml" > /tmp/nvx-sm-index.xml
          ! grep -Fq '/category-sitemap.xml' /tmp/nvx-sm-index.xml; ! grep -Fq '/post_tag-sitemap.xml' /tmp/nvx-sm-index.xml; ! grep -Fq '/tag-sitemap.xml' /tmp/nvx-sm-index.xml
          page_sm="$(grep -oE '<loc>[^<]+' /tmp/nvx-sm-index.xml | sed 's#<loc>##' | grep '/page-sitemap.xml' | head -n 1)"; test -n "$page_sm"
          curl -sS -L --max-redirs 3 --max-time 30 -A "$ua" "$page_sm" > /tmp/nvx-page-sm.xml
          ! grep -Fq '/politica-de-cookies/' /tmp/nvx-page-sm.xml; ! grep -Fq '/mas-informacion-sobre-las-cookies/' /tmp/nvx-page-sm.xml; ! grep -Fq '/casos-de-pacientes/' /tmp/nvx-page-sm.xml
          rm -f /tmp/nvx-sm-index.xml /tmp/nvx-page-sm.xml

          for rel in \
            '2026/05/higiene-facial-con-microdermoabrasion-480x320.webp' \
            '2026/05/diatermia-facial-480x320.webp' \
            '2026/05/depilacion-laser-480x320.webp' \
            '2026/05/hidrolipoclasia-480x320.webp' \
            '2026/05/masajes-posoperatorios-480x320.webp' \
            '2026/05/radiofrecuencia-corporal-480x320.webp' \
            '2026/05/presoterapia-480x320.webp' \
            '2026/05/tratamiento-anticelulitico-480x320.webp' \
            '2026/02/casmara-480x194.webp'; do
            test "$(curl -sS --max-time 20 -A "$ua" -o /dev/null -w '%{http_code}' "$BASE_URL/wp-content/uploads/$rel")" = '200'
          done
          echo "D54_PRODUCTION_ORIGIN_GOVERNANCE=PASS sha=$DEPLOY_SHA"
          REMOTE

      - name: Verify exact d54 WordPress identity and live templates
        shell: bash
        run: |
          set -euo pipefail
          ssh -n nvx-prod "PROD_ROOT='$PROD_ROOT' DEPLOY_SHA='$DEPLOY_SHA' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$PROD_ROOT"; live="$PROD_ROOT/wp-content/themes/nuvanx-medical"
          test "$(tr -d '\r\n' < "$live/.nvx-deploy-sha")" = "$DEPLOY_SHA"; test "$(wp config get DB_NAME)" = 'db0ecrycwv2tgb'; test "$(wp option get home)" = 'https://nuvanx.com'; test "$(wp option get siteurl)" = 'https://nuvanx.com'; test "$(wp option get blog_public)" = '1'; test "$(wp theme list --status=active --field=name)" = 'nuvanx-medical'
          checked=0; page_ids="$(wp post list --post_type=page --post_status=publish --field=ID)"
          for page_id in $page_ids; do template="$(wp post meta get "$page_id" _wp_page_template 2>/dev/null || true)"; [[ -n "$template" ]] || template='default'; [[ "$template" == 'default' ]] && continue; case "$template" in /*|*'..'*) exit 1 ;; esac; test -f "$live/$template"; checked=$((checked+1)); done
          echo "D54_PRODUCTION_IDENTITY=PASS templates=$checked"
          REMOTE

      - name: Install Chromium for targeted production media gate
        shell: bash
        run: |
          set -euo pipefail
          cd candidate/scripts/staging2
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Run targeted browser media gate on production
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/nvx-prod-media-browser.mjs" <<'NODE'
          import { chromium } from '/home/runner/work/nuvanx-siteground/nuvanx-siteground/candidate/scripts/staging2/node_modules/playwright/index.mjs';
          const url='https://nuvanx.com/estetica-avanzada/';
          const views=[['desktop',1440,1200],['tablet',834,1112],['mobile',390,844]];
          const browser=await chromium.launch({headless:true});
          let hard=[]; let inconclusive=[]; let results=[];
          for(const [name,width,height] of views){const page=await browser.newPage({viewport:{width,height}});const bad=[];page.on('response',r=>{if(r.request().resourceType()==='image'&&r.status()>=400)bad.push({status:r.status(),url:r.url()});});try{const resp=await page.goto(url,{waitUntil:'networkidle',timeout:45000});const status=resp?.status()??0;const body=(await page.content()).toLowerCase();if(status===202||status===429||status===503||body.includes('/.well-known/sgcaptcha/')){inconclusive.push(name);results.push({name,status,inconclusive:true,bad});}else if(status!==200){hard.push(`${name}:document:${status}`);results.push({name,status,bad});}else{await page.waitForTimeout(1200);for(const b of bad)hard.push(`${name}:image:${b.status}:${b.url}`);results.push({name,status,bad,currentSrc:await page.locator('img').evaluateAll(imgs=>imgs.map(i=>i.currentSrc).filter(Boolean))});}}catch(e){const m=String(e?.message||e);if(/timeout|net::|ERR_|fetch|socket/i.test(m)){inconclusive.push(name);results.push({name,inconclusive:true,error:m});}else hard.push(`${name}:${m}`);}finally{await page.close();}}
          await browser.close();
          console.log(JSON.stringify({results,hard,inconclusive},null,2));
          if(hard.length)process.exit(1);
          if(inconclusive.length)console.log('PRODUCTION_BROWSER_MEDIA=INCONCLUSIVE_ANTIBOT_OR_TRANSPORT');else console.log('PRODUCTION_BROWSER_MEDIA=PASS');
          NODE
          node "$RUNNER_TEMP/nvx-prod-media-browser.mjs" | tee "$RUNNER_TEMP/nvx-prod-media-browser.json.log"

      - name: Roll back theme, targeted contents and generated media on any post-cutover failure
        if: ${{ failure() && env.CUTOVER_ATTEMPTED == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${DEPLOY_SHA:0:12}"
          backup_dir="$PROD_ROOT/wp-content/backups-nuvanx/pre-prod-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${short_sha}"
          ssh -n nvx-prod "PROD_ROOT='$PROD_ROOT' DEPLOY_SHA='$DEPLOY_SHA' PREVIOUS_SHA='$PREVIOUS_PROD_SHA' BACKUP_DIR='$backup_dir' REMOTE_RELEASE='$REMOTE_RELEASE' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          live="$PROD_ROOT/wp-content/themes/nuvanx-medical"
          marker='MISSING'; [[ -f "$live/.nvx-deploy-sha" ]] && marker="$(tr -d '\r\n' < "$live/.nvx-deploy-sha")"
          if [[ "$marker" == "$DEPLOY_SHA" ]]; then
            test -s "$BACKUP_DIR/theme.tgz"; restore="$PROD_ROOT/wp-content/themes/.nvx-d54-restore-$$"; failed="$PROD_ROOT/wp-content/themes/.nvx-d54-failed-$$"; rm -rf "$restore" "$failed"; mkdir -p "$restore"; tar -xzf "$BACKUP_DIR/theme.tgz" -C "$restore"; test -d "$restore/wp-content/themes/nuvanx-medical"; mv "$live" "$failed"; mv "$restore/wp-content/themes/nuvanx-medical" "$live"; rm -rf "$restore" "$failed"
          fi
          if [[ -s "$REMOTE_RELEASE/content-backup.json" ]]; then
            REMOTE_RELEASE="$REMOTE_RELEASE" wp eval '$b=json_decode(file_get_contents(getenv("REMOTE_RELEASE")."/content-backup.json"),true);if(!is_array($b)||count($b)!==2){exit(1);}foreach($b as $r){$id=(int)$r["ID"];$x=wp_update_post(["ID"=>$id,"post_content"=>(string)$r["post_content"]],true);if(is_wp_error($x)){exit(1);} $p=get_post($id);if(hash("sha256",(string)$p->post_content)!==(string)$r["sha256"]){exit(1);}}echo "CONTENT_ROLLBACK=PASS\n";'
          fi
          if [[ -s "$REMOTE_RELEASE/media-created.txt" ]]; then while IFS= read -r rel; do [[ -n "$rel" ]] && rm -f "$PROD_ROOT/wp-content/uploads/$rel"; done < "$REMOTE_RELEASE/media-created.txt"; fi
          cd "$PROD_ROOT"; wp cache flush || true; if wp help sg >/dev/null 2>&1; then wp sg purge || true; fi; wp eval 'if(function_exists("opcache_reset")){opcache_reset();}' || true
          test "$(tr -d '\r\n' < "$live/.nvx-deploy-sha")" = "$PREVIOUS_SHA"
          echo "D54_EXTERNAL_ROLLBACK=PASS restored=$PREVIOUS_SHA"
          REMOTE

      - name: Write production evidence
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          {
            echo "deploy_sha=$DEPLOY_SHA"
            echo "previous_sha=$PREVIOUS_PROD_SHA"
            echo "acceptance_run=$ACCEPTANCE_RUN_ID"
            echo "acceptance_artifact=$ACCEPTANCE_ARTIFACT_ID"
            echo "workflow_run=$GITHUB_RUN_ID"
            echo "workflow_attempt=$GITHUB_RUN_ATTEMPT"
          } > evidence/production-d54.txt
          if [[ -f "$RUNNER_TEMP/nvx-prod-media-browser.json.log" ]]; then cp "$RUNNER_TEMP/nvx-prod-media-browser.json.log" evidence/browser-media.log; fi

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: production-d54-promotion-${{ github.run_attempt }}
          path: evidence/
          retention-days: 30
          if-no-files-found: error

      - name: Remove temporary production release
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${REMOTE_RELEASE:-}" ]] && [[ -f "$HOME/.ssh/config" ]]; then ssh -n nvx-prod "case '$REMOTE_RELEASE' in '$PROD_PARENT/.nvx-releases/'*) rm -rf '$REMOTE_RELEASE' ;; *) exit 1 ;; esac" || true; fi

      - name: Destroy production SSH identity
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/prod_key" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"

      - name: Write final promotion summary
        if: success()
        shell: bash
        run: |
          {
            echo '## Production d54 promotion PASS'
            echo
            echo '- Exact d54 candidate + exact successful Block C artifact: PASS'
            echo '- Production/staging identity guard: PASS'
            echo '- Mandatory SQL/theme rollback snapshot: PASS'
            echo '- Targeted two-post content backup + normalization: PASS'
            echo '- Nine responsive derivatives staged and materialized: PASS'
            echo '- d54 origin boundary + SEO/sitemap/cases governance: PASS'
            echo '- Exact WordPress identity + templates: PASS'
            echo '- Targeted browser media gate: PASS or infrastructure-only inconclusive'
          } >> "$GITHUB_STEP_SUMMARY"
