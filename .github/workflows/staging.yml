name: Staging
run-name: >-
  Staging · ${{ github.event_name == 'pull_request_target' && format('PR #{0}', github.event.pull_request.number) || (github.event_name == 'workflow_dispatch' && 'manual' || github.sha) }}

on:
  push:
    branches: [master]
    paths:
      - 'wp-content/themes/nuvanx-medical/**'
      - 'scripts/**'
      - 'tools/**'
      - '.github/workflows/staging.yml'
      - '.github/workflows/production.yml'
  pull_request:
    branches: [master]
    paths:
      - 'wp-content/themes/nuvanx-medical/**'
      - 'scripts/**'
      - 'tools/**'
      - '.github/workflows/staging.yml'
      - '.github/workflows/production.yml'
  pull_request_target:
    branches: [master]
    types: [labeled]
  workflow_dispatch:
    inputs:
      sha:
        description: Optional full master-contained SHA. Blank uses the triggering SHA.
        required: false
        type: string
      run_acceptance:
        description: Run the production-eligible Block C browser acceptance after deployment.
        required: true
        default: true
        type: boolean
      deep_quality:
        description: Also run PHPCS and PHPStan.
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('nuvanx-quality-{0}', github.event.pull_request.number) || 'nuvanx-environment-mutation' }}
  cancel-in-progress: false

env:
  STAGING_ROOT: /home/customer/www/staging2.nuvanx.com/public_html
  STAGING_PARENT: /home/customer/www/staging2.nuvanx.com
  PROD_ROOT: /home/customer/www/nuvanx.com/public_html
  STAGING_URL: https://staging2.nuvanx.com
  SSH_RETRY_ATTEMPTS: 5
  SSH_RETRY_BASE_DELAY_SECONDS: 15
  SSH_TRANSPORT_EXIT_CODE: 255
  CI: true

jobs:
  quality:
    name: Static quality and repository integrity
    if: ${{ github.event_name != 'pull_request_target' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && inputs.sha != '' && inputs.sha || github.sha) }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t transient < <(git ls-files | grep -E '(^|/)(tmp|temp)[_-]|(-(once|temp)\.(yml|yaml|sh|mjs)$)' || true)
          if (( ${#transient[@]} > 0 && ${#transient[0]} > 0 )); then
            printf 'Transient files are forbidden:\n%s\n' "${transient[*]}" >&2
            exit 1
          fi

          offenders=()
          while IFS= read -r file; do
            grep -Eq '(^|[[:space:]])git[[:space:]]+push([[:space:]]|$)' "$file" && offenders+=("$file") || true
          done < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print | sort)
          (( ${#offenders[@]} == 0 )) || { printf 'Workflow self-mutation forbidden: %s\n' "${offenders[*]}" >&2; exit 1; }

          forbidden=(DEPLOY_TRIGGER.txt composer.phar wp-content/themes/nuvanx-medical/composer.phar)
          for file in "${forbidden[@]}"; do
            ! git ls-files --error-unmatch "$file" >/dev/null 2>&1 || { echo "Tracked generated file: $file" >&2; exit 1; }
          done
          for prefix in .vscode/ audit/ .github/audit/ wp-content/themes/nuvanx-medical/vendor/; do
            ! git ls-files | grep -Fq "$prefix" || { echo "Tracked generated prefix: $prefix" >&2; exit 1; }
          done

          while IFS= read -r file; do
            [[ -f "$file" && -s "$file" ]] || { echo "Empty tracked file: $file" >&2; exit 1; }
            case "$file" in *.orig|*.rej|*.bak|*.tmp|*.swp|*~|*/.DS_Store|.DS_Store) echo "Editor residue: $file" >&2; exit 1 ;; esac
          done < <(git ls-files)

          mapfile -t workflows < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -printf '%f\n' | sort)
          if [[ "${workflows[*]}" != 'production.yml staging.yml' ]]; then
            printf 'Exactly two canonical workflows are required; found: %s\n' "${workflows[*]}" >&2
            exit 1
          fi
          echo 'REPOSITORY_HYGIENE=PASS workflows=2'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          tools: composer

      - name: Run blocking static gates
        shell: bash
        run: |
          set -euo pipefail
          find wp-content/themes/nuvanx-medical -path '*/vendor' -prune -o -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null
          php scripts/lint/test-seo-governed-metadata.php
          find wp-content/themes/nuvanx-medical -name '*.js' -type f -print0 | xargs -0 -r -n1 node --check >/dev/null
          node scripts/lint/no-hardcoded-colors.mjs --strict
          node scripts/lint/no-hardcoded-fontsize.mjs
          node scripts/lint/no-inline-layout-styles.mjs
          schema='wp-content/themes/nuvanx-medical/inc/data/routes.schema.json'
          data='wp-content/themes/nuvanx-medical/inc/data/routes.json'
          if [[ -f "$schema" && -f "$data" ]]; then node scripts/lint/validate-routes-schema.mjs "$schema" "$data"; fi
          bash -n tools/deploy/deploy-to-staging2.sh
          bash -n tools/deploy/deploy-required-mu-plugins.sh
          find scripts/staging2 -maxdepth 1 -name '*.mjs' -type f -print0 | xargs -0 -r -n1 node --check
          echo 'STATIC_GATES=PASS'

      - name: Run deep PHP quality gates
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deep_quality }}
        shell: bash
        run: |
          set -euo pipefail
          cd wp-content/themes/nuvanx-medical
          composer install --no-interaction --no-progress --prefer-dist
          ./vendor/bin/phpcs --standard=phpcs.xml.dist --report=full -s
          ./vendor/bin/phpstan analyse --configuration=phpstan.neon --error-format=table --no-progress --memory-limit=1G

      - name: Scan committed history for secrets
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' }}
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  deploy_staging:
    name: Deploy exact master SHA and run acceptance
    needs: quality
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 105
    env:
      CANDIDATE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha != '' && inputs.sha || github.sha }}
      RUN_ACCEPTANCE: ${{ github.event_name == 'push' || inputs.run_acceptance }}
    steps:
      - name: Check out master history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve immutable candidate
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_SHA="$(printf '%s' "$CANDIDATE_SHA" | tr -d '[:space:]')"
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Candidate must be a full lowercase 40-character SHA.' >&2; exit 1; }
          git fetch --no-tags origin master
          git cat-file -e "${CANDIDATE_SHA}^{commit}"
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/master || { echo 'Refusing SHA outside origin/master.' >&2; exit 1; }
          git checkout --detach "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo "CANDIDATE_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"
          echo "EXPECTED_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/staging2/package-lock.json

      - name: Configure strict Staging2 SSH
        shell: bash
        env:
          HOST: ${{ secrets.STAGING2_SSH_HOST }}
          PORT: ${{ secrets.STAGING2_SSH_PORT }}
          USER: ${{ secrets.STAGING2_SSH_USER }}
          KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${HOST:?Missing STAGING2_SSH_HOST}"; : "${USER:?Missing STAGING2_SSH_USER}"; : "${KEY:?Missing STAGING2_SSH_PRIVATE_KEY}"; : "${KH:?Missing STAGING2_SSH_KNOWN_HOSTS}"
          SSH_PORT="${PORT:-18765}"; [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/staging_key"; chmod 600 "$HOME/.ssh/staging_key"
          printf '%s\n' "$KH" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts" || { echo 'STAGING_KNOWN_HOSTS=EMPTY' >&2; exit 1; }
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx-staging2
            HostName $HOST
            User $USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/staging_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 15
            ConnectionAttempts 1
            ServerAliveInterval 15
            ServerAliveCountMax 2
          EOF
          chmod 600 "$HOME/.ssh/config"
          connected=0
          retry_delay="$SSH_RETRY_BASE_DELAY_SECONDS"
          for attempt in $(seq 1 "$SSH_RETRY_ATTEMPTS"); do
            if ssh -n nvx-staging2 "test -d '$STAGING_ROOT' && test -d '$PROD_ROOT' && command -v wp >/dev/null && command -v rsync >/dev/null && command -v php >/dev/null"; then
              connected=1; break
            fi
            if [[ "$attempt" -ne "$SSH_RETRY_ATTEMPTS" ]]; then
              echo "Staging SSH attempt $attempt/$SSH_RETRY_ATTEMPTS failed; retrying in ${retry_delay}s..."
              sleep "$retry_delay"
              retry_delay=$((retry_delay + SSH_RETRY_BASE_DELAY_SECONDS))
            fi
          done
          [[ "$connected" = 1 ]] || { echo "STAGING_SSH=FAIL_TRANSPORT: could not reach SiteGround after $SSH_RETRY_ATTEMPTS attempts." >&2; exit "$SSH_TRANSPORT_EXIT_CODE"; }
          echo 'STAGING_SSH=PASS'

      - name: Create full rollback snapshot before any runtime mutation
        shell: bash
        run: |
          set -euo pipefail
          ROLLBACK_DIR="$STAGING_PARENT/.nvx-rollback/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${CANDIDATE_SHA}"
          [[ "$ROLLBACK_DIR" == "$STAGING_PARENT/.nvx-rollback/"* ]]
          echo "ROLLBACK_DIR=$ROLLBACK_DIR" >> "$GITHUB_ENV"
          ssh nvx-staging2 "STAGING_ROOT='$STAGING_ROOT' PROD_ROOT='$PROD_ROOT' ROLLBACK_DIR='$ROLLBACK_DIR' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          test "$STAGING_ROOT" != "$PROD_ROOT"
          cd "$STAGING_ROOT"
          test "$(wp config get DB_NAME)" = 'dbshcocboodiwr'
          test "$(wp option get home)" = 'https://staging2.nuvanx.com'
          test "$(wp option get siteurl)" = 'https://staging2.nuvanx.com'
          test "$(wp option get blog_public)" = '0'
          cd "$PROD_ROOT"
          test "$(wp config get DB_NAME)" = 'db0ecrycwv2tgb'
          test "$(wp option get home)" = 'https://nuvanx.com'
          test "$(wp option get siteurl)" = 'https://nuvanx.com'
          test "$(wp option get blog_public)" = '1'
          cd "$STAGING_ROOT"
          umask 077
          mkdir -p "$ROLLBACK_DIR"
          test -s "$STAGING_ROOT/wp-config.php"
          cp -p "$STAGING_ROOT/wp-config.php" "$ROLLBACK_DIR/wp-config.php"
          tar -czf "$ROLLBACK_DIR/theme.tgz" -C "$STAGING_ROOT" wp-content/themes/nuvanx-medical
          if [[ -d "$STAGING_ROOT/wp-content/mu-plugins" ]]; then tar -czf "$ROLLBACK_DIR/mu-plugins.tgz" -C "$STAGING_ROOT" wp-content/mu-plugins; fi
          wp db export "$ROLLBACK_DIR/staging-db.sql" --quiet
          test -s "$ROLLBACK_DIR/wp-config.php"; test -s "$ROLLBACK_DIR/theme.tgz"; test -s "$ROLLBACK_DIR/staging-db.sql"
          if [[ -f wp-content/themes/nuvanx-medical/.nvx-deploy-sha ]]; then tr -d '\r\n' < wp-content/themes/nuvanx-medical/.nvx-deploy-sha > "$ROLLBACK_DIR/previous-sha.txt"; else : > "$ROLLBACK_DIR/previous-sha.txt"; fi
          echo "ROLLBACK_SNAPSHOT=PASS path=$ROLLBACK_DIR"
          REMOTE
          echo 'STAGING_SNAPSHOT_READY=1' >> "$GITHUB_ENV"

      - name: Verify environment isolation and normalize runtime
        shell: bash
        run: |
          set -euo pipefail
          echo 'STAGING_MUTATION_ARMED=1' >> "$GITHUB_ENV"
          ssh nvx-staging2 "STAGING_ROOT='$STAGING_ROOT' PROD_ROOT='$PROD_ROOT' bash -se" <<'REMO... [tool input truncated by platform]