name: H1 HubSpot Attribution E2E

on:
  push:
    branches: ['audit/*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h1-hubspot-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  h1-e2e:
    name: H1 production HubSpot attribution E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scripts/staging2/package-lock.json

      - name: Install Playwright from lockfile
        shell: bash
        run: |
          set -euo pipefail
          cd scripts/staging2
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps chromium

      - name: Run H1 E2E against production
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts/staging2/h1-artifacts
          node scripts/staging2/h1-hubspot-e2e.mjs 2>&1 | tee scripts/staging2/h1-artifacts/h1-e2e.log

      - name: Upload H1 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: h1-hubspot-e2e-evidence
          path: scripts/staging2/h1-artifacts/*.log
          retention-days: 7
