name: Code Quality (Lint)

permissions:
  contents: read

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ci-quality-${{ github.ref }}
  cancel-in-progress: true

# SonarCloud analysis runs via SonarCloud Automatic Analysis (the "SonarCloud Code
# Analysis" check), not a CI scanner job here: SonarCloud rejects CI-based analysis
# while Automatic Analysis is enabled ("Not authorized or project not found").
jobs:
  lint:
    name: PHP Syntax Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: parallel-lint
      - name: Run PHP Parallel Lint
        run: |
          set -o pipefail
          parallel-lint --exclude vendor --exclude node_modules . 2>&1 | tee ci-parallel-lint.txt || true
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            echo "parallel-lint detected syntax errors (exit $STATUS). See ci-parallel-lint.txt"
            cat ci-parallel-lint.txt
            exit $STATUS
          fi
      - name: Upload parallel-lint output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parallel-lint-output
          path: ci-parallel-lint.txt

  custom-lints:
    name: Custom CSS/PHP Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run color lint
        run: node scripts/lint/no-hardcoded-colors.mjs
      - name: Run font-size lint
        run: node scripts/lint/no-hardcoded-fontsize.mjs
      - name: Run inline styles lint
        run: node scripts/lint/no-inline-layout-styles.mjs

  phpcs:
    name: PHP_CodeSniffer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: phpcs
      - name: Install WordPress Coding Standards
        run: |
          composer global require wp-coding-standards/wpcs
          phpcs --config-set installed_paths ~/.composer/vendor/wp-coding-standards/wpcs
      - name: Run PHP_CodeSniffer
        run: |
          phpcs --standard=WordPress --extensions=php --ignore=vendor/,node_modules/ wp-content/themes/nuvanx-medical/

  phpstan:
    name: PHPStan Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: phpstan
      - name: Run PHPStan
        run: |
          phpstan analyse --level=5 --error-format=table wp-content/themes/nuvanx-medical/
