name: Staging2 Master Sync

on:
  push:
    branches:
      - master
    paths:
      - 'wp-content/themes/nuvanx-medical/**'
      - 'scripts/staging2/**'
      - 'scripts/validate-page-templates.mjs'
      - 'tools/deploy/**'
      - 'tools/wp-cli/hygiene-content-fix.php'
      - '.github/workflows/deploy-staging2.yml'
      - '.github/workflows/staging2-acceptance.yml'
      - '.github/workflows/staging2-sync.yml'

permissions:
  contents: read

jobs:
  deploy:
    name: Sync exact master SHA to Staging2
    uses: ./.github/workflows/deploy-staging2.yml
    with:
      sha: ${{ github.sha }}
      run_block_c_acceptance: false
    secrets: inherit

  block_c_acceptance:
    name: Run Block C after successful Staging2 sync
    needs: deploy
    uses: ./.github/workflows/staging2-acceptance.yml
    with:
      sha: ${{ github.sha }}
    secrets: inherit
