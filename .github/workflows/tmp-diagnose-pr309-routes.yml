name: Diagnose PR 309 staging routes once

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/tmp-diagnose-pr309-routes.yml'

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.number == 309
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WP_ROOT: /home/customer/www/staging2.nuvanx.com/public_html
      BASE_URL: https://staging2.nuvanx.com
    steps:
      - name: Configure SSH
        shell: bash
        env:
          STAGING2_SSH_HOST: ${{ secrets.STAGING2_SSH_HOST }}
          STAGING2_SSH_PORT: ${{ secrets.STAGING2_SSH_PORT }}
          STAGING2_SSH_USER: ${{ secrets.STAGING2_SSH_USER }}
          STAGING2_SSH_PRIVATE_KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          STAGING2_SSH_KNOWN_HOSTS: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          SSH_PORT="${STAGING2_SSH_PORT:-18765}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$STAGING2_SSH_PRIVATE_KEY" > "$HOME/.ssh/staging2_key"
          printf '%s\n' "$STAGING2_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/staging2_key" "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx-staging2
            HostName $STAGING2_SSH_HOST
            User $STAGING2_SSH_USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/staging2_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: List relevant published paths
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-staging2 "cd '$WP_ROOT' && wp post list --post_type=page --post_status=publish --fields=ID,post_name,post_title --format=csv" \
            | grep -Ei 'soluciones|tratamiento|medicina|endolift|endolaser|co2|exion|láser|laser' || true

      - name: Report route status, size and markers
        shell: bash
        run: |
          set -euo pipefail
          routes=(
            '/'
            '/soluciones-medicas/'
            '/medicina-estetica/'
            '/medicina-estetica-laser/'
            '/endolift-facial-papada-mandibula/'
            '/endolaser-corporal/'
            '/laser-co2-fraccionado-madrid-textura-cicatrices-poro/'
            '/exion-face/'
          )
          for slug in "${routes[@]}"; do
            file="/tmp/$(printf '%s' "$slug" | tr '/-' '__').html"
            code="$(curl --location --silent --show-error --max-time 30 --output "$file" --write-out '%{http_code}' "$BASE_URL$slug")"
            size="$(wc -c < "$file")"
            title="$(grep -oPm1 '(?<=<title>)[^<]+' "$file" || true)"
            markers="$(grep -Eo 'nvx-(solutions-page|treatment-hub|aesthetic-editorial|laser-editorial|endolift-editorial|endolaser-editorial|co2-editorial|btl-detail)' "$file" | sort -u | tr '\n' ',' || true)"
            echo "$code $slug bytes=$size title=$title markers=$markers"
          done
