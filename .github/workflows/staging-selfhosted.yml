name: Staging (Self-Hosted Runner)
run-name: >-
  Staging · ${{ github.event_name == 'pull_request_target' && format('PR #{0}', github.event.pull_request.number) || (github.event_name == 'workflow_dispatch' && 'manual' || github.sha) }}

on:
  push:
    branches: [master]
    paths:
      - 'wp-content/themes/nuvanx-medical/**'
      - 'scripts/**'
      - 'tools/**'
      - '.github/workflows/staging-selfhosted.yml'
  pull_request:
    branches: [master]
    paths:
      - 'wp-content/themes/nuvanx-medical/**'
      - 'scripts/**'
      - 'tools/**'
      - '.github/workflows/staging-selfhosted.yml'
  pull_request_target:
    branches: [master]
    types: [labeled]
  workflow_dispatch:
    inputs:
      sha:
        description: Optional full master-contained SHA. Blank uses the triggering SHA.
        required: false
        type: string
      run_acceptance:
        description: Run the production-eligible Block C browser acceptance after deployment.
        required: true
        default: true
        type: boolean
      deep_quality:
        description: Also run PHPCS and PHPStan.
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('nuvanx-quality-{0}', github.event.pull_request.number) || 'nuvanx-environment-mutation' }}
  cancel-in-progress: false

env:
  STAGING_ROOT: /home/customer/www/staging2.nuvanx.com/public_html
  STAGING_PARENT: /home/customer/www/staging2.nuvanx.com
  PROD_ROOT: /home/customer/www/nuvanx.com/public_html
  STAGING_URL: https://staging2.nuvanx.com
  CI: true

jobs:
  quality:
    name: Static quality and repository integrity
    if: ${{ github.event_name != 'pull_request_target' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && inputs.sha != '' && inputs.sha || github.sha) }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t transient < <(git ls-files | grep -E '(-(once|temp)\.(yml|yaml|sh|mjs)$)|(^|/)(tmp|temp)[_-]' || true)
          if (( ${#transient[@]} > 0 && ${#transient[0]} > 0 )); then
            printf 'Transient files are forbidden:\n%s\n' "${transient[*]}" >&2
            exit 1
          fi

          offenders=()
          while IFS= read -r file; do
            grep -Eq '(^|[[:space:]])git[[:space:]]+push([[:space:]]|$)' "$file" && offenders+=("$file") || true
          done < <(git ls-files '*.sh' '*.mjs' '*.yml' '*.yaml' 2>/dev/null || true)
          if (( ${#offenders[@]} > 0 )); then
            printf 'Scripts with git push are forbidden:\n%s\n' "${offenders[*]}" >&2
            exit 1
          fi

          mapfile -t workflows < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -printf '%f\n' | sort)
          [[ "${workflows[*]}" == 'production.yml staging.yml staging-selfhosted.yml' ]] || { printf 'Expected exactly production.yml, staging.yml and staging-selfhosted.yml; found: %s\n' "${workflows[*]}" >&2; exit 1; }
          echo 'REPOSITORY_HYGIENE=PASS'

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          find wp-content/themes/nuvanx-medical -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null

      - name: JavaScript lint
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/**/*.mjs

      - name: Run deep quality if requested
        if: inputs.deep_quality
        shell: bash
        run: |
          set -euo pipefail
          composer --version
          composer install --no-interaction --prefer-dist
          vendor/bin/phpcs --standard=PHPCompatibility wp-content/themes/nuvanx-medical
          vendor/bin/phpstan analyse wp-content/themes/nuvanx-medical --level=5

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-evidence-${{ github.run_id }}
          path: |
            scripts/staging2/block-c-artifacts/
            scripts/staging2/valoracion-artifacts/
          retention-days: 7
          if-no-files-found: warn

  deploy_staging:
    name: Deploy exact master SHA and run acceptance
    needs: quality
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: siteground
    timeout-minutes: 105
    env:
      CANDIDATE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha != '' && inputs.sha || github.sha }}
      RUN_ACCEPTANCE: ${{ github.event_name == 'push' || inputs.run_acceptance }}
    steps:
      - name: Check out master history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve immutable candidate
        shell: bash
        run: |
          set -euo pipefail
          staging_sha="$(tr -d '\r\n' < '$STAGING_ROOT/wp-content/themes/nuvanx-medical/.nvx-deploy-sha')"
          [[ "$staging_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid Staging2 deploy marker: $staging_sha" >&2; exit 1; }
          if [[ -n "$CANDIDATE_SHA" ]]; then
            requested="$(printf '%s' "$CANDIDATE_SHA" | tr -d '[:space:]')"
            [[ "$requested" =~ ^[0-9a-f]{40}$ ]] || { echo 'candidate_sha must be a full lowercase 40-character SHA.' >&2; exit 1; }
            test "$requested" = "$staging_sha" || { echo "Requested SHA $requested is not the current Staging2 SHA $staging_sha" >&2; exit 1; }
          fi

          git fetch --no-tags origin master
          git cat-file -e "${staging_sha}^{commit}"
          git merge-base --is-ancestor "$staging_sha" origin/master || { echo "Current Staging2 SHA is not contained in origin/master: $staging_sha" >&2; exit 1; }
          git cat-file -e "${staging_sha}:wp-content/themes/nuvanx-medical/functions.php"
          theme_tree="$(git rev-parse "${staging_sha}:wp-content/themes/nuvanx-medical")"

          cd "$STAGING_ROOT"
          test "$(tr -d '\r\n' < wp-content/themes/nuvanx-medical/.nvx-deploy-sha)" = "$staging_sha"
          test "$(wp config get DB_NAME)" = 'dbshcocboodiwr'
          test "$(wp option get home)" = 'https://staging2.nuvanx.com'
          test "$(wp option get siteurl)" = 'https://staging2.nuvanx.com'
          test "$(wp option get blog_public)" = '0'
          test "$(wp config get NVX_ENV)" = 'staging'
          test "$(wp config get WP_ENVIRONMENT_TYPE)" = 'staging'
          wp eval 'exit((defined("WP_DEBUG_DISPLAY") && WP_DEBUG_DISPLAY === false) ? 0 : 1);'
          test "$(wp theme list --status=active --field=name)" = 'nuvanx-medical'
          cd "$PROD_ROOT"
          test "$(wp config get DB_NAME)" = 'db0ecrycwv2tgb'
          test "$(wp option get home)" = 'https://nuvanx.com'
          test "$(wp option get siteurl)" = 'https://nuvanx.com'
          test "$(wp option get blog_public)" = '1'
          test "$(wp theme list --status=active --field=name)" = 'nuvanx-medical'
          for legacy_mu in nuvanx-valoracion-native-hubspot-form.php nuvanx-contacto-hubspot-form.php nvx-disable-public-facebook-pixel.php nuvanx-google-attribution.php; do test ! -e "$PROD_ROOT/wp-content/mu-plugins/$legacy_mu"; done
          test ! -d "$PROD_ROOT/wp-content/mu-plugins/nuvanx-google-attribution"
          echo 'PRODUCTION_GATE_IDENTITIES=PASS'

          echo "sha=$staging_sha" >> "$GITHUB_OUTPUT"
          echo "CANDIDATE_SHA=$staging_sha" >> "$GITHUB_ENV"
          echo "EXPECTED_SHA=$staging_sha" >> "$GITHUB_ENV"
          echo "CANDIDATE_THEME_TREE=$theme_tree" >> "$GITHUB_ENV"
          echo "PRODUCTION_CANDIDATE=$staging_sha"
          echo "PRODUCTION_CANDIDATE_THEME_TREE=$theme_tree"

      - name: Verify successful exact-SHA Staging acceptance evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_name="staging2-block-c-${CANDIDATE_SHA}"
          response="$(curl -fsSL --proto '=https' --proto-redir '=https' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100")"
          artifact="$(printf '%s' "$response" | jq -c --arg name "$artifact_name" '[.artifacts[] | select(.name == $name and .expired == false)] | sort_by(.created_at) | last')"
          [[ "$artifact" != 'null' ]] || { echo "No non-expired Staging acceptance artifact for $CANDIDATE_SHA" >&2; exit 1; }
          run_id="$(printf '%s' "$artifact" | jq -r '.workflow_run.id')"
          [[ "$run_id" =~ ^[0-9]+$ ]]
          run="$(curl -fsSL --proto '=https' --proto-redir '=https' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
          test "$(printf '%s' "$run" | jq -r '.conclusion')" = 'success'
          test "$(printf '%s' "$run" | jq -r '.head_branch')" = 'master'
          echo "STAGING_ACCEPTANCE=PASS artifact=$artifact_name run_id=$run_id sha=$CANDIDATE_SHA"

      - name: Materialize exact candidate from master history
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_ROOT="$RUNNER_TEMP/production-candidate-$CANDIDATE_SHA"
          git worktree add --detach "$CANDIDATE_ROOT" "$CANDIDATE_SHA"
          test "$(git -C "$CANDIDATE_ROOT" rev-parse HEAD)" = "$CANDIDATE_SHA"
          find "$CANDIDATE_ROOT/wp-content/themes/nuvanx-medical" -path '*/vendor' -prune -o -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null
          echo "CANDIDATE_ROOT=$CANDIDATE_ROOT" >> "$GITHUB_ENV"

      - name: Create full rollback snapshot
        shell: bash
        run: |
          set -euo pipefail
          ROLLBACK_DIR="$STAGING_PARENT/.nvx-rollback/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${CANDIDATE_SHA}"
          echo "ROLLBACK_DIR=$ROLLBACK_DIR" >> "$GITHUB_ENV"
          mkdir -p "$ROLLBACK_DIR/theme" "$ROLLBACK_DIR/mu-plugins" "$ROLLBACK_DIR/database"
          rsync -az --delete "$STAGING_ROOT/wp-content/themes/nuvanx-medical/" "$ROLLBACK_DIR/theme/"
          rsync -az --delete "$STAGING_ROOT/wp-content/mu-plugins/" "$ROLLBACK_DIR/mu-plugins/"
          wp db export "$ROLLBACK_DIR/database/staging-db.sql" --single-transaction --quick --skip-lock --allow-root
          echo 'ROLLBACK_SNAPSHOT=PASS'

      - name: Upload immutable payload
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_RELEASE="$STAGING_ROOT/wp-content/.nuvanx-deployments/${CANDIDATE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "REMOTE_RELEASE=$REMOTE_RELEASE" >> "$GITHUB_ENV"
          mkdir -p "$REMOTE_RELEASE/theme"
          rsync -az --delete --exclude='.git' --exclude='php_errorlog' --exclude='*.log' --exclude='_archive*' --exclude='_disabled*' --exclude='*.bak*' "$CANDIDATE_ROOT/wp-content/themes/nuvanx-medical/" "$REMOTE_RELEASE/theme/"
          cp tools/deploy/deploy-to-prod.sh "$REMOTE_RELEASE/deploy-to-prod.sh"

      - name: Execute guarded atomic Staging2 cutover
        shell: bash
        run: |
          set -euo pipefail
          NVX_RUN_TOKEN='${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}' NUVANX_CONFIRM=yes bash "$REMOTE_RELEASE/deploy-to-prod.sh" --staging-root "$STAGING_ROOT" --source-theme "$REMOTE_RELEASE/theme" --sha "$CANDIDATE_SHA" --confirm

      - name: Purge caches and verify exact Staging2 identity
        shell: bash
        run: |
          set -euo pipefail
          cd "$STAGING_ROOT"
          wp cache flush --allow-root
          test "$(tr -d '\r\n' < wp-content/themes/nuvanx-medical/.nvx-deploy-sha)" = "$CANDIDATE_SHA"
          echo 'STAGING_DEPLOYED_SHA='$(tr -d '\r\n' < wp-content/themes/nuvanx-medical/.nvx-deploy-sha)

      - name: Install browser acceptance dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd scripts/staging2
          npm ci --ignore-scripts
          npx playwright install chromium

      - name: Run canonical Block C and valoración placement
        if: env.RUN_ACCEPTANCE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts/staging2/block-c-artifacts scripts/staging2/valoracion-artifacts
          node scripts/staging2/block-c-entrypoint.mjs
          node scripts/staging2/valoracion-placement.mjs
          echo 'STAGING_BLOCK_C=PASS'

      - name: Verify production unchanged read-only
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROD_ROOT"
          prod_sha="$(tr -d '\r\n' < wp-content/themes/nuvanx-medical/.nvx-deploy-sha)"
          [[ "$prod_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid production deploy marker: $prod_sha" >&2; exit 1; }
          git cat-file -e "${prod_sha}^{commit}" || { echo "Production SHA $prod_sha not in repository" >&2; exit 1; }
          echo "PRODUCTION_UNCHANGED_SHA=$prod_sha"

      - name: Upload production-eligible acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging2-block-c-${{ env.CANDIDATE_SHA }}
          path: scripts/staging2/block-c-artifacts/
          retention-days: 14
          if-no-files-found: warn
          compression-level: 6

      - name: Roll back complete Staging2 state after failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          ROLLBACK_DIR="${ROLLBACK_DIR:-}"
          [[ -n "$ROLLBACK_DIR" ]] || exit 0
          rsync -az --delete "$ROLLBACK_DIR/theme/" "$STAGING_ROOT/wp-content/themes/nuvanx-medical/"
          rsync -az --delete "$ROLLBACK_DIR/mu-plugins/" "$STAGING_ROOT/wp-content/mu-plugins/"
          wp db import "$ROLLBACK_DIR/database/staging-db.sql" --allow-root
          wp cache flush --allow-root
          echo 'STAGING_ROLLBACK=PASS'

      - name: Cleanup remote payload, snapshot and SSH identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_RELEASE="${REMOTE_RELEASE:-}"
          [[ -n "$REMOTE_RELEASE" ]] && rm -rf "$REMOTE_RELEASE"
          ROLLBACK_DIR="${ROLLBACK_DIR:-}"
          [[ -n "$ROLLBACK_DIR" ]] && rm -rf "$ROLLBACK_DIR"
