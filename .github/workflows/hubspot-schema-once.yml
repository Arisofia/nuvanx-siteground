name: Attribution QA One-Shot

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose Staging2 secure HubSpot transport
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_ROOT: /home/customer/www/staging2.nuvanx.com/public_html
    steps:
      - name: Configure strict Staging2 SSH
        shell: bash
        env:
          HOST: ${{ secrets.STAGING2_SSH_HOST }}
          PORT: ${{ secrets.STAGING2_SSH_PORT }}
          USER: ${{ secrets.STAGING2_SSH_USER }}
          KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          : "${HOST:?Missing STAGING2_SSH_HOST}"
          : "${USER:?Missing STAGING2_SSH_USER}"
          : "${KEY:?Missing STAGING2_SSH_PRIVATE_KEY}"
          : "${KH:?Missing STAGING2_SSH_KNOWN_HOSTS}"
          SSH_PORT="${PORT:-18765}"
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/staging_key"
          chmod 600 "$HOME/.ssh/staging_key"
          printf '%s\n' "$KH" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx-staging2
            HostName $HOST
            User $USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/staging_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 15
            ConnectionAttempts 1
          EOF
          chmod 600 "$HOME/.ssh/config"
          ssh -n nvx-staging2 "test -d '$STAGING_ROOT' && command -v php >/dev/null && command -v wp >/dev/null"
          echo 'STAGING_SSH=PASS'

      - name: Read only bounded valoración markers
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh nvx-staging2 "STAGING_ROOT='$STAGING_ROOT' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$STAGING_ROOT"
          test "$(wp config get DB_NAME)" = 'dbshcocboodiwr'
          test "$(wp option get home)" = 'https://staging2.nuvanx.com'
          configured_log="$(php -r 'echo (string) ini_get("error_log");' 2>/dev/null || true)"
          candidates=("$configured_log" "$STAGING_ROOT/php_errorlog" "$STAGING_ROOT/wp-content/debug.log")
          found=0
          for file in "${candidates[@]}"; do
            [[ -n "$file" && -r "$file" ]] || continue
            markers="$(grep -E 'NVX_VALORACION_(FAILURE|SUCCESS)( |$)' "$file" | tail -n 5 || true)"
            if [[ -n "$markers" ]]; then
              printf '%s\n' "$markers"
              found=1
            fi
          done
          if (( found == 0 )); then
            echo 'NVX_VALORACION_MARKER=NOT_FOUND'
            exit 1
          fi
          echo 'NVX_VALORACION_MARKER_READ=PASS pii=0 payload=0 token=0'
          REMOTE

      - name: Probe runtime token validation and secure endpoint transport
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh nvx-staging2 "STAGING_ROOT='$STAGING_ROOT' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$STAGING_ROOT"
          test "$(wp config get DB_NAME)" = 'dbshcocboodiwr'
          test "$(wp option get home)" = 'https://staging2.nuvanx.com'
          wp eval '
          if (!function_exists("nvx_hubspot_secure_access_token") || !function_exists("nvx_hubspot_secure_submit_url")) {
              echo "HUBSPOT_SECURE_BRIDGE_LOADED=0\n";
          } else {
              $token = nvx_hubspot_secure_access_token();
              echo "HUBSPOT_SECURE_BRIDGE_LOADED=1\n";
              echo "HUBSPOT_RUNTIME_TOKEN_VALID=" . ($token !== "" ? "1" : "0") . " token_length=" . strlen($token) . "\n";
              if ($token !== "") {
                  $response = wp_remote_post(
                      nvx_hubspot_secure_submit_url(),
                      array(
                          "timeout" => 12,
                          "headers" => array(
                              "Content-Type" => "application/json",
                              "Authorization" => "Bearer " . $token,
                          ),
                          "body" => "{}",
                      )
                  );
                  if (is_wp_error($response)) {
                      echo "HUBSPOT_SECURE_TRANSPORT=WP_ERROR code=" . sanitize_key((string) $response->get_error_code()) . "\n";
                  } else {
                      echo "HUBSPOT_SECURE_TRANSPORT=HTTP status=" . (int) wp_remote_retrieve_response_code($response) . "\n";
                  }
              } else {
                  echo "HUBSPOT_SECURE_TRANSPORT=SKIP token_invalid=1\n";
              }
          }
          '
          echo 'HUBSPOT_SECURE_PROBE=PASS pii=0 payload_fields=0 token_exposed=0'
          REMOTE
