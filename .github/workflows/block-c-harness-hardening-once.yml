name: Block C Harness Hardening Once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/block-c-harness-hardening-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout master
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true

      - name: Harden Block C runtime diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/staging2/block-c-52x3.mjs')
          text = p.read_text()

          old = """    const mainText = (main?.innerText || '').replace(/\\s+/g, ' ').trim();
    const bodyStyle = getComputedStyle(document.body);

    return {
"""
          new = """    const mainText = (main?.innerText || '').replace(/\\s+/g, ' ').trim();
    const bodyStyle = getComputedStyle(document.body);
    const bodyText = document.body?.innerText || '';
    const runtimeDiagnostics = Array.from(
      new Set(bodyText.match(/(?:Warning|Deprecated|Fatal error|Notice):[^\\n]*/g) || [])
    ).slice(0, 12);

    return {
"""
          if text.count(old) != 1:
              raise SystemExit(f'collectGeometry insertion anchor count={text.count(old)}')
          text = text.replace(old, new)

          old = """      bodyFontSize: bodyStyle.fontSize || '',
      visibleSectionCount: visibleSections.length,
"""
          new = """      bodyFontSize: bodyStyle.fontSize || '',
      runtimeDiagnostics,
      visibleSectionCount: visibleSections.length,
"""
          if text.count(old) != 1:
              raise SystemExit(f'return insertion anchor count={text.count(old)}')
          text = text.replace(old, new)

          old = """        if (geometry.h1Rect && (geometry.h1Rect.left < -2 || geometry.h1Rect.right > viewport.width + 2)) issues.push('H1 extends outside viewport');
        if (geometry.horizontalOverflowPx > 2) issues.push(`Horizontal viewport overflow: ${geometry.horizontalOverflowPx}px`);
"""
          new = """        if (geometry.h1Rect && (geometry.h1Rect.left < -2 || geometry.h1Rect.right > viewport.width + 2)) issues.push('H1 extends outside viewport');
        if (geometry.h1Rect && geometry.h1Rect.top < -2) issues.push(`H1 starts above viewport (${geometry.h1Rect.top}px)`);
        if (geometry.horizontalOverflowPx > 2) issues.push(`Horizontal viewport overflow: ${geometry.horizontalOverflowPx}px`);
"""
          if text.count(old) != 1:
              raise SystemExit(f'H1 insertion anchor count={text.count(old)}')
          text = text.replace(old, new)

          old = """        if (!geometry.bodyFontFamily) issues.push('Body computed font-family is empty');
        if (geometry.mainTextLength < 80 && !shortContentRoutes.has(route)) issues.push(`Main readable text unexpectedly short (${geometry.mainTextLength} chars)`);
"""
          new = """        if (!geometry.bodyFontFamily) issues.push('Body computed font-family is empty');
        if (geometry.runtimeDiagnostics?.length > 0) issues.push(`Visible PHP/runtime diagnostics: ${geometry.runtimeDiagnostics.join(' | ')}`);
        if (geometry.mainTextLength < 80 && !shortContentRoutes.has(route)) issues.push(`Main readable text unexpectedly short (${geometry.mainTextLength} chars)`);
"""
          if text.count(old) != 1:
              raise SystemExit(f'diagnostic issue anchor count={text.count(old)}')
          text = text.replace(old, new)
          p.write_text(text)
          PY
          node --check scripts/staging2/block-c-52x3.mjs
          git diff --check

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NUVANX Block C Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/staging2/block-c-52x3.mjs
          git commit -m 'test(block-c): detect visible runtime diagnostics'
          git push origin HEAD:master
