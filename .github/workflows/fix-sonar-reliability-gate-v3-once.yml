name: Fix Sonar reliability gate v3 once

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/fix-sonar-reliability-gate-v3-once.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'refactor/sonar-duplication-20260731'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/sonar-duplication-20260731
          fetch-depth: 0

      - name: Apply semantic and CSS fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          template = Path('wp-content/themes/nuvanx-medical/template-parts/content/nvx-soluciones-medicas-github.php')
          source = template.read_text(encoding='utf-8')
          pattern = re.compile(
              r'(?P<indent>^[ \t]*)<dl>\n'
              r'(?P=indent)[ \t]+<div><dt>Qué se valora</dt><dd>(?P<question>.*?)</dd></div>\n'
              r'(?P=indent)[ \t]+<div><dt>Límites</dt><dd>(?P<limit>.*?)</dd></div>\n'
              r'(?P=indent)</dl>',
              re.MULTILINE,
          )
          def replacement(match):
              indent = match.group('indent')
              child = indent + '\t'
              return (
                  f'{indent}<dl>\n'
                  f'{child}<dt>Qué se valora</dt>\n'
                  f'{child}<dd>{match.group("question")}</dd>\n'
                  f'{child}<dt>Límites</dt>\n'
                  f'{child}<dd>{match.group("limit")}</dd>\n'
                  f'{indent}</dl>'
              )
          source, count = pattern.subn(replacement, source)
          if count != 1:
              raise SystemExit(f'definition-list blocks transformed={count}')
          template.write_text(source, encoding='utf-8')

          stylesheet = Path('wp-content/themes/nuvanx-medical/assets/css/nvx-soluciones-medicas.css')
          css = stylesheet.read_text(encoding='utf-8')
          button_pattern = re.compile(
              r'\.nvx-solutions-button \{\n(?P<first>.*?)\n\}\n\n'
              r'\.nvx-solutions-button \{\n(?P<second>.*?)\n\}',
              re.DOTALL,
          )
          def merge_button(match):
              first = match.group('first').splitlines()
              second = match.group('second').splitlines()
              anchor = next((index for index, line in enumerate(first) if 'font-size:' in line), len(first))
              return '.nvx-solutions-button {\n' + '\n'.join(first[:anchor] + second + first[anchor:]) + '\n}'
          css, button_count = button_pattern.subn(merge_button, css, count=1)
          if button_count != 1:
              raise SystemExit(f'button selector pairs transformed={button_count}')

          dark_old = '.nvx-solutions-group--dark .nvx-solutions-card dl > div + div'
          dark_new = '.nvx-solutions-group--dark .nvx-solutions-card dd + dt'
          base_old = '.nvx-solutions-card dl > div + div'
          base_new = '.nvx-solutions-card dd + dt'
          if css.count(dark_old) != 1 or css.count(base_old) != 2:
              raise SystemExit(f'unexpected spacing selectors dark={css.count(dark_old)} base={css.count(base_old)}')
          css = css.replace(dark_old, dark_new, 1)
          if css.count(base_old) != 1:
              raise SystemExit(f'unexpected base spacing selector after dark replacement={css.count(base_old)}')
          css = css.replace(base_old, base_new, 1)
          stylesheet.write_text(css, encoding='utf-8')
          PY

      - name: Validate reliability fix
        shell: bash
        run: |
          set -euo pipefail
          php -l wp-content/themes/nuvanx-medical/template-parts/content/nvx-soluciones-medicas-github.php
          node scripts/theme-hygiene/test-theme-hygiene.mjs
          php scripts/theme-hygiene/test-nvx-callable-contract.php
          node scripts/staging2/test-deploy-workflow-contract.mjs
          test "$(grep -Fc '<dt>Qué se valora</dt>' wp-content/themes/nuvanx-medical/template-parts/content/nvx-soluciones-medicas-github.php)" -eq 1
          test "$(grep -Fc '<dt>Límites</dt>' wp-content/themes/nuvanx-medical/template-parts/content/nvx-soluciones-medicas-github.php)" -eq 1
          test "$(grep -Fc '.nvx-solutions-card dd + dt' wp-content/themes/nuvanx-medical/assets/css/nvx-soluciones-medicas.css)" -eq 2
          test "$(grep -Fc '.nvx-solutions-button {' wp-content/themes/nuvanx-medical/assets/css/nvx-soluciones-medicas.css)" -eq 1
          git diff --check

      - name: Commit and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-sonar-reliability-gate-once.yml
          rm -f .github/workflows/fix-sonar-reliability-gate-v2-once.yml
          rm -f .github/workflows/fix-sonar-reliability-gate-v3-once.yml
          rm -f .github/workflows/repair-sonar-gate-once.yml
          rm -f .github/workflows/sonar-health-audit-once.yml
          rm -f .github/workflows/sonar-health-inventory-once.yml
          git config user.name 'NUVANX Quality Bot'
          git config user.email 'quality@nuvanx.com'
          git add wp-content/themes/nuvanx-medical/template-parts/content/nvx-soluciones-medicas-github.php \
            wp-content/themes/nuvanx-medical/assets/css/nvx-soluciones-medicas.css \
            .github/workflows
          git diff --cached --check
          git commit -m 'fix(quality): restore Sonar reliability rating'
          git push origin HEAD:refactor/sonar-duplication-20260731
