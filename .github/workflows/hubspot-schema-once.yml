name: HubSpot Schema One-Shot

on:
  push:
    branches:
      - ops/hubspot-schema-once-20260818
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  probe_forms_api:
    name: Probe versioned HubSpot Forms API
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe 2026-09-beta form endpoint read-only
        shell: bash
        env:
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          FORM_ID: 5042522a-0bc5-4381-ac3e-5aee8649b69c
        run: |
          set -Eeuo pipefail
          : "${HUBSPOT_ACCESS_TOKEN:?Missing HUBSPOT_ACCESS_TOKEN}"
          out="$RUNNER_TEMP/form-beta.json"
          status="$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output "$out" --write-out '%{http_code}' --header "Authorization: Bearer ${HUBSPOT_ACCESS_TOKEN}" "https://api.hubapi.com/marketing/forms/2026-09-beta/${FORM_ID}")"
          if [[ "$status" != '200' ]]; then
            echo "HUBSPOT_FORMS_VERSIONED_READ=FAIL status=$status" >&2
            jq '{status,category,message,correlationId}' "$out" 2>/dev/null || true
            exit 1
          fi
          jq -e --arg id "$FORM_ID" '.id == $id and (.archived // false) == false and .formType == "hubspot"' "$out" >/dev/null
          jq -r '[.fieldGroups[]?.fields[]?] | length | "HUBSPOT_FORMS_VERSIONED_READ=PASS form_fields=\(.)"' "$out"
