<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Composición editorial abstracta NUVANX</title>
  <desc id="desc">Formas orgánicas y líneas suaves inspiradas en anatomía, luz y precisión clínica.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171717"/>
      <stop offset="0.56" stop-color="#292724"/>
      <stop offset="1" stop-color="#0e0e0e"/>
    </linearGradient>
    <radialGradient id="glowA" cx="68%" cy="28%" r="56%">
      <stop offset="0" stop-color="#e9ddcf" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#b89a5b" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#171717" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="35%" cy="78%" r="52%">
      <stop offset="0" stop-color="#f7f1e8" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#171717" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="veil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f1e8" stop-opacity="0.04"/>
      <stop offset="0.48" stop-color="#e9ddcf" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#b89a5b" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="blur40" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="softNoise">
        <feFuncA type="table" tableValues="0 0.045"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="softNoise" mode="soft-light"/>
    </filter>
  </defs>

  <rect width="1600" height="1200" fill="url(#base)"/>
  <rect width="1600" height="1200" fill="url(#glowA)"/>
  <rect width="1600" height="1200" fill="url(#glowB)"/>

  <g filter="url(#blur40)" opacity="0.82">
    <path d="M1080-90C870 140 830 390 930 620c89 204 298 318 565 368l184 34V-90Z" fill="url(#veil)"/>
    <path d="M-150 1040c280-316 506-424 760-322 192 76 326 260 402 550H-150Z" fill="#f7f1e8" opacity="0.045"/>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M1188-50C850 194 742 476 866 756c104 236 346 356 690 382" stroke="#e9ddcf" stroke-opacity="0.48" stroke-width="1.4"/>
    <path d="M1272-34C932 236 850 500 980 730c112 198 330 294 618 318" stroke="#b89a5b" stroke-opacity="0.52" stroke-width="1"/>
    <path d="M1052-40C744 222 648 490 734 760c74 232 256 378 548 456" stroke="#f7f1e8" stroke-opacity="0.2" stroke-width="0.9"/>
    <path d="M-120 958C178 690 432 612 646 724c178 94 300 282 368 556" stroke="#e9ddcf" stroke-opacity="0.22" stroke-width="1.2"/>
    <path d="M-90 1080C224 804 456 748 642 866c134 84 234 222 300 414" stroke="#b89a5b" stroke-opacity="0.34" stroke-width="0.9"/>
  </g>

  <g opacity="0.78">
    <circle cx="1208" cy="344" r="6" fill="#b89a5b"/>
    <circle cx="1208" cy="344" r="22" fill="none" stroke="#b89a5b" stroke-opacity="0.42"/>
    <circle cx="542" cy="840" r="4" fill="#e9ddcf"/>
    <circle cx="542" cy="840" r="16" fill="none" stroke="#e9ddcf" stroke-opacity="0.32"/>
  </g>

  <rect width="1600" height="1200" fill="transparent" filter="url(#grain)"/>
</svg>
