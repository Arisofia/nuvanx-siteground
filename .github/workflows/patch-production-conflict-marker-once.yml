name: Patch production conflict marker once

on:
  push:
    branches:
      - fix/production-workflow-conflict-marker-20260820
    paths:
      - scripts/patch-production-conflict-marker-once.py
      - .github/workflows/patch-production-conflict-marker-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/production-workflow-conflict-marker-20260820
          fetch-depth: 0
          persist-credentials: true
      - name: Remove residual conflict marker and validate release control plane
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-production-conflict-marker-once.py
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/production.yml')"
          bash -n scripts/ci/test-release-regression-contract.sh
          bash scripts/ci/test-release-regression-contract.sh
          ! grep -RInE '^[[:space:]]*(<<<<<<<|=======|>>>>>>>)' .github/workflows --include='*.yml' --include='*.yaml'
          git diff --check
      - name: Commit canonical target files only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Arisofia'
          git config user.email '246412546+Arisofia@users.noreply.github.com'
          git add .github/workflows/production.yml scripts/ci/test-release-regression-contract.sh
          git diff --cached --quiet && { echo 'No canonical repair changes to commit' >&2; exit 1; }
          git commit -m 'fix(production): remove residual workflow conflict marker'
          git push origin HEAD:fix/production-workflow-conflict-marker-20260820
