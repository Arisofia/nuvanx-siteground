name: SEO Verification - Search Console & PageSpeed

on:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
  workflow_run:
    workflows:
      - Production SEO GEO Origin Audit
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: seo-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pagespeed-mobile-audit:
    name: PageSpeed Mobile Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Audit Mobile PageSpeed & Core Web Vitals
        shell: bash
        env:
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY || secrets.GOOGLE_API_KEY }}
          BASE_URL: https://nuvanx.com
        run: |
          set -euo pipefail
          echo "Running PageSpeed Mobile Audit on $BASE_URL..."

          API_URL="https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=${BASE_URL}&strategy=mobile"
          if [[ -n "${PAGESPEED_API_KEY:-}" ]]; then
            API_URL="${API_URL}&key=${PAGESPEED_API_KEY}"
            echo "Using configured PAGESPEED_API_KEY secret."
          else
            echo "::warning::No PAGESPEED_API_KEY / GOOGLE_API_KEY secret found. Using unauthenticated public endpoint."
          fi

          RESPONSE=$(curl -sSL --max-time 45 --retry 3 --retry-delay 2 "$API_URL" || echo "")

          if [[ -z "$RESPONSE" ]]; then
            echo "::warning::PageSpeed API request timed out or returned empty response."
            exit 0
          fi

          if echo "$RESPONSE" | grep -q '"error"'; then
            ERR_MSG=$(echo "$RESPONSE" | grep -o '"message": "[^"]*"' | head -n 1 | cut -d'"' -f4 || echo "API Error")
            ERR_REASON=$(echo "$RESPONSE" | grep -o '"reason": "[^"]*"' | head -n 1 | cut -d'"' -f4 || echo "Unknown")
            echo "::warning::PageSpeed API returned an error ($ERR_REASON): $ERR_MSG"
            echo "## PageSpeed Mobile Audit (Notice)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Status: API unavailable / quota warning ($ERR_REASON)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Message: $ERR_MSG" >> "$GITHUB_STEP_SUMMARY"
            echo "- Detailed Lighthouse audit is maintained separately and does not depend on PSI quota." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if command -v jq >/dev/null 2>&1; then
            SCORE=$(printf '%s' "$RESPONSE" | jq -r '.lighthouseResult.categories.performance.score // empty' 2>/dev/null || true)
          else
            SCORE=$(printf '%s' "$RESPONSE" | grep -o '"score":[[:space:]]*[0-9.]\+' | head -n 1 | awk '{print $2}' || true)
          fi

          if [[ -n "$SCORE" ]]; then
            PCT=$(awk "BEGIN {print int($SCORE * 100)}")
            echo "PAGESPEED_MOBILE_PERFORMANCE_SCORE=$PCT"
            echo "## PageSpeed Mobile Audit" >> "$GITHUB_STEP_SUMMARY"
            echo "- Strategy: Mobile" >> "$GITHUB_STEP_SUMMARY"
            echo "- Target: $BASE_URL" >> "$GITHUB_STEP_SUMMARY"
            echo "- Performance Score: ${PCT}/100" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::PageSpeed response did not contain a Lighthouse performance score."
          fi

  sitemap-status:
    name: Sitemap Status Verification
    runs-on: ubuntu-latest
    needs: pagespeed-mobile-audit
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify sitemap index and child sitemaps
        shell: bash
        env:
          BASE_URL: https://nuvanx.com
        run: |
          set -euo pipefail
          mkdir -p artifacts

          fetch_200() {
            local url="$1"
            local output="$2"
            local status="000"
            for attempt in 1 2 3 4 5 6; do
              status=$(curl -sS -L -A 'Mozilla/5.0 (compatible; NUVANX-SEO-Audit/1.0)' \
                --connect-timeout 20 --max-time 45 \
                -o "$output" -w '%{http_code}' "$url") || status="000"
              echo "FETCH attempt=$attempt status=$status url=$url"
              if [[ "$status" == "200" ]]; then return 0; fi
              if [[ "$status" == "202" || "$status" == "429" || "$status" =~ ^5 ]]; then
                sleep $((attempt * 2))
                continue
              fi
              break
            done
            return 1
          }

          INDEX="$BASE_URL/sitemap_index.xml"
          fetch_200 "$INDEX" artifacts/sitemap-index.xml || {
            echo "::error::sitemap_index.xml did not return HTTP 200 after transient retries"
            exit 1
          }

          mapfile -t CHILDREN < <(grep -oE '<loc>[^<]+</loc>' artifacts/sitemap-index.xml | sed -E 's#</?loc>##g')
          if [[ "${#CHILDREN[@]}" -eq 0 ]]; then
            echo "::error::No child sitemaps discovered"
            exit 1
          fi

          total_urls=0
          child_index=0
          for child in "${CHILDREN[@]}"; do
            child_index=$((child_index + 1))
            file="artifacts/sitemap-child-${child_index}.xml"
            fetch_200 "$child" "$file" || {
              echo "::error::Child sitemap failed: $child"
              exit 1
            }
            count=$(grep -o '<url>' "$file" | wc -l || true)
            total_urls=$((total_urls + count))
            echo "CHILD_SITEMAP=$child URLS=$count"
          done

          if [[ "$total_urls" -lt 1 ]]; then
            echo "::error::Sitemap children contain zero URLs"
            exit 1
          fi

          echo "SITEMAP_STATUS=PASS"
          echo "SITEMAP_CHILDREN=${#CHILDREN[@]}"
          echo "SITEMAP_URLS=$total_urls"

  seo-origin-contract:
    name: Canonical & Robots Origin Contract
    runs-on: ubuntu-latest
    needs: sitemap-status
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify production canonical and indexability
        shell: bash
        env:
          BASE_URL: https://nuvanx.com
        run: |
          set -euo pipefail
          status="000"
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -sS -L -A 'Mozilla/5.0 (compatible; NUVANX-SEO-Audit/1.0)' \
              --connect-timeout 20 --max-time 45 \
              -o index.html -w '%{http_code}' "$BASE_URL/") || status="000"
            echo "FETCH attempt=$attempt status=$status"
            if [[ "$status" == "200" ]]; then break; fi
            if [[ "$status" == "202" || "$status" == "429" || "$status" =~ ^5 ]]; then
              sleep $((attempt * 2))
              continue
            fi
            break
          done

          if [[ "$status" != "200" ]]; then
            echo "::error::Could not retrieve production home HTML with HTTP 200"
            exit 1
          fi

          EXPECTED_CANONICAL="$BASE_URL/"

          canonical_tag=$(grep -ioE '<link[^>]+rel=["'"']canonical["'"'][^>]*>' index.html | head -n 1 || true)
          canonical_href=$(printf '%s' "$canonical_tag" | grep -ioE 'href=["'"'][^"'"']+["'"']' | head -n 1 | sed -E 's/^href=["'"']//; s/["'"']$//' || true)
          if [[ -z "$canonical_href" || "$canonical_href" != "$EXPECTED_CANONICAL" ]]; then
            echo "::error::Canonical home URL missing or unexpected (found '${canonical_href:-none}', expected '$EXPECTED_CANONICAL')"
            exit 1
          fi

          if grep -qiE '<meta[^>]+name=["'"']robots["'"'][^>]+content=["'"'][^"'"']*noindex' index.html; then
            echo "::error::Production home is marked noindex"
            exit 1
          fi

          robots_header=$(curl -sSI -L -A 'Mozilla/5.0 (compatible; NUVANX-SEO-Audit/1.0)' \
            --connect-timeout 20 --max-time 45 "$BASE_URL/" | grep -i '^x-robots-tag:' || true)
          if printf '%s' "$robots_header" | grep -qi 'noindex'; then
            echo "::error::Production home returns X-Robots-Tag noindex"
            exit 1
          fi

          echo "SEO_ORIGIN_CONTRACT=PASS"
          echo "CANONICAL_HOME=$EXPECTED_CANONICAL"
          echo "ROBOTS_INDEXABLE=true"

  inspect-search-console-pages:
    name: Inspect Sitemap URLs via Search Console
    runs-on: ubuntu-latest
    needs: seo-origin-contract
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/seo/package-lock.json

      - name: Install SEO script dependencies
        run: npm ci --prefix scripts/seo

      - name: Inspect Search Console coverage
        id: inspection
        shell: bash
        env:
          SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON: ${{ secrets.SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          SEARCH_CONSOLE_PROPERTY: ${{ secrets.SEARCH_CONSOLE_PROPERTY }}
          BASE_URL: https://nuvanx.com
        run: |
          set -euo pipefail

          CREDS="${SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON:-}"
          if [[ -z "$CREDS" || "$CREDS" == *"{{"* ]]; then
            echo "::warning::Search Console service-account JSON is not configured; URL Inspection skipped."
            echo "SEARCH_CONSOLE_INSPECTION=SKIPPED_NO_CREDENTIALS" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          SEARCH_PROP="${SEARCH_CONSOLE_PROPERTY:-https://nuvanx.com/}"
          mkdir -p scripts/seo/artifacts
          printf '%s' "$CREDS" > scripts/seo/credentials.json
          trap 'rm -f scripts/seo/credentials.json' EXIT

          node scripts/seo/index-pages.js \
            --property "$SEARCH_PROP" \
            --url "$BASE_URL" \
            --max-urls 200 \
            | tee scripts/seo/artifacts/url-inspection.log

      - name: Upload Search Console inspection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-console-url-inspection-${{ github.run_id }}
          path: |
            scripts/seo/artifacts/indexing-results.json
            scripts/seo/artifacts/url-inspection.log
          if-no-files-found: warn
          retention-days: 14
