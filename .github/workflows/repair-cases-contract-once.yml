# One-time guarded repair. Removed from the branch after the durable script commit.
name: Repair Patient Cases Contract Once

on:
  pull_request:
    branches: [master]
    types: [synchronize]
    paths:
      - '.github/workflows/repair-cases-contract-once.yml'

permissions:
  contents: write

concurrency:
  group: repair-patient-cases-contract-once-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/staging2-endolaser-cases-heroes-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Align patient cases QA copy
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          old_h1 = "['/casos-de-pacientes/', 'La evolución necesita contexto, no una promesa.']"
          new_h1 = "['/casos-de-pacientes/', 'Casos de pacientes y tratamientos realizados en NUVANX']"
          qa_files = [
              Path('scripts/staging2/capture-visual-qa.mjs'),
              Path('scripts/staging2/capture-visual-qa-browser.mjs'),
          ]
          for path in qa_files:
              content = path.read_text(encoding='utf-8')
              if content.count(old_h1) != 1:
                  raise SystemExit(f'{path}: expected one legacy patient-cases H1 contract')
              path.write_text(content.replace(old_h1, new_h1, 1), encoding='utf-8')
          PY

      - name: Validate and commit durable repair
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/staging2/capture-visual-qa.mjs
          node --check scripts/staging2/capture-visual-qa-browser.mjs
          grep -Fq "Casos de pacientes y tratamientos realizados en NUVANX" scripts/staging2/capture-visual-qa.mjs
          grep -Fq "Casos de pacientes y tratamientos realizados en NUVANX" scripts/staging2/capture-visual-qa-browser.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/staging2/capture-visual-qa.mjs scripts/staging2/capture-visual-qa-browser.mjs
          git commit -m 'fix(ci): align patient cases visual QA contract'
          git push origin "HEAD:${TARGET_BRANCH}"
