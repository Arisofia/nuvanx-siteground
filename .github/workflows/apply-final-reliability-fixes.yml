name: Apply Final Reliability Fixes

on:
  push:
    branches:
      - fix/final-reliability-indexnow-20260808
    paths:
      - .github/workflows/apply-final-reliability-fixes.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/final-reliability-indexnow-20260808
          fetch-depth: 0
          persist-credentials: true

      - name: Remove redundant native list roles
        shell: python
        run: |
          from pathlib import Path

          expected = {
              'wp-content/themes/nuvanx-medical/inc/nvx-nosotros-page.php': 3,
              'wp-content/themes/nuvanx-medical/inc/nvx-equipo-page.php': 2,
              'wp-content/themes/nuvanx-medical/templates/page-contacto.php': 2,
              'wp-content/themes/nuvanx-medical/inc/nvx-clinics-hub.php': 2,
          }
          total = 0
          for filename, expected_count in expected.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              count = text.count(' role="list"')
              if count != expected_count:
                  raise SystemExit(f'{filename}: expected {expected_count} role=list occurrences, found {count}')
              text = text.replace(' role="list"', '')
              path.write_text(text, encoding='utf-8')
              total += count
          if total != 9:
              raise SystemExit(f'Expected 9 total removals, found {total}')
          print('ARIA_REDUNDANT_LIST_ROLES_REMOVED=9')

      - name: Validate PHP and diff
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            wp-content/themes/nuvanx-medical/inc/nvx-nosotros-page.php \
            wp-content/themes/nuvanx-medical/inc/nvx-equipo-page.php \
            wp-content/themes/nuvanx-medical/templates/page-contacto.php \
            wp-content/themes/nuvanx-medical/inc/nvx-clinics-hub.php
          do
            php -l "$file"
            ! grep -Fq ' role="list"' "$file"
          done
          git diff --check

      - name: Commit and push PHP cleanup only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Nuvanx Engineering'
          git config user.email 'admin@nuvanx.com'
          git add \
            wp-content/themes/nuvanx-medical/inc/nvx-nosotros-page.php \
            wp-content/themes/nuvanx-medical/inc/nvx-equipo-page.php \
            wp-content/themes/nuvanx-medical/templates/page-contacto.php \
            wp-content/themes/nuvanx-medical/inc/nvx-clinics-hub.php
          git diff --cached --check
          git commit -m 'fix(a11y): remove redundant native list roles'
          git push origin HEAD:fix/final-reliability-indexnow-20260808
