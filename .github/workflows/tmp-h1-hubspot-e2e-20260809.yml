name: TEMP H1 HubSpot Attribution E2E 20260809

on:
  push:
    branches:
      - audit/h1-hubspot-e2e-20260809-1510

permissions:
  contents: read

concurrency:
  group: tmp-h1-hubspot-e2e-20260809
  cancel-in-progress: true

jobs:
  h1-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Playwright
        shell: bash
          set -euo pipefail
          npm init -y
          npm install --no-audit --no-fund playwright@1.54.2
          npx playwright install --with-deps chromium
          mkdir -p tmp-h1

      - name: Run production H1 E2E
        shell: bash
        run: |
          set -euo pipefail
          node scripts/tmp-h1-hubspot-e2e.mjs 2>&1 | tee tmp-h1/h1-e2e.log

      - name: Upload sanitized E2E log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: h1-hubspot-e2e-20260809-1510
          path: tmp-h1/h1-e2e.log
          retention-days: 7
