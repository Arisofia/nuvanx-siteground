name: Production Payload Patch Once
run-name: Production payload patch once · ${{ github.sha }}

on:
  push:
    branches:
      - ops/production-dispatch-once-20260820
    paths:
      - '.github/workflows/production-dispatch-branch-once.yml'

permissions:
  contents: write

jobs:
  patch:
    name: Patch production migration payload
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ops/production-dispatch-once-20260820
          fetch-depth: 0
          persist-credentials: true

      - name: Apply and validate exact payload fix
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-production-migration-payload-once.py
          grep -Fq 'rsync -az --delete "$CANDIDATE_ROOT/tools/migrations/" "nvx-prod:$REMOTE_RELEASE/tools/migrations/"' .github/workflows/production.yml
          grep -Fq 'PRODUCTION_MIGRATION_PAYLOAD=PASS required=9' .github/workflows/production.yml
          git diff --check
          echo 'PRODUCTION_PAYLOAD_PATCH_VALIDATION=PASS'

      - name: Commit isolated payload fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Arisofia'
          git config user.email '246412546+Arisofia@users.noreply.github.com'
          git add .github/workflows/production.yml
          git diff --cached --quiet && { echo 'No payload fix to commit' >&2; exit 1; }
          git commit -m 'fix(release): package complete production migrations'
          git push origin HEAD:ops/production-dispatch-once-20260820
          echo "PRODUCTION_PAYLOAD_BRANCH_PATCH=PASS sha=$(git rev-parse HEAD)"
