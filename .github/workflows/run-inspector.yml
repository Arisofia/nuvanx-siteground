name: Run Inspector
run-name: Run Inspector · active canonical Staging

on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    if: ${{ github.head_ref == 'ops/inspect-active-staging-20260820' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      inspected_staging_run_id: ${{ steps.resolve.outputs.run_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Resolve canonical Staging run for PR base SHA
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          command -v gh >/dev/null 2>&1 || {
            echo 'GitHub CLI is unavailable on this runner image.' >&2
            exit 1
          }
          command -v jq >/dev/null 2>&1 || {
            echo 'jq is unavailable on this runner image.' >&2
            exit 1
          }

          runs_json="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow staging.yml \
            --event workflow_dispatch \
            --limit 100 \
            --json databaseId,status,conclusion,headSha,createdAt,updatedAt,url)"
          run_id="$(jq -r --arg sha "$TARGET_SHA" '
            [.[] | select(.headSha == $sha)]
            | sort_by(.databaseId)
            | last
            | .databaseId // empty
          ' <<<"$runs_json")"

          [[ "$run_id" =~ ^[0-9]+$ ]] || {
            echo "No canonical Staging workflow_dispatch run found for TARGET_SHA=$TARGET_SHA" >&2
            exit 1
          }

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "INSPECTED_STAGING_RUN_ID=$run_id"

      - name: Inspect canonical Staging and FIFO blockers
        shell: bash
        env:
          TARGET_RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          set -euo pipefail
          echo '=== TARGET STAGING ==='
          gh run view "$TARGET_RUN_ID" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,headSha,createdAt,updatedAt,jobs,url | jq -c '.'
          echo '=== OLDER ACTIVE CANONICAL MUTATION BLOCKERS ==='
          found=0
          for status in queued in_progress waiting requested pending; do
            raw="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs?status=${status}&per_page=100")"
            rows="$(jq -r --argjson target "$TARGET_RUN_ID" '
              .workflow_runs[]?
              | select(.id < $target)
              | select((.path == ".github/workflows/staging.yml") or (.path == ".github/workflows/production.yml"))
              | select((.event == "push") or (.event == "workflow_dispatch") or (.event == "pull_request_target"))
              | [(.id|tostring),(.status//""),(.event//""),(.path//""),(.head_sha//""),(.created_at//"")] | @tsv
            ' <<<"$raw")"
            if [[ -n "$rows" ]]; then
              found=1
              printf '%s\n' "$rows"
            fi
          done
          echo "FIFO_BLOCKERS_FOUND=$found"
