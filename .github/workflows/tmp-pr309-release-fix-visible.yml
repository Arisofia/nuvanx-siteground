name: Fix PR 309 release blockers visible

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/tmp-pr309-release-fix-visible.yml'
      - '.github/workflows/tmp-pr309-release-fix.yml'

concurrency:
  group: tmp-pr309-release-fix-visible
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fix:
    if: github.event.pull_request.number == 309 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f
        with:
          php-version: '8.2'
          coverage: none
          tools: none

      - name: Extract and execute validated patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/tmp-pr309-release-fix.yml').read_text(encoding='utf-8').splitlines()
          start = source.index('      - name: Apply validated release fixes')
          run_line = source.index('        run: |', start)
          body = []
          for line in source[run_line + 1:]:
              if line.startswith('      - name: '):
                  break
              if line.startswith('          '):
                  body.append(line[10:])
              else:
                  body.append(line)
          if not body or not body[0].startswith('set -euo pipefail'):
              raise SystemExit('Could not extract the release patch block.')
          Path('/tmp/apply-pr309-release-fixes.sh').write_text('\n'.join(body) + '\n', encoding='utf-8')
          PY
          bash -n /tmp/apply-pr309-release-fixes.sh
          bash /tmp/apply-pr309-release-fixes.sh

      - name: Validate all permanent contracts
        shell: bash
        run: |
          set -euo pipefail
          php -l scripts/theme-hygiene/test-page-render-helpers.php
          php -l scripts/theme-hygiene/test-catalog-i18n-source-contract.php
          find wp-content/themes/nuvanx-medical -type f -name '*.php' -print0 | xargs -0 -n 1 php -l
          php scripts/theme-hygiene/test-catalog-json-contract.php
          php scripts/theme-hygiene/test-catalog-json-runtime-contract.php
          php scripts/theme-hygiene/test-catalog-review-contract.php
          php scripts/theme-hygiene/test-page-render-helpers.php
          php scripts/theme-hygiene/generate-catalog-i18n-source.php > /tmp/nvx-catalog-i18n.php
          php -l /tmp/nvx-catalog-i18n.php
          php scripts/theme-hygiene/test-catalog-i18n-source-contract.php /tmp/nvx-catalog-i18n.php
          node --check scripts/theme-hygiene/test-theme-hygiene.mjs
          node scripts/theme-hygiene/test-theme-hygiene.mjs

      - name: Commit fixes and remove one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-pr309-release-fix.yml
          rm -f .github/workflows/tmp-pr309-release-fix-visible.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && {
            echo 'No release fixes remained to commit.'
            exit 0
          }
          git commit -m 'fix(release): close PR 309 production blockers'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
