name: Staging2 Valoracion HubSpot Probe Once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/staging2-valoracion-hubspot-probe-once.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      URL: https://staging2.nuvanx.com/madrid/valoracion/
      EXPECTED_SHA: 69bda4a907aa98715c8a3226d6f5971c3b782eff
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/staging2/package-lock.json

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          cd scripts/staging2
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Probe HubSpot mount without mutating staging
        shell: bash
        working-directory: scripts/staging2
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const url = process.env.URL;
          const expectedSha = process.env.EXPECTED_SHA;
          const browser = await chromium.launch({headless:true,args:['--no-sandbox']});
          const context = await browser.newContext({
            viewport:{width:1440,height:1100},
            ignoreHTTPSErrors:true,
            userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36 NUVANX-HubSpot-Probe/1.0'
          });
          const page = await context.newPage();
          const consoleLines=[];
          const failed=[];
          const hsResponses=[];
          page.on('console', msg => consoleLines.push(`${msg.type()}: ${msg.text()}`));
          page.on('pageerror', err => consoleLines.push(`pageerror: ${err.message}`));
          page.on('requestfailed', req => {
            const u=req.url();
            if (/hubspot|hsforms|hubapi|hscollectedforms/i.test(u)) failed.push(`${req.method()} ${u} :: ${req.failure()?.errorText||'failed'}`);
          });
          page.on('response', res => {
            const u=res.url();
            if (/hubspot|hsforms|hubapi|hscollectedforms/i.test(u)) hsResponses.push(`${res.status()} ${u}`);
          });

          let response;
          for (let i=1;i<=4;i++) {
            response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:40000});
            const headers=response?await response.allHeaders():{};
            if (response && response.status()!==202 && !headers['sg-captcha']) break;
            await page.waitForTimeout(2500*i);
          }
          console.log('HTTP_STATUS='+String(response?.status()||0));
          console.log('META_SHA='+String(await page.locator('meta[name="nvx-deploy-sha"]').getAttribute('content').catch(()=>'')));
          if ((await page.locator('meta[name="nvx-deploy-sha"]').getAttribute('content').catch(()=>'')) !== expectedSha) {
            throw new Error('Unexpected deployed SHA; refusing to diagnose a different candidate.');
          }

          await page.waitForLoadState('load').catch(()=>{});
          await page.waitForTimeout(500);
          const host=page.locator('#nvx-hubspot-form');
          await host.dispatchEvent('focusin').catch(()=>{});
          await page.waitForTimeout(15000);

          const state=await page.evaluate(() => {
            const section=document.getElementById('nvx-hubspot-form');
            const frame=section?.querySelector('.hs-form-frame')||null;
            const runtime=document.getElementById('nvx-hubspot-forms-runtime');
            const allHsForms=Array.from(document.querySelectorAll('.hbspt-form, form.hs-form'));
            const allIframes=Array.from(document.querySelectorAll('iframe'));
            return {
              readyState: document.readyState,
              href: location.href,
              hbsptExists: Boolean(window.hbspt),
              formsApiExists: Boolean(window.hbspt?.forms),
              createType: typeof window.hbspt?.forms?.create,
              frame: frame ? {
                id: frame.id,
                hsInitialized: frame.dataset.hsInitialized || '',
                childCount: frame.childElementCount,
                childTags: Array.from(frame.children).map(el => `${el.tagName}.${String(el.className||'').replace(/\s+/g,'.')}`),
                html: frame.outerHTML.slice(0,8000)
              } : null,
              sectionChildCount: section?.childElementCount ?? null,
              sectionHtml: section?.innerHTML.slice(0,12000) || '',
              runtimeScript: runtime ? {src: runtime.src, loaded: runtime.dataset.nvxLoaded||''} : null,
              hsScripts: Array.from(document.scripts).map(s=>s.src).filter(src=>/hubspot|hsforms/i.test(src)),
              allHsForms: allHsForms.map(el=>({tag:el.tagName,id:el.id,className:el.className,inside:Boolean(section?.contains(el))})),
              allIframes: allIframes.map(el=>({src:el.src,id:el.id,className:el.className,inside:Boolean(section?.contains(el))})),
              bodyTail: document.body.innerHTML.slice(-6000)
            };
          });

          console.log('=== STATE ===');
          console.log(JSON.stringify(state,null,2));
          console.log('=== HUBSPOT RESPONSES ===');
          console.log(hsResponses.join('\n') || 'NONE');
          console.log('=== HUBSPOT FAILED REQUESTS ===');
          console.log(failed.join('\n') || 'NONE');
          console.log('=== CONSOLE ===');
          console.log(consoleLines.filter(x=>/hubspot|hbspt|form|error|failed/i.test(x)).slice(0,80).join('\n') || 'NONE');

          await browser.close();
          NODE
