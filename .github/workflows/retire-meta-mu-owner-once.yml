name: Classify residual Meta MU owner once

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  classify:
    if: github.head_ref == 'ops/retire-meta-mu-owner-20260821'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROD_ROOT: /home/customer/www/nuvanx.com/public_html
      EXPECTED_MASTER_SHA: 79cea21ac3e6e8b64a4c48ae8137f0b0ddca23c8
    steps:
      - name: Check out operational branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Assert master unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin master
          test "$(git rev-parse origin/master)" = "$EXPECTED_MASTER_SHA"

      - name: Configure strict production SSH
        shell: bash
        env:
          NVX_SSH_ALIAS: nvx-prod
          NVX_SSH_KEY_BASENAME: prod_key
          PRIMARY_HOST: ${{ secrets.PROD_SSH_HOST }}
          PRIMARY_PORT: ${{ secrets.PROD_SSH_PORT }}
          PRIMARY_USER: ${{ secrets.PROD_SSH_USER }}
          PRIMARY_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PRIMARY_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          FALLBACK_HOST: ${{ secrets.STAGING2_SSH_HOST }}
          FALLBACK_PORT: ${{ secrets.STAGING2_SSH_PORT }}
          FALLBACK_USER: ${{ secrets.STAGING2_SSH_USER }}
          FALLBACK_KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          FALLBACK_KNOWN_HOSTS: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: bash scripts/production/configure-siteground-ssh.sh

      - name: Classify production-only match-quality MU source read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-prod "PROD_ROOT='$PROD_ROOT' php -r '"'"'
            $p = getenv("PROD_ROOT") . "/wp-content/mu-plugins/nuvanx-meta-match-quality.php";
            if (!is_file($p)) { fwrite(STDERR, "META_MATCH_QUALITY=ABSENT\n"); exit(2); }
            $s = file_get_contents($p);
            if (!is_string($s)) exit(3);
            $checks = [
              "document_cookie" => preg_match("~document\\.cookie~i", $s),
              "cookie_assignment" => preg_match("~cookie\\s*=~i", $s),
              "fbp" => stripos($s, "_fbp") !== false,
              "fbc" => stripos($s, "_fbc") !== false,
              "script_literal" => stripos($s, "<script") !== false,
              "echo_or_print" => preg_match("~\\b(?:echo|print)\\b~i", $s),
              "wp_head" => stripos($s, "wp_head") !== false,
              "wp_footer" => stripos($s, "wp_footer") !== false,
              "inline_script" => stripos($s, "wp_add_inline_script") !== false,
              "setcookie" => preg_match("~\\bsetcookie\\s*\\(~i", $s),
              "cookie_superglobal" => strpos($s, "$_COOKIE") !== false,
              "consent_terms" => preg_match("~consent|marketing|statistics|cmplz|wp_consent~i", $s),
              "capi_terms" => preg_match("~conversions.?api|capi|event_id|user_data~i", $s),
            ];
            printf("META_MATCH_QUALITY path=%s bytes=%d sha256=%s\n", basename($p), strlen($s), substr(hash("sha256", $s), 0, 16));
            foreach ($checks as $k => $v) printf("META_MATCH_QUALITY_FEATURE %s=%s\n", $k, $v ? "true" : "false");
            if (preg_match_all("~function\\s+([A-Za-z_][A-Za-z0-9_]*)\\s*\\(~", $s, $m)) {
              foreach (array_unique($m[1]) as $name) printf("META_MATCH_QUALITY_FUNCTION name=%s\n", $name);
            }
            if (preg_match_all("~add_(action|filter)\\s*\\(\\s*[\\x27\\x22]([^\\x27\\x22]+)[\\x27\\x22]~", $s, $m, PREG_SET_ORDER)) {
              foreach ($m as $row) printf("META_MATCH_QUALITY_HOOK type=%s hook=%s\n", $row[1], $row[2]);
            }
          '"'"''"

      - name: Cleanup SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/prod_key" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"
