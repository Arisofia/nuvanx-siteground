name: Staging2 Acceptance Tests

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  acceptance:
    name: Browser Acceptance Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate page template integrity
        env:
          WORDPRESS_URL: https://staging2.nuvanx.com
        run: |
          node scripts/validate-page-templates.mjs

      - name: Install dependencies
        run: |
          cd scripts/staging2
          npm install
          npx playwright install --with-deps chromium

      - name: Run browser acceptance tests
        env:
          BASE_URL: https://staging2.nuvanx.com
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          cd scripts/staging2
          node browser-acceptance.mjs

      - name: Upload acceptance test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-results
          path: scripts/staging2/acceptance-results.json
