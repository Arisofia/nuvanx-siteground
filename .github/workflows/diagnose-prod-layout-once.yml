name: Diagnose Production Layout Once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/diagnose-prod-layout-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/staging2/package-lock.json
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          cd scripts/staging2
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium >/dev/null
      - name: Inspect current production DOM and geometry
        shell: bash
        run: |
          set -euo pipefail
          cd scripts/staging2
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true,args:['--no-sandbox']});
          const ctx = await browser.newContext({viewport:{width:1440,height:1100},ignoreHTTPSErrors:true});
          const p = await ctx.newPage();
          async function open(url){
            const r=await p.goto(url,{waitUntil:'networkidle',timeout:45000});
            console.log(`URL=${url} HTTP=${r?.status()}`);
            await p.evaluate(async()=>{if(document.fonts?.ready) await document.fonts.ready;});
            await p.waitForTimeout(500);
          }

          await open('https://nuvanx.com/equipo-medico/');
          const team = await p.evaluate(()=>[...document.images]
            .filter(i=>/Francisco Geraldo|Yolanda Piñero/i.test(i.alt||''))
            .map(img=>{
              const fig=img.closest('figure');
              const card=img.closest('.nvx-brand-card--team');
              const grid=card?.parentElement;
              const section=card?.closest('section');
              const r=img.getBoundingClientRect(), cr=card?.getBoundingClientRect(), gr=grid?.getBoundingClientRect();
              const cs=getComputedStyle(img), ccs=card?getComputedStyle(card):null, gcs=grid?getComputedStyle(grid):null;
              return {
                alt:img.alt,
                imgRect:{w:Math.round(r.width),h:Math.round(r.height)},
                imgCSS:{width:cs.width,height:cs.height,maxWidth:cs.maxWidth,maxHeight:cs.maxHeight,minHeight:cs.minHeight,aspectRatio:cs.aspectRatio,objectFit:cs.objectFit},
                figureClass:fig?.className||'',
                card:{class:card?.className||'',rect:cr?{w:Math.round(cr.width),h:Math.round(cr.height)}:null,display:ccs?.display,gridColumn:ccs?.gridColumn},
                grid:{tag:grid?.tagName,cls:grid?.className||'',rect:gr?{w:Math.round(gr.width),h:Math.round(gr.height)}:null,display:gcs?.display,columns:gcs?.gridTemplateColumns},
                section:{id:section?.id||'',cls:section?.className||''},
                cardHTML:(card?.outerHTML||'').slice(0,3200)
              };
            }));
          console.log('TEAM_DETAIL='+JSON.stringify(team));

          await open('https://nuvanx.com/madrid/valoracion/');
          const val = await p.evaluate(()=>{
            const root=document.querySelector('#nvx-valoracion-main') || document.querySelector('article');
            const hero=root?.querySelector(':scope > .nvx-brand-hero, :scope > .nvx-valoracion-hero');
            const form=document.querySelector('#nvx-hubspot-form');
            const iframe=form?.querySelector('iframe[data-test-id^="embedded-form-"]');
            const rr=root?.getBoundingClientRect(), hr=hero?.getBoundingClientRect(), fr=form?.getBoundingClientRect(), ir=iframe?.getBoundingClientRect();
            return {
              rootRect:rr?{top:Math.round(rr.top),height:Math.round(rr.height)}:null,
              heroRect:hr?{top:Math.round(hr.top),height:Math.round(hr.height),bottom:Math.round(hr.bottom)}:null,
              formRect:fr?{top:Math.round(fr.top),height:Math.round(fr.height),bottom:Math.round(fr.bottom)}:null,
              iframeRect:ir?{top:Math.round(ir.top),height:Math.round(ir.height),width:Math.round(ir.width)}:null,
              adjacent:!!(hero&&form&&hero.nextElementSibling===form),
              order:[...(root?.children||[])].map((el,i)=>({i,tag:el.tagName,id:el.id,cls:el.className})),
              formStyle:form?{display:getComputedStyle(form).display,visibility:getComputedStyle(form).visibility,opacity:getComputedStyle(form).opacity}:null
            };
          });
          const frame = p.frames().find(f=>f.url().includes('ui-forms-embed-components-app/frame.html'));
          let frameInfo={found:!!frame};
          if(frame){
            await frame.waitForLoadState('domcontentloaded').catch(()=>{});
            await p.waitForTimeout(800);
            frameInfo={found:true,url:frame.url(),inputs:await frame.locator('input,textarea,select').count().catch(()=>-1),buttons:await frame.locator('button,input[type="submit"]').count().catch(()=>-1),bodyText:(await frame.locator('body').innerText().catch(()=>'' )).trim().slice(0,500)};
          }
          console.log('VALORACION_DETAIL='+JSON.stringify({val,frameInfo}));
          await browser.close();
          NODE
