name: Theme Hygiene Gate

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/theme-hygiene-gate.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/staging2-endolaser-cases-heroes-20260725
          fetch-depth: 0
          persist-credentials: true

      - name: Apply validate and commit repair
        env:
          REPAIR_SCRIPT_B64: 
          FINAL_WORKFLOW_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$REPAIR_SCRIPT_B64" | base64 -d > /tmp/repair-theme.py
          python /tmp/repair-theme.py
          printf '%s' "$FINAL_WORKFLOW_B64" | base64 -d > .github/workflows/theme-hygiene-gate.yml
          php -l wp-content/themes/nuvanx-medical/inc/nvx-mobile-hero-hierarchy.php
          php -l wp-content/themes/nuvanx-medical/inc/nvx-13-point-renderer.php
          php -l wp-content/themes/nuvanx-medical/inc/nvx-content-presentation.php
          php -l wp-content/themes/nuvanx-medical/inc/nvx-valoracion-modal.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(theme): unify technology heroes blog layout and valuation flow'
          git push origin HEAD:fix/staging2-endolaser-cases-heroes-20260725
