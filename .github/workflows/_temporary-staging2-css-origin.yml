name: Temporary Staging2 CSS origin diagnostic

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install Chromium runtime
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-save playwright-core@1.55.0
          test -x /usr/bin/chromium
          mkdir -p evidence/site-root
      - name: Configure SiteGround SSH
        env:
          SSH_HOST: ${{ secrets.STAGING2_SSH_HOST }}
          SSH_PORT_SECRET: ${{ secrets.STAGING2_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING2_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing STAGING2_SSH_HOST}"
          : "${SSH_USER:?Missing STAGING2_SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Missing STAGING2_SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing STAGING2_SSH_KNOWN_HOSTS}"
          SSH_PORT="${SSH_PORT_SECRET:-18765}"
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/siteground_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/siteground_key" "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host siteground-staging
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/siteground_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 15
          EOF
          chmod 600 "$HOME/.ssh/config"
      - name: Capture origin HTML, runtime CSS state and CSS assets
        run: |
          set -euo pipefail
          ssh siteground-staging 'bash -se' > evidence/siteground-origin.txt 2>&1 <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/home/customer/www/staging2.nuvanx.com/public_html
          cd "$ROOT"
          DEBUG_PLUGIN="$ROOT/wp-content/mu-plugins/nvx-css-runtime-debug.php"
          cat > "$DEBUG_PLUGIN" <<'PHP'
          <?php
          add_action('wp_enqueue_scripts', static function (): void {
              $s = wp_styles();
              file_put_contents('/tmp/nvx-css-runtime-state.log', "ENQUEUE=" . wp_json_encode(array('queue'=>$s->queue,'to_do'=>$s->to_do,'done'=>$s->done)) . "\n", FILE_APPEND);
          }, 9999);
          add_action('wp_head', static function (): void {
              file_put_contents('/tmp/nvx-css-runtime-state.log', "WP_HEAD=1\n", FILE_APPEND);
          }, 0);
          add_action('wp_print_styles', static function (): void {
              $s = wp_styles();
              file_put_contents('/tmp/nvx-css-runtime-state.log', "PRINT_STYLES_BEFORE=" . wp_json_encode(array('queue'=>$s->queue,'to_do'=>$s->to_do,'done'=>$s->done)) . "\n", FILE_APPEND);
          }, 0);
          add_action('wp_print_styles', static function (): void {
              $s = wp_styles();
              file_put_contents('/tmp/nvx-css-runtime-state.log', "PRINT_STYLES_AFTER=" . wp_json_encode(array('queue'=>$s->queue,'to_do'=>$s->to_do,'done'=>$s->done)) . "\n", FILE_APPEND);
          }, 9999);
          PHP
          rm -f /tmp/nvx-css-runtime-state.log
          printf 'SITEURL=%s\nHOME=%s\nTHEME=%s\n' "$(wp option get siteurl)" "$(wp option get home)" "$(wp theme list --status=active --field=name)"
          echo '--- ACTIVE PLUGINS ---'
          wp plugin list --status=active --field=name
          echo '--- STYLE QUEUE (CLI HOOK) ---'
          wp eval 'do_action("wp_enqueue_scripts"); foreach (wp_styles()->queue as $h) { $o=wp_styles()->registered[$h]??null; if($o){echo $h."|".$o->src."|deps=".implode(",",$o->deps)."\\n";} }'
          echo '--- ORIGIN ---'
          curl -ksS -D /tmp/nvx-origin-headers.txt -o /tmp/nvx-origin.html --resolve staging2.nuvanx.com:443:127.0.0.1 https://staging2.nuvanx.com/
          cat /tmp/nvx-origin-headers.txt
          echo "HTML_BYTES=$(wc -c < /tmp/nvx-origin.html)"
          grep -Eqi '<html|<body' /tmp/nvx-origin.html
          grep -q '/.well-known/sgcaptcha/' /tmp/nvx-origin.html && { echo 'ORIGIN_CAPTCHA=1'; rm -f "$DEBUG_PLUGIN"; exit 2; } || echo 'ORIGIN_CAPTCHA=0'
          echo '--- RUNTIME CSS HOOK STATE ---'
          cat /tmp/nvx-css-runtime-state.log || true
          echo '--- HTML STYLESHEET TAGS ---'
          python3 - <<'PY'
          import re
          s=open('/tmp/nvx-origin.html',encoding='utf-8',errors='replace').read()
          tags=re.findall(r'<link\b[^>]*>',s,re.I)
          styles=[t for t in tags if re.search(r'rel=["\'][^"\']*stylesheet',t,re.I)]
          print('STYLESHEET_TAG_COUNT='+str(len(styles)))
          for t in styles: print(t)
          PY
          echo '--- CSS RESPONSES ---'
          python3 - <<'PY'
          import re,html,subprocess
          s=open('/tmp/nvx-origin.html',encoding='utf-8',errors='replace').read()
          for tag in re.findall(r'<link\b[^>]*>',s,re.I):
            if not re.search(r'rel=["\'][^"\']*stylesheet',tag,re.I): continue
            m=re.search(r'href=["\\\']([^"\\\']+)',tag,re.I)
            if not m: continue
            u=html.unescape(m.group(1))
            if u.startswith('/'): u='https://staging2.nuvanx.com'+u
            if not u.startswith('http'): continue
            out=subprocess.check_output(['curl','-ksS','-L','--resolve','staging2.nuvanx.com:443:127.0.0.1','-o','/tmp/nvx-one.css','-w','HTTP=%{http_code} TYPE=%{content_type} BYTES=%{size_download}',u],text=True)
            print(u+' :: '+out)
            if not out.startswith('HTTP=200 TYPE=text/css'): raise SystemExit(3)
          PY
          echo 'ORIGIN_CSS_OK=1'
          rm -f "$DEBUG_PLUGIN"
          rm -f /tmp/nvx-css-runtime-state.log
          rm -rf /tmp/nvx-site-root
          mkdir -p /tmp/nvx-site-root/wp-content/themes/nuvanx-medical/assets
          cp /tmp/nvx-origin.html /tmp/nvx-site-root/index.html
          cp -a "$ROOT/wp-content/themes/nuvanx-medical/assets/css" /tmp/nvx-site-root/wp-content/themes/nuvanx-medical/assets/
          tar -czf /tmp/nvx-origin-bundle.tgz -C /tmp/nvx-site-root .
          REMOTE
          scp siteground-staging:/tmp/nvx-origin-bundle.tgz evidence/origin-bundle.tgz
      - name: Verify computed styles from origin snapshot
        run: |
          set -euo pipefail
          tar -xzf evidence/origin-bundle.tgz -C evidence/site-root
          python3 -m http.server 8765 --directory evidence/site-root >/tmp/nvx-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node <<'NODE'
          const { chromium } = require('playwright-core');
          (async()=>{
            const b=await chromium.launch({headless:true,executablePath:'/usr/bin/chromium',args:['--no-sandbox']});
            const p=await b.newPage({viewport:{width:1440,height:1000}});
            const failed=[]; p.on('requestfailed',r=>failed.push(r.url()));
            const r=await p.goto('http://127.0.0.1:8765/',{waitUntil:'networkidle',timeout:60000});
            const x=await p.evaluate(()=>{const s=getComputedStyle(document.body),h=document.querySelector('h1');return {margin:s.margin,font:s.fontFamily,display:s.display,bg:s.backgroundColor,h1Font:h?getComputedStyle(h).fontFamily:null,h1Size:h?getComputedStyle(h).fontSize:null,css:[...document.querySelectorAll('link[rel~="stylesheet"]')].map(l=>({href:l.href,sheet:!!l.sheet,rules:l.sheet?(()=>{try{return l.sheet.cssRules.length}catch(e){return -1}})():0}))}});
            console.log(JSON.stringify({http:r?.status(),computed:x,failed},null,2));
            await p.screenshot({path:'evidence/origin-home.png',fullPage:true});
            if(!r||r.status()!==200) throw new Error('origin snapshot not served');
            if(x.margin==='8px') throw new Error('default body margin indicates CSS not applied');
            if(x.font==='Times New Roman'||x.font==='serif') throw new Error('default font indicates CSS not applied');
            if(x.css.some(c=>!c.sheet||c.rules===0)) throw new Error('stylesheet not parsed');
            if(failed.some(u=>/\.css(?:\?|$)/i.test(u))) throw new Error('CSS request failed');
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporary-staging2-css-origin-${{ github.run_id }}
          path: evidence/
          retention-days: 7
          if-no-files-found: error
