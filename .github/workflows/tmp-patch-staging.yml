name: Temporary Patch Staging Workflow

on:
  push:
    branches:
      - test/trusted-staging-dispatch-e2e-20260819
    paths:
      - .github/workflows/tmp-patch-staging.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: test/trusted-staging-dispatch-e2e-20260819
          fetch-depth: 0

      - name: Patch canonical staging workflow and self-remove
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/staging.yml')
          source = path.read_text()

          trigger_anchor = "  pull_request_target:\n    branches: [master]\n    types: [labeled]\n"
          trigger_replacement = trigger_anchor + "  issue_comment:\n    types: [created]\n"
          if "  issue_comment:\n    types: [created]\n" not in source:
              if trigger_anchor not in source:
                  raise SystemExit('missing pull_request_target trigger anchor')
              source = source.replace(trigger_anchor, trigger_replacement, 1)

          quality_old = "    if: ${{ github.event_name != 'pull_request_target' }}"
          quality_new = "    if: ${{ github.event_name != 'pull_request_target' && github.event_name != 'issue_comment' }}"
          if quality_new not in source:
              if quality_old not in source:
                  raise SystemExit('missing quality if anchor')
              source = source.replace(quality_old, quality_new, 1)

          job_anchor = "jobs:\n  quality:\n"
          command_job = r'''jobs:
  trusted_acceptance_command:
    name: Owner-only exact-master acceptance command
    if: >-
      github.event_name == 'issue_comment' &&
      github.repository == 'Arisofia/nuvanx-siteground' &&
      github.actor == 'Arisofia' &&
      github.event.issue.number == 637 &&
      github.event.comment.body == '/run-staging-acceptance-e2e'
    permissions:
      contents: read
      actions: write
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve immutable master SHA
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          sha="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/master" --jq '.sha')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Dispatch canonical Staging workflow
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MASTER_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -Eeuo pipefail
          triggered_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "triggered_at=$triggered_at" >> "$GITHUB_OUTPUT"
          gh workflow run staging.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref master \
            -f sha="$MASTER_SHA" \
            -f run_acceptance=true \
            -f deep_quality=false

      - name: Locate and watch dispatched run
        id: watch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGERED_AT: ${{ steps.dispatch.outputs.triggered_at }}
        run: |
          set -Eeuo pipefail
          run_id=''
          for attempt in $(seq 1 30); do
            runs="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow staging.yml \
              --event workflow_dispatch \
              --branch master \
              --limit 30 \
              --json databaseId,createdAt)"
            run_id="$(jq -r --arg since "$TRIGGERED_AT" '
              [.[] | select(.createdAt >= $since)]
              | sort_by(.createdAt)
              | reverse
              | .[0].databaseId // empty
            ' <<<"$runs")"
            if [[ "$run_id" =~ ^[0-9]+$ ]]; then
              break
            fi
            sleep 2
          done
          [[ "$run_id" =~ ^[0-9]+$ ]] || exit 1
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          set +e
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Publish bounded outcome
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MASTER_SHA: ${{ steps.resolve.outputs.sha }}
          RUN_ID: ${{ steps.watch.outputs.run_id }}
          RUN_RC: ${{ steps.watch.outputs.rc }}
        run: |
          set -Eeuo pipefail
          outcome='FAIL'
          if [[ "${RUN_RC:-1}" == '0' && "${RUN_ID:-}" =~ ^[0-9]+$ ]]; then
            outcome='PASS'
          fi
          body="STAGING_ACCEPTANCE_COMMAND=${outcome} master_sha=${MASTER_SHA:-unresolved} run_id=${RUN_ID:-unresolved} secrets_exposed=0"
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/issues/637/comments" -f body="$body"
          [[ "$outcome" == 'PASS' ]]

  quality:
'''
          if "  trusted_acceptance_command:\n" not in source:
              if job_anchor not in source:
                  raise SystemExit('missing jobs/quality anchor')
              source = source.replace(job_anchor, command_job, 1)

          path.write_text(source)
          PY

          rm -f .github/workflows/tmp-patch-staging.yml
          git diff --check
          git add .github/workflows/staging.yml .github/workflows/tmp-patch-staging.yml
          git config user.name 'NUVANX CI'
          git config user.email 'ci@nuvanx.invalid'
          git commit -m 'test(staging): add observable owner-only acceptance command'
          git push origin HEAD:test/trusted-staging-dispatch-e2e-20260819
