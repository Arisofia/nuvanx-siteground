name: Staging2 Media Source Recovery V2 Once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/staging2-media-source-recovery-v2-once.yml

permissions:
  contents: read

concurrency:
  group: staging2-media-source-recovery-v2
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING_ROOT: /home/customer/www/staging2.nuvanx.com/public_html
      PROD_ROOT: /home/customer/www/nuvanx.com/public_html
      STAGING_URL: https://staging2.nuvanx.com
      EXPECTED_STAGING_SHA: d54dfa7df226dbd5b823fca1878ce8a60a3548cb
      EXPECTED_PROD_SHA: 4775310be2b7dcdda18f8fd6de8e40041c2eb555

    steps:
      - name: Configure strict SiteGround SSH
        shell: bash
        env:
          HOST: ${{ secrets.STAGING2_SSH_HOST }}
          PORT: ${{ secrets.STAGING2_SSH_PORT }}
          USER: ${{ secrets.STAGING2_SSH_USER }}
          KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${HOST:?Missing STAGING2_SSH_HOST}"
          : "${USER:?Missing STAGING2_SSH_USER}"
          : "${KEY:?Missing STAGING2_SSH_PRIVATE_KEY}"
          : "${KH:?Missing STAGING2_SSH_KNOWN_HOSTS}"
          SSH_PORT="${PORT:-18765}"
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KH" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx-sg
            HostName $HOST
            User $USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 20
            ServerAliveInterval 30
            ServerAliveCountMax 2
          EOF
          chmod 600 "$HOME/.ssh/config"
          ssh nvx-sg "test -d '$STAGING_ROOT' && test -d '$PROD_ROOT' && command -v wp >/dev/null && command -v curl >/dev/null && command -v sha256sum >/dev/null"
          test "$(ssh nvx-sg "tr -d '\\r\\n' < '$STAGING_ROOT/wp-content/themes/nuvanx-medical/.nvx-deploy-sha'")" = "$EXPECTED_STAGING_SHA"
          test "$(ssh nvx-sg "tr -d '\\r\\n' < '$PROD_ROOT/wp-content/themes/nuvanx-medical/.nvx-deploy-sha'")" = "$EXPECTED_PROD_SHA"
          test "$(ssh nvx-sg "cd '$STAGING_ROOT' && wp config get DB_NAME")" = 'dbshcocboodiwr'
          test "$(ssh nvx-sg "cd '$PROD_ROOT' && wp config get DB_NAME")" = 'db0ecrycwv2tgb'
          echo 'MEDIA_RECOVERY_ENVIRONMENT_GUARD=PASS'

      - name: Copy exact missing production binaries with rollback
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/nvx-media-recovery-manifest.txt"
          copied="$RUNNER_TEMP/nvx-media-recovery-copied.txt"
          : > "$copied"
          cat > "$manifest" <<'EOF'
          2025/04/cropped-nuvanx-icono-sitio.webp
          2025/04/cropped-nuvanx-icono-sitio-300x300.webp
          2025/04/cropped-nuvanx-icono-sitio-150x150.webp
          2025/04/cropped-nuvanx-icono-sitio-400x250.webp
          2025/04/cropped-nuvanx-icono-sitio-400x284.webp
          2025/04/cropped-nuvanx-icono-sitio-510x382.webp
          2025/04/cropped-nuvanx-icono-sitio-400x512.webp
          2025/04/cropped-nuvanx-icono-sitio-480x480.webp
          2025/04/cropped-nuvanx-icono-sitio-270x270.webp
          2025/04/cropped-nuvanx-icono-sitio-192x192.webp
          2025/04/cropped-nuvanx-icono-sitio-180x180.webp
          2025/04/cropped-nuvanx-icono-sitio-32x32.webp
          2026/06/nvx-co2-evaluacion-620.webp
          2026/06/nvx-co2-evaluacion-620-300x201.webp
          2026/06/nvx-co2-evaluacion-620-150x150.webp
          EOF
          sed -i 's/^[[:space:]]*//' "$manifest"

          rollback() {
            set +e
            if test -s "$copied"; then
              while IFS= read -r rel; do
                test -n "$rel" || continue
                ssh nvx-sg "rm -f '$STAGING_ROOT/wp-content/uploads/$rel'" || true
              done < "$copied"
            fi
            echo 'MEDIA_RECOVERY_ROLLBACK=PASS'
          }
          trap rollback ERR

          count=0
          while IFS= read -r rel; do
            test -n "$rel" || continue
            src="$PROD_ROOT/wp-content/uploads/$rel"
            dst="$STAGING_ROOT/wp-content/uploads/$rel"
            ssh nvx-sg "test -s '$src'"
            ssh nvx-sg "test ! -e '$dst'"
            ssh nvx-sg "mkdir -p '$(dirname "$dst")' && cp -p '$src' '$dst' && test -s '$dst'"
            src_sha="$(ssh nvx-sg "sha256sum '$src' | cut -d' ' -f1")"
            dst_sha="$(ssh nvx-sg "sha256sum '$dst' | cut -d' ' -f1")"
            test "$src_sha" = "$dst_sha"
            printf '%s\n' "$rel" >> "$copied"
            count=$((count + 1))
            echo "MEDIA_COPY_PASS rel=$rel sha256=$dst_sha"
          done < "$manifest"
          test "$count" = '15'
          trap - ERR
          echo 'MEDIA_RECOVERY_COPY=PASS files=15'

      - name: Purge staging caches
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-sg "cd '$STAGING_ROOT' && wp cache flush >/dev/null"
          ssh nvx-sg "cd '$STAGING_ROOT' && if wp help sg >/dev/null 2>&1; then wp sg purge >/dev/null 2>&1 || true; fi"
          ssh nvx-sg "cd '$STAGING_ROOT' && wp eval 'if (function_exists(\"opcache_reset\")) { opcache_reset(); }' >/dev/null || true"
          echo 'STAGING_MEDIA_CACHE_PURGE=PASS'

      - name: Verify recovered binary URLs and rendered page
        shell: bash
        run: |
          set -euo pipefail
          ua='NUVANX-Staging-Media-Recovery/1.0'
          for rel in \
            '2025/04/cropped-nuvanx-icono-sitio.webp' \
            '2025/04/cropped-nuvanx-icono-sitio-32x32.webp' \
            '2025/04/cropped-nuvanx-icono-sitio-180x180.webp' \
            '2025/04/cropped-nuvanx-icono-sitio-192x192.webp' \
            '2025/04/cropped-nuvanx-icono-sitio-270x270.webp' \
            '2026/06/nvx-co2-evaluacion-620.webp' \
            '2026/06/nvx-co2-evaluacion-620-300x201.webp' \
            '2026/06/nvx-co2-evaluacion-620-150x150.webp'; do
            code="$(ssh nvx-sg "curl -sS --max-time 20 -A '$ua' -o /dev/null -w '%{http_code}' '$STAGING_URL/wp-content/uploads/$rel'")"
            test "$code" = '200'
            echo "MEDIA_HTTP_PASS rel=$rel"
          done

          code="$(ssh nvx-sg "curl -sS -L --max-redirs 3 --max-time 30 -A '$ua' -o /tmp/nvx-estetica-audit.html -w '%{http_code}' '$STAGING_URL/estetica-avanzada/'")"
          test "$code" = '200'
          ssh nvx-sg "grep -Fq '$EXPECTED_STAGING_SHA' /tmp/nvx-estetica-audit.html"
          ssh nvx-sg "! grep -Fq '/.well-known/sgcaptcha/' /tmp/nvx-estetica-audit.html"

          refs="$RUNNER_TEMP/nvx-estetica-image-refs.txt"
          ssh nvx-sg "grep -Eo 'https://staging2\\.nuvanx\\.com/wp-content/uploads/[^\" <>]+\\.(webp|jpe?g|png)' /tmp/nvx-estetica-audit.html | sort -u" > "$refs" || true
          test -s "$refs"
          total=0
          failures=0
          while IFS= read -r url; do
            test -n "$url" || continue
            total=$((total + 1))
            code="$(ssh nvx-sg "curl -sS --max-time 20 -A '$ua' -o /dev/null -w '%{http_code}' '$url'" || true)"
            if test "$code" != '200'; then
              failures=$((failures + 1))
              echo "RUNTIME_IMAGE_FAIL code=$code url=$url"
            fi
          done < "$refs"
          ssh nvx-sg "rm -f /tmp/nvx-estetica-audit.html"
          echo "RUNTIME_IMAGE_TOTAL=$total"
          echo "RUNTIME_IMAGE_FAIL=$failures"
          test "$failures" = '0'
          echo 'STAGING_MEDIA_RUNTIME=PASS'

      - name: Destroy SSH identity
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/key" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"
