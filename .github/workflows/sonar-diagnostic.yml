name: Sonar Diagnostics

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to query when pull_request is empty'
        required: true
        default: 'master'
      pull_request:
        description: 'Optional pull request number to query instead of branch'
        required: false
        default: ''
      project_key:
        description: 'Sonar project key'
        required: true
        default: 'Arisofia_nuvanx-siteground'

concurrency:
  group: sonar-diagnostic-${{ github.ref }}-${{ inputs.project_key }}-${{ inputs.branch }}-${{ inputs.pull_request }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: ${{ inputs.branch }}
      PULL_REQUEST: ${{ inputs.pull_request }}
      PROJECT_KEY: ${{ inputs.project_key }}
    steps:
      - name: Query SonarCloud quality gate and metrics
        shell: bash
        run: |
          set -euo pipefail
          base='https://sonarcloud.io/api'
          scope=()
          if [[ -n "$PULL_REQUEST" ]]; then
            [[ "$PULL_REQUEST" =~ ^[0-9]+$ ]]
            scope=(--data-urlencode "pullRequest=$PULL_REQUEST")
          else
            [[ -n "$TARGET_BRANCH" ]]
            scope=(--data-urlencode "branch=$TARGET_BRANCH")
          fi

          curl -fsS --retry 3 --max-time 30 --get \
            --data-urlencode "projectKey=$PROJECT_KEY" \
            "${scope[@]}" \
            "$base/qualitygates/project_status" -o /tmp/gate.json
          echo '=== QUALITY GATE ==='
          python -m json.tool /tmp/gate.json

          curl -fsS --retry 3 --max-time 30 --get \
            --data-urlencode "component=$PROJECT_KEY" \
            --data-urlencode 'metricKeys=new_duplicated_lines_density,new_duplicated_lines,new_lines,new_security_rating,new_reliability_rating,new_maintainability_rating' \
            "${scope[@]}" \
            "$base/measures/component" -o /tmp/measures.json
          echo '=== NEW CODE METRICS ==='
          python -m json.tool /tmp/measures.json

      - name: Query unresolved security and reliability issues
        shell: bash
        run: |
          set -euo pipefail
          base='https://sonarcloud.io/api'
          scope=()
          if [[ -n "$PULL_REQUEST" ]]; then
            scope=(--data-urlencode "pullRequest=$PULL_REQUEST")
          else
            scope=(--data-urlencode "branch=$TARGET_BRANCH")
          fi

          for quality in SECURITY RELIABILITY; do
            curl -fsS --retry 3 --max-time 30 --get \
              --data-urlencode "componentKeys=$PROJECT_KEY" \
              --data-urlencode 'resolved=false' \
              --data-urlencode "impactSoftwareQualities=$quality" \
              --data-urlencode 'ps=500' \
              "${scope[@]}" \
              "$base/issues/search" -o "/tmp/${quality}.json"
            QUALITY="$quality" python - <<'PY'
          import json, os
          quality = os.environ['QUALITY']
          data = json.load(open(f'/tmp/{quality}.json', encoding='utf-8'))
          issues = data.get('issues', [])
          print(f'=== {quality} ISSUES: {len(issues)} ===')
          for issue in issues:
              print({
                  'rule': issue.get('rule'),
                  'component': issue.get('component'),
                  'line': issue.get('line'),
                  'message': issue.get('message'),
                  'creationDate': issue.get('creationDate'),
              })
          PY
          done

      - name: Query duplication contributors
        shell: bash
        run: |
          set -euo pipefail
          base='https://sonarcloud.io/api'
          scope=()
          if [[ -n "$PULL_REQUEST" ]]; then
            scope=(--data-urlencode "pullRequest=$PULL_REQUEST")
          else
            scope=(--data-urlencode "branch=$TARGET_BRANCH")
          fi

          curl -fsS --retry 3 --max-time 30 --get \
            --data-urlencode "component=$PROJECT_KEY" \
            --data-urlencode 'metricKeys=new_duplicated_lines_density,new_duplicated_lines,new_lines' \
            --data-urlencode 'strategy=leaves' \
            --data-urlencode 'ps=500' \
            "${scope[@]}" \
            "$base/measures/component_tree" -o /tmp/tree.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/tree.json', encoding='utf-8'))
          rows = []
          for component in data.get('components', []):
              values = {}
              for measure in component.get('measures', []):
                  periods = measure.get('periods') or []
                  period = periods[0] if periods else measure.get('period') or {}
                  values[measure['metric']] = float(period.get('value', measure.get('value', 0)) or 0)
              duplicated = values.get('new_duplicated_lines', 0)
              density = values.get('new_duplicated_lines_density', 0)
              lines = values.get('new_lines', 0)
              if duplicated or density:
                  rows.append((duplicated, density, lines, component.get('path', '')))
          print('=== DUPLICATION CONTRIBUTORS ===')
          for duplicated, density, lines, path in sorted(rows, reverse=True):
              print({'path': path, 'new_lines': lines, 'new_duplicated_lines': duplicated, 'density': density})
          PY
