name: Staging2 Master Sync

on:
  push:
    branches:
      - master
    paths:
      - 'wp-content/themes/nuvanx-medical/**'
      - 'scripts/staging2/**'
      - 'scripts/validate-page-templates.mjs'
      - 'tools/deploy/**'
      - 'tools/wp-cli/hygiene-content-fix.php'
      - '.github/workflows/deploy-staging2.yml'
      - '.github/workflows/staging2-acceptance.yml'
      - '.github/workflows/staging2-sync.yml'

permissions:
  contents: read

concurrency:
  # Shared with staging2-pr-preview.yml so no two workflows mutate Staging2 concurrently.
  group: staging2-pr-preview
  cancel-in-progress: false

jobs:
  normalize_staging:
    name: Normalize Staging2 runtime before sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WP_ROOT: /home/customer/www/staging2.nuvanx.com/public_html
    steps:
      - name: Configure strict Staging2 SSH
        shell: bash
        env:
          HOST: ${{ secrets.STAGING2_SSH_HOST }}
          PORT: ${{ secrets.STAGING2_SSH_PORT }}
          USER: ${{ secrets.STAGING2_SSH_USER }}
          KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${HOST:?Missing STAGING2_SSH_HOST}"
          : "${USER:?Missing STAGING2_SSH_USER}"
          : "${KEY:?Missing STAGING2_SSH_PRIVATE_KEY}"
          : "${KH:?Missing STAGING2_SSH_KNOWN_HOSTS}"
          SSH_PORT="${PORT:-18765}"
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/staging2_sync_key"
          chmod 600 "$HOME/.ssh/staging2_sync_key"
          printf '%s\n' "$KH" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx-staging2-sync
            HostName $HOST
            User $USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/staging2_sync_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 30
            ConnectionAttempts 1
            ServerAliveInterval 15
            ServerAliveCountMax 3
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Restore required inactive Speed Optimizer state
        shell: bash
        run: |
          set -euo pipefail

          normalize_remote() {
            ssh nvx-staging2-sync "WP_ROOT='$WP_ROOT' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$WP_ROOT"
          test "$(wp config get DB_NAME)" = 'dbshcocboodiwr'
          test "$(wp option get home)" = 'https://staging2.nuvanx.com'
          test "$(wp option get siteurl)" = 'https://staging2.nuvanx.com'
          test "$(wp option get blog_public)" = '0'
          test "$(wp config get NVX_ENV)" = 'staging'
          test "$(wp config get WP_ENVIRONMENT_TYPE)" = 'staging'
          wp plugin is-installed sg-cachepress
          if wp plugin is-active sg-cachepress; then
            wp plugin deactivate sg-cachepress --quiet
            echo 'STAGING_SPEED_OPTIMIZER_NORMALIZED=deactivated'
          else
            echo 'STAGING_SPEED_OPTIMIZER_NORMALIZED=already-inactive'
          fi
          for attempt in {1..5}; do
            if ! wp plugin is-active sg-cachepress; then
              echo 'STAGING_SPEED_OPTIMIZER_STATE=PASS inactive'
              exit 0
            fi
            wp cache flush >/dev/null 2>&1 || true
            sleep 1
          done
          echo 'Speed Optimizer could not be restored to inactive state.' >&2
          exit 1
          REMOTE
          }

          for attempt in 1 2 3 4 5; do
            if normalize_remote; then
              echo "STAGING_NORMALIZE_SSH=PASS attempt=$attempt"
              exit 0
            else
              rc=$?
            fi

            if [[ "$rc" -ne 255 ]]; then
              echo "STAGING_NORMALIZE=FAIL_REMOTE rc=$rc; refusing to retry a non-transport failure." >&2
              exit "$rc"
            fi

            if [[ "$attempt" -lt 5 ]]; then
              delay=$(( attempt * 15 ))
              echo "STAGING_NORMALIZE_SSH=RETRY attempt=$attempt/5 rc=255 delay=${delay}s" >&2
              sleep "$delay"
            fi
          done

          echo 'STAGING_NORMALIZE_SSH=FAIL_TRANSPORT after 5 attempts.' >&2
          exit 255

      - name: Destroy SSH identity
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/staging2_sync_key" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"

  deploy:
    name: Sync exact master SHA to Staging2
    needs: normalize_staging
    uses: ./.github/workflows/deploy-staging2.yml
    with:
      sha: ${{ github.sha }}
      run_block_c_acceptance: false
    secrets: inherit

  block_c_acceptance:
    name: Run Block C after successful Staging2 sync
    needs: deploy
    uses: ./.github/workflows/staging2-acceptance.yml
    with:
      sha: ${{ github.sha }}
    secrets: inherit
