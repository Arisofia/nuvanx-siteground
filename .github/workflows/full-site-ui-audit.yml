name: Full Site UI Audit

on:
  pull_request:
    types: [labeled, synchronize, reopened]
    paths:
      - '.github/workflows/deploy-staging2.yml'
      - 'tools/deploy/deploy-to-staging2.sh'
      - 'tools/deploy/nvx-purge-wp-caches.sh'
      - 'scripts/staging2/collect-staging2-diagnostics.sh'
      - 'scripts/staging2/smoke-verify-staging2.sh'
      - 'scripts/staging2/verify-rendered-acceptance-ssh.mjs'
      - 'scripts/staging2/capture-visual-qa.mjs'
      - 'scripts/staging2/visual-qa-edge-preload.mjs'
      - 'scripts/staging2/visual-qa-common.mjs'
      - 'scripts/staging2/test-deploy-workflow-contract.mjs'
      - 'scripts/staging2/test-github-managed-pages.mjs'
      - '.github/workflows/full-site-ui-audit.yml'
      - 'scripts/staging2/audit-full-site-ui.mjs'
      - 'scripts/wp/nvx-production-readiness-command.php'
      - 'scripts/wp/nvx-canonical-route-migration.php'
      - 'wp-content/themes/nuvanx-medical/**'
      - 'docs/navigation/PRIMARY-MENU-ARCHITECTURE.md'
      - 'docs/content-strategy-2026/NUVANX-CONTOUR-ROADMAP-STATUS.md'
      - 'docs/operations/deployment.md'
      - 'docs/operations/staging2-phase3-rendered-acceptance.md'

permissions:
  contents: read

concurrency:
  group: full-site-ui-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  EVIDENCE_DIR: staging2-full-site-ui-audit

jobs:
  audit:
    name: Audit exact deployed PR SHA
    # labeled: only when the new label is deploy-staging2.
    # synchronize/reopened: only while that label remains on the PR.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'deploy-staging2') &&
      (github.event.action != 'labeled' || github.event.label.name == 'deploy-staging2')
    runs-on: ubuntu-latest
    # Deploys are globally serialized and each deploy job can run for 35 minutes.
    # Allow one previous deploy + the current deploy, then retain time for the audit.
    timeout-minutes: 120
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_URL: https://staging2.nuvanx.com
    steps:
      - name: Check out immutable PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Validate audit sources and REST pagination contract
        run: |
          set -euo pipefail
          node --check scripts/staging2/audit-full-site-ui.mjs
          node --check scripts/staging2/visual-qa-common.mjs
          node --check scripts/staging2/visual-qa-edge-preload.mjs
          node --check scripts/staging2/test-deploy-workflow-contract.mjs
          node --check scripts/theme-hygiene/test-rest-pagination-contract.mjs
          node scripts/theme-hygiene/test-rest-pagination-contract.mjs
          php -l scripts/wp/nvx-canonical-route-migration.php
          php -l wp-content/themes/nuvanx-medical/inc/nvx-integrations.php
          php -l wp-content/themes/nuvanx-medical/inc/nvx-page-hygiene.php
          php -l wp-content/themes/nuvanx-medical/inc/nvx-full-site-ui-governance.php
          bash -n tools/deploy/deploy-to-staging2.sh
          bash -n tools/deploy/nvx-purge-wp-caches.sh
          bash -n scripts/staging2/smoke-verify-staging2.sh

      - name: Configure strict SiteGround SSH
        env:
          STAGING2_SSH_HOST: ${{ secrets.STAGING2_SSH_HOST }}
          STAGING2_SSH_PORT: ${{ secrets.STAGING2_SSH_PORT }}
          STAGING2_SSH_USER: ${{ secrets.STAGING2_SSH_USER }}
          STAGING2_SSH_PRIVATE_KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          STAGING2_SSH_KNOWN_HOSTS: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${STAGING2_SSH_HOST:?Missing STAGING2_SSH_HOST secret}"
          : "${STAGING2_SSH_USER:?Missing STAGING2_SSH_USER secret}"
          : "${STAGING2_SSH_PRIVATE_KEY:?Missing STAGING2_SSH_PRIVATE_KEY secret}"
          : "${STAGING2_SSH_KNOWN_HOSTS:?Missing STAGING2_SSH_KNOWN_HOSTS secret}"
          SSH_PORT="${STAGING2_SSH_PORT:-18765}"
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$STAGING2_SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$STAGING2_SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          mkdir -p "$HOME/.ssh" "$EVIDENCE_DIR"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$STAGING2_SSH_PRIVATE_KEY" > "$HOME/.ssh/staging2_key"
          printf '%s\n' "$STAGING2_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/staging2_key" "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx-staging2
            HostName $STAGING2_SSH_HOST
            User $STAGING2_SSH_USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/staging2_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 2
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Wait for exact SiteGround deployment
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          WP_ROOT='/home/customer/www/staging2.nuvanx.com/public_html'
          last_seen='absent'
          ssh_error_log="$EVIDENCE_DIR/siteground-ssh-errors.log"
          consecutive_ssh_failures=0
          max_consecutive_ssh_failures=12
          # 540 × 10 seconds = 90 minutes. This covers one queued 35-minute
          # deployment plus the current 35-minute deployment with margin.
          for attempt in $(seq 1 540); do
            if deployed_sha="$(ssh nvx-staging2 "test -r '$WP_ROOT/wp-content/themes/nuvanx-medical/.nvx-deploy-sha' && tr -d '\r\n' < '$WP_ROOT/wp-content/themes/nuvanx-medical/.nvx-deploy-sha' || true" 2>>"$ssh_error_log")"; then
              consecutive_ssh_failures=0
              last_seen="${deployed_sha:-absent}"
            else
              deployed_sha=''
              last_seen='ssh-error'
              consecutive_ssh_failures=$((consecutive_ssh_failures + 1))
              printf 'Transient SSH failure while reading deployment marker; attempt=%s consecutive=%s/%s\n' \
                "$attempt" "$consecutive_ssh_failures" "$max_consecutive_ssh_failures" >&2
              if (( consecutive_ssh_failures >= max_consecutive_ssh_failures )); then
                {
                  echo "expected_sha=$EXPECTED_SHA"
                  echo "last_seen_sha=$last_seen"
                  echo "error=ssh_transport_unavailable"
                  echo "consecutive_ssh_failures=$consecutive_ssh_failures"
                  echo "hint=Review siteground-ssh-errors.log and restore SSH connectivity before retrying the audit."
                } | tee "$EVIDENCE_DIR/siteground-sha.log"
                exit 1
              fi
            fi
            if [[ "$deployed_sha" == "$EXPECTED_SHA" ]]; then
              printf 'SITEGROUND_SHA_READY %s\n' "$deployed_sha" | tee "$EVIDENCE_DIR/siteground-sha.log"
              exit 0
            fi
            printf 'Waiting for SiteGround SHA %s; current=%s attempt=%s\n' "$EXPECTED_SHA" "$last_seen" "$attempt"
            sleep 10
          done
          {
            echo "expected_sha=$EXPECTED_SHA"
            echo "last_seen_sha=$last_seen"
            echo "error=timeout_waiting_for_deploy"
            echo "hint=Deploy to Staging2 must publish this PR HEAD. On labeled PRs the deploy job runs for labeled/synchronize/reopened while deploy-staging2 remains applied."
          } | tee "$EVIDENCE_DIR/siteground-sha.log"
          echo "Timed out waiting for PR SHA $EXPECTED_SHA on staging2 (still at $last_seen)." >&2
          echo 'Ensure workflow Deploy to Staging2 ran DEPLOY_AND_MIGRATE for this HEAD with label deploy-staging2.' >&2
          exit 1

      - name: Audit every public WordPress route
        env:
          STAGING2_SSH_ALIAS: nvx-staging2
          NODE_OPTIONS: --import=${{ github.workspace }}/scripts/staging2/visual-qa-edge-preload.mjs
        run: |
          set -euo pipefail
          node scripts/staging2/audit-full-site-ui.mjs 2>&1 | tee "$EVIDENCE_DIR/audit.log"
          grep -Fq 'FULL_SITE_UI_AUDIT_OK' "$EVIDENCE_DIR/audit.log"

      - name: Upload full-site UI evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: staging2-full-site-ui-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: staging2-full-site-ui-audit/
          retention-days: 30
          if-no-files-found: warn
