name: Temporary Staging2 full theme repair

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: staging2-theme-repair
  cancel-in-progress: false

env:
  STAGING_ROOT: /home/customer/www/staging2.nuvanx.com/public_html

jobs:
  repair:
    if: github.head_ref == 'ops/run-staging2-theme-repair' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Configure SiteGround SSH
        env:
          SSH_HOST: ${{ secrets.STAGING2_SSH_HOST }}
          SSH_PORT_SECRET: ${{ secrets.STAGING2_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING2_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing STAGING2_SSH_HOST}"
          : "${SSH_USER:?Missing STAGING2_SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Missing STAGING2_SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing STAGING2_SSH_KNOWN_HOSTS}"
          SSH_PORT="${SSH_PORT_SECRET:-18765}"
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/siteground_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/siteground_key" "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host siteground-staging
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/siteground_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 15
          EOF
          chmod 600 "$HOME/.ssh/config"
      - name: Prepare canonical theme payload and manifest
        run: |
          set -euo pipefail
          mkdir -p evidence
          test -f tools/deploy/deploy-to-staging2.sh
          test -f wp-content/themes/nuvanx-medical/inc/nvx-document-governance.php
          test -f wp-content/themes/nuvanx-medical/assets/css/nvx-base.css
          tar -czf theme-canonical.tgz -C wp-content/themes/nuvanx-medical .
          cp tools/deploy/deploy-to-staging2.sh evidence/deploy-to-staging2.sh
          (cd wp-content/themes/nuvanx-medical && find . -type f -print0 | sort -z | xargs -0 sha256sum) > evidence/theme-manifest.sha256
          echo "SOURCE_SHA=${{ github.event.pull_request.base.sha }}" | tee evidence/source.txt
      - name: Upload and run canonical full-theme deployment
        env:
          SOURCE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          REMOTE_RELEASE="$STAGING_ROOT/wp-content/.nuvanx-deployments/theme-repair-$GITHUB_RUN_ID"
          echo "REMOTE_RELEASE=$REMOTE_RELEASE" >> "$GITHUB_ENV"
          ssh siteground-staging "mkdir -p '$REMOTE_RELEASE/theme' && chmod 700 '$REMOTE_RELEASE' '$REMOTE_RELEASE/theme'"
          scp theme-canonical.tgz evidence/deploy-to-staging2.sh siteground-staging:"$REMOTE_RELEASE/"
          ssh siteground-staging "cd '$REMOTE_RELEASE/theme' && tar -xzf ../theme-canonical.tgz"
          ssh siteground-staging "NUVANX_CONFIRM=yes bash '$REMOTE_RELEASE/deploy-to-staging2.sh' --wp-root '$STAGING_ROOT' --source-theme '$REMOTE_RELEASE/theme' --sha '$SOURCE_SHA' --confirm" | tee evidence/deploy.log
          grep -Fq 'DEPLOY_STAGING2_OK' evidence/deploy.log
      - name: Verify complete theme parity and rendered CSS
        run: |
          set -euo pipefail
          scp siteground-staging:"$STAGING_ROOT/wp-content/.nuvanx-deployments/theme-repair-$GITHUB_RUN_ID/theme/.nvx-deploy-sha" evidence/remote-deploy-sha.txt
          ssh siteground-staging "cd '$STAGING_ROOT/wp-content/themes/nuvanx-medical' && find . -type f -print0 | sort -z | xargs -0 sha256sum" > evidence/remote-theme-manifest.sha256
          diff -u evidence/theme-manifest.sha256 evidence/remote-theme-manifest.sha256
          ssh siteground-staging "cd '$STAGING_ROOT' && test -f wp-content/themes/nuvanx-medical/inc/nvx-document-governance.php && test -f wp-content/themes/nuvanx-medical/header.php && test \"\$(wp theme list --status=active --field=name)\" = 'nuvanx-medical' && wp db check --quiet && wp plugin is-active sg-cachepress"
          ssh siteground-staging "curl -ksS --resolve staging2.nuvanx.com:443:127.0.0.1 https://staging2.nuvanx.com/ -o /tmp/nvx-repaired-home.html && python3 - <<'PY'
          import re
          s=open('/tmp/nvx-repaired-home.html',encoding='utf8',errors='replace').read()
          styles=[x for x in re.findall(r'<link\\b[^>]*>',s,re.I) if re.search(r'rel=[\"\\\'][^\"\\\']*stylesheet',x,re.I)]
          print('REPAIRED_HTML_BYTES='+str(len(s)))
          print('REPAIRED_STYLESHEET_TAGS='+str(len(styles)))
          print('REPAIRED_NVX_BASE='+str('nvx-base.css' in s))
          for x in styles: print(x)
          if len(styles) < 5 or 'nvx-base.css' not in s: raise SystemExit('canonical CSS links still missing after full-theme deployment')
          PY"
          ssh siteground-staging "rm -rf /tmp/nvx-repaired-site-root && mkdir -p /tmp/nvx-repaired-site-root/wp-content/themes/nuvanx-medical/assets && cp /tmp/nvx-repaired-home.html /tmp/nvx-repaired-site-root/index.html && cp -a '$STAGING_ROOT/wp-content/themes/nuvanx-medical/assets/css' /tmp/nvx-repaired-site-root/wp-content/themes/nuvanx-medical/assets/ && tar -czf /tmp/nvx-repaired-origin.tgz -C /tmp/nvx-repaired-site-root ."
          scp siteground-staging:/tmp/nvx-repaired-origin.tgz evidence/repaired-origin.tgz
          printf '%s\n' 'THEME_PARITY_OK' 'RENDERED_CSS_LINKS_OK' > evidence/final-status.txt
      - name: Verify desktop and mobile computed styles from repaired origin
        run: |
          set -euo pipefail
          npm install --no-save playwright-core@1.55.0
          test -x /usr/bin/chromium
          mkdir -p evidence/site-root
          tar -xzf evidence/repaired-origin.tgz -C evidence/site-root
          python3 -m http.server 8765 --directory evidence/site-root >/tmp/nvx-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node <<'NODE'
          const { chromium } = require('playwright-core');
          (async()=>{
            const b=await chromium.launch({headless:true,executablePath:'/usr/bin/chromium',args:['--no-sandbox']});
            for (const [name,viewport] of [['desktop',{width:1440,height:1000}],['mobile',{width:390,height:844}]]) {
              const p=await b.newPage({viewport});
              const r=await p.goto('http://127.0.0.1:8765/',{waitUntil:'networkidle',timeout:60000});
              const x=await p.evaluate(()=>{const s=getComputedStyle(document.body),h=document.querySelector('h1');return {margin:s.margin,font:s.fontFamily,display:s.display,h1Font:h?getComputedStyle(h).fontFamily:null,h1Size:h?getComputedStyle(h).fontSize:null,css:[...document.querySelectorAll('link[rel~="stylesheet"]')].map(l=>({href:l.href,sheet:!!l.sheet,rules:l.sheet?(()=>{try{return l.sheet.cssRules.length}catch(e){return -1}})():0}))}});
              console.log(name,JSON.stringify({http:r?.status(),computed:x},null,2));
              await p.screenshot({path:`evidence/repaired-${name}.png`,fullPage:true});
              if(!r||r.status()!==200) throw new Error(name+' origin snapshot failed');
              if(x.margin==='8px') throw new Error(name+' browser default body margin detected');
              if(x.font==='Times New Roman'||x.font==='serif') throw new Error(name+' browser default typography detected');
              if(x.css.some(c=>!c.sheet||c.rules===0)) throw new Error(name+' stylesheet not parsed');
            }
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Remove isolated repair payload
        if: always()
        run: |
          set -euo pipefail
          if [[ -n "${REMOTE_RELEASE:-}" ]]; then ssh siteground-staging "rm -rf '$REMOTE_RELEASE'"; fi
      - name: Upload repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging2-theme-repair-${{ github.run_id }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
