name: Runtime Candidate Repair One-Shot

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ops/staging-rescue-606-20260818'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_BRANCH: fix/attribution-runtime-v2-rebased-20260818
      EXPECTED_HEAD: c89021de0640003a5a0616ab98d58ed9ac60dd19
      PR596_MERGE: 93fd9f7c28319984233506ea25bfdd09ac2002ed
      DIRECT_FORM: wp-content/themes/nuvanx-medical/inc/nvx-valoracion-direct-form.php
    steps:
      - name: Check out exact runtime candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/attribution-runtime-v2-rebased-20260818
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: true

      - name: Reconcile canonical success contract from PR 596
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          canonical="$RUNNER_TEMP/pr596-direct-form.php"
          git show "${PR596_MERGE}:${DIRECT_FORM}" > "$canonical"
          test -s "$canonical"

          python3 - "$DIRECT_FORM" "$canonical" <<'PY'
          import sys
          from pathlib import Path

          target_path = Path(sys.argv[1])
          canonical_path = Path(sys.argv[2])
          current = target_path.read_text()
          canonical = canonical_path.read_text()

          start_marker = "\t$result = nvx_valoracion_forward_to_hubspot( $fields, $context );"
          end_marker = "\n\tnvx_valoracion_log_outcome( 'FAILURE', $result['reason'], $result['status'] );"
          tail_marker = "/**\n * Validate and consume a single-use canonical success token before rendering."

          if current.count(start_marker) != 1 or canonical.count(start_marker) != 1:
              raise SystemExit('SUCCESS_REPAIR_REFUSED ambiguous submit marker')
          if current.count(end_marker) != 1 or canonical.count(end_marker) != 1:
              raise SystemExit('SUCCESS_REPAIR_REFUSED ambiguous failure marker')

          cs = current.index(start_marker)
          ce = current.index(end_marker, cs)
          ks = canonical.index(start_marker)
          ke = canonical.index(end_marker, ks)
          canonical_success = canonical[ks:ke]
          if "add_query_arg( 'nvx_success', $token" not in canonical_success:
              raise SystemExit('SUCCESS_REPAIR_REFUSED canonical token block missing')
          current = current[:cs] + canonical_success + current[ce:]

          if tail_marker not in canonical:
              raise SystemExit('SUCCESS_REPAIR_REFUSED canonical success functions missing')
          canonical_tail = canonical[canonical.index(tail_marker):].rstrip() + "\n"
          if 'function nvx_valoracion_prepare_canonical_success()' not in current:
              current = current.rstrip() + "\n\n" + canonical_tail

          target_path.write_text(current)
          PY

          changed="$(git diff --name-only)"
          test "$changed" = "$DIRECT_FORM"
          php -l "$DIRECT_FORM" >/dev/null
          grep -F "add_query_arg( 'nvx_success', \$token, home_url( '/gracias/' ) )" "$DIRECT_FORM" >/dev/null
          grep -F 'function nvx_valoracion_prepare_canonical_success()' "$DIRECT_FORM" >/dev/null
          grep -F "event:'nvx_valoracion_success'" "$DIRECT_FORM" >/dev/null
          git diff --check

          git config user.name 'NUVANX CI'
          git config user.email 'ci@nuvanx.invalid'
          git add "$DIRECT_FORM"
          git commit -m 'fix(valoracion): restore canonical first-party success token'
          git push origin "HEAD:${TARGET_BRANCH}"
          echo 'CANONICAL_SUCCESS_REPAIR=PASS source=pr596 semantic_hunks=2 exact_file_scope=1 token=single_use nocache=1 signal=first_party'
