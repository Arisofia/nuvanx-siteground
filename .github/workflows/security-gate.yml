name: "security-gate"

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - master
      - main

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Run Gitleaks"
        uses: zricethezav/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml
          fail: "true"
