name: Runtime Candidate Repair One-Shot

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ops/staging-rescue-606-20260818'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_BRANCH: fix/attribution-runtime-v2-rebased-20260818
      EXPECTED_HEAD: c89021de0640003a5a0616ab98d58ed9ac60dd19
      PR596_MERGE: 93fd9f7c28319984233506ea25bfdd09ac2002ed
      DIRECT_FORM: wp-content/themes/nuvanx-medical/inc/nvx-valoracion-direct-form.php
    steps:
      - name: Check out exact runtime candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/attribution-runtime-v2-rebased-20260818
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: true

      - name: Restore exact canonical success patch from PR 596
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git cat-file -e "${PR596_MERGE}^{commit}"
          pr596_base="$(git rev-parse "${PR596_MERGE}^1")"
          patch="$RUNNER_TEMP/pr596-direct-form.patch"
          git diff "$pr596_base" "$PR596_MERGE" -- "$DIRECT_FORM" > "$patch"
          test -s "$patch"
          grep -F 'nvx_success' "$patch" >/dev/null
          git apply --3way "$patch"

          changed="$(git diff --name-only)"
          test "$changed" = "$DIRECT_FORM"
          php -l "$DIRECT_FORM" >/dev/null
          grep -F "add_query_arg( 'nvx_success', \$token, home_url( '/gracias/' ) )" "$DIRECT_FORM" >/dev/null
          grep -F 'function nvx_valoracion_prepare_canonical_success()' "$DIRECT_FORM" >/dev/null
          grep -F "event:'nvx_valoracion_success'" "$DIRECT_FORM" >/dev/null
          git diff --check

          git config user.name 'NUVANX CI'
          git config user.email 'ci@nuvanx.invalid'
          git add "$DIRECT_FORM"
          git commit -m 'fix(valoracion): restore canonical first-party success token'
          git push origin "HEAD:${TARGET_BRANCH}"
          echo 'CANONICAL_SUCCESS_REPAIR=PASS source=pr596 exact_file_scope=1 token=single_use nocache=1 signal=first_party'
