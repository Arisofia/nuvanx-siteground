name: Production d54 Targeted Postcutover Repair V2 Once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/production-d54-targeted-postcutover-repair-v2-once.yml

permissions:
  contents: read

concurrency:
  group: production-d54-targeted-postcutover-repair-v2
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROD_ROOT: /home/customer/www/nuvanx.com/public_html
      BASE_URL: https://nuvanx.com
      EXPECTED_SHA: d54dfa7df226dbd5b823fca1878ce8a60a3548cb
    steps:
      - name: Configure strict production SSH and guard d54
        shell: bash
        env:
          HOST: ${{ secrets.PROD_SSH_HOST }}
          PORT: ${{ secrets.PROD_SSH_PORT }}
          USER: ${{ secrets.PROD_SSH_USER }}
          KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${HOST:?Missing PROD_SSH_HOST}"; : "${USER:?Missing PROD_SSH_USER}"; : "${KEY:?Missing PROD_SSH_PRIVATE_KEY}"; : "${KH:?Missing PROD_SSH_KNOWN_HOSTS}"
          SSH_PORT="${PORT:-18765}"
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KH" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx-prod-repair-v2
            HostName $HOST
            User $USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 20
            ServerAliveInterval 30
            ServerAliveCountMax 2
          EOF
          chmod 600 "$HOME/.ssh/config"
          ssh -n nvx-prod-repair-v2 "test -d '$PROD_ROOT' && command -v wp >/dev/null && command -v php >/dev/null && command -v curl >/dev/null"
          test "$(ssh -n nvx-prod-repair-v2 "tr -d '\\r\\n' < '$PROD_ROOT/wp-content/themes/nuvanx-medical/.nvx-deploy-sha'")" = "$EXPECTED_SHA"
          test "$(ssh -n nvx-prod-repair-v2 "cd '$PROD_ROOT' && wp config get DB_NAME")" = 'db0ecrycwv2tgb'
          test "$(ssh -n nvx-prod-repair-v2 "cd '$PROD_ROOT' && wp option get home")" = 'https://nuvanx.com'
          test "$(ssh -n nvx-prod-repair-v2 "cd '$PROD_ROOT' && wp option get siteurl")" = 'https://nuvanx.com'
          test "$(ssh -n nvx-prod-repair-v2 "cd '$PROD_ROOT' && wp option get blog_public")" = '1'
          echo 'TARGETED_REPAIR_V2_GUARD=PASS'

      - name: Build corrected transactional repair script
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/nvx-d54-repair-v2.php" <<'PHP'
          <?php
          declare(strict_types=1);
          $root=$argv[1]??'';$sha=$argv[2]??'';$state=$argv[3]??'';
          if(!$root||!$sha||!$state){fwrite(STDERR,"ARGS_FAIL\n");exit(2);} $root=rtrim($root,'/'); require $root.'/wp-load.php'; global $wpdb;
          if(trim((string)@file_get_contents($root.'/wp-content/themes/nuvanx-medical/.nvx-deploy-sha'))!==$sha){fwrite(STDERR,"SHA_FAIL\n");exit(3);}
          if(DB_NAME!=='db0ecrycwv2tgb'||home_url('/')!=='https://nuvanx.com/'){fwrite(STDERR,"ENV_FAIL\n");exit(4);}
          if(!is_dir($state)&&!mkdir($state,0700,true)){exit(5);} @chmod($state,0700);
          $slugs=['remodelacion-corporal-laser-madrid','tratamiento-postparto-abdomen-contorno-corporal-madrid'];$backup=[];$legacy=0;
          foreach($slugs as $slug){$p=get_page_by_path($slug,OBJECT,'page');if(!$p instanceof WP_Post||$p->post_status!=='publish')throw new RuntimeException("PAGE_FAIL:$slug");$c=(string)$p->post_content;$n=substr_count($c,'/valoracion-medica/');if($n!==1)throw new RuntimeException("PAGE_LEGACY_FAIL:$slug:$n");$legacy+=$n;$backup[]=['ID'=>(int)$p->ID,'slug'=>$slug,'post_content'=>$c,'sha256'=>hash('sha256',$c)];}
          $like='%'.$wpdb->esc_like('/valoracion-medica/').'%';$global=(int)$wpdb->get_var($wpdb->prepare("SELECT COUNT(*) FROM {$wpdb->posts} WHERE post_status='publish' AND post_content LIKE %s",$like));if($global!==2||$legacy!==2)throw new RuntimeException("GLOBAL_LEGACY_FAIL:$global:$legacy");
          file_put_contents($state.'/content-backup.json',wp_json_encode($backup,JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES));@chmod($state.'/content-backup.json',0600);
          $u=wp_get_upload_dir();if(!empty($u['error']))throw new RuntimeException('UPLOAD_FAIL');$base=rtrim($u['basedir'],'/');
          $items=[['2026/05/higiene-facial-con-microdermoabrasion.webp','2026/05/higiene-facial-con-microdermoabrasion-480x320.webp',480,320],['2026/05/diatermia-facial.webp','2026/05/diatermia-facial-480x320.webp',480,320],['2026/05/depilacion-laser.webp','2026/05/depilacion-laser-480x320.webp',480,320],['2026/05/hidrolipoclasia.webp','2026/05/hidrolipoclasia-480x320.webp',480,320],['2026/05/masajes-posoperatorios.webp','2026/05/masajes-posoperatorios-480x320.webp',480,320],['2026/05/radiofrecuencia-corporal.webp','2026/05/radiofrecuencia-corporal-480x320.webp',480,320],['2026/05/presoterapia.webp','2026/05/presoterapia-480x320.webp',480,320],['2026/05/tratamiento-anticelulitico.webp','2026/05/tratamiento-anticelulitico-480x320.webp',480,320],['2026/02/casmara.webp','2026/02/casmara-480x194.webp',480,194]];
          $created=[];$changed=false;
          $rollback=function()use(&$created,&$backup,&$changed,$base){foreach($created as $rel){$f=$base.'/'.$rel;if(is_file($f))@unlink($f);}if($changed){foreach($backup as $r){wp_update_post(['ID'=>(int)$r['ID'],'post_content'=>(string)$r['post_content']]);}}wp_cache_flush();echo "TARGETED_REPAIR_V2_ROLLBACK=PASS\n";};
          try{
            $repl=0;foreach($backup as $r){$p=get_post((int)$r['ID']);if(!$p instanceof WP_Post||hash('sha256',(string)$p->post_content)!==$r['sha256'])throw new RuntimeException('CONCURRENT_CONTENT:'.$r['ID']);$updated=str_replace(['https://nuvanx.com/valoracion-medica/','/valoracion-medica/'],['https://nuvanx.com/madrid/valoracion/','/madrid/valoracion/'],(string)$p->post_content,$n);if($n!==1)throw new RuntimeException('REPLACE_FAIL:'.$r['ID'].':'.$n);$x=wp_update_post(['ID'=>(int)$r['ID'],'post_content'=>$updated],true);if(is_wp_error($x))throw new RuntimeException('UPDATE_FAIL:'.$x->get_error_message());$repl+=$n;} $changed=true;if($repl!==2)throw new RuntimeException('REPL_TOTAL:'.$repl);
            foreach($items as [$srcRel,$dstRel,$w,$h]){$src=$base.'/'.$srcRel;$dst=$base.'/'.$dstRel;if(!is_file($src)||filesize($src)<=0)throw new RuntimeException('SOURCE_MISSING:'.$srcRel);if(is_file($dst)){$i=@getimagesize($dst);if(!is_array($i)||(int)$i[0]!==$w||(int)$i[1]!==$h||filesize($dst)<=0)throw new RuntimeException('EXISTING_INVALID:'.$dstRel);echo "DERIVATIVE_ALREADY_VALID rel=$dstRel {$w}x{$h}\n";continue;}$tmp=dirname($dst).'/.nvx-tmp-'.pathinfo($dst,PATHINFO_FILENAME).'-'.getmypid().'.webp';@unlink($tmp);$ed=wp_get_image_editor($src);if(is_wp_error($ed))throw new RuntimeException('EDITOR_FAIL:'.$srcRel.':'.$ed->get_error_message());$z=$ed->resize($w,$h,false);if(is_wp_error($z))throw new RuntimeException('RESIZE_FAIL:'.$srcRel);$saved=$ed->save($tmp,'image/webp');if(is_wp_error($saved)){@unlink($tmp);throw new RuntimeException('SAVE_FAIL:'.$dstRel);} $savedPath=is_array($saved)&&!empty($saved['path'])?(string)$saved['path']:$tmp;$i=@getimagesize($savedPath);if(!is_array($i)||(int)$i[0]!==$w||(int)$i[1]!==$h||filesize($savedPath)<=0){@unlink($savedPath);throw new RuntimeException('TMP_DIM_FAIL:'.$dstRel.':'.(is_array($i)?$i[0].'x'.$i[1]:'unknown'));}if(!@rename($savedPath,$dst)){@unlink($savedPath);throw new RuntimeException('RENAME_FAIL:'.$dstRel);} $created[]=$dstRel;echo "DERIVATIVE_CREATED rel=$dstRel {$w}x{$h} bytes=".filesize($dst)." sha256=".hash_file('sha256',$dst)."\n";}
            $remaining=(int)$wpdb->get_var($wpdb->prepare("SELECT COUNT(*) FROM {$wpdb->posts} WHERE post_status='publish' AND post_content LIKE %s",$like));if($remaining!==0)throw new RuntimeException('LEGACY_REMAINING:'.$remaining);foreach($items as [$s,$d,$w,$h]){$f=$base.'/'.$d;$i=@getimagesize($f);if(!is_array($i)||(int)$i[0]!==$w||(int)$i[1]!==$h||filesize($f)<=0)throw new RuntimeException('FINAL_MEDIA_FAIL:'.$d);}file_put_contents($state.'/created-media.json',wp_json_encode($created,JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES));@chmod($state.'/created-media.json',0600);wp_cache_flush();echo "TARGETED_CONTENT_NORMALIZATION=PASS replacements=2 remaining=0\n";echo "TARGETED_RESPONSIVE_MEDIA=PASS total=9 created=".count($created)." existing=".(9-count($created))."\n";echo "TARGETED_REPAIR_V2=PASS\n";
          }catch(Throwable $e){fwrite(STDERR,"TARGETED_REPAIR_V2_FAIL=".$e->getMessage()."\n");$rollback();exit(20);}
          PHP
          php -l "$RUNNER_TEMP/nvx-d54-repair-v2.php"

      - name: Execute transactional repair V2
        shell: bash
        run: |
          set -euo pipefail
          STATE_DIR="/tmp/nvx-d54-targeted-repair-v2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "STATE_DIR=$STATE_DIR" >> "$GITHUB_ENV"
          scp "$RUNNER_TEMP/nvx-d54-repair-v2.php" nvx-prod-repair-v2:/tmp/nvx-d54-repair-v2.php
          ssh -n nvx-prod-repair-v2 "rm -rf '$STATE_DIR' && mkdir -m 700 '$STATE_DIR' && php /tmp/nvx-d54-repair-v2.php '$PROD_ROOT' '$EXPECTED_SHA' '$STATE_DIR'"

      - name: Purge production caches
        shell: bash
        run: |
          set -euo pipefail
          ssh -n nvx-prod-repair-v2 "cd '$PROD_ROOT' && wp cache flush"
          ssh -n nvx-prod-repair-v2 "cd '$PROD_ROOT' && if wp help sg >/dev/null 2>&1; then wp sg purge || true; fi"
          ssh -n nvx-prod-repair-v2 "cd '$PROD_ROOT' && wp eval 'if(function_exists(\"opcache_reset\")){opcache_reset();}' || true"
          echo 'TARGETED_REPAIR_V2_CACHE_PURGE=PASS'

      - name: Verify database, alias, cases, sitemap and responsive media
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/nvx-d54-verify-v2.sh" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          root="$1"; base="$2"; sha="$3"; ua='NUVANX-Production-Targeted-Verify-V2/1.0'; cd "$root"
          test "$(tr -d '\r\n' < wp-content/themes/nuvanx-medical/.nvx-deploy-sha)" = "$sha"
          prefix="$(wp db prefix)"; remaining="$(wp db query "SELECT COUNT(*) FROM ${prefix}posts WHERE post_status='publish' AND post_content LIKE '%/valoracion-medica/%';" --skip-column-names)"; test "$(printf '%s' "$remaining" | tr -d '[:space:]')" = '0'
          alias="$(curl -sS --max-time 30 -A "$ua" -o /tmp/nvx-v2-alias.html -w '%{http_code}|%{redirect_url}' "$base/valoracion-medica/")"; test "${alias%%|*}" = '301'; test "${alias#*|}" = "$base/madrid/valoracion/"; ! grep -Fq '/.well-known/sgcaptcha/' /tmp/nvx-v2-alias.html; rm -f /tmp/nvx-v2-alias.html
          cases="$(curl -sS --max-time 30 -A "$ua" -o /tmp/nvx-v2-cases.html -w '%{http_code}' "$base/casos-de-pacientes/")"; test "$cases" = '404'; rm -f /tmp/nvx-v2-cases.html
          for rel in '2026/05/higiene-facial-con-microdermoabrasion-480x320.webp' '2026/05/diatermia-facial-480x320.webp' '2026/05/depilacion-laser-480x320.webp' '2026/05/hidrolipoclasia-480x320.webp' '2026/05/masajes-posoperatorios-480x320.webp' '2026/05/radiofrecuencia-corporal-480x320.webp' '2026/05/presoterapia-480x320.webp' '2026/05/tratamiento-anticelulitico-480x320.webp' '2026/02/casmara-480x194.webp'; do code="$(curl -sS --max-time 20 -A "$ua" -o /dev/null -w '%{http_code}' "$base/wp-content/uploads/$rel")"; test "$code" = '200'; echo "RESPONSIVE_PUBLIC=PASS rel=$rel"; done
          curl -fsSL --max-time 30 -A "$ua" "$base/sitemap_index.xml" > /tmp/nvx-v2-sm.xml; ! grep -Fq '/category-sitemap.xml' /tmp/nvx-v2-sm.xml; ! grep -Eq '/(post_tag|tag)-sitemap.xml' /tmp/nvx-v2-sm.xml; page_sm="$(grep -oE '<loc>[^<]+' /tmp/nvx-v2-sm.xml|sed 's#<loc>##'|grep '/page-sitemap.xml'|head -n1)"; test -n "$page_sm"; curl -fsSL --max-time 30 -A "$ua" "$page_sm" > /tmp/nvx-v2-page.xml; ! grep -Fq '/politica-de-cookies/' /tmp/nvx-v2-page.xml; ! grep -Fq '/mas-informacion-sobre-las-cookies/' /tmp/nvx-v2-page.xml; ! grep -Fq '/casos-de-pacientes/' /tmp/nvx-v2-page.xml; rm -f /tmp/nvx-v2-sm.xml /tmp/nvx-v2-page.xml
          echo "TARGETED_PUBLIC_VERIFY_V2=PASS sha=$sha legacy=0 alias=301 cases=404 media=9"
          SH
          chmod +x "$RUNNER_TEMP/nvx-d54-verify-v2.sh"
          scp "$RUNNER_TEMP/nvx-d54-verify-v2.sh" nvx-prod-repair-v2:/tmp/nvx-d54-verify-v2.sh
          ssh -n nvx-prod-repair-v2 "bash /tmp/nvx-d54-verify-v2.sh '$PROD_ROOT' '$BASE_URL' '$EXPECTED_SHA'"

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -f "$HOME/.ssh/config" ]]; then ssh -n nvx-prod-repair-v2 "rm -f /tmp/nvx-d54-repair-v2.php /tmp/nvx-d54-verify-v2.sh; case '${STATE_DIR:-}' in /tmp/nvx-d54-targeted-repair-v2-*) rm -rf '${STATE_DIR:-}' ;; '') ;; *) exit 1 ;; esac" || true; fi
          rm -f "$HOME/.ssh/key" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"
