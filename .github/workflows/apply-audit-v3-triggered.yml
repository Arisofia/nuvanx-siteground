name: Apply audit v3 after trigger

on:
  push:
    branches:
      - fix/audit-v3-runtime-contracts-clean-20260729
    paths:
      - '.github/audit-v3-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout clean audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/audit-v3-runtime-contracts-clean-20260729
          fetch-depth: 0

      - name: Apply validated files and workflow wiring
        run: |
          set -euo pipefail
          git fetch origin fix/audit-v3-ghost-contract-cache-purge-20260729
          git checkout FETCH_HEAD -- \
            tools/deploy/nvx-purge-wp-caches.sh \
            scripts/theme-hygiene/test-audit-v3-contract.mjs

          python - <<'PY'
          from pathlib import Path

          def insert_once(path: str, anchor: str, addition: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if addition.strip() in text:
                  return
              if text.count(anchor) != 1:
                  raise SystemExit(f'{path}: anchor is not unique: {anchor!r}')
              target.write_text(text.replace(anchor, anchor + addition, 1), encoding='utf-8')

          path_line = "      - 'tools/deploy/nvx-purge-wp-caches.sh'\n"
          lint_line = '          bash -n tools/deploy/nvx-purge-wp-caches.sh\n'
          for workflow in (
              '.github/workflows/deploy-staging2.yml',
              '.github/workflows/full-site-ui-audit.yml',
          ):
              insert_once(workflow, "      - 'tools/deploy/deploy-to-staging2.sh'\n", path_line)
              insert_once(workflow, '          bash -n tools/deploy/deploy-to-staging2.sh\n', lint_line)

          insert_once(
              '.github/workflows/theme-hygiene-gate.yml',
              '          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/theme-hygiene-gate.yml\n',
              lint_line,
          )
          insert_once(
              '.github/workflows/theme-hygiene-gate.yml',
              '          node --check scripts/theme-hygiene/test-cache-purge-contract.mjs\n',
              '          node --check scripts/theme-hygiene/test-audit-v3-contract.mjs\n',
          )
          insert_once(
              '.github/workflows/theme-hygiene-gate.yml',
              "      - name: Enforce aesthetic treatment contract\n        run: node scripts/theme-hygiene/test-aesthetic-treatment-contract.mjs\n",
              "\n      - name: Enforce audit v3 contract\n        run: node scripts/theme-hygiene/test-audit-v3-contract.mjs\n",
          )

          for disposable in (
              '.github/workflows/apply-audit-v3-clean-once.yml',
              '.github/workflows/apply-audit-v3-triggered.yml',
              '.github/audit-v3-trigger.txt',
          ):
              Path(disposable).unlink(missing_ok=True)
          PY

          git diff --check
          bash -n tools/deploy/nvx-purge-wp-caches.sh
          node --check scripts/theme-hygiene/test-audit-v3-contract.mjs
          node scripts/theme-hygiene/test-cache-purge-contract.mjs
          node scripts/theme-hygiene/test-audit-v3-contract.mjs
          node scripts/theme-hygiene/test-aesthetic-treatment-contract.mjs
          node scripts/theme-hygiene/test-runtime-bootstrap-contract.mjs

      - name: Commit clean audit v3 result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(audit): enforce v3 runtime contracts on current master'
          git push origin HEAD:fix/audit-v3-runtime-contracts-clean-20260729
