name: Temporary Staging2 targeted route check

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    if: startsWith(github.head_ref, 'ops/targeted-staging2-routes') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Configure SiteGround SSH
        env:
          SSH_HOST: ${{ secrets.STAGING2_SSH_HOST }}
          SSH_PORT_SECRET: ${{ secrets.STAGING2_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING2_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing STAGING2_SSH_HOST}"
          : "${SSH_USER:?Missing STAGING2_SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Missing STAGING2_SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing STAGING2_SSH_KNOWN_HOSTS}"
          SSH_PORT="${SSH_PORT_SECRET:-18765}"
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/siteground_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/siteground_key" "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host siteground-staging
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/siteground_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 15
          EOF
          chmod 600 "$HOME/.ssh/config"
      - name: Inspect anomalous routes and fatal errors
        run: |
          set -euo pipefail
          ssh siteground-staging 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/home/customer/www/staging2.nuvanx.com/public_html
          cd "$ROOT"
          echo '--- WP STATE ---'
          wp post list --name=soluciones-medicas --post_type=page --fields=ID,post_status,post_title,post_name --format=table || true
          wp post list --name=medicina-estetica-chamberi --post_type=page --fields=ID,post_status,post_title,post_name --format=table || true
          echo '--- DEBUG SETTINGS ---'
          wp config get WP_DEBUG --type=constant 2>&1 || true
          wp config get WP_DEBUG_LOG --type=constant 2>&1 || true
          echo '--- ROUTE RESPONSES ---'
          for path in /soluciones-medicas/ /medicina-estetica-chamberi/ /clinicas-de-medicina-estetica-nuvanx/medicina-estetica-goya-barrio-salamanca/; do
            echo "### $path"
            curl -ksS -D /tmp/nvx-route-headers -L --max-time 25 --resolve staging2.nuvanx.com:443:127.0.0.1 -o /tmp/nvx-route-body "https://staging2.nuvanx.com${path}"
            grep -Ei '^(HTTP/|location:|content-type:|content-length:|x-cache:|x-proxy-cache:|cache-control:)' /tmp/nvx-route-headers || true
            echo "BYTES=$(wc -c < /tmp/nvx-route-body | tr -d ' ')"
            head -c 300 /tmp/nvx-route-body | tr '\n' ' '; echo
          done
          echo '--- RECENT PHP FATALS ---'
          for f in "$ROOT/wp-content/debug.log" "$ROOT/error_log" /home/customer/www/staging2.nuvanx.com/logs/error_log /home/customer/www/staging2.nuvanx.com/logs/staging2.nuvanx.com.error.log; do
            if [[ -f "$f" ]]; then
              echo "### $f"
              tail -n 250 "$f" | grep -Ei 'fatal error|uncaught|parse error|typeerror|error:' | tail -n 80 || true
            fi
          done
          echo '--- LOG FILES ---'
          find /home/customer/www/staging2.nuvanx.com -maxdepth 4 -type f \( -name 'error_log' -o -name '*.log' \) -print 2>/dev/null | head -50 || true
          REMOTE
