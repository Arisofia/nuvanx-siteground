name: PR274 apply validated corrections

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.head_ref == 'fix/remove-redirect-exceptions-and-retire-legacy-routes' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out immutable PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Execute versioned transformation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/pr274-route-retirement-fix.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          code = textwrap.dedent(workflow[start:end])
          exec(compile(code, 'pr274-route-retirement-fix', 'exec'), {})
          PY

      - name: Validate transformed syntax
        run: |
          set -euo pipefail
          node --check scripts/staging2/audit-full-site-ui.mjs
          node --check scripts/staging2/test-deploy-workflow-contract.mjs
          php -l scripts/wp/nvx-canonical-route-migration.php
          php -l wp-content/themes/nuvanx-medical/inc/nvx-page-hygiene.php
          php -l wp-content/themes/nuvanx-medical/inc/nvx-integrations.php
          bash -n scripts/staging2/smoke-verify-staging2.sh
          bash -n tools/deploy/deploy-to-staging2.sh

      - name: Commit non-workflow corrections
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git add \
            scripts/staging2/audit-full-site-ui.mjs \
            scripts/staging2/smoke-verify-staging2.sh \
            scripts/staging2/test-deploy-workflow-contract.mjs \
            scripts/wp/nvx-canonical-route-migration.php \
            tools/deploy/deploy-to-staging2.sh \
            wp-content/themes/nuvanx-medical/inc/nvx-page-hygiene.php \
            wp-content/themes/nuvanx-medical/inc/nvx-integrations.php
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(routes): remove runtime redirect exceptions'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:fix/remove-redirect-exceptions-and-retire-legacy-routes
