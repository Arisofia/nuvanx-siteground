name: Repository Hygiene

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    name: Prevent transient, generated and self-mutating repository state
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Reject transient one-shot files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t transient < <(git ls-files | grep -E '(-(once|temp)\.(yml|yaml|sh|mjs)$)|(^|/)(tmp|temp)[_-]' || true)
          if (( ${#transient[@]} > 0 && ${#transient[0]} > 0 )); then
            echo 'Transient one-shot files are not allowed on persistent branches:' >&2
            printf '  %s\n' "${transient[@]}" >&2
            exit 1
          fi
          echo 'REPOSITORY_TRANSIENT_GATE=PASS'

      - name: Reject workflow self-mutation
        shell: bash
        run: |
          set -euo pipefail
          offenders=()
          while IFS= read -r file; do
            if grep -Eq '(^|[[:space:]])git[[:space:]]+push([[:space:]]|$)' "$file"; then
              offenders+=("$file")
            fi
          done < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print | sort)
          if (( ${#offenders[@]} > 0 )); then
            echo 'GitHub Actions workflows must not push repository mutations themselves:' >&2
            printf '  %s\n' "${offenders[@]}" >&2
            exit 1
          fi
          echo 'WORKFLOW_SELF_MUTATION_GATE=PASS'

      - name: Reject tracked generated or local debris
        shell: bash
        run: |
          set -euo pipefail
          forbidden_exact=(
            'DEPLOY_TRIGGER.txt'
            'composer.phar'
            'wp-content/themes/nuvanx-medical/composer.phar'
          )
          forbidden_prefixes=(
            '.vscode/'
            'audit/'
            '.github/audit/'
            'wp-content/themes/nuvanx-medical/vendor/'
          )
          failures=()
          for file in "${forbidden_exact[@]}"; do
            git ls-files --error-unmatch "$file" >/dev/null 2>&1 && failures+=("$file") || true
          done
          tracked="$(git ls-files)"
          for prefix in "${forbidden_prefixes[@]}"; do
            if printf '%s\n' "$tracked" | grep -Fq "$prefix"; then failures+=("$prefix"); fi
          done
          if (( ${#failures[@]} > 0 )); then
            echo 'Generated/local debris is tracked:' >&2
            printf '  %s\n' "${failures[@]}" >&2
            exit 1
          fi
          echo 'REPOSITORY_DEBRIS_GATE=PASS'

      - name: Reject empty and editor residue files
        shell: bash
        run: |
          set -euo pipefail
          empty=()
          residue=()
          while IFS= read -r file; do
            [[ -f "$file" && ! -s "$file" ]] && empty+=("$file")
            case "$file" in
              *.orig|*.rej|*.bak|*.tmp|*.swp|*~|*/.DS_Store|.DS_Store) residue+=("$file") ;;
            esac
          done < <(git ls-files)
          if (( ${#empty[@]} > 0 )); then
            echo 'Empty tracked files are not allowed:' >&2
            printf '  %s\n' "${empty[@]}" >&2
            exit 1
          fi
          if (( ${#residue[@]} > 0 )); then
            echo 'Editor/patch residue is tracked:' >&2
            printf '  %s\n' "${residue[@]}" >&2
            exit 1
          fi
          echo 'REPOSITORY_EMPTY_RESIDUE_GATE=PASS'

  h1-attribution-e2e:
    name: H1 production HubSpot attribution E2E
    if: github.head_ref == 'audit/h1-hubspot-e2e-20260809-1510'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp-h1
          cd tmp-h1
          npm init -y
          npm install --no-audit --no-fund playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Run H1 E2E against production
        shell: bash
        run: |
          set -euo pipefail
          NODE_PATH="$PWD/tmp-h1/node_modules" node scripts/tmp-h1-hubspot-e2e.mjs 2>&1 | tee tmp-h1/h1-e2e.log

      - name: Upload H1 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: h1-hubspot-e2e-pr432
          path: tmp-h1/h1-e2e.log
          retention-days: 7
