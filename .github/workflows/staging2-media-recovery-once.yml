name: Staging2 Media Recovery Once

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/staging2-media-recovery-once.yml

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STAGING_ROOT: /home/customer/www/staging2.nuvanx.com/public_html
      STAGING_PARENT: /home/customer/www/staging2.nuvanx.com
      PROD_ROOT: /home/customer/www/nuvanx.com/public_html
    steps:
      - name: Configure strict SSH
        shell: bash
        env:
          HOST: ${{ secrets.STAGING2_SSH_HOST }}
          PORT: ${{ secrets.STAGING2_SSH_PORT }}
          USER: ${{ secrets.STAGING2_SSH_USER }}
          KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${HOST:?Missing STAGING2_SSH_HOST}"
          : "${USER:?Missing STAGING2_SSH_USER}"
          : "${KEY:?Missing STAGING2_SSH_PRIVATE_KEY}"
          : "${KH:?Missing STAGING2_SSH_KNOWN_HOSTS}"
          SSH_PORT="${PORT:-18765}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/staging2_key"
          chmod 600 "$HOME/.ssh/staging2_key"
          printf '%s\n' "$KH" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx
            HostName $HOST
            User $USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/staging2_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 20
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Restore only verified missing uploads from production to staging
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx "STAGING_ROOT='$STAGING_ROOT' STAGING_PARENT='$STAGING_PARENT' PROD_ROOT='$PROD_ROOT' RUN_ID='$GITHUB_RUN_ID' bash -se" <<'REMOTE'
          set -Eeuo pipefail

          test "$STAGING_ROOT" = '/home/customer/www/staging2.nuvanx.com/public_html'
          test "$PROD_ROOT" = '/home/customer/www/nuvanx.com/public_html'
          test "$STAGING_ROOT" != "$PROD_ROOT"
          test "$(cd "$STAGING_ROOT" && wp config get DB_NAME)" = 'dbshcocboodiwr'
          test "$(cd "$PROD_ROOT" && wp config get DB_NAME)" = 'db0ecrycwv2tgb'

          backup="$STAGING_PARENT/.nvx-media-recovery/$RUN_ID"
          mkdir -p "$backup"
          chmod 700 "$backup"
          manifest="$backup/manifest.tsv"

          cat > "$backup/build-manifest.php" <<'PHP'
          <?php
          $ids = array( 182, 2896, 2897, 3099, 890, 1419, 1420, 1421, 1422, 1423, 1424, 1425, 1426, 1441, 2894, 2926 );
          $direct = array(
              '2026/05/cristina-marquez.webp',
              '2026/05/yolanda-pinero.jpg.webp',
              '2026/06/nvx-ivon-deras-760.webp',
          );
          $files = array();
          $add = static function ( string $rel, string $kind ) use ( &$files ): void {
              $rel = ltrim( str_replace( '\\', '/', $rel ), '/' );
              if ( '' === $rel || false !== strpos( $rel, '..' ) ) {
                  return;
              }
              if ( ! isset( $files[ $rel ] ) || 'required' === $kind ) {
                  $files[ $rel ] = $kind;
              }
          };
          foreach ( $ids as $id ) {
              $rel = (string) get_post_meta( $id, '_wp_attached_file', true );
              if ( '' === $rel ) {
                  fwrite( STDERR, "Missing _wp_attached_file for attachment {$id}\n" );
                  exit( 2 );
              }
              $add( $rel, 'required' );
              $meta = wp_get_attachment_metadata( $id );
              if ( is_array( $meta ) ) {
                  $dir = dirname( $rel );
                  $dir = '.' === $dir ? '' : trailingslashit( $dir );
                  if ( ! empty( $meta['original_image'] ) ) {
                      $add( $dir . (string) $meta['original_image'], 'optional' );
                  }
                  if ( ! empty( $meta['sizes'] ) && is_array( $meta['sizes'] ) ) {
                      foreach ( $meta['sizes'] as $size ) {
                          if ( is_array( $size ) && ! empty( $size['file'] ) ) {
                              $add( $dir . (string) $size['file'], 'optional' );
                          }
                      }
                  }
              }
          }
          foreach ( $direct as $rel ) {
              $add( $rel, 'required' );
              $url = home_url( '/wp-content/uploads/' . ltrim( $rel, '/' ) );
              $id = attachment_url_to_postid( $url );
              if ( $id > 0 ) {
                  $meta = wp_get_attachment_metadata( $id );
                  if ( is_array( $meta ) ) {
                      $dir = dirname( $rel );
                      $dir = '.' === $dir ? '' : trailingslashit( $dir );
                      if ( ! empty( $meta['original_image'] ) ) {
                          $add( $dir . (string) $meta['original_image'], 'optional' );
                      }
                      if ( ! empty( $meta['sizes'] ) && is_array( $meta['sizes'] ) ) {
                          foreach ( $meta['sizes'] as $size ) {
                              if ( is_array( $size ) && ! empty( $size['file'] ) ) {
                                  $add( $dir . (string) $size['file'], 'optional' );
                              }
                          }
                      }
                  }
              }
          }
          ksort( $files );
          foreach ( $files as $rel => $kind ) {
              echo $kind . "\t" . $rel . "\n";
          }
          PHP

          cd "$STAGING_ROOT"
          wp eval-file "$backup/build-manifest.php" > "$manifest"
          test -s "$manifest"
          echo "MEDIA_MANIFEST_COUNT=$(wc -l < "$manifest" | tr -d ' ')"

          copied=0
          skipped=0
          optional_missing_source=0
          required_missing_source=0

          while IFS=$'\t' read -r kind rel; do
            [[ "$kind" = 'required' || "$kind" = 'optional' ]]
            [[ -n "$rel" ]]
            [[ "$rel" != /* ]]
            [[ "$rel" != *'..'* ]]
            src="$PROD_ROOT/wp-content/uploads/$rel"
            dst="$STAGING_ROOT/wp-content/uploads/$rel"

            if [[ ! -f "$src" ]]; then
              echo "SOURCE_MISSING kind=$kind rel=$rel"
              if [[ "$kind" = 'required' ]]; then
                required_missing_source=$((required_missing_source + 1))
              else
                optional_missing_source=$((optional_missing_source + 1))
              fi
              continue
            fi

            mkdir -p "$(dirname "$dst")"
            if [[ -f "$dst" ]]; then
              src_sha="$(sha256sum "$src" | awk '{print $1}')"
              dst_sha="$(sha256sum "$dst" | awk '{print $1}')"
              if [[ "$src_sha" != "$dst_sha" ]]; then
                echo "REFUSING_DIFFERENT_EXISTING_FILE rel=$rel staging_sha=$dst_sha production_sha=$src_sha" >&2
                exit 3
              fi
              echo "ALREADY_IN_PARITY rel=$rel sha=$src_sha"
              skipped=$((skipped + 1))
              continue
            fi

            cp -p "$src" "$dst"
            src_sha="$(sha256sum "$src" | awk '{print $1}')"
            dst_sha="$(sha256sum "$dst" | awk '{print $1}')"
            test "$src_sha" = "$dst_sha"
            echo "COPIED rel=$rel sha=$dst_sha bytes=$(wc -c < "$dst" | tr -d ' ')"
            copied=$((copied + 1))
          done < "$manifest"

          test "$required_missing_source" -eq 0

          # Verify every required file now exists in staging and matches production.
          while IFS=$'\t' read -r kind rel; do
            [[ "$kind" = 'required' ]] || continue
            src="$PROD_ROOT/wp-content/uploads/$rel"
            dst="$STAGING_ROOT/wp-content/uploads/$rel"
            test -f "$src"
            test -f "$dst"
            test "$(sha256sum "$src" | awk '{print $1}')" = "$(sha256sum "$dst" | awk '{print $1}')"
          done < "$manifest"

          cd "$STAGING_ROOT"
          wp cache flush

          echo "MEDIA_RECOVERY=PASS copied=$copied already_in_parity=$skipped optional_missing_source=$optional_missing_source"
          echo "PRODUCTION_WRITE=NONE"
          rm -rf "$backup"
          REMOTE

      - name: Destroy SSH identity
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/staging2_key" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"
