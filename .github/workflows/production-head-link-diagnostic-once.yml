name: Production Head Link Diagnostic Once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/production-head-link-diagnostic-once.yml

permissions:
  contents: read

env:
  PROD_ROOT: /home/customer/www/nuvanx.com/public_html
  BASE_URL: https://nuvanx.com
  EXPECTED_SHA: 4775310be2b7dcdda18f8fd6de8e40041c2eb555

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Configure strict production SSH
        shell: bash
        env:
          HOST: ${{ secrets.PROD_SSH_HOST }}
          PORT: ${{ secrets.PROD_SSH_PORT }}
          USER: ${{ secrets.PROD_SSH_USER }}
          KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${HOST:?Missing PROD_SSH_HOST}"; : "${USER:?Missing PROD_SSH_USER}"; : "${KEY:?Missing PROD_SSH_PRIVATE_KEY}"; : "${KH:?Missing PROD_SSH_KNOWN_HOSTS}"
          SSH_PORT="${PORT:-18765}"
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/prod_key"; chmod 600 "$HOME/.ssh/prod_key"
          printf '%s\n' "$KH" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx-prod
            HostName $HOST
            User $USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/prod_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 20
            ServerAliveInterval 30
            ServerAliveCountMax 2
          EOF
          chmod 600 "$HOME/.ssh/config"
          ssh nvx-prod "test -d '$PROD_ROOT' && command -v wp >/dev/null && command -v curl >/dev/null"

      - name: Diagnose rendered head and WordPress emitters
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-prod "PROD_ROOT='$PROD_ROOT' BASE_URL='$BASE_URL' EXPECTED_SHA='$EXPECTED_SHA' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$PROD_ROOT"
          test "$(tr -d '\r\n' < wp-content/themes/nuvanx-medical/.nvx-deploy-sha)" = "$EXPECTED_SHA"

          tmp="$(mktemp)"
          curl -sS -L --max-redirs 5 --max-time 30 -A 'NUVANX-Production-Head-Diagnostic/1.0' -H 'Accept: text/html,application/xhtml+xml' "$BASE_URL/" > "$tmp"
          echo '===== RENDERED TITLES ====='
          grep -Eio '<title[^>]*>[^<]*</title>' "$tmp" | nl -ba || true
          echo "RENDERED_TITLE_COUNT=$(grep -Eio '<title[^>]*>[^<]*</title>' "$tmp" | wc -l | tr -d ' ')"
          echo '===== HEAD TITLE CONTEXT ====='
          grep -Ein -B2 -A2 '<title' "$tmp" | head -n 80 || true
          rm -f "$tmp"

          echo '===== ACTIVE PLUGINS ====='
          wp plugin list --status=active --fields=name,status,version --format=table

          echo '===== WP_HEAD CALLBACKS WITH TITLE/SEO/YOAST ====='
          wp eval '
          global $wp_filter;
          $hook = $wp_filter["wp_head"] ?? null;
          if (!$hook || !isset($hook->callbacks)) { echo "NO_WP_HEAD_CALLBACKS\n"; return; }
          foreach ($hook->callbacks as $priority => $callbacks) {
              foreach ($callbacks as $entry) {
                  $fn = $entry["function"] ?? null;
                  if (is_string($fn)) { $name=$fn; }
                  elseif (is_array($fn)) { $a=$fn[0] ?? ""; $b=$fn[1] ?? ""; $name=(is_object($a)?get_class($a):(string)$a)."::".$b; }
                  elseif ($fn instanceof Closure) { $name="Closure"; }
                  else { $name="callable"; }
                  if (preg_match("/(title|seo|yoast|head|document)/i", $name)) echo $priority."\t".$name."\n";
              }
          }'

          echo '===== TITLE FILTER CALLBACKS ====='
          wp eval '
          global $wp_filter;
          foreach (["pre_get_document_title","document_title_parts","wpseo_title"] as $hookName) {
              echo "HOOK=".$hookName."\n";
              $hook=$wp_filter[$hookName]??null;
              if(!$hook||!isset($hook->callbacks)){echo "  NONE\n";continue;}
              foreach($hook->callbacks as $priority=>$callbacks){foreach($callbacks as $entry){$fn=$entry["function"]??null;if(is_string($fn))$name=$fn;elseif(is_array($fn)){$a=$fn[0]??"";$b=$fn[1]??"";$name=(is_object($a)?get_class($a):(string)$a)."::".$b;}elseif($fn instanceof Closure)$name="Closure";else $name="callable";echo "  ".$priority."\t".$name."\n";}}
          }'
          REMOTE

      - name: Find exact database sources of broken internal URLs
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-prod "PROD_ROOT='$PROD_ROOT' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$PROD_ROOT"
          wp eval '
          global $wpdb;
          $needles=["/valoracion-medica/","/casos-de-pacientes/"];
          foreach($needles as $needle){
            echo "===== NEEDLE ".$needle." =====\n";
            $like="%".$wpdb->esc_like($needle)."%";
            $posts=$wpdb->get_results($wpdb->prepare("SELECT ID,post_type,post_status,post_name,post_title FROM {$wpdb->posts} WHERE post_content LIKE %s ORDER BY ID",$like),ARRAY_A);
            foreach($posts as $r) echo "POST_CONTENT\t".implode("\t",array_map(fn($v)=>str_replace(["\t","\n","\r"]," ",(string)$v),$r))."\n";
            $meta=$wpdb->get_results($wpdb->prepare("SELECT post_id,meta_key FROM {$wpdb->postmeta} WHERE meta_value LIKE %s ORDER BY post_id,meta_key",$like),ARRAY_A);
            foreach($meta as $r) echo "POST_META\t".$r["post_id"]."\t".$r["meta_key"]."\n";
            $opts=$wpdb->get_results($wpdb->prepare("SELECT option_name FROM {$wpdb->options} WHERE option_value LIKE %s ORDER BY option_name",$like),ARRAY_A);
            foreach($opts as $r) echo "OPTION\t".$r["option_name"]."\n";
          }'

          echo '===== PRIMARY MENU ITEMS ====='
          wp menu item list "$(wp menu location get primary --field=term_id 2>/dev/null || true)" --fields=db_id,title,url,type,object_id --format=table 2>/dev/null || true
          REMOTE

      - name: Destroy SSH identity
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/prod_key" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"
