name: Verify Sonar status once

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/verify-sonar-status-once.yml'

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'refactor/sonar-duplication-20260731'
    runs-on: ubuntu-24.04
    steps:
      - name: Wait for clean SonarQube Cloud PR analysis
        shell: bash
        run: |
          set -euo pipefail
          project='Arisofia_nuvanx-siteground'
          pull_request='308'
          base='https://sonarcloud.io/api'

          for attempt in $(seq 1 18); do
            curl --fail --silent --show-error --retry 4 --retry-all-errors \
              "$base/qualitygates/project_status?projectKey=$project&pullRequest=$pull_request" > gate.json
            curl --fail --silent --show-error --retry 4 --retry-all-errors \
              "$base/issues/search?componentKeys=$project&resolved=false&ps=100&p=1&pullRequest=$pull_request&additionalFields=_all" > issues.json
            read -r status total < <(python3 - <<'PY'
          import json
          gate = json.load(open('gate.json', encoding='utf-8'))['projectStatus']
          issues = json.load(open('issues.json', encoding='utf-8'))
          print(gate.get('status', 'UNKNOWN'), issues.get('total', -1))
          PY
            )
            echo "SONAR_POLL attempt=$attempt status=$status open_issues=$total"
            if [[ "$status" == 'OK' && "$total" == '0' ]]; then
              break
            fi
            if [[ "$attempt" -eq 18 ]]; then
              python3 - <<'PY'
          import json
          payload = json.load(open('issues.json', encoding='utf-8'))
          for issue in payload.get('issues', []):
              component = issue.get('component', '')
              if ':' in component:
                  component = component.split(':', 1)[1]
              print(json.dumps({
                  'rule': issue.get('rule'),
                  'component': component,
                  'line': issue.get('line'),
                  'message': issue.get('message'),
              }, ensure_ascii=False, sort_keys=True))
          PY
              exit 1
            fi
            sleep 10
          done

          python3 - <<'PY'
          import json
          gate = json.load(open('gate.json', encoding='utf-8'))['projectStatus']
          print('SONAR_PR_STATUS=' + gate.get('status', 'UNKNOWN'))
          for condition in gate.get('conditions', []):
              print('SONAR_PR_CONDITION=' + json.dumps(condition, ensure_ascii=False, sort_keys=True))
          print('SONAR_PR_OPEN_ISSUES=0')
          PY
