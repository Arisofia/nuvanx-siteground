name: Staging2 REST Auth Diagnose Once

on:
  push:
    paths:
      - '.github/workflows/staging2-rest-auth-diagnose-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WP_ROOT: /home/customer/www/staging2.nuvanx.com/public_html
      STAGING_PARENT: /home/customer/www/staging2.nuvanx.com
    steps:
      - name: Probe public REST endpoints
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            'https://staging2.nuvanx.com/' \
            'https://staging2.nuvanx.com/wp-json/' \
            'https://staging2.nuvanx.com/wp-json/wp/v2/types'; do
            echo "=== $url ==="
            curl -sS --max-time 20 -A 'NUVANX-WPVibe-Diagnose/1.0' -D /tmp/h -o /tmp/b "$url" -w 'status=%{http_code} final=%{url_effective} size=%{size_download}\n' || true
            grep -Ei '^(HTTP/|www-authenticate:|location:|server:|x-robots-tag:|x-proxy-cache:|content-type:|allow:)' /tmp/h || true
            printf 'body_prefix='; head -c 500 /tmp/b 2>/dev/null | tr '\n' ' '; echo
          done

      - name: Configure strict SSH
        shell: bash
        env:
          HOST: ${{ secrets.STAGING2_SSH_HOST }}
          PORT: ${{ secrets.STAGING2_SSH_PORT }}
          USER: ${{ secrets.STAGING2_SSH_USER }}
          KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${HOST:?}"; : "${USER:?}"; : "${KEY:?}"; : "${KH:?}"
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/k"; chmod 600 "$HOME/.ssh/k"
          printf '%s\n' "$KH" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx
            HostName $HOST
            User $USER
            Port ${PORT:-18765}
            IdentityFile $HOME/.ssh/k
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 20
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Inspect auth controls read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx "WP_ROOT='$WP_ROOT' STAGING_PARENT='$STAGING_PARENT' bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$WP_ROOT"
          echo '=== WordPress identity ==='
          echo "home=$(wp option get home)"
          echo "siteurl=$(wp option get siteurl)"
          echo "db=$(wp config get DB_NAME)"
          echo '=== htaccess auth directives ==='
          grep -Eni 'AuthType|AuthName|AuthUserFile|Require[[:space:]]+valid-user|Require[[:space:]]+user|SetEnvIf.*Authorization|RewriteRule.*wp-json|wp-json|REST' "$WP_ROOT/.htaccess" 2>/dev/null || true
          echo '=== parent htpasswd/htaccess candidates ==='
          find "$STAGING_PARENT" -maxdepth 2 -type f \( -name '.htaccess' -o -name '.htpasswd*' \) -printf '%p\n' 2>/dev/null || true
          echo '=== auth directives across staging htaccess files ==='
          while IFS= read -r f; do
            echo "--- $f"
            grep -Eni 'AuthType|AuthName|AuthUserFile|Require[[:space:]]+valid-user|Require[[:space:]]+user|wp-json|REST' "$f" 2>/dev/null || true
          done < <(find "$STAGING_PARENT" -maxdepth 3 -type f -name '.htaccess' 2>/dev/null)
          echo '=== active plugins ==='
          wp plugin list --status=active --fields=name,status --format=csv
          echo '=== mu plugins ==='
          wp plugin list --status=must-use --fields=name,status --format=csv
          echo '=== code references that can restrict REST ==='
          grep -RniE 'rest_authentication_errors|rest_enabled|wp-json|HTTP_AUTHORIZATION|PHP_AUTH_USER|WWW-Authenticate|status_header\([[:space:]]*401|wp_die.*401' wp-content/mu-plugins wp-content/plugins/code-snippets wp-content/themes/nuvanx-medical 2>/dev/null | head -120 || true
          echo '=== local WP REST resolution ==='
          wp eval '$r = rest_do_request(new WP_REST_Request("GET", "/")); echo "rest_root_status=" . $r->get_status() . "\n"; $r2 = rest_do_request(new WP_REST_Request("GET", "/wp/v2/types")); echo "rest_types_status=" . $r2->get_status() . "\n";'
          REMOTE

      - name: Cleanup SSH
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/k" "$HOME/.ssh/config" "$HOME/.ssh/known_hosts"
