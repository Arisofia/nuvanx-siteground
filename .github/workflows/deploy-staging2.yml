name: Deploy Staging2

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to deploy to staging2
        required: true
        type: string
      run_block_c_acceptance:
        description: Run the full 52 pages × 3 viewports Block C gate after a successful deploy
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: staging2-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy immutable SHA and verify Block A boundary
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DEPLOY_SHA: ${{ inputs.sha }}
      WP_ROOT: /home/customer/www/staging2.nuvanx.com/public_html
      STAGING_PARENT: /home/customer/www/staging2.nuvanx.com
      PROD_ROOT: /home/customer/www/nuvanx.com/public_html
      BASE_URL: https://staging2.nuvanx.com
      EXPECTED_HOST: staging2.nuvanx.com
      CI: true
    steps:
      - name: Check out master history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable source SHA
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_SHA="$(printf '%s' "$DEPLOY_SHA" | tr -d '[:space:]')"
          echo "DEPLOY_SHA=$DEPLOY_SHA" >> "$GITHUB_ENV"
          echo "EXPECTED_SHA=$DEPLOY_SHA" >> "$GITHUB_ENV"
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'DEPLOY_SHA must be a full lowercase 40-character SHA.' >&2; exit 1; }
          git fetch --no-tags origin master
          git cat-file -e "${DEPLOY_SHA}^{commit}"
          git merge-base --is-ancestor "$DEPLOY_SHA" origin/master || { echo 'Refusing SHA outside origin/master.' >&2; exit 1; }
          git checkout --detach "$DEPLOY_SHA"
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          test -f scripts/staging2/verify-staging-boundary.mjs
          bash -n tools/deploy/deploy-to-staging2.sh
          find wp-content/themes/nuvanx-medical/ -path '*/vendor' -prune -o -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'

      - name: Run static deployment gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/lint/no-hardcoded-colors.mjs
          node scripts/lint/no-hardcoded-fontsize.mjs
          node scripts/lint/no-inline-layout-styles.mjs

      - name: Configure strict SSH authentication
        shell: bash
        env:
          HOST: ${{ secrets.STAGING2_SSH_HOST }}
          PORT: ${{ secrets.STAGING2_SSH_PORT }}
          USER: ${{ secrets.STAGING2_SSH_USER }}
          KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${HOST:?Missing STAGING2_SSH_HOST}"; : "${USER:?Missing STAGING2_SSH_USER}"; : "${KEY:?Missing STAGING2_SSH_PRIVATE_KEY}"; : "${KH:?Missing STAGING2_SSH_KNOWN_HOSTS}"
          SSH_PORT="${PORT:-18765}"
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/staging2_key"; chmod 600 "$HOME/.ssh/staging2_key"
          printf '%s\n' "$KH" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx-staging2
            HostName $HOST
            User $USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/staging2_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 20
            ServerAliveInterval 30
            ServerAliveCountMax 2
          EOF
          chmod 600 "$HOME/.ssh/config"
          ssh nvx-staging2 "test -d '$WP_ROOT' && test -f '$WP_ROOT/wp-config.php' && command -v wp >/dev/null && command -v rsync >/dev/null && command -v php >/dev/null"

      - name: Verify staging isolation preflight
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-staging2 "WP_ROOT='$WP_ROOT' PROD_ROOT='$PROD_ROOT' bash -se" <<'REMOTE'
          set -euo pipefail
          test "$WP_ROOT" != "$PROD_ROOT"
          test "$(cd "$WP_ROOT" && wp config get DB_NAME)" = 'dbshcocboodiwr'
          test "$(cd "$PROD_ROOT" && wp config get DB_NAME)" = 'db0ecrycwv2tgb'
          test "$(cd "$WP_ROOT" && wp option get home)" = 'https://staging2.nuvanx.com'
          test "$(cd "$WP_ROOT" && wp option get siteurl)" = 'https://staging2.nuvanx.com'
          test "$(cd "$WP_ROOT" && wp option get blog_public)" = '0'
          test "$(cd "$WP_ROOT" && wp config get NVX_ENV)" = 'staging'
          test "$(cd "$WP_ROOT" && wp config get WP_ENVIRONMENT_TYPE)" = 'staging'
          if (cd "$WP_ROOT" && wp plugin is-active sg-cachepress); then
            echo 'Speed Optimizer must begin inactive on staging2.' >&2
            exit 1
          fi
          echo 'PREFLIGHT_ISOLATION=PASS'
          REMOTE

      - name: Create pre-deploy rollback snapshot
        shell: bash
        run: |
          set -euo pipefail
          ROLLBACK_DIR="$STAGING_PARENT/.nvx-rollback/${GITHUB_RUN_ID}-${DEPLOY_SHA}"
          [[ "$ROLLBACK_DIR" == "$STAGING_PARENT/.nvx-rollback/"* ]]
          echo "ROLLBACK_DIR=$ROLLBACK_DIR" >> "$GITHUB_ENV"
          ssh nvx-staging2 "WP_ROOT='$WP_ROOT' ROLLBACK_DIR='$ROLLBACK_DIR' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          mkdir -p "$ROLLBACK_DIR"
          test ! -e "$ROLLBACK_DIR/theme.tgz"
          tar -czf "$ROLLBACK_DIR/theme.tgz" -C "$WP_ROOT" wp-content/themes/nuvanx-medical
          if [[ -d "$WP_ROOT/wp-content/mu-plugins" ]]; then
            tar -czf "$ROLLBACK_DIR/mu-plugins.tgz" -C "$WP_ROOT" wp-content/mu-plugins
          fi
          cd "$WP_ROOT"
          wp db export "$ROLLBACK_DIR/staging-db.sql" --quiet
          test -s "$ROLLBACK_DIR/theme.tgz"
          test -s "$ROLLBACK_DIR/staging-db.sql"
          if [[ -f wp-content/themes/nuvanx-medical/.nvx-deploy-sha ]]; then
            tr -d '\r\n' < wp-content/themes/nuvanx-medical/.nvx-deploy-sha > "$ROLLBACK_DIR/previous-sha.txt"
          else
            : > "$ROLLBACK_DIR/previous-sha.txt"
          fi
          echo "ROLLBACK_SNAPSHOT=PASS path=$ROLLBACK_DIR"
          REMOTE
          echo 'STAGING_SNAPSHOT_READY=1' >> "$GITHUB_ENV"

      - name: Upload immutable release payload
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_RELEASE="$WP_ROOT/wp-content/.nuvanx-deployments/${DEPLOY_SHA}-${GITHUB_RUN_ID}"
          echo "REMOTE_RELEASE=$REMOTE_RELEASE" >> "$GITHUB_ENV"
          ssh nvx-staging2 "mkdir -p '$REMOTE_RELEASE/theme'"
          rsync -az --delete --exclude='.git' --exclude='php_errorlog' --exclude='*.log' --exclude='_archive*' --exclude='_disabled*' --exclude='*.bak*' wp-content/themes/nuvanx-medical/ "nvx-staging2:$REMOTE_RELEASE/theme/"
          rsync -az tools/deploy/deploy-to-staging2.sh "nvx-staging2:$REMOTE_RELEASE/deploy-to-staging2.sh"
          rsync -az tools/deploy/deploy-required-mu-plugins.sh "nvx-staging2:$REMOTE_RELEASE/deploy-required-mu-plugins.sh"
          rsync -az tools/wp-cli/hygiene-content-fix.php "nvx-staging2:$REMOTE_RELEASE/hygiene-content-fix.php"

      - name: Arm rollback before staging mutation
        shell: bash
        run: echo 'STAGING_MUTATION_ARMED=1' >> "$GITHUB_ENV"

      - name: Execute guarded staging deployment
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-staging2 "NUVANX_CONFIRM=yes bash '$REMOTE_RELEASE/deploy-to-staging2.sh' --wp-root '$WP_ROOT' --source-theme '$REMOTE_RELEASE/theme' --sha '$DEPLOY_SHA' --confirm && NUVANX_CONFIRM=yes bash '$REMOTE_RELEASE/deploy-required-mu-plugins.sh' --environment staging2 --wp-root '$WP_ROOT' --confirm"

      - name: Apply staging content hygiene
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-staging2 "cd '$WP_ROOT' && wp eval-file '$REMOTE_RELEASE/hygiene-content-fix.php'"

      - name: Purge staging caches with transient Speed Optimizer activation
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-staging2 "WP_ROOT='$WP_ROOT' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$WP_ROOT"
          wp cache flush
          plugin_slug='sg-cachepress'
          if ! wp plugin is-installed "$plugin_slug" >/dev/null 2>&1; then
            echo 'Speed Optimizer is not installed; cannot purge SiteGround Dynamic Cache.' >&2
            exit 1
          fi
          if wp plugin is-active "$plugin_slug" >/dev/null 2>&1; then
            echo 'Speed Optimizer unexpectedly active before post-hygiene purge.' >&2
            exit 1
          fi
          restore_inactive() {
            set +e
            if wp plugin is-active "$plugin_slug" >/dev/null 2>&1; then
              wp plugin deactivate "$plugin_slug" --quiet || true
            fi
          }
          trap restore_inactive EXIT
          wp plugin activate "$plugin_slug" --quiet
          wp plugin is-active "$plugin_slug"
          wp sg purge
          wp plugin deactivate "$plugin_slug" --quiet
          if wp plugin is-active "$plugin_slug" >/dev/null 2>&1; then
            echo 'Speed Optimizer remained active after purge.' >&2
            exit 1
          fi
          trap - EXIT
          echo 'siteground_wp_cli_purge=PASS mode=transient-activation-restored-inactive'
          rm -rf wp-content/uploads/siteground-optimizer-assets/siteground-optimizer-combined-*
          rm -rf wp-content/cache/sgo-cache/* wp-content/cache/*
          wp eval 'if (function_exists("opcache_reset")) { opcache_reset(); }'
          REMOTE

      - name: Verify exact deployed SHA and staging identity
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-staging2 "WP_ROOT='$WP_ROOT' DEPLOY_SHA='$DEPLOY_SHA' bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$WP_ROOT"
          deployed="$(tr -d '\r\n' < wp-content/themes/nuvanx-medical/.nvx-deploy-sha)"
          test "$deployed" = "$DEPLOY_SHA"
          test "$(wp config get DB_NAME)" = 'dbshcocboodiwr'
          test "$(wp option get home)" = 'https://staging2.nuvanx.com'
          test "$(wp option get siteurl)" = 'https://staging2.nuvanx.com'
          test "$(wp option get blog_public)" = '0'
          test "$(wp config get NVX_ENV)" = 'staging'
          test "$(wp config get WP_ENVIRONMENT_TYPE)" = 'staging'
          test "$(wp theme list --status=active --field=name)" = 'nuvanx-medical'
          if wp plugin is-active sg-cachepress; then
            echo 'Speed Optimizer active after deploy; expected restored inactive state.' >&2
            exit 1
          fi
          echo "DEPLOYED_SHA=$deployed"
          echo 'STAGING_IDENTITY=PASS'
          REMOTE

      - name: Verify content hygiene
        shell: bash
        run: |
          set -euo pipefail
          status=0
          ssh nvx-staging2 "cd '$WP_ROOT' && grep -E -i -r 'valoraci[oó]n( m[eé]dica)? (gratis|gratuita)|consulta (m[eé]dica )?(gratis|gratuita)|sin compromiso|Tu mejor versi[oó]n empieza aqu[ií]|EXILITET|enfoque m[eé]dico premium' wp-content/themes/nuvanx-medical/inc/data/*.json" || status=$?
          case "$status" in
            0) echo 'Content hygiene failed: banned phrases remain.' >&2; exit 1 ;;
            1) echo 'CONTENT_HYGIENE=PASS' ;;
            *) echo "Content hygiene grep error: $status" >&2; exit 1 ;;
          esac

      - name: Verify Block A public boundary
        shell: bash
        run: |
          set -euo pipefail
          pass=0
          for attempt in 1 2 3 4 5 6; do
            echo "Boundary attempt ${attempt}/6"
            if node scripts/staging2/verify-staging-boundary.mjs; then
              pass=1
              break
            fi
            sleep 5
          done
          test "$pass" = 1

      - name: Validate page template references
        shell: bash
        env:
          WORDPRESS_URL: https://staging2.nuvanx.com
        run: |
          set -euo pipefail
          node scripts/validate-page-templates.mjs

      - name: Verify production unchanged read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-staging2 "PROD_ROOT='$PROD_ROOT' bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$PROD_ROOT"
          test "$(wp config get DB_NAME)" = 'db0ecrycwv2tgb'
          test "$(wp option get home)" = 'https://nuvanx.com'
          test "$(wp option get siteurl)" = 'https://nuvanx.com'
          test "$(wp option get blog_public)" = '1'
          test "$(wp theme list --status=active --field=name)" = 'nuvanx-medical'
          echo 'PRODUCTION_UNCHANGED=PASS'
          REMOTE

      - name: Roll back staging after failed deployment validation
        if: ${{ failure() && env.STAGING_SNAPSHOT_READY == '1' && env.STAGING_MUTATION_ARMED == '1' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "ROLLBACK_TRIGGERED source=$ROLLBACK_DIR"
          ssh nvx-staging2 "WP_ROOT='$WP_ROOT' ROLLBACK_DIR='$ROLLBACK_DIR' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          [[ "$ROLLBACK_DIR" == '/home/customer/www/staging2.nuvanx.com/.nvx-rollback/'* ]]
          test -s "$ROLLBACK_DIR/theme.tgz"
          test -s "$ROLLBACK_DIR/staging-db.sql"
          rm -rf "$WP_ROOT/wp-content/themes/nuvanx-medical"
          tar -xzf "$ROLLBACK_DIR/theme.tgz" -C "$WP_ROOT"
          if [[ -f "$ROLLBACK_DIR/mu-plugins.tgz" ]]; then
            rm -rf "$WP_ROOT/wp-content/mu-plugins"
            tar -xzf "$ROLLBACK_DIR/mu-plugins.tgz" -C "$WP_ROOT"
          fi
          cd "$WP_ROOT"
          wp db import "$ROLLBACK_DIR/staging-db.sql"
          wp cache flush
          plugin_slug='sg-cachepress'
          if wp plugin is-installed "$plugin_slug" >/dev/null 2>&1; then
            was_active=0
            if wp plugin is-active "$plugin_slug" >/dev/null 2>&1; then
              was_active=1
            else
              wp plugin activate "$plugin_slug" --quiet
            fi
            wp sg purge || true
            if [[ "$was_active" -eq 0 ]]; then
              wp plugin deactivate "$plugin_slug" --quiet || true
            fi
          fi
          rm -rf wp-content/uploads/siteground-optimizer-assets/siteground-optimizer-combined-* wp-content/cache/sgo-cache/* wp-content/cache/*
          wp eval 'if (function_exists("opcache_reset")) { opcache_reset(); }' || true
          test "$(wp config get DB_NAME)" = 'dbshcocboodiwr'
          test "$(wp option get home)" = 'https://staging2.nuvanx.com'
          test "$(wp option get siteurl)" = 'https://staging2.nuvanx.com'
          test "$(wp option get blog_public)" = '0'
          expected_previous="$(cat "$ROLLBACK_DIR/previous-sha.txt" 2>/dev/null || true)"
          if [[ -n "$expected_previous" ]]; then
            restored="$(tr -d '\r\n' < wp-content/themes/nuvanx-medical/.nvx-deploy-sha)"
            test "$restored" = "$expected_previous"
            echo "ROLLBACK_RESTORED_SHA=$restored"
          fi
          echo 'ROLLBACK_STAGING=PASS'
          REMOTE

      - name: Upload Block A boundary evidence
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: staging2-boundary-${{ inputs.sha }}
          path: scripts/staging2/artifacts/staging2-boundary.json
          retention-days: 14
          if-no-files-found: error

      - name: Remove temporary remote payload
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${REMOTE_RELEASE:-}" ]] && [[ -f "$HOME/.ssh/config" ]]; then
            ssh nvx-staging2 "rm -rf '$REMOTE_RELEASE'" || true
          fi

      - name: Remove successful rollback snapshot
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ROLLBACK_DIR:-}" ]]; then
            ssh nvx-staging2 "case '$ROLLBACK_DIR' in '$STAGING_PARENT/.nvx-rollback/'*) rm -rf '$ROLLBACK_DIR' ;; *) exit 1 ;; esac"
          fi

      - name: Destroy SSH identity
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/staging2_key" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"

      - name: Write deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo '## Staging2 Block A deployment PASS'
            echo
            echo "- SHA: \`$DEPLOY_SHA\`"
            echo '- Boundary: five required routes stayed on staging2, HTTP 200, noindex/nofollow, exact HTML SHA'
            echo '- Isolation: staging filesystem/DB/environment verified before and after deployment'
            echo '- Failed post-deploy validations now trigger rollback of theme, MU plugins and staging DB snapshot'
            echo '- SiteGround Dynamic Cache: purged by transient Speed Optimizer activation and restored to inactive state'
            echo '- Production: read-only invariant verified unchanged'
            if [[ '${{ inputs.run_block_c_acceptance }}' == 'true' ]]; then
              echo '- Block C: requested and will run only after this deploy job succeeds'
            else
              echo '- Block C: not requested for this deployment'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  block_c_acceptance:
    name: Run Block C only after successful staging deploy
    needs: deploy
    if: ${{ inputs.run_block_c_acceptance }}
    uses: ./.github/workflows/staging2-acceptance.yml
    with:
      sha: ${{ inputs.sha }}
