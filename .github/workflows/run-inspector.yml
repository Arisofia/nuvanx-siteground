name: Run Inspector
run-name: Run Inspector · current master Staging

on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    if: ${{ github.head_ref == 'ops/inspect-active-staging-20260820' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Inspect current master Staging push
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow staging.yml --event push --branch master --limit 100 --json databaseId,status,conclusion,headSha,createdAt,updatedAt,url)"
          jq -c --arg sha "$TARGET_SHA" '.[] | select(.headSha == $sha)' <<<"$runs"
          run_id="$(jq -r --arg sha "$TARGET_SHA" '[.[] | select(.headSha == $sha)] | sort_by(.databaseId) | last | .databaseId // empty' <<<"$runs")"
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "::error::No Staging push run for $TARGET_SHA"; exit 1; }
          echo "CURRENT_MASTER_STAGING_RUN_ID=$run_id"
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,headSha,createdAt,updatedAt,jobs,url | jq -c '.'
