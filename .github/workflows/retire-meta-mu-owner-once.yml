name: Locate residual Meta browser writer once

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  locate:
    if: github.head_ref == 'ops/retire-meta-mu-owner-20260821'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROD_ROOT: /home/customer/www/nuvanx.com/public_html
      EXPECTED_MASTER_SHA: 79cea21ac3e6e8b64a4c48ae8137f0b0ddca23c8
    steps:
      - name: Check out operational branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Assert master unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin master
          test "$(git rev-parse origin/master)" = "$EXPECTED_MASTER_SHA"

      - name: Configure strict production SSH
        shell: bash
        env:
          NVX_SSH_ALIAS: nvx-prod
          NVX_SSH_KEY_BASENAME: prod_key
          PRIMARY_HOST: ${{ secrets.PROD_SSH_HOST }}
          PRIMARY_PORT: ${{ secrets.PROD_SSH_PORT }}
          PRIMARY_USER: ${{ secrets.PROD_SSH_USER }}
          PRIMARY_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PRIMARY_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          FALLBACK_HOST: ${{ secrets.STAGING2_SSH_HOST }}
          FALLBACK_PORT: ${{ secrets.STAGING2_SSH_PORT }}
          FALLBACK_USER: ${{ secrets.STAGING2_SSH_USER }}
          FALLBACK_KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          FALLBACK_KNOWN_HOSTS: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: bash scripts/production/configure-siteground-ssh.sh

      - name: Locate residual browser Meta writer owners read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-prod "PROD_ROOT='$PROD_ROOT' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$PROD_ROOT"
          echo 'META_OWNER_SCAN=START'
          find wp-content/mu-plugins wp-content/plugins wp-content/themes -type f \( -name '*.php' -o -name '*.js' -o -name '*.html' \) -size -3M -print0 2>/dev/null \
            | xargs -0 -r grep -IlE '(document\.cookie|cookie[[:space:]]*=|_fbp|_fbc|NVX_META_EVENT_DEDUPE_ACTIVE|nvx-meta-event-dedupe-)' 2>/dev/null \
            | sort -u \
            | while IFS= read -r file; do
                labels=''
                grep -Eq 'document\.cookie|cookie[[:space:]]*=' "$file" && labels="${labels}cookie_api," || true
                grep -Eq '_fbp' "$file" && labels="${labels}fbp," || true
                grep -Eq '_fbc' "$file" && labels="${labels}fbc," || true
                grep -Fq 'NVX_META_EVENT_DEDUPE_ACTIVE' "$file" && labels="${labels}dedupe_marker," || true
                grep -Fq 'nvx-meta-event-dedupe-' "$file" && labels="${labels}dedupe_prefix," || true
                printf 'META_OWNER_FILE path=%s patterns=%s\n' "$file" "${labels%,}"
              done

          wp eval '
          global $wpdb;
          $table = $wpdb->prefix . "snippets";
          $rows = $wpdb->get_results("SELECT id,name,active,code FROM {$table}", ARRAY_A);
          foreach ($rows as $row) {
            $code = (string)($row["code"] ?? "");
            $patterns = array();
            if (preg_match("~document\\.cookie|cookie\\s*=~i", $code)) $patterns[] = "cookie_api";
            if (stripos($code, "_fbp") !== false) $patterns[] = "fbp";
            if (stripos($code, "_fbc") !== false) $patterns[] = "fbc";
            if (strpos($code, "NVX_META_EVENT_DEDUPE_ACTIVE") !== false) $patterns[] = "dedupe_marker";
            if (strpos($code, "nvx-meta-event-dedupe-") !== false) $patterns[] = "dedupe_prefix";
            if ($patterns) {
              printf("META_OWNER_SNIPPET id=%d active=%d name=%s patterns=%s\n", (int)$row["id"], (int)$row["active"], preg_replace("~[^A-Za-z0-9 _.-]~", "", (string)$row["name"]), implode(",", $patterns));
            }
          }
          ' --skip-themes --allow-root
          echo 'META_OWNER_SCAN=END'
          REMOTE

      - name: Cleanup SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/prod_key" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"
