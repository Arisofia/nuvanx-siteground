name: Staging2 Password Location Probe

on:
  push:
    paths:
      - '.github/workflows/staging2-password-location-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment:
      name: staging2
    steps:
      - name: Check exact key without exposing value
        shell: bash
        env:
          FROM_SECRET: ${{ secrets.STAGING2_DB_PASSWORD }}
          FROM_VARIABLE: ${{ vars.STAGING2_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if test -n "$FROM_SECRET"; then echo 'STAGING2_DB_PASSWORD_as_secret=YES'; else echo 'STAGING2_DB_PASSWORD_as_secret=NO'; fi
          if test -n "$FROM_VARIABLE"; then echo 'STAGING2_DB_PASSWORD_as_variable=YES'; else echo 'STAGING2_DB_PASSWORD_as_variable=NO'; fi
