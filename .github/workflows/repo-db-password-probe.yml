name: Repository DB Password Probe

on:
  push:
    paths:
      - '.github/workflows/repo-db-password-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check DB_PASSWORD at repository scope
        shell: bash
        env:
          DB_PASSWORD_VALUE: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail
          if test -n "$DB_PASSWORD_VALUE"; then echo 'repository_DB_PASSWORD=YES'; else echo 'repository_DB_PASSWORD=NO'; fi
