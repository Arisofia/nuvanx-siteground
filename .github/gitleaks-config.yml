# Gitleaks configuration for historical secret scanning
# Based on auditor recommendation P1-3: scan Git history for secrets

title = "NUVANX Historical Secret Scanner"

[[rules]]
description = "SiteGround configuration files"
id = "siteground-configs"
regex = '''sgo-config\.php|sgs_encrypt_key\.php|source_site_wpconfig'''
tags = ["siteground", "config"]

[[rules]]
description = "WordPress salts and keys"
id = "wp-salts"
regex = '''AUTH_KEY|SECURE_AUTH_KEY|LOGGED_IN_KEY|NONCE_KEY|AUTH_SALT|SECURE_AUTH_SALT|LOGGED_IN_SALT|NONCE_SALT'''
tags = ["wordpress", "salts"]

[[rules]]
description = "Database passwords"
id = "db-password"
regex = '''DB_PASSWORD|database_password|db_pass'''
tags = ["database", "password"]

[[rules]]
description = "Private keys"
id = "private-keys"
regex = '''PRIVATE KEY|RSA PRIVATE KEY|BEGIN.*PRIVATE KEY'''
tags = ["ssh", "ssl", "keys"]

[[rules]]
description = "AWS credentials"
id = "aws-credentials"
regex = '''AKIA[0-9A-Z]{16}|aws_access_key_id|aws_secret_access_key'''
tags = ["aws", "credentials"]

[[rules]]
description = "GitHub tokens"
id = "github-tokens"
regex = '''ghp_[a-zA-Z0-9]{36}|github_token|GITHUB_TOKEN'''
tags = ["github", "tokens"]

[[rules]]
description = "OAuth tokens"
id = "oauth-tokens"
regex = '''oauth_token|access_token|bearer_token|API_KEY|api_key'''
tags = ["oauth", "tokens"]

[[allowlist]]
description = "Ignore vendor and node_modules"
paths = [
  '''vendor/''',
  '''node_modules/''',
  '''\.git/'''
]

[[allowlist]]
description = "Ignore test files and documentation"
paths = [
  '''tests/''',
  '''\.md$''',
  '''\.txt$'''
]
