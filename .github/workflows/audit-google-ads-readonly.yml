name: Google Ads Read-only Credential Audit

on:
  push:
    branches:
      - audit/google-ads-readonly-20260809
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list-campaigns:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/seo/package-lock.json
      - run: npm ci --ignore-scripts --prefix scripts/seo
      - name: Classify configured credential schema safely
        continue-on-error: true
        env:
          GOOGLE_ADS_JSON: ${{ secrets.GOOGLE_ADS_JSON }}
        run: node scripts/seo/classify-google-credential.js
      - name: Report separate credential presence only
        env:
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${GOOGLE_ADS_DEVELOPER_TOKEN:-}" ]] && echo 'DEVELOPER_TOKEN_PRESENT=true' || echo 'DEVELOPER_TOKEN_PRESENT=false'
          [[ -n "${GOOGLE_ADS_CUSTOMER_ID:-}" ]] && echo 'CUSTOMER_ID_PRESENT=true' || echo 'CUSTOMER_ID_PRESENT=false'
          [[ -n "${GOOGLE_ADS_LOGIN_CUSTOMER_ID:-}" ]] && echo 'LOGIN_CUSTOMER_ID_PRESENT=true' || echo 'LOGIN_CUSTOMER_ID_PRESENT=false'
          [[ -n "${GOOGLE_ADS_REFRESH_TOKEN:-}" ]] && echo 'REFRESH_TOKEN_PRESENT=true' || echo 'REFRESH_TOKEN_PRESENT=false'
      - name: Validate Google Ads using OAuth client JSON
        env:
          GOOGLE_ADS_JSON: ${{ secrets.GOOGLE_ADS_JSON }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
        run: node scripts/seo/google-ads-list-campaigns.js
