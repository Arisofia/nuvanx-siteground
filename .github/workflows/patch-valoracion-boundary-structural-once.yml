name: Patch valoracion boundary structural once

on:
  push:
    branches:
      - fix/production-boundary-structural-valoracion-20260820
    paths:
      - scripts/patch-valoracion-boundary-structural-once.py
      - .github/workflows/patch-valoracion-boundary-structural-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/production-boundary-structural-valoracion-20260820
          fetch-depth: 0
          persist-credentials: true
      - name: Apply structural boundary fix and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-valoracion-boundary-structural-once.py
          node --check scripts/production/valoracion-form-contract.mjs
          node --check scripts/production/test-valoracion-form-contract.mjs
          node --check scripts/production/verify-production-boundary.mjs
          node scripts/production/test-valoracion-form-contract.mjs
          bash -n scripts/ci/test-release-regression-contract.sh
          bash scripts/ci/test-release-regression-contract.sh
          git diff --check
      - name: Commit target files only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Arisofia'
          git config user.email '246412546+Arisofia@users.noreply.github.com'
          git add \
            scripts/production/verify-production-boundary.mjs \
            scripts/production/valoracion-form-contract.mjs \
            scripts/production/test-valoracion-form-contract.mjs \
            scripts/ci/test-release-regression-contract.sh
          git diff --cached --quiet && { echo 'No target changes to commit' >&2; exit 1; }
          git commit -m 'fix(release): detect legacy valoracion form structurally'
          git push origin HEAD:fix/production-boundary-structural-valoracion-20260820
