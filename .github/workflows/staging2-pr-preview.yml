name: Staging2 PR Preview Gate

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: staging2-pr-preview
  cancel-in-progress: false

jobs:
  preview:
    name: Deploy labeled same-repo PR to Staging2 and run acceptance
    if: >-
      github.event.label.name == 'deploy-staging2' &&
      github.event.pull_request.base.ref == 'master' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_URL: https://staging2.nuvanx.com
      EXPECTED_HOST: staging2.nuvanx.com
      STAGING_ROOT: /home/customer/www/staging2.nuvanx.com/public_html
      STAGING_PARENT: /home/customer/www/staging2.nuvanx.com
      PROD_ROOT: /home/customer/www/nuvanx.com/public_html
      CI: true

    steps:
      - name: Check out trusted master tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Validate labeled PR candidate boundary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$PR_SHA" =~ ^[0-9a-f]{40}$ ]]

          git fetch --no-tags origin master
          git fetch --no-tags origin "pull/${PR_NUMBER}/head:refs/remotes/origin/nvx-pr-preview"
          test "$(git rev-parse refs/remotes/origin/nvx-pr-preview)" = "$PR_SHA"
          git merge-base --is-ancestor origin/master "$PR_SHA" || {
            echo 'PR preview requires the head SHA to contain current master. Rebase first.' >&2
            exit 1
          }

          mapfile -t changed < <(
            gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
              --jq '.[].filename' | sort -u
          )
          (( ${#changed[@]} > 0 )) || { echo 'PR has no changed files.' >&2; exit 1; }
          for file in "${changed[@]}"; do
            case "$file" in
              wp-content/themes/nuvanx-medical/*) ;;
              *)
                echo "PR preview refuses non-theme change: $file" >&2
                exit 1
                ;;
            esac
          done

          git diff --check origin/master "$PR_SHA"
          if git ls-tree -r "$PR_SHA" wp-content/themes/nuvanx-medical/ | awk '$1 == "120000" { found=1 } END { exit(found ? 0 : 1) }'; then
            echo 'PR preview refuses symlinks inside the theme.' >&2
            exit 1
          fi

          CANDIDATE_ROOT="$RUNNER_TEMP/nvx-pr-${PR_NUMBER}-${PR_SHA}"
          git worktree add --detach "$CANDIDATE_ROOT" "$PR_SHA"
          echo "CANDIDATE_ROOT=$CANDIDATE_ROOT" >> "$GITHUB_ENV"
          echo "EXPECTED_SHA=$PR_SHA" >> "$GITHUB_ENV"
          echo "PR_BOUNDARY=PASS sha=$PR_SHA files=${#changed[@]}"

      - name: Validate candidate syntax without executing candidate code
        shell: bash
        run: |
          set -euo pipefail
          find "$CANDIDATE_ROOT/wp-content/themes/nuvanx-medical" \
            -path '*/vendor' -prune -o -name '*.php' -type f -print0 \
            | xargs -0 -n1 php -l >/dev/null
          find "$CANDIDATE_ROOT/wp-content/themes/nuvanx-medical" \
            -name '*.js' -type f -print0 \
            | xargs -0 -n1 node --check >/dev/null
          echo 'CANDIDATE_SYNTAX=PASS'

      - name: Configure strict Staging2 SSH
        shell: bash
        env:
          HOST: ${{ secrets.STAGING2_SSH_HOST }}
          PORT: ${{ secrets.STAGING2_SSH_PORT }}
          USER: ${{ secrets.STAGING2_SSH_USER }}
          KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${HOST:?Missing STAGING2_SSH_HOST}"
          : "${USER:?Missing STAGING2_SSH_USER}"
          : "${KEY:?Missing STAGING2_SSH_PRIVATE_KEY}"
          : "${KH:?Missing STAGING2_SSH_KNOWN_HOSTS}"
          SSH_PORT="${PORT:-18765}"
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/staging2_pr_key"; chmod 600 "$HOME/.ssh/staging2_pr_key"
          printf '%s\n' "$KH" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx-staging2-pr
            HostName $HOST
            User $USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/staging2_pr_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 20
            ConnectionAttempts 5
            ServerAliveInterval 30
            ServerAliveCountMax 2
          EOF
          chmod 600 "$HOME/.ssh/config"
          ssh nvx-staging2-pr "test -d '$STAGING_ROOT' && test -f '$STAGING_ROOT/wp-config.php' && command -v wp >/dev/null && command -v rsync >/dev/null && command -v php >/dev/null"

      - name: Verify staging isolation before mutation
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-staging2-pr "STAGING_ROOT='$STAGING_ROOT' PROD_ROOT='$PROD_ROOT' bash -se" <<'REMOTE'
          set -euo pipefail
          test "$STAGING_ROOT" != "$PROD_ROOT"
          test "$(cd "$STAGING_ROOT" && wp config get DB_NAME)" = 'dbshcocboodiwr'
          test "$(cd "$PROD_ROOT" && wp config get DB_NAME)" = 'db0ecrycwv2tgb'
          test "$(cd "$STAGING_ROOT" && wp option get home)" = 'https://staging2.nuvanx.com'
          test "$(cd "$STAGING_ROOT" && wp option get siteurl)" = 'https://staging2.nuvanx.com'
          test "$(cd "$STAGING_ROOT" && wp option get blog_public)" = '0'
          test "$(cd "$STAGING_ROOT" && wp config get NVX_ENV)" = 'staging'
          test "$(cd "$STAGING_ROOT" && wp config get WP_ENVIRONMENT_TYPE)" = 'staging'
          if (cd "$STAGING_ROOT" && wp plugin is-active sg-cachepress); then
            echo 'Speed Optimizer must begin inactive on staging2.' >&2
            exit 1
          fi
          echo 'PR_PREFLIGHT_ISOLATION=PASS'
          REMOTE

      - name: Create rollback snapshot
        shell: bash
        run: |
          set -euo pipefail
          ROLLBACK_DIR="$STAGING_PARENT/.nvx-rollback/pr-${PR_NUMBER}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${PR_SHA}"
          [[ "$ROLLBACK_DIR" == "$STAGING_PARENT/.nvx-rollback/"* ]]
          echo "ROLLBACK_DIR=$ROLLBACK_DIR" >> "$GITHUB_ENV"
          ssh nvx-staging2-pr "STAGING_ROOT='$STAGING_ROOT' ROLLBACK_DIR='$ROLLBACK_DIR' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          mkdir -p "$ROLLBACK_DIR"
          test ! -e "$ROLLBACK_DIR/theme.tgz"
          tar -czf "$ROLLBACK_DIR/theme.tgz" -C "$STAGING_ROOT" wp-content/themes/nuvanx-medical
          if [[ -d "$STAGING_ROOT/wp-content/mu-plugins" ]]; then
            tar -czf "$ROLLBACK_DIR/mu-plugins.tgz" -C "$STAGING_ROOT" wp-content/mu-plugins
          fi
          cd "$STAGING_ROOT"
          wp db export "$ROLLBACK_DIR/staging-db.sql" --quiet
          test -s "$ROLLBACK_DIR/theme.tgz"
          test -s "$ROLLBACK_DIR/staging-db.sql"
          if [[ -f wp-content/themes/nuvanx-medical/.nvx-deploy-sha ]]; then
            tr -d '\r\n' < wp-content/themes/nuvanx-medical/.nvx-deploy-sha > "$ROLLBACK_DIR/previous-sha.txt"
          else
            : > "$ROLLBACK_DIR/previous-sha.txt"
          fi
          echo "PR_ROLLBACK_SNAPSHOT=PASS path=$ROLLBACK_DIR"
          REMOTE
          echo 'STAGING_SNAPSHOT_READY=1' >> "$GITHUB_ENV"

      - name: Upload candidate theme with trusted deployment tooling
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_RELEASE="$STAGING_ROOT/wp-content/.nuvanx-deployments/pr-${PR_NUMBER}-${PR_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "REMOTE_RELEASE=$REMOTE_RELEASE" >> "$GITHUB_ENV"
          ssh nvx-staging2-pr "mkdir -p '$REMOTE_RELEASE/theme'"
          rsync -az --delete \
            --exclude='.git' --exclude='php_errorlog' --exclude='*.log' \
            --exclude='_archive*' --exclude='_disabled*' --exclude='*.bak*' \
            "$CANDIDATE_ROOT/wp-content/themes/nuvanx-medical/" \
            "nvx-staging2-pr:$REMOTE_RELEASE/theme/"
          rsync -az tools/deploy/deploy-to-staging2.sh "nvx-staging2-pr:$REMOTE_RELEASE/deploy-to-staging2.sh"
          rsync -az tools/deploy/deploy-required-mu-plugins.sh "nvx-staging2-pr:$REMOTE_RELEASE/deploy-required-mu-plugins.sh"
          rsync -az tools/wp-cli/hygiene-content-fix.php "nvx-staging2-pr:$REMOTE_RELEASE/hygiene-content-fix.php"

      - name: Arm rollback before mutation
        shell: bash
        run: echo 'STAGING_MUTATION_ARMED=1' >> "$GITHUB_ENV"

      - name: Deploy PR candidate to Staging2
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-staging2-pr \
            "NUVANX_CONFIRM=yes bash '$REMOTE_RELEASE/deploy-to-staging2.sh' --wp-root '$STAGING_ROOT' --source-theme '$REMOTE_RELEASE/theme' --sha '$PR_SHA' --confirm && NUVANX_CONFIRM=yes bash '$REMOTE_RELEASE/deploy-required-mu-plugins.sh' --environment staging2 --wp-root '$STAGING_ROOT' --confirm"
          ssh nvx-staging2-pr "cd '$STAGING_ROOT' && wp eval-file '$REMOTE_RELEASE/hygiene-content-fix.php'"

      - name: Purge staging caches
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-staging2-pr "STAGING_ROOT='$STAGING_ROOT' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$STAGING_ROOT"
          wp cache flush
          plugin_slug='sg-cachepress'
          if ! wp plugin is-installed "$plugin_slug" >/dev/null 2>&1; then
            echo 'Speed Optimizer is not installed.' >&2
            exit 1
          fi
          if wp plugin is-active "$plugin_slug" >/dev/null 2>&1; then
            echo 'Speed Optimizer unexpectedly active before purge.' >&2
            exit 1
          fi
          restore_inactive() {
            set +e
            if wp plugin is-active "$plugin_slug" >/dev/null 2>&1; then
              wp plugin deactivate "$plugin_slug" --quiet || true
            fi
          }
          trap restore_inactive EXIT
          wp plugin activate "$plugin_slug" --quiet
          wp sg purge
          wp plugin deactivate "$plugin_slug" --quiet
          trap - EXIT
          rm -rf wp-content/uploads/siteground-optimizer-assets/siteground-optimizer-combined-* wp-content/cache/sgo-cache/* wp-content/cache/*
          wp eval 'if (function_exists("opcache_reset")) { opcache_reset(); }'
          echo 'PR_CACHE_PURGE=PASS'
          REMOTE

      - name: Verify exact PR SHA and environment identity
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-staging2-pr "STAGING_ROOT='$STAGING_ROOT' PR_SHA='$PR_SHA' bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$STAGING_ROOT"
          deployed="$(tr -d '\r\n' < wp-content/themes/nuvanx-medical/.nvx-deploy-sha)"
          test "$deployed" = "$PR_SHA"
          test "$(wp config get DB_NAME)" = 'dbshcocboodiwr'
          test "$(wp option get home)" = 'https://staging2.nuvanx.com'
          test "$(wp option get siteurl)" = 'https://staging2.nuvanx.com'
          test "$(wp option get blog_public)" = '0'
          test "$(wp config get NVX_ENV)" = 'staging'
          test "$(wp config get WP_ENVIRONMENT_TYPE)" = 'staging'
          test "$(wp theme list --status=active --field=name)" = 'nuvanx-medical'
          if wp plugin is-active sg-cachepress; then
            echo 'Speed Optimizer remained active after purge.' >&2
            exit 1
          fi
          echo "PR_STAGING_IDENTITY=PASS sha=$deployed"
          REMOTE

      - name: Verify public boundary
        shell: bash
        run: |
          set -euo pipefail
          pass=0
          for attempt in {1..12}; do
            echo "Boundary attempt ${attempt}/12"
            if EXPECTED_SHA="$PR_SHA" BASE_URL="$BASE_URL" node scripts/staging2/verify-staging-boundary.mjs; then
              pass=1
              break
            fi
            sleep 10
          done
          test "$pass" = 1

      - name: Set up Playwright acceptance dependencies
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scripts/staging2/package-lock.json

      - name: Install scoped acceptance dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd scripts/staging2
          npm ci --ignore-scripts
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run canonical Block C and valoración placement
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="$PR_SHA" BASE_URL="$BASE_URL" node scripts/staging2/block-c-52x3.mjs
          EXPECTED_SHA="$PR_SHA" BASE_URL="$BASE_URL" node scripts/staging2/valoracion-placement.mjs

      - name: Validate Google click-id bridge and HubSpot hidden fields
        shell: bash
        run: |
          set -euo pipefail
          cd scripts/staging2
          BASE_URL="$BASE_URL" node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const base = process.env.BASE_URL.replace(/\/$/, '');
          const formId = '5042522a-0bc5-4381-ac3e-5aee8649b69c';
          const values = {
            gclid: 'NVXQA_GCLID_20260808',
            gbraid: 'NVXQA_GBRAID_20260808',
            wbraid: 'NVXQA_WBRAID_20260808',
            gclsrc: 'NVXQA_GCLSRC_20260808',
          };
          const aliases = {
            hs_google_click_id: values.gclid,
            nvx_google_click_id: values.gclid,
            nvx_google_braid: values.gbraid,
            nvx_google_wbraid: values.wbraid,
            nvx_google_gclsrc: values.gclsrc,
          };
          const requiredHidden = {
            nvx_google_click_id: values.gclid,
            nvx_google_braid: values.gbraid,
            nvx_google_wbraid: values.wbraid,
            nvx_google_gclsrc: values.gclsrc,
          };

          const browser = await chromium.launch({ headless: true, args: ['--no-sandbox'] });
          try {
            const context = await browser.newContext({ ignoreHTTPSErrors: true });
            const page = await context.newPage();
            const query = new URLSearchParams(values).toString();
            const response = await page.goto(`${base}/madrid/valoracion/?${query}`, {
              waitUntil: 'domcontentloaded',
              timeout: 40000,
            });
            if (!response || response.status() !== 200) throw new Error(`bridge route HTTP ${response?.status() || 0}`);
            await page.waitForLoadState('load').catch(() => {});
            await page.waitForTimeout(2500);

            const parentState = await page.evaluate((expected) => {
              const current = new URL(window.location.href);
              return {
                scriptCount: Array.from(document.scripts).filter((script) => (script.src || '').includes('nvx-google-click-bridge.js')).length,
                aliases: Object.fromEntries(Object.keys(expected).map((key) => [key, current.searchParams.get(key)])),
              };
            }, aliases);
            if (parentState.scriptCount !== 1) throw new Error(`click-id bridge script count=${parentState.scriptCount}`);
            for (const [name, expected] of Object.entries(aliases)) {
              if (parentState.aliases[name] !== expected) throw new Error(`URL alias ${name} missing or mismatched`);
            }

            await page.locator(`#nvx-hubspot-form iframe[data-test-id*="${formId}"]`).first().waitFor({ state: 'attached', timeout: 15000 });
            const frame = page.frames().find((candidate) => candidate.url().includes(formId));
            if (!frame) throw new Error('canonical HubSpot form iframe not found');
            await frame.waitForLoadState('domcontentloaded').catch(() => {});
            await page.waitForTimeout(1200);

            for (const [property, expected] of Object.entries(requiredHidden)) {
              const locator = frame.locator(`input[name="${property}"], input[name="0-1/${property}"]`).first();
              if ((await locator.count()) === 0) throw new Error(`HubSpot hidden property missing from form: ${property}`);
              const actual = await locator.inputValue();
              if (actual !== expected) throw new Error(`HubSpot hidden property ${property}=${actual || '<empty>'}, expected ${expected}`);
            }

            const nativeGclid = frame.locator('input[name="hs_google_click_id"], input[name="0-1/hs_google_click_id"]').first();
            if ((await nativeGclid.count()) > 0) {
              const actualNative = await nativeGclid.inputValue();
              if (actualNative !== values.gclid) throw new Error(`HubSpot native GCLID=${actualNative || '<empty>'}, expected ${values.gclid}`);
            }

            const cleanPage = await context.newPage();
            const cleanResponse = await cleanPage.goto(`${base}/madrid/valoracion/`, { waitUntil: 'domcontentloaded', timeout: 40000 });
            if (!cleanResponse || cleanResponse.status() !== 200) throw new Error(`clean route HTTP ${cleanResponse?.status() || 0}`);
            const cleanCount = await cleanPage.evaluate(() => Array.from(document.scripts).filter((script) => (script.src || '').includes('nvx-google-click-bridge.js')).length);
            if (cleanCount !== 0) throw new Error(`click-id bridge loaded without Google click parameters: count=${cleanCount}`);

            const conversionCount = await cleanPage.evaluate((id) => {
              let count = 0;
              document.addEventListener('nvx:conversion-event', (event) => {
                if (event.detail?.event_name === 'generate_lead') count += 1;
              });
              window.dispatchEvent(new CustomEvent('hs-form-event:on-submission:success', { detail: { formId: id } }));
              window.dispatchEvent(new MessageEvent('message', {
                origin: 'https://forms-eu1.hsforms.com',
                data: { type: 'hsFormCallback', eventName: 'onFormSubmitted', id },
              }));
              return count;
            }, formId);
            if (conversionCount !== 1) throw new Error(`generate_lead dedupe count=${conversionCount}, expected 1`);

            console.log('GOOGLE_CLICK_BRIDGE_RUNTIME=PASS');
            console.log('HUBSPOT_HIDDEN_FIELDS=PASS');
            console.log('GENERATE_LEAD_DEDUPE=PASS count=1');
            await context.close();
          } finally {
            await browser.close();
          }
          NODE

      - name: Verify production unchanged read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-staging2-pr "PROD_ROOT='$PROD_ROOT' bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$PROD_ROOT"
          test "$(wp config get DB_NAME)" = 'db0ecrycwv2tgb'
          test "$(wp option get home)" = 'https://nuvanx.com'
          test "$(wp option get siteurl)" = 'https://nuvanx.com'
          test "$(wp option get blog_public)" = '1'
          test "$(wp theme list --status=active --field=name)" = 'nuvanx-medical'
          echo 'PR_PREVIEW_PRODUCTION_UNCHANGED=PASS'
          REMOTE

      - name: Upload PR preview acceptance evidence
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: staging2-pr-preview-${{ env.PR_NUMBER }}-${{ env.PR_SHA }}
          path: |
            scripts/staging2/artifacts/
            scripts/staging2/valoracion-artifacts/
          retention-days: 14
          if-no-files-found: warn

      - name: Roll back failed PR preview
        if: ${{ failure() && env.STAGING_SNAPSHOT_READY == '1' && env.STAGING_MUTATION_ARMED == '1' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "PR_ROLLBACK_TRIGGERED source=$ROLLBACK_DIR"
          ssh nvx-staging2-pr "STAGING_ROOT='$STAGING_ROOT' ROLLBACK_DIR='$ROLLBACK_DIR' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          [[ "$ROLLBACK_DIR" == '/home/customer/www/staging2.nuvanx.com/.nvx-rollback/'* ]]
          test -s "$ROLLBACK_DIR/theme.tgz"
          test -s "$ROLLBACK_DIR/staging-db.sql"
          rm -rf "$STAGING_ROOT/wp-content/themes/nuvanx-medical"
          tar -xzf "$ROLLBACK_DIR/theme.tgz" -C "$STAGING_ROOT"
          if [[ -f "$ROLLBACK_DIR/mu-plugins.tgz" ]]; then
            rm -rf "$STAGING_ROOT/wp-content/mu-plugins"
            tar -xzf "$ROLLBACK_DIR/mu-plugins.tgz" -C "$STAGING_ROOT"
          fi
          cd "$STAGING_ROOT"
          wp db import "$ROLLBACK_DIR/staging-db.sql"
          wp cache flush
          plugin_slug='sg-cachepress'
          if wp plugin is-installed "$plugin_slug" >/dev/null 2>&1; then
            if ! wp plugin is-active "$plugin_slug" >/dev/null 2>&1; then
              wp plugin activate "$plugin_slug" --quiet || true
            fi
            wp sg purge || true
            wp plugin deactivate "$plugin_slug" --quiet || true
          fi
          rm -rf wp-content/uploads/siteground-optimizer-assets/siteground-optimizer-combined-* wp-content/cache/sgo-cache/* wp-content/cache/*
          wp eval 'if (function_exists("opcache_reset")) { opcache_reset(); }' || true
          previous="$(cat "$ROLLBACK_DIR/previous-sha.txt" 2>/dev/null || true)"
          if [[ -n "$previous" ]]; then
            restored="$(tr -d '\r\n' < wp-content/themes/nuvanx-medical/.nvx-deploy-sha)"
            test "$restored" = "$previous"
            echo "PR_ROLLBACK_RESTORED_SHA=$restored"
          fi
          echo 'PR_ROLLBACK_STAGING=PASS'
          REMOTE

      - name: Remove temporary remote payload and successful snapshot
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -f "$HOME/.ssh/config" ]]; then
            if [[ -n "${REMOTE_RELEASE:-}" ]]; then
              ssh nvx-staging2-pr "rm -rf '$REMOTE_RELEASE'" || true
            fi
            if [[ "${STAGING_SNAPSHOT_READY:-0}" == '1' && "${STAGING_MUTATION_ARMED:-0}" == '1' && "${{ job.status }}" == 'success' && -n "${ROLLBACK_DIR:-}" ]]; then
              ssh nvx-staging2-pr "case '$ROLLBACK_DIR' in '$STAGING_PARENT/.nvx-rollback/'*) rm -rf '$ROLLBACK_DIR' ;; *) exit 1 ;; esac" || true
            fi
          fi

      - name: Destroy SSH identity
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/staging2_pr_key" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"

      - name: Write PR preview summary
        if: success()
        shell: bash
        run: |
          {
            echo '## Staging2 PR preview PASS'
            echo
            echo "- PR: #$PR_NUMBER"
            echo "- SHA: \`$PR_SHA\`"
            echo '- Candidate boundary: same repository, current master ancestor, theme-only diff, no symlinks'
            echo '- Staging isolation and rollback snapshot: PASS'
            echo '- Canonical Block C + valoración placement: PASS'
            echo '- Google click-id URL aliases + HubSpot hidden properties: PASS'
            echo '- generate_lead dual-event dedupe: exactly once'
            echo '- Production: read-only invariants verified unchanged'
            echo '- This preview artifact is intentionally not a production-eligible Block C artifact'
          } >> "$GITHUB_STEP_SUMMARY"
