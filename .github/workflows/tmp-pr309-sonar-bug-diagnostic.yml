name: Fix PR 309 Sonar stub signatures once

on:
  pull_request:
    branches:
      - master
    paths:
      - scripts/theme-hygiene/trigger-pr309-sonar-bug-diagnostic.txt

concurrency:
  group: pr309-sonar-stub-fix
  cancel-in-progress: true

jobs:
  fix:
    name: Align WordPress test stubs
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: refactor/sonar-legacy-duplication-phase2-20260731
          fetch-depth: 0
          persist-credentials: true

      - name: Correct WordPress stub signatures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/theme-hygiene/test-catalog-json-runtime-contract.php')
          source = path.read_text(encoding='utf-8')
          old = '''function get_page_by_path(string $path) {
              return null;
          }

          function get_permalink($page): string {
              return '';
          }
          '''
          new = '''function get_page_by_path(string $path, $output = 'OBJECT', $post_type = 'page') {
              return null;
          }

          function get_permalink($page = 0, bool $leavename = false): string {
              return '';
          }
          '''
          if source.count(old) != 1:
              raise SystemExit(f'Expected one stub signature block, found {source.count(old)}')
          source = source.replace(old, new, 1)

          anchor = '''function nvx_contract_assert_no_tokens($value, string $path = 'catalog'): void {
          '''
          contract = '''$pageByPathReflection = new ReflectionFunction('get_page_by_path');
          nvx_contract_assert(
              3 === $pageByPathReflection->getNumberOfParameters()
                  && 1 === $pageByPathReflection->getNumberOfRequiredParameters(),
              'get_page_by_path() test stub must match the WordPress callable arity.'
          );

          $permalinkReflection = new ReflectionFunction('get_permalink');
          nvx_contract_assert(
              2 === $permalinkReflection->getNumberOfParameters()
                  && 0 === $permalinkReflection->getNumberOfRequiredParameters(),
              'get_permalink() test stub must preserve optional WordPress arguments.'
          );

          '''
          if contract not in source:
              if source.count(anchor) != 1:
                  raise SystemExit('Contract insertion point not found')
              source = source.replace(anchor, contract + anchor, 1)

          path.write_text(source, encoding='utf-8')
          PY

      - name: Validate runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          php -l scripts/theme-hygiene/test-catalog-json-runtime-contract.php
          php scripts/theme-hygiene/test-catalog-json-runtime-contract.php
          php scripts/theme-hygiene/test-catalog-json-contract.php
          php scripts/theme-hygiene/test-catalog-review-contract.php
          php scripts/theme-hygiene/test-page-render-helpers.php
          node scripts/theme-hygiene/test-theme-hygiene.mjs

      - name: Publish stub correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add scripts/theme-hygiene/test-catalog-json-runtime-contract.php
          git commit -m "fix(sonar): align WordPress test stub signatures"
          git push origin HEAD:refactor/sonar-legacy-duplication-phase2-20260731
