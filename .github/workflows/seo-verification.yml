name: SEO Verification - Search Console & PageSpeed

on:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
  workflow_run:
    workflows:
      - Production SEO GEO Origin Audit
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: seo-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pagespeed-mobile-audit:
    name: PageSpeed Mobile Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Audit Mobile PageSpeed & Core Web Vitals
        shell: bash
        env:
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY || secrets.GOOGLE_API_KEY }}
          BASE_URL: https://nuvanx.com
        run: |
          set -euo pipefail
          echo "Running PageSpeed Mobile Audit on $BASE_URL..."
          
          API_URL="https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=${BASE_URL}&strategy=mobile"
          if [[ -n "${PAGESPEED_API_KEY:-}" ]]; then
            API_URL="${API_URL}&key=${PAGESPEED_API_KEY}"
            echo "Using configured PAGESPEED_API_KEY secret."
          else
            echo "::warning::No PAGESPEED_API_KEY / GOOGLE_API_KEY secret found. Using unauthenticated public endpoint."
          fi

          RESPONSE=$(curl -sSL --max-time 45 --retry 3 --retry-delay 2 "$API_URL" || echo "")
          
          if [[ -z "$RESPONSE" ]]; then
            echo "::warning::PageSpeed API request timed out or returned empty response."
            exit 0
          fi

          if echo "$RESPONSE" | grep -q '"error"'; then
            ERR_MSG=$(echo "$RESPONSE" | grep -o '"message": "[^"]*"' | head -n 1 | cut -d'"' -f4 || echo "API Error")
            ERR_REASON=$(echo "$RESPONSE" | grep -o '"reason": "[^"]*"' | head -n 1 | cut -d'"' -f4 || echo "Unknown")
            echo "::warning::PageSpeed API returned an error ($ERR_REASON): $ERR_MSG"
            echo "## PageSpeed Mobile Audit (Notice)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Status: Warning ($ERR_REASON)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Message: $ERR_MSG" >> "$GITHUB_STEP_SUMMARY"
            echo "- Action Required: Configure a valid PAGESPEED_API_KEY in Repository Secrets." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          SCORE=$(echo "$RESPONSE" | grep -o '"score": [0-9.]*' | head -n 1 | awk '{print $2}' || echo "N/A")
          if [[ "$SCORE" != "N/A" ]]; then
            PCT=$(awk "BEGIN {print int($SCORE * 100)}")
            echo "PAGESPEED_MOBILE_PERFORMANCE_SCORE=$PCT"
            echo "## PageSpeed Mobile Audit" >> "$GITHUB_STEP_SUMMARY"
            echo "- Strategy: Mobile" >> "$GITHUB_STEP_SUMMARY"
            echo "- Target: $BASE_URL" >> "$GITHUB_STEP_SUMMARY"
            echo "- Performance Score: ${PCT}/100" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Could not parse performance score from PageSpeed API response."
          fi

  sitemap-status:
    name: Sitemap Status Verification
    runs-on: ubuntu-latest
    needs: pagespeed-mobile-audit
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Sitemap Accessibility & Indexing Status
        shell: bash
        env:
          BASE_URL: https://nuvanx.com
        run: |
          set -euo pipefail
          echo "Checking sitemap index at $BASE_URL/sitemap_index.xml..."
          HTTP_CODE=$(curl -o /dev/null -s -w "%{http_code}" --max-time 45 --retry 3 --retry-delay 2 "$BASE_URL/sitemap_index.xml" || echo "000")
          if [[ "$HTTP_CODE" -eq 200 ]]; then
            echo "SITEMAP_STATUS=PASS (HTTP 200)"
          else
            echo "::warning::Sitemap returned HTTP status $HTTP_CODE"
            echo "SITEMAP_STATUS=WARNING_HTTP_$HTTP_CODE"
          fi

  search-console-verification:
    name: Search Console Verification
    runs-on: ubuntu-latest
    needs: sitemap-status
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Search Console Metadata & Directives
        shell: bash
        env:
          BASE_URL: https://nuvanx.com
        run: |
          set -euo pipefail
          echo "Verifying SEO metadata on $BASE_URL..."
          curl -fsSL --max-time 45 --retry 3 --retry-delay 2 "$BASE_URL" -o index.html || echo "::warning::Failed to fetch $BASE_URL"
          if [[ -f index.html ]]; then
            grep -i '<meta name="robots"' index.html || echo "::warning::No robots meta tag found"
            grep -i 'rel="canonical"' index.html || echo "::warning::No canonical tag found"
          fi

  index-all-pages:
    name: Index All Pages via Search Console
    runs-on: ubuntu-latest
    needs: search-console-verification
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install SEO script dependencies
        run: |
          cd scripts/seo
          npm install

      - name: Index All Pages via Search Console
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS || secrets.GOOGLE_ADS_JSON }}
          SEARCH_CONSOLE_PROPERTY: ${{ secrets.SEARCH_CONSOLE_PROPERTY }}
          BASE_URL: https://nuvanx.com
        run: |
          set -euo pipefail
          
          CREDS="${GOOGLE_APPLICATION_CREDENTIALS:-}"
          if [[ -z "$CREDS" || "$CREDS" == *"{{"* ]]; then
            echo "::warning::GOOGLE_APPLICATION_CREDENTIALS / GOOGLE_ADS_JSON secret is missing or empty."
            echo "To enable Search Console indexing, configure the required secret in Repository Secrets."
            exit 0
          fi
          
          SEARCH_PROP="${SEARCH_CONSOLE_PROPERTY:-$BASE_URL}"
          
          mkdir -p scripts/seo/artifacts
          
          # Write credentials to file
          echo "$CREDS" > scripts/seo/credentials.json
          
          # Run page indexing
          cd scripts/seo
          node index-pages.js \
            --property "$SEARCH_PROP" \
            --url "$BASE_URL" \
            | tee artifacts/index-pages.log
