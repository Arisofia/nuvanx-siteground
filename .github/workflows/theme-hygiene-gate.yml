name: Theme Hygiene Gate

on:
  push:
    branches:
      - master
    paths:
      - 'wp-content/themes/nuvanx-medical/**'
      - 'scripts/theme-hygiene/**'
      - 'scripts/staging2/verify-rendered-document.mjs'
      - 'tools/deploy/deploy-to-staging2.sh'
      - 'docs/operations/global-document-governance*.md'
      - '.github/workflows/theme-hygiene-gate.yml'
      - '.github/workflows/deploy-staging2.yml'
      - '.github/workflows/staging2-rendered-acceptance.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'wp-content/themes/nuvanx-medical/**'
      - 'scripts/theme-hygiene/**'
      - 'scripts/staging2/verify-rendered-document.mjs'
      - 'tools/deploy/deploy-to-staging2.sh'
      - 'docs/operations/global-document-governance*.md'
      - '.github/workflows/theme-hygiene-gate.yml'
      - '.github/workflows/deploy-staging2.yml'
      - '.github/workflows/staging2-rendered-acceptance.yml'
  workflow_dispatch:

concurrency:
  group: theme-hygiene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Lint workflows and runtime entrypoints
        run: |
          set -euo pipefail
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 \
            .github/workflows/theme-hygiene-gate.yml \
            .github/workflows/deploy-staging2.yml \
            .github/workflows/staging2-rendered-acceptance.yml
          bash -n tools/deploy/deploy-to-staging2.sh
          node --check scripts/theme-hygiene/test-theme-hygiene.mjs
          node --check scripts/staging2/verify-rendered-document.mjs
          node --check wp-content/themes/nuvanx-medical/assets/js/nvx-main.js
          node --check wp-content/themes/nuvanx-medical/assets/js/nvx-runtime-governance.js

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f
        with:
          php-version: '8.2'
          coverage: none
          tools: none

      - name: Lint all theme PHP
        run: |
          set -euo pipefail
          find wp-content/themes/nuvanx-medical -type f -name '*.php' -print0 \
            | xargs -0 -n 1 php -l

      - name: Validate runtime contracts
        run: |
          set -euo pipefail
          php scripts/theme-hygiene/test-catalog-json-contract.php
          php scripts/theme-hygiene/test-catalog-json-runtime-contract.php
          php scripts/theme-hygiene/test-catalog-review-contract.php
          php scripts/theme-hygiene/test-page-render-helpers.php
          php scripts/theme-hygiene/test-valoracion-form-contract.php
          php scripts/theme-hygiene/test-document-governance.php
          php scripts/theme-hygiene/test-staging2-rendered-acceptance-contract.php
          php scripts/theme-hygiene/test-global-governance-doc.php
          php scripts/theme-hygiene/test-global-governance-checklist.php
          php scripts/theme-hygiene/generate-catalog-i18n-source.php > /tmp/nvx-catalog-i18n.php
          php -l /tmp/nvx-catalog-i18n.php
          php scripts/theme-hygiene/test-catalog-i18n-source-contract.php /tmp/nvx-catalog-i18n.php

      - name: Enforce canonical theme hygiene
        run: node scripts/theme-hygiene/test-theme-hygiene.mjs

      - name: Upload hygiene findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: theme-hygiene-findings
          path: theme-hygiene-report.txt
          retention-days: 14
          if-no-files-found: error
