name: Sonar health audit once

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/sonar-health-audit-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'refactor/sonar-duplication-20260731' || github.ref_name == 'refactor/sonar-duplication-20260731'
    runs-on: ubuntu-24.04
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://sonarcloud.io
      TARGET_BRANCH: refactor/sonar-duplication-20260731
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Inventory analysis and test configuration
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '=== TOP LEVEL ==='
            find . -maxdepth 2 -type f -not -path './.git/*' | sort | sed 's#^./##' | head -400
            echo
            echo '=== ANALYSIS CONFIG ==='
            find . -type f \( -iname '*sonar*' -o -name 'phpunit.xml*' -o -name 'composer.json' -o -name 'package.json' -o -name 'vitest.config.*' -o -name 'jest.config.*' -o -name '.nycrc*' -o -name 'playwright.config.*' \) -not -path './.git/*' | sort
            echo
            echo '=== TEST SOURCES ==='
            find . -type f \( -path '*/test/*' -o -path '*/tests/*' -o -iname '*test*.php' -o -iname '*.test.mjs' -o -iname '*.spec.mjs' -o -iname '*.test.js' -o -iname '*.spec.js' \) -not -path './.git/*' | sort | head -500
            echo
            echo '=== COVERAGE REFERENCES ==='
            grep -RInE --exclude-dir=.git --exclude='sonar-health-audit-once.yml' 'coverage|lcov|clover|phpunit|vitest|jest|nyc|c8|sonar\.' . | head -500 || true
          } | tee sonar-repo-inventory.txt

      - name: Query Sonar project health
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee sonar-health-audit.json
          from __future__ import annotations

          import base64
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          from collections import Counter, defaultdict

          host = os.environ.get('SONAR_HOST_URL', 'https://sonarcloud.io').rstrip('/')
          token = os.environ.get('SONAR_TOKEN', '').strip()
          target_branch = os.environ.get('TARGET_BRANCH', '')

          def request(path: str, params: dict | None = None):
              query = urllib.parse.urlencode(params or {}, doseq=True)
              url = f'{host}{path}' + (f'?{query}' if query else '')
              headers = {'Accept': 'application/json'}
              if token:
                  headers['Authorization'] = 'Basic ' + base64.b64encode(f'{token}:'.encode()).decode()
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return response.status, json.loads(response.read().decode('utf-8'))
              except urllib.error.HTTPError as error:
                  body = error.read().decode('utf-8', errors='replace')
                  try:
                      payload = json.loads(body)
                  except json.JSONDecodeError:
                      payload = {'raw': body[:1000]}
                  return error.code, payload
              except Exception as error:
                  return 0, {'error': str(error)}

          candidates = [
              'Arisofia_nuvanx-siteground',
              'arisofia_nuvanx-siteground',
              'Arisofia:nu...'.replace('...', 'vanx-siteground'),
              'nu...'.replace('...', 'vanx-siteground'),
          ]

          discoveries = []
          for organization in ('Arisofia', 'arisofia'):
              status, payload = request('/api/components/search', {
                  'organization': organization,
                  'qualifiers': 'TRK',
                  'q': 'nuvanx-siteground',
                  'ps': 100,
              })
              discoveries.append({'organization': organization, 'status': status, 'payload': payload})
              for component in payload.get('components', []) if isinstance(payload, dict) else []:
                  key = component.get('key')
                  if key and key not in candidates:
                      candidates.insert(0, key)

          selected = None
          component_payload = None
          component_status = None
          for candidate in candidates:
              status, payload = request('/api/components/show', {'component': candidate})
              if status == 200 and isinstance(payload, dict) and payload.get('component'):
                  selected = candidate
                  component_payload = payload
                  component_status = status
                  break

          output = {
              'token_available': bool(token),
              'discoveries': discoveries,
              'candidate_keys': candidates,
              'selected_project_key': selected,
              'component_status': component_status,
              'component': component_payload,
          }

          if not selected:
              print(json.dumps(output, ensure_ascii=False, indent=2))
              sys.exit(2)

          metric_keys = ','.join([
              'alert_status', 'quality_gate_details', 'bugs', 'vulnerabilities', 'code_smells',
              'security_hotspots', 'duplicated_lines_density', 'duplicated_lines', 'duplicated_blocks',
              'coverage', 'line_coverage', 'branch_coverage', 'lines_to_cover', 'uncovered_lines',
              'conditions_to_cover', 'uncovered_conditions', 'tests', 'test_errors', 'test_failures',
              'skipped_tests', 'test_execution_time', 'ncloc',
          ])

          for scope, params in (
              ('overall_measures', {'component': selected, 'metricKeys': metric_keys}),
              ('overall_gate', {'projectKey': selected}),
              ('branch_measures', {'component': selected, 'metricKeys': metric_keys, 'branch': target_branch}),
              ('branch_gate', {'projectKey': selected, 'branch': target_branch}),
              ('branches', {'project': selected}),
          ):
              endpoint = '/api/measures/component' if scope.endswith('measures') else (
                  '/api/qualitygates/project_status' if scope.endswith('gate') else '/api/project_branches/list'
              )
              status, payload = request(endpoint, params)
              output[scope] = {'status': status, 'payload': payload}

          def fetch_issues(branch: str | None):
              issues = []
              page = 1
              while page <= 20:
                  params = {
                      'componentKeys': selected,
                      'resolved': 'false',
                      'ps': 500,
                      'p': page,
                      'additionalFields': '_all',
                  }
                  if branch:
                      params['branch'] = branch
                  status, payload = request('/api/issues/search', params)
                  if status != 200:
                      return {'status': status, 'payload': payload, 'issues': issues}
                  batch = payload.get('issues', [])
                  issues.extend(batch)
                  total = int(payload.get('total', len(issues)))
                  if len(issues) >= total or not batch:
                      return {'status': status, 'total': total, 'issues': issues, 'facets': payload.get('facets', [])}
                  page += 1
              return {'status': 200, 'total': len(issues), 'issues': issues, 'truncated': True}

          def summarize(issue_result):
              issues = issue_result.get('issues', [])
              counters = {
                  'severity': Counter(),
                  'type': Counter(),
                  'rule': Counter(),
                  'component': Counter(),
                  'status': Counter(),
                  'clean_code_attribute': Counter(),
                  'impact_software_quality': Counter(),
              }
              samples_by_rule = defaultdict(list)
              for issue in issues:
                  counters['severity'][issue.get('severity', 'UNKNOWN')] += 1
                  counters['type'][issue.get('type', 'UNKNOWN')] += 1
                  counters['rule'][issue.get('rule', 'UNKNOWN')] += 1
                  component = issue.get('component', '')
                  if ':' in component:
                      component = component.split(':', 1)[1]
                  counters['component'][component or 'UNKNOWN'] += 1
                  counters['status'][issue.get('status', 'UNKNOWN')] += 1
                  clean_attr = issue.get('cleanCodeAttribute') or 'UNKNOWN'
                  counters['clean_code_attribute'][clean_attr] += 1
                  for impact in issue.get('impacts', []) or []:
                      key = f"{impact.get('softwareQuality', 'UNKNOWN')}:{impact.get('severity', 'UNKNOWN')}"
                      counters['impact_software_quality'][key] += 1
                  rule = issue.get('rule', 'UNKNOWN')
                  if len(samples_by_rule[rule]) < 3:
                      samples_by_rule[rule].append({
                          'key': issue.get('key'),
                          'component': component,
                          'line': issue.get('line'),
                          'message': issue.get('message'),
                          'severity': issue.get('severity'),
                          'type': issue.get('type'),
                          'effort': issue.get('effort'),
                          'creationDate': issue.get('creationDate'),
                      })
              return {
                  'status': issue_result.get('status'),
                  'reported_total': issue_result.get('total', len(issues)),
                  'retrieved': len(issues),
                  **{name: counter.most_common(100) for name, counter in counters.items()},
                  'samples_by_top_rule': {
                      rule: samples_by_rule[rule]
                      for rule, _count in counters['rule'].most_common(30)
                  },
              }

          overall_issues = fetch_issues(None)
          output['overall_issues_summary'] = summarize(overall_issues)
          branch_issues = fetch_issues(target_branch)
          output['branch_issues_summary'] = summarize(branch_issues)

          for scope, branch in (('overall_files', None), ('branch_files', target_branch)):
              params = {
                  'component': selected,
                  'qualifiers': 'FIL',
                  'metricKeys': 'ncloc,duplicated_lines_density,duplicated_lines,coverage,lines_to_cover,uncovered_lines',
                  'ps': 500,
                  's': 'metric',
                  'metricSort': 'duplicated_lines_density',
                  'asc': 'false',
              }
              if branch:
                  params['branch'] = branch
              status, payload = request('/api/measures/component_tree', params)
              output[scope] = {'status': status, 'payload': payload}

          print(json.dumps(output, ensure_ascii=False, indent=2))
          PY

      - name: Upload Sonar audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sonar-health-audit
          path: |
            sonar-repo-inventory.txt
            sonar-health-audit.json
          retention-days: 7
          if-no-files-found: warn
