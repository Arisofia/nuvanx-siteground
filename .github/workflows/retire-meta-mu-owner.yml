# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: Retire Meta MU Owner Once
run-name: Retire Meta MU Owner · ${{ github.event.pull_request.head.sha }}

on:
  pull_request:
    branches:
      - master
    paths:
      - 'scripts/ci/production-config.sh'
      - 'wp-content/themes/nuvanx-medical/inc/nvx-meta-browser-governance.php'
      - '.github/workflows/retire-meta-mu-owner-once.yml'

permissions:
  contents: read

concurrency:
  group: retire-meta-mu-owner
  cancel-in-progress: false

jobs:
  retire:
    name: Retire Meta MU Plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NUVANX_SSH_HOST: ${{ secrets.NUVANX_SSH_HOST }}
      NUVANX_SSH_PORT: ${{ secrets.NUVANX_SSH_PORT }}
      NUVANX_SSH_USER: ${{ secrets.NUVANX_SSH_USER }}
      NUVANX_SSH_KEY: ${{ secrets.NUVANX_SSH_KEY }}
      NUVANX_WP_PATH: ${{ secrets.NUVANX_WP_PATH }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Load production configuration
        run: |
          set -euo pipefail
          source scripts/ci/production-config.sh
          echo "PROD_ROOT=$PROD_ROOT" >> $GITHUB_ENV
          echo "PROD_PARENT=$PROD_PARENT" >> $GITHUB_ENV
          echo "EXPECTED_MASTER_SHA=$EXPECTED_MASTER_SHA" >> $GITHUB_ENV
          echo "OPERATIONAL_BRANCH=$OPERATIONAL_BRANCH" >> $GITHUB_ENV
          echo "MU_PLUGIN_NAME=$MU_PLUGIN_NAME" >> $GITHUB_ENV
          echo "MU_PLUGIN_PATH=$MU_PLUGIN_PATH" >> $GITHUB_ENV
          echo "PROD_SSH_ALIAS=$PROD_SSH_ALIAS" >> $GITHUB_ENV

      - name: Validate PR head SHA matches expected branch
        run: |
          set -euo pipefail
          PR_HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          PR_HEAD_REF="${{ github.event.pull_request.head.ref }}"
          
          echo "PR Head SHA: $PR_HEAD_SHA"
          echo "PR Head Ref: $PR_HEAD_REF"
          echo "Expected Branch: $OPERATIONAL_BRANCH"
          
          if [[ "$PR_HEAD_REF" != "$OPERATIONAL_BRANCH" ]]; then
            echo "::error::PR head ref '$PR_HEAD_REF' does not match expected operational branch '$OPERATIONAL_BRANCH'"
            exit 1
          fi

      - name: Validate master base SHA
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          
          echo "Base SHA: $BASE_SHA"
          echo "Expected Master SHA: $EXPECTED_MASTER_SHA"
          
          if [[ "$BASE_SHA" != "$EXPECTED_MASTER_SHA" ]]; then
            echo "::error::Base SHA '$BASE_SHA' does not match expected master SHA '$EXPECTED_MASTER_SHA'"
            exit 1
          fi

      - name: Validate SSH credentials
        run: |
          set -euo pipefail
          test -n "$NUVANX_SSH_HOST"
          test -n "$NUVANX_SSH_PORT"
          test -n "$NUVANX_SSH_USER"
          test -n "$NUVANX_SSH_KEY"
          test -n "$NUVANX_WP_PATH"
          echo "SSH credentials validated"

      - name: Create MU-plugin backup
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "$NUVANX_SSH_KEY" > ~/.ssh/nuvanx_key
          chmod 600 ~/.ssh/nuvanx_key
          
          ssh -i ~/.ssh/nuvanx_key \
            -p "$NUVANX_SSH_PORT" \
            -o StrictHostKeyChecking=no \
            "$NUVANX_SSH_USER@$NUVANX_SSH_HOST" \
            "set -e; cd '$NUVANX_WP_PATH' && \
             if [[ -f '$MU_PLUGIN_PATH' ]]; then \
               cp '$MU_PLUGIN_PATH' '${MU_PLUGIN_PATH}.backup.$(date +%Y%m%d%H%M%S)' && \
               echo 'MU_PLUGIN_BACKUP=PASS path=$MU_PLUGIN_PATH'; \
             else \
               echo 'MU_PLUGIN_BACKUP=SKIP reason=not_found'; \
             fi"

      - name: Rename MU-plugin to disable it
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/nuvanx_key \
            -p "$NUVANX_SSH_PORT" \
            -o StrictHostKeyChecking=no \
            "$NUVANX_SSH_USER@$NUVANX_SSH_HOST" \
            "set -e; cd '$NUVANX_WP_PATH' && \
             if [[ -f '$MU_PLUGIN_PATH' ]]; then \
               mv '$MU_PLUGIN_PATH' '${MU_PLUGIN_PATH}.retired' && \
               echo 'MU_PLUGIN_RETIRED=PASS path=$MU_PLUGIN_PATH'; \
             else \
               echo 'MU_PLUGIN_RETIRED=SKIP reason=not_found'; \
             fi"

      - name: Verify MU-plugin is disabled
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/nuvanx_key \
            -p "$NUVANX_SSH_PORT" \
            -o StrictHostKeyChecking=no \
            "$NUVANX_SSH_USER@$NUVANX_SSH_HOST" \
            "set -e; cd '$NUVANX_WP_PATH' && \
             if [[ -f '$MU_PLUGIN_PATH' ]]; then \
               echo '::error::MU-plugin still exists at $MU_PLUGIN_PATH'; \
               exit 1; \
             else \
               echo 'MU_PLUGIN_DISABLED=PASS'; \
             fi"

      - name: Purge WordPress cache
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/nuvanx_key \
            -p "$NUVANX_SSH_PORT" \
            -o StrictHostKeyChecking=no \
            "$NUVANX_SSH_USER@$NUVANX_SSH_HOST" \
            "set -e; cd '$NUVANX_WP_PATH' && \
             /usr/local/bin/wp cache flush && \
             /usr/local/bin/wp sg purge && \
             echo 'CACHE_PURGE=PASS'"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/nuvanx_key

      - name: Summary
        run: |
          echo "Meta MU Plugin retirement completed:"
          echo "- Branch: $OPERATIONAL_BRANCH"
          echo "- PR Head SHA: ${{ github.event.pull_request.head.sha }}"
          echo "- Base SHA: $EXPECTED_MASTER_SHA"
          echo "- MU Plugin: $MU_PLUGIN_NAME"
