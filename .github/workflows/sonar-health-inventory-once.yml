name: Sonar health inventory once

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/sonar-health-inventory-once.yml'
      - '.sonar-health-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'refactor/sonar-duplication-20260731'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download SonarQube Cloud health data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/sonar
          base='https://sonarcloud.io/api'
          project='Arisofia_nuvanx-siteground'
          curl --fail --silent --show-error --retry 4 --retry-all-errors \
            "$base/measures/component?component=$project&metricKeys=alert_status,bugs,vulnerabilities,code_smells,security_hotspots,duplicated_lines_density,duplicated_lines,coverage,ncloc" \
            > evidence/sonar/measures.json
          curl --fail --silent --show-error --retry 4 --retry-all-errors \
            "$base/issues/search?componentKeys=$project&resolved=false&ps=500&p=1&additionalFields=_all" \
            > evidence/sonar/issues-page-1.json
          python3 - <<'PY'
          import json
          import math
          import pathlib
          import urllib.parse
          import urllib.request

          root = pathlib.Path('evidence/sonar')
          first = json.loads((root / 'issues-page-1.json').read_text())
          total = int(first.get('total', 0))
          page_size = 500
          pages = max(1, math.ceil(total / page_size))
          project = 'Arisofia_nuvanx-siteground'
          for page in range(2, pages + 1):
              query = urllib.parse.urlencode({
                  'componentKeys': project,
                  'resolved': 'false',
                  'ps': page_size,
                  'p': page,
                  'additionalFields': '_all',
              })
              with urllib.request.urlopen(f'https://sonarcloud.io/api/issues/search?{query}', timeout=60) as response:
                  (root / f'issues-page-{page}.json').write_bytes(response.read())
          PY

      - name: Summarize open issues
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections
          import json
          import pathlib

          root = pathlib.Path('evidence/sonar')
          issues = []
          for path in sorted(root.glob('issues-page-*.json')):
              issues.extend(json.loads(path.read_text()).get('issues', []))

          measures_payload = json.loads((root / 'measures.json').read_text())
          measures = {
              item['metric']: item.get('value', item.get('period', {}).get('value'))
              for item in measures_payload.get('component', {}).get('measures', [])
          }
          by_type = collections.Counter(issue.get('type', 'UNKNOWN') for issue in issues)
          by_severity = collections.Counter(issue.get('severity', 'UNKNOWN') for issue in issues)
          by_rule = collections.Counter(issue.get('rule', 'UNKNOWN') for issue in issues)
          by_file = collections.Counter(issue.get('component', '').split(':', 1)[-1] for issue in issues)

          lines = [
              '# SonarQube Cloud health inventory',
              '',
              f"Open issues: {len(issues)}",
              f"Quality gate: {measures.get('alert_status', 'unknown')}",
              f"Duplicated lines density: {measures.get('duplicated_lines_density', 'n/a')}%",
              f"Duplicated lines: {measures.get('duplicated_lines', 'n/a')}",
              f"Coverage: {measures.get('coverage', 'n/a')}",
              f"Lines of code: {measures.get('ncloc', 'n/a')}",
              '',
              '## By type',
          ]
          lines.extend(f'- {name}: {count}' for name, count in by_type.most_common())
          lines.extend(['', '## By severity'])
          lines.extend(f'- {name}: {count}' for name, count in by_severity.most_common())
          lines.extend(['', '## Top rules'])
          lines.extend(f'- {rule}: {count}' for rule, count in by_rule.most_common(40))
          lines.extend(['', '## Top files'])
          lines.extend(f'- {path}: {count}' for path, count in by_file.most_common(60))
          (root / 'sonar-health-summary.md').write_text('\n'.join(lines) + '\n')

          normalized = []
          for issue in issues:
              normalized.append({
                  'key': issue.get('key'),
                  'rule': issue.get('rule'),
                  'severity': issue.get('severity'),
                  'type': issue.get('type'),
                  'component': issue.get('component', '').split(':', 1)[-1],
                  'line': issue.get('line'),
                  'message': issue.get('message'),
                  'effort': issue.get('effort'),
                  'creationDate': issue.get('creationDate'),
              })
          (root / 'open-issues-normalized.json').write_text(json.dumps(normalized, ensure_ascii=False, indent=2) + '\n')
          print((root / 'sonar-health-summary.md').read_text())
          PY

      - name: Upload Sonar health evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sonar-health-inventory
          path: evidence/sonar
          retention-days: 7
          if-no-files-found: error
