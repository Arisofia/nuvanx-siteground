name: Staging2 Database Isolation Once

on:
  push:
    paths:
      - '.github/workflows/staging2-db-isolation-once.yml'

permissions:
  contents: read

concurrency:
  group: staging2-db-isolation-once
  cancel-in-progress: false

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging2
      url: https://staging2.nuvanx.com
    env:
      NEW_DB: dbshcocboodiwr
      NEW_USER: ucdduxjmx7puu
      EXPECTED_PROD_DB: db0ecrycwv2tgb
      EXPECTED_PROD_USER: u2qrtdbzk9grh
      STAGING_ROOT: /home/customer/www/staging2.nuvanx.com/public_html
      PROD_ROOT: /home/customer/www/nuvanx.com/public_html
    steps:
      - name: Configure strict SSH
        shell: bash
        env:
          STAGING2_SSH_HOST: ${{ secrets.STAGING2_SSH_HOST }}
          STAGING2_SSH_PORT: ${{ secrets.STAGING2_SSH_PORT }}
          STAGING2_SSH_USER: ${{ secrets.STAGING2_SSH_USER }}
          STAGING2_SSH_PRIVATE_KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          STAGING2_SSH_KNOWN_HOSTS: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${STAGING2_SSH_HOST:?Missing STAGING2_SSH_HOST}"
          : "${STAGING2_SSH_USER:?Missing STAGING2_SSH_USER}"
          : "${STAGING2_SSH_PRIVATE_KEY:?Missing STAGING2_SSH_PRIVATE_KEY}"
          : "${STAGING2_SSH_KNOWN_HOSTS:?Missing STAGING2_SSH_KNOWN_HOSTS}"
          port="${STAGING2_SSH_PORT:-18765}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$STAGING2_SSH_PRIVATE_KEY" > "$HOME/.ssh/staging2_key"
          chmod 600 "$HOME/.ssh/staging2_key"
          printf '%s\n' "$STAGING2_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx-staging2-db-isolation
            HostName $STAGING2_SSH_HOST
            User $STAGING2_SSH_USER
            Port $port
            IdentityFile $HOME/.ssh/staging2_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 20
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Validate required staging DB password secret
        shell: bash
        env:
          STAGING2_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail
          : "${STAGING2_DB_PASSWORD:?Missing DB_PASSWORD}"
          test "${#STAGING2_DB_PASSWORD}" -ge 12
          echo 'staging_db_password_secret=present'

      - name: Transfer staging DB password securely
        shell: bash
        env:
          STAGING2_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail
          remote_pass_file="$HOME/.nvx-staging2-db-pass-${GITHUB_RUN_ID}"
          printf '%s' "$STAGING2_DB_PASSWORD" | ssh nvx-staging2-db-isolation "umask 077; cat > '$remote_pass_file'; chmod 600 '$remote_pass_file'"
          echo "REMOTE_PASS_FILE=$remote_pass_file" >> "$GITHUB_ENV"

      - name: Isolate staging2 database and WordPress identity
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-staging2-db-isolation \
            "REMOTE_PASS_FILE='$REMOTE_PASS_FILE' NEW_DB='$NEW_DB' NEW_USER='$NEW_USER' EXPECTED_PROD_DB='$EXPECTED_PROD_DB' EXPECTED_PROD_USER='$EXPECTED_PROD_USER' STAGING_ROOT='$STAGING_ROOT' PROD_ROOT='$PROD_ROOT' RUN_ID='$GITHUB_RUN_ID' bash -se" <<'REMOTE'
          set -euo pipefail

          : "${REMOTE_PASS_FILE:?}"
          : "${NEW_DB:?}"
          : "${NEW_USER:?}"
          : "${EXPECTED_PROD_DB:?}"
          : "${EXPECTED_PROD_USER:?}"
          : "${STAGING_ROOT:?}"
          : "${PROD_ROOT:?}"
          : "${RUN_ID:?}"

          cleanup() {
            rm -f "$REMOTE_PASS_FILE"
          }
          trap cleanup EXIT

          fail() {
            echo "FAIL: $*" >&2
            exit 1
          }

          test -s "$REMOTE_PASS_FILE" || fail 'remote password file missing or empty'
          test -d "$STAGING_ROOT" || fail 'staging root missing'
          test -d "$PROD_ROOT" || fail 'production root missing'
          test "$STAGING_ROOT" != "$PROD_ROOT" || fail 'staging and production roots are identical'
          test -f "$STAGING_ROOT/wp-config.php" || fail 'staging wp-config.php missing'
          test -f "$PROD_ROOT/wp-config.php" || fail 'production wp-config.php missing'
          command -v wp >/dev/null || fail 'wp-cli missing'
          command -v mysql >/dev/null || fail 'mysql cli missing'
          command -v mysqldump >/dev/null || fail 'mysqldump missing'

          prod_db="$(cd "$PROD_ROOT" && wp config get DB_NAME)"
          prod_user="$(cd "$PROD_ROOT" && wp config get DB_USER)"
          prod_host="$(cd "$PROD_ROOT" && wp config get DB_HOST)"
          staging_db_before="$(cd "$STAGING_ROOT" && wp config get DB_NAME)"
          staging_user_before="$(cd "$STAGING_ROOT" && wp config get DB_USER)"

          test "$prod_db" = "$EXPECTED_PROD_DB" || fail "unexpected production DB: $prod_db"
          test "$prod_user" = "$EXPECTED_PROD_USER" || fail "unexpected production DB user: $prod_user"
          test "$staging_db_before" = "$EXPECTED_PROD_DB" || fail "staging DB changed unexpectedly before migration: $staging_db_before"
          test "$staging_user_before" = "$EXPECTED_PROD_USER" || fail "staging DB user changed unexpectedly before migration: $staging_user_before"
          test "$NEW_DB" != "$EXPECTED_PROD_DB" || fail 'new DB equals production DB'
          test "$NEW_USER" != "$EXPECTED_PROD_USER" || fail 'new DB user equals production DB user'

          prod_siteurl_before="$(cd "$PROD_ROOT" && wp option get siteurl)"
          prod_home_before="$(cd "$PROD_ROOT" && wp option get home)"
          prod_blog_public_before="$(cd "$PROD_ROOT" && wp option get blog_public)"

          echo '=== preflight identity ==='
          echo "production_db=$prod_db"
          echo "production_db_user=$prod_user"
          echo "staging_db_before=$staging_db_before"
          echo "staging_db_user_before=$staging_user_before"
          echo "new_staging_db=$NEW_DB"
          echo "new_staging_db_user=$NEW_USER"
          echo "roots_distinct=yes"

          db_host="$prod_host"
          db_port=''
          case "$prod_host" in
            *:*)
              candidate_port="${prod_host##*:}"
              candidate_host="${prod_host%%:*}"
              if printf '%s' "$candidate_port" | grep -Eq '^[0-9]+$'; then
                db_host="$candidate_host"
                db_port="$candidate_port"
              fi
              ;;
          esac

          mysql_new() {
            if test -n "$db_port"; then
              MYSQL_PWD="$(cat "$REMOTE_PASS_FILE")" mysql --protocol=TCP --host="$db_host" --port="$db_port" --user="$NEW_USER" "$@"
            else
              MYSQL_PWD="$(cat "$REMOTE_PASS_FILE")" mysql --host="$db_host" --user="$NEW_USER" "$@"
            fi
          }

          mysql_new "$NEW_DB" -Nse 'SELECT DATABASE();' | grep -Fx "$NEW_DB" >/dev/null || fail 'new staging DB connection failed'
          new_table_count="$(mysql_new "$NEW_DB" -Nse 'SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE();')"
          test "$new_table_count" = '0' || fail "new staging DB is not empty (tables=$new_table_count)"

          if mysql_new "$EXPECTED_PROD_DB" -Nse 'SELECT 1;' >/dev/null 2>&1; then
            fail 'new staging DB user can access production DB; isolation is insufficient'
          fi
          echo 'new_user_access_to_production_db=denied'

          backup_dir="$HOME/nvx-staging2-backups/${RUN_ID}"
          mkdir -p "$backup_dir"
          chmod 700 "$backup_dir"
          db_backup="$backup_dir/production-before-staging-isolation.sql"
          config_backup="$backup_dir/staging-wp-config-before-isolation.php"

          cp "$STAGING_ROOT/wp-config.php" "$config_backup"
          chmod 600 "$config_backup"
          (cd "$PROD_ROOT" && wp db export "$db_backup" --add-drop-table --quiet)
          test -s "$db_backup" || fail 'production DB backup is empty'
          chmod 600 "$db_backup"
          backup_sha256="$(sha256sum "$db_backup" | awk '{print $1}')"
          echo "production_backup_sha256=$backup_sha256"
          echo "backup_directory=$backup_dir"

          echo '=== import production snapshot into isolated staging DB ==='
          mysql_new "$NEW_DB" < "$db_backup"
          imported_table_count="$(mysql_new "$NEW_DB" -Nse 'SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE();')"
          test "$imported_table_count" -gt 0 || fail 'staging DB import produced no tables'
          echo "staging_imported_tables=$imported_table_count"

          echo '=== switch staging wp-config only ==='
          cd "$STAGING_ROOT"
          wp config set DB_NAME "$NEW_DB" --type=constant --quiet
          wp config set DB_USER "$NEW_USER" --type=constant --quiet
          wp config set DB_PASSWORD "$(cat "$REMOTE_PASS_FILE")" --type=constant --quiet
          wp config set NVX_ENV staging --type=constant --quiet
          wp config set WP_ENVIRONMENT_TYPE staging --type=constant --quiet

          connected_db="$(wp db query 'SELECT DATABASE();' --skip-column-names | tr -d '\r')"
          test "$connected_db" = "$NEW_DB" || fail "WordPress staging connected to unexpected DB: $connected_db"
          echo "staging_connected_db=$connected_db"

          echo '=== serialized-safe URL migration ==='
          wp search-replace 'https://nuvanx.com' 'https://staging2.nuvanx.com' --all-tables-with-prefix --precise --dry-run --report-changed-only
          wp search-replace 'https://nuvanx.com' 'https://staging2.nuvanx.com' --all-tables-with-prefix --precise --report-changed-only

          wp option update siteurl 'https://staging2.nuvanx.com' --quiet
          wp option update home 'https://staging2.nuvanx.com' --quiet
          wp option update blog_public 0 --quiet

          echo '=== staging post-migration identity ==='
          staging_db_after="$(wp config get DB_NAME)"
          staging_user_after="$(wp config get DB_USER)"
          staging_siteurl="$(wp option get siteurl)"
          staging_home="$(wp option get home)"
          staging_blog_public="$(wp option get blog_public)"
          staging_theme="$(wp theme list --status=active --field=name)"
          nvx_env="$(wp eval 'echo defined("NVX_ENV") ? NVX_ENV : "";')"
          wp_environment="$(wp eval 'echo function_exists("wp_get_environment_type") ? wp_get_environment_type() : "";')"

          test "$staging_db_after" = "$NEW_DB" || fail 'staging DB_NAME mismatch after migration'
          test "$staging_user_after" = "$NEW_USER" || fail 'staging DB_USER mismatch after migration'
          test "$staging_siteurl" = 'https://staging2.nuvanx.com' || fail 'staging siteurl mismatch'
          test "$staging_home" = 'https://staging2.nuvanx.com' || fail 'staging home mismatch'
          test "$staging_blog_public" = '0' || fail 'staging blog_public is not 0'
          test "$staging_theme" = 'nuvanx-medical' || fail "unexpected active theme: $staging_theme"
          test "$nvx_env" = 'staging' || fail "NVX_ENV mismatch: $nvx_env"
          test "$wp_environment" = 'staging' || fail "WP environment mismatch: $wp_environment"

          echo "staging_db_after=$staging_db_after"
          echo "staging_db_user_after=$staging_user_after"
          echo "staging_siteurl=$staging_siteurl"
          echo "staging_home=$staging_home"
          echo "staging_blog_public=$staging_blog_public"
          echo "staging_theme=$staging_theme"
          echo "nvx_env=$nvx_env"
          echo "wp_environment_type=$wp_environment"

          echo '=== production non-mutation check ==='
          prod_db_after="$(cd "$PROD_ROOT" && wp config get DB_NAME)"
          prod_user_after="$(cd "$PROD_ROOT" && wp config get DB_USER)"
          prod_siteurl_after="$(cd "$PROD_ROOT" && wp option get siteurl)"
          prod_home_after="$(cd "$PROD_ROOT" && wp option get home)"
          prod_blog_public_after="$(cd "$PROD_ROOT" && wp option get blog_public)"

          test "$prod_db_after" = "$EXPECTED_PROD_DB" || fail 'production DB_NAME changed'
          test "$prod_user_after" = "$EXPECTED_PROD_USER" || fail 'production DB_USER changed'
          test "$prod_siteurl_after" = "$prod_siteurl_before" || fail 'production siteurl changed'
          test "$prod_home_after" = "$prod_home_before" || fail 'production home changed'
          test "$prod_blog_public_after" = "$prod_blog_public_before" || fail 'production blog_public changed'

          echo "production_db_after=$prod_db_after"
          echo "production_db_user_after=$prod_user_after"
          echo "production_siteurl_unchanged=yes"
          echo "production_home_unchanged=yes"
          echo "production_blog_public_unchanged=yes"
          echo 'DATABASE_ISOLATION=PASS'
          REMOTE

      - name: Public staging hostname and robots smoke check
        shell: bash
        run: |
          set -euo pipefail
          for path in / /soluciones-medicas/ /equipo-medico/ /blog/ /endolift-primeras-72-horas-que-esperar/; do
            url="https://staging2.nuvanx.com${path}"
            headers="$(mktemp)"
            body="$(mktemp)"
            curl --silent --show-error --location --max-redirs 5 --dump-header "$headers" --output "$body" "$url"
            final_url="$(curl --silent --show-error --location --max-redirs 5 --output /dev/null --write-out '%{url_effective}' "$url")"
            status="$(curl --silent --show-error --location --max-redirs 5 --output /dev/null --write-out '%{http_code}' "$url")"
            final_host="$(printf '%s' "$final_url" | sed -E 's#^https?://([^/]+).*#\1#')"
            robots="$(grep -ioE '<meta[^>]+name=["'"']robots["'"'][^>]*>' "$body" | head -n 1 || true)"
            echo "route=$path status=$status final_host=$final_host robots=${robots:-missing}"
            test "$status" = '200'
            test "$final_host" = 'staging2.nuvanx.com'
            printf '%s' "$robots" | grep -qi 'noindex'
            printf '%s' "$robots" | grep -qi 'nofollow'
            rm -f "$headers" "$body"
          done

      - name: Destroy SSH material
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/staging2_key" "$HOME/.ssh/config" "$HOME/.ssh/known_hosts"
