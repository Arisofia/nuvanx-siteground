name: Fix Visual Block 1 Token Once

on:
  push:
    branches:
      - fix/visual-site-audit-20260808
    paths:
      - .github/workflows/fix-visual-block1-token-once.yml

permissions:
  contents: write

jobs:
  fix-token:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/visual-site-audit-20260808
          fetch-depth: 0
          persist-credentials: true

      - name: Replace invalid token only
        shell: bash
        run: |
          set -euo pipefail
          file='wp-content/themes/nuvanx-medical/assets/css/nvx-site-layout.css'
          test "$(grep -Fc 'var(--nvx-space-7)' "$file")" = 1
          python3 - <<'PY'
          from pathlib import Path
          p=Path('wp-content/themes/nuvanx-medical/assets/css/nvx-site-layout.css')
          s=p.read_text('utf-8')
          old='margin-top: var(--nvx-space-7);'
          new='margin-top: var(--nvx-space-8);'
          if s.count(old) != 1:
              raise SystemExit(f'expected one invalid token reference, got {s.count(old)}')
          p.write_text(s.replace(old,new,1),'utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = "$file"
          grep -Fq 'margin-top: var(--nvx-space-8);' "$file"
          ! grep -Fq 'var(--nvx-space-7)' "$file"

      - name: Validate theme syntax again
        shell: bash
        run: |
          set -euo pipefail
          find wp-content/themes/nuvanx-medical -path '*/vendor' -prune -o -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find wp-content/themes/nuvanx-medical -path '*/vendor' -prune -o -name '*.js' -type f -print0)

      - name: Commit one-file correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NUVANX Audit Controller'
          git config user.email 'audit-controller@nuvanx.invalid'
          git add wp-content/themes/nuvanx-medical/assets/css/nvx-site-layout.css
          git diff --cached --check
          git commit -m 'fix(visual): use canonical spacing token in legal shell'
          git push origin HEAD:fix/visual-site-audit-20260808
