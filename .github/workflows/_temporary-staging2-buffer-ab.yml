name: Temporary Staging2 output-buffer A-B diagnostic

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Configure SiteGround SSH
        env:
          SSH_HOST: ${{ secrets.STAGING2_SSH_HOST }}
          SSH_PORT_SECRET: ${{ secrets.STAGING2_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING2_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing STAGING2_SSH_HOST}"
          : "${SSH_USER:?Missing STAGING2_SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Missing STAGING2_SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing STAGING2_SSH_KNOWN_HOSTS}"
          SSH_PORT="${SSH_PORT_SECRET:-18765}"
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/siteground_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/siteground_key" "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host siteground-staging
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/siteground_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 15
          EOF
          chmod 600 "$HOME/.ssh/config"
      - name: A-B test document output buffers
        run: |
          set -euo pipefail
          ssh siteground-staging 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/home/customer/www/staging2.nuvanx.com/public_html
          cd "$ROOT"
          test_variant() {
            local name="$1"
            local code="$2"
            local plugin="$ROOT/wp-content/mu-plugins/nvx-buffer-ab-${name}.php"
            cat > "$plugin" <<PHP
          <?php
          $code
          PHP
            curl -ksS --resolve staging2.nuvanx.com:443:127.0.0.1 https://staging2.nuvanx.com/ -o "/tmp/nvx-buffer-${name}.html"
            python3 - "$name" <<'PY'
          import re,sys
          name=sys.argv[1]
          s=open('/tmp/nvx-buffer-'+name+'.html',encoding='utf8',errors='replace').read()
          styles=[x for x in re.findall(r'<link\\b[^>]*>',s,re.I) if re.search(r'rel=["\\\'][^"\\\']*stylesheet',x,re.I)]
          print(name+' HTML_BYTES='+str(len(s))+' STYLESHEET_TAGS='+str(len(styles))+' NVX_BASE='+str('nvx-base.css' in s))
          PY
            rm -f "$plugin"
          }
          test_variant baseline ''
          test_variant no-theme-buffer "add_action('template_redirect', static function (): void { remove_action('template_redirect', 'nvx_theme_normalize_public_document', 0); }, -1);"
          test_variant no-head-buffer "add_action('wp_head', static function (): void { remove_action('wp_head', 'nvx_canonical_schema_head_buffer_start', -9999); remove_action('wp_head', 'nvx_canonical_schema_head_buffer_end', PHP_INT_MAX); }, -10000);"
          test_variant no-both "add_action('template_redirect', static function (): void { remove_action('template_redirect', 'nvx_theme_normalize_public_document', 0); }, -1); add_action('wp_head', static function (): void { remove_action('wp_head', 'nvx_canonical_schema_head_buffer_start', -9999); remove_action('wp_head', 'nvx_canonical_schema_head_buffer_end', PHP_INT_MAX); }, -10000);"
          REMOTE
