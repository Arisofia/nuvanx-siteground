name: Apply Sonar Zero Issue Fixes

on:
  push:
    branches:
      - audit/repo-clean-20260808-1840
    paths:
      - .github/workflows/apply-sonar-zero-issue-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: audit/repo-clean-20260808-1840
          fetch-depth: 0
          persist-credentials: true
      - name: Apply final two fixes
        shell: python
        run: |
          from pathlib import Path

          p = Path('scripts/staging2/block-c-52x3.mjs')
          text = p.read_text(encoding='utf-8')
          old = ' * @return {{response: import(\'@playwright/test\').APIResponse|null, attempt: number}} The navigation response and attempt number.'
          new = ' * @return {Promise<{response: import(\'@playwright/test\').Response|null, attempt: number}>} The navigation response and attempt number.'
          if text.count(old) != 1:
              raise SystemExit('block-c gotoPlain JSDoc marker mismatch')
          p.write_text(text.replace(old, new), encoding='utf-8')

          p = Path('wp-content/themes/nuvanx-medical/assets/js/nvx-runtime-governance.js')
          text = p.read_text(encoding='utf-8')
          marker = "  function focusableElements(container) {\n"
          helper = "  function normalizePath(pathname = '') {\n    let normalized = pathname;\n    while (normalized.endsWith('/')) normalized = normalized.slice(0, -1);\n    return normalized + '/';\n  }\n\n"
          if text.count(marker) != 1:
              raise SystemExit('runtime helper insertion marker mismatch')
          text = text.replace(marker, helper + marker, 1)
          nested = "    function normalizePath(pathname = '') {\n      let normalized = pathname;\n      while (normalized.endsWith('/')) normalized = normalized.slice(0, -1);\n      return normalized + '/';\n    }\n\n"
          if text.count(nested) != 1:
              raise SystemExit('runtime nested normalizePath marker mismatch')
          p.write_text(text.replace(nested, '', 1), encoding='utf-8')
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/staging2/block-c-52x3.mjs
          node --check wp-content/themes/nuvanx-medical/assets/js/nvx-runtime-governance.js
          git diff --check
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Nuvanx Engineering'
          git config user.email 'admin@nuvanx.com'
          git add scripts/staging2/block-c-52x3.mjs wp-content/themes/nuvanx-medical/assets/js/nvx-runtime-governance.js
          git commit -m 'fix(quality): clear final Sonar issues'
          git push origin HEAD:audit/repo-clean-20260808-1840
