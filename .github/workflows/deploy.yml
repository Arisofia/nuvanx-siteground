name: Production Gate & Atomic Deploy to SiteGround

on:
  workflow_call:
    inputs:
      sha:
        description: Exact staging-accepted commit SHA
        required: true
        type: string
      authorize_production:
        description: Explicitly authorize the production mutation job after Block B passes
        required: false
        default: false
        type: boolean
    secrets:
      STAGING2_SSH_HOST:
        required: true
      STAGING2_SSH_PORT:
        required: false
      STAGING2_SSH_USER:
        required: true
      STAGING2_SSH_PRIVATE_KEY:
        required: true
      STAGING2_SSH_KNOWN_HOSTS:
        required: true
      PROD_SSH_HOST:
        required: false
      PROD_SSH_PORT:
        required: false
      PROD_SSH_USER:
        required: false
      PROD_SSH_PRIVATE_KEY:
        required: false
      PROD_SSH_KNOWN_HOSTS:
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: production-gate-${{ inputs.sha }}
  cancel-in-progress: false

jobs:
  production-gate:
    name: Block B · exact accepted SHA and production readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CANDIDATE_SHA: ${{ inputs.sha }}
      STAGING_ROOT: /home/customer/www/staging2.nuvanx.com/public_html
      PROD_ROOT: /home/customer/www/nuvanx.com/public_html
    steps:
      - name: Check out master history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Validate candidate and hardened production tooling
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_SHA="$(printf '%s' "$CANDIDATE_SHA" | tr -d '[:space:]')"
          echo "CANDIDATE_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Candidate must be a full lowercase 40-character SHA.' >&2; exit 1; }
          git fetch --no-tags origin master
          git cat-file -e "${CANDIDATE_SHA}^{commit}"
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/master || { echo 'Candidate is not contained in origin/master.' >&2; exit 1; }
          git cat-file -e "${CANDIDATE_SHA}:wp-content/themes/nuvanx-medical/functions.php"
          CANDIDATE_THEME_TREE="$(git rev-parse "${CANDIDATE_SHA}:wp-content/themes/nuvanx-medical")"
          [[ "$CANDIDATE_THEME_TREE" =~ ^[0-9a-f]{40}$ ]]
          echo "CANDIDATE_THEME_TREE=$CANDIDATE_THEME_TREE" >> "$GITHUB_ENV"
          bash -n tools/deploy/deploy-to-prod.sh
          node --check scripts/production/verify-production-boundary.mjs
          grep -Fq 'ROLLBACK_SNAPSHOT=PASS' tools/deploy/deploy-to-prod.sh
          grep -Fq 'ROLLBACK_PRODUCTION=PASS' tools/deploy/deploy-to-prod.sh
          grep -Fq '.nvx-deploy-sha' tools/deploy/deploy-to-prod.sh
          ! grep -Fq 'StrictHostKeyChecking=no' .github/workflows/deploy.yml
          echo "ACCEPTED_THEME_TREE=$CANDIDATE_THEME_TREE"
          echo 'PRODUCTION_TOOLING_STATIC=PASS'

      - name: Verify successful Block C evidence for exact candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_name="staging2-block-c-${CANDIDATE_SHA}"
          response="$(curl -fsSL --proto '=https' --proto-redir '=https' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100")"
          artifact="$(printf '%s' "$response" | jq -c --arg name "$artifact_name" '[.artifacts[] | select(.name == $name and .expired == false)] | sort_by(.created_at) | last')"
          [[ "$artifact" != 'null' ]] || { echo "No non-expired Block C artifact for $CANDIDATE_SHA" >&2; exit 1; }
          artifact_id="$(printf '%s' "$artifact" | jq -r '.id')"
          acceptance_run_id="$(printf '%s' "$artifact" | jq -r '.workflow_run.id')"
          [[ "$artifact_id" =~ ^[0-9]+$ && "$acceptance_run_id" =~ ^[0-9]+$ ]]
          conclusion="$(curl -fsSL --proto '=https' --proto-redir '=https' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${acceptance_run_id}" | jq -r '.conclusion')"
          test "$conclusion" = 'success'
          echo "BLOCK_C_ACCEPTANCE=PASS artifact_id=$artifact_id run_id=$acceptance_run_id sha=$CANDIDATE_SHA"

      - name: Configure strict read-only SiteGround SSH
        shell: bash
        env:
          HOST: ${{ secrets.STAGING2_SSH_HOST }}
          PORT: ${{ secrets.STAGING2_SSH_PORT }}
          USER: ${{ secrets.STAGING2_SSH_USER }}
          KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${HOST:?Missing STAGING2_SSH_HOST}"; : "${USER:?Missing STAGING2_SSH_USER}"; : "${KEY:?Missing STAGING2_SSH_PRIVATE_KEY}"; : "${KH:?Missing STAGING2_SSH_KNOWN_HOSTS}"
          SSH_PORT="${PORT:-18765}"
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/block_b_key"; chmod 600 "$HOME/.ssh/block_b_key"
          printf '%s\n' "$KH" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx-block-b
            HostName $HOST
            User $USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/block_b_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 20
            ConnectionAttempts 5
            ServerAliveInterval 30
            ServerAliveCountMax 2
          EOF
          chmod 600 "$HOME/.ssh/config"
          ssh nvx-block-b "test -d '$STAGING_ROOT' && test -d '$PROD_ROOT' && command -v wp >/dev/null"

      - name: Verify staging theme payload and production identity read-only
        shell: bash
        run: |
          set -euo pipefail
          staging_sha="$(ssh nvx-block-b "tr -d '\\r\\n' < '$STAGING_ROOT/wp-content/themes/nuvanx-medical/.nvx-deploy-sha'")"
          [[ "$staging_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid Staging2 deploy marker: $staging_sha" >&2; exit 1; }
          git cat-file -e "${staging_sha}^{commit}"
          git merge-base --is-ancestor "$staging_sha" origin/master || { echo "Staging2 SHA is not contained in origin/master: $staging_sha" >&2; exit 1; }
          staging_theme_tree="$(git rev-parse "${staging_sha}:wp-content/themes/nuvanx-medical")"
          test "$staging_theme_tree" = "$CANDIDATE_THEME_TREE" || {
            echo "Staging2 theme tree differs from accepted candidate: staging=$staging_theme_tree candidate=$CANDIDATE_THEME_TREE" >&2
            exit 1
          }
          echo "STAGING_DEPLOYED_SHA=$staging_sha"
          echo "STAGING_THEME_TREE=$staging_theme_tree"
          echo 'STAGING_THEME_EQUIVALENCE=PASS'

          ssh nvx-block-b "STAGING_ROOT='$STAGING_ROOT' PROD_ROOT='$PROD_ROOT' STAGING_DEPLOYED_SHA='$staging_sha' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          test "$STAGING_ROOT" != "$PROD_ROOT"

          cd "$STAGING_ROOT"
          test "$(tr -d '\r\n' < wp-content/themes/nuvanx-medical/.nvx-deploy-sha)" = "$STAGING_DEPLOYED_SHA"
          test "$(wp config get DB_NAME)" = 'dbshcocboodiwr'
          test "$(wp option get home)" = 'https://staging2.nuvanx.com'
          test "$(wp option get siteurl)" = 'https://staging2.nuvanx.com'
          test "$(wp option get blog_public)" = '0'
          test "$(wp config get NVX_ENV)" = 'staging'
          test "$(wp config get WP_ENVIRONMENT_TYPE)" = 'staging'
          wp eval 'exit((defined("WP_DEBUG_DISPLAY") && WP_DEBUG_DISPLAY === false) ? 0 : 1);'
          test "$(wp theme list --status=active --field=name)" = 'nuvanx-medical'
          echo "STAGING_DEPLOYED_SHA=$STAGING_DEPLOYED_SHA"

          cd "$PROD_ROOT"
          test "$(wp config get DB_NAME)" = 'db0ecrycwv2tgb'
          test "$(wp option get home)" = 'https://nuvanx.com'
          test "$(wp option get siteurl)" = 'https://nuvanx.com'
          test "$(wp option get blog_public)" = '1'
          test "$(wp theme list --status=active --field=name)" = 'nuvanx-medical'
          for legacy_mu in \
            nuvanx-valoracion-native-hubspot-form.php \
            nuvanx-contacto-hubspot-form.php \
            nvx-disable-public-facebook-pixel.php \
            nuvanx-google-attribution.php
          do
            test ! -e "$PROD_ROOT/wp-content/mu-plugins/$legacy_mu"
          done
          test ! -d "$PROD_ROOT/wp-content/mu-plugins/nuvanx-google-attribution"
          if [[ -f wp-content/themes/nuvanx-medical/.nvx-deploy-sha ]]; then
            prod_sha="$(tr -d '\r\n' < wp-content/themes/nuvanx-medical/.nvx-deploy-sha)"
          else
            prod_sha='MISSING'
          fi
          echo "PRODUCTION_CURRENT_SHA=$prod_sha"
          echo 'BLOCK_B_READ_ONLY=PASS'
          REMOTE

      - name: Destroy read-only SSH identity
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/block_b_key" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"

      - name: Write Block B gate summary
        if: success()
        shell: bash
        run: |
          {
            echo '## Block B production readiness PASS'
            echo
            echo "- Accepted candidate: \`$CANDIDATE_SHA\`"
            echo "- Accepted theme tree: \`$CANDIDATE_THEME_TREE\`"
            echo '- Block C evidence: successful non-expired exact-SHA artifact verified through GitHub API'
            echo '- Staging payload: deployed repo SHA may be newer, but the theme tree must be byte-identical to the accepted candidate'
            echo '- Production identity: read-only checks passed; no production mutation performed'
            echo '- Production tooling: strict-host and rollback invariants validated statically'
            echo '- Production deploy runs only when authorize_production=true is supplied by a trusted reusable caller'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-siteground:
    name: Production deploy · explicit authorization
    needs: production-gate
    if: ${{ inputs.authorize_production }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_SHA: ${{ inputs.sha }}
      PROD_ROOT: /home/customer/www/nuvanx.com/public_html
      PROD_PARENT: /home/customer/www/nuvanx.com
      BASE_URL: https://nuvanx.com
      EXPECTED_HOST: nuvanx.com
    steps:
      - name: Check out hardened operational tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          path: ops
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact accepted candidate payload
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact payload and operational tooling
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_SHA="$(printf '%s' "$DEPLOY_SHA" | tr -d '[:space:]')"
          echo "DEPLOY_SHA=$DEPLOY_SHA" >> "$GITHUB_ENV"
          echo "EXPECTED_SHA=$DEPLOY_SHA" >> "$GITHUB_ENV"
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C candidate rev-parse HEAD)" = "$DEPLOY_SHA"
          git -C ops fetch --no-tags origin master
          git -C ops cat-file -e "${DEPLOY_SHA}^{commit}"
          git -C ops merge-base --is-ancestor "$DEPLOY_SHA" origin/master
          bash -n ops/tools/deploy/deploy-to-prod.sh
          node --check ops/scripts/production/verify-production-boundary.mjs
          find candidate/wp-content/themes/nuvanx-medical -path '*/vendor' -prune -o -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null

      - name: Configure strict production SSH authentication
        shell: bash
        env:
          HOST: ${{ secrets.PROD_SSH_HOST }}
          PORT: ${{ secrets.PROD_SSH_PORT }}
          USER: ${{ secrets.PROD_SSH_USER }}
          KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${HOST:?Missing PROD_SSH_HOST}"; : "${USER:?Missing PROD_SSH_USER}"; : "${KEY:?Missing PROD_SSH_PRIVATE_KEY}"; : "${KH:?Missing PROD_SSH_KNOWN_HOSTS}"
          SSH_PORT="${PORT:-18765}"
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/prod_key"; chmod 600 "$HOME/.ssh/prod_key"
          printf '%s\n' "$KH" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx-prod
            HostName $HOST
            User $USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/prod_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 20
            ConnectionAttempts 5
            ServerAliveInterval 30
            ServerAliveCountMax 2
          EOF
          chmod 600 "$HOME/.ssh/config"
          ssh nvx-prod "test -d '$PROD_ROOT' && test -f '$PROD_ROOT/wp-config.php' && command -v wp >/dev/null && command -v rsync >/dev/null && command -v php >/dev/null"

      - name: Verify production preflight before mutation
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-prod "PROD_ROOT='$PROD_ROOT' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$PROD_ROOT"
          test "$(wp config get DB_NAME)" = 'db0ecrycwv2tgb'
          test "$(wp option get home)" = 'https://nuvanx.com'
          test "$(wp option get siteurl)" = 'https://nuvanx.com'
          test "$(wp option get blog_public)" = '1'
          test "$(wp theme list --status=active --field=name)" = 'nuvanx-medical'
          for legacy_mu in nuvanx-valoracion-native-hubspot-form.php nuvanx-contacto-hubspot-form.php nvx-disable-public-facebook-pixel.php nuvanx-google-attribution.php; do
            test ! -e "$PROD_ROOT/wp-content/mu-plugins/$legacy_mu"
          done
          test ! -d "$PROD_ROOT/wp-content/mu-plugins/nuvanx-google-attribution"
          echo 'PRODUCTION_PREFLIGHT=PASS'
          REMOTE

      - name: Upload accepted theme and hardened deploy script
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_RELEASE="$PROD_PARENT/.nvx-releases/${DEPLOY_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "REMOTE_RELEASE=$REMOTE_RELEASE" >> "$GITHUB_ENV"
          ssh nvx-prod "mkdir -p '$REMOTE_RELEASE/theme'"
          rsync -az --delete \
            --exclude='.git' --exclude='php_errorlog' --exclude='*.log' \
            --exclude='_archive*' --exclude='_disabled*' --exclude='*.bak*' \
            candidate/wp-content/themes/nuvanx-medical/ "nvx-prod:$REMOTE_RELEASE/theme/"
          rsync -az ops/tools/deploy/deploy-to-prod.sh "nvx-prod:$REMOTE_RELEASE/deploy-to-prod.sh"

      - name: Execute guarded production directory cutover
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-prod "NVX_RUN_TOKEN='${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}' NUVANX_CONFIRM=yes bash '$REMOTE_RELEASE/deploy-to-prod.sh' --prod-root '$PROD_ROOT' --source-theme '$REMOTE_RELEASE/theme' --sha '$DEPLOY_SHA' --confirm"

      - name: Verify production public boundary
        shell: bash
        run: |
          set -euo pipefail
          pass=0
          for attempt in {1..6}; do
            echo "Production boundary attempt ${attempt}/6"
            if BASE_URL="$BASE_URL" EXPECTED_HOST="$EXPECTED_HOST" EXPECTED_SHA="$DEPLOY_SHA" node ops/scripts/production/verify-production-boundary.mjs; then
              pass=1
              break
            fi
            sleep 10
          done
          test "$pass" = 1

      - name: Verify production exact SHA on disk
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-prod "PROD_ROOT='$PROD_ROOT' DEPLOY_SHA='$DEPLOY_SHA' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$PROD_ROOT"
          test "$(tr -d '\r\n' < wp-content/themes/nuvanx-medical/.nvx-deploy-sha)" = "$DEPLOY_SHA"
          test "$(wp config get DB_NAME)" = 'db0ecrycwv2tgb'
          test "$(wp option get home)" = 'https://nuvanx.com'
          test "$(wp option get siteurl)" = 'https://nuvanx.com'
          test "$(wp option get blog_public)" = '1'
          echo "PRODUCTION_DEPLOYED_SHA=$DEPLOY_SHA"
          REMOTE

      - name: Upload production boundary evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-boundary-${{ inputs.sha }}-attempt-${{ github.run_attempt }}
          path: ops/scripts/production/artifacts/production-boundary.json
          retention-days: 14
          if-no-files-found: warn

      - name: Remove temporary production payload
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${REMOTE_RELEASE:-}" ]] && [[ -f "$HOME/.ssh/config" ]]; then
            ssh nvx-prod "rm -rf '$REMOTE_RELEASE'" || true
          fi

      - name: Destroy production SSH identity
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/prod_key" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"

      - name: Write production deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo '## Production deployment PASS'
            echo
            echo "- Exact accepted SHA: \`$DEPLOY_SHA\`"
            echo '- Strict SSH host verification: PASS'
            echo '- Mandatory rollback snapshot: PASS'
            echo '- Directory cutover + post-validation: PASS'
            echo '- Production public boundary: 200, index/follow, exact HTML SHA'
          } >> "$GITHUB_STEP_SUMMARY"
