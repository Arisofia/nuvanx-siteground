name: Temporary Staging2 document governance A-B

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Configure SiteGround SSH
        env:
          SSH_HOST: ${{ secrets.STAGING2_SSH_HOST }}
          SSH_PORT_SECRET: ${{ secrets.STAGING2_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING2_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing STAGING2_SSH_HOST}"
          : "${SSH_USER:?Missing STAGING2_SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Missing STAGING2_SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing STAGING2_SSH_KNOWN_HOSTS}"
          SSH_PORT="${SSH_PORT_SECRET:-18765}"
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/siteground_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/siteground_key" "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host siteground-staging
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/siteground_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 15
          EOF
          chmod 600 "$HOME/.ssh/config"
      - name: A-B test global document governance buffer
        run: |
          set -euo pipefail
          ssh siteground-staging 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/home/customer/www/staging2.nuvanx.com/public_html
          cd "$ROOT"
          cp wp-content/themes/nuvanx-medical/header.php /tmp/nvx-header-backup.php
          restore() { cp /tmp/nvx-header-backup.php wp-content/themes/nuvanx-medical/header.php; }
          trap restore EXIT
          echo '--- CURRENT GOVERNANCE CALLS ---'
          grep -n 'nvx_document_governance_start' wp-content/themes/nuvanx-medical/header.php || true
          python3 - <<'PY'
          p='wp-content/themes/nuvanx-medical/header.php'
          s=open(p,encoding='utf8').read()
          needle='nvx_document_governance_start();'
          print('GOVERNANCE_CALL_COUNT='+str(s.count(needle)))
          if needle not in s: raise SystemExit('governance call not found in live header')
          s=s.replace(needle, '// TEMP DIAGNOSTIC: document governance buffer disabled;')
          open(p,'w',encoding='utf8').write(s)
          PY
          curl -ksS --resolve staging2.nuvanx.com:443:127.0.0.1 https://staging2.nuvanx.com/ -o /tmp/nvx-no-document-governance.html
          python3 - <<'PY'
          import re
          s=open('/tmp/nvx-no-document-governance.html',encoding='utf8',errors='replace').read()
          styles=[x for x in re.findall(r'<link\\b[^>]*>',s,re.I) if re.search(r'rel=["\\\'][^"\\\']*stylesheet',x,re.I)]
          print('NO_DOCUMENT_GOVERNANCE HTML_BYTES='+str(len(s))+' STYLESHEET_TAGS='+str(len(styles))+' NVX_BASE='+str('nvx-base.css' in s))
          for x in styles[:10]: print(x)
          if not styles or 'nvx-base.css' not in s: raise SystemExit('CSS still missing without document governance')
          PY
          restore
          trap - EXIT
          echo 'HEADER_RESTORED=1'
          REMOTE
