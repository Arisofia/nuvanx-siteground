name: Staging2 Block A Final Accept Once

on:
  push:
    paths:
      - '.github/workflows/staging2-block-a-final-accept-once.yml'

permissions:
  contents: read

concurrency:
  group: staging2-deployment
  cancel-in-progress: false

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TARGET_SHA: 13bf60a9b561d38e996eec59ad6868a3f45c48e3
      EXPECTED_SHA: 13bf60a9b561d38e996eec59ad6868a3f45c48e3
      WP_ROOT: /home/customer/www/staging2.nuvanx.com/public_html
      PROD_ROOT: /home/customer/www/nuvanx.com/public_html
      BASE_URL: https://staging2.nuvanx.com
      EXPECTED_HOST: staging2.nuvanx.com
      CI: true
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: 13bf60a9b561d38e996eec59ad6868a3f45c48e3
          fetch-depth: 0
          persist-credentials: false

      - name: Verify candidate contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$TARGET_SHA" origin/master
          bash -n tools/deploy/deploy-to-staging2.sh
          find wp-content/themes/nuvanx-medical/ -path '*/vendor' -prune -o -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null
          test -f scripts/staging2/verify-staging-boundary.mjs

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'

      - name: Static gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/lint/no-hardcoded-colors.mjs
          node scripts/lint/no-hardcoded-fontsize.mjs
          node scripts/lint/no-inline-layout-styles.mjs

      - name: Configure strict SSH
        shell: bash
        env:
          HOST: ${{ secrets.STAGING2_SSH_HOST }}
          PORT: ${{ secrets.STAGING2_SSH_PORT }}
          USER: ${{ secrets.STAGING2_SSH_USER }}
          KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${HOST:?}"; : "${USER:?}"; : "${KEY:?}"; : "${KH:?}"
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/k"; chmod 600 "$HOME/.ssh/k"
          printf '%s\n' "$KH" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx
            HostName $HOST
            User $USER
            Port ${PORT:-18765}
            IdentityFile $HOME/.ssh/k
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 20
            ServerAliveInterval 30
            ServerAliveCountMax 2
          EOF
          chmod 600 "$HOME/.ssh/config"
          ssh nvx "test -d '$WP_ROOT' && test -f '$WP_ROOT/wp-config.php' && command -v wp >/dev/null && command -v rsync >/dev/null && command -v php >/dev/null"

      - name: Verify isolation preflight
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx "WP_ROOT='$WP_ROOT' PROD_ROOT='$PROD_ROOT' bash -se" <<'REMOTE'
          set -euo pipefail
          test "$WP_ROOT" != "$PROD_ROOT"
          test "$(cd "$WP_ROOT" && wp config get DB_NAME)" = 'dbshcocboodiwr'
          test "$(cd "$PROD_ROOT" && wp config get DB_NAME)" = 'db0ecrycwv2tgb'
          test "$(cd "$WP_ROOT" && wp option get home)" = 'https://staging2.nuvanx.com'
          test "$(cd "$WP_ROOT" && wp option get siteurl)" = 'https://staging2.nuvanx.com'
          test "$(cd "$WP_ROOT" && wp option get blog_public)" = '0'
          test "$(cd "$WP_ROOT" && wp config get NVX_ENV)" = 'staging'
          test "$(cd "$WP_ROOT" && wp config get WP_ENVIRONMENT_TYPE)" = 'staging'
          if (cd "$WP_ROOT" && wp plugin is-active sg-cachepress); then exit 2; fi
          echo 'PREFLIGHT_ISOLATION=PASS'
          REMOTE

      - name: Upload immutable payload
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_RELEASE="$WP_ROOT/wp-content/.nuvanx-deployments/${TARGET_SHA}-${GITHUB_RUN_ID}"
          echo "REMOTE_RELEASE=$REMOTE_RELEASE" >> "$GITHUB_ENV"
          ssh nvx "mkdir -p '$REMOTE_RELEASE/theme'"
          rsync -az --delete --exclude='.git' --exclude='php_errorlog' --exclude='*.log' --exclude='_archive*' --exclude='_disabled*' --exclude='*.bak*' wp-content/themes/nuvanx-medical/ "nvx:$REMOTE_RELEASE/theme/"
          rsync -az tools/deploy/deploy-to-staging2.sh "nvx:$REMOTE_RELEASE/deploy-to-staging2.sh"
          rsync -az tools/deploy/deploy-required-mu-plugins.sh "nvx:$REMOTE_RELEASE/deploy-required-mu-plugins.sh"
          rsync -az tools/wp-cli/hygiene-content-fix.php "nvx:$REMOTE_RELEASE/hygiene-content-fix.php"

      - name: Deploy exact candidate
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx "NUVANX_CONFIRM=yes bash '$REMOTE_RELEASE/deploy-to-staging2.sh' --wp-root '$WP_ROOT' --source-theme '$REMOTE_RELEASE/theme' --sha '$TARGET_SHA' --confirm && NUVANX_CONFIRM=yes bash '$REMOTE_RELEASE/deploy-required-mu-plugins.sh' --environment staging2 --wp-root '$WP_ROOT' --confirm"
          ssh nvx "cd '$WP_ROOT' && wp eval-file '$REMOTE_RELEASE/hygiene-content-fix.php'"
          ssh nvx "WP_ROOT='$WP_ROOT' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$WP_ROOT"
          wp cache flush
          plugin_slug='sg-cachepress'
          if wp plugin is-active "$plugin_slug" >/dev/null 2>&1; then
            echo 'Speed Optimizer unexpectedly active before post-hygiene purge.' >&2
            exit 1
          fi
          restore_inactive() {
            set +e
            if wp plugin is-active "$plugin_slug" >/dev/null 2>&1; then wp plugin deactivate "$plugin_slug" --quiet || true; fi
          }
          trap restore_inactive EXIT
          wp plugin activate "$plugin_slug" --quiet
          wp plugin is-active "$plugin_slug"
          wp sg purge
          wp plugin deactivate "$plugin_slug" --quiet
          if wp plugin is-active "$plugin_slug" >/dev/null 2>&1; then exit 3; fi
          trap - EXIT
          echo 'siteground_wp_cli_purge=PASS mode=transient-activation-restored-inactive'
          rm -rf wp-content/uploads/siteground-optimizer-assets/siteground-optimizer-combined-*
          rm -rf wp-content/cache/sgo-cache/* wp-content/cache/*
          wp eval 'if (function_exists("opcache_reset")) { opcache_reset(); }'
          REMOTE

      - name: Verify exact live SHA and staging identity
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx "WP_ROOT='$WP_ROOT' TARGET_SHA='$TARGET_SHA' bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$WP_ROOT"
          deployed="$(tr -d '\r\n' < wp-content/themes/nuvanx-medical/.nvx-deploy-sha)"
          test "$deployed" = "$TARGET_SHA"
          test "$(wp config get DB_NAME)" = 'dbshcocboodiwr'
          test "$(wp option get home)" = 'https://staging2.nuvanx.com'
          test "$(wp option get siteurl)" = 'https://staging2.nuvanx.com'
          test "$(wp option get blog_public)" = '0'
          test "$(wp config get NVX_ENV)" = 'staging'
          test "$(wp config get WP_ENVIRONMENT_TYPE)" = 'staging'
          test "$(wp theme list --status=active --field=name)" = 'nuvanx-medical'
          if wp plugin is-active sg-cachepress; then exit 4; fi
          echo "DEPLOYED_SHA=$deployed"
          echo 'STAGING_IDENTITY=PASS'
          REMOTE

      - name: Verify content hygiene
        shell: bash
        run: |
          set -euo pipefail
          status=0
          ssh nvx "cd '$WP_ROOT' && grep -E -i -r 'valoraci[oó]n( m[eé]dica)? (gratis|gratuita)|consulta (m[eé]dica )?(gratis|gratuita)|sin compromiso|Tu mejor versi[oó]n empieza aqu[ií]|EXILITET|enfoque m[eé]dico premium' wp-content/themes/nuvanx-medical/inc/data/*.json" || status=$?
          case "$status" in
            0) echo 'Content hygiene failed.' >&2; exit 1 ;;
            1) echo 'CONTENT_HYGIENE=PASS' ;;
            *) exit "$status" ;;
          esac

      - name: Verify public Block A boundary on plain URLs
        shell: bash
        run: |
          set -euo pipefail
          pass=0
          for attempt in 1 2 3 4 5 6; do
            echo "Boundary attempt ${attempt}/6"
            if node scripts/staging2/verify-staging-boundary.mjs; then
              pass=1
              break
            fi
            sleep 5
          done
          test "$pass" = 1

      - name: Validate page template references
        shell: bash
        env:
          WORDPRESS_URL: https://staging2.nuvanx.com
        run: node scripts/validate-page-templates.mjs

      - name: Verify production unchanged read-only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$HOME/.ssh/config"
          ssh nvx "PROD_ROOT='$PROD_ROOT' bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$PROD_ROOT"
          test "$(wp config get DB_NAME)" = 'db0ecrycwv2tgb'
          test "$(wp option get home)" = 'https://nuvanx.com'
          test "$(wp option get siteurl)" = 'https://nuvanx.com'
          test "$(wp option get blog_public)" = '1'
          test "$(wp theme list --status=active --field=name)" = 'nuvanx-medical'
          echo 'PRODUCTION_UNCHANGED=PASS'
          REMOTE

      - name: Upload Block A evidence
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: staging2-block-a-final-${{ env.TARGET_SHA }}
          path: scripts/staging2/artifacts/staging2-boundary.json
          retention-days: 14
          if-no-files-found: error

      - name: Cleanup remote payload
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${REMOTE_RELEASE:-}" ]] && [[ -f "$HOME/.ssh/config" ]]; then ssh nvx "rm -rf '$REMOTE_RELEASE'" || true; fi

      - name: Destroy SSH identity
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/k" "$HOME/.ssh/config" "$HOME/.ssh/known_hosts"
