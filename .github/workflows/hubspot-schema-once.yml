name: Attribution QA One-Shot

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  diagnose:
    name: Inventory Staging2 HTTP guard callbacks
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_ROOT: /home/customer/www/staging2.nuvanx.com/public_html
    steps:
      - name: Configure strict Staging2 SSH
        shell: bash
        env:
          HOST: ${{ secrets.STAGING2_SSH_HOST }}
          PORT: ${{ secrets.STAGING2_SSH_PORT }}
          USER: ${{ secrets.STAGING2_SSH_USER }}
          KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          : "${HOST:?Missing STAGING2_SSH_HOST}"
          : "${USER:?Missing STAGING2_SSH_USER}"
          : "${KEY:?Missing STAGING2_SSH_PRIVATE_KEY}"
          : "${KH:?Missing STAGING2_SSH_KNOWN_HOSTS}"
          SSH_PORT="${PORT:-18765}"
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/staging_key"
          chmod 600 "$HOME/.ssh/staging_key"
          printf '%s\n' "$KH" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx-staging2
            HostName $HOST
            User $USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/staging_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 15
            ConnectionAttempts 1
          EOF
          chmod 600 "$HOME/.ssh/config"
          ssh -n nvx-staging2 "test -d '$STAGING_ROOT' && command -v wp >/dev/null"
          echo 'STAGING_SSH=PASS'

      - name: Inventory pre_http_request callbacks only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh nvx-staging2 "STAGING_ROOT='$STAGING_ROOT' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$STAGING_ROOT"
          test "$(wp config get DB_NAME)" = 'dbshcocboodiwr'
          test "$(wp option get home)" = 'https://staging2.nuvanx.com'
          wp eval '
          global $wp_filter;
          $hook = $wp_filter["pre_http_request"] ?? null;
          if (!$hook || empty($hook->callbacks)) {
              echo "PRE_HTTP_REQUEST_CALLBACKS=0\n";
          } else {
              $count = 0;
              foreach ($hook->callbacks as $priority => $callbacks) {
                  foreach ($callbacks as $callback) {
                      $fn = $callback["function"] ?? null;
                      $name = "unknown";
                      $file = "unknown";
                      try {
                          if (is_string($fn)) {
                              $name = $fn;
                              $ref = new ReflectionFunction($fn);
                              $file = (string) $ref->getFileName();
                          } elseif (is_array($fn) && count($fn) === 2) {
                              $class = is_object($fn[0]) ? get_class($fn[0]) : (string) $fn[0];
                              $name = $class . "::" . (string) $fn[1];
                              $ref = new ReflectionMethod($fn[0], $fn[1]);
                              $file = (string) $ref->getFileName();
                          } elseif ($fn instanceof Closure) {
                              $name = "closure";
                              $ref = new ReflectionFunction($fn);
                              $file = (string) $ref->getFileName();
                          }
                      } catch (Throwable $e) {
                          $file = "reflection_error";
                      }
                      echo "PRE_HTTP_REQUEST_CALLBACK priority=" . (int) $priority . " name=" . sanitize_key(str_replace(array("::", "\\"), "_", $name)) . " file=" . $file . "\n";
                      $count++;
                  }
              }
              echo "PRE_HTTP_REQUEST_CALLBACKS=" . $count . "\n";
          }
          '
          REMOTE
