name: Staging2 Media Source Recovery V4 Once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/staging2-media-source-recovery-v4-once.yml

permissions:
  contents: read

concurrency:
  group: staging2-media-source-recovery-v4
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING_ROOT: /home/customer/www/staging2.nuvanx.com/public_html
      PROD_ROOT: /home/customer/www/nuvanx.com/public_html
      STAGING_URL: https://staging2.nuvanx.com
      EXPECTED_STAGING_SHA: d54dfa7df226dbd5b823fca1878ce8a60a3548cb
      EXPECTED_PROD_SHA: 4775310be2b7dcdda18f8fd6de8e40041c2eb555

    steps:
      - name: Configure strict SiteGround SSH
        shell: bash
        env:
          HOST: ${{ secrets.STAGING2_SSH_HOST }}
          PORT: ${{ secrets.STAGING2_SSH_PORT }}
          USER: ${{ secrets.STAGING2_SSH_USER }}
          KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${HOST:?Missing STAGING2_SSH_HOST}"
          : "${USER:?Missing STAGING2_SSH_USER}"
          : "${KEY:?Missing STAGING2_SSH_PRIVATE_KEY}"
          : "${KH:?Missing STAGING2_SSH_KNOWN_HOSTS}"
          SSH_PORT="${PORT:-18765}"
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KH" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx-sg
            HostName $HOST
            User $USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 20
            ServerAliveInterval 30
            ServerAliveCountMax 2
          EOF
          chmod 600 "$HOME/.ssh/config"
          ssh -n nvx-sg "test -d '$STAGING_ROOT' && test -d '$PROD_ROOT' && command -v wp >/dev/null && command -v curl >/dev/null && command -v cmp >/dev/null"
          test "$(ssh -n nvx-sg "tr -d '\\r\\n' < '$STAGING_ROOT/wp-content/themes/nuvanx-medical/.nvx-deploy-sha'")" = "$EXPECTED_STAGING_SHA"
          test "$(ssh -n nvx-sg "tr -d '\\r\\n' < '$PROD_ROOT/wp-content/themes/nuvanx-medical/.nvx-deploy-sha'")" = "$EXPECTED_PROD_SHA"
          test "$(ssh -n nvx-sg "cd '$STAGING_ROOT' && wp config get DB_NAME")" = 'dbshcocboodiwr'
          test "$(ssh -n nvx-sg "cd '$PROD_ROOT' && wp config get DB_NAME")" = 'db0ecrycwv2tgb'
          echo 'MEDIA_RECOVERY_V4_ENVIRONMENT_GUARD=PASS'

      - name: Materialize exact runtime-required production binaries
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/nvx-media-recovery-v4.txt"
          cat > "$manifest" <<'EOF'
          2025/04/cropped-nuvanx-icono-sitio.webp
          2025/04/cropped-nuvanx-icono-sitio-32x32.webp
          2025/04/cropped-nuvanx-icono-sitio-180x180.webp
          2025/04/cropped-nuvanx-icono-sitio-192x192.webp
          2025/04/cropped-nuvanx-icono-sitio-270x270.webp
          2026/06/nvx-co2-evaluacion-620.webp
          2026/06/nvx-co2-evaluacion-620-300x201.webp
          2026/06/nvx-co2-evaluacion-620-150x150.webp
          EOF
          sed -i 's/^[[:space:]]*//' "$manifest"

          count=0
          while IFS= read -r rel; do
            test -n "$rel" || continue
            src="$PROD_ROOT/wp-content/uploads/$rel"
            dst="$STAGING_ROOT/wp-content/uploads/$rel"
            ok=0
            for attempt in 1 2 3; do
              if output="$(ssh -n nvx-sg "test -s '$src' && mkdir -p '$(dirname "$dst")' && if test -e '$dst'; then cmp -s '$src' '$dst'; else cp -p '$src' '$dst'; fi && cmp -s '$src' '$dst' && sha256sum '$dst'" 2>&1)"; then
                echo "MEDIA_COPY_PASS rel=$rel $output"
                ok=1
                break
              fi
              echo "MEDIA_COPY_RETRY rel=$rel attempt=$attempt detail=$output" >&2
              sleep 2
            done
            test "$ok" = '1'
            count=$((count + 1))
          done < "$manifest"
          test "$count" = '8'
          echo 'MEDIA_RECOVERY_V4_COPY=PASS files=8'

      - name: Purge staging caches
        shell: bash
        run: |
          set -euo pipefail
          ssh -n nvx-sg "cd '$STAGING_ROOT' && wp cache flush >/dev/null"
          ssh -n nvx-sg "cd '$STAGING_ROOT' && if wp help sg >/dev/null 2>&1; then wp sg purge >/dev/null 2>&1 || true; fi"
          ssh -n nvx-sg "cd '$STAGING_ROOT' && wp eval 'if (function_exists(\"opcache_reset\")) { opcache_reset(); }' >/dev/null || true"
          echo 'STAGING_MEDIA_CACHE_PURGE=PASS'

      - name: Verify recovered URLs and rendered image graph
        shell: bash
        run: |
          set -euo pipefail
          ua='NUVANX-Staging-Media-Recovery/1.0'
          manifest="$RUNNER_TEMP/nvx-media-recovery-v4.txt"
          while IFS= read -r rel; do
            test -n "$rel" || continue
            code="$(ssh -n nvx-sg "curl -sS --max-time 20 -A '$ua' -o /dev/null -w '%{http_code}' '$STAGING_URL/wp-content/uploads/$rel'")"
            test "$code" = '200'
            echo "MEDIA_HTTP_PASS rel=$rel"
          done < "$manifest"

          code="$(ssh -n nvx-sg "curl -sS -L --max-redirs 3 --max-time 30 -A '$ua' -o /tmp/nvx-estetica-audit.html -w '%{http_code}' '$STAGING_URL/estetica-avanzada/'")"
          test "$code" = '200'
          ssh -n nvx-sg "grep -Fq '$EXPECTED_STAGING_SHA' /tmp/nvx-estetica-audit.html"
          ssh -n nvx-sg "! grep -Fq '/.well-known/sgcaptcha/' /tmp/nvx-estetica-audit.html"

          refs="$RUNNER_TEMP/nvx-estetica-image-refs.txt"
          ssh -n nvx-sg "grep -Eo 'https://staging2\\.nuvanx\\.com/wp-content/uploads/[^\" <>]+\\.(webp|jpe?g|png)' /tmp/nvx-estetica-audit.html | sort -u" > "$refs" || true
          test -s "$refs"
          total=0
          failures=0
          while IFS= read -r url; do
            test -n "$url" || continue
            total=$((total + 1))
            code="$(ssh -n nvx-sg "curl -sS --max-time 20 -A '$ua' -o /dev/null -w '%{http_code}' '$url'" || true)"
            if test "$code" != '200'; then
              failures=$((failures + 1))
              echo "RUNTIME_IMAGE_FAIL code=$code url=$url"
            fi
          done < "$refs"
          ssh -n nvx-sg "rm -f /tmp/nvx-estetica-audit.html"
          echo "RUNTIME_IMAGE_TOTAL=$total"
          echo "RUNTIME_IMAGE_FAIL=$failures"
          test "$failures" = '0'
          echo 'STAGING_MEDIA_RUNTIME=PASS'

      - name: Destroy SSH identity
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/key" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"
