name: Repair Staging Boundary Script

on:
  push:
    branches:
      - fix/staging2-origin-boundary-fallback-20260808
    paths:
      - .github/workflows/repair-staging-boundary-script.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/staging2-origin-boundary-fallback-20260808
          fetch-depth: 0
          persist-credentials: true
      - name: Replace remote shell template with literal line array
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('scripts/staging2/verify-staging-boundary.mjs')
          text=p.read_text(encoding='utf-8')
          pattern=r"  const remoteScript = String\.raw`.*?\n`;\n\n  const remoteCommand ="
          replacement="""  const remoteScript = [
    'set -Eeuo pipefail',
    'base_url=\"https://${EXPECTED_HOST}\"',
    'headers=\"$(mktemp)\"',
    'body=\"$(mktemp)\"',
    'cleanup() { rm -f \"$headers\" \"$body\"; }',
    'trap cleanup EXIT',
    'result=\"$(curl -sS -L --max-redirs 5 --max-time 30 -A \'NUVANX-Staging-Origin-Boundary/1.1\' -H \'Accept: text/html,application/xhtml+xml\' -D \"$headers\" -o \"$body\" -w \'%{http_code}|%{url_effective}\' \"${base_url}${ROUTE}\")\"',
    'code=\"${result%%|*}\"',
    'effective=\"${result#*|}\"',
    'test \"$code\" = \'200\'',
    'case \"$effective\" in',
    '  \"https://${EXPECTED_HOST}/\"*|\"https://${EXPECTED_HOST}\") ;;',
    '  *) echo \"ORIGIN_BOUNDARY_FAIL route=$ROUTE final=$effective\" >&2; exit 1 ;;',
    'esac',
    '! grep -Fq \'/.well-known/sgcaptcha/\' \"$body\"',
    '! grep -Eiq \'^sg-captcha:[[:space:]]*challenge\' \"$headers\"',
    'grep -Fq \"$EXPECTED_SHA\" \"$body\"',
    'robots_meta=\"$(grep -Eio \"<meta[^>]+name=[\\\'\\\"]robots[\\\'\\\"][^>]*>\" \"$body\" | head -n 1 || true)\"',
    'xrobots=\"$(grep -Ei \'^x-robots-tag:\' \"$headers\" | tail -n 1 || true)\"',
    'combined=\"${robots_meta} ${xrobots}\"',
    'printf \'%s\' \"$combined\" | grep -Eiq \'noindex\'',
    'printf \'%s\' \"$combined\" | grep -Eiq \'nofollow\'',
    'if printf \'%s\' \"$combined\" | grep -Eiq \'(^|[^a-z])index[[:space:]]*,?[[:space:]]*follow\'; then',
    '  echo \"ORIGIN_BOUNDARY_FAIL route=$ROUTE reason=index-follow\" >&2',
    '  exit 1',
    'fi',
    'echo \"ORIGIN_BOUNDARY=PASS route=$ROUTE status=$code final=$effective sha=$EXPECTED_SHA\"',
    '',
  ].join('\\n');

  const remoteCommand ="""
          updated,count=re.subn(pattern,replacement,text,count=1,flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected one remoteScript block, replaced {count}')
          p.write_text(updated,encoding='utf-8')
      - name: Validate script
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/staging2/verify-staging-boundary.mjs
          grep -Fq "].join('\\n');" scripts/staging2/verify-staging-boundary.mjs
          git diff --check
      - name: Commit script only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Nuvanx Engineering'
          git config user.email 'admin@nuvanx.com'
          git add scripts/staging2/verify-staging-boundary.mjs
          git diff --cached --check
          git commit -m 'fix(staging2): make origin fallback shell literal safe'
          git push origin HEAD:fix/staging2-origin-boundary-fallback-20260808
