name: Integrate valuation form release fix visible

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/tmp-integrate-valoracion-form.yml'
      - '.github/workflows/tmp-integrate-valoracion-form-visible.yml'

permissions:
  contents: read

concurrency:
  group: tmp-integrate-valoracion-form-visible
  cancel-in-progress: false

jobs:
  integrate:
    if: github.event.pull_request.number == 312 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f
        with:
          php-version: '8.2'
          coverage: none
          tools: none

      - name: Integrate managed valuation module
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          functions_path = Path('wp-content/themes/nuvanx-medical/functions.php')
          functions = functions_path.read_text(encoding='utf-8')
          solutions_line = "require_once get_template_directory() . '/inc/nvx-solutions-page.php';\n"
          if functions.count(solutions_line) == 2:
              functions = functions.replace(solutions_line + solutions_line, solutions_line, 1)
          contact_line = "require_once get_template_directory() . '/inc/nvx-contacto-valoracion-page.php';\n"
          managed_line = "require_once get_template_directory() . '/inc/nvx-valoracion-managed-page.php';\n"
          if managed_line not in functions:
              if functions.count(contact_line) != 1:
                  raise SystemExit('Could not identify contact/valuation bootstrap line.')
              functions = functions.replace(contact_line, contact_line + managed_line, 1)
          if functions.count(solutions_line) != 1 or functions.count(managed_line) != 1:
              raise SystemExit('Bootstrap integration count is invalid.')
          functions_path.write_text(functions, encoding='utf-8')

          shell_path = Path('wp-content/themes/nuvanx-medical/template-parts/content/nvx-page-shell.php')
          shell = shell_path.read_text(encoding='utf-8')
          solutions_block = """\tif ( ! $has_managed_editorial && function_exists( 'nvx_content_is_solutions_page' ) && nvx_content_is_solutions_page( $content ) ) {
          \t\t$has_managed_editorial = true;
          \t}
          """
          if shell.count(solutions_block) == 2:
              shell = shell.replace(solutions_block + solutions_block, solutions_block, 1)
          valuation_block = """\tif ( ! $has_managed_editorial && function_exists( 'nvx_is_valoracion_page_request' ) && nvx_is_valoracion_page_request() ) {
          \t\t$has_managed_editorial = true;
          \t}
          """
          if valuation_block not in shell:
              shell = shell.replace(solutions_block, solutions_block + valuation_block, 1)
          if shell.count(solutions_block) != 1 or shell.count(valuation_block) != 1:
              raise SystemExit('Managed hierarchy integration count is invalid.')
          shell_path.write_text(shell, encoding='utf-8')

          gate_path = Path('.github/workflows/theme-hygiene-gate.yml')
          gate = gate_path.read_text(encoding='utf-8')
          test_line = '          php scripts/theme-hygiene/test-valoracion-form-contract.php\n'
          anchor = '          php scripts/theme-hygiene/test-page-render-helpers.php\n'
          if test_line not in gate:
              if gate.count(anchor) != 1:
                  raise SystemExit('Could not identify Theme Hygiene runtime contract anchor.')
              gate = gate.replace(anchor, anchor + test_line, 1)
          gate_path.write_text(gate, encoding='utf-8')
          PY

      - name: Validate integrated release fix
        shell: bash
        run: |
          set -euo pipefail
          php -l wp-content/themes/nuvanx-medical/inc/nvx-valoracion-managed-page.php
          php -l wp-content/mu-plugins/nuvanx-valoracion-native-hubspot-form.php
          php -l wp-content/mu-plugins/nuvanx-contacto-hubspot-form.php
          php -l scripts/theme-hygiene/test-valoracion-form-contract.php
          bash -n tools/deploy/deploy-required-mu-plugins.sh
          find wp-content/themes/nuvanx-medical -type f -name '*.php' -print0 | xargs -0 -n 1 php -l >/tmp/php-lint.log
          php scripts/theme-hygiene/test-catalog-json-contract.php
          php scripts/theme-hygiene/test-catalog-json-runtime-contract.php
          php scripts/theme-hygiene/test-catalog-review-contract.php
          php scripts/theme-hygiene/test-page-render-helpers.php
          php scripts/theme-hygiene/test-valoracion-form-contract.php
          node --check scripts/theme-hygiene/test-theme-hygiene.mjs
          node scripts/theme-hygiene/test-theme-hygiene.mjs

      - name: Commit integrated non-workflow changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wp-content/themes/nuvanx-medical/functions.php
          git add wp-content/themes/nuvanx-medical/template-parts/content/nvx-page-shell.php
          git add .github/workflows/theme-hygiene-gate.yml
          git diff --cached --check
          git commit -m 'fix(valoracion): integrate managed form release contracts'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
