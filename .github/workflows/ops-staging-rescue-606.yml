name: Staging Queue Rescue One-Shot

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: read

jobs:
  rescue:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ops/staging-rescue-606-20260818'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel obsolete queued master run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_RUN_ID: '32176457283'
        run: |
          set -euo pipefail
          status="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${STALE_RUN_ID}" --jq '.status')"
          head_sha="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${STALE_RUN_ID}" --jq '.head_sha')"
          event="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${STALE_RUN_ID}" --jq '.event')"
          branch="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${STALE_RUN_ID}" --jq '.head_branch')"

          [[ "$event" == 'push' ]]
          [[ "$branch" == 'master' ]]
          [[ "$head_sha" == '6932154162b00a83d7de519fe2ff3a0b9e471336' ]]

          current_master="$(gh api "/repos/${GITHUB_REPOSITORY}/branches/master" --jq '.commit.sha')"
          [[ "$current_master" != "$head_sha" ]] || { echo 'STALE_RUN_ABORT reason=run_is_current_master' >&2; exit 1; }

          if [[ "$status" != 'completed' ]]; then
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${STALE_RUN_ID}/cancel" >/dev/null
            echo "STALE_MASTER_CANCEL_REQUESTED run_id=${STALE_RUN_ID}"
          fi

          for attempt in {1..30}; do
            status="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${STALE_RUN_ID}" --jq '.status')"
            [[ "$status" == 'completed' ]] && break
            sleep 2
          done

          conclusion="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${STALE_RUN_ID}" --jq '.conclusion // "none"')"
          [[ "$status" == 'completed' ]] || { echo "STALE_MASTER_CANCEL_TIMEOUT run_id=${STALE_RUN_ID}" >&2; exit 1; }
          echo "STALE_MASTER_CLOSED run_id=${STALE_RUN_ID} conclusion=${conclusion} current_master=${current_master}"
