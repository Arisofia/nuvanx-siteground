name: Temporary Staging2 final URL crawl

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  crawl:
    if: startsWith(github.head_ref, 'ops/final-staging2-url-crawl') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Configure SiteGround SSH
        env:
          SSH_HOST: ${{ secrets.STAGING2_SSH_HOST }}
          SSH_PORT_SECRET: ${{ secrets.STAGING2_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING2_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing STAGING2_SSH_HOST}"
          : "${SSH_USER:?Missing STAGING2_SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Missing STAGING2_SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing STAGING2_SSH_KNOWN_HOSTS}"
          SSH_PORT="${SSH_PORT_SECRET:-18765}"
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/siteground_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/siteground_key" "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host siteground-staging
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/siteground_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 15
          EOF
          chmod 600 "$HOME/.ssh/config"
      - name: Crawl every published page, post and category from SiteGround origin
        run: |
          set -euo pipefail
          mkdir -p evidence
          ssh siteground-staging 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/home/customer/www/staging2.nuvanx.com/public_html
          cd "$ROOT"
          wp plugin activate sg-cachepress >/dev/null 2>&1 || true
          wp plugin activate complianz-gdpr >/dev/null 2>&1 || true
          wp cache flush >/dev/null 2>&1 || true
          wp sg purge >/dev/null 2>&1 || true
          wp eval '
            $rows = array();
            foreach (get_posts(array("post_type"=>"page","post_status"=>"publish","numberposts"=>-1,"orderby"=>"ID","order"=>"ASC")) as $p) { $rows[] = array("page",$p->ID,get_permalink($p)); }
            foreach (get_posts(array("post_type"=>"post","post_status"=>"publish","numberposts"=>-1,"orderby"=>"ID","order"=>"ASC")) as $p) { $rows[] = array("post",$p->ID,get_permalink($p)); }
            foreach (get_terms(array("taxonomy"=>"category","hide_empty"=>false)) as $t) { if (!is_wp_error($t)) { $rows[] = array("category",$t->term_id,get_category_link($t->term_id)); } }
            echo "type\\tid\\turl\\n";
            foreach ($rows as $r) { echo implode("\\t",$r)."\\n"; }
          ' > /tmp/nvx-final-urls.tsv
          wc -l /tmp/nvx-final-urls.tsv
          rm -f /tmp/nvx-final-results.tsv
          printf 'type\tid\turl\tstatus\tfinal_url\th1\tmain\tcss\tnvx_base\tbytes\n' > /tmp/nvx-final-results.tsv
          tail -n +2 /tmp/nvx-final-urls.tsv | while IFS=$'\t' read -r type id url; do
            file="/tmp/nvx-final-${type}-${id}.html"
            meta="$(curl -ksS -L --max-time 25 -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' --resolve staging2.nuvanx.com:443:127.0.0.1 -o "$file" -w '%{http_code}\t%{url_effective}\t%{size_download}' "$url" || true)"
            status="${meta%%$'\t'*}"; rest="${meta#*$'\t'}"; final_url="${rest%%$'\t'*}"; bytes="${rest##*$'\t'}"
            h1=0; main=0; css=0; nvx_base=0
            grep -Eqi '<h1\b' "$file" && h1=1 || true
            grep -Eqi '<main\b' "$file" && main=1 || true
            grep -Eqi '<link[^>]+rel=["'"'][^"'"']*stylesheet' "$file" && css=1 || true
            grep -q 'nvx-base.css' "$file" && nvx_base=1 || true
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$type" "$id" "$url" "$status" "$final_url" "$h1" "$main" "$css" "$nvx_base" "$bytes" >> /tmp/nvx-final-results.tsv
          done
          echo '--- FINAL CRAWL SUMMARY ---'
          cat /tmp/nvx-final-results.tsv
          python3 - <<'PY'
          import csv
          rows=list(csv.DictReader(open('/tmp/nvx-final-results.tsv'),delimiter='\\t'))
          total=len(rows)
          ok=[r for r in rows if r['status']=='200' and r['h1']=='1' and r['main']=='1' and r['css']=='1' and r['nvx_base']=='1']
          print(f'TOTAL={total}')
          print(f'PASS={len(ok)}')
          print(f'FAIL={total-len(ok)}')
          if total != 64: raise SystemExit(f'expected 64 routes, got {total}')
          if len(ok) != total: raise SystemExit('one or more routes failed final contract')
          PY
          REMOTE
          scp siteground-staging:/tmp/nvx-final-results.tsv evidence/staging2-final-url-results.tsv
          printf '%s\n' 'FINAL_URL_CRAWL_OK' > evidence/status.txt
      - name: Upload final URL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging2-final-url-crawl-${{ github.run_id }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
