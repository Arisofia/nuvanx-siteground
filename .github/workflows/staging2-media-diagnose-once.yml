name: Staging2 Media Diagnose Once

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/staging2-media-diagnose-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING_ROOT: /home/customer/www/staging2.nuvanx.com/public_html
      PROD_ROOT: /home/customer/www/nuvanx.com/public_html
    steps:
      - name: Configure strict SSH
        shell: bash
        env:
          HOST: ${{ secrets.STAGING2_SSH_HOST }}
          PORT: ${{ secrets.STAGING2_SSH_PORT }}
          USER: ${{ secrets.STAGING2_SSH_USER }}
          KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${HOST:?Missing STAGING2_SSH_HOST}"
          : "${USER:?Missing STAGING2_SSH_USER}"
          : "${KEY:?Missing STAGING2_SSH_PRIVATE_KEY}"
          : "${KH:?Missing STAGING2_SSH_KNOWN_HOSTS}"
          SSH_PORT="${PORT:-18765}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/staging2_key"
          chmod 600 "$HOME/.ssh/staging2_key"
          printf '%s\n' "$KH" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx
            HostName $HOST
            User $USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/staging2_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 20
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Diagnose staging and production media read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx "STAGING_ROOT='$STAGING_ROOT' PROD_ROOT='$PROD_ROOT' bash -se" <<'REMOTE'
          set -euo pipefail

          inspect_attachment() {
            local root="$1"
            local label="$2"
            local id="$3"
            [[ "$id" =~ ^[0-9]+$ ]] || return 0
            [[ "$id" -gt 0 ]] || return 0
            cd "$root"
            local rel full url
            rel="$(wp post meta get "$id" _wp_attached_file 2>/dev/null || true)"
            full="$(wp eval "echo get_attached_file($id);" 2>/dev/null || true)"
            url="$(wp eval "echo wp_get_attachment_url($id);" 2>/dev/null || true)"
            echo "ATTACHMENT env=$label id=$id rel=$rel url=$url"
            if [[ -n "$full" && -f "$full" ]]; then
              echo "ATTACHMENT_FILE env=$label id=$id exists=YES path=$full bytes=$(wc -c < "$full" | tr -d ' ')"
            else
              echo "ATTACHMENT_FILE env=$label id=$id exists=NO path=${full:-MISSING}"
            fi
          }

          inspect_env() {
            local root="$1"
            local label="$2"
            cd "$root"
            echo "=== ENV $label ==="
            echo "root=$root"
            echo "db=$(wp config get DB_NAME)"
            echo "home=$(wp option get home)"
            echo "siteurl=$(wp option get siteurl)"
            echo "deploy_sha=$(cat wp-content/themes/nuvanx-medical/.nvx-deploy-sha 2>/dev/null || true)"

            local logo_id
            logo_id="$(wp eval 'echo (int) get_theme_mod("custom_logo", 0);')"
            echo "CUSTOM_LOGO env=$label id=$logo_id"
            inspect_attachment "$root" "$label" "$logo_id"

            local slug pid title status thumb content ids direct_urls
            for slug in equipo-medico estetica-avanzada; do
              pid="$(wp post list --post_type=page --name="$slug" --field=ID --format=ids | awk '{print $1}')"
              echo "PAGE env=$label slug=$slug id=${pid:-MISSING}"
              if [[ -z "$pid" ]]; then
                continue
              fi
              title="$(wp post get "$pid" --field=post_title)"
              status="$(wp post get "$pid" --field=post_status)"
              thumb="$(wp post meta get "$pid" _thumbnail_id 2>/dev/null || true)"
              echo "PAGE_META env=$label slug=$slug title=$title status=$status featured=${thumb:-0}"
              inspect_attachment "$root" "$label" "${thumb:-0}"

              content="$(wp post get "$pid" --field=content)"
              ids="$(printf '%s' "$content" | grep -oE 'wp-image-[0-9]+' | sed 's/wp-image-//' | sort -nu | tr '\n' ' ' || true)"
              echo "CONTENT_ATTACHMENT_IDS env=$label slug=$slug ids=${ids:-NONE}"
              for id in $ids; do
                inspect_attachment "$root" "$label" "$id"
              done

              direct_urls="$(printf '%s' "$content" | grep -oE 'https?://[^\"[:space:]<>]+/wp-content/uploads/[^\"[:space:]<>]+' | sort -u | tr '\n' ' ' || true)"
              echo "CONTENT_UPLOAD_URLS env=$label slug=$slug urls=${direct_urls:-NONE}"
            done
          }

          inspect_env "$STAGING_ROOT" staging
          inspect_env "$PROD_ROOT" production

          echo '=== CROSS-ROOT FILE PARITY FOR STAGING ATTACHMENTS ==='
          cd "$STAGING_ROOT"
          for slug in equipo-medico estetica-avanzada; do
            pid="$(wp post list --post_type=page --name="$slug" --field=ID --format=ids | awk '{print $1}')"
            [[ -n "$pid" ]] || continue
            content="$(wp post get "$pid" --field=content)"
            ids="$(printf '%s' "$content" | grep -oE 'wp-image-[0-9]+' | sed 's/wp-image-//' | sort -nu || true)"
            thumb="$(wp post meta get "$pid" _thumbnail_id 2>/dev/null || true)"
            ids="$(printf '%s\n%s\n' "$ids" "$thumb" | grep -E '^[0-9]+$' | sort -nu || true)"
            for id in $ids; do
              rel="$(wp post meta get "$id" _wp_attached_file 2>/dev/null || true)"
              [[ -n "$rel" ]] || continue
              s="$STAGING_ROOT/wp-content/uploads/$rel"
              p="$PROD_ROOT/wp-content/uploads/$rel"
              s_exists=NO; p_exists=NO
              [[ -f "$s" ]] && s_exists=YES
              [[ -f "$p" ]] && p_exists=YES
              echo "PARITY slug=$slug attachment=$id rel=$rel staging=$s_exists production=$p_exists"
            done
          done

          echo 'MEDIA_DIAGNOSIS=PASS_READ_ONLY'
          REMOTE

      - name: Destroy SSH identity
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/staging2_key" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"
