name: Restore Staging2 Last Accepted Once

on:
  push:
    paths:
      - '.github/workflows/restore-staging2-last-accepted-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch guarded staging restore
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 13bf60a9b561d38e996eec59ad6868a3f45c48e3
        shell: bash
        run: |
          set -euo pipefail
          payload="$(printf '{\"ref\":\"master\",\"inputs\":{\"sha\":\"%s\",\"run_block_c_acceptance\":\"false\"}}' "$TARGET_SHA")"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/Arisofia/nuvanx-siteground/actions/workflows/deploy-staging2.yml/dispatches \
            -d "$payload"
          echo "RESTORE_DISPATCHED_SHA=$TARGET_SHA"
