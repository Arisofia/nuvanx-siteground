name: SonarQube Cloud CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    runs-on: ubuntu-24.04
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_CI_ENABLED: ${{ vars.SONAR_CI_ENABLED }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Explain inactive Sonar CI scan
        if: env.SONAR_TOKEN == '' || env.SONAR_CI_ENABLED != 'true'
        shell: bash
        run: |
          echo 'Sonar scan is skipped until SONAR_TOKEN is set and SONAR_CI_ENABLED=true.'

      - name: SonarQube Cloud scan
        if: env.SONAR_TOKEN != '' && env.SONAR_CI_ENABLED == 'true'
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
