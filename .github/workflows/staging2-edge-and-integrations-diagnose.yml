name: Staging2 Edge and Integrations Diagnose

on:
  push:
    paths:
      - '.github/workflows/staging2-edge-and-integrations-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING_ROOT: /home/customer/www/staging2.nuvanx.com/public_html
    steps:
      - name: Configure strict SSH
        shell: bash
        env:
          STAGING2_SSH_HOST: ${{ secrets.STAGING2_SSH_HOST }}
          STAGING2_SSH_PORT: ${{ secrets.STAGING2_SSH_PORT }}
          STAGING2_SSH_USER: ${{ secrets.STAGING2_SSH_USER }}
          STAGING2_SSH_PRIVATE_KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          STAGING2_SSH_KNOWN_HOSTS: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${STAGING2_SSH_HOST:?}"
          : "${STAGING2_SSH_USER:?}"
          : "${STAGING2_SSH_PRIVATE_KEY:?}"
          : "${STAGING2_SSH_KNOWN_HOSTS:?}"
          port="${STAGING2_SSH_PORT:-18765}"
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s\n' "$STAGING2_SSH_PRIVATE_KEY" > "$HOME/.ssh/staging2_key"; chmod 600 "$HOME/.ssh/staging2_key"
          printf '%s\n' "$STAGING2_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx-staging2-diagnose
            HostName $STAGING2_SSH_HOST
            User $STAGING2_SSH_USER
            Port $port
            IdentityFile $HOME/.ssh/staging2_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 20
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Inspect public edge response from runner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess, tempfile, re
          url='https://staging2.nuvanx.com/'
          with tempfile.NamedTemporaryFile() as body, tempfile.NamedTemporaryFile() as hdr:
              cp=subprocess.run(['curl','-sS','-L','--max-redirs','5','-D',hdr.name,'-o',body.name,'-w','%{http_code}\n%{url_effective}\n%{size_download}',url],text=True,capture_output=True)
              print('curl_rc='+str(cp.returncode))
              print(cp.stdout.strip())
              hdr.seek(0); headers=hdr.read().decode('utf-8','replace')
              body.seek(0); raw=body.read().decode('utf-8','replace')
          allow=('HTTP/','server:','location:','content-type:','content-length:','cache-control:','x-','cf-','sg-','retry-after:')
          print('=== selected response headers ===')
          for line in headers.splitlines():
              if line.lower().startswith(allow): print(line[:500])
          text=re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',raw)).strip()
          print('body_text_prefix='+text[:500])
          print('body_sha256='+__import__('hashlib').sha256(raw.encode()).hexdigest())
          PY

      - name: Inspect vhost/local response and integrations over SSH
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-staging2-diagnose "STAGING_ROOT='$STAGING_ROOT' bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$STAGING_ROOT"

          echo '=== local/vhost HTTP probes ==='
          for target in \
            'http://127.0.0.1/' \
            'https://127.0.0.1/' \
            'https://staging2.nuvanx.com/'; do
            echo "TARGET=$target"
            if [[ "$target" == *'127.0.0.1'* ]]; then
              if [[ "$target" == https:* ]]; then
                curl -ksS -H 'Host: staging2.nuvanx.com' -o /tmp/nvx-body -D /tmp/nvx-hdr -w 'status=%{http_code} final=%{url_effective} size=%{size_download}\n' "$target" || true
              else
                curl -sS -H 'Host: staging2.nuvanx.com' -o /tmp/nvx-body -D /tmp/nvx-hdr -w 'status=%{http_code} final=%{url_effective} size=%{size_download}\n' "$target" || true
              fi
            else
              curl -sS -L --max-redirs 5 -o /tmp/nvx-body -D /tmp/nvx-hdr -w 'status=%{http_code} final=%{url_effective} size=%{size_download}\n' "$target" || true
            fi
            grep -Ei '^(HTTP/|server:|location:|content-type:|content-length:|cache-control:|x-|sg-|retry-after:)' /tmp/nvx-hdr | tail -n 30 || true
            python3 - <<'PY'
          import re,hashlib
          p='/tmp/nvx-body'
          try:
              raw=open(p,'rb').read().decode('utf-8','replace')
          except Exception:
              raw=''
          robots=''
          for tag in re.findall(r'<meta\b[^>]*>', raw, re.I):
              if re.search(r'\bname\s*=\s*["\']robots["\']',tag,re.I):
                  m=re.search(r'\bcontent\s*=\s*["\']([^"\']*)["\']',tag,re.I)
                  robots=m.group(1) if m else ''
                  break
          txt=re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',raw)).strip()
          print('robots='+robots)
          print('body_prefix='+txt[:300])
          print('body_sha256='+hashlib.sha256(raw.encode()).hexdigest())
          PY
          done
          rm -f /tmp/nvx-body /tmp/nvx-hdr

          echo '=== staging active plugins ==='
          wp plugin list --status=active --fields=name,status,version --format=csv

          echo '=== code snippets side-effect classification ==='
          prefix="$(wp db prefix)"
          if wp db query "SHOW TABLES LIKE '${prefix}snippets'" --skip-column-names 2>/dev/null | grep -q .; then
            cols="$(wp db query "SHOW COLUMNS FROM ${prefix}snippets" --skip-column-names | awk '{print $1}' | tr '\n' ' ')"
            echo "snippets_columns=$cols"
            if echo "$cols" | grep -qw code; then
              wp db query "SELECT id, name, active, CASE WHEN LOWER(code) REGEXP 'wp_mail|mail\\(|curl_|wp_remote_|webhook|hubspot|klaviyo|facebook|graph\\.facebook|doctoralia|whatsapp|api\\.' THEN 'SIDE_EFFECT_REF' ELSE 'NO_MATCH' END AS side_effect_ref FROM ${prefix}snippets ORDER BY id" --skip-column-names 2>/dev/null || true
            fi
          else
            echo 'snippets_table=not_found'
          fi

          echo '=== cron hooks related to external integrations ==='
          wp cron event list --fields=hook,next_run_relative,recurrence --format=csv 2>/dev/null | grep -Ei 'klaviyo|google|site.?kit|facebook|meta|joinchat|whatsapp|doctoralia|hubspot|mail|webhook|ylabs|wpvibe' || true

          echo '=== wp-config staging constants relevant to outbound controls ==='
          for c in NVX_ENV WP_ENVIRONMENT_TYPE DISABLE_WP_CRON WP_HTTP_BLOCK_EXTERNAL; do
            val="$(wp config get "$c" 2>/dev/null || true)"
            if test -n "$val"; then echo "$c=$val"; else echo "$c=UNSET"; fi
          done
          REMOTE

      - name: Destroy SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/staging2_key" "$HOME/.ssh/config" "$HOME/.ssh/known_hosts"
