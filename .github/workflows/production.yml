name: Production
run-name: >-
  Production · ${{ inputs.deploy && format('release · {0}', inputs.candidate_sha) || format('verification · {0}', inputs.candidate_sha) }}

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Promote the exact accepted Staging SHA to production.
        required: true
        default: true
        type: boolean
      candidate_sha:
        description: Exact 40-character SHA with successful immutable Staging acceptance evidence.
        required: true
        type: string
      run_post_audits:
        description: Run SEO/GEO, Search Console URL Inspection and IndexNow verification/submission.
        required: true
        default: true
        type: boolean
      run_performance:
        description: Run the Lighthouse production matrix.
        required: true
        default: false
        type: boolean
      run_hubspot_e2e:
        description: Run the live HubSpot E2E. This creates a real QA contact.
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

# Each run owns a unique GitHub concurrency group. Cross-workflow mutation order
# is enforced by scripts/ci/wait-for-environment-mutation-turn.sh so a newer run
# cannot replace an older pending SHA in GitHub's single-pending concurrency slot.
concurrency:
  group: ${{ format('nuvanx-mutation-run-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  PROD_ROOT: /home/customer/www/nuvanx.com/public_html
  PROD_PARENT: /home/customer/www/nuvanx.com
  PROD_DB_NAME: db0ecrycwv2tgb
  BASE_URL: https://nuvanx.com
  EXPECTED_HOST: nuvanx.com
  SEARCH_CONSOLE_PROPERTY: https://nuvanx.com/
  INDEXNOW_KEY: 53546cf8077aa596b76aac664739bbb4
  STAGING_ACCEPTANCE_BRANCH: master
  STAGING_ACCEPTANCE_WORKFLOW_PATH: .github/workflows/staging.yml
  SSH_RETRY_ATTEMPTS: 5
  SSH_RETRY_BASE_DELAY_SECONDS: 15
  SSH_TRANSPORT_EXIT_CODE: 255

jobs:
  release:
    name: Promote immutable accepted SHA
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 105
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - name: Check out release control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release control plane
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci/wait-for-environment-mutation-turn.sh
          bash -n scripts/ci/verify-staging-acceptance.sh
          bash -n scripts/ci/test-mutation-fifo-contract.sh
          bash scripts/ci/test-mutation-fifo-contract.sh
          mapfile -t workflows < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -printf '%f\n' | sort)
          [[ "${workflows[*]}" == 'production.yml staging.yml' ]] || { printf 'Expected exactly two canonical workflows; found: %s\n' "${workflows[*]}" >&2; exit 1; }
          ! grep -Fq 'StrictHostKeyChecking=no' .github/workflows/production.yml
          echo 'PRODUCTION_CONTROL_PLANE=PASS workflows=2'

      - name: Resolve immutable requested candidate
        id: candidate
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          candidate="$(printf '%s' "$REQUESTED_SHA" | tr -d '[:space:]')"
          [[ "$candidate" =~ ^[0-9a-f]{40}$ ]] || { echo 'candidate_sha must be a full lowercase 40-character SHA.' >&2; exit 1; }
          git fetch --no-tags origin "$STAGING_ACCEPTANCE_BRANCH"
          git cat-file -e "${candidate}^{commit}"
          git merge-base --is-ancestor "$candidate" "origin/$STAGING_ACCEPTANCE_BRANCH" || { echo "Candidate is outside origin/$STAGING_ACCEPTANCE_BRANCH: $candidate" >&2; exit 1; }
          git cat-file -e "${candidate}:wp-content/themes/nuvanx-medical/functions.php"
          theme_tree="$(git rev-parse "${candidate}:wp-content/themes/nuvanx-medical")"
          echo "sha=$candidate" >> "$GITHUB_OUTPUT"
          echo "CANDIDATE_SHA=$candidate" >> "$GITHUB_ENV"
          echo "EXPECTED_SHA=$candidate" >> "$GITHUB_ENV"
          echo "CANDIDATE_THEME_TREE=$theme_tree" >> "$GITHUB_ENV"
          echo "PRODUCTION_CANDIDATE=$candidate"
          echo "PRODUCTION_CANDIDATE_THEME_TREE=$theme_tree"

      - name: Verify successful exact-SHA Staging acceptance evidence
        id: acceptance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/verify-staging-acceptance.sh

      - name: Materialize and validate exact candidate tooling
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_ROOT="$RUNNER_TEMP/production-candidate-$CANDIDATE_SHA"
          git worktree add --detach "$CANDIDATE_ROOT" "$CANDIDATE_SHA"
          test "$(git -C "$CANDIDATE_ROOT" rev-parse HEAD)" = "$CANDIDATE_SHA"
          find "$CANDIDATE_ROOT/wp-content/themes/nuvanx-medical" -path '*/vendor' -prune -o -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null
          bash -n "$CANDIDATE_ROOT/tools/deploy/deploy-to-prod.sh"
          node --check "$CANDIDATE_ROOT/scripts/production/verify-production-boundary.mjs"
          node --check "$CANDIDATE_ROOT/scripts/seo/index-pages.js"
          bash -n "$CANDIDATE_ROOT/scripts/production/document-head-title-audit.sh"
          bash -n "$CANDIDATE_ROOT/scripts/production/seo-geo-origin-audit.sh"
          bash -n "$CANDIDATE_ROOT/scripts/production/diagnose-title-emitters.sh"
          bash -n "$CANDIDATE_ROOT/scripts/production/indexnow-submit-sitemap.sh"
          grep -Fq 'ROLLBACK_SNAPSHOT=PASS' "$CANDIDATE_ROOT/tools/deploy/deploy-to-prod.sh"
          grep -Fq 'ROLLBACK_PRODUCTION=PASS' "$CANDIDATE_ROOT/tools/deploy/deploy-to-prod.sh"
          grep -Fq '.nvx-deploy-sha' "$CANDIDATE_ROOT/tools/deploy/deploy-to-prod.sh"
          echo "CANDIDATE_ROOT=$CANDIDATE_ROOT" >> "$GITHUB_ENV"
          echo "AUDIT_ROOT=$CANDIDATE_ROOT" >> "$GITHUB_ENV"
          echo "CANONICAL_AUDIT_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"
          echo "PRODUCTION_EXACT_TOOLING=PASS sha=$CANDIDATE_SHA"

      - name: Wait for FIFO environment mutation turn
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MUTATION_ROLE: production
          MUTATION_WAIT_MAX_SECONDS: 3600
        run: bash scripts/ci/wait-for-environment-mutation-turn.sh

      - name: Configure strict production SSH
        shell: bash
        env:
          HOST: ${{ secrets.PROD_SSH_HOST }}
          PORT: ${{ secrets.PROD_SSH_PORT }}
          USER: ${{ secrets.PROD_SSH_USER }}
          KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${HOST:?Missing PROD_SSH_HOST}"; : "${USER:?Missing PROD_SSH_USER}"; : "${KEY:?Missing PROD_SSH_PRIVATE_KEY}"; : "${KH:?Missing PROD_SSH_KNOWN_HOSTS}"
          SSH_PORT="${PORT:-18765}"; [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/prod_key"; chmod 600 "$HOME/.ssh/prod_key"
          printf '%s\n' "$KH" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts" || { echo 'PRODUCTION_KNOWN_HOSTS=EMPTY' >&2; exit 1; }
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx-prod
            HostName $HOST
            User $USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/prod_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 15
            ConnectionAttempts 1
            ServerAliveInterval 15
            ServerAliveCountMax 2
          EOF
          chmod 600 "$HOME/.ssh/config"

          classify_ssh_error() {
            local file="$1"
            if grep -qi 'Connection timed out' "$file"; then echo TCP_TIMEOUT
            elif grep -qi 'Connection refused' "$file"; then echo TCP_REFUSED
            elif grep -Eqi 'No route to host|Network is unreachable' "$file"; then echo NO_ROUTE
            elif grep -Eqi 'Host key verification failed|REMOTE HOST IDENTIFICATION HAS CHANGED' "$file"; then echo HOST_KEY_FAILURE
            elif grep -Eqi 'Permission denied|Too many authentication failures|no mutual signature' "$file"; then echo AUTH_FAILURE
            else echo SSH_HANDSHAKE_OR_UNKNOWN
            fi
          }

          prod_connected=0
          retry_delay="$SSH_RETRY_BASE_DELAY_SECONDS"
          last_reason='UNKNOWN'
          for attempt in $(seq 1 "$SSH_RETRY_ATTEMPTS"); do
            ssh_error="$RUNNER_TEMP/production-ssh-attempt-${attempt}.err"
            if ssh -n nvx-prod true 2>"$ssh_error"; then
              prod_connected=1
              echo "PRODUCTION_SSH_ATTEMPT=PASS attempt=$attempt"
              break
            fi
            last_reason="$(classify_ssh_error "$ssh_error")"
            echo "PRODUCTION_SSH_ATTEMPT=FAIL attempt=$attempt reason=$last_reason" >&2
            tail -n 2 "$ssh_error" >&2 || true
            if [[ "$attempt" -ne "$SSH_RETRY_ATTEMPTS" ]]; then
              sleep "$retry_delay"
              retry_delay=$((retry_delay + SSH_RETRY_BASE_DELAY_SECONDS))
            fi
          done
          [[ "$prod_connected" = 1 ]] || { echo "PRODUCTION_SSH=FAIL reason=$last_reason attempts=$SSH_RETRY_ATTEMPTS" >&2; exit "$SSH_TRANSPORT_EXIT_CODE"; }
          echo 'PRODUCTION_SSH=PASS'

      - name: Verify production preflight
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-prod "PROD_ROOT='$PROD_ROOT' PROD_DB_NAME='$PROD_DB_NAME' BASE_URL='$BASE_URL' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$PROD_ROOT"
          command -v wp >/dev/null
          command -v rsync >/dev/null
          command -v php >/dev/null
          command -v curl >/dev/null
          test "$(wp config get DB_NAME)" = "$PROD_DB_NAME"
          test "$(wp option get home)" = "$BASE_URL"
          test "$(wp option get siteurl)" = "$BASE_URL"
          test "$(wp option get blog_public)" = '1'
          test "$(wp theme list --status=active --field=name)" = 'nuvanx-medical'
          for legacy_mu in nuvanx-valoracion-native-hubspot-form.php nuvanx-contacto-hubspot-form.php nvx-disable-public-facebook-pixel.php nuvanx-google-attribution.php; do test ! -e "$PROD_ROOT/wp-content/mu-plugins/$legacy_mu"; done
          test ! -d "$PROD_ROOT/wp-content/mu-plugins/nuvanx-google-attribution"
          echo 'PRODUCTION_PREFLIGHT=PASS'
          REMOTE

      - name: Upload exact accepted payload and tooling
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_RELEASE="$PROD_PARENT/.nvx-releases/${CANDIDATE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "REMOTE_RELEASE=$REMOTE_RELEASE" >> "$GITHUB_ENV"
          ssh nvx-prod "mkdir -p '$REMOTE_RELEASE/theme' '$REMOTE_RELEASE/tools/migrations' '$REMOTE_RELEASE/lib'"
          rsync -az --delete --exclude='.git' --exclude='php_errorlog' --exclude='*.log' --exclude='_archive*' --exclude='_disabled*' --exclude='*.bak*' "$CANDIDATE_ROOT/wp-content/themes/nuvanx-medical/" "nvx-prod:$REMOTE_RELEASE/theme/"
          rsync -az "$CANDIDATE_ROOT/tools/deploy/deploy-to-prod.sh" "nvx-prod:$REMOTE_RELEASE/deploy-to-prod.sh"
          rsync -az "$CANDIDATE_ROOT/lib/" "nvx-prod:$REMOTE_RELEASE/lib/"
          rsync -az "$CANDIDATE_ROOT/tools/migrations/audit-content-divergence.php" "nvx-prod:$REMOTE_RELEASE/tools/migrations/"
          rsync -az "$CANDIDATE_ROOT/tools/migrations/content-hygiene-shared.php" "nvx-prod:$REMOTE_RELEASE/tools/migrations/"
          echo "PRODUCTION_PAYLOAD=PASS exact_sha=$CANDIDATE_SHA"

      - name: Execute guarded atomic production cutover
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-prod "NVX_RUN_TOKEN='${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}' NUVANX_CONFIRM=yes bash '$REMOTE_RELEASE/deploy-to-prod.sh' --prod-root '$PROD_ROOT' --source-theme '$REMOTE_RELEASE/theme' --sha '$CANDIDATE_SHA' --confirm"

      - name: Verify production public boundary and exact disk SHA
        shell: bash
        run: |
          set -euo pipefail
          pass=0
          for attempt in {1..6}; do
            if BASE_URL="$BASE_URL" EXPECTED_HOST="$EXPECTED_HOST" EXPECTED_SHA="$CANDIDATE_SHA" PRODUCTION_BOUNDARY_ARTIFACTS_DIR="$GITHUB_WORKSPACE/scripts/production/artifacts" node "$CANDIDATE_ROOT/scripts/production/verify-production-boundary.mjs"; then pass=1; break; fi
            sleep 10
          done
          test "$pass" = 1
          mkdir -p "$GITHUB_WORKSPACE/scripts/production/artifacts"
          cp -f "$CANDIDATE_ROOT/scripts/production/artifacts/production-boundary.json" "$GITHUB_WORKSPACE/scripts/production/artifacts/" 2>/dev/null || true
          ssh nvx-prod "PROD_ROOT='$PROD_ROOT' CANDIDATE_SHA='$CANDIDATE_SHA' PROD_DB_NAME='$PROD_DB_NAME' BASE_URL='$BASE_URL' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$PROD_ROOT"
          test "$(tr -d '\r\n' < wp-content/themes/nuvanx-medical/.nvx-deploy-sha)" = "$CANDIDATE_SHA"
          test "$(wp config get DB_NAME)" = "$PROD_DB_NAME"
          test "$(wp option get home)" = "$BASE_URL"
          test "$(wp option get siteurl)" = "$BASE_URL"
          test "$(wp option get blog_public)" = '1'
          echo "PRODUCTION_DEPLOYED_SHA=$CANDIDATE_SHA"
          REMOTE

      - name: Run exact-candidate production origin audits
        id: origin_audits
        if: ${{ inputs.run_post_audits }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts/production/artifacts scripts/seo/artifacts
          ssh nvx-prod "BASE_URL='$BASE_URL' bash -s" < "$CANDIDATE_ROOT/scripts/production/document-head-title-audit.sh" | tee scripts/production/artifacts/document-head-title-audit.log
          ssh nvx-prod "PROD_ROOT='$PROD_ROOT' BASE_URL='$BASE_URL' EXPECTED_HOST='$EXPECTED_HOST' bash -s" < "$CANDIDATE_ROOT/scripts/production/seo-geo-origin-audit.sh" | tee scripts/production/artifacts/seo-geo-origin-audit.log

          log='scripts/production/artifacts/seo-geo-origin-audit.log'
          out='scripts/seo/artifacts/sitemap-urls.txt'
          expected="$(sed -nE 's/^PASS SITEMAP_URL_COUNT count=([0-9]+)$/\1/p' "$log" | tail -n1)"
          grep '^PASS URL_SEO url=' "$log" | sed -E 's/^PASS URL_SEO url=([^ ]+) .*/\1/' > "$out" || true
          base_prefix="${BASE_URL%/}/"
          base_host="$(node -e 'process.stdout.write(new URL(process.argv[1]).host)' "$BASE_URL")"
          [[ -n "$base_prefix" && "$base_host" == "$EXPECTED_HOST" ]] || { echo "GSC_URL_INVENTORY=FAIL base_url=$BASE_URL base_host=${base_host:-missing} expected_host=$EXPECTED_HOST" >&2; exit 1; }
          actual="$(awk -v prefix="$base_prefix" 'index($0, prefix) == 1 { count++ } END { print count + 0 }' "$out")"
          [[ "$expected" =~ ^[0-9]+$ && "$actual" =~ ^[0-9]+$ && "$actual" -eq "$expected" && "$actual" -gt 0 ]] || { echo "GSC_URL_INVENTORY=FAIL expected=${expected:-missing} actual=$actual" >&2; exit 1; }
          [[ "$(sort -u "$out" | wc -l | tr -d ' ')" -eq "$actual" ]] || { echo 'GSC_URL_INVENTORY=FAIL duplicate_urls' >&2; exit 1; }

          ssh nvx-prod "PROD_ROOT='$PROD_ROOT' BASE_URL='$BASE_URL' EXPECTED_HOST='$EXPECTED_HOST' INDEXNOW_KEY='$INDEXNOW_KEY' bash -s" < "$CANDIDATE_ROOT/scripts/production/indexnow-submit-sitemap.sh" | tee scripts/production/artifacts/indexnow-submit.log
          echo "PRODUCTION_ORIGIN_AUDITS=PASS urls=$actual tooling_sha=$CANDIDATE_SHA"

      - name: Diagnose exact-candidate title emitters after audit failure
        if: ${{ always() && steps.origin_audits.outcome == 'failure' }}
        shell: bash
        run: |
          set +e
          if [[ -f "$HOME/.ssh/config" && -n "${CANDIDATE_ROOT:-}" ]]; then
            ssh nvx-prod "PROD_ROOT='$PROD_ROOT' BASE_URL='$BASE_URL' bash -s" < "$CANDIDATE_ROOT/scripts/production/diagnose-title-emitters.sh" | tee scripts/production/artifacts/title-emitter-diagnostic.log
          fi
          exit 0

      - name: Upload production boundary evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-boundary-${{ env.CANDIDATE_SHA }}-attempt-${{ github.run_attempt }}
          path: scripts/production/artifacts/production-boundary.json
          retention-days: 14
          if-no-files-found: warn

      - name: Upload production origin audit evidence
        if: ${{ always() && inputs.run_post_audits }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-origin-audit-${{ env.CANDIDATE_SHA }}
          path: |
            scripts/production/artifacts/*.log
            scripts/seo/artifacts/sitemap-urls.txt
          retention-days: 30
          if-no-files-found: error
          compression-level: 6
          overwrite: true

      - name: Cleanup production release payload and identities
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${REMOTE_RELEASE:-}" && -f "$HOME/.ssh/config" ]]; then ssh nvx-prod "rm -rf '$REMOTE_RELEASE'" || true; fi
          rm -f "$HOME/.ssh/prod_key" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"
          [[ -z "${CANDIDATE_ROOT:-}" ]] || git worktree remove --force "$CANDIDATE_ROOT" 2>/dev/null || true

      - name: Write release summary
        if: success()
        shell: bash
        run: |
          {
            echo '## Production release PASS'
            echo
            echo '- Candidate authority: immutable successful Staging acceptance artifact.'
            echo "- Exact SHA: \`$CANDIDATE_SHA\`"
            echo "- Theme tree: \`$CANDIDATE_THEME_TREE\`"
            echo "- Deploy/audit tooling SHA: \`$CANONICAL_AUDIT_SHA\`"
            echo '- FIFO lease prevented newer Staging/Production mutations from overtaking this release.'
            echo '- Atomic production cutover + rollback contract: PASS.'
          } >> "$GITHUB_STEP_SUMMARY"

  post_audits:
    name: Production SEO/GEO, GSC and IndexNow
    needs: release
    if: >-
      always() &&
      inputs.run_post_audits &&
      (needs.release.result == 'success' || inputs.deploy == false)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
    steps:
      - name: Check out exact candidate audit tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate candidate and production identity
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(printf '%s' "$CANDIDATE_SHA" | tr -d '[:space:]')"
          [[ "$candidate" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$candidate"
          if [[ "${{ inputs.deploy }}" == false ]]; then
            BASE_URL="$BASE_URL" EXPECTED_HOST="$EXPECTED_HOST" EXPECTED_SHA="$candidate" node scripts/production/verify-production-boundary.mjs
          fi
          echo "POST_AUDIT_TOOLING=PASS sha=$candidate"

      - name: Setup Node.js for Search Console audit
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install Search Console audit dependencies
        shell: bash
        run: npm ci --prefix scripts/seo --ignore-scripts

      - name: Download release origin audit evidence
        if: ${{ inputs.deploy }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: production-origin-audit-${{ needs.release.outputs.candidate_sha }}
          path: scripts

      - name: Validate release origin evidence handoff
        if: ${{ inputs.deploy }}
        shell: bash
        run: |
          set -euo pipefail
          test -s scripts/production/artifacts/document-head-title-audit.log
          test -s scripts/production/artifacts/seo-geo-origin-audit.log
          test -s scripts/production/artifacts/indexnow-submit.log
          test -s scripts/seo/artifacts/sitemap-urls.txt
          grep -Fq 'DOCUMENT_HEAD_TITLE_AUDIT=PASS' scripts/production/artifacts/document-head-title-audit.log
          grep -Fq 'SEO_GEO_ORIGIN_AUDIT=PASS' scripts/production/artifacts/seo-geo-origin-audit.log
          grep -Fq 'INDEXNOW_SUBMIT=PASS' scripts/production/artifacts/indexnow-submit.log
          echo "RELEASE_ORIGIN_EVIDENCE=PASS urls=$(wc -l < scripts/seo/artifacts/sitemap-urls.txt | tr -d ' ')"

      - name: Wait for FIFO environment turn (verification only)
        if: ${{ inputs.deploy == false }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MUTATION_ROLE: production-verification
          MUTATION_WAIT_MAX_SECONDS: 1800
        run: bash scripts/ci/wait-for-environment-mutation-turn.sh

      - name: Configure verification-only production audit SSH
        if: ${{ inputs.deploy == false }}
        shell: bash
        env:
          HOST: ${{ secrets.PROD_SSH_HOST }}
          PORT: ${{ secrets.PROD_SSH_PORT }}
          USER: ${{ secrets.PROD_SSH_USER }}
          KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${HOST:?Missing PROD_SSH_HOST}"; : "${USER:?Missing PROD_SSH_USER}"; : "${KEY:?Missing PROD_SSH_PRIVATE_KEY}"; : "${KH:?Missing PROD_SSH_KNOWN_HOSTS}"
          SSH_PORT="${PORT:-18765}"; [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          mkdir -p "$HOME/.ssh" scripts/production/artifacts scripts/seo/artifacts; chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/prod_audit_key"; chmod 600 "$HOME/.ssh/prod_audit_key"
          printf '%s\n' "$KH" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts" || { echo 'PRODUCTION_AUDIT_KNOWN_HOSTS=EMPTY' >&2; exit 1; }
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx-prod-audit
            HostName $HOST
            User $USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/prod_audit_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 15
            ConnectionAttempts 1
            ServerAliveInterval 15
            ServerAliveCountMax 2
          EOF
          chmod 600 "$HOME/.ssh/config"

          audit_connected=0
          retry_delay="$SSH_RETRY_BASE_DELAY_SECONDS"
          last_reason='UNKNOWN'
          for attempt in $(seq 1 "$SSH_RETRY_ATTEMPTS"); do
            ssh_error="$RUNNER_TEMP/production-audit-ssh-attempt-${attempt}.err"
            if ssh -n nvx-prod-audit true 2>"$ssh_error"; then
              audit_connected=1
              echo "PRODUCTION_AUDIT_SSH_ATTEMPT=PASS attempt=$attempt"
              break
            fi
            if grep -qi 'Connection timed out' "$ssh_error"; then last_reason='TCP_TIMEOUT'
            elif grep -qi 'Connection refused' "$ssh_error"; then last_reason='TCP_REFUSED'
            elif grep -Eqi 'No route to host|Network is unreachable' "$ssh_error"; then last_reason='NO_ROUTE'
            elif grep -Eqi 'Host key verification failed|REMOTE HOST IDENTIFICATION HAS CHANGED' "$ssh_error"; then last_reason='HOST_KEY_FAILURE'
            elif grep -Eqi 'Permission denied|Too many authentication failures|no mutual signature' "$ssh_error"; then last_reason='AUTH_FAILURE'
            else last_reason='SSH_HANDSHAKE_OR_UNKNOWN'; fi
            echo "PRODUCTION_AUDIT_SSH_ATTEMPT=FAIL attempt=$attempt reason=$last_reason" >&2
            tail -n 2 "$ssh_error" >&2 || true
            if [[ "$attempt" -ne "$SSH_RETRY_ATTEMPTS" ]]; then
              sleep "$retry_delay"
              retry_delay=$((retry_delay + SSH_RETRY_BASE_DELAY_SECONDS))
            fi
          done
          [[ "$audit_connected" = 1 ]] || { echo "PRODUCTION_AUDIT_SSH=FAIL reason=$last_reason attempts=$SSH_RETRY_ATTEMPTS" >&2; exit "$SSH_TRANSPORT_EXIT_CODE"; }
          echo 'PRODUCTION_AUDIT_SSH=PASS mode=verification-only'

      - name: Run verification-only exact-candidate origin audits
        if: ${{ inputs.deploy == false }}
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-prod-audit "BASE_URL='$BASE_URL' bash -s" < scripts/production/document-head-title-audit.sh | tee scripts/production/artifacts/document-head-title-audit.log
          ssh nvx-prod-audit "PROD_ROOT='$PROD_ROOT' BASE_URL='$BASE_URL' EXPECTED_HOST='$EXPECTED_HOST' bash -s" < scripts/production/seo-geo-origin-audit.sh | tee scripts/production/artifacts/seo-geo-origin-audit.log
          log='scripts/production/artifacts/seo-geo-origin-audit.log'
          out='scripts/seo/artifacts/sitemap-urls.txt'
          expected="$(sed -nE 's/^PASS SITEMAP_URL_COUNT count=([0-9]+)$/\1/p' "$log" | tail -n1)"
          grep '^PASS URL_SEO url=' "$log" | sed -E 's/^PASS URL_SEO url=([^ ]+) .*/\1/' > "$out" || true
          base_prefix="${BASE_URL%/}/"
          base_host="$(node -e 'process.stdout.write(new URL(process.argv[1]).host)' "$BASE_URL")"
          [[ -n "$base_prefix" && "$base_host" == "$EXPECTED_HOST" ]] || { echo "GSC_URL_INVENTORY=FAIL base_url=$BASE_URL base_host=${base_host:-missing} expected_host=$EXPECTED_HOST" >&2; exit 1; }
          actual="$(awk -v prefix="$base_prefix" 'index($0, prefix) == 1 { count++ } END { print count + 0 }' "$out")"
          [[ "$expected" =~ ^[0-9]+$ && "$actual" =~ ^[0-9]+$ && "$actual" -eq "$expected" && "$actual" -gt 0 ]] || { echo "GSC_URL_INVENTORY=FAIL expected=${expected:-missing} actual=$actual" >&2; exit 1; }
          [[ "$(sort -u "$out" | wc -l | tr -d ' ')" -eq "$actual" ]] || { echo 'GSC_URL_INVENTORY=FAIL duplicate_urls' >&2; exit 1; }
          ssh nvx-prod-audit "PROD_ROOT='$PROD_ROOT' BASE_URL='$BASE_URL' EXPECTED_HOST='$EXPECTED_HOST' INDEXNOW_KEY='$INDEXNOW_KEY' bash -s" < scripts/production/indexnow-submit-sitemap.sh | tee scripts/production/artifacts/indexnow-submit.log
          echo "VERIFICATION_ORIGIN_AUDITS=PASS urls=$actual sha=$CANDIDATE_SHA"

      - name: Authenticate to Google Cloud with Workload Identity Federation
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SEARCH_CONSOLE_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: nuvanx
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SEARCH_CONSOLE_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Resolve Search Console authentication
        id: gsc_auth
        shell: bash
        env:
          STATIC_SEARCH_CONSOLE_JSON: ${{ secrets.SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          rm -f scripts/seo/credentials.json
          if [[ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" && -s "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]]; then
            echo 'SEARCH_CONSOLE_AUTH=WIF_ADC'
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          elif [[ -n "$STATIC_SEARCH_CONSOLE_JSON" ]]; then
            printf '%s' "$STATIC_SEARCH_CONSOLE_JSON" > scripts/seo/credentials.json
            chmod 600 scripts/seo/credentials.json
            jq -e '.type == "service_account" and (.client_email | type == "string" and length > 0) and (.private_key | type == "string" and length > 0)' scripts/seo/credentials.json >/dev/null
            echo 'SEARCH_CONSOLE_AUTH=SERVICE_ACCOUNT_JSON_FALLBACK'
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'SEARCH_CONSOLE_AUTH=SKIPPED no_credentials_configured'
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Inspect exact production sitemap URLs in Google Search Console
        if: steps.gsc_auth.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/seo/index-pages.js --property "$SEARCH_CONSOLE_PROPERTY" --url "$BASE_URL" --urls-file scripts/seo/artifacts/sitemap-urls.txt 2>&1 | tee scripts/seo/artifacts/url-inspection.log
          grep -Fq 'INSPECTION_COMPLETED=true' scripts/seo/artifacts/url-inspection.log
          total="$(sed -nE 's/^TOTAL_URLS=([0-9]+)$/\1/p' scripts/seo/artifacts/url-inspection.log | tail -n1)"
          api_errors="$(sed -nE 's/^API_ERRORS=([0-9]+)$/\1/p' scripts/seo/artifacts/url-inspection.log | tail -n1)"
          inventory="$(wc -l < scripts/seo/artifacts/sitemap-urls.txt | tr -d ' ')"
          [[ "$total" =~ ^[0-9]+$ && "$total" -eq "$inventory" ]] || { echo "GSC_INSPECTION=FAIL total=${total:-missing} inventory=$inventory" >&2; exit 1; }
          [[ "$api_errors" == '0' ]] || { echo "GSC_INSPECTION=FAIL api_errors=${api_errors:-missing}" >&2; exit 1; }
          echo "GSC_INSPECTION=PASS urls=$total api_errors=0"

      - name: Export Search Console URL-level CSV evidence
        if: always() && steps.gsc_auth.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          json='scripts/seo/artifacts/indexing-results.json'
          csv='scripts/seo/artifacts/indexing-results.csv'
          if [[ -s "$json" ]]; then
            jq -r '(["url","apiStatus","verdict","coverageState","indexingState","robotsTxtState","pageFetchState","lastCrawlTime","crawledAs","userCanonical","googleCanonical","blocked","canonicalMismatch","referringUrls","sitemap"] | @csv), (.results[] | [.url,.apiStatus,(.verdict // ""),(.coverageState // ""),(.indexingState // ""),(.robotsTxtState // ""),(.pageFetchState // ""),(.lastCrawlTime // ""),(.crawledAs // ""),(.userCanonical // ""),(.googleCanonical // ""),(.blocked // false),(.canonicalMismatch // false),((.referringUrls // []) | join(" | ")),((.sitemap // []) | join(" | "))] | @csv)' "$json" > "$csv"
            echo "GSC_CSV=PASS rows=$(($(wc -l < "$csv") - 1))"
          else
            echo 'GSC_CSV=SKIPPED no_indexing_results' >&2
          fi

      - name: Verify public IndexNow key with origin fallback
        shell: bash
        run: |
          set -euo pipefail
          public_url="$BASE_URL/$INDEXNOW_KEY.txt"
          response_file="$RUNNER_TEMP/indexnow-public-key.txt"
          transport_error="$RUNNER_TEMP/indexnow-public-key.err"
          rm -f "$response_file" "$transport_error"
          set +e
          http_code="$(curl -sS --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 45 --connect-timeout 5 --max-time 15 --proto '=https' --proto-redir '=https' -o "$response_file" -w '%{http_code}' "$public_url" 2>"$transport_error")"
          curl_rc=$?
          set -e
          if (( curl_rc == 0 )); then
            [[ "$http_code" == '200' ]] || { echo "INDEXNOW_KEY_PUBLIC=FAIL reason=http_status status=$http_code" >&2; exit 1; }
            [[ "$(tr -d '\r\n' < "$response_file")" == "$INDEXNOW_KEY" ]] || { echo 'INDEXNOW_KEY_PUBLIC=FAIL reason=content_mismatch' >&2; exit 1; }
            echo 'INDEXNOW_KEY_PUBLIC=PASS source=public-edge'
          else
            origin_log='scripts/production/artifacts/indexnow-submit.log'
            [[ -s "$origin_log" ]] || { echo 'INDEXNOW_KEY_PUBLIC=FAIL reason=transport origin_evidence=missing' >&2; exit 1; }
            grep -Fq "PASS INDEXNOW_KEY_FILE path=/$INDEXNOW_KEY.txt" "$origin_log"
            grep -Fq 'INDEXNOW_SUBMIT=PASS' "$origin_log"
            echo 'INDEXNOW_KEY_PUBLIC=UNVERIFIED_TRANSPORT origin_evidence=PASS'
          fi

      - name: Upload production audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-post-audits-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            scripts/production/artifacts/*.log
            scripts/seo/artifacts/sitemap-urls.txt
            scripts/seo/artifacts/url-inspection.log
            scripts/seo/artifacts/indexing-results.json
            scripts/seo/artifacts/indexing-results.csv
          retention-days: 30
          if-no-files-found: warn
          compression-level: 6

      - name: Cleanup audit identities and temporary credentials
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/prod_audit_key" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config" scripts/seo/credentials.json
          find . -maxdepth 2 -type f -name 'gha-creds-*.json' -delete 2>/dev/null || true

  performance:
    name: Lighthouse production matrix
    needs: release
    if: >-
      always() &&
      inputs.run_performance &&
      (needs.release.result == 'success' || inputs.deploy == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false

      - name: Verify production is exact requested SHA
        shell: bash
        run: BASE_URL="$BASE_URL" EXPECTED_HOST="$EXPECTED_HOST" EXPECTED_SHA="${{ inputs.candidate_sha }}" node scripts/production/verify-production-boundary.mjs

      - name: Run Lighthouse production matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p perf-results
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts --no-audit --no-fund lighthouse@12.8.2 >/dev/null 2>&1
          LH='./node_modules/.bin/lighthouse'
          "$LH" --version | tee perf-results/lighthouse-version.txt
          declare -A URLS=(
            [home]='https://nuvanx.com/'
            [endolift]='https://nuvanx.com/endolift-facial-papada-mandibula/'
            [endolaser]='https://nuvanx.com/endolaser-corporal-grasa-localizada/'
            [faciales]='https://nuvanx.com/medicina-estetica/'
            [valoracion]='https://nuvanx.com/madrid/valoracion/'
          )
          printf 'page\tmode\tperformance\tfcp_ms\tlcp_ms\ttbt_ms\tcls\tspeed_index_ms\tttfb_ms\n' > perf-results/summary.tsv
          printf 'page\tmode\treason\n' > perf-results/failures.tsv
          matrix_failures=0
          for page in home endolift endolaser faciales valoracion; do
            for mode in mobile desktop; do
              out="perf-results/${page}-${mode}.json"; extra=(); [[ "$mode" != desktop ]] || extra+=(--preset=desktop)
              success=0
              for attempt in 1 2 3; do
                if "$LH" "${URLS[$page]}" --output=json --output-path="$out" --only-categories=performance --quiet --chrome-flags='--headless --disable-dev-shm-usage' "${extra[@]}"; then success=1; break; fi
                sleep $((attempt * 5))
              done
              if [[ "$success" != 1 ]]; then
                printf '%s\t%s\t%s\n' "$page" "$mode" 'lighthouse_execution_failed_after_3_attempts' >> perf-results/failures.tsv
                matrix_failures=$((matrix_failures + 1))
                continue
              fi
              if ! jq -e '
                (.categories.performance.score | type == "number") and
                (.audits["first-contentful-paint"].numericValue | type == "number") and
                (.audits["largest-contentful-paint"].numericValue | type == "number") and
                (.audits["total-blocking-time"].numericValue | type == "number") and
                (.audits["cumulative-layout-shift"].numericValue | type == "number") and
                (.audits["speed-index"].numericValue | type == "number") and
                (.audits["server-response-time"].numericValue | type == "number")
              ' "$out" >/dev/null; then
                printf '%s\t%s\t%s\n' "$page" "$mode" 'invalid_lighthouse_json' >> perf-results/failures.tsv
                matrix_failures=$((matrix_failures + 1))
                continue
              fi
              jq -r --arg p "$page" --arg m "$mode" '[$p,$m,((.categories.performance.score)*100|round),(.audits["first-contentful-paint"].numericValue|round),(.audits["largest-contentful-paint"].numericValue|round),(.audits["total-blocking-time"].numericValue|round),(.audits["cumulative-layout-shift"].numericValue),(.audits["speed-index"].numericValue|round),(.audits["server-response-time"].numericValue|round)]|@tsv' "$out" >> perf-results/summary.tsv
            done
          done
          cat perf-results/summary.tsv
          if (( matrix_failures > 0 )); then
            echo "LIGHTHOUSE_MATRIX=FAIL failures=$matrix_failures" >&2
            cat perf-results/failures.tsv >&2
            exit 1
          fi
          echo 'LIGHTHOUSE_MATRIX=PASS failures=0'

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-performance-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: perf-results/
          retention-days: 14

  hubspot_e2e:
    name: Live production HubSpot attribution E2E
    needs: release
    if: >-
      always() &&
      inputs.run_hubspot_e2e &&
      (needs.release.result == 'success' || inputs.deploy == false)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/staging2/package-lock.json

      - name: Verify production and run live H1 E2E
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          BASE_URL="$BASE_URL" EXPECTED_HOST="$EXPECTED_HOST" EXPECTED_SHA="$EXPECTED_SHA" node scripts/production/verify-production-boundary.mjs
          cd scripts/staging2
          npm ci --ignore-scripts
          ./node_modules/.bin/playwright install --with-deps chromium
          cd ../..
          mkdir -p scripts/staging2/h1-artifacts
          node scripts/staging2/h1-hubspot-e2e.mjs 2>&1 | tee scripts/staging2/h1-artifacts/h1-e2e.log

      - name: Upload H1 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: h1-hubspot-e2e-evidence-${{ github.run_id }}
          path: scripts/staging2/h1-artifacts/*.log
          if-no-files-found: warn
          retention-days: 7
