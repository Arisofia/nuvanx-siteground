name: Staging Visual Block 1 Once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/staging-visual-block1-once.yml

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-staging2.yml
    with:
      sha: 719c8d0e37b09e60dbe77eb42dbc77feacda77ca
      run_block_c_acceptance: false
    secrets: inherit

  visual-block1:
    name: Full-page desktop/mobile Block 1 evidence
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_URL: https://staging2.nuvanx.com
      EXPECTED_SHA: 719c8d0e37b09e60dbe77eb42dbc77feacda77ca
    steps:
      - name: Checkout tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/staging2/package-lock.json

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          cd scripts/staging2
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Render and assert all Block 1 pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts/staging2/block1-visual-artifacts/screenshots scripts/staging2/block1-visual-artifacts/html
          cat > scripts/staging2/block1-visual-check.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';
          import path from 'node:path';

          const base=(process.env.BASE_URL||'').replace(/\/$/,'');
          const expectedSha=process.env.EXPECTED_SHA||'';
          const out=path.resolve('scripts/staging2/block1-visual-artifacts');
          const routes=[
            {path:'/remodelacion-corporal-laser-madrid/',kind:'signature'},
            {path:'/tratamiento-postparto-abdomen-contorno-corporal-madrid/',kind:'signature'},
            {path:'/estetica-avanzada/',kind:'dark-hero'},
            {path:'/por-que-nuvanx/',kind:'why'},
            {path:'/politica-privacidad/',kind:'legal'},
            {path:'/politica-de-cookies/',kind:'legal'},
            {path:'/aviso-legal/',kind:'legal'},
            {path:'/mas-informacion-sobre-las-cookies/',kind:'legal'},
            {path:'/politica-de-cookies-ue/',kind:'legal'},
          ];
          const viewports=[
            {key:'desktop-1440x1100',width:1440,height:1100},
            {key:'mobile-390x844',width:390,height:844},
          ];
          const failures=[];
          const results=[];
          const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
          const safe=(p)=>p==='/'?'home':p.replace(/^\/+|\/+$/g,'').replace(/[^a-zA-Z0-9_-]+/g,'_');
          function rgb(s){ const m=String(s).match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/i); return m?[+m[1],+m[2],+m[3]]:null; }
          function lum(c){ if(!c)return null; const v=c.map(x=>{x/=255;return x<=.03928?x/12.92:((x+.055)/1.055)**2.4}); return .2126*v[0]+.7152*v[1]+.0722*v[2]; }
          function contrast(a,b){ const x=lum(rgb(a)),y=lum(rgb(b)); if(x===null||y===null)return 0; return (Math.max(x,y)+.05)/(Math.min(x,y)+.05); }
          async function gotoRetry(page,url){
            let response;
            for(let i=1;i<=8;i++){
              try{
                response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
                const h=response?await response.allHeaders():{};
                const status=response?.status()||0;
                if((status===202||status===429||status===503||h['sg-captcha'])&&i<8){await page.waitForTimeout(1800*i);continue;}
                return response;
              }catch(e){if(i===8)throw e;await page.waitForTimeout(1800*i);}
            }
            return response;
          }
          async function acceptCookies(page){
            for(const sel of ['.cmplz-accept','button:has-text("Aceptar todo")','button:has-text("Aceptar")']){
              try{const n=page.locator(sel).first();if(await n.isVisible({timeout:250})){await n.click({timeout:1500});await page.waitForTimeout(250);return;}}catch{}
            }
          }
          async function stabilize(page){
            await page.addStyleTag({content:'html,body{scroll-behavior:auto!important}*,*::before,*::after{animation-duration:0s!important;transition-duration:0s!important}'}).catch(()=>{});
            await page.evaluate(async()=>{if(document.fonts?.ready)await document.fonts.ready;}).catch(()=>{});
            await page.waitForLoadState('networkidle',{timeout:6000}).catch(()=>{});
            await page.evaluate(async()=>{const d=document.scrollingElement||document.documentElement;const max=Math.max(0,d.scrollHeight-innerHeight);for(let y=0;y<=max;y+=Math.max(420,Math.floor(innerHeight*.8))){d.scrollTop=y;await new Promise(r=>setTimeout(r,30));}d.scrollTop=0;scrollTo(0,0);await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));});
            await page.waitForTimeout(250);
          }
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          for(const vp of viewports){
            const ctx=await browser.newContext({viewport:{width:vp.width,height:vp.height},ignoreHTTPSErrors:true,reducedMotion:'reduce'});
            for(const route of routes){
              const page=await ctx.newPage();
              const record={path:route.path,kind:route.kind,viewport:vp.key,issues:[]};
              try{
                const response=await gotoRetry(page,`${base}${route.path}`);
                record.status=response?.status()||0;
                if(record.status!==200)record.issues.push(`HTTP ${record.status}`);
                await acceptCookies(page);
                await stabilize(page);
                const data=await page.evaluate(()=>{
                  const visible=(el)=>{if(!el)return false;const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&+s.opacity!==0&&r.width>1&&r.height>1};
                  const rect=(el)=>{if(!el)return null;const r=el.getBoundingClientRect();return {left:Math.round(r.left),right:Math.round(r.right),top:Math.round(r.top),bottom:Math.round(r.bottom),width:Math.round(r.width),height:Math.round(r.height)}};
                  const h1s=[...document.querySelectorAll('h1')].filter(visible);
                  const hero=document.querySelector('.nvx-brand-hero');
                  const heroTitle=hero?.querySelector('h1');
                  const article=document.querySelector('.nvx-strategy-page.nvx-brand-readable:not(.nvx-shell)');
                  const strategyHero=article?.querySelector(':scope > .nvx-brand-hero');
                  const legal=document.querySelector('.nvx-page__content > .nvx-blog-article.nvx-brand-readable');
                  const legalCard=legal?.querySelector('.nvx-legal-card');
                  const main=document.querySelector('main');
                  return {
                    sha:document.querySelector('meta[name="nvx-deploy-sha"]')?.content||'',
                    h1Count:h1s.length,
                    h1Text:h1s.map(x=>x.textContent.trim()),
                    overflow:Math.max(document.documentElement.scrollWidth,document.body?.scrollWidth||0)-innerWidth,
                    mainText:(main?.textContent||'').trim().length,
                    sectionCount:document.querySelectorAll('main section').length,
                    hero:hero?{rect:rect(hero),background:getComputedStyle(hero).backgroundColor,titleColor:heroTitle?getComputedStyle(heroTitle).color:'',titleVisible:visible(heroTitle)}:null,
                    strategy:article?{article:rect(article),hero:rect(strategyHero)}:null,
                    legal:legal?{wrapper:rect(legal),card:rect(legalCard)}:null,
                    canonicalCtas:document.querySelectorAll('a[href*="/madrid/valoracion/"]').length,
                    staleCtas:document.querySelectorAll('a[href*="/valoracion-medica/"]').length,
                  };
                });
                Object.assign(record,data);
                if(data.sha!==expectedSha)record.issues.push(`SHA ${data.sha||'(missing)'}`);
                if(data.h1Count!==1)record.issues.push(`H1 count ${data.h1Count}`);
                if(data.overflow>2)record.issues.push(`horizontal overflow ${data.overflow}`);
                if(route.kind==='signature'){
                  if(data.mainText<1600)record.issues.push(`thin governed content ${data.mainText}`);
                  if(data.sectionCount<4)record.issues.push(`only ${data.sectionCount} sections`);
                  if(data.canonicalCtas<1)record.issues.push('canonical valoracion CTA missing');
                  if(data.staleCtas>0)record.issues.push(`stale /valoracion-medica/ CTA count ${data.staleCtas}`);
                  if(!data.hero?.titleVisible)record.issues.push('hero title not visible');
                  if(contrast(data.hero?.background,data.hero?.titleColor)<4.5)record.issues.push(`hero contrast ${contrast(data.hero?.background,data.hero?.titleColor).toFixed(2)}`);
                }
                if(route.kind==='dark-hero'){
                  if(!data.hero?.titleVisible)record.issues.push('hero title not visible');
                  if(contrast(data.hero?.background,data.hero?.titleColor)<4.5)record.issues.push(`hero contrast ${contrast(data.hero?.background,data.hero?.titleColor).toFixed(2)}`);
                }
                if(route.kind==='why'){
                  if(!data.strategy?.hero)record.issues.push('strategy hero missing');
                  else if(Math.abs(data.strategy.hero.width-vp.width)>4)record.issues.push(`strategy hero width ${data.strategy.hero.width}/${vp.width}`);
                }
                if(route.kind==='legal'){
                  if(!data.legal?.wrapper)record.issues.push('legal wrapper missing');
                  else {
                    const left=data.legal.wrapper.left;
                    const right=vp.width-data.legal.wrapper.right;
                    if(Math.abs(left-right)>10)record.issues.push(`legal shell off-center L${left}/R${right}`);
                    if(vp.width>=1000 && data.legal.wrapper.width>990)record.issues.push(`legal width ${data.legal.wrapper.width}`);
                  }
                }
                const name=`${safe(route.path)}--${vp.key}`;
                await fs.writeFile(path.join(out,'html',`${name}.html`),await page.content(),'utf8');
                await page.screenshot({path:path.join(out,'screenshots',`${name}.png`),fullPage:true,animations:'disabled',caret:'hide'});
              }catch(error){record.issues.push(String(error));}
              if(record.issues.length)failures.push(record);
              results.push(record);
              console.log(`${record.issues.length?'FAIL':'PASS'} ${vp.key} ${route.path} ${JSON.stringify(record)}`);
              await page.close();
            }
            await ctx.close();
          }
          await browser.close();
          await fs.writeFile(path.join(out,'results.json'),JSON.stringify({expectedSha,results,failures},null,2)+'\n');
          if(failures.length){console.error(`BLOCK1_VISUAL=FAIL count=${failures.length}`);process.exit(1);}
          console.log(`BLOCK1_VISUAL=PASS cases=${results.length}`);
          NODE
          node scripts/staging2/block1-visual-check.mjs

      - name: Upload Block 1 full-page evidence
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        with:
          name: staging-block1-visual-${{ github.run_id }}
          path: scripts/staging2/block1-visual-artifacts
          retention-days: 14
          if-no-files-found: error
          compression-level: 6
