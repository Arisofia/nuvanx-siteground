<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura médica abstracta NUVANX</title>
  <desc id="desc">Composición de líneas anatómicas, planos translúcidos y puntos de diagnóstico.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111111"/>
      <stop offset="0.56" stop-color="#252321"/>
      <stop offset="1" stop-color="#0b0b0b"/>
    </linearGradient>
    <radialGradient id="light" cx="67%" cy="30%" r="62%">
      <stop offset="0" stop-color="#e9ddcf" stop-opacity="0.34"/>
      <stop offset="0.48" stop-color="#b89a5b" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#171717" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f1e8" stop-opacity="0.02"/>
      <stop offset="0.55" stop-color="#e9ddcf" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#b89a5b" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.76" numOctaves="3" seed="29" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="softNoise"><feFuncA type="table" tableValues="0 0.04"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="softNoise" mode="soft-light"/>
    </filter>
  </defs>

  <rect width="1600" height="1200" fill="url(#background)"/>
  <rect width="1600" height="1200" fill="url(#light)"/>

  <g filter="url(#blur)">
    <path d="M1010-80c-236 230-302 482-198 738 94 230 310 394 656 502l238 74V-80Z" fill="url(#plane)"/>
    <path d="M-180 1030C88 722 348 612 618 700c210 68 372 250 500 552H-180Z" fill="#f7f1e8" opacity="0.035"/>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M1146-30C844 188 744 410 812 650c62 218 248 394 620 520" stroke="#e9ddcf" stroke-opacity="0.52" stroke-width="1.35"/>
    <path d="M1242-28C938 226 856 464 938 678c78 204 280 342 592 422" stroke="#b89a5b" stroke-opacity="0.52" stroke-width="1"/>
    <path d="M1018-50C724 190 620 464 690 738c60 234 242 396 546 486" stroke="#f7f1e8" stroke-opacity="0.19" stroke-width="0.85"/>
    <path d="M-80 946C202 704 432 632 642 736c174 86 300 258 386 506" stroke="#e9ddcf" stroke-opacity="0.25" stroke-width="1.1"/>
  </g>

  <g fill="none" stroke="#b89a5b" stroke-opacity="0.42">
    <circle cx="1150" cy="318" r="136"/>
    <circle cx="1150" cy="318" r="78"/>
    <circle cx="1150" cy="318" r="18"/>
  </g>
  <g fill="none" stroke="#e9ddcf" stroke-opacity="0.27">
    <circle cx="520" cy="824" r="94"/>
    <circle cx="520" cy="824" r="42"/>
  </g>
  <path d="M510 824H984M1150 318V824M984 824l166-506" fill="none" stroke="#f7f1e8" stroke-opacity="0.18" stroke-width="0.8" stroke-dasharray="8 15"/>
  <circle cx="984" cy="824" r="5" fill="#e9ddcf"/>
  <circle cx="1150" cy="318" r="6" fill="#b89a5b"/>
  <circle cx="520" cy="824" r="5" fill="#e9ddcf"/>

  <rect width="1600" height="1200" fill="transparent" filter="url(#grain)"/>
</svg>
