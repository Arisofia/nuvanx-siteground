name: Fix PR 309 Endolift fallback once

on:
  pull_request:
    branches:
      - master
    paths:
      - scripts/theme-hygiene/fix-pr309-endolift-fallback-once.py

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.number == 309
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: refactor/sonar-legacy-duplication-phase2-20260731
          fetch-depth: 0
          persist-credentials: true

      - name: Restore Endolift fallback wrapper
        run: python3 scripts/theme-hygiene/fix-pr309-endolift-fallback-once.py

      - name: Validate fallback and theme contracts
        shell: bash
        run: |
          set -euo pipefail
          php -l wp-content/themes/nuvanx-medical/inc/nvx-endolift-page.php
          php -l scripts/theme-hygiene/test-page-render-helpers.php
          php scripts/theme-hygiene/test-page-render-helpers.php
          php scripts/theme-hygiene/test-catalog-json-contract.php
          php scripts/theme-hygiene/test-catalog-json-runtime-contract.php
          php scripts/theme-hygiene/test-catalog-review-contract.php
          node scripts/theme-hygiene/test-theme-hygiene.mjs

      - name: Publish fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add \
            wp-content/themes/nuvanx-medical/inc/nvx-endolift-page.php \
            scripts/theme-hygiene/test-page-render-helpers.php
          git commit -m "fix(endolift): preserve fallback brand wrapper"
          git push origin HEAD:refactor/sonar-legacy-duplication-phase2-20260731
