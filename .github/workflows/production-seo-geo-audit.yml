name: Production SEO GEO Origin Audit

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/production-seo-geo-audit.yml'
      - 'scripts/production/seo-geo-origin-audit.sh'
      - 'scripts/production/diagnose-title-emitters.sh'
      - 'scripts/production/document-head-title-audit.sh'
  workflow_run:
    workflows:
      - Production Release
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: production-seo-geo-origin-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit live production search and GEO surfaces
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROD_ROOT: /home/customer/www/nuvanx.com/public_html
      BASE_URL: https://nuvanx.com
      EXPECTED_HOST: nuvanx.com
    steps:
      - name: Check out canonical audit tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Validate audit script syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/production/seo-geo-origin-audit.sh
          bash -n scripts/production/diagnose-title-emitters.sh
          bash -n scripts/production/document-head-title-audit.sh

      - name: Configure strict production SSH authentication
        shell: bash
        env:
          HOST: ${{ secrets.PROD_SSH_HOST }}
          PORT: ${{ secrets.PROD_SSH_PORT }}
          USER: ${{ secrets.PROD_SSH_USER }}
          KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${HOST:?Missing PROD_SSH_HOST}"
          : "${USER:?Missing PROD_SSH_USER}"
          : "${KEY:?Missing PROD_SSH_PRIVATE_KEY}"
          : "${KH:?Missing PROD_SSH_KNOWN_HOSTS}"
          SSH_PORT="${PORT:-18765}"
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/prod_seo_geo_key"; chmod 600 "$HOME/.ssh/prod_seo_geo_key"
          printf '%s\n' "$KH" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx-prod-seo-geo
            HostName $HOST
            User $USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/prod_seo_geo_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 20
            ServerAliveInterval 30
            ServerAliveCountMax 2
          EOF
          chmod 600 "$HOME/.ssh/config"
          ssh -n nvx-prod-seo-geo "test -d '$PROD_ROOT' && test -f '$PROD_ROOT/wp-config.php' && command -v wp >/dev/null && command -v curl >/dev/null && command -v php >/dev/null"

      - name: Verify exactly one document title in head across sitemap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts/production/artifacts
          ssh nvx-prod-seo-geo \
            "BASE_URL='$BASE_URL' bash -s" \
            < scripts/production/document-head-title-audit.sh \
            | tee scripts/production/artifacts/document-head-title-audit.log

      - name: Run blocking SEO GEO audit from SiteGround origin network
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts/production/artifacts
          ssh nvx-prod-seo-geo \
            "PROD_ROOT='$PROD_ROOT' BASE_URL='$BASE_URL' EXPECTED_HOST='$EXPECTED_HOST' bash -s" \
            < scripts/production/seo-geo-origin-audit.sh \
            | tee scripts/production/artifacts/seo-geo-origin-audit.log

      - name: Diagnose title emitters after audit failure
        if: failure()
        shell: bash
        run: |
          set +e
          if [[ -f "$HOME/.ssh/config" ]]; then
            ssh nvx-prod-seo-geo \
              "PROD_ROOT='$PROD_ROOT' BASE_URL='$BASE_URL' bash -s" \
              < scripts/production/diagnose-title-emitters.sh \
              | tee scripts/production/artifacts/title-emitter-diagnostic.log
          fi
          exit 0

      - name: Upload SEO GEO evidence
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: production-seo-geo-origin-audit-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: scripts/production/artifacts/*.log
          retention-days: 30
          if-no-files-found: error
          compression-level: 6

      - name: Destroy production SSH identity
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/prod_seo_geo_key" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"

      - name: Write audit summary
        if: success()
        shell: bash
        run: |
          {
            echo '## Production SEO/GEO origin audit PASS'
            echo
            grep -E '^(SEO_GEO_RELEASE_SHA|SITEMAP_CHILDREN|SITEMAP_URLS|URL_PASS|URL_FAIL|SIGNATURE_REST_PASS|SIGNATURE_REST_FAIL|SEO_GEO_WARNINGS|SEO_GEO_FAILURES|SEO_GEO_ORIGIN_AUDIT)=' scripts/production/artifacts/seo-geo-origin-audit.log | sed 's/^/- `/' | sed 's/$/`/'
            grep -E '^(DOCUMENT_HEAD_TITLE_URLS|DOCUMENT_HEAD_TITLE_PASS|DOCUMENT_HEAD_TITLE_FAIL|DOCUMENT_HEAD_TITLE_AUDIT)=' scripts/production/artifacts/document-head-title-audit.log | sed 's/^/- `/' | sed 's/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
