name: Staging2 Media Source Recovery Diagnostic V2 Once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/staging2-media-source-recovery-diagnostic-v2-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      STAGING_ROOT: /home/customer/www/staging2.nuvanx.com/public_html
      PROD_ROOT: /home/customer/www/nuvanx.com/public_html
      STAGING_SHA: d54dfa7df226dbd5b823fca1878ce8a60a3548cb
      PROD_SHA: 4775310be2b7dcdda18f8fd6de8e40041c2eb555
    steps:
      - name: Configure strict SiteGround SSH
        shell: bash
        env:
          HOST: ${{ secrets.STAGING2_SSH_HOST }}
          PORT: ${{ secrets.STAGING2_SSH_PORT }}
          USER: ${{ secrets.STAGING2_SSH_USER }}
          KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${HOST:?Missing STAGING2_SSH_HOST}"
          : "${USER:?Missing STAGING2_SSH_USER}"
          : "${KEY:?Missing STAGING2_SSH_PRIVATE_KEY}"
          : "${KH:?Missing STAGING2_SSH_KNOWN_HOSTS}"
          SSH_PORT="${PORT:-18765}"
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KH" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx-sg
            HostName $HOST
            User $USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 20
          EOF
          chmod 600 "$HOME/.ssh/config"
          ssh nvx-sg "test -d '$STAGING_ROOT' && test -d '$PROD_ROOT' && command -v wp >/dev/null && command -v sha256sum >/dev/null"

      - name: Compare exact source files and candidates
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-sg "STAGING_ROOT='$STAGING_ROOT' PROD_ROOT='$PROD_ROOT' STAGING_SHA='$STAGING_SHA' PROD_SHA='$PROD_SHA' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < "$STAGING_ROOT/wp-content/themes/nuvanx-medical/.nvx-deploy-sha)" = "$STAGING_SHA"
          test "$(tr -d '\r\n' < "$PROD_ROOT/wp-content/themes/nuvanx-medical/.nvx-deploy-sha)" = "$PROD_SHA"

          s_icon="$STAGING_ROOT/wp-content/uploads/2025/04/cropped-nuvanx-icono-sitio.webp"
          p_icon="$PROD_ROOT/wp-content/uploads/2025/04/cropped-nuvanx-icono-sitio.webp"
          s_co2="$STAGING_ROOT/wp-content/uploads/2026/06/nvx-co2-evaluacion-620.webp"
          p_co2="$PROD_ROOT/wp-content/uploads/2026/06/nvx-co2-evaluacion-620.webp"

          echo '===== EXACT ICON ====='
          if test -f "$s_icon"; then echo "STAGING_ICON=YES bytes=$(wc -c < "$s_icon") sha=$(sha256sum "$s_icon" | cut -d' ' -f1)"; else echo 'STAGING_ICON=NO'; fi
          if test -f "$p_icon"; then echo "PROD_ICON=YES bytes=$(wc -c < "$p_icon") sha=$(sha256sum "$p_icon" | cut -d' ' -f1)"; else echo 'PROD_ICON=NO'; fi

          echo '===== EXACT CO2 ====='
          if test -f "$s_co2"; then echo "STAGING_CO2=YES bytes=$(wc -c < "$s_co2") sha=$(sha256sum "$s_co2" | cut -d' ' -f1)"; else echo 'STAGING_CO2=NO'; fi
          if test -f "$p_co2"; then echo "PROD_CO2=YES bytes=$(wc -c < "$p_co2") sha=$(sha256sum "$p_co2" | cut -d' ' -f1)"; else echo 'PROD_CO2=NO'; fi

          echo '===== STAGING ICON CANDIDATES ====='
          find "$STAGING_ROOT/wp-content/uploads" -type f -iname '*icon*' -print | grep -Ei '(nuvanx|sitio|favicon)' | head -n 80 || true
          echo '===== PROD ICON CANDIDATES ====='
          find "$PROD_ROOT/wp-content/uploads" -type f -iname '*icon*' -print | grep -Ei '(nuvanx|sitio|favicon)' | head -n 80 || true

          echo '===== STAGING CO2 CANDIDATES ====='
          find "$STAGING_ROOT/wp-content/uploads" -type f -iname '*co2*' -print | head -n 120 || true
          find "$STAGING_ROOT/wp-content/uploads" -type f -iname '*evaluacion*' -print | head -n 120 || true
          echo '===== PROD CO2 CANDIDATES ====='
          find "$PROD_ROOT/wp-content/uploads" -type f -iname '*co2*' -print | head -n 120 || true
          find "$PROD_ROOT/wp-content/uploads" -type f -iname '*evaluacion*' -print | head -n 120 || true

          echo '===== STAGING ATTACHMENT LOOKUP ====='
          cd "$STAGING_ROOT"
          wp eval '
          foreach([187,2085] as $id){$p=get_post($id);$f=get_attached_file($id);$m=wp_get_attachment_metadata($id);echo "ID={$id}|TITLE=".($p?$p->post_title:"")."|FILE={$f}|EXISTS=".($f&&is_file($f)?"YES":"NO")."|GUID=".($p?$p->guid:"")."|SIZES=".(is_array($m)?implode(",",array_keys($m["sizes"]??[])):"NONE")."\n";}'
          echo '===== PROD ATTACHMENT LOOKUP ====='
          cd "$PROD_ROOT"
          wp eval '
          foreach([187,2085] as $id){$p=get_post($id);$f=get_attached_file($id);$m=wp_get_attachment_metadata($id);echo "ID={$id}|TITLE=".($p?$p->post_title:"")."|FILE={$f}|EXISTS=".($f&&is_file($f)?"YES":"NO")."|GUID=".($p?$p->guid:"")."|SIZES=".(is_array($m)?implode(",",array_keys($m["sizes"]??[])):"NONE")."\n";}'
          REMOTE

      - name: Destroy SSH identity
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/key" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"
