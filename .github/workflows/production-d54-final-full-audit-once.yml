name: Production d54 Final Full Audit Once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/production-d54-final-full-audit-once.yml

permissions:
  contents: read

concurrency:
  group: production-d54-final-full-audit
  cancel-in-progress: false

env:
  PROD_ROOT: /home/customer/www/nuvanx.com/public_html
  BASE_URL: https://nuvanx.com
  EXPECTED_SHA: d54dfa7df226dbd5b823fca1878ce8a60a3548cb

jobs:
  audit:
    name: Final d54 production audit
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Configure strict production SSH
        shell: bash
        env:
          HOST: ${{ secrets.PROD_SSH_HOST }}
          PORT: ${{ secrets.PROD_SSH_PORT }}
          USER: ${{ secrets.PROD_SSH_USER }}
          KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${HOST:?Missing PROD_SSH_HOST}"
          : "${USER:?Missing PROD_SSH_USER}"
          : "${KEY:?Missing PROD_SSH_PRIVATE_KEY}"
          : "${KH:?Missing PROD_SSH_KNOWN_HOSTS}"
          SSH_PORT="${PORT:-18765}"
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KH" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx-prod-audit
            HostName $HOST
            User $USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 20
            ServerAliveInterval 30
            ServerAliveCountMax 2
          EOF
          chmod 600 "$HOME/.ssh/config"
          ssh -n nvx-prod-audit "test -d '$PROD_ROOT' && test -f '$PROD_ROOT/wp-config.php' && command -v wp >/dev/null && command -v curl >/dev/null && command -v tar >/dev/null"
          test "$(ssh -n nvx-prod-audit "tr -d '\\r\\n' < '$PROD_ROOT/wp-content/themes/nuvanx-medical/.nvx-deploy-sha'")" = "$EXPECTED_SHA"
          test "$(ssh -n nvx-prod-audit "cd '$PROD_ROOT' && wp config get DB_NAME")" = 'db0ecrycwv2tgb'
          test "$(ssh -n nvx-prod-audit "cd '$PROD_ROOT' && wp option get home")" = 'https://nuvanx.com'
          test "$(ssh -n nvx-prod-audit "cd '$PROD_ROOT' && wp option get siteurl")" = 'https://nuvanx.com'
          test "$(ssh -n nvx-prod-audit "cd '$PROD_ROOT' && wp option get blog_public")" = '1'
          test "$(ssh -n nvx-prod-audit "cd '$PROD_ROOT' && wp theme list --status=active --field=name")" = 'nuvanx-medical'
          echo 'FINAL_AUDIT_IDENTITY=PASS'

      - name: Capture complete production sitemap and HTML from SiteGround network
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_AUDIT="/tmp/nvx-prod-d54-final-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "REMOTE_AUDIT=$REMOTE_AUDIT" >> "$GITHUB_ENV"
          mkdir -p audit/raw audit/report
          cat > "$RUNNER_TEMP/nvx-remote-capture.sh" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          root="$1"; base="$2"; sha="$3"; out="$4"
          rm -rf "$out"; mkdir -p "$out/html" "$out/sitemaps"
          cd "$root"
          test "$(tr -d '\r\n' < wp-content/themes/nuvanx-medical/.nvx-deploy-sha)" = "$sha"
          ua='NUVANX-Production-Final-Audit/1.0'

          curl -fsSL --max-time 30 -A "$ua" -H 'Accept: application/xml,text/xml,*/*' "$base/sitemap_index.xml" > "$out/sitemaps/index.xml"
          ! grep -Fq '/.well-known/sgcaptcha/' "$out/sitemaps/index.xml"
          ! grep -Fq '/category-sitemap.xml' "$out/sitemaps/index.xml"
          ! grep -Fq '/post_tag-sitemap.xml' "$out/sitemaps/index.xml"
          ! grep -Fq '/tag-sitemap.xml' "$out/sitemaps/index.xml"
          grep -oE '<loc>[^<]+' "$out/sitemaps/index.xml" | sed 's#<loc>##' > "$out/child-sitemaps.txt"
          test -s "$out/child-sitemaps.txt"

          : > "$out/sitemap-urls.txt"
          n=0
          while IFS= read -r sm; do
            test -n "$sm" || continue
            n=$((n+1)); f="$out/sitemaps/child-${n}.xml"
            curl -fsSL --max-time 30 -A "$ua" -H 'Accept: application/xml,text/xml,*/*' "$sm" > "$f"
            ! grep -Fq '/.well-known/sgcaptcha/' "$f"
            grep -oE '<loc>[^<]+' "$f" | sed 's#<loc>##' >> "$out/sitemap-urls.txt" || true
          done < "$out/child-sitemaps.txt"
          sort -u "$out/sitemap-urls.txt" -o "$out/sitemap-urls.txt"
          test -s "$out/sitemap-urls.txt"

          cp "$out/sitemap-urls.txt" "$out/all-urls.txt"
          printf '%s\n' "$base/" "$base/blog/" "$base/contacto/" "$base/madrid/valoracion/" "$base/aviso-legal/" "$base/politica-privacidad/" "$base/politica-de-cookies-ue/" >> "$out/all-urls.txt"
          sort -u "$out/all-urls.txt" -o "$out/all-urls.txt"

          : > "$out/capture.tsv"
          idx=0
          while IFS= read -r url; do
            test -n "$url" || continue
            idx=$((idx+1)); key="$(printf '%04d' "$idx")"; headers="$out/html/${key}.headers"; body="$out/html/${key}.html"
            result="$(curl -sS -L --max-redirs 8 --max-time 35 -A "$ua" -H 'Accept: text/html,application/xhtml+xml' -D "$headers" -o "$body" -w '%{http_code}|%{url_effective}|%{num_redirects}' "$url" || printf '000|%s|0' "$url")"
            printf '%s\t%s\t%s\n' "$key" "$url" "$result" >> "$out/capture.tsv"
          done < "$out/all-urls.txt"

          prefix="$(wp db prefix)"
          wp db query "SELECT COUNT(*) FROM ${prefix}posts WHERE post_status='publish' AND post_content LIKE '%/valoracion-medica/%';" --skip-column-names > "$out/legacy-valoracion-count.txt"
          test "$(tr -d '[:space:]' < "$out/legacy-valoracion-count.txt")" = '0'

          alias_headers="$out/alias.headers"; alias_body="$out/alias.html"
          alias_result="$(curl -sS --max-time 30 -A "$ua" -D "$alias_headers" -o "$alias_body" -w '%{http_code}|%{redirect_url}' "$base/valoracion-medica/")"
          printf '%s\n' "$alias_result" > "$out/alias-result.txt"
          test "${alias_result%%|*}" = '301'; test "${alias_result#*|}" = "$base/madrid/valoracion/"
          ! grep -Fq '/.well-known/sgcaptcha/' "$alias_body"

          cases_code="$(curl -sS --max-time 30 -A "$ua" -o "$out/cases.html" -w '%{http_code}' "$base/casos-de-pacientes/")"
          printf '%s\n' "$cases_code" > "$out/cases-code.txt"; test "$cases_code" = '404'

          page_sm="$(grep -oE '<loc>[^<]+' "$out/sitemaps/index.xml" | sed 's#<loc>##' | grep '/page-sitemap.xml' | head -n 1)"
          test -n "$page_sm"; curl -fsSL --max-time 30 -A "$ua" "$page_sm" > "$out/page-sitemap.xml"
          ! grep -Fq '/politica-de-cookies/' "$out/page-sitemap.xml"
          ! grep -Fq '/mas-informacion-sobre-las-cookies/' "$out/page-sitemap.xml"
          ! grep -Fq '/casos-de-pacientes/' "$out/page-sitemap.xml"

          printf 'sitemap_urls=%s\nall_urls=%s\n' "$(wc -l < "$out/sitemap-urls.txt" | tr -d ' ')" "$(wc -l < "$out/all-urls.txt" | tr -d ' ')" > "$out/inventory.txt"
          tar -C "$out" -czf "${out}.tgz" .
          SH
          chmod +x "$RUNNER_TEMP/nvx-remote-capture.sh"
          scp "$RUNNER_TEMP/nvx-remote-capture.sh" "nvx-prod-audit:${REMOTE_AUDIT}-capture.sh"
          ssh -n nvx-prod-audit "bash '${REMOTE_AUDIT}-capture.sh' '$PROD_ROOT' '$BASE_URL' '$EXPECTED_SHA' '$REMOTE_AUDIT'"
          scp "nvx-prod-audit:${REMOTE_AUDIT}.tgz" audit/raw/capture.tgz
          tar -xzf audit/raw/capture.tgz -C audit/raw
          echo "FINAL_CAPTURE=PASS $(tr '\n' ' ' < audit/raw/inventory.txt)"

      - name: Analyze every page shell, SEO signal and collect internal resources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, json, re
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlsplit, urlunsplit

          root=Path('audit/raw'); out=Path('audit/report'); out.mkdir(parents=True,exist_ok=True)
          expected='d54dfa7df226dbd5b823fca1878ce8a60a3548cb'
          sitemap=set(x.strip() for x in (root/'sitemap-urls.txt').read_text().splitlines() if x.strip())

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True); self.in_head=False; self.title_head=0; self.h1=0; self.header=0; self.footer=0; self.main=0; self.cta=0; self.canon=[]; self.styles=[]; self.links=[]; self.images=[]; self.robots=[]; self.lang=''
              def handle_starttag(self,t,a):
                  d=dict(a); classes=set((d.get('class') or '').split())
                  if t=='head': self.in_head=True
                  if t=='html': self.lang=d.get('lang') or ''
                  if t=='title' and self.in_head: self.title_head+=1
                  if t=='h1': self.h1+=1
                  if t=='header' and d.get('id')=='nvx-header' and 'nvx-header' in classes: self.header+=1
                  if t=='footer' and 'nvx-footer' in classes: self.footer+=1
                  if t=='main' and d.get('id')=='nvx-main': self.main+=1
                  if d.get('id')=='nvx-header-cta': self.cta+=1
                  if t=='link':
                      rel=(d.get('rel') or '').lower().split(); href=d.get('href') or ''
                      if 'canonical' in rel: self.canon.append(href)
                      if 'stylesheet' in rel: self.styles.append(href)
                  if t=='a' and d.get('href'): self.links.append(d['href'])
                  if t=='img':
                      for k in ('src','data-src'):
                          if d.get(k): self.images.append(d[k])
                      if d.get('srcset'):
                          self.images += [x.strip().split()[0] for x in d['srcset'].split(',') if x.strip()]
                  if t=='source' and d.get('srcset'):
                      self.images += [x.strip().split()[0] for x in d['srcset'].split(',') if x.strip()]
                  if t=='meta' and (d.get('name') or '').lower()=='robots': self.robots.append((d.get('content') or '').lower())
              def handle_endtag(self,t):
                  if t=='head': self.in_head=False

          rows=[]; links=set(); images=set()
          for line in (root/'capture.tsv').read_text().splitlines():
              key,url,result=line.split('\t',2); code,effective,redirects=result.split('|',2); body=(root/'html'/f'{key}.html').read_text(errors='replace'); headers=(root/'html'/f'{key}.headers').read_text(errors='replace'); p=P()
              try:p.feed(body)
              except Exception:pass
              fail=[]; warn=[]; host=(urlsplit(effective).hostname or '').lower(); noindex_h=bool(re.search(r'^x-robots-tag:.*(?:noindex|nofollow)',headers,re.I|re.M)); noindex_m=any('noindex' in x or 'nofollow' in x for x in p.robots)
              if code!='200': fail.append(f'http={code}')
              if host!='nuvanx.com': fail.append(f'final_host={host or "missing"}')
              if '/.well-known/sgcaptcha/' in body or re.search(r'^sg-captcha:\s*challenge',headers,re.I|re.M): fail.append('siteground_captcha')
              if 'staging2.nuvanx.com' in body: fail.append('staging_leak')
              if expected not in body: fail.append('sha_missing')
              if p.header!=1: fail.append(f'header={p.header}')
              if p.footer!=1: fail.append(f'footer={p.footer}')
              if p.main!=1: fail.append(f'main={p.main}')
              if p.cta!=1: fail.append(f'header_cta={p.cta}')
              if p.title_head!=1: fail.append(f'head_title={p.title_head}')
              if p.h1!=1: warn.append(f'h1={p.h1}')
              if len(p.canon)!=1: fail.append(f'canonical_count={len(p.canon)}')
              elif (urlsplit(p.canon[0]).hostname or '').lower()!='nuvanx.com': fail.append('canonical_host')
              if url in sitemap and (noindex_h or noindex_m): fail.append('sitemap_noindex')
              for css in ('nvx-tokens.css','nvx-site-layout.css','nvx-header.css','nvx-footer.css'):
                  if not any(css in x for x in p.styles): fail.append(f'missing_css:{css}')
              for text in ('669 319 836','647 505 107','CS20144','CS20073'):
                  if text not in body: fail.append(f'footer_missing:{text}')
              for legal in ('/aviso-legal/','/politica-privacidad/','/politica-de-cookies-ue/'):
                  if legal not in body: fail.append(f'footer_legal_missing:{legal}')
              if not p.lang.lower().startswith('es'): warn.append(f'lang={p.lang or "missing"}')
              if int(redirects)>0: warn.append(f'redirects={redirects}')
              base=effective or url
              for href in p.links:
                  h=href.strip()
                  if not h or h.startswith(('#','mailto:','tel:','javascript:','data:')): continue
                  absolute=urljoin(base,h); parts=urlsplit(absolute); ihost=(parts.hostname or '').lower()
                  if ihost not in ('nuvanx.com','www.nuvanx.com'): continue
                  path=parts.path or '/'
                  if re.search(r'\.(?:jpe?g|png|webp|gif|svg|pdf|zip|css|js|woff2?|ttf|ico|xml)(?:$|\?)',path,re.I): continue
                  links.add(urlunsplit(('https','nuvanx.com',path,'','')))
              for src in p.images:
                  absolute=urljoin(base,src.strip()); parts=urlsplit(absolute); ihost=(parts.hostname or '').lower()
                  if ihost in ('nuvanx.com','www.nuvanx.com') and '/wp-content/uploads/' in parts.path:
                      images.add(urlunsplit(('https','nuvanx.com',parts.path,'','')))
              status='FAIL' if fail else ('WARN' if warn else 'PASS')
              rows.append({'status':status,'url':url,'http':code,'final_url':effective,'redirects':redirects,'in_sitemap':url in sitemap,'head_title_count':p.title_head,'h1_count':p.h1,'header_count':p.header,'footer_count':p.footer,'main_count':p.main,'header_cta_count':p.cta,'canonical':p.canon[0] if len(p.canon)==1 else '', 'noindex':noindex_h or noindex_m,'sha_ok':expected in body,'failures':';'.join(fail),'warnings':';'.join(warn)})
          fields=list(rows[0]);
          with (out/'url-audit.csv').open('w',newline='',encoding='utf-8') as f:w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(rows)
          (out/'url-audit.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          (out/'internal-links.txt').write_text('\n'.join(sorted(links))+('\n' if links else ''))
          (out/'image-urls.txt').write_text('\n'.join(sorted(images))+('\n' if images else ''))
          summary={'sitemap_urls':len(sitemap),'audited_urls':len(rows),'pass':sum(r['status']=='PASS' for r in rows),'warn':sum(r['status']=='WARN' for r in rows),'fail':sum(r['status']=='FAIL' for r in rows),'internal_links':len(links),'image_urls':len(images),'failed_urls':[{'url':r['url'],'failures':r['failures']} for r in rows if r['status']=='FAIL'],'warning_urls':[{'url':r['url'],'warnings':r['warnings']} for r in rows if r['status']=='WARN']}
          (out/'summary-pages.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2));print(json.dumps(summary,ensure_ascii=False))
          PY

      - name: Verify every unique internal HTML link and every rendered upload image from origin
        shell: bash
        run: |
          set -euo pipefail
          scp audit/report/internal-links.txt audit/report/image-urls.txt "nvx-prod-audit:${REMOTE_AUDIT}/"
          cat > "$RUNNER_TEMP/nvx-remote-resources.sh" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          out="$1"; ua='NUVANX-Production-Final-Resources/1.0'
          : > "$out/internal-links-status.tsv"
          while IFS= read -r url; do
            test -n "$url" || continue
            headers="$(mktemp)"; body="$(mktemp)"
            result="$(curl -sS -L --max-redirs 8 --max-time 35 -A "$ua" -H 'Accept: text/html,application/xhtml+xml' -D "$headers" -o "$body" -w '%{http_code}|%{url_effective}|%{num_redirects}' "$url" || printf '000|%s|0' "$url")"
            captcha=0; staging=0; grep -Fq '/.well-known/sgcaptcha/' "$body" && captcha=1 || true; grep -Fq 'staging2.nuvanx.com' "$body" && staging=1 || true
            printf '%s\t%s\t%s\t%s\n' "$url" "$result" "$captcha" "$staging" >> "$out/internal-links-status.tsv"
            rm -f "$headers" "$body"
          done < "$out/internal-links.txt"
          : > "$out/image-status.tsv"
          while IFS= read -r url; do
            test -n "$url" || continue
            code="$(curl -sS --max-time 25 -A "$ua" -o /dev/null -w '%{http_code}' "$url" || true)"
            printf '%s\t%s\n' "$url" "$code" >> "$out/image-status.tsv"
          done < "$out/image-urls.txt"
          SH
          chmod +x "$RUNNER_TEMP/nvx-remote-resources.sh"
          scp "$RUNNER_TEMP/nvx-remote-resources.sh" "nvx-prod-audit:${REMOTE_AUDIT}-resources.sh"
          ssh -n nvx-prod-audit "bash '${REMOTE_AUDIT}-resources.sh' '$REMOTE_AUDIT'"
          scp "nvx-prod-audit:${REMOTE_AUDIT}/internal-links-status.tsv" audit/report/internal-links-status.tsv
          scp "nvx-prod-audit:${REMOTE_AUDIT}/image-status.tsv" audit/report/image-status.tsv

      - name: Consolidate final audit and fail only on verified defects
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          from urllib.parse import urlsplit
          out=Path('audit/report'); pages=list(csv.DictReader((out/'url-audit.csv').open(encoding='utf-8')))
          links=[]
          for line in (out/'internal-links-status.tsv').read_text(errors='replace').splitlines():
              if not line.strip():continue
              url,result,captcha,staging=line.split('\t',3); code,effective,redirects=result.split('|',2); fail=[]; warn=[]; host=(urlsplit(effective).hostname or '').lower()
              if url.rstrip('/') in ('https://nuvanx.com/valoracion-medica','https://nuvanx.com/casos-de-pacientes'): fail.append('forbidden_internal_legacy_link')
              if code!='200':fail.append(f'http={code}')
              if host!='nuvanx.com':fail.append(f'final_host={host or "missing"}')
              if captcha=='1':fail.append('captcha')
              if staging=='1':fail.append('staging_leak')
              if int(redirects)>0:warn.append(f'redirects={redirects}')
              links.append({'status':'FAIL' if fail else ('WARN' if warn else 'PASS'),'url':url,'http':code,'final_url':effective,'redirects':redirects,'failures':';'.join(fail),'warnings':';'.join(warn)})
          with (out/'internal-links-audit.csv').open('w',newline='',encoding='utf-8') as f:w=csv.DictWriter(f,fieldnames=list(links[0]) if links else ['status','url','http','final_url','redirects','failures','warnings']);w.writeheader();w.writerows(links)
          images=[]
          for line in (out/'image-status.tsv').read_text(errors='replace').splitlines():
              if not line.strip():continue
              url,code=line.split('\t',1); images.append({'status':'PASS' if code=='200' else 'FAIL','url':url,'http':code})
          with (out/'image-audit.csv').open('w',newline='',encoding='utf-8') as f:w=csv.DictWriter(f,fieldnames=['status','url','http']);w.writeheader();w.writerows(images)
          pf=[r for r in pages if r['status']=='FAIL']; pw=[r for r in pages if r['status']=='WARN']; lf=[r for r in links if r['status']=='FAIL']; lw=[r for r in links if r['status']=='WARN']; imf=[r for r in images if r['status']=='FAIL']
          alias=(Path('audit/raw')/'alias-result.txt').read_text().strip(); cases=(Path('audit/raw')/'cases-code.txt').read_text().strip(); legacy=(Path('audit/raw')/'legacy-valoracion-count.txt').read_text().strip()
          summary={'expected_sha':'d54dfa7df226dbd5b823fca1878ce8a60a3548cb','sitemap_urls':sum(1 for x in (Path('audit/raw')/'sitemap-urls.txt').read_text().splitlines() if x.strip()),'audited_urls':len(pages),'url_pass':sum(r['status']=='PASS' for r in pages),'url_warn':len(pw),'url_fail':len(pf),'internal_links':len(links),'internal_link_pass':sum(r['status']=='PASS' for r in links),'internal_link_warn':len(lw),'internal_link_fail':len(lf),'rendered_upload_images':len(images),'image_pass':sum(r['status']=='PASS' for r in images),'image_fail':len(imf),'legacy_valoracion_content_count':legacy,'valoracion_alias':alias,'cases_status':cases,'failed_urls':[{'url':r['url'],'failures':r['failures']} for r in pf],'failed_links':[{'url':r['url'],'failures':r['failures']} for r in lf],'failed_images':imf,'warnings':[{'url':r['url'],'warnings':r['warnings']} for r in pw+lw]}
          (out/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2))
          md=['# NUVANX production d54 final audit','',f"- SHA: `{summary['expected_sha']}`",f"- Sitemap URLs: **{summary['sitemap_urls']}**",f"- Audited URLs PASS/WARN/FAIL: **{summary['url_pass']} / {summary['url_warn']} / {summary['url_fail']}**",f"- Internal links PASS/WARN/FAIL: **{summary['internal_link_pass']} / {summary['internal_link_warn']} / {summary['internal_link_fail']}**",f"- Rendered upload images PASS/FAIL: **{summary['image_pass']} / {summary['image_fail']}**",f"- Legacy valuation content refs: **{legacy}**",f"- Legacy valuation alias: **{alias}**",f"- Cases route: **HTTP {cases}**",'']
          if pf:md+=['## Failed URLs','']+[f"- `{r['url']}` — {r['failures']}" for r in pf]+['']
          if lf:md+=['## Failed internal links','']+[f"- `{r['url']}` — {r['failures']}" for r in lf]+['']
          if imf:md+=['## Failed images','']+[f"- `{r['url']}` — HTTP {r['http']}" for r in imf]+['']
          if pw or lw:md+=['## Warnings','']+[f"- `{r['url']}` — {r['warnings']}" for r in pw+lw]+['']
          (out/'SUMMARY.md').write_text('\n'.join(md),encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False))
          if legacy!='0' or alias!='301|https://nuvanx.com/madrid/valoracion/' or cases!='404' or pf or lf or imf: raise SystemExit(1)
          PY

      - name: Upload final audit evidence
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: production-d54-final-full-audit-${{ github.run_attempt }}
          path: audit/report/
          retention-days: 30
          if-no-files-found: error

      - name: Remove remote audit files
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${REMOTE_AUDIT:-}" ]] && [[ -f "$HOME/.ssh/config" ]]; then
            ssh -n nvx-prod-audit "case '$REMOTE_AUDIT' in /tmp/nvx-prod-d54-final-*) rm -rf '$REMOTE_AUDIT' '${REMOTE_AUDIT}.tgz' '${REMOTE_AUDIT}-capture.sh' '${REMOTE_AUDIT}-resources.sh' ;; *) exit 1 ;; esac" || true
          fi

      - name: Destroy SSH identity
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/key" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"
