name: Production Gate & Atomic Deploy to SiteGround

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================
  # FASE 1: Auditoría de Código, Sintaxis & Compilación Assets
  # =========================================================
  audit-and-build:
    name: 🛡️ Audit, Lint & Asset Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Entorno PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl
          tools: php-cs-fixer

      # --- Cache de Dependencias ---
      - name: Cache de Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Instalar Dependencias PHP
        run: |
          if [ -f "composer.json" ]; then
            composer install --no-interaction --prefer-dist --optimize-autoloader
          fi

      # --- Linters & Verificación de Tipos ---
      - name: Validar Sintaxis PHP (AST Check)
        run: |
          find . -type f -name "*.php" -not -path "./vendor/*" -not -path "./node_modules/*" -print0 | xargs -0 -n1 php -l

  # =========================================================
  # FASE 2: E2E Tests (Dependencias de Staging2)
  # =========================================================
  e2e-tests:
    name: 🧪 E2E Acceptance Tests
    needs: audit-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests against Production
        env:
          BASE_URL: ${{ secrets.PROD_BASE_URL || 'https://nuvanx.com' }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          cd scripts/staging2
          node browser-acceptance.mjs

  # =========================================================
  # FASE 3: Despliegue Atómico a SiteGround (Solo en Main)
  # =========================================================
  deploy-siteground:
    name: 🚀 Atomic Deploy to SiteGround
    needs: [audit-and-build, e2e-tests]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Verify staging2 acceptance passed for this SHA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Checking Deploy Staging2 runs for SHA ${{ github.sha }}..."
          # Install minimal tools
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y jq curl >/dev/null
          OWNER_REPO="${{ github.repository }}"
          SHA="${{ github.sha }}"
          runs_json=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" "https://api.github.com/repos/${OWNER_REPO}/actions/runs?per_page=100")
          ok=$(echo "$runs_json" | jq -r --arg name "Deploy Staging2" --arg sha "$SHA" '.workflow_runs[] | select(.name==$name and .head_sha==$sha and .conclusion=="success") | .id' | head -n1)
          if [ -z "$ok" ]; then
            echo "Staging2 acceptance did not pass for SHA $SHA; aborting deploy"
            exit 1
          fi
          echo "Found successful Deploy Staging2 run id: $ok — proceeding with deploy"

      - name: Configurar Clave SSH para SiteGround
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      - name: Añadir Host de SiteGround a Known Hosts with StrictHostKeyChecking
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.PROD_SSH_PORT || 18765 }} -H ${{ secrets.PROD_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Upload theme to production server (temporary location)
        run: |
          ssh -p ${{ secrets.PROD_SSH_PORT || 18765 }} -o StrictHostKeyChecking=yes \
            ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }} \
            "mkdir -p /tmp/nuvanx-medical-build"
          rsync -avz \
            -e "ssh -p ${{ secrets.PROD_SSH_PORT || 18765 }} -o StrictHostKeyChecking=yes" \
            --exclude='.git*' \
            --exclude='.github*' \
            --exclude='node_modules*' \
            --exclude='tests*' \
            --exclude='playwright*' \
            --exclude='*.log' \
            ./wp-content/themes/nuvanx-medical/ \
            ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:/tmp/nuvanx-medical-build/

      - name: Upload deploy script to production server
        run: |
          scp -P ${{ secrets.PROD_SSH_PORT || 18765 }} -o StrictHostKeyChecking=yes \
            tools/deploy/deploy-to-prod.sh \
            ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:/tmp/

      - name: Execute deployment using deploy-to-prod.sh script
        run: |
          ssh -p ${{ secrets.PROD_SSH_PORT || 18765 }} -o StrictHostKeyChecking=yes \
            ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }} \
            "bash /tmp/deploy-to-prod.sh \
              --prod-root ${{ secrets.PROD_WP_PATH }} \
              --source-theme /tmp/nuvanx-medical-build \
              --sha ${{ github.sha }} \
              --confirm"

      - name: Cleanup temporary files
        run: |
          ssh -p ${{ secrets.PROD_SSH_PORT || 18765 }} -o StrictHostKeyChecking=yes \
            ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }} \
            "rm -f /tmp/deploy-to-prod.sh && rm -rf /tmp/nuvanx-medical-build"
