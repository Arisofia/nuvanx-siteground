name: Clean Boundary Robots Regex

on:
  push:
    branches:
      - fix/staging2-origin-boundary-fallback-20260808
    paths:
      - .github/workflows/clean-boundary-robots-regex.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/staging2-origin-boundary-fallback-20260808
          fetch-depth: 0
          persist-credentials: true
      - name: Replace only robots meta extraction line
        shell: python
        run: |
          from pathlib import Path
          p = Path('scripts/staging2/verify-staging-boundary.mjs')
          lines = p.read_text(encoding='utf-8').splitlines()
          matches = [i for i, line in enumerate(lines) if "robots_meta=" in line]
          if len(matches) != 1:
              raise SystemExit(f'Expected one robots_meta line, found {len(matches)}')
          lines[matches[0]] = "    'robots_meta=\"$(grep -Eio \\'<meta[^>]+name=[^ >]*robots[^ >]*[^>]*>\\' \"$body\" | head -n 1 || true)\"',"
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/staging2/verify-staging-boundary.mjs
          git diff --check
      - name: Commit and push script only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Nuvanx Engineering'
          git config user.email 'admin@nuvanx.com'
          git add scripts/staging2/verify-staging-boundary.mjs
          git diff --cached --check
          git commit -m 'fix(staging2): simplify robots meta extraction'
          git push origin HEAD:fix/staging2-origin-boundary-fallback-20260808
