name: Staging2 Rendered Acceptance

on:
  workflow_run:
    workflows:
      - Deploy Staging2
    types:
      - completed
    branches:
      - master
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Deployment SHA to verify'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: staging2-rendered-acceptance
  cancel-in-progress: false

jobs:
  verify:
    # Solo corre si el workflow de despliegue terminó en éxito
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://staging2.nuvanx.com
      EXPECTED_SHA: ${{ inputs.expected_sha || github.event.workflow_run.head_sha || github.sha }}
      SSH_FETCH_HOST: nvx-staging2
      # Forzar modo no interactivo en herramientas comunes
      CI: true
    steps:
      - name: Checkout canonical acceptance contract
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Validate expected SHA input
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(printf '%s' "$EXPECTED_SHA" | tr -d '[:space:]')"
          echo "EXPECTED_SHA=$EXPECTED_SHA" >> "$GITHUB_ENV"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'EXPECTED_SHA must be a full lowercase 40-character SHA.' >&2
            exit 1
          }

      - name: Configure strict SSH authentication
        shell: bash
        env:
          STAGING2_SSH_HOST: ${{ secrets.STAGING2_SSH_HOST }}
          STAGING2_SSH_PORT: ${{ secrets.STAGING2_SSH_PORT }}
          STAGING2_SSH_USER: ${{ secrets.STAGING2_SSH_USER }}
          STAGING2_SSH_PRIVATE_KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          STAGING2_SSH_KNOWN_HOSTS: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${STAGING2_SSH_HOST:?Missing STAGING2_SSH_HOST secret}"
          : "${STAGING2_SSH_USER:?Missing STAGING2_SSH_USER secret}"
          : "${STAGING2_SSH_PRIVATE_KEY:?Missing STAGING2_SSH_PRIVATE_KEY secret}"
          : "${STAGING2_SSH_KNOWN_HOSTS:?Missing STAGING2_SSH_KNOWN_HOSTS secret}"

          SSH_PORT="${STAGING2_SSH_PORT:-18765}"
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] || {
            echo 'STAGING2_SSH_PORT must be numeric.' >&2
            exit 1
          }
          [[ "$STAGING2_SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || {
            echo 'STAGING2_SSH_HOST contains unsupported characters.' >&2
            exit 1
          }
          [[ "$STAGING2_SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo 'STAGING2_SSH_USER contains unsupported characters.' >&2
            exit 1
          }

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          # Clave privada
          printf '%s\n' "$STAGING2_SSH_PRIVATE_KEY" > "$HOME/.ssh/staging2_key"
          chmod 600 "$HOME/.ssh/staging2_key"

          # Known hosts estricto
          printf '%s\n' "$STAGING2_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          # Config de SSH endurecida
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx-staging2
            HostName $STAGING2_SSH_HOST
            User $STAGING2_SSH_USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/staging2_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 15
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Verify SSH reachability (SOCKS5 proxy disabled)
        shell: bash
        run: |
          set -euo pipefail
          # Verifica que existan utilidades mínimas en el remoto
          ssh -o ConnectTimeout=20 nvx-staging2 'command -v curl >/dev/null && command -v mktemp >/dev/null'
          # El proxy SOCKS5 se ha deshabilitado para probar la conexión directa
          # ssh -f -N -D 1080 -o ExitOnForwardFailure=yes -o ConnectTimeout=20 nvx-staging2

      - name: Install dependencies
        run: npm ci
        env:
          NODE_ENV: test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Verify rendered document, integrations and route consistency
        # env:
        #   HTTP_PROXY: socks5://127.0.0.1:1080
        #   HTTPS_PROXY: socks5://127.0.0.1:1080
        run: node scripts/staging2/browser-acceptance.mjs

      - name: Upload Browser Acceptance Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging2-browser-acceptance-artifacts
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
