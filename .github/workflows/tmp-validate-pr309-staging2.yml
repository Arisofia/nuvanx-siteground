name: Validate PR 309 on staging2 once

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/tmp-validate-pr309-staging2.yml'

permissions:
  contents: read

concurrency:
  group: staging2-manual-deployment
  cancel-in-progress: false

jobs:
  deploy-and-validate:
    if: github.event.pull_request.number == 309
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: staging2
      url: https://staging2.nuvanx.com
    env:
      WP_ROOT: /home/customer/www/staging2.nuvanx.com/public_html
      BASE_URL: https://staging2.nuvanx.com
    steps:
      - name: Check out PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: refactor/sonar-legacy-duplication-phase2-20260731
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve immutable PR SHA
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_SHA="$(git rev-parse HEAD)"
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "DEPLOY_SHA=$DEPLOY_SHA" >> "$GITHUB_ENV"
          echo "Deploying PR SHA: $DEPLOY_SHA"

      - name: Validate theme and runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          find wp-content/themes/nuvanx-medical -type f -name '*.php' -print0 | xargs -0 -n 1 php -l >/dev/null
          php scripts/theme-hygiene/test-catalog-json-contract.php
          php scripts/theme-hygiene/test-catalog-json-runtime-contract.php
          php scripts/theme-hygiene/test-page-render-helpers.php
          node scripts/theme-hygiene/test-theme-hygiene.mjs

      - name: Configure strict SSH authentication
        shell: bash
        env:
          STAGING2_SSH_HOST: ${{ secrets.STAGING2_SSH_HOST }}
          STAGING2_SSH_PORT: ${{ secrets.STAGING2_SSH_PORT }}
          STAGING2_SSH_USER: ${{ secrets.STAGING2_SSH_USER }}
          STAGING2_SSH_PRIVATE_KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          STAGING2_SSH_KNOWN_HOSTS: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${STAGING2_SSH_HOST:?Missing STAGING2_SSH_HOST secret}"
          : "${STAGING2_SSH_USER:?Missing STAGING2_SSH_USER secret}"
          : "${STAGING2_SSH_PRIVATE_KEY:?Missing STAGING2_SSH_PRIVATE_KEY secret}"
          : "${STAGING2_SSH_KNOWN_HOSTS:?Missing STAGING2_SSH_KNOWN_HOSTS secret}"
          SSH_PORT="${STAGING2_SSH_PORT:-18765}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$STAGING2_SSH_PRIVATE_KEY" > "$HOME/.ssh/staging2_key"
          printf '%s\n' "$STAGING2_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/staging2_key" "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx-staging2
            HostName $STAGING2_SSH_HOST
            User $STAGING2_SSH_USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/staging2_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 15
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Verify staging2 target
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-staging2 "test -d '$WP_ROOT' && test -f '$WP_ROOT/wp-config.php' && command -v wp >/dev/null && command -v rsync >/dev/null && command -v php >/dev/null"

      - name: Upload immutable theme payload
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_RELEASE="$WP_ROOT/wp-content/.nuvanx-deployments/${DEPLOY_SHA}-${GITHUB_RUN_ID}"
          echo "REMOTE_RELEASE=$REMOTE_RELEASE" >> "$GITHUB_ENV"
          ssh nvx-staging2 "mkdir -p '$REMOTE_RELEASE/theme'"
          rsync -az --delete \
            --exclude='.git' \
            --exclude='php_errorlog' \
            --exclude='*.log' \
            --exclude='_archive*' \
            --exclude='_disabled*' \
            --exclude='*.bak*' \
            wp-content/themes/nuvanx-medical/ \
            "nvx-staging2:$REMOTE_RELEASE/theme/"
          rsync -az tools/deploy/deploy-to-staging2.sh \
            "nvx-staging2:$REMOTE_RELEASE/deploy-to-staging2.sh"

      - name: Execute guarded deployment
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-staging2 \
            "NUVANX_CONFIRM=yes bash '$REMOTE_RELEASE/deploy-to-staging2.sh' --wp-root '$WP_ROOT' --source-theme '$REMOTE_RELEASE/theme' --sha '$DEPLOY_SHA' --confirm"

      - name: Verify deployed marker
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYED_SHA="$(ssh nvx-staging2 "tr -d '\\r\\n' < '$WP_ROOT/wp-content/themes/nuvanx-medical/.nvx-deploy-sha'")"
          test "$DEPLOYED_SHA" = "$DEPLOY_SHA"
          echo "Verified marker: $DEPLOYED_SHA"

      - name: Verify WordPress runtime and JSON data
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-staging2 "cd '$WP_ROOT' && wp core is-installed && wp eval 'foreach ([\"aesthetic-treatment-pages.json\",\"btl-detail-pages.json\",\"faq-catalog.json\",\"treatments-catalog.json\",\"seo-metadata.json\",\"home-faq-v2.json\",\"treatment-hub-schema.json\",\"laser-medicine-page.json\",\"aesthetic-medicine-page.json\"] as \$file) { \$path = get_stylesheet_directory() . \"/inc/data/\" . \$file; if (!is_readable(\$path) || !is_array(json_decode(file_get_contents(\$path), true))) { throw new Exception(\"Invalid catalog: \" . \$file); } } echo \"catalog-runtime-ok\";'"

      - name: Validate affected public routes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nvx-pages
          check_route() {
            local slug="$1"
            local marker="${2:-}"
            local file="/tmp/nvx-pages/$(printf '%s' "$slug" | tr '/-' '__').html"
            local code
            echo "Checking $slug"
            code="$(curl --location --silent --show-error --max-time 30 --retry 2 --output "$file" --write-out '%{http_code}' "$BASE_URL$slug")"
            echo "HTTP $code $slug"
            test "$code" = "200"
            test "$(wc -c < "$file")" -gt 5000
            if [[ -n "$marker" ]]; then
              grep -Fq "$marker" "$file"
            fi
            if grep -Eq '@nvx-(i18n|home|claim|laser-url|aesthetic-url):' "$file"; then
              echo "Unresolved catalog token on $slug" >&2
              exit 1
            fi
          }
          check_route '/' 'NUVANX'
          check_route '/soluciones-medicas/' 'nvx-solutions-page'
          check_route '/medicina-estetica/' 'nvx-aesthetic-editorial'
          check_route '/medicina-estetica-laser/'
          check_route '/endolift-facial-papada-mandibula/' 'nvx-endolift-editorial'
          check_route '/endolaser-corporal/' 'nvx-endolaser-editorial'
          check_route '/laser-co2-fraccionado-madrid-textura-cicatrices-poro/' 'nvx-co2-editorial'
          check_route '/exion-face/' 'nvx-btl-detail'

      - name: Remove temporary remote payload
        if: always()
        shell: bash
        run: |
          if [[ -n "${REMOTE_RELEASE:-}" ]]; then
            ssh nvx-staging2 "rm -rf '$REMOTE_RELEASE'" || true
          fi

      - name: Write validation summary
        if: success()
        shell: bash
        run: |
          {
            echo '## PR 309 staging2 validation passed'
            echo
            echo "- SHA: \`$DEPLOY_SHA\`"
            echo '- Theme deployment: success'
            echo '- Marker verification: success'
            echo '- PHP/runtime contracts: success'
            echo '- Published route checks: success'
            echo '- Unresolved catalog tokens: none'
          } >> "$GITHUB_STEP_SUMMARY"
