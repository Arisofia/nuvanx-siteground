name: Production Release
run-name: Production release ${{ github.sha }}

on:
  push:
    branches:
      - release/production

permissions:
  contents: read
  actions: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    name: Promote exact accepted release SHA
    uses: ./.github/workflows/deploy.yml
    with:
      sha: ${{ github.sha }}
      authorize_production: true
    secrets: inherit
