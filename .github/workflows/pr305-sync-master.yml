name: Sync PR 305 with master

on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/pr305-sync-master.yml'

permissions:
  contents: write

concurrency:
  group: pr305-sync-master
  cancel-in-progress: true

jobs:
  sync:
    if: >-
      github.event.pull_request.number == 305 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Merge current master and remove this workflow
        run: |
          set -euo pipefail
          git config user.name "Arisofia"
          git config user.email "246412546+Arisofia@users.noreply.github.com"
          git fetch origin master
          git merge --no-ff origin/master -m "merge(master): synchronize PR 305 after review fixes"
          rm -f .github/workflows/pr305-sync-master.yml
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): remove temporary PR 305 sync workflow"
          fi
          git push origin HEAD:fix/institutional-headers-hubspot-form-20260731
