name: Patch production boundary expected host once

on:
  push:
    branches:
      - fix/production-boundary-expected-host-20260820
    paths:
      - scripts/patch-production-boundary-expected-host-once.py
      - .github/workflows/patch-production-boundary-expected-host-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/production-boundary-expected-host-20260820
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact fix and validate contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-production-boundary-expected-host-once.py
          node --check scripts/production/verify-production-boundary.mjs
          bash -n scripts/ci/test-release-regression-contract.sh
          bash scripts/ci/test-release-regression-contract.sh
          git diff --check
      - name: Commit target files only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Arisofia'
          git config user.email '246412546+Arisofia@users.noreply.github.com'
          git add scripts/production/verify-production-boundary.mjs scripts/ci/test-release-regression-contract.sh
          git diff --cached --quiet && { echo 'No target changes to commit' >&2; exit 1; }
          git commit -m 'fix(release): wire expected host into production boundary'
          git push origin HEAD:fix/production-boundary-expected-host-20260820
