name: Stage strict route heading ownership

on:
  push:
    branches:
      - fix/hero-copy-coherence-home-video-stack-20260728
    paths:
      - '.github/workflows/fix-route-heading-ownership.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/hero-copy-coherence-home-video-stack-20260728
          fetch-depth: 0

      - name: Apply strict route ownership patch
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          equipo = 'wp-content/themes/nuvanx-medical/inc/nvx-equipo-page.php'
          old_detector = '''function nvx_content_is_equipo_page( string $content ): bool {
              if ( false !== strpos( $content, 'nvx-equipo-editorial' ) ) {
                  return false;
              }

              if ( ! nvx_equipo_is_singular_context() ) {
                  return false;
              }

              if ( is_front_page() || is_home() ) {
                  return false;
              }

              if ( is_page( 'equipo-medico' ) ) {
                  return true;
              }

              $path = function_exists( 'nvx_schema_current_path' )
                  ? nvx_schema_current_path( (int) get_queried_object_id() )
                  : '';

              if ( is_string( $path ) && function_exists( 'nvx_schema_path_matches' ) && nvx_schema_path_matches( $path, '/equipo-medico/' ) ) {
                  return true;
              }

              return (bool) preg_match(
                  '/aria-label=["\\']Equipo médico NUVANX["\\']|id=["\\']nvx-equipo-h1["\\']|class=["\\'][^"\\']*nvx-equipo-hero|equipo especialista/iu',
                  $content
              );
          }'''
          new_detector = '''function nvx_content_is_equipo_page( string $content ): bool {
              if ( false !== strpos( $content, 'nvx-equipo-editorial' ) ) {
                  return false;
              }

              if ( ! nvx_equipo_is_singular_context() || is_front_page() || is_home() ) {
                  return false;
              }

              if ( is_page( 'equipo-medico' ) ) {
                  return true;
              }

              $path = function_exists( 'nvx_schema_current_path' )
                  ? nvx_schema_current_path( (int) get_queried_object_id() )
                  : '';

              return is_string( $path )
                  && function_exists( 'nvx_schema_path_matches' )
                  && nvx_schema_path_matches( $path, '/equipo-medico/' );
          }'''
          replace_once(equipo, old_detector, new_detector)

          contacto = 'wp-content/themes/nuvanx-medical/inc/nvx-contacto-audit-fixes.php'
          replace_once(
              contacto,
              "        'Contacto, sedes y consulta médica'          => 'Clínicas NUVANX en Madrid — Chamberí y Salamanca–Goya',\n        'Agenda tu valoración médica'                => 'Clínicas NUVANX en Madrid — Chamberí y Salamanca–Goya',",
              "        'Contacto, sedes y consulta médica'          => 'Contacto NUVANX en Madrid',\n        'Agenda tu valoración médica'                => 'Contacto NUVANX en Madrid',",
          )

          audit = 'scripts/staging2/audit-full-site-ui.mjs'
          replace_once(
              audit,
              'const canonicalPalette = [',
              '''const routeHeadingContracts = new Map([
            ['/contacto/', { exact: 'Contacto NUVANX en Madrid' }],
            ['/medicina-estetica-chamberi/', { forbidden: ['Equipo médico NUVANX: quién te valora y quién trata'] }],
            ['/clinicas-de-medicina-estetica-nuvanx/medicina-estetica-goya-barrio-salamanca/', { forbidden: ['Equipo médico NUVANX: quién te valora y quién trata'] }],
            ['/medicina-estetica/', { forbidden: ['Equipo médico NUVANX: quién te valora y quién trata'] }],
          ]);

          const canonicalPalette = [''',
          )
          replace_once(
              audit,
              "  if (result.h1.length !== 1 || !result.h1[0]) fail(scope, `expected one visible H1, found ${JSON.stringify(result.h1)}`);",
              '''  if (result.h1.length !== 1 || !result.h1[0]) fail(scope, `expected one visible H1, found ${JSON.stringify(result.h1)}`);
            const headingContract = routeHeadingContracts.get(result.route);
            if (headingContract?.exact && result.h1[0] !== headingContract.exact) {
              fail(scope, `route H1 is ${JSON.stringify(result.h1[0])} instead of ${JSON.stringify(headingContract.exact)}`);
            }
            if (headingContract?.forbidden?.includes(result.h1[0])) {
              fail(scope, `route inherited forbidden H1 ${JSON.stringify(result.h1[0])}`);
            }''',
          )
          PY

      - name: Extend static hero contract
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          p = Path('scripts/theme-hygiene/test-hero-layout-contract.mjs')
          text = p.read_text(encoding='utf-8')
          old = "const frontPage = read('wp-content/themes/nuvanx-medical/front-page.php');"
          new = """const frontPage = read('wp-content/themes/nuvanx-medical/front-page.php');
          const equipoPage = read('wp-content/themes/nuvanx-medical/inc/nvx-equipo-page.php');
          const contactoFixes = read('wp-content/themes/nuvanx-medical/inc/nvx-contacto-audit-fixes.php');
          const fullSiteAudit = read('scripts/staging2/audit-full-site-ui.mjs');"""
          if text.count(old) != 1:
              raise SystemExit('hero contract source declarations changed')
          text = text.replace(old, new, 1)
          marker = "forbidText('hero layout CSS', layoutCss, 'grid-template-columns: minmax(28rem');"
          addition = """

          const equipoDetectorStart = equipoPage.indexOf('function nvx_content_is_equipo_page');
          const equipoDetectorEnd = equipoPage.indexOf('\n/**\n * Hero.', equipoDetectorStart);
          const equipoDetector = equipoDetectorStart >= 0 && equipoDetectorEnd > equipoDetectorStart
            ? equipoPage.slice(equipoDetectorStart, equipoDetectorEnd)
            : '';
          requireText('Equipo route ownership', equipoDetector, "is_page( 'equipo-medico' )");
          requireText('Equipo route ownership', equipoDetector, "nvx_schema_path_matches( $path, '/equipo-medico/' )");
          forbidText('Equipo route ownership', equipoDetector, 'preg_match(');
          forbidText('Equipo route ownership', equipoDetector, 'equipo especialista');

          requireText(
            'Contacto route ownership',
            contactoFixes,
            "'Agenda tu valoración médica'                => 'Contacto NUVANX en Madrid'",
          );
          forbidText(
            'Contacto route ownership',
            contactoFixes,
            "'Agenda tu valoración médica'                => 'Clínicas NUVANX en Madrid — Chamberí y Salamanca–Goya'",
          );

          for (const marker of [
            'const routeHeadingContracts = new Map([',
            "['/contacto/', { exact: 'Contacto NUVANX en Madrid' }]",
            "['/medicina-estetica-chamberi/', { forbidden:",
            "['/clinicas-de-medicina-estetica-nuvanx/medicina-estetica-goya-barrio-salamanca/', { forbidden:",
            "['/medicina-estetica/', { forbidden:",
            'route inherited forbidden H1',
          ]) requireText('rendered route heading contract', fullSiteAudit, marker);"""
          if text.count(marker) != 1:
              raise SystemExit('hero contract insertion marker changed')
          text = text.replace(marker, marker + addition, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Validate corrections
        run: |
          set -euo pipefail
          php -l wp-content/themes/nuvanx-medical/inc/nvx-equipo-page.php
          php -l wp-content/themes/nuvanx-medical/inc/nvx-contacto-audit-fixes.php
          node --check scripts/staging2/audit-full-site-ui.mjs
          node --check scripts/theme-hygiene/test-hero-layout-contract.mjs
          node scripts/theme-hygiene/test-hero-layout-contract.mjs
          node scripts/staging2/test-github-managed-pages.mjs

      - name: Commit corrections
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            wp-content/themes/nuvanx-medical/inc/nvx-equipo-page.php \
            wp-content/themes/nuvanx-medical/inc/nvx-contacto-audit-fixes.php \
            scripts/staging2/audit-full-site-ui.mjs \
            scripts/theme-hygiene/test-hero-layout-contract.mjs
          git commit -m 'fix(headings): enforce route-specific hero ownership'
          git push origin HEAD:fix/hero-copy-coherence-home-video-stack-20260728
