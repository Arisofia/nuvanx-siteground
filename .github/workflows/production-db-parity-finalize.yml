name: Finalize production DB parity

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/production-db-parity-finalize.yml'

permissions:
  contents: read

concurrency:
  group: production-db-parity-finalize
  cancel-in-progress: true

env:
  EXPECTED_SOURCE_SHA: f366d14a6487e723b0d7512c4ed3300cad9d61ed
  PROD_ROOT: /home/customer/www/nuvanx.com/public_html
  VALIDATED_BACKUP_DIR: /home/customer/backups-nuvanx/production/pre-parity-20260729T150916Z-30464434483
  EVIDENCE_DIR: production-db-parity-final

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'ops/production-db-parity-20260729'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out immutable candidate and build contract payload
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build exact migration contract
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          mkdir -p "$EVIDENCE_DIR" release/theme/inc
          cp scripts/wp/nvx-production-readiness-command.php release/
          cp wp-content/themes/nuvanx-medical/inc/nvx-navigation-filters.php release/theme/inc/
          cat > release/bootstrap.php <<'PHP'
          <?php
          if ( ! defined( 'ABSPATH' ) ) { return; }
          if ( ! defined( 'NVX_PATH_OJERAS_SURCO_LAGRIMAL' ) ) {
              define( 'NVX_PATH_OJERAS_SURCO_LAGRIMAL', '/ojeras-surco-lagrimal-madrid/' );
          }
          if ( ! function_exists( 'nvx_production_readiness_governed_pages' ) ) {
              function nvx_production_readiness_governed_pages(): array {
                  return array(
                      'liposculpt-air' => array( 'status' => 'trash', 'target' => '/remodelacion-corporal-laser-madrid/' ),
                      'v-lift-awake' => array( 'status' => 'trash', 'target' => '/protocolos-signature/' ),
                      'dr-javier-rivera-tejeda' => array( 'status' => 'trash', 'target' => '/equipo-medico/' ),
                      'tratamientos' => array( 'status' => 'trash', 'target' => '/soluciones-medicas/' ),
                      'eye-frame-rejuvenecimiento-mirada-madrid' => array( 'status' => 'draft', 'target' => NVX_PATH_OJERAS_SURCO_LAGRIMAL ),
                  );
              }
          }
          require_once __DIR__ . '/theme/inc/nvx-navigation-filters.php';
          PHP
          php -l release/bootstrap.php
          php -l release/nvx-production-readiness-command.php
          tar -czf production-db-parity-final-release.tgz -C release .
          sha256sum production-db-parity-final-release.tgz | tee "$EVIDENCE_DIR/release-sha256.txt"

      - name: Configure strict SiteGround SSH
        env:
          SSH_HOST: ${{ secrets.STAGING2_SSH_HOST }}
          SSH_PORT_SECRET: ${{ secrets.STAGING2_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING2_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing STAGING2_SSH_HOST}"
          : "${SSH_USER:?Missing STAGING2_SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Missing STAGING2_SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing STAGING2_SSH_KNOWN_HOSTS}"
          SSH_PORT="${SSH_PORT_SECRET:-18765}"
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/siteground_key"
          chmod 600 "$HOME/.ssh/siteground_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host siteground-prod
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/siteground_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 15
          EOF
          chmod 600 "$HOME/.ssh/config"
          ssh siteground-prod 'printf "SSH_OK\n"'

      - name: Upload isolated payload
        run: |
          set -euo pipefail
          REMOTE_RELEASE="$PROD_ROOT/wp-content/.nuvanx-deployments/db-parity-final-$GITHUB_RUN_ID"
          echo "REMOTE_RELEASE=$REMOTE_RELEASE" >> "$GITHUB_ENV"
          ssh siteground-prod "mkdir -p '$REMOTE_RELEASE' && chmod 700 '$REMOTE_RELEASE'"
          scp production-db-parity-final-release.tgz siteground-prod:"$REMOTE_RELEASE/release.tgz"
          ssh siteground-prod "cd '$REMOTE_RELEASE' && tar -xzf release.tgz && rm release.tgz"

      - name: Validate backup and finalize parity
        run: |
          set -euo pipefail
          ssh siteground-prod \
            "PROD_ROOT='$PROD_ROOT' BACKUP_DIR='$VALIDATED_BACKUP_DIR' REMOTE_RELEASE='$REMOTE_RELEASE' EXPECTED_SOURCE_SHA='$EXPECTED_SOURCE_SHA' RUN_ID='$GITHUB_RUN_ID' bash -se" \
            > "$EVIDENCE_DIR/remote-final.log" 2>&1 <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          cd "$PROD_ROOT"
          [[ "$(wp option get siteurl)" == 'https://nuvanx.com' ]]
          [[ "$(wp option get home)" == 'https://nuvanx.com' ]]
          [[ "$(wp theme list --status=active --field=name)" == 'nuvanx-medical' ]]

          sql_gzip="$BACKUP_DIR/database.sql.gz"
          test -s "$sql_gzip"
          [[ "$(stat -c '%a' "$sql_gzip")" == '600' ]]
          gzip -t "$sql_gzip"
          gzip_bytes="$(wc -c < "$sql_gzip" | tr -d ' ')"
          sql_sha256="$(sha256sum "$sql_gzip" | awk '{print $1}')"
          [[ "$sql_sha256" =~ ^[0-9a-f]{64}$ ]]
          wp db check --quiet

          bootstrap="$REMOTE_RELEASE/bootstrap.php"
          command_file="$REMOTE_RELEASE/nvx-production-readiness-command.php"
          raw="$BACKUP_DIR/final-audit.raw"
          json="$BACKUP_DIR/final-audit.json"

          normalize_json() {
            php -r '
              $raw=file_get_contents($argv[1]);
              $start=strpos($raw, "[");
              $end=strrpos($raw, "]");
              if ($start === false || $end === false || $end < $start) { fwrite(STDERR, "json delimiters missing\n"); exit(2); }
              $json=substr($raw, $start, $end-$start+1);
              $decoded=json_decode($json, true);
              if (!is_array($decoded)) { fwrite(STDERR, "json decode failed\n"); exit(2); }
              file_put_contents($argv[2], $json."\n");
            ' "$1" "$2"
          }
          audit_state() {
            php -r '
              $rows=json_decode(file_get_contents($argv[1]), true);
              if (!is_array($rows)) exit(2);
              foreach ($rows as $row) {
                $type=(string)($row["type"] ?? "");
                $status=(string)($row["status"] ?? "");
                $expected=(string)($row["expected"] ?? "");
                $menu=(int)($row["menu_items"] ?? 0);
                $ok=$type === "approved" ? $status === "publish" : ($type === "governed" ? (($status === "absent" || $status === $expected) && $menu === 0) : ($type === "navigation" && $status === "clean"));
                if (!$ok) { echo "pending"; exit(0); }
              }
              echo "clean";
            ' "$1"
          }

          wp --skip-themes --require="$bootstrap" --require="$command_file" \
            nvx production-readiness audit --allow-pending --format=json > "$raw"
          normalize_json "$raw" "$json"
          pre_status="$(audit_state "$json")"

          mutation_started=0
          rollback() {
            rc=$?
            if (( rc != 0 )) && (( mutation_started == 1 )); then
              rollback_sql="$BACKUP_DIR/rollback-${RUN_ID}.sql"
              gzip -cd "$sql_gzip" > "$rollback_sql"
              wp db import "$rollback_sql"
              rm -f "$rollback_sql"
              wp cache flush
              wp sg purge
              echo 'ROLLBACK_DB_OK'
            fi
            exit "$rc"
          }
          trap rollback EXIT

          if [[ "$pre_status" == 'pending' ]]; then
            mutation_started=1
            wp --skip-themes --require="$bootstrap" --require="$command_file" \
              nvx production-readiness apply --confirm=retire-prototypes --allow-production
            migration_result='applied'
          else
            migration_result='already-clean'
          fi

          wp --skip-themes --require="$bootstrap" --require="$command_file" \
            nvx production-readiness audit --format=json > "$raw"
          normalize_json "$raw" "$json"
          post_status="$(audit_state "$json")"
          [[ "$post_status" == 'clean' ]]
          wp db check --quiet
          wp cache flush
          wp sg purge

          cat > "$BACKUP_DIR/manifest.txt" <<EOF
          source_sha=$EXPECTED_SOURCE_SHA
          run_id=$RUN_ID
          finalized_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          sql_file=$sql_gzip
          sql_gzip_bytes=$gzip_bytes
          sql_sha256=$sql_sha256
          pre_audit=$pre_status
          migration_result=$migration_result
          post_audit=$post_status
          db_check=ok
          EOF
          chmod 600 "$BACKUP_DIR/manifest.txt" "$raw" "$json"
          trap - EXIT

          echo "BACKUP_DIR=$BACKUP_DIR"
          echo "SQL_BACKUP_GZIP_BYTES=$gzip_bytes"
          echo "SQL_BACKUP_SHA256=$sql_sha256"
          echo "PRE_AUDIT=$pre_status"
          echo "MIGRATION_RESULT=$migration_result"
          echo "POST_AUDIT=$post_status"
          echo 'SQL_BACKUP_REQUIRED_OK'
          echo 'PRODUCTION_DB_PARITY_OK'
          REMOTE

          grep -Fq 'SQL_BACKUP_REQUIRED_OK' "$EVIDENCE_DIR/remote-final.log"
          grep -Fq 'PRODUCTION_DB_PARITY_OK' "$EVIDENCE_DIR/remote-final.log"
          grep -E '^(BACKUP_DIR|SQL_BACKUP_GZIP_BYTES|SQL_BACKUP_SHA256|PRE_AUDIT|MIGRATION_RESULT|POST_AUDIT|SQL_BACKUP_REQUIRED_OK|PRODUCTION_DB_PARITY_OK)=' \
            "$EVIDENCE_DIR/remote-final.log" > "$EVIDENCE_DIR/result-summary.txt"

      - name: Verify critical production routes
        run: |
          set -euo pipefail
          : > "$EVIDENCE_DIR/production-http.log"
          for path in / /soluciones-medicas/ /protocolos-signature/ /remodelacion-corporal-laser-madrid/ /madrid/valoracion/ /contacto/ /blog/; do
            url="https://nuvanx.com${path}"
            code=''
            for attempt in 1 2 3 4 5; do
              code="$(curl --silent --show-error --location --max-time 25 --output /tmp/nvx-page.html --write-out '%{http_code}' "$url" || true)"
              [[ "$code" == '200' ]] && break
              sleep 5
            done
            printf '%s %s\n' "$code" "$url" | tee -a "$EVIDENCE_DIR/production-http.log"
            [[ "$code" == '200' ]]
            grep -Eqi '<main|<h1' /tmp/nvx-page.html
          done
          echo 'PRODUCTION_HTTP_PARITY_OK' | tee -a "$EVIDENCE_DIR/production-http.log"

      - name: Remove isolated payload
        if: always()
        run: |
          set -euo pipefail
          if [[ -n "${REMOTE_RELEASE:-}" ]]; then ssh siteground-prod "rm -rf '$REMOTE_RELEASE'"; fi

      - name: Upload non-sensitive final evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: production-db-parity-final-${{ github.run_id }}
          path: production-db-parity-final/
          retention-days: 30
          if-no-files-found: error
