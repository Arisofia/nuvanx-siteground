name: Temporary Staging2 theme drift check

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Configure SiteGround SSH
        env:
          SSH_HOST: ${{ secrets.STAGING2_SSH_HOST }}
          SSH_PORT_SECRET: ${{ secrets.STAGING2_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING2_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing STAGING2_SSH_HOST}"
          : "${SSH_USER:?Missing STAGING2_SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Missing STAGING2_SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing STAGING2_SSH_KNOWN_HOSTS}"
          SSH_PORT="${SSH_PORT_SECRET:-18765}"
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/siteground_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/siteground_key" "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host siteground-staging
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/siteground_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 15
          EOF
          chmod 600 "$HOME/.ssh/config"
      - name: Compare canonical theme files with staging2
        run: |
          set -euo pipefail
          files=(
            wp-content/themes/nuvanx-medical/header.php
            wp-content/themes/nuvanx-medical/inc/nvx-document-governance.php
            wp-content/themes/nuvanx-medical/inc/nvx-integrations.php
            wp-content/themes/nuvanx-medical/assets/css/nvx-base.css
            wp-content/themes/nuvanx-medical/assets/css/nvx-header.css
            wp-content/themes/nuvanx-medical/functions.php
          )
          : > /tmp/local.sha
          for f in "${files[@]}"; do sha256sum "$f" >> /tmp/local.sha; done
          echo '--- MASTER SHA256 ---'
          cat /tmp/local.sha
          echo '--- STAGING SHA256 ---'
          ssh siteground-staging 'cd /home/customer/www/staging2.nuvanx.com/public_html && sha256sum wp-content/themes/nuvanx-medical/header.php wp-content/themes/nuvanx-medical/inc/nvx-document-governance.php wp-content/themes/nuvanx-medical/inc/nvx-integrations.php wp-content/themes/nuvanx-medical/assets/css/nvx-base.css wp-content/themes/nuvanx-medical/assets/css/nvx-header.css wp-content/themes/nuvanx-medical/functions.php && echo "HEADER_GOVERNANCE_LINES" && grep -n "nvx_document_governance" wp-content/themes/nuvanx-medical/header.php || true'
