name: Run editorial data extractor once

on:
  pull_request:
    branches:
      - master
    paths:
      - scripts/theme-hygiene/externalize-editorial-page-data-once.php
      - .github/workflows/tmp-run-editorial-data-extractor.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: refactor/sonar-legacy-duplication-phase2-20260731
          fetch-depth: 0
          persist-credentials: true

      - name: Extract editorial page data
        run: php scripts/theme-hygiene/externalize-editorial-page-data-once.php

      - name: Validate generated files
        shell: bash
        run: |
          set -euo pipefail
          php -l wp-content/themes/nuvanx-medical/inc/nvx-catalog-json.php
          php -l wp-content/themes/nuvanx-medical/inc/nvx-laser-medicine-page.php
          php -l wp-content/themes/nuvanx-medical/inc/nvx-aesthetic-medicine-page.php
          php -r '
            foreach (["laser-medicine-page.json", "aesthetic-medicine-page.json"] as $file) {
              $path = "wp-content/themes/nuvanx-medical/inc/data/{$file}";
              $data = json_decode((string) file_get_contents($path), true, 512, JSON_THROW_ON_ERROR);
              foreach (["pillars", "faqs"] as $section) {
                if (empty($data[$section]) || !is_array($data[$section])) {
                  fwrite(STDERR, "Missing {$section} in {$file}\n");
                  exit(1);
                }
              }
            }
          '

      - name: Commit generated editorial data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-run-editorial-data-extractor.yml
          git rm scripts/theme-hygiene/externalize-editorial-page-data-once.php
          git add wp-content/themes/nuvanx-medical/inc/data/laser-medicine-page.json \
                  wp-content/themes/nuvanx-medical/inc/data/aesthetic-medicine-page.json \
                  wp-content/themes/nuvanx-medical/inc/nvx-laser-medicine-page.php \
                  wp-content/themes/nuvanx-medical/inc/nvx-aesthetic-medicine-page.php
          git commit -m "refactor(quality): externalize editorial page datasets"
          git push origin HEAD:refactor/sonar-legacy-duplication-phase2-20260731
