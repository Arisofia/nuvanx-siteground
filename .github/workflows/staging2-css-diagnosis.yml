name: Staging2 CSS diagnosis

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/staging2-css-diagnosis.yml'

permissions:
  contents: read

concurrency:
  group: staging2-css-diagnosis
  cancel-in-progress: true

env:
  STAGING_URL: https://staging2.nuvanx.com/
  STAGING_ROOT: /home/customer/www/staging2.nuvanx.com/public_html

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/staging2-css-load-diagnostic'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install browser runtime
        run: |
          set -euo pipefail
          npm install --no-save playwright-core@1.55.0
          test -x /usr/bin/chromium
          mkdir -p evidence

      - name: Probe public edge and record SiteGround guard state
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request
          from pathlib import Path
          url='https://staging2.nuvanx.com/'
          req=urllib.request.Request(url,headers={'User-Agent':'NUVANX-CSS-Diagnostic/1.0'})
          try:
              with urllib.request.urlopen(req,timeout=30) as r:
                  body=r.read().decode('utf-8','replace'); status=r.status; ctype=r.headers.get('content-type','')
          except urllib.error.HTTPError as e:
              body=e.read().decode('utf-8','replace'); status=e.code; ctype=e.headers.get('content-type','')
          Path('evidence/public-edge.html').write_text(body,encoding='utf-8')
          print(f'PUBLIC_STATUS={status}')
          print(f'PUBLIC_CONTENT_TYPE={ctype}')
          if status not in (200,202): raise SystemExit('unexpected public status')
          if status==202 and '/.well-known/sgcaptcha/' in body:
              print('PUBLIC_SITEGROUND_CAPTCHA=1')
          elif status==200:
              print('PUBLIC_SITEGROUND_CAPTCHA=0')
          else:
              raise SystemExit('unexpected non-page response')
          PY

      - name: Configure strict SiteGround SSH
        env:
          SSH_HOST: ${{ secrets.STAGING2_SSH_HOST }}
          SSH_PORT_SECRET: ${{ secrets.STAGING2_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING2_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing STAGING2_SSH_HOST}"
          : "${SSH_USER:?Missing STAGING2_SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Missing STAGING2_SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing STAGING2_SSH_KNOWN_HOSTS}"
          SSH_PORT="${SSH_PORT_SECRET:-18765}"
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/siteground_key"
          chmod 600 "$HOME/.ssh/siteground_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host siteground-staging
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/siteground_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 15
          EOF
          chmod 600 "$HOME/.ssh/config"
          ssh siteground-staging 'printf "SSH_OK\n"'

      - name: Diagnose SiteGround origin, WordPress enqueue state and CSS delivery
        run: |
          set -euo pipefail
          ssh siteground-staging "STAGING_ROOT='$STAGING_ROOT' bash -se" > evidence/siteground-diagnostic.txt 2>&1 <<'REMOTE'
          set -Eeuo pipefail
          cd "$STAGING_ROOT"
          printf 'SITEURL=%s\nHOME=%s\nTHEME=%s\n' "$(wp option get siteurl)" "$(wp option get home)" "$(wp theme list --status=active --field=name)"
          test -s wp-content/themes/nuvanx-medical/assets/css/nvx-base.css
          test -s wp-content/themes/nuvanx-medical/assets/css/nvx-header.css
          test -s wp-content/themes/nuvanx-medical/assets/css/nvx-tokens.css
          test -s wp-content/themes/nuvanx-medical/assets/css/nvx-components.css
          test -s wp-content/themes/nuvanx-medical/assets/css/nvx-site-layout.css
          echo 'THEME_CSS_FILES_OK=1'
          echo '--- WORDPRESS STYLE QUEUE ---'
          wp eval '
            do_action("wp_enqueue_scripts");
            foreach (wp_styles()->queue as $handle) {
              $obj = wp_styles()->registered[$handle] ?? null;
              if ($obj) { echo $handle . "|" . $obj->src . "|deps=" . implode(",", $obj->deps) . "\\n"; }
            }
          ' --skip-plugins --skip-themes=false
          echo '--- LOCAL ORIGIN HEADERS ---'
          curl -ksS -D /tmp/nvx-origin-headers.txt -o /tmp/nvx-origin.html --resolve staging2.nuvanx.com:443:127.0.0.1 https://staging2.nuvanx.com/
          cat /tmp/nvx-origin-headers.txt
          wc -c /tmp/nvx-origin.html
          grep -Eqi '<html|<body' /tmp/nvx-origin.html
          if grep -q '/.well-known/sgcaptcha/' /tmp/nvx-origin.html; then echo 'LOCAL_ORIGIN_CAPTCHA=1'; exit 3; fi
          echo 'LOCAL_ORIGIN_CAPTCHA=0'
          echo '--- LOCAL ORIGIN STYLESHEET LINKS ---'
          grep -Eoi '<link[^>]+rel=["'"'][^"'"']*stylesheet[^"'"']*["'"'][^>]*>' /tmp/nvx-origin.html | grep -Eo 'href=["'"'][^"'"']+' | sed -E 's/^href=["'"']//; s/["'"']$//' | sort -u | tee /tmp/nvx-css-urls.txt || true
          echo '--- LOCAL ORIGIN CSS RESPONSES ---'
          while IFS= read -r url; do
            case "$url" in
              /*) url="https://staging2.nuvanx.com$url" ;;
              http://*|https://*) ;;
              *) continue ;;
            esac
            printf 'CSS_URL=%s\n' "$url"
            curl -ksS -L --resolve staging2.nuvanx.com:443:127.0.0.1 -o /tmp/nvx-css.tmp -w 'HTTP=%{http_code} TYPE=%{content_type} BYTES=%{size_download}\n' "$url"
            test -s /tmp/nvx-css.tmp
            head -c 80 /tmp/nvx-css.tmp | tr '\n' ' '; echo
          done < /tmp/nvx-css-urls.txt
          echo 'LOCAL_ORIGIN_CSS_OK=1'
          REMOTE

      - name: Inspect computed styles against the local-origin HTML snapshot
        run: |
          set -euo pipefail
          scp siteground-staging:/tmp/nvx-origin.html evidence/local-origin-home.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('evidence/local-origin-home.html')
          s=p.read_text(encoding='utf-8',errors='replace')
          if len(s) < 1000: raise SystemExit('origin HTML unexpectedly small')
          print('LOCAL_ORIGIN_HTML_BYTES=',len(s))
          print('LINK_STYLESHEETS=',len(re.findall(r'<link\\b[^>]*stylesheet',s,re.I)))
          PY
          node <<'NODE'
          const { chromium } = require('playwright-core');
          const fs = require('fs');
          (async()=>{
            const html=fs.readFileSync('evidence/local-origin-home.html','utf8');
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/chromium',args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            await page.setContent(html,{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(1500);
            const result=await page.evaluate(()=>{const b=getComputedStyle(document.body); const h=document.querySelector('h1'); return {bodyMargin:b.margin,bodyFont:b.fontFamily,bodyDisplay:b.display,h1Font:h?getComputedStyle(h).fontFamily:null,h1Size:h?getComputedStyle(h).fontSize:null,styles:[...document.querySelectorAll('link[rel~="stylesheet"]')].map(x=>({href:x.href,sheet:!!x.sheet,rules:x.sheet?(()=>{try{return x.sheet.cssRules.length}catch(e){return -1}})():0}))};});
            console.log(JSON.stringify(result,null,2));
            await page.screenshot({path:'evidence/local-origin-home.png',fullPage:true});
            if(result.bodyMargin==='8px') throw new Error('default body margin: CSS not applied');
            if(result.bodyFont==='Times New Roman' || result.bodyFont==='serif') throw new Error('default typography: CSS not applied');
            if(result.styles.some(x=>!x.sheet || x.rules===0)) throw new Error('stylesheet has no parsed rules');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Upload diagnosis evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging2-css-diagnosis-${{ github.run_id }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
