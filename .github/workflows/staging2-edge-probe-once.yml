name: Staging2 Edge Probe Once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/staging2-edge-probe-once.yml

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public staging edge
        shell: bash
        run: |
          set -euo pipefail
          echo "PROBE_SLOT=${{ matrix.slot }}"
          echo "RUNNER_NAME=$RUNNER_NAME"
          routes=(
            '/'
            '/soluciones-medicas/'
            '/equipo-medico/'
            '/blog/'
            '/endolift-primeras-72-horas-que-esperar/'
          )
          pass=0
          challenge=0
          other=0
          for attempt in 1 2 3; do
            echo "=== attempt=$attempt ==="
            round_pass=1
            for route in "${routes[@]}"; do
              h="$(mktemp)"; b="$(mktemp)"
              status="$(curl -sS --max-time 20 --connect-timeout 10 \
                -A 'NUVANX-Staging-Boundary/1.0' \
                -H 'Accept: text/html,application/xhtml+xml' \
                -D "$h" -o "$b" -w '%{http_code}' \
                "https://staging2.nuvanx.com${route}" || true)"
              sg="$(awk -F': *' 'tolower($1)=="sg-captcha" {gsub("\r", "", $2); print $2}' "$h" | tail -1)"
              robots="$(awk -F': *' 'tolower($1)=="x-robots-tag" {gsub("\r", "", $2); print $2}' "$h" | tail -1)"
              server="$(awk -F': *' 'tolower($1)=="server" {gsub("\r", "", $2); print $2}' "$h" | tail -1)"
              bytes="$(wc -c < "$b" | tr -d ' ')"
              echo "route=$route status=$status sg_captcha=${sg:-NONE} x_robots=${robots:-NONE} server=${server:-NONE} bytes=$bytes"
              if [[ "$status" == '200' && -z "$sg" ]]; then
                pass=$((pass+1))
              elif [[ "$status" == '202' || "$sg" == 'challenge' ]]; then
                challenge=$((challenge+1)); round_pass=0
              else
                other=$((other+1)); round_pass=0
              fi
              rm -f "$h" "$b"
            done
            if [[ "$round_pass" -eq 1 ]]; then
              echo "ROUND_${attempt}=PUBLIC_200_PASS"
              break
            fi
            sleep 3
          done
          echo "PROBE_SUMMARY slot=${{ matrix.slot }} pass=$pass challenge=$challenge other=$other"
