name: Block C Code Fixes Once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/block-c-code-fixes-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout master
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact verified fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {actual}')
              p.write_text(text.replace(old, new))

          # EMFUSION registry intentionally omits hub; never read optional data directly.
          replace_exact(
              'wp-content/themes/nuvanx-medical/inc/nvx-btl-detail-pages.php',
              "\t$html .= '<p class=\"nvx-body\"><a class=\"nvx-brand-inline-link\" href=\"' . esc_url( $c['hub'] ) . '\">' . esc_html__( 'Ver plataforma EXION® BTL (hub)', 'nuvanx-medical' ) . '</a></p>';",
              "\t$hub_url = trim( (string) ( $c['hub'] ?? '' ) );\n\tif ( '' !== $hub_url ) {\n\t\t$html .= '<p class=\"nvx-body\"><a class=\"nvx-brand-inline-link\" href=\"' . esc_url( $hub_url ) . '\">' . esc_html__( 'Ver plataforma EXION® BTL (hub)', 'nuvanx-medical' ) . '</a></p>';\n\t}",
          )

          # The theme fallback asset does not exist. Prefer a healthy configured attachment,
          # otherwise use the canonical uploads poster already used by the preload contract.
          replace_exact(
              'wp-content/themes/nuvanx-medical/front-page.php',
              "$hero_video_url  = content_url( '/uploads/2026/07/nvx-home-video-portada-hero-12s-720p.mp4' );\n$poster_id       = get_theme_mod( 'nvx_home_video_poster_id' );\n$hero_poster_url = $poster_id\n\t? wp_get_attachment_image_url( $poster_id, 'full' )\n\t: get_stylesheet_directory_uri() . '/assets/img/nvx-home-video-default-poster.webp';",
              "$hero_video_url      = content_url( '/uploads/2026/07/nvx-home-video-portada-hero-12s-720p.mp4' );\n$canonical_poster_url = content_url( '/uploads/2026/07/nvx-home-video-portada-poster.webp' );\n$poster_id             = (int) get_theme_mod( 'nvx_home_video_poster_id', 0 );\n$poster_file           = $poster_id > 0 ? get_attached_file( $poster_id ) : '';\n$configured_poster_url = ( $poster_id > 0 && is_string( $poster_file ) && '' !== $poster_file && is_readable( $poster_file ) )\n\t? wp_get_attachment_image_url( $poster_id, 'full' )\n\t: '';\n$hero_poster_url       = is_string( $configured_poster_url ) && '' !== $configured_poster_url\n\t? $configured_poster_url\n\t: $canonical_poster_url;",
          )

          # Global header is part of the site-wide contract, including /madrid/valoracion/.
          replace_exact(
              'wp-content/themes/nuvanx-medical/header.php',
              "<?php if ( ! ( function_exists( 'nvx_is_valoracion_page_request' ) && nvx_is_valoracion_page_request() ) ) : ?>\n<header class=\"nvx-header\" role=\"banner\" id=\"nvx-header\">",
              "<header class=\"nvx-header\" role=\"banner\" id=\"nvx-header\">",
          )
          replace_exact(
              'wp-content/themes/nuvanx-medical/header.php',
              "</dialog>\n<?php endif; ?>\n\n<main id=\"nvx-main\" class=\"nvx-main\" role=\"main\" tabindex=\"-1\">",
              "</dialog>\n\n<main id=\"nvx-main\" class=\"nvx-main\" role=\"main\" tabindex=\"-1\">",
          )

          # QA must inspect the actual dialog class and the canonical title-only intro.
          replace_exact(
              'scripts/staging2/block-c-52x3.mjs',
              "header nav a:visible, .nvx-mobile-menu a:visible, [data-nvx-mobile-menu] a:visible",
              "header nav a:visible, .nvx-mobile-nav a:visible, .nvx-mobile-menu a:visible, [data-nvx-mobile-menu] a:visible",
              count=2,
          )
          replace_exact(
              'scripts/staging2/block-c-52x3.mjs',
              "const hero = document.querySelector('.nvx-home-hero, .nvx-brand-hero, .nvx-blog-hero, .nvx-page-header, .nvx-strategy-intro, [class*=\"hero\"]');",
              "const hero = document.querySelector('.nvx-home-hero, .nvx-brand-hero, .nvx-blog-hero, .nvx-page-header, .nvx-section-intro, .nvx-catalog__intro, .nvx-strategy-intro, [class*=\"hero\"]');",
          )
          PY

      - name: Validate touched code
        shell: bash
        run: |
          set -euo pipefail
          php -l wp-content/themes/nuvanx-medical/inc/nvx-btl-detail-pages.php
          php -l wp-content/themes/nuvanx-medical/front-page.php
          php -l wp-content/themes/nuvanx-medical/header.php
          node --check scripts/staging2/block-c-52x3.mjs
          git diff --check
          git diff --exit-code -- .github/workflows/block-c-code-fixes-once.yml
          git diff --stat

      - name: Commit and push fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NUVANX Block C Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            wp-content/themes/nuvanx-medical/inc/nvx-btl-detail-pages.php \
            wp-content/themes/nuvanx-medical/front-page.php \
            wp-content/themes/nuvanx-medical/header.php \
            scripts/staging2/block-c-52x3.mjs
          test -n "$(git diff --cached --name-only)"
          git commit -m 'fix(block-c): resolve verified rendering defects'
          git push origin HEAD:master
