name: Apply final PR 309 review fixes

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/tmp-pr309-final-review-fixes.yml'

concurrency:
  group: tmp-pr309-final-review-fixes
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fix:
    if: github.event.pull_request.number == 309 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f
        with:
          php-version: '8.2'
          coverage: none
          tools: none

      - name: Apply final review fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              source = file.read_text(encoding='utf-8')
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}')
              file.write_text(source.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'wp-content/themes/nuvanx-medical/inc/nvx-aesthetic-medicine-page.php',
              "if ( ! defined( 'ABSPATH' ) ) {\n\texit;\n}\n",
              "if ( ! defined( 'ABSPATH' ) ) {\n\texit;\n}\n\nrequire_once __DIR__ . '/nvx-page-render-helpers.php';\n"
          )

          replace_once(
              'wp-content/themes/nuvanx-medical/inc/nvx-treatments-catalog.php',
              "function nvx_treatments_catalog_data(): array {\n\trequire_once __DIR__ . '/nvx-catalog-json.php';\n\n\treturn nvx_catalog_json_resolved( 'treatments-catalog.json' );\n}",
              "function nvx_treatments_catalog_data(): array {\n\tstatic $catalog = null;\n\n\tif ( is_array( $catalog ) ) {\n\t\treturn $catalog;\n\t}\n\n\trequire_once __DIR__ . '/nvx-catalog-json.php';\n\t$categories = nvx_catalog_filter_records(\n\t\tnvx_catalog_json_resolved( 'treatments-catalog.json' ),\n\t\tarray( 'key', 'label', 'items' ),\n\t\t'treatments-catalog.json:categories'\n\t);\n\n\t$catalog = array();\n\tforeach ( $categories as $category ) {\n\t\t$category['items'] = nvx_catalog_filter_records(\n\t\t\t(array) $category['items'],\n\t\t\tarray( 'meta', 'title', 'body', 'url' ),\n\t\t\t'treatments-catalog.json:items'\n\t\t);\n\t\t$catalog[] = $category;\n\t}\n\n\treturn $catalog;\n}"
          )
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          php -l wp-content/themes/nuvanx-medical/inc/nvx-aesthetic-medicine-page.php
          php -l wp-content/themes/nuvanx-medical/inc/nvx-treatments-catalog.php
          php scripts/theme-hygiene/test-catalog-json-contract.php
          php scripts/theme-hygiene/test-catalog-json-runtime-contract.php
          php scripts/theme-hygiene/test-catalog-review-contract.php
          php scripts/theme-hygiene/test-page-render-helpers.php
          node scripts/theme-hygiene/test-theme-hygiene.mjs

      - name: Commit non-workflow changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wp-content/themes/nuvanx-medical/inc/nvx-aesthetic-medicine-page.php
          git add wp-content/themes/nuvanx-medical/inc/nvx-treatments-catalog.php
          git diff --cached --check
          git commit -m 'fix(quality): validate remaining migrated catalog'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
