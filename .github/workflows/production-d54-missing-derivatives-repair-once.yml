name: Production d54 Missing Derivatives Repair Once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/production-d54-missing-derivatives-repair-once.yml

permissions:
  contents: read

concurrency:
  group: production-d54-missing-derivatives-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROD_ROOT: /home/customer/www/nuvanx.com/public_html
      BASE_URL: https://nuvanx.com
      EXPECTED_SHA: d54dfa7df226dbd5b823fca1878ce8a60a3548cb
    steps:
      - name: Configure strict production SSH and guard d54
        shell: bash
        env:
          HOST: ${{ secrets.PROD_SSH_HOST }}
          PORT: ${{ secrets.PROD_SSH_PORT }}
          USER: ${{ secrets.PROD_SSH_USER }}
          KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${HOST:?Missing PROD_SSH_HOST}"
          : "${USER:?Missing PROD_SSH_USER}"
          : "${KEY:?Missing PROD_SSH_PRIVATE_KEY}"
          : "${KH:?Missing PROD_SSH_KNOWN_HOSTS}"
          SSH_PORT="${PORT:-18765}"
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KH" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx-prod-derivatives
            HostName $HOST
            User $USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 20
            ServerAliveInterval 30
            ServerAliveCountMax 2
          EOF
          chmod 600 "$HOME/.ssh/config"
          ssh -n nvx-prod-derivatives "test -d '$PROD_ROOT' && command -v wp >/dev/null && command -v php >/dev/null && command -v curl >/dev/null"
          test "$(ssh -n nvx-prod-derivatives "tr -d '\\r\\n' < '$PROD_ROOT/wp-content/themes/nuvanx-medical/.nvx-deploy-sha'")" = "$EXPECTED_SHA"
          test "$(ssh -n nvx-prod-derivatives "cd '$PROD_ROOT' && wp config get DB_NAME")" = 'db0ecrycwv2tgb'
          test "$(ssh -n nvx-prod-derivatives "cd '$PROD_ROOT' && wp option get home")" = 'https://nuvanx.com'
          test "$(ssh -n nvx-prod-derivatives "cd '$PROD_ROOT' && wp option get blog_public")" = '1'
          echo 'MISSING_DERIVATIVES_GUARD=PASS'

      - name: Build transactional derivative generator
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/nvx-generate-32.php" <<'PHP'
          <?php
          declare(strict_types=1);
          $root=$argv[1]??'';$sha=$argv[2]??'';$state=$argv[3]??'';
          if(!$root||!$sha||!$state){fwrite(STDERR,"ARGS_FAIL\n");exit(2);} $root=rtrim($root,'/'); require $root.'/wp-load.php';
          if(trim((string)@file_get_contents($root.'/wp-content/themes/nuvanx-medical/.nvx-deploy-sha'))!==$sha){fwrite(STDERR,"SHA_FAIL\n");exit(3);}
          if(DB_NAME!=='db0ecrycwv2tgb'||home_url('/')!=='https://nuvanx.com/'){fwrite(STDERR,"ENV_FAIL\n");exit(4);}
          if(!is_dir($state)&&!mkdir($state,0700,true)){fwrite(STDERR,"STATE_FAIL\n");exit(5);} @chmod($state,0700);
          $u=wp_get_upload_dir(); if(!empty($u['error'])){fwrite(STDERR,"UPLOAD_FAIL={$u['error']}\n");exit(6);} $base=rtrim($u['basedir'],'/');
          $items=[
            ['2025/04/despacho-nuvanx.webp','2025/04/despacho-nuvanx-225x300.webp',225,300,true],
            ['2025/04/despacho-nuvanx.webp','2025/04/despacho-nuvanx-480x640.webp',480,640,true],
            ['2025/04/despacho-nuvanx.webp','2025/04/despacho-nuvanx-768x1024.webp',768,1024,true],
            ['2026/02/casmara.webp','2026/02/casmara-300x121.webp',300,121,true],
            ['2026/04/endolaser-facial.webp','2026/04/endolaser-facial-300x200.webp',300,200,true],
            ['2026/04/endolaser-facial.webp','2026/04/endolaser-facial-480x320.webp',480,320,true],
            ['2026/04/endolaser-facial.webp','2026/04/endolaser-facial-768x512.webp',768,512,true],
            ['2026/04/endolaser-facial.webp','2026/04/endolaser-facial-980x654.webp',980,654,true],
          ];
          foreach(['higiene-facial-con-microdermoabrasion','diatermia-facial','depilacion-laser','hidrolipoclasia','masajes-posoperatorios','radiofrecuencia-corporal','presoterapia','tratamiento-anticelulitico'] as $name){
            $src="2026/05/{$name}.webp";
            $items[]=[$src,"2026/05/{$name}-300x200.webp",300,200,true];
            $items[]=[$src,"2026/05/{$name}-768x512.webp",768,512,true];
            $items[]=[$src,"2026/05/{$name}-980x654.webp",980,654,true];
          }
          if(count($items)!==32){fwrite(STDERR,"MANIFEST_COUNT_FAIL=".count($items)."\n");exit(7);}
          $created=[];
          $rollback=function()use(&$created,$base){foreach($created as $rel){$f=$base.'/'.$rel;if(is_file($f))@unlink($f);}echo "DERIVATIVE_ROLLBACK=PASS removed=".count($created)."\n";};
          try{
            foreach($items as [$srcRel,$dstRel,$w,$h,$crop]){
              $src=$base.'/'.$srcRel;$dst=$base.'/'.$dstRel;
              if(!is_file($src)||filesize($src)<=0)throw new RuntimeException('SOURCE_MISSING:'.$srcRel);
              if(is_file($dst)){
                $i=@getimagesize($dst); if(!is_array($i)||(int)$i[0]!==$w||(int)$i[1]!==$h||filesize($dst)<=0)throw new RuntimeException('EXISTING_INVALID:'.$dstRel.':'.(is_array($i)?$i[0].'x'.$i[1]:'unknown'));
                echo "DERIVATIVE_ALREADY_VALID rel={$dstRel} {$w}x{$h}\n"; continue;
              }
              $tmp=dirname($dst).'/.nvx-deriv-'.pathinfo($dst,PATHINFO_FILENAME).'-'.getmypid().'.webp'; @unlink($tmp);
              $ed=wp_get_image_editor($src); if(is_wp_error($ed))throw new RuntimeException('EDITOR_FAIL:'.$srcRel.':'.$ed->get_error_message());
              $r=$ed->resize($w,$h,(bool)$crop); if(is_wp_error($r))throw new RuntimeException('RESIZE_FAIL:'.$srcRel.':'.$r->get_error_message());
              $saved=$ed->save($tmp,'image/webp'); if(is_wp_error($saved)){@unlink($tmp);throw new RuntimeException('SAVE_FAIL:'.$dstRel.':'.$saved->get_error_message());}
              $savedPath=is_array($saved)&&!empty($saved['path'])?(string)$saved['path']:$tmp;
              $i=@getimagesize($savedPath); if(!is_array($i)||(int)$i[0]!==$w||(int)$i[1]!==$h||filesize($savedPath)<=0){@unlink($savedPath);throw new RuntimeException('DIM_FAIL:'.$dstRel.':'.(is_array($i)?$i[0].'x'.$i[1]:'unknown'));}
              if(!@rename($savedPath,$dst)){@unlink($savedPath);throw new RuntimeException('RENAME_FAIL:'.$dstRel);}
              $created[]=$dstRel; echo "DERIVATIVE_CREATED rel={$dstRel} {$w}x{$h} bytes=".filesize($dst)." sha256=".hash_file('sha256',$dst)."\n";
            }
            foreach($items as [$s,$d,$w,$h,$crop]){$f=$base.'/'.$d;$i=@getimagesize($f);if(!is_array($i)||(int)$i[0]!==$w||(int)$i[1]!==$h||filesize($f)<=0)throw new RuntimeException('FINAL_VERIFY_FAIL:'.$d);}
            file_put_contents($state.'/created.json',wp_json_encode($created,JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES)); @chmod($state.'/created.json',0600);
            echo "MISSING_DERIVATIVES_GENERATED=PASS total=32 created=".count($created)." existing=".(32-count($created))."\n";
          }catch(Throwable $e){fwrite(STDERR,"MISSING_DERIVATIVES_FAIL=".$e->getMessage()."\n");$rollback();exit(20);}
          PHP
          php -l "$RUNNER_TEMP/nvx-generate-32.php"

      - name: Execute transactional generation
        shell: bash
        run: |
          set -euo pipefail
          STATE_DIR="/tmp/nvx-d54-derivatives-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "STATE_DIR=$STATE_DIR" >> "$GITHUB_ENV"
          scp "$RUNNER_TEMP/nvx-generate-32.php" nvx-prod-derivatives:/tmp/nvx-generate-32.php
          ssh -n nvx-prod-derivatives "rm -rf '$STATE_DIR' && mkdir -m 700 '$STATE_DIR' && php /tmp/nvx-generate-32.php '$PROD_ROOT' '$EXPECTED_SHA' '$STATE_DIR'"

      - name: Purge production caches
        shell: bash
        run: |
          set -euo pipefail
          ssh -n nvx-prod-derivatives "cd '$PROD_ROOT' && wp cache flush"
          ssh -n nvx-prod-derivatives "cd '$PROD_ROOT' && if wp help sg >/dev/null 2>&1; then wp sg purge || true; fi"
          ssh -n nvx-prod-derivatives "cd '$PROD_ROOT' && wp eval 'if(function_exists(\"opcache_reset\")){opcache_reset();}' || true"
          echo 'MISSING_DERIVATIVES_CACHE_PURGE=PASS'

      - name: Verify all 32 public derivative URLs
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/nvx-verify-32.sh" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          root="$1"; base="$2"; sha="$3"; ua='NUVANX-Production-Derivative-Verify/1.0'
          cd "$root"; test "$(tr -d '\r\n' < wp-content/themes/nuvanx-medical/.nvx-deploy-sha)" = "$sha"
          files=(
            '2025/04/despacho-nuvanx-225x300.webp' '2025/04/despacho-nuvanx-480x640.webp' '2025/04/despacho-nuvanx-768x1024.webp'
            '2026/02/casmara-300x121.webp'
            '2026/04/endolaser-facial-300x200.webp' '2026/04/endolaser-facial-480x320.webp' '2026/04/endolaser-facial-768x512.webp' '2026/04/endolaser-facial-980x654.webp'
          )
          for name in higiene-facial-con-microdermoabrasion diatermia-facial depilacion-laser hidrolipoclasia masajes-posoperatorios radiofrecuencia-corporal presoterapia tratamiento-anticelulitico; do files+=("2026/05/${name}-300x200.webp" "2026/05/${name}-768x512.webp" "2026/05/${name}-980x654.webp"); done
          test "${#files[@]}" = '32'
          pass=0
          for rel in "${files[@]}"; do code="$(curl -sS --max-time 20 -A "$ua" -o /dev/null -w '%{http_code}' "$base/wp-content/uploads/$rel")"; test "$code" = '200'; pass=$((pass+1)); echo "DERIVATIVE_HTTP=PASS rel=$rel"; done
          test "$pass" = '32'; echo 'MISSING_DERIVATIVES_PUBLIC=PASS files=32'
          SH
          chmod +x "$RUNNER_TEMP/nvx-verify-32.sh"
          scp "$RUNNER_TEMP/nvx-verify-32.sh" nvx-prod-derivatives:/tmp/nvx-verify-32.sh
          ssh -n nvx-prod-derivatives "bash /tmp/nvx-verify-32.sh '$PROD_ROOT' '$BASE_URL' '$EXPECTED_SHA'"

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -f "$HOME/.ssh/config" ]]; then ssh -n nvx-prod-derivatives "rm -f /tmp/nvx-generate-32.php /tmp/nvx-verify-32.sh; case '${STATE_DIR:-}' in /tmp/nvx-d54-derivatives-*) rm -rf '${STATE_DIR:-}' ;; '') ;; *) exit 1 ;; esac" || true; fi
          rm -f "$HOME/.ssh/key" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"
