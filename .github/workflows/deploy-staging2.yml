name: Deploy Staging2 (manual)

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-staging2.yml'
      - 'tools/deploy/deploy-to-staging2.sh'
      - 'scripts/staging2/verify-rendered-document.mjs'
      - 'docs/operations/deployment.md'
  workflow_dispatch:
    inputs:
      git_sha:
        description: 'Full 40-character SHA already merged into master'
        required: true
        type: string
      confirmation:
        description: 'Explicit deployment confirmation'
        required: true
        default: CANCEL
        type: choice
        options:
          - CANCEL
          - DEPLOY_STAGING2

permissions:
  contents: read

concurrency:
  group: staging2-manual-deployment
  cancel-in-progress: false

jobs:
  contract:
    name: Validate deployment contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Validate workflow and deployment contracts
        run: |
          set -euo pipefail
          bash -n tools/deploy/deploy-to-staging2.sh
          node --check scripts/staging2/verify-rendered-document.mjs

  deploy:
    name: Deploy immutable SHA to staging2
    needs: contract
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master' &&
      inputs.confirmation == 'DEPLOY_STAGING2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging2
      url: https://staging2.nuvanx.com
    env:
      DEPLOY_SHA: ${{ inputs.git_sha }}
      WP_ROOT: /home/customer/www/staging2.nuvanx.com/public_html
    steps:
      - name: Check out master history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable source SHA
        shell: bash
        run: |
          set -euo pipefail
          # Trim accidental whitespace/newlines from workflow_dispatch input.
          DEPLOY_SHA="$(printf '%s' "$DEPLOY_SHA" | tr -d '[:space:]')"
          echo "DEPLOY_SHA=$DEPLOY_SHA" >> "$GITHUB_ENV"
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'git_sha must be a full lowercase 40-character SHA.' >&2
            exit 1
          }
          git fetch --no-tags origin master
          git cat-file -e "${DEPLOY_SHA}^{commit}"
          git merge-base --is-ancestor "$DEPLOY_SHA" origin/master || {
            echo 'Refusing to deploy a SHA that is not contained in origin/master.' >&2
            exit 1
          }
          git checkout --detach "$DEPLOY_SHA"
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"

      - name: Configure strict SSH authentication
        shell: bash
        env:
          STAGING2_SSH_HOST: ${{ secrets.STAGING2_SSH_HOST }}
          STAGING2_SSH_PORT: ${{ secrets.STAGING2_SSH_PORT }}
          STAGING2_SSH_USER: ${{ secrets.STAGING2_SSH_USER }}
          STAGING2_SSH_PRIVATE_KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          STAGING2_SSH_KNOWN_HOSTS: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${STAGING2_SSH_HOST:?Missing STAGING2_SSH_HOST secret}"
          : "${STAGING2_SSH_USER:?Missing STAGING2_SSH_USER secret}"
          : "${STAGING2_SSH_PRIVATE_KEY:?Missing STAGING2_SSH_PRIVATE_KEY secret}"
          : "${STAGING2_SSH_KNOWN_HOSTS:?Missing STAGING2_SSH_KNOWN_HOSTS secret}"

          SSH_PORT="${STAGING2_SSH_PORT:-18765}"
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] || {
            echo 'STAGING2_SSH_PORT must be numeric.' >&2
            exit 1
          }
          [[ "$STAGING2_SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || {
            echo 'STAGING2_SSH_HOST contains unsupported characters.' >&2
            exit 1
          }
          [[ "$STAGING2_SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo 'STAGING2_SSH_USER contains unsupported characters.' >&2
            exit 1
          }

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$STAGING2_SSH_PRIVATE_KEY" > "$HOME/.ssh/staging2_key"
          printf '%s\n' "$STAGING2_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/staging2_key" "$HOME/.ssh/known_hosts"

          printf 'Host nvx-staging2\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile %s/.ssh/staging2_key\n  IdentitiesOnly yes\n  BatchMode yes\n  StrictHostKeyChecking yes\n  UserKnownHostsFile %s/.ssh/known_hosts\n  ConnectTimeout 15\n' \
            "$STAGING2_SSH_HOST" \
            "$STAGING2_SSH_USER" \
            "$SSH_PORT" \
            "$HOME" \
            "$HOME" > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"

      - name: Verify SiteGround staging2 target
        shell: bash
        run: |
          set -euo pipefail
          # WP_ROOT is validated locally before deliberate remote interpolation.
          # shellcheck disable=SC2029
          # SiteGround SSH is occasionally briefly unreachable from Actions runners.
          attempt=1
          max_attempts=5
          while true; do
            if ssh -o ConnectTimeout=20 nvx-staging2 \
              "test -d '$WP_ROOT' && test -f '$WP_ROOT/wp-config.php' && command -v wp >/dev/null && command -v rsync >/dev/null && command -v php >/dev/null"; then
              echo "SiteGround staging2 target verified (attempt ${attempt})."
              break
            fi
            if [[ "$attempt" -ge "$max_attempts" ]]; then
              echo "SiteGround SSH verification failed after ${max_attempts} attempts." >&2
              exit 1
            fi
            echo "SSH verify attempt ${attempt}/${max_attempts} failed; retrying..." >&2
            sleep $((attempt * 4))
            attempt=$((attempt + 1))
          done

      - name: Upload immutable release payload
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_RELEASE="$WP_ROOT/wp-content/.nuvanx-deployments/${DEPLOY_SHA}-${GITHUB_RUN_ID}"
          echo "REMOTE_RELEASE=$REMOTE_RELEASE" >> "$GITHUB_ENV"
          # REMOTE_RELEASE is composed from validated local deployment inputs.
          # shellcheck disable=SC2029
          ssh nvx-staging2 "mkdir -p '$REMOTE_RELEASE/theme' '$REMOTE_RELEASE/mu-plugins'"
          rsync -az --delete \
            --exclude='.git' \
            --exclude='php_errorlog' \
            --exclude='*.log' \
            --exclude='_archive*' \
            --exclude='_disabled*' \
            --exclude='*.bak*' \
            wp-content/themes/nuvanx-medical/ \
            "nvx-staging2:$REMOTE_RELEASE/theme/"
          rsync -az --delete \
            --exclude='.git' \
            --exclude='php_errorlog' \
            --exclude='*.log' \
            --exclude='_archive*' \
            --exclude='_disabled*' \
            --exclude='*.bak*' \
            wp-content/mu-plugins/ \
            "nvx-staging2:$REMOTE_RELEASE/mu-plugins/"
          rsync -az tools/deploy/deploy-to-staging2.sh \
            "nvx-staging2:$REMOTE_RELEASE/deploy-to-staging2.sh"
          rsync -az tools/deploy/deploy-required-mu-plugins.sh \
            "nvx-staging2:$REMOTE_RELEASE/deploy-required-mu-plugins.sh"

      - name: Execute guarded remote deployment
        id: remote_deploy
        shell: bash
        run: |
          set -euo pipefail
          # All paths and SHA are validated locally before deliberate remote interpolation.
          # shellcheck disable=SC2029
          ssh nvx-staging2 \
            "NUVANX_CONFIRM=yes bash '$REMOTE_RELEASE/deploy-to-staging2.sh' --wp-root '$WP_ROOT' --source-theme '$REMOTE_RELEASE/theme' --sha '$DEPLOY_SHA' --confirm && NUVANX_CONFIRM=yes bash '$REMOTE_RELEASE/deploy-required-mu-plugins.sh' --environment staging2 --wp-root '$WP_ROOT' --source-mu '$REMOTE_RELEASE/mu-plugins' --confirm"

      - name: Verify deployed marker
        shell: bash
        run: |
          set -euo pipefail
          # WP_ROOT is validated locally before deliberate remote interpolation.
          # shellcheck disable=SC2029
          deployed_sha="$(ssh nvx-staging2 "tr -d '\\r\\n' < '$WP_ROOT/wp-content/themes/nuvanx-medical/.nvx-deploy-sha'")"
          test "$deployed_sha" = "$DEPLOY_SHA"
          echo "Verified staging2 marker: $deployed_sha"

      - name: Set up Node.js for rendered acceptance
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Run complete rendered acceptance for deployed SHA
        env:
          BASE_URL: https://staging2.nuvanx.com
          EXPECTED_SHA: ${{ env.DEPLOY_SHA }}
          # Fetch HTML from the SiteGround host itself. GitHub runner egress IPs
          # are frequently answered with 403/202 placeholders by SiteGround edge.
          SSH_FETCH_HOST: nvx-staging2
        run: |
          set -euo pipefail
          # Marker is already verified; brief settle for post-purge page assembly.
          sleep 8
          node scripts/staging2/verify-rendered-document.mjs

      - name: Configure SSH for cleanup
        if: always()
        shell: bash
        env:
          STAGING2_SSH_HOST: ${{ secrets.STAGING2_SSH_HOST }}
          STAGING2_SSH_PORT: ${{ secrets.STAGING2_SSH_PORT }}
          STAGING2_SSH_USER: ${{ secrets.STAGING2_SSH_USER }}
          STAGING2_SSH_PRIVATE_KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          STAGING2_SSH_KNOWN_HOSTS: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          if [[ -n "${STAGING2_SSH_PRIVATE_KEY:-}" ]]; then
            printf '%s\n' "$STAGING2_SSH_PRIVATE_KEY" > "$HOME/.ssh/staging2_key"
            chmod 600 "$HOME/.ssh/staging2_key"
          fi
          if [[ -n "${STAGING2_SSH_KNOWN_HOSTS:-}" ]]; then
            printf '%s\n' "$STAGING2_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
            chmod 600 "$HOME/.ssh/known_hosts"
          fi

          printf 'Host nvx-staging2\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile %s/.ssh/staging2_key\n  IdentitiesOnly yes\n  BatchMode yes\n  StrictHostKeyChecking yes\n  UserKnownHostsFile %s/.ssh/known_hosts\n  ConnectTimeout 15\n' \
            "${STAGING2_SSH_HOST:-staging2.nuvanx.com}" \
            "${STAGING2_SSH_USER:-customer}" \
            "${STAGING2_SSH_PORT:-18765}" \
            "$HOME" \
            "$HOME" > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"

      - name: Remove temporary remote payload
        if: always()
        shell: bash
        run: |
          set +e
          # Skip cleanup when SSH was never configured (early validation failure)
          # or when no remote payload path was published.
          if [[ -z "${REMOTE_RELEASE:-}" ]]; then
            echo 'No REMOTE_RELEASE path to remove; skipping cleanup.'
            exit 0
          fi
          if [[ ! -f "$HOME/.ssh/config" ]] || ! grep -q 'Host nvx-staging2' "$HOME/.ssh/config" 2>/dev/null; then
            echo 'SSH host nvx-staging2 is not configured; skipping cleanup.'
            exit 0
          fi
          if [[ ! -f "$HOME/.ssh/staging2_key" ]]; then
            echo 'SSH private key not available; skipping cleanup.'
            exit 0
          fi
          # REMOTE_RELEASE is validated locally before deliberate remote interpolation.
          # shellcheck disable=SC2029
          ssh nvx-staging2 "rm -rf '$REMOTE_RELEASE'" || {
            echo "Cleanup SSH failed (non-fatal for early aborts)." >&2
            exit 0
          }

      - name: Write deployment summary
        if: success()
        shell: bash
        run: |
          {
            printf '%s\n' '## Staging2 deployment completed'
            printf '\n'
            printf '%s\n' "- SHA: \`$DEPLOY_SHA\`"
            printf '%s\n' "- Target: \`https://staging2.nuvanx.com\`"
            printf '%s\n' "- Scope: \`wp-content/themes/nuvanx-medical\` + required MU plugins (\`nuvanx-valoracion-native-hubspot-form.php\`, \`nuvanx-contacto-hubspot-form.php\`)"
            printf '%s\n' '- Backup: created on the SiteGround host before synchronization'
            printf '%s\n' '- Verification: deploy marker + complete rendered-document acceptance against the exact SHA'
          } >> "$GITHUB_STEP_SUMMARY"
