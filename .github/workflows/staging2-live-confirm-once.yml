name: Staging2 Live Confirm Once

on:
  push:
    paths:
      - '.github/workflows/staging2-live-confirm-once.yml'

permissions:
  contents: read

jobs:
  confirm:
    runs-on: ubuntu-latest
    env:
      STAGING_ROOT: /home/customer/www/staging2.nuvanx.com/public_html
      PROOF_NAME: nvx-vhost-proof-chatgpt-20260807.txt
      PROOF_CONTENT: NUVANX_STAGING2_ROOT_CONFIRMED_20260807
    steps:
      - name: Configure strict SSH
        shell: bash
        env:
          HOST: ${{ secrets.STAGING2_SSH_HOST }}
          PORT: ${{ secrets.STAGING2_SSH_PORT }}
          USER: ${{ secrets.STAGING2_SSH_USER }}
          KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${HOST:?}"; : "${USER:?}"; : "${KEY:?}"; : "${KH:?}"
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/k; chmod 600 ~/.ssh/k
          printf '%s\n' "$KH" > ~/.ssh/known_hosts; chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host nvx
            HostName $HOST
            User $USER
            Port ${PORT:-18765}
            IdentityFile ~/.ssh/k
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ConnectTimeout 20
          EOF
          chmod 600 ~/.ssh/config

      - name: Create proof only in expected staging root
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx "STAGING_ROOT='$STAGING_ROOT' PROOF_NAME='$PROOF_NAME' PROOF_CONTENT='$PROOF_CONTENT' bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$STAGING_ROOT"
          test "$(wp config get DB_NAME)" = 'dbshcocboodiwr'
          printf '%s' "$PROOF_CONTENT" > "$PROOF_NAME"
          test "$(cat "$PROOF_NAME")" = "$PROOF_CONTENT"
          echo "proof_created=$STAGING_ROOT/$PROOF_NAME"
          REMOTE

      - name: Prove public hostname serves expected root
        shell: bash
        run: |
          set -euo pipefail
          url="https://staging2.nuvanx.com/$PROOF_NAME"
          curl -sS --max-time 20 -A 'NUVANX-Staging-Boundary/1.0' -D /tmp/h -o /tmp/b "$url" -w 'status=%{http_code} final=%{url_effective} size=%{size_download}\n'
          grep -Ei '^(HTTP/|location:|server:|sg-captcha:|x-robots-tag:|x-redirect-by:|content-type:)' /tmp/h || true
          printf 'proof_body='; cat /tmp/b; echo
          status="$(awk 'toupper($1) ~ /^HTTP\// {s=$2} END {print s}' /tmp/h)"
          test "$status" = '200'
          test "$(cat /tmp/b)" = "$PROOF_CONTENT"
          echo 'VHOST_EXPECTED_ROOT=PASS'

      - name: Confirm five WordPress boundary routes
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            'https://staging2.nuvanx.com/' \
            'https://staging2.nuvanx.com/soluciones-medicas/' \
            'https://staging2.nuvanx.com/equipo-medico/' \
            'https://staging2.nuvanx.com/blog/' \
            'https://staging2.nuvanx.com/endolift-primeras-72-horas-que-esperar/'
          do
            curl -sS --max-time 20 -A 'NUVANX-Staging-Boundary/1.0' -D /tmp/h -o /tmp/b "$url" -w "url=$url status=%{http_code} final=%{url_effective}\n"
            status="$(awk 'toupper($1) ~ /^HTTP\// {s=$2} END {print s}' /tmp/h)"
            test "$status" = '200'
            ! grep -qi '^location: https://nuvanx.com' /tmp/h
            ! grep -qi '^sg-captcha:' /tmp/h
            grep -qi '^x-robots-tag:.*noindex' /tmp/h
            grep -qi '^x-robots-tag:.*nofollow' /tmp/h
          done
          echo 'PUBLIC_BOUNDARY=PASS'

      - name: Remove temporary proof
        if: always()
        shell: bash
        run: |
          ssh nvx "STAGING_ROOT='$STAGING_ROOT' PROOF_NAME='$PROOF_NAME' bash -se" <<'REMOTE' || true
          rm -f "$STAGING_ROOT/$PROOF_NAME"
          REMOTE

      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/k ~/.ssh/config ~/.ssh/known_hosts
