name: Run Inspector
run-name: Run Inspector · active canonical Staging

on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    if: ${{ github.head_ref == 'ops/inspect-active-staging-20260820' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: a80f476941bf3502ea498f7d93496c4e6c17b444
    steps:
      - name: Inspect canonical Staging workflow_dispatch runs
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow staging.yml --branch master --event workflow_dispatch --limit 20 --json databaseId,status,conclusion,headSha,createdAt,displayTitle,url)"
          jq -c --arg sha "$TARGET_SHA" '.[] | select(.headSha == $sha)' <<<"$runs"
          run_id="$(jq -r --arg sha "$TARGET_SHA" '[.[] | select(.headSha == $sha)] | sort_by(.databaseId) | last | .databaseId // empty' <<<"$runs")"
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo '::error::No matching Staging run'; exit 1; }
          echo "INSPECTED_STAGING_RUN_ID=$run_id"
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,headSha,createdAt,updatedAt,jobs,url | jq -c '.'
