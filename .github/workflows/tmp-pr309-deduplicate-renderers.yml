name: Deduplicate PR 309 renderers once

on:
  pull_request:
    branches:
      - master
    paths:
      - scripts/theme-hygiene/deduplicate-pr309-renderers-once.py

permissions:
  contents: write

jobs:
  refactor:
    if: github.event.pull_request.number == 309
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: refactor/sonar-legacy-duplication-phase2-20260731
          fetch-depth: 0
          persist-credentials: true

      - name: Consolidate canonical section markup
        run: python3 scripts/theme-hygiene/deduplicate-pr309-renderers-once.py

      - name: Validate refactor
        shell: bash
        run: |
          set -euo pipefail
          php -l wp-content/themes/nuvanx-medical/inc/nvx-page-render-helpers.php
          php -l wp-content/themes/nuvanx-medical/inc/nvx-endolift-page.php
          php -l wp-content/themes/nuvanx-medical/inc/nvx-endolaser-page.php
          php -l wp-content/themes/nuvanx-medical/inc/nvx-btl-detail-pages.php
          php scripts/theme-hygiene/test-page-render-helpers.php
          php scripts/theme-hygiene/test-catalog-json-contract.php
          php scripts/theme-hygiene/test-catalog-json-runtime-contract.php
          php scripts/theme-hygiene/test-catalog-review-contract.php
          node scripts/theme-hygiene/test-theme-hygiene.mjs
          test "$(grep -R "<section class=\"nvx-brand-section" -n \
            wp-content/themes/nuvanx-medical/inc/nvx-endolift-page.php \
            wp-content/themes/nuvanx-medical/inc/nvx-endolaser-page.php \
            wp-content/themes/nuvanx-medical/inc/nvx-btl-detail-pages.php | wc -l)" -le 3

      - name: Publish product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add \
            scripts/theme-hygiene/test-page-render-helpers.php \
            wp-content/themes/nuvanx-medical/inc/nvx-page-render-helpers.php \
            wp-content/themes/nuvanx-medical/inc/nvx-endolift-page.php \
            wp-content/themes/nuvanx-medical/inc/nvx-endolaser-page.php \
            wp-content/themes/nuvanx-medical/inc/nvx-btl-detail-pages.php
          git commit -m "refactor(render): remove canonical section duplication"
          git push origin HEAD:refactor/sonar-legacy-duplication-phase2-20260731
