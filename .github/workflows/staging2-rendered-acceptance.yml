name: Staging2 Rendered Acceptance

on:
  workflow_run:
    workflows:
      - Deploy Staging2
    types:
      - completed
    branches:
      - master
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Deployment SHA to verify'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: staging2-rendered-acceptance
  cancel-in-progress: false

jobs:
  verify:
    # Solo corre si el workflow de despliegue terminó en éxito
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://staging2.nuvanx.com
      EXPECTED_SHA: ${{ inputs.expected_sha || github.event.workflow_run.head_sha || github.sha }}
      # Forzar modo no interactivo en herramientas comunes
      CI: true
    steps:
      - name: Checkout canonical acceptance contract
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Validate expected SHA input
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(printf '%s' "$EXPECTED_SHA" | tr -d '[:space:]')"
          echo "EXPECTED_SHA=$EXPECTED_SHA" >> "$GITHUB_ENV"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'EXPECTED_SHA must be a full lowercase 40-character SHA.' >&2
            exit 1
          }

      - name: Bypass SiteGround edge via origin host
        shell: bash
        env:
          STAGING2_SSH_HOST: ${{ secrets.STAGING2_SSH_HOST }}
        run: |
          set -euo pipefail
          # Resolve origin IP from the SSH host (same machine serves the site)
          ORIGIN_IP=$(dig +short "$STAGING2_SSH_HOST" | grep -E '^[0-9]+\.' | tail -n1)
          if [[ -z "$ORIGIN_IP" ]]; then
            # SSH_HOST might already be an IP
            if [[ "$STAGING2_SSH_HOST" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              ORIGIN_IP="$STAGING2_SSH_HOST"
            else
              echo "::error::Cannot resolve origin IP from STAGING2_SSH_HOST"
              exit 1
            fi
          fi
          echo "$ORIGIN_IP staging2.nuvanx.com" | sudo tee -a /etc/hosts
          echo "Origin bypass configured: staging2.nuvanx.com → $ORIGIN_IP"

      - name: Verify origin connectivity
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl --max-time 15 -s -o /dev/null -w '%{http_code}' "$BASE_URL" || true)
          if [[ ! "$HTTP_CODE" =~ ^[23] ]]; then
            echo "::error::Origin server not responding. HTTP Code: ${HTTP_CODE:-none}"
            exit 1
          fi
          echo "Origin server verified — staging2 reachable directly. HTTP Code: $HTTP_CODE"

      - name: Install dependencies
        run: npm ci
        env:
          NODE_ENV: test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium



      - name: Verify rendered document, integrations and route consistency
        run: node scripts/staging2/browser-acceptance.mjs

      - name: Upload Browser Acceptance Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging2-browser-acceptance-artifacts
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
