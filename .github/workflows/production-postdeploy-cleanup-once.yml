name: Production Postdeploy Cleanup Once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/production-postdeploy-cleanup-once.yml

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROD_ROOT: /home/customer/www/nuvanx.com/public_html
      EXPECTED_SHA: 5cac0c0f9c3d9ef8fa9406208c5d9b8fd6fd7ef8
      FAILED_DIR: /home/customer/www/nuvanx.com/public_html/wp-content/themes/.nvx-prod-failed-31222581791-1
      RELEASE_DIR: /home/customer/www/nuvanx.com/public_html/wp-content/themes/.nvx-prod-release-5cac0c0f9c3d9ef8fa9406208c5d9b8fd6fd7ef8-31222581791-1
    steps:
      - name: Configure strict production SSH
        shell: bash
        env:
          HOST: ${{ secrets.PROD_SSH_HOST }}
          PORT: ${{ secrets.PROD_SSH_PORT }}
          USER: ${{ secrets.PROD_SSH_USER }}
          KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${HOST:?Missing PROD_SSH_HOST}"; : "${USER:?Missing PROD_SSH_USER}"; : "${KEY:?Missing PROD_SSH_PRIVATE_KEY}"; : "${KH:?Missing PROD_SSH_KNOWN_HOSTS}"
          SSH_PORT="${PORT:-18765}"
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/prod_key"; chmod 600 "$HOME/.ssh/prod_key"
          printf '%s\n' "$KH" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx-prod
            HostName $HOST
            User $USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/prod_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 20
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Remove only stale failed-attempt theme directories
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-prod "PROD_ROOT='$PROD_ROOT' EXPECTED_SHA='$EXPECTED_SHA' FAILED_DIR='$FAILED_DIR' RELEASE_DIR='$RELEASE_DIR' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          LIVE_THEME="$PROD_ROOT/wp-content/themes/nuvanx-medical"
          test -f "$LIVE_THEME/.nvx-deploy-sha"
          test "$(tr -d '\r\n' < "$LIVE_THEME/.nvx-deploy-sha")" = "$EXPECTED_SHA"
          cd "$PROD_ROOT"
          test "$(wp config get DB_NAME)" = 'db0ecrycwv2tgb'
          test "$(wp option get home)" = 'https://nuvanx.com'
          test "$(wp option get siteurl)" = 'https://nuvanx.com'
          test "$(wp option get blog_public)" = '1'
          test "$(wp theme list --status=active --field=name)" = 'nuvanx-medical'
          rm -rf -- "$FAILED_DIR" "$RELEASE_DIR"
          test ! -e "$FAILED_DIR"
          test ! -e "$RELEASE_DIR"
          if wp plugin is-installed sg-cachepress >/dev/null 2>&1; then
            if wp plugin is-active sg-cachepress >/dev/null 2>&1; then
              echo 'ERROR: Speed Optimizer unexpectedly active after production deploy' >&2
              exit 1
            fi
          fi
          echo "PRODUCTION_POSTDEPLOY_CLEANUP=PASS sha=$EXPECTED_SHA"
          REMOTE

      - name: Destroy SSH identity
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/prod_key" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"
