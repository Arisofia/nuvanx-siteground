name: Staging2 Media 1415 Diagnostic Once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/staging2-media-1415-diagnostic-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING_ROOT: /home/customer/www/staging2.nuvanx.com/public_html
      PROD_ROOT: /home/customer/www/nuvanx.com/public_html
      STAGING_URL: https://staging2.nuvanx.com
      PROD_URL: https://nuvanx.com
      EXPECTED_STAGING_SHA: d54dfa7df226dbd5b823fca1878ce8a60a3548cb
      EXPECTED_PROD_SHA: 4775310be2b7dcdda18f8fd6de8e40041c2eb555
    steps:
      - name: Configure strict SiteGround SSH
        shell: bash
        env:
          HOST: ${{ secrets.STAGING2_SSH_HOST }}
          PORT: ${{ secrets.STAGING2_SSH_PORT }}
          USER: ${{ secrets.STAGING2_SSH_USER }}
          KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${HOST:?Missing STAGING2_SSH_HOST}"
          : "${USER:?Missing STAGING2_SSH_USER}"
          : "${KEY:?Missing STAGING2_SSH_PRIVATE_KEY}"
          : "${KH:?Missing STAGING2_SSH_KNOWN_HOSTS}"
          SSH_PORT="${PORT:-18765}"
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/key"; chmod 600 "$HOME/.ssh/key"
          printf '%s\n' "$KH" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx-sg
            HostName $HOST
            User $USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 20
            ServerAliveInterval 30
            ServerAliveCountMax 2
          EOF
          chmod 600 "$HOME/.ssh/config"
          ssh nvx-sg "test -d '$STAGING_ROOT' && test -d '$PROD_ROOT' && command -v wp >/dev/null && command -v curl >/dev/null && command -v php >/dev/null"

      - name: Inspect attachment metadata and filesystem in staging
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-sg "STAGING_ROOT='$STAGING_ROOT' EXPECTED_SHA='$EXPECTED_STAGING_SHA' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$STAGING_ROOT"
          test "$(tr -d '\r\n' < wp-content/themes/nuvanx-medical/.nvx-deploy-sha)" = "$EXPECTED_SHA"
          test "$(wp config get DB_NAME)" = 'dbshcocboodiwr'
          echo '===== PAGE 1415 ====='
          wp post get 1415 --fields=ID,post_type,post_status,post_name,post_title --format=json
          echo '===== PAGE 1415 IMAGE REFERENCES ====='
          wp post get 1415 --field=post_content | grep -Eo 'https?://[^"'"'"' <>]+\.(webp|jpe?g|png)(\?[^"'"'"' <>]*)?' | sort -u || true

          echo '===== MEDIA COMMAND ====='
          if wp help media regenerate >/dev/null 2>&1; then
            echo 'WP_MEDIA_REGENERATE=AVAILABLE'
            wp help media regenerate | sed -n '1,120p'
          else
            echo 'WP_MEDIA_REGENERATE=UNAVAILABLE'
          fi
          echo '===== IMAGE EDITORS ====='
          wp eval '$e=wp_image_editor_supports(["methods"=>["resize"]]); echo "IMAGE_EDITOR_RESIZE=".($e?"YES":"NO")."\n"; $editors=_wp_image_editor_choose(); var_export($editors); echo "\n";'

          wp eval '
          global $wpdb;
          $bases = [
            "higiene-facial-con-microdermoabrasion",
            "diatermia-facial",
            "depilacion-laser",
            "hidrolipoclasia",
            "masajes-posoperatorios",
            "radiofrecuencia-corporal",
            "presoterapia",
            "tratamiento-anticelulitico",
            "casmara",
          ];
          $upload = wp_get_upload_dir();
          foreach ($bases as $base) {
            echo "===== BASE {$base} =====\n";
            $like = "%" . $wpdb->esc_like($base) . "%";
            $rows = $wpdb->get_results($wpdb->prepare(
              "SELECT p.ID,p.post_title,pm.meta_value AS attached FROM {$wpdb->posts} p JOIN {$wpdb->postmeta} pm ON pm.post_id=p.ID AND pm.meta_key=\"_wp_attached_file\" WHERE p.post_type=\"attachment\" AND pm.meta_value LIKE %s ORDER BY p.ID",
              $like
            ));
            if (!$rows) { echo "ATTACHMENT=NONE\n"; continue; }
            foreach ($rows as $r) {
              $id=(int)$r->ID; $attached=(string)$r->attached; $meta=wp_get_attachment_metadata($id);
              $original=trailingslashit($upload["basedir"]).ltrim($attached,"/");
              echo "ID={$id}\tATTACHED={$attached}\tORIGINAL_EXISTS=".(is_file($original)?"YES":"NO")."\tORIGINAL_BYTES=".(is_file($original)?filesize($original):0)."\n";
              echo "URL=".wp_get_attachment_url($id)."\n";
              if (is_array($meta)) {
                echo "META_FILE=".($meta["file"]??"")."\tWIDTH=".($meta["width"]??"")."\tHEIGHT=".($meta["height"]??"")."\n";
                foreach (($meta["sizes"]??[]) as $name=>$s) {
                  $dir=dirname($attached); if ($dir===".") $dir="";
                  $f=trailingslashit($upload["basedir"]).($dir?trailingslashit($dir):"").($s["file"]??"");
                  echo "SIZE={$name}\tFILE=".($s["file"]??"")."\tW=".($s["width"]??"")."\tH=".($s["height"]??"")."\tEXISTS=".(is_file($f)?"YES":"NO")."\tBYTES=".(is_file($f)?filesize($f):0)."\n";
                }
              } else { echo "METADATA=NONE\n"; }
            }
          }'
          REMOTE

      - name: Compare exact missing derivatives on staging and production
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-sg "STAGING_URL='$STAGING_URL' PROD_URL='$PROD_URL' PROD_ROOT='$PROD_ROOT' EXPECTED_PROD_SHA='$EXPECTED_PROD_SHA' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < "$PROD_ROOT/wp-content/themes/nuvanx-medical/.nvx-deploy-sha)" = "$EXPECTED_PROD_SHA"
          ua='NUVANX-Media-Diagnostic/1.0'
          files=(
            '2026/05/higiene-facial-con-microdermoabrasion-480x320.webp'
            '2026/05/higiene-facial-con-microdermoabrasion-300x200.webp'
            '2026/05/diatermia-facial-480x320.webp'
            '2026/05/diatermia-facial-300x200.webp'
            '2026/05/depilacion-laser-480x320.webp'
            '2026/05/depilacion-laser-300x200.webp'
            '2026/05/hidrolipoclasia-480x320.webp'
            '2026/05/hidrolipoclasia-300x200.webp'
            '2026/05/masajes-posoperatorios-480x320.webp'
            '2026/05/masajes-posoperatorios-300x200.webp'
            '2026/05/radiofrecuencia-corporal-480x320.webp'
            '2026/05/radiofrecuencia-corporal-300x200.webp'
            '2026/05/presoterapia-480x320.webp'
            '2026/05/presoterapia-300x200.webp'
            '2026/05/tratamiento-anticelulitico-480x320.webp'
            '2026/05/tratamiento-anticelulitico-300x200.webp'
            '2026/02/casmara-480x194.webp'
            '2026/02/casmara-300x121.webp'
          )
          for rel in "${files[@]}"; do
            s="$(curl -sS -o /dev/null -A "$ua" --max-time 20 -w '%{http_code}' "$STAGING_URL/wp-content/uploads/$rel" || true)"
            p="$(curl -sS -o /dev/null -A "$ua" --max-time 20 -w '%{http_code}' "$PROD_URL/wp-content/uploads/$rel" || true)"
            printf 'DERIVATIVE\t%s\tSTAGING=%s\tPROD=%s\n' "$rel" "$s" "$p"
          done
          REMOTE

      - name: Inspect production attachment metadata read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-sg "PROD_ROOT='$PROD_ROOT' EXPECTED_SHA='$EXPECTED_PROD_SHA' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$PROD_ROOT"
          test "$(tr -d '\r\n' < wp-content/themes/nuvanx-medical/.nvx-deploy-sha)" = "$EXPECTED_SHA"
          test "$(wp config get DB_NAME)" = 'db0ecrycwv2tgb'
          wp eval '
          global $wpdb;
          $bases=["higiene-facial-con-microdermoabrasion","diatermia-facial","depilacion-laser","hidrolipoclasia","masajes-posoperatorios","radiofrecuencia-corporal","presoterapia","tratamiento-anticelulitico","casmara"];
          $upload=wp_get_upload_dir();
          foreach($bases as $base){
            $like="%".$wpdb->esc_like($base)."%";
            $rows=$wpdb->get_results($wpdb->prepare("SELECT p.ID,pm.meta_value attached FROM {$wpdb->posts} p JOIN {$wpdb->postmeta} pm ON pm.post_id=p.ID AND pm.meta_key=\"_wp_attached_file\" WHERE p.post_type=\"attachment\" AND pm.meta_value LIKE %s ORDER BY p.ID",$like));
            echo "PROD_BASE={$base}\n";
            if(!$rows){echo "  ATTACHMENT=NONE\n";continue;}
            foreach($rows as $r){$id=(int)$r->ID;$attached=(string)$r->attached;$original=trailingslashit($upload["basedir"]).ltrim($attached,"/");$meta=wp_get_attachment_metadata($id);echo "  ID={$id} ATTACHED={$attached} ORIGINAL_EXISTS=".(is_file($original)?"YES":"NO")." SIZES=".(is_array($meta)?implode(",",array_keys($meta["sizes"]??[])):"NONE")."\n";}
          }'
          REMOTE

      - name: Destroy SSH identity
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/key" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"
