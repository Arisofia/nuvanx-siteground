name: Attribution QA One-Shot

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    name: Identify PR 599 preview run
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query recent pull_request_target runs only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: feat/attribution-contract-v2-secure-20260818
        run: |
          set -Eeuo pipefail
          tmp="$(mktemp)"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?event=pull_request_target&per_page=50" > "$tmp"
          jq -r --arg branch "$TARGET_BRANCH" '
            .workflow_runs[]
            | select(.created_at >= "2026-08-18T15:45:00Z")
            | [
                "RUN_ID=" + (.id|tostring),
                "status=" + (.status // ""),
                "conclusion=" + (.conclusion // ""),
                "head_branch=" + (.head_branch // ""),
                "head_sha=" + (.head_sha // ""),
                "event=" + (.event // ""),
                "title=" + ((.display_title // "") | gsub("[\r\n\t]"; " "))
              ] | join(" ")
          ' "$tmp" | head -n 20
          matches="$(jq --arg branch "$TARGET_BRANCH" '[.workflow_runs[] | select(.created_at >= "2026-08-18T15:45:00Z") | select(.head_branch == $branch or (.display_title // "" | contains("secure runtime contract v2")))] | length' "$tmp")"
          echo "PR599_PREVIEW_RUN_CANDIDATES=$matches"
          echo 'ACTIONS_RUN_READ=PASS mutation=0 secrets=0'
