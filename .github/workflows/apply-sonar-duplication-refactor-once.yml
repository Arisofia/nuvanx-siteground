name: Apply Sonar duplication refactor once

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/apply-sonar-duplication-refactor-once.yml'

permissions:
  contents: write

jobs:
  refactor:
    if: github.head_ref == 'refactor/sonar-duplication-20260731'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/sonar-duplication-20260731
          fetch-depth: 0

      - name: Apply behavior-preserving refactors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          ROOT = Path('.')

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path: str, value: str) -> None:
              (ROOT / path).write_text(value, encoding='utf-8')

          def insert_before_once(source: str, marker: str, insertion: str, label: str) -> str:
              if source.count(marker) != 1:
                  raise SystemExit(f'{label}: expected one marker, found {source.count(marker)}')
              return source.replace(marker, insertion + marker, 1)

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              if source.count(old) != 1:
                  raise SystemExit(f'{label}: expected one block, found {source.count(old)}')
              return source.replace(old, new, 1)

          def function_span(source: str, function_name: str) -> tuple[int, int]:
              marker = f'function {function_name}'
              start = source.find(marker)
              if start < 0:
                  raise SystemExit(f'missing function {function_name}')
              brace = source.find('{', start)
              if brace < 0:
                  raise SystemExit(f'missing opening brace for {function_name}')
              depth = 0
              quote = None
              escaped = False
              for index in range(brace, len(source)):
                  char = source[index]
                  if quote:
                      if escaped:
                          escaped = False
                      elif char == '\\':
                          escaped = True
                      elif char == quote:
                          quote = None
                      continue
                  if char in {'\'', '"'}:
                      quote = char
                      continue
                  if char == '{':
                      depth += 1
                  elif char == '}':
                      depth -= 1
                      if depth == 0:
                          return start, index + 1
              raise SystemExit(f'unbalanced function {function_name}')

          # 1. Structured data: compact repeated tariff and registry records.
          path = 'wp-content/themes/nuvanx-medical/inc/nvx-structured-data.php'
          source = read(path)
          source = insert_before_once(
              source,
              '/**\n * Official public PVP catalogue',
              """/** Build one immutable public tariff row. */
          function nvxTariffItem( string $label, float $pvp, string $group ): array {
              return compact( 'label', 'pvp', 'group' );
          }

          """,
              'structured tariff helper',
          )
          start, end = function_span(source, 'nvx_tariff_catalog')
          block = source[start:end]
          tariff_pattern = re.compile(
              r"(?P<indent>[ \t]*)'(?P<key>[^']+)'\s*=> array\(\n"
              r"(?P=indent)    'label'\s*=> (?P<label>[^\n]+),\n"
              r"(?P=indent)    'pvp'\s*=> (?P<pvp>\d+(?:\.\d+)?),\n"
              r"(?P=indent)    'group'\s*=> (?P<group>[^\n]+),\n"
              r"(?P=indent)\),"
          )
          block, count = tariff_pattern.subn(
              lambda match: (
                  f"{match.group('indent')}'{match.group('key')}' => nvxTariffItem( "
                  f"{match.group('label')}, {match.group('pvp')}, {match.group('group')} ),"
              ),
              block,
          )
          if count != 24:
              raise SystemExit(f'expected 24 tariff records, transformed {count}')
          source = source[:start] + block + source[end:]

          source = insert_before_once(
              source,
              'function nvx_schema_page_registry()',
              """/** Build one canonical route registry entry. */
          function nvxSchemaRouteEntry( int $id, string $path ): array {
              return compact( 'id', 'path' );
          }

          /** Build one canonical treatment registry entry. */
          function nvxSchemaTreatmentRegistryEntry( int $id, string $path, string $schema ): array {
              return compact( 'id', 'path', 'schema' );
          }

          """,
              'structured registry helpers',
          )
          start, end = function_span(source, 'nvx_schema_page_registry')
          block = source[start:end]
          treatment_pattern = re.compile(
              r"(?P<indent>[ \t]*)'(?P<key>[^']+)'\s*=> array\(\n"
              r"(?P=indent)    'id'\s*=> (?P<id>\d+),\n"
              r"(?P=indent)    'path'\s*=> (?P<path>'[^\n]+'),\n"
              r"(?P=indent)    'schema'\s*=> (?P<schema>'[^\n]+'),\n"
              r"(?P=indent)\),"
          )
          block, treatment_count = treatment_pattern.subn(
              lambda match: (
                  f"{match.group('indent')}'{match.group('key')}' => nvxSchemaTreatmentRegistryEntry( "
                  f"{match.group('id')}, {match.group('path')}, {match.group('schema')} ),"
              ),
              block,
          )
          route_pattern = re.compile(
              r"(?P<indent>[ \t]*)'(?P<key>[^']+)'\s*=> array\(\n"
              r"(?P=indent)    'id'\s*=> (?P<id>\d+),\n"
              r"(?P=indent)    'path'\s*=> (?P<path>'[^\n]+'),\n"
              r"(?P=indent)\),"
          )
          block, route_count = route_pattern.subn(
              lambda match: (
                  f"{match.group('indent')}'{match.group('key')}' => nvxSchemaRouteEntry( "
                  f"{match.group('id')}, {match.group('path')} ),"
              ),
              block,
          )
          if treatment_count != 9 or route_count != 3:
              raise SystemExit(f'registry records transformed treatments={treatment_count} routes={route_count}')
          source = source[:start] + block + source[end:]
          write(path, source)

          # 2. BTL governance: use one constructor for source/governed pairs.
          path = 'wp-content/themes/nuvanx-medical/inc/nvx-btl-clinical-governance.php'
          source = read(path)
          source = insert_before_once(
              source,
              '/**\n * Shared claim library',
              """/** Build one source-to-governed claim replacement. */
          function nvxBtlClaimPair( string $source, string $governed ): array {
              return compact( 'source', 'governed' );
          }

          """,
              'BTL claim helper',
          )
          start, end = function_span(source, 'nvx_btl_claim_library')
          block = source[start:end]
          claim_pattern = re.compile(
              r"(?P<indent>[ \t]*)'(?P<key>[^']+)'\s*=> array\(\n"
              r"(?P=indent)    'source'\s*=> (?P<source>[^\n]+),\n"
              r"(?P=indent)    'governed'\s*=> (?P<governed>[^\n]+),\n"
              r"(?P=indent)\),"
          )
          block, claim_count = claim_pattern.subn(
              lambda match: (
                  f"{match.group('indent')}'{match.group('key')}' => nvxBtlClaimPair( "
                  f"{match.group('source')}, {match.group('governed')} ),"
              ),
              block,
          )
          if claim_count < 20:
              raise SystemExit(f'expected at least 20 BTL claims, transformed {claim_count}')
          source = source[:start] + block + source[end:]
          write(path, source)

          # 3. Shared content presentation constructors and renderers.
          path = 'wp-content/themes/nuvanx-medical/inc/nvx-content-presentation.php'
          source = read(path)
          source = insert_before_once(
              source,
              '/**\n * Canonical site-wide closing conversion band',
              """/** Render the two dark-surface conversion links used by closing bands. */
          function nvxContentDarkActionLinksMarkup(
              string $valoracion,
              string $whatsapp,
              string $primary_class,
              string $secondary_class,
              string $primary_label,
              string $primary_id = ''
          ): string {
              $id_attribute = '' !== $primary_id ? ' id="' . esc_attr( $primary_id ) . '"' : '';
              return sprintf(
                  '<a class="%1$s"%2$s href="%3$s" data-nvx-valoracion-modal="1" aria-haspopup="dialog">%4$s</a>'
                  . '<a class="%5$s" href="%6$s" target="_blank" rel="noopener noreferrer">%7$s</a>',
                  esc_attr( $primary_class ),
                  $id_attribute,
                  esc_url( $valoracion ),
                  esc_html( $primary_label ),
                  esc_attr( $secondary_class ),
                  esc_url( $whatsapp ),
                  esc_html__( 'Contactar por WhatsApp', 'nuvanx-medical' )
              );
          }

          """,
              'content CTA helper',
          )
          source = insert_before_once(
              source,
              '/**\n * Clinical values pillars',
              """/** Build one icon-led content card. */
          function nvxContentCard( string $icon, string $title, string $body ): array {
              return compact( 'icon', 'title', 'body' );
          }

          /** Render icon-led cards using the supplied design-system classes. */
          function nvxContentCardsMarkup(
              array $items,
              string $article_class,
              string $icon_class,
              string $title_class,
              string $body_class
          ): string {
              $html = '';
              foreach ( $items as $item ) {
                  $html .= '<article class="' . esc_attr( $article_class ) . '">';
                  $html .= '<div class="' . esc_attr( $icon_class ) . '" aria-hidden="true">' . nvx_content_icon_svg( $item['icon'] ) . '</div>';
                  $html .= '<h3 class="' . esc_attr( $title_class ) . '">' . esc_html( $item['title'] ) . '</h3>';
                  $html .= '<p class="' . esc_attr( $body_class ) . '">' . esc_html( $item['body'] ) . '</p>';
                  $html .= '</article>';
              }
              return $html;
          }

          """,
              'content card helpers',
          )
          card_pattern = re.compile(
              r"(?P<indent>[ \t]*)array\(\n"
              r"(?P=indent)    'icon'\s*=> (?P<icon>[^\n]+),\n"
              r"(?P=indent)    'title'\s*=> (?P<title>[^\n]+),\n"
              r"(?P=indent)    'body'\s*=> (?P<body>[^\n]+),\n"
              r"(?P=indent)\),"
          )
          source, card_count = card_pattern.subn(
              lambda match: (
                  f"{match.group('indent')}nvxContentCard( {match.group('icon')}, "
                  f"{match.group('title')}, {match.group('body')} ),"
              ),
              source,
          )
          if card_count < 6:
              raise SystemExit(f'expected at least 6 content cards, transformed {card_count}')

          values_loop = """    foreach ( $items as $item ) {
              $html .= '<article class="nvx-value">';
              $html .= '<div class="nvx-value__icon" aria-hidden="true">' . nvx_content_icon_svg( $item['icon'] ) . '</div>';
              $html .= '<h3 class="nvx-value__title">' . esc_html( $item['title'] ) . '</h3>';
              $html .= '<p class="nvx-value__body">' . esc_html( $item['body'] ) . '</p>';
              $html .= '</article>';
          }
          """
          source = replace_once(
              source,
              values_loop,
              """    $html .= nvxContentCardsMarkup(
                  $items,
                  'nvx-value',
                  'nvx-value__icon',
                  'nvx-value__title',
                  'nvx-value__body'
              );
          """,
              'values renderer',
          )
          method_loop = """    foreach ( $items as $item ) {
              $html .= '<article class="nvx-method-col">';
              $html .= '<div class="nvx-method-col__icon" aria-hidden="true">' . nvx_content_icon_svg( $item['icon'] ) . '</div>';
              $html .= '<h3 class="nvx-method-col__title">' . esc_html( $item['title'] ) . '</h3>';
              $html .= '<p class="nvx-method-col__body">' . esc_html( $item['body'] ) . '</p>';
              $html .= '</article>';
          }
          """
          source = replace_once(
              source,
              method_loop,
              """    $html .= nvxContentCardsMarkup(
                  $items,
                  'nvx-method-col',
                  'nvx-method-col__icon',
                  'nvx-method-col__title',
                  'nvx-method-col__body'
              );
          """,
              'method renderer',
          )
          closing_links = """    $html .= sprintf(
              '<a class="nvx-btn nvx-btn--light nvx-open-valoracion-modal" id="nvx-footer-cta" href="%1$s" data-nvx-valoracion-modal="1" aria-haspopup="dialog">%2$s</a>',
              esc_url( $valoracion ),
              esc_html__( 'Iniciar mi valoración médica', 'nuvanx-medical' )
          );
          $html .= sprintf(
              '<a class="nvx-btn nvx-btn--secondary-on-dark" href="%1$s" target="_blank" rel="noopener noreferrer">%2$s</a>',
              esc_url( $whatsapp ),
              esc_html__( 'Contactar por WhatsApp', 'nuvanx-medical' )
          );
          """
          source = replace_once(
              source,
              closing_links,
              """    $html .= nvxContentDarkActionLinksMarkup(
                  $valoracion,
                  $whatsapp,
                  'nvx-btn nvx-btn--light nvx-open-valoracion-modal',
                  'nvx-btn nvx-btn--secondary-on-dark',
                  __( 'Iniciar mi valoración médica', 'nuvanx-medical' ),
                  'nvx-footer-cta'
              );
          """,
              'closing CTA links',
          )
          home_links = """    $html .= sprintf(
              '<a class="nvx-button nvx-button--light nvx-home-action-banner__cta nvx-open-valoracion-modal" href="%1$s" data-nvx-valoracion-modal="1" aria-haspopup="dialog">%2$s</a>',
              esc_url( $valoracion ),
                  esc_html__( 'Solicitar valoración médica', 'nuvanx-medical' )
          );
          $html .= sprintf(
              '<a class="nvx-button nvx-button--secondary-on-dark nvx-home-action-banner__cta" href="%1$s" target="_blank" rel="noopener noreferrer">%2$s</a>',
              esc_url( $whatsapp ),
              esc_html__( 'Contactar por WhatsApp', 'nuvanx-medical' )
          );
          """
          source = replace_once(
              source,
              home_links,
              """    $html .= nvxContentDarkActionLinksMarkup(
                  $valoracion,
                  $whatsapp,
                  'nvx-button nvx-button--light nvx-home-action-banner__cta nvx-open-valoracion-modal',
                  'nvx-button nvx-button--secondary-on-dark nvx-home-action-banner__cta',
                  __( 'Solicitar valoración médica', 'nuvanx-medical' )
              );
          """,
              'home CTA links',
          )
          write(path, source)

          # 4. Equipo: compact title/body records and centralize their list renderer.
          path = 'wp-content/themes/nuvanx-medical/inc/nvx-equipo-page.php'
          source = read(path)
          source = insert_before_once(
              source,
              'function nvx_equipo_director_authority_markup',
              """/** Build one editorial title/body item. */
          function nvxEquipoTextItem( string $title, string $body ): array {
              return compact( 'title', 'body' );
          }

          /** Render the shared editorial title/body grid list. */
          function nvxEquipoGridListMarkup( array $items ): string {
              $html = '';
              foreach ( $items as $item ) {
                  $html .= '<li class="nvx-editorial-grid-item">';
                  $html .= '<h3 class="nvx-editorial-grid-item__title">' . esc_html( $item['title'] ) . '</h3>';
                  $html .= '<p class="nvx-editorial-body">' . esc_html( $item['body'] ) . '</p>';
                  $html .= '</li>';
              }
              return $html;
          }

          """,
              'equipo helpers',
          )
          text_item_pattern = re.compile(
              r"(?P<indent>[ \t]*)array\(\n"
              r"(?P=indent)    'title'\s*=> (?P<title>[^\n]+),\n"
              r"(?P=indent)    'body'\s*=> (?P<body>[^\n]+),\n"
              r"(?P=indent)\),"
          )
          source, item_count = text_item_pattern.subn(
              lambda match: (
                  f"{match.group('indent')}nvxEquipoTextItem( {match.group('title')}, {match.group('body')} ),"
              ),
              source,
          )
          if item_count < 8:
              raise SystemExit(f'expected at least 8 equipo items, transformed {item_count}')
          grid_loop_pattern = re.compile(
              r"(?P<indent>[ \t]*)foreach \( \$(?P<collection>[A-Za-z_][A-Za-z0-9_]*) as \$(?P<item>[A-Za-z_][A-Za-z0-9_]*) \) \{\n"
              r"(?P=indent)    \$html \.= '<li class=\"nvx-editorial-grid-item\">';\n"
              r"(?P=indent)    \$html \.= '<h3 class=\"nvx-editorial-grid-item__title\">' \. esc_html\( \$(?P=item)\['title'\] \) \. '</h3>';\n"
              r"(?P=indent)    \$html \.= '<p class=\"nvx-editorial-body\">' \. esc_html\( \$(?P=item)\['body'\] \) \. '</p>';\n"
              r"(?P=indent)    \$html \.= '</li>';\n"
              r"(?P=indent)\}"
          )
          source, loop_count = grid_loop_pattern.subn(
              lambda match: f"{match.group('indent')}$html .= nvxEquipoGridListMarkup( ${match.group('collection')} );",
              source,
          )
          if loop_count < 2:
              raise SystemExit(f'expected at least 2 equipo grid loops, transformed {loop_count}')
          write(path, source)

          # 5. Navigation leaves: one constructor replaces repeated label/slug records.
          path = 'wp-content/themes/nuvanx-medical/inc/nvx-navigation-filters.php'
          source = read(path)
          source = insert_before_once(
              source,
              '/**\n * Defines the canonical fallback navigation structure',
              """/** Build one navigation node while omitting unused optional fields. */
          function nvxNavigationItem(
              string $label,
              array $slugs = array(),
              array $children = array(),
              bool $mega = false,
              string $url = ''
          ): array {
              $item = compact( 'label' );
              if ( array() !== $slugs ) {
                  $item['slugs'] = $slugs;
              }
              if ( array() !== $children ) {
                  $item['children'] = $children;
              }
              if ( $mega ) {
                  $item['mega'] = true;
              }
              if ( '' !== $url ) {
                  $item['url'] = $url;
              }
              return $item;
          }

          """,
              'navigation helper',
          )
          leaf_pattern = re.compile(
              r"array\( 'label' => (?P<label>.+?), 'slugs' => (?P<slugs>array\( [^\n]*? \)) \),"
          )
          source, leaf_count = leaf_pattern.subn(
              lambda match: f"nvxNavigationItem( {match.group('label')}, {match.group('slugs')} ),",
              source,
          )
          if leaf_count < 20:
              raise SystemExit(f'expected at least 20 navigation leaves, transformed {leaf_count}')
          write(path, source)

          # 6. Browser QA: reuse the canonical CDP transport and page configuration.
          common_path = 'scripts/staging2/visual-qa-common.mjs'
          common = read(common_path)
          common = replace_once(
              common,
              """  async evaluate(expression) {
              const result = await this.send('Runtime.evaluate', { expression, returnByValue: true, awaitPromise: true });
          """,
              """  waitFor(method, timeoutMilliseconds = 30000) {
              return new Promise((resolve, reject) => {
                let unsubscribe = () => {};
                const timer = setTimeout(() => {
                  unsubscribe();
                  reject(new Error(`CDP event timed out: ${method}`));
                }, timeoutMilliseconds);
                unsubscribe = this.on(method, (params) => {
                  clearTimeout(timer);
                  unsubscribe();
                  resolve(params || {});
                });
              });
            }

            async evaluate(expression, awaitPromise = true) {
              const result = await this.send('Runtime.evaluate', { expression, returnByValue: true, awaitPromise });
          """,
              'CDP wait/evaluate',
          )
          common = insert_before_once(
              common,
              'export async function pageState(session)',
              """export async function createConfiguredPageSession(
            port,
            viewport,
            {
              userAgent = DEFAULT_VISUAL_QA_USER_AGENT,
              acceptLanguage = 'es-ES,es;q=0.9,en;q=0.7',
            } = {},
          ) {
            const target = await createTarget(port);
            const session = new CDPSession(target.webSocketDebuggerUrl);
            await session.connect();
            await session.send('Page.enable');
            await session.send('Runtime.enable');
            await session.send('Network.enable');
            await session.send('Network.setUserAgentOverride', {
              userAgent,
              acceptLanguage,
              platform: viewport.mobile ? 'Android' : 'Windows',
            });
            await session.send('Emulation.setDeviceMetricsOverride', {
              width: viewport.width,
              height: viewport.height,
              deviceScaleFactor: 1,
              mobile: viewport.mobile,
              screenWidth: viewport.width,
              screenHeight: viewport.height,
            });
            return session;
          }

          """,
              'configured page session',
          )
          write(common_path, common)

          capture_path = 'scripts/staging2/capture-visual-qa.mjs'
          capture = read(capture_path)
          capture = insert_before_once(
              capture,
              "import { phasePageDefinitions } from './staging2-contract-common.mjs';\n",
              """import {
            sleep,
            safeName,
            locateChrome,
            CDPSession,
            waitForChrome,
            createTarget,
            closeSession,
            createConfiguredPageSession,
          } from './visual-qa-common.mjs';
          """,
              'capture common import',
          )
          capture = replace_once(
              capture,
              """const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
          const safeName = (value) => value.split('/').filter(Boolean).join('__') || 'home';

          """,
              '',
              'capture local primitives',
          )
          locate_start = capture.find('function locateChrome()')
          fetch_start = capture.find('async function fetchWithRetry', locate_start)
          if locate_start < 0 or fetch_start < 0:
              raise SystemExit('capture locateChrome block not found')
          capture = capture[:locate_start] + capture[fetch_start:]
          class_start = capture.find('class CDPSession')
          load_start = capture.find('async function loadPage', class_start)
          if class_start < 0 or load_start < 0:
              raise SystemExit('capture CDP utility block not found')
          capture = capture[:class_start] + capture[load_start:]
          capture_setup = """  const target = await createTarget(port);
            const session = new CDPSession(target.webSocketDebuggerUrl);
            await session.connect();
            await session.send('Page.enable');
            await session.send('Runtime.enable');
            await session.send('Network.enable');
            await session.send('Network.setUserAgentOverride', {
              userAgent,
              platform: viewport.mobile ? 'Android' : 'Windows',
            });
            await session.send('Emulation.setDeviceMetricsOverride', {
              width: viewport.width,
              height: viewport.height,
              deviceScaleFactor: 1,
              mobile: viewport.mobile,
              screenWidth: viewport.width,
              screenHeight: viewport.height,
            });
          """
          capture = replace_once(
              capture,
              capture_setup,
              """  const session = await createConfiguredPageSession(port, viewport, { userAgent });
          """,
              'capture session setup',
          )
          write(capture_path, capture)

          audit_path = 'scripts/staging2/audit-full-site-ui.mjs'
          audit = read(audit_path)
          audit = audit.replace('  CDPSession,\n', '')
          audit = audit.replace('  createTarget,\n', '')
          audit = replace_once(
              audit,
              '  closeSession,\n',
              '  closeSession,\n  createConfiguredPageSession,\n',
              'audit configured import',
          )
          audit_setup = """  const target = await createTarget(port);
            const session = new CDPSession(target.webSocketDebuggerUrl);
            await session.connect();
            await session.send('Page.enable');
            await session.send('Runtime.enable');
            await session.send('Network.enable');
            await session.send('Network.setUserAgentOverride', {
              userAgent,
              acceptLanguage: 'es-ES,es;q=0.9,en;q=0.7',
              platform: viewport.mobile ? 'Android' : 'Windows',
            });
            await session.send('Emulation.setDeviceMetricsOverride', {
              width: viewport.width,
              height: viewport.height,
              deviceScaleFactor: 1,
              mobile: viewport.mobile,
              screenWidth: viewport.width,
              screenHeight: viewport.height,
            });
          """
          audit = replace_once(
              audit,
              audit_setup,
              """  const session = await createConfiguredPageSession(port, viewport, { userAgent });
          """,
              'audit session setup',
          )
          write(audit_path, audit)
          PY

      - name: Validate transformed sources
        shell: bash
        run: |
          set -euo pipefail
          find wp-content/themes/nuvanx-medical -type f -name '*.php' -print0 | xargs -0 -n 1 php -l
          node --check scripts/staging2/visual-qa-common.mjs
          node --check scripts/staging2/capture-visual-qa.mjs
          node --check scripts/staging2/audit-full-site-ui.mjs
          php scripts/theme-hygiene/test-nvx-callable-contract.php
          node scripts/theme-hygiene/test-theme-hygiene.mjs
          node scripts/theme-hygiene/test-rest-pagination-contract.mjs
          git diff --check

      - name: Commit validated refactor and remove one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/sonar-duplication-audit-once.yml
          rm -f .github/workflows/apply-sonar-duplication-refactor-once.yml
          git config user.name 'NUVANX Quality Bot'
          git config user.email 'quality@nuvanx.com'
          git add wp-content/themes/nuvanx-medical/inc scripts/staging2 .github/workflows
          git diff --cached --check
          git commit -m 'refactor(quality): consolidate duplicated builders and QA transport'
          git push origin HEAD:refactor/sonar-duplication-20260731
