name: SiteGround DB Capability Probe

on:
  push:
    paths:
      - '.github/workflows/siteground-db-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure strict SSH
        shell: bash
        env:
          STAGING2_SSH_HOST: ${{ secrets.STAGING2_SSH_HOST }}
          STAGING2_SSH_PORT: ${{ secrets.STAGING2_SSH_PORT }}
          STAGING2_SSH_USER: ${{ secrets.STAGING2_SSH_USER }}
          STAGING2_SSH_PRIVATE_KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          STAGING2_SSH_KNOWN_HOSTS: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${STAGING2_SSH_HOST:?Missing STAGING2_SSH_HOST}"
          : "${STAGING2_SSH_USER:?Missing STAGING2_SSH_USER}"
          : "${STAGING2_SSH_PRIVATE_KEY:?Missing STAGING2_SSH_PRIVATE_KEY}"
          : "${STAGING2_SSH_KNOWN_HOSTS:?Missing STAGING2_SSH_KNOWN_HOSTS}"
          port="${STAGING2_SSH_PORT:-18765}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$STAGING2_SSH_PRIVATE_KEY" > "$HOME/.ssh/staging2_key"
          chmod 600 "$HOME/.ssh/staging2_key"
          printf '%s\n' "$STAGING2_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx-staging2-probe
            HostName $STAGING2_SSH_HOST
            User $STAGING2_SSH_USER
            Port $port
            IdentityFile $HOME/.ssh/staging2_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 20
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Probe account provisioning capabilities (read-only)
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-staging2-probe 'bash -se' <<'REMOTE'
          set -u
          STAGING_ROOT='/home/customer/www/staging2.nuvanx.com/public_html'
          PROD_ROOT='/home/customer/www/nuvanx.com/public_html'

          echo '=== filesystem / WordPress ==='
          echo "staging_root_exists=$(test -d "$STAGING_ROOT" && echo yes || echo no)"
          echo "prod_root_exists=$(test -d "$PROD_ROOT" && echo yes || echo no)"
          echo "roots_distinct=$(test "$STAGING_ROOT" != "$PROD_ROOT" && echo yes || echo no)"
          staging_db="$(cd "$STAGING_ROOT" && wp config get DB_NAME)"
          prod_db="$(cd "$PROD_ROOT" && wp config get DB_NAME)"
          echo "staging_db=$staging_db"
          echo "prod_db=$prod_db"
          echo "db_isolation=$(test "$staging_db" != "$prod_db" && echo PASS_distinct || echo FAIL_same)"
          echo "staging_siteurl=$(cd "$STAGING_ROOT" && wp option get siteurl)"
          echo "staging_home=$(cd "$STAGING_ROOT" && wp option get home)"
          echo "staging_blog_public=$(cd "$STAGING_ROOT" && wp option get blog_public)"

          echo '=== command availability ==='
          for cmd in wp mysql mysqldump mysqladmin php rsync siteground siteground-cli sg sgctl sitectl uapi whmapi1 cpapi2; do
            path="$(command -v "$cmd" 2>/dev/null || true)"
            if test -n "$path"; then
              echo "$cmd=yes:$path"
            else
              echo "$cmd=no"
            fi
          done

          echo '=== sg identity ==='
          sg_path="$(command -v sg 2>/dev/null || true)"
          if test -n "$sg_path"; then
            echo "sg_path=$sg_path"
            (sg --help 2>&1 || true) | head -n 8
          fi

          echo '=== provisioning-name scan ==='
          for dir in /usr/local/bin /usr/bin /opt/bin "$HOME/bin"; do
            test -d "$dir" || continue
            ls -1 "$dir" 2>/dev/null | grep -E '^(siteground|siteground-cli|sgctl|sitectl|uapi|whmapi1|cpapi2|mysqladmin)$' || true
          done

          echo '=== mysql privilege classification ==='
          grants="$(cd "$STAGING_ROOT" && wp db query 'SHOW GRANTS FOR CURRENT_USER' --skip-column-names 2>/dev/null || true)"
          if printf '%s\n' "$grants" | grep -Eq 'GRANT ALL PRIVILEGES ON \*\.\*|GRANT .*CREATE.* ON \*\.\*'; then
            echo 'global_create_database=LIKELY_YES'
          else
            echo 'global_create_database=NO_EVIDENCE'
          fi
          if printf '%s\n' "$grants" | grep -Eq 'GRANT ALL PRIVILEGES ON \*\.\*|GRANT .*CREATE USER.* ON \*\.\*'; then
            echo 'create_user=LIKELY_YES'
          else
            echo 'create_user=NO_EVIDENCE'
          fi
          if printf '%s\n' "$grants" | grep -Eq 'GRANT ALL PRIVILEGES ON'; then
            echo 'all_privileges_some_scope=yes'
          else
            echo 'all_privileges_some_scope=no'
          fi
          echo 'probe_mode=READ_ONLY'
          REMOTE

      - name: Destroy SSH material
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/staging2_key" "$HOME/.ssh/config" "$HOME/.ssh/known_hosts"
