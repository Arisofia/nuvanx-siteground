name: Production Gate & Atomic Deploy to SiteGround

# Production deployment is intentionally fail-closed until Block B is completed.
# There is no workflow_dispatch trigger, so agents/operators cannot launch this
# legacy production path from the Actions UI or dispatch API. Block B must first
# restore exact-SHA staging acceptance, strict SSH host verification and the
# production post-deploy gate before this job can be enabled.
on:
  workflow_call:
    inputs:
      sha:
        description: Commit SHA to deploy after Block B is enabled
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deploy-${{ inputs.sha }}
  cancel-in-progress: false

jobs:
  deploy-siteground:
    name: 🚫 Production deploy disabled until Block B
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment commit
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Checkout specific SHA
        run: |
          set -euo pipefail
          git checkout ${{ inputs.sha }}
          git log -1 --oneline

      - name: Production gate is intentionally fail-closed
        run: |
          set -euo pipefail
          echo 'Production deployment is disabled until Block B is completed.' >&2
          echo 'Required before enabling: exact staging accepted SHA, strict SSH known_hosts, atomic deploy and production post-validation.' >&2
          exit 1

      # Legacy deployment steps are retained below for Block B reconciliation,
      # but the job-level false guard above prevents any execution.
      - name: Configurar Clave SSH para SiteGround
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      - name: Añadir Host de SiteGround a Known Hosts with StrictHostKeyChecking
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          timeout 10 ssh-keyscan -p ${{ secrets.PROD_SSH_PORT || 18765 }} -H ${{ secrets.PROD_SSH_HOST }} >> ~/.ssh/known_hosts 2>&1 || {
            echo "Warning: ssh-keyscan failed, using StrictHostKeyChecking=no as fallback"
            echo "HostKeyChecking=no" > ~/.ssh/config
          }
          chmod 644 ~/.ssh/known_hosts

      - name: Upload theme to production server (temporary location)
        run: |
          ssh -p ${{ secrets.PROD_SSH_PORT || 18765 }} -o StrictHostKeyChecking=no \
            ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }} \
            "mkdir -p /tmp/nuvanx-medical-build"
          rsync -avz \
            -e "ssh -p ${{ secrets.PROD_SSH_PORT || 18765 }} -o StrictHostKeyChecking=no" \
            --exclude='.git*' \
            --exclude='.github*' \
            --exclude='node_modules*' \
            --exclude='tests*' \
            --exclude='playwright*' \
            --exclude='*.log' \
            ./wp-content/themes/nuvanx-medical/ \
            ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:/tmp/nuvanx-medical-build/

      - name: Upload deploy script to production server
        run: |
          scp -P ${{ secrets.PROD_SSH_PORT || 18765 }} -o StrictHostKeyChecking=no \
            tools/deploy/deploy-to-prod.sh \
            ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:/tmp/

      - name: Execute deployment using deploy-to-prod.sh script
        run: |
          ssh -p ${{ secrets.PROD_SSH_PORT || 18765 }} -o StrictHostKeyChecking=no \
            ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }} \
            "bash /tmp/deploy-to-prod.sh \
              --prod-root ${{ secrets.PROD_WP_PATH }} \
              --source-theme /tmp/nuvanx-medical-build \
              --sha ${{ inputs.sha }} \
              --confirm"

      - name: Cleanup temporary files
        run: |
          ssh -p ${{ secrets.PROD_SSH_PORT || 18765 }} -o StrictHostKeyChecking=no \
            ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }} \
            "rm -f /tmp/deploy-to-prod.sh && rm -rf /tmp/nuvanx-medical-build"
