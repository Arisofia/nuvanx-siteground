name: TEMP Apply Legacy HubSpot Attribution

on:
  push:
    branches:
      - automation/apply-legacy-attribution-20260808

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: automation/apply-legacy-attribution-20260808
          path: patchsrc
          persist-credentials: false

      - name: Checkout target branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/google-attribution-legacy-form-20260808
          path: target
          fetch-depth: 0
          persist-credentials: true

      - name: Apply and validate patch
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s/^legacy = r'''/legacy = '''/" patchsrc/scripts/tmp_apply_legacy_attribution.py
          python3 patchsrc/scripts/tmp_apply_legacy_attribution.py target
          node --check target/wp-content/themes/nuvanx-medical/assets/js/nvx-conversion-events.js
          node --check target/wp-content/themes/nuvanx-medical/assets/js/nvx-runtime-governance.js
          grep -Fq 'NUVANXGoogleAttributionLegacy' target/wp-content/themes/nuvanx-medical/assets/js/nvx-conversion-events.js
          grep -Fq 'onBeforeFormSubmit' target/wp-content/themes/nuvanx-medical/assets/js/nvx-runtime-governance.js
          grep -Fq 'forms/v2.js' target/wp-content/themes/nuvanx-medical/assets/js/nvx-runtime-governance.js
          if grep -Fq 'forms/embed/' target/wp-content/themes/nuvanx-medical/assets/js/nvx-runtime-governance.js; then
            echo 'Unexpected modern embed URL in target runtime.' >&2
            exit 1
          fi
          cd target
          git diff --check
          git diff --exit-code -- . ':!wp-content/themes/nuvanx-medical/assets/js/nvx-conversion-events.js' ':!wp-content/themes/nuvanx-medical/assets/js/nvx-runtime-governance.js'
          git config user.name 'NUVANX Release Automation'
          git config user.email 'admin@nuvanx.com'
          git add wp-content/themes/nuvanx-medical/assets/js/nvx-conversion-events.js wp-content/themes/nuvanx-medical/assets/js/nvx-runtime-governance.js
          git commit -m 'fix(attribution): support legacy HubSpot form callbacks'
          git push origin HEAD:fix/google-attribution-legacy-form-20260808
