name: TEMP Google Legacy Attribution E2E Final

on:
  push:
    branches:
      - audit/google-legacy-e2e-final-20260808

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/staging2/package-lock.json
      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          cd scripts/staging2
          npm ci --ignore-scripts
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Execute real legacy HubSpot attribution E2E on Staging2
        shell: bash
        env:
          BASE_URL: https://staging2.nuvanx.com
          FORM_ID: 5042522a-0bc5-4381-ac3e-5aee8649b69c
          EXPECTED_SHA: 4068dc277e7c24c0ebe78fe3a15c1c59499e883e
          QA_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cd scripts/staging2
          node google-legacy-attribution-e2e.mjs
