name: Patch cache workflow paths once

on:
  push:
    branches:
      - fix/audit-v3-final-cache-strictness-20260729
    paths:
      - '.github/workflows/patch-cache-workflow-paths-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/audit-v3-final-cache-strictness-20260729
          fetch-depth: 0

      - name: Patch aligned workflow contracts
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          for relative in (
              '.github/workflows/deploy-staging2.yml',
              '.github/workflows/full-site-ui-audit.yml',
          ):
              path = Path(relative)
              text = path.read_text(encoding='utf-8')
              path_anchor = "      - 'tools/deploy/deploy-to-staging2.sh'\n"
              path_marker = "      - 'tools/deploy/nvx-purge-wp-caches.sh'\n"
              if text.count(path_anchor) != 1:
                  raise SystemExit(f'{relative}: deploy path anchor is not unique')
              if path_marker not in text:
                  text = text.replace(path_anchor, path_anchor + path_marker, 1)

              lint_anchor = '          bash -n tools/deploy/deploy-to-staging2.sh\n'
              lint_marker = '          bash -n tools/deploy/nvx-purge-wp-caches.sh\n'
              if text.count(lint_anchor) != 1:
                  raise SystemExit(f'{relative}: shell lint anchor is not unique')
              if lint_marker not in text:
                  text = text.replace(lint_anchor, lint_anchor + lint_marker, 1)

              path.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/patch-cache-workflow-paths-once.yml
          git diff --check
          for workflow in .github/workflows/deploy-staging2.yml .github/workflows/full-site-ui-audit.yml; do
            grep -Fq "- 'tools/deploy/nvx-purge-wp-caches.sh'" "$workflow"
            grep -Fq 'bash -n tools/deploy/nvx-purge-wp-caches.sh' "$workflow"
          done

      - name: Commit bounded workflow update
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deploy-staging2.yml .github/workflows/full-site-ui-audit.yml .github/workflows/patch-cache-workflow-paths-once.yml
          git commit -m 'ci(staging2): deploy and audit strict cache helper changes'
          git push origin HEAD:fix/audit-v3-final-cache-strictness-20260729
