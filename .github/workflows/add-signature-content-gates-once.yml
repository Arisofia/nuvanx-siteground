name: Add Signature Content Gates Once

on:
  push:
    branches: [fix/blockc-signature-content-gates]
    paths:
      - .github/workflows/add-signature-content-gates-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/blockc-signature-content-gates
          persist-credentials: true
          fetch-depth: 0
      - name: Add exact route editorial assertions
        shell: bash
        run: |
          set -euo pipefail
          file='scripts/staging2/block-c-52x3.mjs'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/staging2/block-c-52x3.mjs')
          s=p.read_text('utf-8')
          needle="""        if (geometry.visibleSectionCount < 2 && geometry.mainTextLength < 400 && !shortContentRoutes.has(route)) issues.push(`Later sections may be missing; only ${geometry.visibleSectionCount} visible semantic sections and ${geometry.mainTextLength} chars`);\n"""
          if s.count(needle)!=1:
              raise SystemExit(f'Block C later-sections anchor changed: {s.count(needle)}')
          block=needle+'''        // QA-10: governed Signature hubs must render their complete canonical clinical body.\n        // Generic geometry previously allowed a hero-only CMS fallback to pass 156/156.\n        if (route === '/remodelacion-corporal-laser-madrid/' ||\n            route === '/tratamiento-postparto-abdomen-contorno-corporal-madrid/') {\n          const signatureText = (await page.locator('main#nvx-main, main, [role="main"]').first().innerText().catch(() => ''))\n            .replace(/\\s+/g, ' ')\n            .trim();\n          const signatureRequirements = route === '/remodelacion-corporal-laser-madrid/'\n            ? ['Cómo se decide el plan corporal', 'Zonas de valoración', 'Tu primera valoración clínica']\n            : ['Qué se valora en postparto', 'Límites y cuándo esperamos o derivamos', 'Rutas relacionadas', 'Tu primera valoración clínica'];\n          const minimumSections = route === '/remodelacion-corporal-laser-madrid/' ? 4 : 5;\n\n          for (const phrase of signatureRequirements) {\n            if (!signatureText.includes(phrase)) {\n              issues.push(`QA-10 Signature hub missing canonical section: ${phrase}`);\n            }\n          }\n          if (geometry.visibleSectionCount < minimumSections) {\n            issues.push(`QA-10 Signature hub too sparse (${geometry.visibleSectionCount} visible sections; expected at least ${minimumSections})`);\n          }\n          if (geometry.mainTextLength < 1800) {\n            issues.push(`QA-10 Signature hub copy unexpectedly thin (${geometry.mainTextLength} characters)`);\n          }\n          const canonicalValuationLinks = await page.locator('a[href*="/madrid/valoracion/"]').count();\n          const staleValuationLinks = await page.locator('a[href*="/valoracion-medica/"]').count();\n          if (canonicalValuationLinks < 1) {\n            issues.push('QA-10 Signature hub missing canonical /madrid/valoracion/ CTA');\n          }\n          if (staleValuationLinks > 0) {\n            issues.push(`QA-10 Signature hub still exposes ${staleValuationLinks} stale /valoracion-medica/ CTA(s)`);\n          }\n        }\n'''
          p.write_text(s.replace(needle,block,1),'utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = "$file"
          node --check "$file"
          grep -Fq 'QA-10 Signature hub missing canonical section' "$file"
          grep -Fq 'Cómo se decide el plan corporal' "$file"
          grep -Fq 'Qué se valora en postparto' "$file"
          grep -Fq 'a[href*="/madrid/valoracion/"]' "$file"
      - name: Commit QA tooling only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NUVANX Audit Controller'
          git config user.email 'audit-controller@nuvanx.invalid'
          git add scripts/staging2/block-c-52x3.mjs
          git diff --cached --check
          test "$(git diff --cached --name-only)" = 'scripts/staging2/block-c-52x3.mjs'
          git commit -m 'test(staging): require complete Signature hub content'
          git push origin HEAD:fix/blockc-signature-content-gates
