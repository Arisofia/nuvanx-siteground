name: Production Performance Audit

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to check out for the audit'
        required: false
        default: master

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout audit ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Run Lighthouse production matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p perf-results
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts --no-audit --no-fund lighthouse@12.8.2 >/dev/null 2>&1
          LH="./node_modules/.bin/lighthouse"
          "$LH" --version | tee perf-results/lighthouse-version.txt

          declare -A URLS=(
            [home]="https://nuvanx.com/"
            [endolift]="https://nuvanx.com/endolift-facial-papada-mandibula/"
            [endolaser]="https://nuvanx.com/endolaser-corporal-grasa-localizada/"
            [faciales]="https://nuvanx.com/medicina-estetica/"
            [valoracion]="https://nuvanx.com/madrid/valoracion/"
          )

          printf 'page\tmode\tperformance\tfcp_ms\tlcp_ms\ttbt_ms\tcls\tspeed_index_ms\tttfb_ms\ttotal_bytes\trequests\tdom_nodes\tunused_js_ms\tunused_css_ms\trender_blocking_ms\timage_savings_ms\n' > perf-results/summary.tsv

          for page in home endolift endolaser faciales valoracion; do
            url="${URLS[$page]}"
            for mode in mobile desktop; do
              out="perf-results/${page}-${mode}.json"
              extra=()
              if [[ "$mode" == "desktop" ]]; then extra+=(--preset=desktop); fi
              success=0
              for attempt in 1 2 3; do
                echo "AUDIT page=$page mode=$mode attempt=$attempt url=$url"
                if "$LH" "$url" \
                  --output=json \
                  --output-path="$out" \
                  --only-categories=performance \
                  --quiet \
                  --chrome-flags="--headless --disable-dev-shm-usage" \
                  "${extra[@]}"; then
                  score="$(jq -r '.categories.performance.score // empty' "$out")"
                  if [[ -n "$score" ]]; then success=1; break; fi
                fi
                sleep $((attempt * 5))
              done
              if [[ "$success" != "1" ]]; then
                # Soft-fail: record the failure and keep auditing the remaining
                # pages so a single run yields complete evidence.
                echo "LIGHTHOUSE_FAILED page=$page mode=$mode" >&2
                printf '%s\t%s\tFAILED\n' "$page" "$mode" >> perf-results/summary.tsv
                continue
              fi

              jq -r --arg page "$page" --arg mode "$mode" '[
                $page,
                $mode,
                ((.categories.performance.score // 0) * 100 | round),
                (.audits["first-contentful-paint"].numericValue // 0 | round),
                (.audits["largest-contentful-paint"].numericValue // 0 | round),
                (.audits["total-blocking-time"].numericValue // 0 | round),
                (.audits["cumulative-layout-shift"].numericValue // 0),
                (.audits["speed-index"].numericValue // 0 | round),
                (.audits["server-response-time"].numericValue // 0 | round),
                (.audits["total-byte-weight"].numericValue // 0 | round),
                (.audits["network-requests"].details.items | length),
                (.audits["dom-size"].numericValue // 0 | round),
                (.audits["unused-javascript"].details.overallSavingsMs // 0 | round),
                (.audits["unused-css-rules"].details.overallSavingsMs // 0 | round),
                (.audits["render-blocking-resources"].details.overallSavingsMs // .audits["render-blocking-insight"].details.overallSavingsMs // 0 | round),
                (.audits["uses-optimized-images"].details.overallSavingsMs // .audits["image-delivery-insight"].details.overallSavingsMs // 0 | round)
              ] | @tsv' "$out" >> perf-results/summary.tsv
            done
          done

          echo '=== LIGHTHOUSE SUMMARY ==='
          column -t -s $'\t' perf-results/summary.tsv || cat perf-results/summary.tsv

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-performance-audit-20260809
          path: perf-results/
          retention-days: 14
