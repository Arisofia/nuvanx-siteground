name: Code Quality (Lint)

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: ci-quality-${{ github.ref }}
  cancel-in-progress: true

# SonarCloud analysis runs via SonarCloud Automatic Analysis (the "SonarCloud Code
# Analysis" check), not a CI scanner job here: SonarCloud rejects CI-based analysis
# while Automatic Analysis is enabled ("Not authorized or project not found").
jobs:
  lint:
    name: PHP Syntax Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          tools: parallel-lint
      - name: Run PHP Parallel Lint
        run: |
          set -o pipefail
          set +e
          parallel-lint --exclude vendor --exclude node_modules . 2>&1 | tee ci-parallel-lint.txt
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "parallel-lint detected syntax errors (exit $STATUS). See ci-parallel-lint.txt"
            exit "$STATUS"
          fi
      - name: Upload parallel-lint output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parallel-lint-output
          path: ci-parallel-lint.txt

  custom-lints:
    name: Custom CSS/PHP Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Run color lint
        run: node scripts/lint/no-hardcoded-colors.mjs --strict
      - name: Run font-size lint
        run: node scripts/lint/no-hardcoded-fontsize.mjs
      - name: Run inline styles lint
        run: node scripts/lint/no-inline-layout-styles.mjs
      - name: Validate routes.json schema (guarded)
        run: |
          SCHEMA=wp-content/themes/nuvanx-medical/inc/data/routes.schema.json
          DATA=wp-content/themes/nuvanx-medical/inc/data/routes.json

          if [[ -f "$SCHEMA" && -f "$DATA" ]]; then
            node scripts/lint/validate-routes-schema.mjs "$SCHEMA" "$DATA"
          else
            echo "Skipping routes.json schema validation: schema or data file not found ($SCHEMA or $DATA)"
          fi

  phpcs:
    name: PHP_CodeSniffer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          tools: composer, phpcs
      - name: Install dependencies
        run: |
          cd wp-content/themes/nuvanx-medical
          composer install --no-interaction --no-progress --prefer-dist
      - name: Run PHP_CodeSniffer (strict full report)
        run: |
          set -o pipefail
          cd wp-content/themes/nuvanx-medical
          set +e
          ./vendor/bin/phpcs --standard=phpcs.xml.dist --report=full -s 2>&1 | tee ci-phpcs.txt
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "phpcs found coding standard violations (exit $STATUS). See ci-phpcs.txt"
            exit "$STATUS"
          fi
      - name: Upload PHPCS report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phpcs-report
          path: wp-content/themes/nuvanx-medical/ci-phpcs.txt

  phpstan:
    name: PHPStan Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          tools: composer, phpstan
      - name: Install dependencies
        run: |
          cd wp-content/themes/nuvanx-medical
          composer install --no-interaction --no-progress --prefer-dist
      - name: PHPStan info
        run: |
          cd wp-content/themes/nuvanx-medical
          ./vendor/bin/phpstan --version
          echo "Analyzing these files:"
          git ls-files -- . | sed -n '1,200p'
      - name: Run PHPStan (produce report artifact)
        run: |
          set -o pipefail
          cd wp-content/themes/nuvanx-medical
          ./vendor/bin/phpstan analyse --configuration=phpstan.neon --error-format=table --no-progress --memory-limit=1G | tee phpstan-report.txt
      - name: Upload PHPStan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phpstan-report
          path: wp-content/themes/nuvanx-medical/phpstan-report.txt
