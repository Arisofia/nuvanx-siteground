name: HubSpot Schema One-Shot

on:
  push:
    branches:
      - ops/hubspot-schema-once-20260818
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  apply_schema:
    name: Apply HubSpot schema v2 via versioned Forms API
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out validated provisioner candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 209301c8c5413188f1ff3a48a10400a0060d7df3
          fetch-depth: 1
          persist-credentials: false

      - name: Apply Schema Contract v2
        shell: bash
        env:
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          NUVANX_CONFIRM: yes
        run: |
          set -Eeuo pipefail
          bash -n scripts/ci/provision-hubspot-attribution-contract.sh
          bash scripts/ci/provision-hubspot-attribution-contract.sh --apply

      - name: Require clean idempotent post-check
        shell: bash
        env:
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
        run: |
          set -Eeuo pipefail
          bash scripts/ci/provision-hubspot-attribution-contract.sh --check
          echo 'HUBSPOT_SCHEMA_ONE_SHOT=PASS schema=v2 forms_api=2026-09-beta canonical_candidate=209301c8'
