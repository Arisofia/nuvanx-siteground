sonar.projectKey=Arisofia_nuvanx-siteground
sonar.organization=arisofia
sonar.projectName=NUVANX SiteGround
sonar.sourceEncoding=UTF-8

sonar.sources=wp-content,scripts,tools
# scripts/tmp_fix_legacy_attribution_review.py is a single-use, temporary release
# automation that has already been applied to the target branch. It is excluded
# from analysis and must be deleted once fix/google-attribution-legacy-form-v2-20260808
# is merged.
sonar.exclusions=**/node_modules/**,scripts/tmp_fix_legacy_attribution_review.py

# Quality Gate Configuration
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Coverage thresholds (blocking if not met)
sonar.coverage.exclusions=**/tests/**,**/vendor/**
sonar.php.coverage.reportPaths=coverage-report.xml

# Quality Gate thresholds
sonar.qualitygates=alert_status=FAILURE,new_coverage_threshold=60,new_duplicated_lines_density_threshold=3,block_on_critical=true

# WordPress PHP uses snake_case function names and tabs by convention.
# Sonar PHP stubs omit optional WordPress parameters (e.g. is_singular( $post_types )).
sonar.issue.ignore.multicriteria=wordpressFunctionNames,wordpressPhpTabs,wordpressOptionalArgs
sonar.issue.ignore.multicriteria.wordpressFunctionNames.ruleKey=php:S100
sonar.issue.ignore.multicriteria.wordpressFunctionNames.resourceKey=**/*.php
sonar.issue.ignore.multicriteria.wordpressPhpTabs.ruleKey=php:S105
sonar.issue.ignore.multicriteria.wordpressPhpTabs.resourceKey=**/*.php
sonar.issue.ignore.multicriteria.wordpressOptionalArgs.ruleKey=php:S930
sonar.issue.ignore.multicriteria.wordpressOptionalArgs.resourceKey=**/*.php
