name: Externalize legacy catalogs once

on:
  push:
    branches:
      - refactor/sonar-legacy-duplication-phase2-20260731
    paths:
      - .github/workflows/tmp-externalize-legacy-catalogs.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/sonar-legacy-duplication-phase2-20260731
          fetch-depth: 0
          persist-credentials: true

      - name: Externalize duplicated catalog data
        shell: bash
        run: |
          cat > /tmp/externalize-catalogs.php <<'PHP'
          <?php
          declare(strict_types=1);

          function __(string $text, ?string $domain = null): string {
              return '@nvx-i18n:' . base64_encode($text);
          }

          function home_url(string $path = ''): string {
              return '@nvx-home:' . base64_encode($path);
          }

          function nvx_btl_claim(string $key): string {
              return '@nvx-claim:' . base64_encode($key);
          }

          /** @return array{0:int,1:int,2:string} */
          function function_body(string $source, string $functionName): array {
              $tokens = token_get_all($source);
              $offsets = [];
              $offset = 0;
              foreach ($tokens as $index => $token) {
                  $offsets[$index] = $offset;
                  $offset += strlen(is_array($token) ? $token[1] : $token);
              }

              $count = count($tokens);
              for ($i = 0; $i < $count; $i++) {
                  $token = $tokens[$i];
                  if (!is_array($token) || $token[0] !== T_FUNCTION) {
                      continue;
                  }

                  $matched = false;
                  for ($j = $i + 1; $j < $count; $j++) {
                      $candidate = $tokens[$j];
                      if (is_array($candidate) && $candidate[0] === T_STRING) {
                          $matched = $candidate[1] === $functionName;
                          break;
                      }
                  }
                  if (!$matched) {
                      continue;
                  }

                  for (; $j < $count; $j++) {
                      if ($tokens[$j] !== '{') {
                          continue;
                      }

                      $bodyStart = $offsets[$j];
                      $depth = 0;
                      for ($k = $j; $k < $count; $k++) {
                          if ($tokens[$k] === '{') {
                              $depth++;
                          } elseif ($tokens[$k] === '}') {
                              $depth--;
                              if ($depth === 0) {
                                  $bodyEnd = $offsets[$k] + 1;
                                  return [$bodyStart, $bodyEnd, substr($source, $bodyStart, $bodyEnd - $bodyStart)];
                              }
                          }
                      }
                  }
              }

              throw new RuntimeException("Function not found: {$functionName}");
          }

          /** @return array<mixed> */
          function evaluate_body(string $body, string $functionName): array {
              $closure = eval('return static function() ' . $body . ';');
              if (!$closure instanceof Closure) {
                  throw new RuntimeException("Unable to evaluate {$functionName}");
              }
              $value = $closure();
              if (!is_array($value) || $value === []) {
                  throw new RuntimeException("{$functionName} did not return a non-empty array");
              }
              return $value;
          }

          function write_json(string $path, array $value): void {
              $json = json_encode(
                  $value,
                  JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR
              );
              if ($json === false) {
                  throw new RuntimeException("Unable to encode {$path}");
              }
              if (!is_dir(dirname($path)) && !mkdir(dirname($path), 0777, true) && !is_dir(dirname($path))) {
                  throw new RuntimeException("Unable to create " . dirname($path));
              }
              file_put_contents($path, $json . "\n");
          }

          $root = getcwd();
          $targets = [
              [
                  'path' => 'wp-content/themes/nuvanx-medical/inc/nvx-aesthetic-treatment-pages.php',
                  'function' => 'nvx_aesthetic_treatment_catalog',
                  'json' => 'aesthetic-treatment-pages.json',
                  'claims' => false,
              ],
              [
                  'path' => 'wp-content/themes/nuvanx-medical/inc/nvx-btl-detail-pages.php',
                  'function' => 'nvx_btl_detail_registry',
                  'json' => 'btl-detail-pages.json',
                  'claims' => true,
              ],
              [
                  'path' => 'wp-content/themes/nuvanx-medical/inc/nvx-faq-catalog.php',
                  'function' => 'nvx_get_faq_catalog',
                  'json' => 'faq-catalog.json',
                  'claims' => false,
              ],
              [
                  'path' => 'wp-content/themes/nuvanx-medical/inc/nvx-treatments-catalog.php',
                  'function' => 'nvx_treatments_catalog_data',
                  'json' => 'treatments-catalog.json',
                  'claims' => false,
              ],
          ];

          $loader = <<<'LOADER'
          <?php
          /**
           * Shared loader for large structured catalogs stored outside PHP source.
           *
           * @package nuvanx-medical
           */

          if ( ! defined( 'ABSPATH' ) ) {
              exit;
          }

          /**
           * Load and cache a JSON catalog from inc/data.
           *
           * @return array<mixed>
           */
          function nvx_catalog_json_load( string $filename ): array {
              static $catalogs = array();

              $safe_name = basename( $filename );
              if ( isset( $catalogs[ $safe_name ] ) ) {
                  return $catalogs[ $safe_name ];
              }

              $path = __DIR__ . '/data/' . $safe_name;
              if ( ! is_readable( $path ) ) {
                  return array();
              }

              $decoded = json_decode( (string) file_get_contents( $path ), true );
              if ( ! is_array( $decoded ) ) {
                  return array();
              }

              $catalogs[ $safe_name ] = $decoded;
              return $decoded;
          }

          /**
           * Transform catalog leaf values while preserving keys and nesting.
           *
           * @param mixed    $value Catalog value.
           * @param callable $transform String transformer.
           * @return mixed
           */
          function nvx_catalog_transform_values( $value, callable $transform ) {
              if ( is_array( $value ) ) {
                  foreach ( $value as $key => $item ) {
                      $value[ $key ] = nvx_catalog_transform_values( $item, $transform );
                  }
                  return $value;
              }

              return is_string( $value ) ? $transform( $value ) : $value;
          }

          /**
           * Resolve tokens captured from WordPress-aware catalog declarations.
           *
           * @param array<mixed>  $catalog Catalog data.
           * @param callable|null $claim_resolver Optional BTL claim resolver.
           * @return array<mixed>
           */
          function nvx_catalog_resolve_tokens( array $catalog, ?callable $claim_resolver = null ): array {
              return nvx_catalog_transform_values(
                  $catalog,
                  static function ( string $value ) use ( $claim_resolver ) {
                      $tokens = array(
                          '@nvx-i18n:' => static function ( string $payload ) {
                              return __( (string) base64_decode( $payload, true ), 'nuvanx-medical' );
                          },
                          '@nvx-home:' => static function ( string $payload ) {
                              return home_url( (string) base64_decode( $payload, true ) );
                          },
                      );

                      foreach ( $tokens as $prefix => $resolver ) {
                          if ( 0 === strpos( $value, $prefix ) ) {
                              return $resolver( substr( $value, strlen( $prefix ) ) );
                          }
                      }

                      if ( null !== $claim_resolver && 0 === strpos( $value, '@nvx-claim:' ) ) {
                          $claim_key = (string) base64_decode( substr( $value, 11 ), true );
                          return $claim_resolver( $claim_key );
                      }

                      return $value;
                  }
              );
          }
          LOADER;

          $loaderPath = $root . '/wp-content/themes/nuvanx-medical/inc/nvx-catalog-json.php';
          file_put_contents($loaderPath, $loader . "\n");

          foreach ($targets as $target) {
              $path = $root . '/' . $target['path'];
              $source = file_get_contents($path);
              if ($source === false) {
                  throw new RuntimeException("Unable to read {$target['path']}");
              }

              [$bodyStart, $bodyEnd, $body] = function_body($source, $target['function']);
              $catalog = evaluate_body($body, $target['function']);
              write_json(
                  $root . '/wp-content/themes/nuvanx-medical/inc/data/' . $target['json'],
                  $catalog
              );

              $resolver = $target['claims']
                  ? "static function ( string \$key ) { return nvx_btl_claim( \$key ); }"
                  : 'null';

              $replacement = "{\n"
                  . "\trequire_once __DIR__ . '/nvx-catalog-json.php';\n\n"
                  . "\treturn nvx_catalog_resolve_tokens(\n"
                  . "\t\tnvx_catalog_json_load( '" . $target['json'] . "' ),\n"
                  . "\t\t" . $resolver . "\n"
                  . "\t);\n"
                  . "}";

              $rewritten = substr($source, 0, $bodyStart)
                  . $replacement
                  . substr($source, $bodyEnd);
              file_put_contents($path, $rewritten);
          }

          foreach ($targets as $target) {
              $jsonPath = $root . '/wp-content/themes/nuvanx-medical/inc/data/' . $target['json'];
              $decoded = json_decode((string) file_get_contents($jsonPath), true, 512, JSON_THROW_ON_ERROR);
              if (!is_array($decoded) || $decoded === []) {
                  throw new RuntimeException("Invalid generated catalog: {$target['json']}");
              }
          }
          PHP

          php /tmp/externalize-catalogs.php

      - name: Add catalog contract test
        shell: bash
        run: |
          cat > scripts/theme-hygiene/test-catalog-json-contract.php <<'PHP'
          <?php
          declare(strict_types=1);

          $dataDir = dirname(__DIR__, 2) . '/wp-content/themes/nuvanx-medical/inc/data';
          $expectations = array(
              'aesthetic-treatment-pages.json' => array('lips_ha', 'rhinomodeling_ha', 'tear_trough_ha'),
              'btl-detail-pages.json' => array('exion-face', 'exion-body', 'exion-fractional', 'emfusion'),
              'faq-catalog.json' => array(0),
              'treatments-catalog.json' => array(0),
          );

          foreach ($expectations as $filename => $requiredKeys) {
              $path = $dataDir . '/' . $filename;
              if (!is_readable($path)) {
                  fwrite(STDERR, "Missing catalog: {$filename}\n");
                  exit(1);
              }

              $decoded = json_decode((string) file_get_contents($path), true, 512, JSON_THROW_ON_ERROR);
              if (!is_array($decoded) || $decoded === array()) {
                  fwrite(STDERR, "Empty catalog: {$filename}\n");
                  exit(1);
              }

              foreach ($requiredKeys as $key) {
                  if (!array_key_exists($key, $decoded)) {
                      fwrite(STDERR, "Missing key {$key} in {$filename}\n");
                      exit(1);
                  }
              }
          }

          echo "Catalog JSON contract passed.\n";
          PHP

      - name: Validate refactor
        shell: bash
        run: |
          set -euo pipefail
          php -l wp-content/themes/nuvanx-medical/inc/nvx-catalog-json.php
          php -l wp-content/themes/nuvanx-medical/inc/nvx-aesthetic-treatment-pages.php
          php -l wp-content/themes/nuvanx-medical/inc/nvx-btl-detail-pages.php
          php -l wp-content/themes/nuvanx-medical/inc/nvx-faq-catalog.php
          php -l wp-content/themes/nuvanx-medical/inc/nvx-treatments-catalog.php
          php scripts/theme-hygiene/test-catalog-json-contract.php
          node scripts/theme-hygiene/audit-v3.mjs

      - name: Commit refactor and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-externalize-legacy-catalogs.yml
          git add wp-content/themes/nuvanx-medical/inc/nvx-catalog-json.php \
                  wp-content/themes/nuvanx-medical/inc/data \
                  wp-content/themes/nuvanx-medical/inc/nvx-aesthetic-treatment-pages.php \
                  wp-content/themes/nuvanx-medical/inc/nvx-btl-detail-pages.php \
                  wp-content/themes/nuvanx-medical/inc/nvx-faq-catalog.php \
                  wp-content/themes/nuvanx-medical/inc/nvx-treatments-catalog.php \
                  scripts/theme-hygiene/test-catalog-json-contract.php
          git commit -m "refactor(quality): externalize duplicated catalog data"
          git push origin HEAD:refactor/sonar-legacy-duplication-phase2-20260731
