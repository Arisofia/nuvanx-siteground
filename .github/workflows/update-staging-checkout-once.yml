# One-time guarded update. Removed after the durable checkout pin commit.
name: Update Staging Checkout Once

on:
  pull_request:
    branches: [master]
    types: [synchronize]
    paths:
      - '.github/workflows/update-staging-checkout-once.yml'

permissions:
  contents: write

jobs:
  update-checkout:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/staging2-endolaser-cases-heroes-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Update staging workflow checkout runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/deploy-staging2.yml')
          old = 'actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4'
          new = 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1'
          content = path.read_text(encoding='utf-8')
          if content.count(old) != 2:
              raise SystemExit('deploy-staging2.yml: expected two legacy checkout references')
          path.write_text(content.replace(old, new), encoding='utf-8')
          PY

      - name: Validate and commit checkout update
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1' .github/workflows/deploy-staging2.yml
          ! grep -Fq 'actions/checkout@11d5960a326750d5838078e36cf38b85af677262' .github/workflows/deploy-staging2.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deploy-staging2.yml
          git commit -m 'chore(ci): move staging checkout to Node 24'
          git push origin "HEAD:${TARGET_BRANCH}"
