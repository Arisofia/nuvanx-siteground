name: Staging2 Route Parity Once

on:
  push:
    paths:
      - '.github/workflows/staging2-route-parity-once.yml'

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WP_ROOT: /home/customer/www/staging2.nuvanx.com/public_html
    steps:
      - name: Checkout registry
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: master
          persist-credentials: false

      - name: Configure strict SSH
        shell: bash
        env:
          HOST: ${{ secrets.STAGING2_SSH_HOST }}
          PORT: ${{ secrets.STAGING2_SSH_PORT }}
          USER: ${{ secrets.STAGING2_SSH_USER }}
          KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${HOST:?}"; : "${USER:?}"; : "${KEY:?}"; : "${KH:?}"
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/k"; chmod 600 "$HOME/.ssh/k"
          printf '%s\n' "$KH" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx
            HostName $HOST
            User $USER
            Port ${PORT:-18765}
            IdentityFile $HOME/.ssh/k
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 20
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Export published WordPress pages
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx "WP_ROOT='$WP_ROOT' bash -se" > /tmp/wp-pages.json <<'REMOTE'
          set -euo pipefail
          cd "$WP_ROOT"
          wp eval '
          $pages = get_pages(["post_status" => "publish", "sort_column" => "ID", "sort_order" => "ASC"]);
          $out = [];
          foreach ($pages as $p) {
            $url = get_permalink($p->ID);
            $path = wp_parse_url($url, PHP_URL_PATH);
            if (!$path) { $path = "/"; }
            if (substr($path, -1) !== "/") { $path .= "/"; }
            $out[] = [
              "id" => (int) $p->ID,
              "title" => html_entity_decode(get_the_title($p->ID), ENT_QUOTES | ENT_HTML5, "UTF-8"),
              "slug" => $p->post_name,
              "path" => $path,
              "template" => get_page_template_slug($p->ID) ?: "default"
            ];
          }
          echo wp_json_encode($out, JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE);
          '
          REMOTE
          test -s /tmp/wp-pages.json
          node -e "const p=JSON.parse(require('fs').readFileSync('/tmp/wp-pages.json','utf8')); console.log('published_pages='+p.length)"

      - name: Compare WordPress pages to routes registry
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const wp = JSON.parse(fs.readFileSync('/tmp/wp-pages.json','utf8'));
          const routes = JSON.parse(fs.readFileSync('wp-content/themes/nuvanx-medical/inc/data/routes.json','utf8'));
          const routeSet = new Set(Object.keys(routes));
          const pageSet = new Set(wp.map(p => p.path));
          const missing = wp.filter(p => !routeSet.has(p.path));
          const extra = Object.keys(routes).filter(r => !pageSet.has(r));
          console.log('ROUTES_JSON_COUNT='+routeSet.size);
          console.log('PUBLISHED_PAGE_COUNT='+wp.length);
          console.log('=== PUBLISHED PAGES MISSING FROM ROUTES.JSON ===');
          console.log(JSON.stringify(missing, null, 2));
          console.log('=== ROUTES.JSON ENTRIES NOT MATCHING A PUBLISHED PAGE PATH ===');
          console.log(JSON.stringify(extra, null, 2));
          fs.writeFileSync('/tmp/route-parity.json', JSON.stringify({routesCount:routeSet.size,publishedPagesCount:wp.length,missing,extra,pages:wp},null,2));
          NODE

      - name: Upload parity evidence
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: staging2-route-parity
          path: |
            /tmp/wp-pages.json
            /tmp/route-parity.json
          retention-days: 14
          if-no-files-found: error

      - name: Cleanup SSH
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/k" "$HOME/.ssh/config" "$HOME/.ssh/known_hosts"
