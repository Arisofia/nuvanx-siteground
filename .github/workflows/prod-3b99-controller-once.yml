name: Production 3b99 Controlled Deploy Once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/prod-3b99-controller-once.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: production-controlled-3b99fb57
  cancel-in-progress: false

jobs:
  gate:
    name: Block B read-only gate
    uses: ./.github/workflows/deploy.yml
    with:
      sha: 3b99fb5787d3b6f189503e82e20bf6b9e65e6c7e
    secrets:
      STAGING2_SSH_HOST: ${{ secrets.STAGING2_SSH_HOST }}
      STAGING2_SSH_PORT: ${{ secrets.STAGING2_SSH_PORT }}
      STAGING2_SSH_USER: ${{ secrets.STAGING2_SSH_USER }}
      STAGING2_SSH_PRIVATE_KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
      STAGING2_SSH_KNOWN_HOSTS: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
      PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
      PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}

  deploy:
    name: Authorized atomic production deploy + post-validation
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DEPLOY_SHA: 3b99fb5787d3b6f189503e82e20bf6b9e65e6c7e
      PROD_ROOT: /home/customer/www/nuvanx.com/public_html
      PROD_PARENT: /home/customer/www/nuvanx.com
      BASE_URL: https://nuvanx.com
      EXPECTED_HOST: nuvanx.com
    steps:
      - name: Check out hardened operational tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
          path: ops
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact accepted candidate payload
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3b99fb5787d3b6f189503e82e20bf6b9e65e6c7e
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact payload and tooling before mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$DEPLOY_SHA"
          git -C ops fetch --no-tags origin master
          git -C ops cat-file -e "${DEPLOY_SHA}^{commit}"
          git -C ops merge-base --is-ancestor "$DEPLOY_SHA" origin/master
          bash -n ops/tools/deploy/deploy-to-prod.sh
          node --check ops/scripts/production/verify-production-boundary.mjs
          node --check ops/scripts/production/verify-targeted-checks.mjs
          ! grep -Fq 'StrictHostKeyChecking=no' ops/.github/workflows/deploy.yml
          find candidate/wp-content/themes/nuvanx-medical -path '*/vendor' -prune -o -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null
          echo 'CONTROLLER_STATIC=PASS'

      - name: Configure strict production SSH authentication
        shell: bash
        env:
          HOST: ${{ secrets.PROD_SSH_HOST }}
          PORT: ${{ secrets.PROD_SSH_PORT }}
          USER: ${{ secrets.PROD_SSH_USER }}
          KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${HOST:?Missing PROD_SSH_HOST}"
          : "${USER:?Missing PROD_SSH_USER}"
          : "${KEY:?Missing PROD_SSH_PRIVATE_KEY}"
          : "${KH:?Missing PROD_SSH_KNOWN_HOSTS}"
          SSH_PORT="${PORT:-18765}"
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/prod_key"; chmod 600 "$HOME/.ssh/prod_key"
          printf '%s\n' "$KH" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx-prod
            HostName $HOST
            User $USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/prod_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 20
            ServerAliveInterval 30
            ServerAliveCountMax 2
          EOF
          chmod 600 "$HOME/.ssh/config"
          ssh nvx-prod "test -d '$PROD_ROOT' && test -f '$PROD_ROOT/wp-config.php' && command -v wp >/dev/null && command -v rsync >/dev/null && command -v php >/dev/null && command -v tar >/dev/null"

      - name: Verify production preflight before mutation
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-prod "PROD_ROOT='$PROD_ROOT' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$PROD_ROOT"
          test "$(wp config get DB_NAME)" = 'db0ecrycwv2tgb'
          test "$(wp option get home)" = 'https://nuvanx.com'
          test "$(wp option get siteurl)" = 'https://nuvanx.com'
          test "$(wp option get blog_public)" = '1'
          test "$(wp theme list --status=active --field=name)" = 'nuvanx-medical'
          for legacy_mu in nuvanx-valoracion-native-hubspot-form.php nuvanx-contacto-hubspot-form.php nvx-disable-public-facebook-pixel.php nuvanx-google-attribution.php; do
            test ! -e "$PROD_ROOT/wp-content/mu-plugins/$legacy_mu"
          done
          test ! -d "$PROD_ROOT/wp-content/mu-plugins/nuvanx-google-attribution"
          echo 'PRODUCTION_PREFLIGHT=PASS'
          REMOTE

      - name: Upload exact accepted theme and deploy script
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_RELEASE="$PROD_PARENT/.nvx-releases/${DEPLOY_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "REMOTE_RELEASE=$REMOTE_RELEASE" >> "$GITHUB_ENV"
          ssh nvx-prod "mkdir -p '$REMOTE_RELEASE/theme'"
          rsync -az --delete \
            --exclude='.git' --exclude='php_errorlog' --exclude='*.log' \
            --exclude='_archive*' --exclude='_disabled*' --exclude='*.bak*' \
            candidate/wp-content/themes/nuvanx-medical/ "nvx-prod:$REMOTE_RELEASE/theme/"
          rsync -az ops/tools/deploy/deploy-to-prod.sh "nvx-prod:$REMOTE_RELEASE/deploy-to-prod.sh"

      - name: Execute guarded production directory cutover
        id: cutover
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-prod "NVX_RUN_TOKEN='${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}' NUVANX_CONFIRM=yes bash '$REMOTE_RELEASE/deploy-to-prod.sh' --prod-root '$PROD_ROOT' --source-theme '$REMOTE_RELEASE/theme' --sha '$DEPLOY_SHA' --confirm"
          echo 'swapped=true' >> "$GITHUB_OUTPUT"

      - name: Verify production public boundary
        shell: bash
        run: |
          set -euo pipefail
          pass=0
          for attempt in {1..12}; do
            echo "Production boundary attempt ${attempt}/12"
            if BASE_URL="$BASE_URL" EXPECTED_HOST="$EXPECTED_HOST" EXPECTED_SHA="$DEPLOY_SHA" node ops/scripts/production/verify-production-boundary.mjs; then
              pass=1
              break
            fi
            sleep 10
          done
          test "$pass" = 1

      - name: Verify production exact SHA on disk
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-prod "PROD_ROOT='$PROD_ROOT' DEPLOY_SHA='$DEPLOY_SHA' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$PROD_ROOT"
          test "$(tr -d '\r\n' < wp-content/themes/nuvanx-medical/.nvx-deploy-sha)" = "$DEPLOY_SHA"
          test "$(wp config get DB_NAME)" = 'db0ecrycwv2tgb'
          test "$(wp option get home)" = 'https://nuvanx.com'
          test "$(wp option get siteurl)" = 'https://nuvanx.com'
          test "$(wp option get blog_public)" = '1'
          test "$(wp theme list --status=active --field=name)" = 'nuvanx-medical'
          echo "PRODUCTION_DEPLOYED_SHA=$DEPLOY_SHA"
          REMOTE

      - name: Set up Node.js for targeted browser checks
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ops/scripts/staging2/package-lock.json

      - name: Install targeted browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd ops/scripts/staging2
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Verify Equipo and Valoración in production
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="$BASE_URL" EXPECTED_SHA="$DEPLOY_SHA" node ops/scripts/production/verify-targeted-checks.mjs

      - name: Roll back production after failed external validation
        if: ${{ failure() && steps.cutover.outputs.swapped == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_TOKEN="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          BACKUP_DIR="$PROD_ROOT/wp-content/backups-nuvanx/pre-prod-${RUN_TOKEN}-${DEPLOY_SHA:0:12}"
          ssh nvx-prod "PROD_ROOT='$PROD_ROOT' RUN_TOKEN='$RUN_TOKEN' BACKUP_DIR='$BACKUP_DIR' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          THEMES_ROOT="$PROD_ROOT/wp-content/themes"
          LIVE_THEME="$THEMES_ROOT/nuvanx-medical"
          RESTORE_ROOT="$THEMES_ROOT/.nvx-postvalidate-restore-$RUN_TOKEN"
          FAILED_THEME="$THEMES_ROOT/.nvx-postvalidate-failed-$RUN_TOKEN"
          test -s "$BACKUP_DIR/theme.tgz"
          rm -rf "$RESTORE_ROOT" "$FAILED_THEME"
          mkdir -p "$RESTORE_ROOT"
          tar -xzf "$BACKUP_DIR/theme.tgz" -C "$RESTORE_ROOT"
          RESTORED_THEME="$RESTORE_ROOT/wp-content/themes/nuvanx-medical"
          test -d "$RESTORED_THEME"
          rescue() {
            rc=$?
            trap - ERR
            set +e
            if [[ ! -d "$LIVE_THEME" && -d "$FAILED_THEME" ]]; then
              mv "$FAILED_THEME" "$LIVE_THEME"
            fi
            exit "$rc"
          }
          trap rescue ERR
          mv "$LIVE_THEME" "$FAILED_THEME"
          mv "$RESTORED_THEME" "$LIVE_THEME"
          cd "$PROD_ROOT"
          wp cache flush || true
          activated=0
          if ! wp help sg >/dev/null 2>&1 && wp plugin is-installed sg-cachepress >/dev/null 2>&1; then
            if ! wp plugin is-active sg-cachepress >/dev/null 2>&1; then
              wp plugin activate sg-cachepress --quiet || true
              activated=1
            fi
          fi
          if wp help sg >/dev/null 2>&1; then wp sg purge || true; fi
          if [[ "$activated" -eq 1 ]]; then wp plugin deactivate sg-cachepress --quiet || true; fi
          wp eval 'if (function_exists("opcache_reset")) { opcache_reset(); }' || true
          expected="$(cat "$BACKUP_DIR/previous-sha.txt" 2>/dev/null || true)"
          if [[ -n "$expected" ]]; then
            test -f "$LIVE_THEME/.nvx-deploy-sha"
            actual="$(tr -d '\r\n' < "$LIVE_THEME/.nvx-deploy-sha")"
            test "$actual" = "$expected"
          fi
          test "$(wp config get DB_NAME)" = 'db0ecrycwv2tgb'
          test "$(wp option get home)" = 'https://nuvanx.com'
          test "$(wp option get siteurl)" = 'https://nuvanx.com'
          test "$(wp option get blog_public)" = '1'
          trap - ERR
          rm -rf "$FAILED_THEME" "$RESTORE_ROOT"
          echo "POST_VALIDATION_ROLLBACK=PASS previous_sha=${expected:-legacy-unmarked}"
          REMOTE

      - name: Upload production boundary evidence
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        with:
          name: production-boundary-3b99fb57-attempt-${{ github.run_attempt }}
          path: ops/scripts/production/artifacts/production-boundary.json
          retention-days: 14
          if-no-files-found: warn

      - name: Remove temporary production payload
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${REMOTE_RELEASE:-}" ]] && [[ -f "$HOME/.ssh/config" ]]; then
            ssh nvx-prod "rm -rf '$REMOTE_RELEASE'" || true
          fi

      - name: Destroy production SSH identity
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/prod_key" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"

      - name: Write production deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo '## Controlled production deployment PASS'
            echo
            echo "- Exact accepted SHA: \`$DEPLOY_SHA\`"
            echo '- Block B exact-SHA gate: PASS'
            echo '- Strict SSH host verification: PASS'
            echo '- Mandatory SQL/theme rollback snapshot: PASS'
            echo '- Atomic directory cutover: PASS'
            echo '- Public production boundary: PASS'
            echo '- Equipo Fran/Yolanda targeted geometry: PASS'
            echo '- Valoración HubSpot placement/live form: PASS'
          } >> "$GITHUB_STEP_SUMMARY"
