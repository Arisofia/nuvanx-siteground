name: Verify valoración CTA live

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'wp-content/themes/nuvanx-medical/header.php'
      - 'wp-content/themes/nuvanx-medical/assets/js/nvx-valoracion-page.js'
      - '.github/workflows/verify-valoracion-cta-live.yml'

permissions:
  contents: read

concurrency:
  group: verify-valoracion-cta-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/valoracion-cta-action-20260730' &&
      contains(github.event.pull_request.labels.*.name, 'deploy-staging2')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_URL: https://staging2.nuvanx.com
      WP_ROOT: /home/customer/www/staging2.nuvanx.com/public_html
    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - name: Configure strict SiteGround SSH
        env:
          SSH_HOST: ${{ secrets.STAGING2_SSH_HOST }}
          SSH_PORT_SECRET: ${{ secrets.STAGING2_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING2_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing STAGING2_SSH_HOST}"
          : "${SSH_USER:?Missing STAGING2_SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Missing STAGING2_SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing STAGING2_SSH_KNOWN_HOSTS}"
          SSH_PORT="${SSH_PORT_SECRET:-18765}"
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/staging2_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/staging2_key" "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx-staging2
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/staging2_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 15
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Wait for exact staging2 deployment
        run: |
          set -euo pipefail
          for attempt in $(seq 1 240); do
            deployed="$(ssh nvx-staging2 "test -r '$WP_ROOT/wp-content/themes/nuvanx-medical/.nvx-deploy-sha' && tr -d '\r\n' < '$WP_ROOT/wp-content/themes/nuvanx-medical/.nvx-deploy-sha' || true")"
            if [[ "$deployed" == "$EXPECTED_SHA" ]]; then
              echo "STAGING2_SHA_READY=$deployed"
              exit 0
            fi
            echo "waiting expected=$EXPECTED_SHA current=${deployed:-absent} attempt=$attempt"
            sleep 10
          done
          echo "Exact staging2 SHA was not deployed." >&2
          exit 1

      - name: Verify desktop and mobile CTA interaction
        run: |
          set -euo pipefail
          cat > /tmp/verify-valoracion-cta.mjs <<'NODE'
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { spawn } from 'node:child_process';

          const baseUrl = process.env.BASE_URL;
          const expectedSha = process.env.EXPECTED_SHA;
          const pageUrl = `${baseUrl}/madrid/valoracion/`;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          function chromePath() {
            for (const candidate of ['google-chrome-stable', 'google-chrome', 'chromium', 'chromium-browser']) {
              for (const directory of (process.env.PATH || '').split(path.delimiter)) {
                const full = path.join(directory, candidate);
                if (fs.existsSync(full)) return full;
              }
            }
            throw new Error('Chrome/Chromium is not installed.');
          }

          class CDP {
            constructor(url) { this.url = url; this.ws = null; this.id = 0; this.pending = new Map(); this.waiters = new Map(); }
            async connect() {
              this.ws = new WebSocket(this.url);
              await new Promise((resolve, reject) => {
                const timer = setTimeout(() => reject(new Error('CDP connection timeout')), 10000);
                this.ws.addEventListener('open', () => { clearTimeout(timer); resolve(); }, { once: true });
                this.ws.addEventListener('error', () => { clearTimeout(timer); reject(new Error('CDP connection failed')); }, { once: true });
              });
              this.ws.addEventListener('message', (event) => this.message(event));
            }
            message(event) {
              const data = JSON.parse(String(event.data));
              if (data.id && this.pending.has(data.id)) {
                const item = this.pending.get(data.id); clearTimeout(item.timer); this.pending.delete(data.id);
                data.error ? item.reject(new Error(data.error.message)) : item.resolve(data.result || {}); return;
              }
              if (data.method && this.waiters.has(data.method)) {
                const queue = this.waiters.get(data.method); const item = queue.shift();
                if (!queue.length) this.waiters.delete(data.method); clearTimeout(item.timer); item.resolve(data.params || {});
              }
            }
            send(method, params = {}, timeout = 30000) {
              const id = ++this.id;
              return new Promise((resolve, reject) => {
                const timer = setTimeout(() => { this.pending.delete(id); reject(new Error(`CDP timeout: ${method}`)); }, timeout);
                this.pending.set(id, { resolve, reject, timer });
                this.ws.send(JSON.stringify({ id, method, params }));
              });
            }
            wait(method, timeout = 30000) {
              return new Promise((resolve, reject) => {
                const timer = setTimeout(() => reject(new Error(`CDP event timeout: ${method}`)), timeout);
                const queue = this.waiters.get(method) || []; queue.push({ resolve, reject, timer }); this.waiters.set(method, queue);
              });
            }
            async eval(expression) {
              const result = await this.send('Runtime.evaluate', { expression, returnByValue: true, awaitPromise: true });
              if (result.exceptionDetails) throw new Error(result.exceptionDetails.text || 'Browser evaluation failed');
              return result.result?.value;
            }
          }

          async function waitChrome(port) {
            for (let i = 0; i < 80; i += 1) {
              try { if ((await fetch(`http://127.0.0.1:${port}/json/version`)).ok) return; } catch {}
              await sleep(250);
            }
            throw new Error('Chrome endpoint unavailable.');
          }

          async function session(port) {
            const target = await (await fetch(`http://127.0.0.1:${port}/json/new?about%3Ablank`, { method: 'PUT' })).json();
            const cdp = new CDP(target.webSocketDebuggerUrl); await cdp.connect();
            await cdp.send('Page.enable'); await cdp.send('Runtime.enable'); await cdp.send('Network.enable');
            return cdp;
          }

          async function navigate(cdp, viewport) {
            await cdp.send('Emulation.setDeviceMetricsOverride', {
              width: viewport.width, height: viewport.height, deviceScaleFactor: 1,
              mobile: viewport.mobile, screenWidth: viewport.width, screenHeight: viewport.height,
            });
            const loaded = cdp.wait('Page.loadEventFired');
            const nav = await cdp.send('Page.navigate', { url: pageUrl });
            if (nav.errorText) throw new Error(nav.errorText);
            await loaded; await sleep(1200);
            const sha = await cdp.eval(`document.querySelector('meta[name="nvx-deploy-sha"]')?.content || ''`);
            if (sha !== expectedSha) throw new Error(`served SHA ${sha || 'absent'} instead of ${expectedSha}`);
          }

          function validateState(name, state) {
            const errors = [];
            if (state.href !== '#nvx-hubspot-form') errors.push(`href=${state.href}`);
            if (state.modalFlag !== '0') errors.push(`data-modal=${state.modalFlag}`);
            if (state.hasPopup !== null) errors.push(`aria-haspopup=${state.hasPopup}`);
            if (state.modalPresent) errors.push('modal unexpectedly present');
            if (state.scrollY < 100) errors.push(`scrollY=${state.scrollY}`);
            if (Math.abs(state.formTop) > 220) errors.push(`formTop=${state.formTop}`);
            if (errors.length) throw new Error(`${name}: ${errors.join(', ')}`);
          }

          const port = 9400 + crypto.randomInt(0, 300);
          const profile = fs.mkdtempSync(path.join(os.tmpdir(), 'nvx-cta-'));
          const chrome = spawn(chromePath(), [
            '--headless=new', '--no-sandbox', '--disable-dev-shm-usage', '--disable-gpu',
            `--remote-debugging-port=${port}`, `--user-data-dir=${profile}`, 'about:blank',
          ], { stdio: ['ignore', 'ignore', 'inherit'] });

          try {
            await waitChrome(port);

            const desktop = await session(port);
            await navigate(desktop, { width: 1440, height: 1000, mobile: false });
            const desktopState = await desktop.eval(`new Promise((resolve) => {
              const trigger = document.getElementById('nvx-header-cta');
              const initial = {
                href: trigger?.getAttribute('href') || '',
                modalFlag: trigger?.dataset.nvxValoracionModal || '',
                hasPopup: trigger?.getAttribute('aria-haspopup'),
                modalPresent: !!document.getElementById('nvx-valoracion-modal'),
              };
              trigger?.click();
              setTimeout(() => {
                const form = document.getElementById('nvx-hubspot-form');
                resolve({ ...initial, scrollY: window.scrollY, formTop: Math.round(form?.getBoundingClientRect().top || 9999) });
              }, 1000);
            })`);
            validateState('desktop', desktopState);
            await desktop.send('Page.close'); desktop.ws.close();

            const mobile = await session(port);
            await navigate(mobile, { width: 390, height: 844, mobile: true });
            const mobileState = await mobile.eval(`new Promise((resolve) => {
              document.getElementById('nvx-hamburger-btn')?.click();
              setTimeout(() => {
                const trigger = document.getElementById('nvx-mobile-cta');
                const initial = {
                  href: trigger?.getAttribute('href') || '',
                  modalFlag: trigger?.dataset.nvxValoracionModal || '',
                  hasPopup: trigger?.getAttribute('aria-haspopup'),
                  modalPresent: !!document.getElementById('nvx-valoracion-modal'),
                };
                trigger?.click();
                setTimeout(() => {
                  const form = document.getElementById('nvx-hubspot-form');
                  const nav = document.getElementById('nvx-mobile-nav');
                  resolve({
                    ...initial,
                    scrollY: window.scrollY,
                    formTop: Math.round(form?.getBoundingClientRect().top || 9999),
                    navOpen: !!nav?.classList.contains('is-open'),
                    navHidden: nav?.getAttribute('aria-hidden'),
                    hamburgerExpanded: document.getElementById('nvx-hamburger-btn')?.getAttribute('aria-expanded'),
                    bodyOverflow: document.body.style.overflow,
                  });
                }, 1000);
              }, 300);
            })`);
            validateState('mobile', mobileState);
            if (mobileState.navOpen || mobileState.navHidden !== 'true' || mobileState.hamburgerExpanded !== 'false' || mobileState.bodyOverflow === 'hidden') {
              throw new Error(`mobile drawer did not close: ${JSON.stringify(mobileState)}`);
            }
            await mobile.send('Page.close'); mobile.ws.close();

            console.log(`VALORACION_CTA_LIVE_OK sha=${expectedSha}`);
          } finally {
            chrome.kill('SIGTERM');
            await sleep(250);
            fs.rmSync(profile, { recursive: true, force: true });
          }
          NODE
          node /tmp/verify-valoracion-cta.mjs
