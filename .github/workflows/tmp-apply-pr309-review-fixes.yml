name: Apply PR 309 review fixes once

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/tmp-apply-pr309-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.number == 309
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: refactor/sonar-legacy-duplication-phase2-20260731
          fetch-depth: 0
          persist-credentials: true

      - name: Normalize concurrent review input
        run: python3 scripts/theme-hygiene/normalize-pr309-review-inputs-once.py

      - name: Apply reviewed product transformations
        run: python3 scripts/theme-hygiene/apply-pr309-review-fixes-once.py

      - name: Remove workflow-scope writes from publisher
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/theme-hygiene/apply-pr309-review-contracts-once.sh')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              "git rm .github/workflows/tmp-apply-pr309-review-fixes.yml\n",
              '',
          )
          source = source.replace(
              "git rm scripts/theme-hygiene/apply-pr309-review-contracts-once.sh\n",
              "git rm -f scripts/theme-hygiene/apply-pr309-review-contracts-once.sh\n"
              "git rm scripts/theme-hygiene/normalize-pr309-review-inputs-once.py\n",
          )
          source = source.replace(
              "git add .github/workflows/theme-hygiene-gate.yml \\\n        ",
              "git add ",
          )
          path.write_text(source, encoding='utf-8')
          PY

      - name: Add contracts, validate and publish product changes
        run: bash scripts/theme-hygiene/apply-pr309-review-contracts-once.sh
