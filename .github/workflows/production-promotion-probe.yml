name: Production Promotion Probe
run-name: Production Promotion Probe · 337127ab

on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  actions: write

jobs:
  promote:
    if: ${{ github.head_ref == 'release/promote-after-staging-337127ab' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: 337127ab79d3da8b49f471ecf5ba6bd6965b55c2
    steps:
      - name: Checkout trusted master release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Wait for immutable Staging acceptance
        shell: bash
        run: |
          set -euo pipefail
          export CANDIDATE_SHA="$RELEASE_SHA"
          for attempt in $(seq 1 120); do
            if bash scripts/ci/verify-staging-acceptance.sh; then
              echo "STAGING_ACCEPTANCE=PASS sha=$RELEASE_SHA"
              exit 0
            fi
            sleep 15
          done
          echo "::error::No valid Staging acceptance artifact for $RELEASE_SHA"
          exit 1

      - name: Require unchanged current master
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin master
          current="$(git rev-parse origin/master)"
          test "$current" = "$RELEASE_SHA" || { echo "::error::master advanced release=$RELEASE_SHA current=$current"; exit 1; }
          echo "PRODUCTION_FRESHNESS=PASS sha=$RELEASE_SHA"

      - name: Dispatch canonical Production
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail
          before="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow production.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run production.yml --repo "$GITHUB_REPOSITORY" --ref master \
            -f deploy=true \
            -f candidate_sha="$RELEASE_SHA" \
            -f release_mode=release \
            -f run_post_audits=true \
            -f run_performance=true \
            -f run_hubspot_e2e=true \
            -f run_final_close_audit=true \
            -f run_mu_plugin_forensics=true
          child=''
          for attempt in $(seq 1 60); do
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow production.yml --branch master --event workflow_dispatch --limit 30 --json databaseId,headSha)"
            child="$(jq -r --argjson before "$before" --arg sha "$RELEASE_SHA" '[.[] | select(.databaseId > $before and .headSha == $sha)] | sort_by(.databaseId) | last | .databaseId // empty' <<<"$runs")"
            [[ -n "$child" ]] && break
            sleep 2
          done
          [[ "$child" =~ ^[0-9]+$ ]] || { echo '::error::Production run not found'; exit 1; }
          echo "run_id=$child" >> "$GITHUB_OUTPUT"
          echo "PRODUCTION_DISPATCH=PASS run_id=$child sha=$RELEASE_SHA"

      - name: Require Production success
        shell: bash
        env:
          PRODUCTION_RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set -euo pipefail
          gh run watch "$PRODUCTION_RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status
          echo "PRODUCTION_RELEASE=PASS run_id=$PRODUCTION_RUN_ID sha=$RELEASE_SHA"
