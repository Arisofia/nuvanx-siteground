name: Fix Reported Layout Once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/fix-reported-layout-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true
      - name: Patch equipo staff layout and strengthen regression contract
        shell: bash
        run: |
          set -euo pipefail
          css='wp-content/themes/nuvanx-medical/assets/css/nvx-components.css'
          marker='NVX reported equipo staff grid fix 2026-08-08'
          if ! grep -Fq "$marker" "$css"; then
            cat >> "$css" <<'CSS'

/* NVX reported equipo staff grid fix 2026-08-08
 * The CMS emits .nvx-equipo-staff-grid without .nvx-brand-grid. Team cards
 * already carry 12-column spans, so a block parent makes portrait media expand
 * to the entire shell (≈1238×1486 at desktop). Restore the intended grid. */
.nvx-equipo-staff-grid {
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  gap: var(--nvx-gap-base);
  align-items: start;
  width: 100%;
  min-width: 0;
}

.nvx-equipo-staff-grid > .nvx-brand-card--team {
  grid-column: span 4;
  min-width: 0;
}

.nvx-equipo-staff-grid .nvx-brand-card__media--portrait {
  width: 100%;
  aspect-ratio: 5 / 6;
  overflow: hidden;
}

.nvx-equipo-staff-grid .nvx-brand-card__media--portrait > img.nvx-media--doctor {
  width: 100%;
  height: 100%;
  min-height: 0;
  max-height: 560px;
  aspect-ratio: 5 / 6;
  object-fit: cover;
  object-position: center top;
}

@media (min-width: 981px) {
  .nvx-equipo-staff-grid > .nvx-brand-card--team:nth-child(1) {
    grid-column: 3 / span 4;
  }
  .nvx-equipo-staff-grid > .nvx-brand-card--team:nth-child(2) {
    grid-column: 7 / span 4;
  }
}

@media (max-width: 980px) {
  .nvx-equipo-staff-grid > .nvx-brand-card--team {
    grid-column: span 6;
  }
}

@media (max-width: 640px) {
  .nvx-equipo-staff-grid > .nvx-brand-card--team {
    grid-column: 1 / -1;
  }
  .nvx-equipo-staff-grid .nvx-brand-card__media--portrait > img.nvx-media--doctor {
    max-height: none;
  }
}
CSS
          fi

          # Static invariants: team grid exists and valoracion form-first filter remains registered.
          grep -Fq '.nvx-equipo-staff-grid {' "$css"
          grep -Fq "add_filter( 'the_content', 'nvx_valoracion_form_first'" wp-content/themes/nuvanx-medical/inc/nvx-hero-and-forms.php
          git diff --check
          git add "$css"
          if git diff --cached --quiet; then
            echo 'No patch needed.'
            exit 0
          fi
          git config user.name 'NUVANX Ops'
          git config user.email 'ops@nuvanx.invalid'
          git commit -m 'fix(ui): restore equipo staff card grid'
          git push origin HEAD:master
