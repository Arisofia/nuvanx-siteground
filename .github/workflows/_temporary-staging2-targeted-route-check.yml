name: Temporary Staging2 targeted route check

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    if: startsWith(github.head_ref, 'ops/targeted-staging2-routes') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Configure SiteGround SSH
        env:
          SSH_HOST: ${{ secrets.STAGING2_SSH_HOST }}
          SSH_PORT_SECRET: ${{ secrets.STAGING2_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING2_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing STAGING2_SSH_HOST}"
          : "${SSH_USER:?Missing STAGING2_SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Missing STAGING2_SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing STAGING2_SSH_KNOWN_HOSTS}"
          SSH_PORT="${SSH_PORT_SECRET:-18765}"
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/siteground_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/siteground_key" "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host siteground-staging
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/siteground_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 15
          EOF
          chmod 600 "$HOME/.ssh/config"
      - name: Capture fatal shutdown errors on targeted routes
        run: |
          set -euo pipefail
          ssh siteground-staging 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/home/customer/www/staging2.nuvanx.com/public_html
          DEBUG_PLUGIN="$ROOT/wp-content/mu-plugins/nvx-fatal-capture-temp.php"
          cat > "$DEBUG_PLUGIN" <<'PHP'
          <?php
          register_shutdown_function(static function (): void {
              $e = error_get_last();
              if ( $e && in_array( $e['type'], array( E_ERROR, E_PARSE, E_CORE_ERROR, E_COMPILE_ERROR ), true ) ) {
                  file_put_contents('/tmp/nvx-fatal-capture.log', wp_json_encode($e) . "\n", FILE_APPEND);
              }
          });
          PHP
          rm -f /tmp/nvx-fatal-capture.log
          cd "$ROOT"
          for path in /soluciones-medicas/ /medicina-estetica-chamberi/ /clinicas-de-medicina-estetica-nuvanx/medicina-estetica-goya-barrio-salamanca/; do
            echo "### $path"
            curl -ksS -D /tmp/nvx-route-headers -L --max-time 25 --resolve staging2.nuvanx.com:443:127.0.0.1 -o /tmp/nvx-route-body "https://staging2.nuvanx.com${path}"
            grep -Ei '^(HTTP/|content-type:|content-length:|x-proxy-cache:)' /tmp/nvx-route-headers || true
            echo "BYTES=$(wc -c < /tmp/nvx-route-body | tr -d ' ')"
            echo 'FATAL_CAPTURE:'
            cat /tmp/nvx-fatal-capture.log 2>/dev/null || true
            rm -f /tmp/nvx-fatal-capture.log
          done
          rm -f "$DEBUG_PLUGIN"
          REMOTE
